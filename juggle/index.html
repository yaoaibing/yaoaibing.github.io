<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='juggle_best',PLAY='juggle_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 杂耍抛球 · 左右开弓 ================== */
var NAME = '杂耍抛球 · 左右开弓';
var state = 'start';
var score = 0, combo = 0, bestCombo = 0, catches = 0, lives = 3;
var TOP = 96, HY = 400, gap = 90, EDGE = 18, BR = 13, G = 900;
var pairX = 0, targetX = 0, kdir = 0, held = 0;
var due = 0, lastHand = -1, gmul = 1, tsec = 0;
var balls = [], sparks = [], shake = 0, flash = 0, msg = '', msgT = 0;
var hlL = 0, hlR = 0;
var BALL_C = ['#ff6f6f', '#ffd45c', '#5fd7c9', '#8ab6ff', '#ff9ad6', '#b8f36b'];

function cmin() { return gap / 2 + EDGE }
function cmax() { return VW - gap / 2 - EDGE }
/* 整对爪子的中心行程;窄屏兜底,绝不把球逼到接不到的地方 */
function ctr(v) {
  var a = cmin(), b = cmax();
  if (!isFinite(v)) v = VW / 2;
  return a > b ? VW / 2 : clamp(v, a, b);
}
function handX(h) { return pairX + (h === 0 ? -gap / 2 : gap / 2) }
/* 单只爪子够得到的区间,由中心行程反推 */
function handMin(h) { return h === 0 ? EDGE : EDGE + gap }
function handMax(h) { return h === 0 ? VW - EDGE - gap : VW - EDGE }
/* 两只爪子都够得着的公共区:抛球只往这里落,交替规则才永远成立 */
function coreLo() { var a = handMin(0), b = handMin(1); return a > b ? a : b }
function coreHi() { var a = handMax(0), b = handMax(1); return a < b ? a : b }
function coreWide() { return coreHi() - coreLo() }
function mult() { return 1 + Math.min(4, Math.floor(combo / 4)) }
function ballTarget() { return Math.min(6, 2 + Math.floor(catches / 12)) }
function dueName() { return due === 0 ? 'left' : 'right' }

function layout() {
  TOP = Math.max(96, VH * .14);
  HY = VH * .72;
  EDGE = Math.max(16, VW * .05);
  gap = clamp(VW * .22, 90, 150);
  if (gap + EDGE * 2 > VW - 8) gap = Math.max(64, VW - EDGE * 2 - 8);
  BR = clamp(VW * .034, 10, 14);
  pairX = ctr(pairX || VW / 2);
  targetX = pairX;
}
function onResize() { layout(); }

function resetGame() {
  score = 0; combo = 0; bestCombo = 0; catches = 0; lives = 3;
  balls = []; sparks = [];
  gmul = 1; due = 0; lastHand = -1;
  shake = 0; flash = 0; msg = ''; msgT = 0; hlL = 0; hlR = 0;
  layout();
  pairX = ctr(VW / 2); targetX = pairX;
  kdir = 0; held = 0;
  syncHud();
}
function startGame() {
  resetGame();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  spawn();
  msg = '球要落在带箭头的那只手上';
  msgT = 2;
  syncHud();
}
function endGame() {
  state = 'over';
  held = 0; kdir = 0;
  KIT.addPlay(); KIT.streak();
  /* 纪录分按接球与最长连耍算,和场上 combo 加成分开 */
  var final = catches * 10 + bestCombo * 5;
  var rec = KIT.setBest(final);
  var rank = catches >= 60 ? '杂耍大师' : catches >= 30 ? '左右开弓' : catches >= 12 ? '街头卖艺' : '刚学抛球';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '接住 <b>' + catches + ' 个球</b><br>' +
    '本局得分 <b>' + score + '</b><br>最长连耍 ' + bestCombo + ' 下<br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '眼睛盯带箭头的那只手,另一只只管等着';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  noise(.24, .07);
  tone(140, .34, 'sine', .06, 60);
}
function syncHud() {
  $('hscore').textContent = score;
  $('hcombo').textContent = combo;
  $('hlives').textContent = lives;
}

function sparkAt(x, y, bad) {
  var n = bad ? 14 : 9;
  for (var i = 0; i < n; i++) {
    sparks.push({
      x: x, y: y,
      vx: (frnd() - .5) * (bad ? 300 : 210),
      vy: -frnd() * (bad ? 140 : 270),
      l: .55 + frnd() * .2,
      c: bad ? '255,96,84' : '255,214,92'
    });
  }
}
function loseLife(why) {
  lives--;
  shake = .38; flash = .45;
  msg = why; msgT = 1.3;
  noise(.16, .08);
  tone(190, .2, 'square', .05, 80);
  if (lives <= 0) { lives = 0; syncHud(); endGame(); return }
  syncHud();
}
function doSwap() {
  if (state !== 'play') return;
  due = 1 - due;
  combo = 0;
  /* 宽容阀:换手不扣命,只清连击 */
  if (due === 0) hlL = .25; else hlR = .25;
  tone(430, .07, 'sine', .04, 620);
  msg = '换手!这只手接'; msgT = 1;
  syncHud();
}

/* 落到爪线还需几秒:解 0.5*g*t^2 + vy*t + (HY-y) = 0 的正根 */
function landTime(b, g) {
  var dy = HY - b.y;
  var disc = b.vy * b.vy + 2 * g * dy;
  if (!(disc > 0)) return 0;
  var t = (-b.vy + Math.sqrt(disc)) / g;
  return t > 0 ? t : 0;
}
/* 抛球目标点:接球爪的对面一侧,且必须落在两手公共可达区 */
function tossTarget(h) {
  var lo = coreLo(), hi = coreHi();
  if (hi - lo < 24) { lo = EDGE; hi = VW - EDGE }
  var mid = (lo + hi) / 2, span = (hi - lo) / 2;
  var side = h === 0 ? 1 : -1;
  var t = mid + side * span * (.34 + frnd() * .6);
  return clamp(t, lo + 2, hi - 2);
}
/* 落点节拍:任何一次抛球的落点都排在「别的球全部落完之后至少隔 SEP 秒」。
 * 两只球同时卡在接球窗口里时,玩家怎么挪都必破功,所以这个间隔是游戏的公平底线 */
var SEP = .14;
function stageV(g) { return Math.sqrt(2 * g * Math.max(90, HY - TOP - 16)) }
function farLand(b, g) {
  var mx = 0;
  for (var i = 0; i < balls.length; i++) {
    var o = balls[i];
    if (o === b || o.ms) continue;
    var t = landTime(o, g);
    if (t > mx) mx = t;
  }
  return mx;
}
function toss(b, h) {
  var g = G * gmul;
  var tLo = 2 * 640 / g;
  var tHi = Math.min(2 * 800 / g, 2 * stageV(g) / g);
  if (tHi < tLo) tHi = tLo;
  var t = farLand(b, g) + SEP;
  if (t < tLo) t = tLo;
  if (t > tHi) t = tHi;
  var v = .5 * g * t;
  b.x = handX(h);
  b.y = HY;
  b.vy = -v;
  var tf = tossTarget(h);
  /* 由飞行时长反推水平初速,落点正好落在要移过去的那一侧 */
  b.vx = clamp((tf - b.x) / t, -340, 340);
  b.tr.length = 0;
}
function doCatch(h, b) {
  if (state !== 'play') return;
  /* 接球瞬间点亮这只爪子,破功时也看得见是谁接的 */
  if (h === 0) hlL = .25; else hlR = .25;
  if (h === due) {
    catches++;
    score += mult();
    combo++;
    if (combo > bestCombo) bestCombo = combo;
    lastHand = h;
    due = 1 - h;
    sparkAt(b.x, HY, false);
    tone(Math.min(1400, 600 + combo * 22), .07, 'triangle', .04);
  } else {
    catches++;
    lastHand = h;
    due = 1 - h;
    combo = 0;
    sparkAt(b.x, HY, true);
    loseLife('破功!还是' + (h === 0 ? '左手' : '右手') + '连接');
  }
  if (state !== 'play') return;
  toss(b, h);
  syncHud();
}
/* 新球入列:它只能从舞台顶落下,可达落点是一段窄窗口,
 * 窗口里找得到与现有落点都隔够 SEP 的相位才松手,否则下一帧再看 */
function spawn() {
  var g = G * gmul;
  var dy = Math.max(60, HY - (TOP + 6));
  var tFree = Math.sqrt(2 * dy / g);
  var tPush = (Math.sqrt(810000 + 2 * g * dy) - 900) / g;
  var ts = [];
  for (var i = 0; i < balls.length; i++) if (!balls[i].ms) ts.push(landTime(balls[i], g));
  var best = tFree, bestSep = -1;
  for (var k = 0; k <= 14; k++) {
    var t = tPush + (tFree - tPush) * (k / 14);
    var sep = 9;
    for (i = 0; i < ts.length; i++) {
      var d = Math.abs(ts[i] - t);
      if (d < sep) sep = d;
    }
    if (sep >= bestSep) { bestSep = sep; best = t }
    if (sep >= SEP * 2) break;
  }
  if (ts.length && bestSep < SEP) return false;
  var lo = coreLo(), hi = coreHi();
  if (hi - lo < 24) { lo = EDGE; hi = VW - EDGE }
  balls.push({
    x: clamp(lo + frnd() * (hi - lo), EDGE, VW - EDGE),
    y: TOP + 6,
    vx: (frnd() - .5) * 70,
    vy: clamp(dy / best - .5 * g * best, 0, 900),
    c: pick(BALL_C),
    tr: [], ms: 0
  });
  return true;
}
function dropBallAt(x, y, vy) {
  balls.push({
    x: clamp(x, BR, VW - BR), y: y, vx: 0,
    vy: typeof vy === 'number' ? vy : 120,
    c: pick(BALL_C), tr: [], ms: 0
  });
  return balls.length;
}
function forceCatch(side) {
  var h = side === 'right' || side === 1 ? 1 : 0;
  var x = handX(h), b = null, best = 1e9;
  for (var i = 0; i < balls.length; i++) {
    var d = Math.abs(balls[i].x - x);
    if (d < best) { best = d; b = balls[i] }
  }
  if (!b) { dropBallAt(x, HY, 120); b = balls[balls.length - 1] }
  b.x = x; b.y = HY;
  b.vy = Math.abs(b.vy) > 1 ? Math.abs(b.vy) : 120;
  b.ms = 0;
  doCatch(h, b);
  return dueName();
}

function update(dt) {
  var i;
  tsec += dt;
  if (msgT > 0) msgT -= dt;
  if (shake > 0) shake -= dt;
  if (flash > 0) flash -= dt;
  if (hlL > 0) hlL -= dt;
  if (hlR > 0) hlR -= dt;
  for (i = sparks.length - 1; i >= 0; i--) {
    var s = sparks[i];
    s.vy += 520 * dt;
    s.x += s.vx * dt; s.y += s.vy * dt; s.l -= dt;
    if (s.l <= 0) sparks.splice(i, 1);
  }
  if (state !== 'play') return;

  /* 难度爬坡:重力随得分微涨,封顶保证还能追得上 */
  gmul = Math.min(1.26, 1 + score / 1400);
  var g = G * gmul;

  if (kdir) targetX = ctr(targetX + kdir * 470 * dt);
  pairX = ctr(pairX + (targetX - pairX) * Math.min(1, 11 * dt));

  for (i = balls.length - 1; i >= 0; i--) {
    var b = balls[i];
    b.vy += g * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    /* 球不许飞出画面:撞左右墙弹回,轨迹永远可再接 */
    if (b.x < BR) { b.x = BR; b.vx = -b.vx * .86 }
    if (b.x > VW - BR) { b.x = VW - BR; b.vx = -b.vx * .86 }
    if (!LOWEND) {
      b.tr.push(b.x, b.y);
      while (b.tr.length > 14) b.tr.splice(0, 2);
    }
    if (b.ms) {
      if (b.y > VH + 40) balls.splice(i, 1);
      continue;
    }
    if (b.vy > 0 && b.y > HY + 40) {
      b.ms = 1;
      sparkAt(b.x, HY + 44, true);
      loseLife('球漏下去了!');
      if (state !== 'play') return;
      continue;
    }
    if (b.vy > 0 && b.y >= HY - 40) {
      for (var h = 0; h < 2; h++) {
        if (Math.abs(b.x - handX(h)) <= 34) { doCatch(h, b); break }
      }
      if (state !== 'play') return;
    }
  }

  /* 缺球就补:新球的落点相位自己挑,挑不到就下一帧再看 */
  var live = 0;
  for (i = 0; i < balls.length; i++) if (!balls[i].ms) live++;
  if (live < ballTarget()) spawn();
  syncHud();
}

function drawHand(h) {
  var x = handX(h);
  var hi = h === 0 ? hlL : hlR;
  var hs = hi > 0 ? clamp(hi / .25, 0, 1) : 0;
  var isDue = h === due;
  ctx.save();
  ctx.translate(x, HY + 4);
  ctx.scale(1 + hs * .14, 1 + hs * .14);
  ctx.fillStyle = 'rgba(0,0,0,.32)';
  ctx.beginPath();
  ctx.ellipse(0, 24, 24, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  /* 肉球手套:拇指一律朝外,配上不同颜色,左右一眼分得清 */
  ctx.globalAlpha = isDue ? 1 : .66;
  ctx.fillStyle = h === 0 ? '#f6b264' : '#69cfc0';
  ctx.beginPath();
  ctx.moveTo(-20, 14);
  ctx.lineTo(-20, -6);
  ctx.arc(0, -6, 20, Math.PI, 0, false);
  ctx.lineTo(20, 14);
  ctx.quadraticCurveTo(0, 22, -20, 14);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.arc(h === 0 ? -20 : 20, 3, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.fillRect(-20, 12, 40, 5);
  if (hs > 0) {
    ctx.strokeStyle = 'rgba(255,244,190,' + hs + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, -2, 27, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '800 12px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(40,24,12,.6)';
  ctx.fillText(h === 0 ? 'L' : 'R', 0, -4);
  ctx.restore();
  /* 「下一只该接」的标记:交替规则全靠它才学得会 */
  if (isDue) {
    var pu = .55 + .45 * Math.sin(tsec * 5);
    ctx.fillStyle = 'rgba(255,214,92,' + pu + ')';
    ctx.beginPath();
    ctx.moveTo(x, HY - 28);
    ctx.lineTo(x - 9, HY - 42);
    ctx.lineTo(x + 9, HY - 42);
    ctx.closePath();
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 13px "PingFang SC",sans-serif';
    ctx.fillText('接', x, HY - 54);
  }
}

function draw() {
  var i, j;
  var sh = shake > 0 ? (frnd() - .5) * 9 : 0;
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#261a12');
  bg.addColorStop(.55, '#1b1310');
  bg.addColorStop(1, '#110b0b');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, VW, VH);
  /* 暖色顶灯,把视线压到爪线一带 */
  var gy = HY - VH * .1;
  var sp = ctx.createRadialGradient(pairX, gy, 16, pairX, gy, Math.max(130, VH * .62));
  sp.addColorStop(0, 'rgba(255,198,112,.19)');
  sp.addColorStop(1, 'rgba(255,198,112,0)');
  ctx.fillStyle = sp;
  ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(0, 0, VW, TOP);
  ctx.fillStyle = 'rgba(255,214,120,.14)';
  ctx.fillRect(0, TOP - 1, VW, 2);

  ctx.save();
  ctx.translate(sh, sh * .5);
  /* 地板 */
  ctx.fillStyle = 'rgba(60,36,24,.55)';
  ctx.fillRect(0, HY + 30, VW, VH - HY - 30);
  /* 爪线:接球窗口的下沿提示 */
  ctx.strokeStyle = 'rgba(255,224,160,.16)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (var x = 0; x < VW; x += 26) {
    ctx.moveTo(x, HY + 22);
    ctx.lineTo(x + 14, HY + 22);
  }
  ctx.stroke();

  for (i = 0; i < balls.length; i++) {
    var b = balls[i];
    var n = b.tr.length;
    for (j = 0; j < n; j += 2) {
      var f = (j + 2) / (n || 1);
      ctx.fillStyle = 'rgba(255,228,170,' + (f * .2) + ')';
      ctx.beginPath();
      ctx.arc(b.tr[j], b.tr[j + 1], Math.max(1, BR * (.28 + f * .5)), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = b.ms ? .4 : 1;
    ctx.fillStyle = b.c;
    ctx.beginPath();
    ctx.arc(b.x, b.y, BR, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.25)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(b.x, b.y, BR * .72, -.6, 1.3);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath();
    ctx.arc(b.x - BR * .32, b.y - BR * .34, Math.max(1, BR * .28), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  drawHand(0);
  drawHand(1);

  for (i = 0; i < sparks.length; i++) {
    var s2 = sparks[i];
    ctx.fillStyle = 'rgba(' + s2.c + ',' + clamp(s2.l * 1.7, 0, 1) + ')';
    ctx.fillRect(s2.x - 2, s2.y - 2, 4, 4);
  }
  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,64,52,' + clamp(flash / .45, 0, 1) * .26 + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = msgT > 0 ? 'rgba(255,220,120,.95)' : 'rgba(232,206,176,.5)';
  ctx.fillText(msg || '拖动屏幕挪双手 · 球只能落在带箭头那只手上', VW / 2, VH - 96);
}

cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  held = 1;
  targetX = ctr(e.clientX);
});
cv.addEventListener('pointermove', function (e) {
  if (!held || state !== 'play') return;
  targetX = ctr(e.clientX);
});
window.addEventListener('pointerup', function () { held = 0 });
window.addEventListener('pointercancel', function () { held = 0 });
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startGame(); return }
  if (state !== 'play') return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); kdir = -1 }
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); kdir = 1 }
});
window.addEventListener('keyup', function (e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'ArrowUp') kdir = 0;
});

function setPairX(v) { targetX = ctr(v); pairX = targetX }
function movePair(dx) { setPairX(pairX + dx) }
function liveBalls() {
  var n = 0;
  for (var i = 0; i < balls.length; i++) if (!balls[i].ms) n++;
  return n;
}
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', startGame);
$('swapbtn').addEventListener('click', doSwap);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」连耍 ' + bestCombo + ' 下,接住 ' + catches + ' 个球! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  state: function () { return state },
  score: function () { return score },
  combo: function () { return combo },
  bestCombo: function () { return bestCombo },
  catches: function () { return catches },
  lives: function () { return lives },
  ballCount: liveBalls,
  hands: function () {
    return { left: handX(0), right: handX(1), y: HY, due: dueName() };
  },
  stage: function () { return { top: TOP, y: HY, edge: EDGE, gap: gap, br: BR, g: G * gmul, win: 40, hit: 34 } },
  balls: function () {
    var out = [];
    for (var i = 0; i < balls.length; i++) {
      out.push({ x: balls[i].x, y: balls[i].y, vx: balls[i].vx, vy: balls[i].vy, ms: balls[i].ms });
    }
    return out;
  },
  setPairX: setPairX,
  movePair: movePair,
  swap: doSwap,
  dropBallAt: dropBallAt,
  forceCatch: forceCatch,
  mult: mult,
  setLives: function (v) { lives = v; syncHud() },
  setScore: function (v) { score = v; syncHud() },
  step: function (n) { for (var i = 0; i < n; i++) update(1 / 60) },
  forceEnd: endGame
};

resize();
resetGame();
$('padbar').classList.add('hide');
updMini();
run();

})();
</script>

<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';
  var name=(document.title||'游戏').split(/[ ··|]/)[0];


  // 结算页:晒战绩 + 换个游戏
  var over=document.getElementById('over');
  if(over){
    var box=document.createElement('div');
    box.style.cssText='display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px';
    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='juggle'});
  r.unshift({k:'juggle',n:'杂耍抛球 · 左右开弓',e:'🤹'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['juggle_best','juggle_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['juggle']||0)){
            B['juggle']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
