<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='airhockey_best',PLAY='airhockey_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 空气曲棍球 · 桌面冰球 ================== */
var NAME = '空气曲棍球 · 桌面冰球';
var state = 'start';
var RL = 10, RR = 0, RT = 0, RB = 0, GW = 0, CX = 0;
var puck = { x: 0, y: 0, vx: 0, vy: 0, r: 15 };
var me = { x: 0, y: 0, r: 27, tx: 0, ty: 0, px: 0, py: 0 };
var ai = { x: 0, y: 0, r: 27, tx: 0, ty: 0, px: 0, py: 0 };
var myScore = 0, aiScore = 0, serveT = 0, goalMsg = '', goalT = 0, shakeT = 0;
var diffIdx = 1, AI_SPD = [.55, .85, 1.2], AI_AGR = [.55, .75, .95];
var trail = [];

function layout() {
  RL = 10; RR = VW - 10;
  RT = Math.max(88, VH * .1);
  RB = VH - (VW < 360 ? 112 : 66);
  CX = VW / 2;
  GW = Math.min((RR - RL) * .38, 210);
  puck.r = Math.max(10, Math.min(17, VW * .042));
  me.r = puck.r * 1.75; ai.r = me.r;
  if (me.x === 0) { me.x = CX; me.y = RB - 70; ai.x = CX; ai.y = RT + 70; me.tx = me.x; me.ty = me.y; ai.tx = ai.x; ai.ty = ai.y; }
  me.x = clamp(me.x, RL + me.r, RR - me.r); me.y = clamp(me.y, RT + (RB - RT) / 2 + me.r, RB - me.r);
  ai.x = clamp(ai.x, RL + ai.r, RR - ai.r); ai.y = clamp(ai.y, RT + ai.r, RT + (RB - RT) / 2 - ai.r);
  if (puck.x === 0) { puck.x = CX; puck.y = (RT + RB) / 2; }
}
function onResize() { layout(); }

function resetGame() {
  myScore = 0; aiScore = 0; serveT = .8; goalT = 0; goalMsg = ''; shakeT = 0; trail = [];
  me.x = CX; me.y = RB - 70; me.tx = me.x; me.ty = me.y; me.px = me.x; me.py = me.y;
  ai.x = CX; ai.y = RT + 70; ai.tx = ai.x; ai.ty = ai.y; ai.px = ai.x; ai.py = ai.y;
  puck.x = CX; puck.y = (RT + RB) / 2; puck.vx = 0; puck.vy = 0;
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  $('diffbtn').textContent = '🎚 ' + ['简单', '普通', '困难'][diffIdx];
  syncHud();
}
function syncHud() {
  $('hme').textContent = myScore;
  $('hai').textContent = aiScore;
}
function gameOver() {
  state = 'over';
  KIT.addPlay(); KIT.streak();
  var win = myScore > aiScore;
  var score = win ? 1000 + (myScore - aiScore) * 100 + [0, 100, 200][diffIdx] : 0;
  var rec = KIT.setBest(score);
  var rank = win ? '冰面统治者' : '惜败挑战者';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '比分 <b>' + myScore + ':' + aiScore + '</b><br>' +
    '本局得分 ' + score + '<br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '别只顾追球:把球拍停在对方球门正前方,回来的球直接推射';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  tone(win ? 720 : 220, .3, 'sine', .06, win ? 1080 : 140);
}
function scoreGoal(who) {
  if (who === 'me') { myScore++; tone(760, .2, 'triangle', .07, 1000); goalMsg = '破门!+1'; }
  else { aiScore++; tone(200, .2, 'sawtooth', .05, 120); goalMsg = '被进一球'; }
  goalT = 1.2; serveT = 1.4; shakeT = .35;
  puck.vx = 0; puck.vy = 0;
  puck.x = CX;
  puck.y = (RT + RB) / 2 + (who === 'me' ? -30 : 30);
  syncHud();
  if (myScore >= 7 || aiScore >= 7) { gameOver(); }
}
function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function hitPaddle(p, isMe) {
  var dx = puck.x - p.x, dy = puck.y - p.y;
  var d = Math.sqrt(dx * dx + dy * dy) || .01;
  var minD = puck.r + p.r;
  if (d >= minD) return;
  var nx = dx / d, ny = dy / d;
  puck.x = p.x + nx * (minD + .5);
  puck.y = p.y + ny * (minD + .5);
  var pvx = isMe ? (me.x - me.px) * 60 : (ai.x - ai.px) * 60;
  var pvy = isMe ? (me.y - me.py) * 60 : (ai.y - ai.py) * 60;
  var rvx = puck.vx - pvx, rvy = puck.vy - pvy;
  var vn = rvx * nx + rvy * ny;
  if (vn < 0) {
    var imp = -vn * 1.25;
    puck.vx += imp * nx;
    puck.vy += imp * ny;
  }
  puck.vx += nx * 90; puck.vy += ny * 90;
  var sp = Math.sqrt(puck.vx * puck.vx + puck.vy * puck.vy);
  if (sp > 1500) { puck.vx *= 1500 / sp; puck.vy *= 1500 / sp; }
  tone(520, .05, 'square', .015);
}
function inGoalMouth(x) { return Math.abs(x - CX) < GW / 2; }
function physics(dt) {
  var steps = 3, h = dt / steps, i;
  for (i = 0; i < steps; i++) {
    me.px = me.x; me.py = me.y; ai.px = ai.x; ai.py = ai.y;
    var mdx = me.tx - me.x, mdy = me.ty - me.y;
    me.x += mdx * .55; me.y += mdy * .55;
    me.x = clamp(me.x, RL + me.r, RR - me.r);
    me.y = clamp(me.y, RT + (RB - RT) / 2 + me.r, RB - me.r);

    var aiSpd = AI_SPD[diffIdx] * (1 + aiScore * .02);
    var aggr = AI_AGR[diffIdx];
    var aiTargetX, aiTargetY;
    if (puck.y < (RT + RB) / 2 - 20 && puck.vy < 0) {
      aiTargetX = puck.x + puck.vx * .08;
      aiTargetY = Math.max(RT + ai.r + 6, puck.y - ai.r * 1.1);
    } else {
      aiTargetX = CX + (puck.x - CX) * aggr * .7;
      aiTargetY = RT + 62;
    }
    aiTargetX = clamp(aiTargetX, RL + ai.r, RR - ai.r);
    aiTargetY = clamp(aiTargetY, RT + ai.r, RT + (RB - RT) / 2 - ai.r);
    ai.x += clamp(aiTargetX - ai.x, -aiSpd * 9, aiSpd * 9);
    ai.y += clamp(aiTargetY - ai.y, -aiSpd * 9, aiSpd * 9);

    puck.x += puck.vx * h;
    puck.y += puck.vy * h;
    puck.vx *= .9985; puck.vy *= .9985;
    if (Math.abs(puck.vx) < 4) puck.vx = 0;
    if (Math.abs(puck.vy) < 4) puck.vy = 0;

    if (puck.x - puck.r < RL) { puck.x = RL + puck.r; puck.vx = Math.abs(puck.vx) * .92; }
    if (puck.x + puck.r > RR) { puck.x = RR - puck.r; puck.vx = -Math.abs(puck.vx) * .92; }
    if (puck.y - puck.r < RT) {
      if (inGoalMouth(puck.x)) { scoreGoal('me'); return; }
      puck.y = RT + puck.r; puck.vy = Math.abs(puck.vy) * .92;
    }
    if (puck.y + puck.r > RB) {
      if (inGoalMouth(puck.x)) { scoreGoal('ai'); return; }
      puck.y = RB - puck.r; puck.vy = -Math.abs(puck.vy) * .92;
    }
    hitPaddle(me, true);
    hitPaddle(ai, false);
  }
}
function update(dt) {
  if (goalT > 0) goalT -= dt;
  if (shakeT > 0) shakeT -= dt;
  if (state !== 'play') return;
  if (serveT > 0) { serveT -= dt; return; }
  physics(dt);
  trail.push({ x: puck.x, y: puck.y, t: .18 });
  for (var i = trail.length - 1; i >= 0; i--) { trail[i].t -= dt; if (trail[i].t <= 0) trail.splice(i, 1); }
  if (!isFinite(puck.x) || !isFinite(puck.y)) { puck.x = CX; puck.y = (RT + RB) / 2; puck.vx = 0; puck.vy = 0; }
}
function rr(x, y, w, h, r) {
  var k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#0b1a24');
  bg.addColorStop(1, '#06101a');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);

  var g = ctx.createLinearGradient(RL, RT, RR, RB);
  g.addColorStop(0, '#123044');
  g.addColorStop(1, '#0b2030');
  ctx.fillStyle = g;
  rr(RL, RT, RR - RL, RB - RT, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(140,210,255,.35)'; ctx.lineWidth = 3;
  rr(RL, RT, RR - RL, RB - RT, 18); ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(RL + 6, (RT + RB) / 2); ctx.lineTo(RR - 6, (RT + RB) / 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(CX, (RT + RB) / 2, Math.min(60, VW * .14), 0, 6.2832); ctx.stroke();
  ctx.beginPath(); ctx.arc(CX, (RT + RB) / 2, 6, 0, 6.2832); ctx.stroke();

  ctx.fillStyle = 'rgba(120,230,170,.28)';
  ctx.fillRect(CX - GW / 2, RT - 6, GW, 10);
  ctx.fillStyle = 'rgba(255,120,120,.28)';
  ctx.fillRect(CX - GW / 2, RB - 4, GW, 10);
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.font = '700 11px "PingFang SC",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('你进攻 ↑', CX, RT + 16);
  ctx.fillText('↓ 防守', CX, RB - 16);

  for (var i = 0; i < trail.length; i++) {
    ctx.globalAlpha = trail[i].t / .18 * .4;
    ctx.fillStyle = '#9fe8ff';
    ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, puck.r * .7, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function mallet(p, color, isTop) {
    ctx.save();
    ctx.shadowColor = color; ctx.shadowBlur = 14;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * .55, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * .55, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y + p.r * .9, p.r * .8, p.r * .18, 0, 0, 6.2832); ctx.fill();
  }
  mallet(ai, '#ff8a8a', true);
  mallet(me, '#7ee0a2', false);

  ctx.save();
  ctx.shadowColor = 'rgba(255,255,255,.6)'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#eef7ff';
  ctx.beginPath(); ctx.arc(puck.x, puck.y, puck.r, 0, 6.2832); ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(30,60,90,.35)';
  ctx.beginPath(); ctx.arc(puck.x, puck.y, puck.r * .5, 0, 6.2832); ctx.fill();

  if (serveT > 0 && state === 'play') {
    ctx.fillStyle = 'rgba(255,255,255,.65)';
    ctx.font = '700 14px "PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('准备…', CX, (RT + RB) / 2 - 30);
  }
  if (goalT > 0) {
    ctx.globalAlpha = clamp(goalT / 1.2, 0, 1);
    ctx.fillStyle = goalMsg === '破门!+1' ? '#ffd45c' : 'rgba(255,130,130,.95)';
    ctx.font = '900 30px "PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(goalMsg, CX, (RT + RB) / 2 - 64);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.font = '600 12px "PingFang SC",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('拖动手拍击球 · 先到 7 分获胜', CX, RB + 26);
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  me.tx = e.clientX; me.ty = e.clientY;
});
cv.addEventListener('pointermove', function (e) {
  if (state !== 'play') return;
  if (e.buttons || e.pointerType === 'touch') { me.tx = e.clientX; me.ty = e.clientY; }
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === 'r' || e.key === 'R') resetGame();
});
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', resetGame);
$('againbtn').addEventListener('click', resetGame);
$('newbtn').addEventListener('click', resetGame);
$('diffbtn').addEventListener('click', function () {
  diffIdx = (diffIdx + 1) % 3;
  this.textContent = '🎚 ' + ['简单', '普通', '困难'][diffIdx];
  resetGame();
});
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」' + myScore + ':' + aiScore + ' 打完一局! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });
window.__T = {
  puck: function () { return { x: puck.x, y: puck.y, vx: puck.vx, vy: puck.vy }; },
  me: function () { return { x: me.x, y: me.y }; },
  ai: function () { return { x: ai.x, y: ai.y }; },
  setPuck: function (x, y, vx, vy) { serveT = 0; puck.x = x; puck.y = y; puck.vx = vx; puck.vy = vy; },
  moveMe: function (x, y) { me.tx = x; me.ty = y; me.x = x; me.y = y; },
  step: function (n) { for (var i = 0; i < n; i++) { if (state !== 'play') break; serveT = 0; physics(1 / 60); } },
  score: function () { return { me: myScore, ai: aiScore }; },
  diff: function (i) { diffIdx = i; },
  state: function () { return state; }
};
resize();
updMini();
syncHud();
run();

})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='airhockey'});
  r.unshift({k:'airhockey',n:'空气曲棍球 · 桌面冰球',e:'🏒'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['airhockey_best','airhockey_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['airhockey']||0)){
            B['airhockey']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
