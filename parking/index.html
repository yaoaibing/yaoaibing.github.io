<script>
(function(){
'use strict';

/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='park_best',PLAY='park_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

var COLORS=['#4a90d9','#f0b03c','#5fbf8a','#a877d9','#e58fb0','#48c4c4','#d98c4a','#8fae4a','#9aa6bd','#7a8ce0','#d9d24a','#c48bd9'];
var G={state:'start',lv:0,goal:0,cars:[],steps:0,hist:[],sel:-1,drag:null,win:null,parts:[],shake:0};
var S=60,GX=0,GY=0;                 // 格子边长 / 棋盘原点

/* --- 关卡解析 --- */
function parseLevel(i){
  var raw=LV[i].split('|');
  var goal=+raw[0];
  var list=raw[1].split(';');
  var cars=[];
  for(var k=0;k<list.length;k++){
    var a=list[k].split(',');
    cars.push({r:+a[0],c:+a[1],len:+a[2],d:+a[3],
      x:+a[1],y:+a[0],           // 浮点格坐标(拖动时跟着手指走)
      col:k===0?'#e8402f':COLORS[(k-1)%COLORS.length],
      over:0,bounce:0});
  }
  return {goal:goal,cars:cars};
}
function levelStars(i){return +LV[i].split('|')[0]}

/* --- 布局 --- */
function onResize(){
  var top=70+ (window.innerHeight>700?14:0);
  var availW=VW-18;
  var availH=VH-top-96;
  S=Math.floor(Math.min(availW/6,availH/6));
  S=clamp(S,44,88);
  var bw=S*6;
  GX=Math.round((VW-bw)/2);
  GY=Math.round(top+Math.max(0,(availH-bw)/2));
  if(GY+bw+70>VH)GY=Math.max(top,VH-bw-70);
}
function px(c){return GX+c*S}
function py(r){return GY+r*S}

/* --- 占用网格 --- */
function gridOf(cars,skip){
  var g=[],i;
  for(i=0;i<36;i++)g.push(-1);
  for(i=0;i<cars.length;i++){
    if(i===skip)continue;
    var c=cars[i],cc=Math.round(c.x),rr=Math.round(c.y);
    for(var k=0;k<c.len;k++){
      var x=c.d===0?cc+k:cc,y=c.d===1?rr+k:rr;
      if(x>=0&&x<6&&y>=0&&y<6)g[y*6+x]=i;
    }
  }
  return g;
}
/* 某辆车沿自身方向的可动范围(闭区间,单位:格) */
function rangeOf(idx){
  var c=G.cars[idx],g=gridOf(G.cars,idx);
  var lo=c.d===0?c.c:c.r,hi=lo;
  if(c.d===0){
    while(lo-1>=0&&g[c.r*6+lo-1]===-1)lo--;
    while(hi+c.len<6&&g[c.r*6+hi+c.len]===-1)hi++;
  }else{
    while(lo-1>=0&&g[(lo-1)*6+c.c]===-1)lo--;
    while(hi+c.len<6&&g[(hi+c.len)*6+c.c]===-1)hi++;
  }
  return [lo,hi];
}
function isWin(cars){
  var r=cars[0];
  if(r.d!==0)return false;
  var cc=Math.round(r.x);
  return cc===4;
}

/* --- 一局流程 --- */
function loadLevel(i){
  var L=parseLevel(i);
  G.lv=i;G.goal=L.goal;G.cars=L.cars;G.steps=0;G.hist=[];G.sel=-1;
  G.drag=null;G.win=null;G.parts=[];G.state='play';
  $('hlevel').textContent=i+1;
  $('hstep').textContent=0;
  $('hgoal').textContent=L.goal;
  $('over').classList.add('hide');
  $('lvl').classList.add('hide');
  $('start').classList.add('hide');
  run();
}
function startGame(){
  var p=+lsGet('park_lvl','0');
  loadLevel(clamp(p,0,LV.length-1));
  KIT.addPlay();KIT.streak();
}
function doMove(idx,to){
  var c=G.cars[idx];
  var from=c.d===0?c.c:c.r;
  if(from===to)return false;
  G.hist.push({i:idx,from:from});
  if(c.d===0)c.c=to;else c.r=to;
  c.x=c.c;c.y=c.r;
  G.steps++;
  $('hstep').textContent=G.steps;
  tone(300+frnd()*60,.05,'square',.035,180);
  noise(.03,.02);
  G.sel=-1;
  if(isWin(G.cars))winNow();
  return true;
}
function undo(){
  if(!G.hist.length||G.state!=='play')return;
  var h=G.hist.pop(),c=G.cars[h.i];
  if(c.d===0)c.c=h.from;else c.r=h.from;
  c.x=c.c;c.y=c.r;
  G.steps=Math.max(0,G.steps-1);
  $('hstep').textContent=G.steps;
  G.sel=-1;
  tone(220,.06,'sine',.04,160);
}
function resetLevel(){
  if(G.state==='start')return;
  var i=G.lv;
  loadLevel(i);
  tone(300,.07,'triangle',.045,420);
}
function winNow(){
  G.state='win';
  G.win={t:0,cx:G.cars[0].x};
  var best=+lsGet('park_lvl','0');
  if(G.lv+1>best)lsSet('park_lvl',String(Math.min(G.lv+1,LV.length-1)));
  var done=lsGet('park_done','');
  var arr=done?done.split(','):[];
  if(arr.indexOf(String(G.lv))<0){arr.push(String(G.lv));lsSet('park_done',arr.join(','))}
  tone(660,.1,'sine',.06);setTimeout(function(){tone(880,.1,'sine',.06)},100);
  setTimeout(function(){tone(1046,.16,'sine',.06)},200);
  noise(.25,.05);
}
function showOver(){
  G.state='over';
  var perfect=G.steps<=G.goal;
  $('overtitle').textContent=(G.lv>=LV.length-1)?'全部通关':'过 关';
  $('onewrec').style.display=perfect?'block':'none';
  $('onewrec').textContent=perfect?'🏆 完美通关!(等于参考步数)':'🏆 新纪录!';
  $('ostats').innerHTML=
    '本关用 <b>'+G.steps+'</b> 步<br>'+
    '参考最少 <b>'+G.goal+'</b> 步<br>'+
    '已通关 <b>'+doneCount()+' / '+LV.length+'</b> 关';
  $('againbtn').textContent=(G.lv>=LV.length-1)?'再 玩 一 次':'下 一 关';
  $('mini2').innerHTML='已玩 <b>'+KIT.plays()+'</b> 局 · 连续打卡 <b>'+KIT.streakNow()+'</b> 天 🔥';
  $('over').classList.remove('hide');
}
function doneCount(){
  var s=lsGet('park_done','');
  if(!s)return 0;
  var a=s.split(','),n=0;
  for(var i=0;i<a.length;i++)if(a[i]!=='')n++;
  return n;
}

/* --- 输入:拖动 / 点选 --- */
function hitCar(px0,py0){
  for(var i=G.cars.length-1;i>=0;i--){
    var c=G.cars[i];
    var x=px(c.x),y=py(c.y);
    var w=c.d===0?c.len*S:S,h=c.d===0?S:c.len*S;
    if(px0>=x-4&&px0<=x+w+4&&py0>=y-4&&py0<=y+h+4)return i;
  }
  return -1;
}
function onDown(e){
  if(G.state!=='play')return;
  var x=e.clientX,y=e.clientY;
  var i=hitCar(x,y);
  if(i<0){
    // 点了空格:若已选中车,尝试移过去
    if(G.sel>=0){
      var c=G.cars[G.sel],rg=rangeOf(G.sel);
      var cc=Math.floor((x-GX)/S),rr=Math.floor((y-GY)/S);
      if(cc>=0&&cc<6&&rr>=0&&rr<6){
        if(c.d===0&&rr===c.r&&cc>=rg[0]&&cc<=rg[1])doMove(G.sel,cc);
        else if(c.d===1&&cc===c.c&&rr>=rg[0]&&rr<=rg[1])doMove(G.sel,rr);
      }
      G.sel=-1;
    }
    return;
  }
  var car=G.cars[i],rg=rangeOf(i);
  G.drag={i:i,sx:x,sy:y,pos:car.d===0?car.c:car.r,lo:rg[0],hi:rg[1],moved:0,axis:car.d};
  G.sel=i;
  tone(420,.03,'square',.03);
}
function onMove(e){
  if(!G.drag||G.state!=='play')return;
  var d=G.drag,c=G.cars[d.i];
  var dx=e.clientX-d.sx,dy=e.clientY-d.sy;
  var delta=d.axis===0?dx:dy;
  var np=d.pos+delta/S;
  d.moved=Math.max(d.moved,Math.abs(delta));
  if(np<d.lo){c.over=Math.max(-10,(np-d.lo)*S*0.35);np=d.lo;c.bounce=.16}
  else if(np>d.hi){c.over=Math.min(10,(np-d.hi)*S*0.35);np=d.hi;c.bounce=.16}
  else c.over=0;
  if(d.axis===0)c.x=np;else c.y=np;
  c.snapped=false;
}
function onUp(e){
  if(!G.drag)return;
  var d=G.drag,c=G.cars[d.i];
  var was=d.pos;
  var np=d.axis===0?c.x:c.y;
  var to=Math.round(clamp(np,d.lo,d.hi));
  c.over=0;
  if(d.axis===0){c.x=to;c.c=to}else{c.y=to;c.r=to}
  G.drag=null;
  if(to!==was){
    // 松手吸附 = 一步
    G.hist.push({i:d.i,from:was});
    G.steps++;
    $('hstep').textContent=G.steps;
    tone(480,.05,'square',.04,620);
    noise(.04,.02);
    G.sel=-1;
    if(isWin(G.cars))winNow();
  }else if(d.moved<8){
    G.sel=d.i;                    // 只点了一下 → 选中
    c.bounce=.1;
    tone(520,.04,'sine',.035);
  }else{
    G.sel=-1;
  }
}
cv.addEventListener('pointerdown',function(e){
  if(e.preventDefault)e.preventDefault();
  onDown(e);
},{passive:false});
cv.addEventListener('pointermove',function(e){
  if(!G.drag)return;
  if(e.preventDefault)e.preventDefault();
  onMove(e);
},{passive:false});
cv.addEventListener('pointerup',function(e){onUp(e)});
cv.addEventListener('pointercancel',function(e){onUp(e)});
window.addEventListener('keydown',function(e){
  if(e.key==='z'||e.key==='Z'){undo();return}
  if(e.key==='r'||e.key==='R'){resetLevel();return}
  if(G.state!=='play'){if(e.key===' '||e.key==='Enter')startGame();return}
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  if(G.sel<0)return;
  var rg=rangeOf(G.sel);
  var c=G.cars[G.sel];
  var cur=c.d===0?c.c:c.r;
  var t=cur+(e.key==='ArrowRight'?1:-1);
  if(t>=rg[0]&&t<=rg[1])doMove(G.sel,t);
  e.preventDefault();
});

/* --- 更新 --- */
function update(dt){
  if(G.shake>0)G.shake-=dt;
  for(var i=0;i<G.cars.length;i++){
    var c=G.cars[i];
    if(c.bounce>0){c.bounce-=dt;}
    if(!G.drag||G.drag.i!==i){c.over*=Math.max(0,1-dt*10);}
  }
  if(G.state==='win'&&G.win){
    G.win.t+=dt;
    G.cars[0].x+=dt*9;
    if(G.win.t>1.05&&!G.win.shown){G.win.shown=true;showOver();}
  }
  for(var p=G.parts.length-1;p>=0;p--){
    var q=G.parts[p];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=460*dt;q.vx*=0.99;
    if(q.life<=0)G.parts.splice(p,1);
  }
  if(G.state==='win'&&G.win&&G.win.t<0.8&&frnd()<0.35){
    var cx=px(4),cy=py(2)+S/2;
    for(var k=0;k<3;k++)G.parts.push({x:cx+frnd()*40,y:cy+(frnd()-.5)*S,vx:(frnd()-.2)*260,
      vy:-180-frnd()*200,life:.7+frnd()*.5,col:pick(['#ffd45c','#ff9d4a','#ff6a6a','#8affc8','#8ad8ff']),s:2+frnd()*3});
  }
}

/* --- 绘制 --- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawCar(c,sel){
  var isRed=c===G.cars[0];
  var x=px(c.x),y=py(c.y);
  var w=c.d===0?c.len*S:S,h=c.d===0?S:c.len*S;
  var cx=x+w/2,cy=y+h/2;
  ctx.save();
  ctx.translate(cx,cy);
  if(c.d===1)ctx.rotate(Math.PI/2);
  if(c.over)ctx.translate(isRed?c.over:c.over,0);
  var L=(c.d===0?c.len*S:c.len*S),Hh=S;
  var bw=L-6,bh=Hh-8;
  // 影子
  ctx.fillStyle='rgba(0,0,0,.32)';
  rr(-bw/2+1,-bh/2+3,bw,bh,7);ctx.fill();
  // 车身
  var g=ctx.createLinearGradient(0,-bh/2,0,bh/2);
  if(isRed){g.addColorStop(0,'#ff6b57');g.addColorStop(.5,'#e8402f');g.addColorStop(1,'#b32414')}
  else{g.addColorStop(0,'#ffffff');g.addColorStop(.18,c.col);g.addColorStop(1,'#00000055')}
  ctx.fillStyle=g;
  rr(-bw/2,-bh/2,bw,bh,7);ctx.fill();
  // 高光
  ctx.fillStyle='rgba(255,255,255,.22)';
  rr(-bw/2+3,-bh/2+2,bw-6,bh*0.32,5);ctx.fill();
  // 车窗
  ctx.fillStyle='rgba(18,28,42,.72)';
  var winW=bw*0.34;
  rr(-winW*0.55,-bh/2+3,winW,bh-6,4);ctx.fill();
  if(bw>70){rr(winW*0.42,-bh/2+3,winW*0.72,bh-6,4);ctx.fill();}
  // 车灯
  ctx.fillStyle=isRed?'#ffe9a8':'#ffe9a8';
  ctx.beginPath();ctx.arc(bw/2-4,-bh/2+5,2.6,0,6.2832);ctx.fill();
  ctx.beginPath();ctx.arc(bw/2-4,bh/2-5,2.6,0,6.2832);ctx.fill();
  ctx.fillStyle='#ff6a5a';
  ctx.beginPath();ctx.arc(-bw/2+4,-bh/2+5,2.2,0,6.2832);ctx.fill();
  ctx.beginPath();ctx.arc(-bw/2+4,bh/2-5,2.2,0,6.2832);ctx.fill();
  // 选中描边
  if(sel){
    ctx.strokeStyle='#ffd45c';ctx.lineWidth=3;
    ctx.shadowColor='rgba(255,212,92,.85)';ctx.shadowBlur=12;
    rr(-bw/2,-bh/2,bw,bh,7);ctx.stroke();
    ctx.shadowBlur=0;
  }else if(isRed){
    ctx.strokeStyle='rgba(255,220,190,.85)';ctx.lineWidth=2;
    rr(-bw/2,-bh/2,bw,bh,7);ctx.stroke();
  }
  ctx.restore();
}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#3a2b33');g.addColorStop(.55,'#2a2028');g.addColorStop(1,'#1c1519');
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);

  var bw=S*6;
  // 场地底板
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.28)';
  rr(GX-8,GY-8,bw+16,bw+16,18);ctx.fill();
  ctx.fillStyle='#3b2f37';
  rr(GX-4,GY-4,bw+8,bw+8,14);ctx.fill();
  // 沥青
  var ag=ctx.createLinearGradient(GX,GY,GX,GY+bw);
  ag.addColorStop(0,'#4a3b44');ag.addColorStop(1,'#3a2e36');
  ctx.fillStyle=ag;
  rr(GX,GY,bw,bw,10);ctx.fill();

  // 车位线
  ctx.strokeStyle='rgba(255,255,255,.10)';ctx.lineWidth=1.2;
  for(var i=1;i<6;i++){
    ctx.beginPath();ctx.moveTo(GX+i*S,GY+2);ctx.lineTo(GX+i*S,GY+bw-2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(GX+2,GY+i*S);ctx.lineTo(GX+bw-2,GY+i*S);ctx.stroke();
  }
  // 出口(第 3 行右侧开口 + 箭头)
  var ey=GY+2*S;
  ctx.fillStyle='#1c1519';
  ctx.fillRect(GX+bw-3,ey+4,6,S-8);
  // 出口地面高亮
  var eg=ctx.createLinearGradient(GX+bw-30,0,GX+bw,0);
  eg.addColorStop(0,'rgba(255,212,92,0)');eg.addColorStop(1,'rgba(255,212,92,.18)');
  ctx.fillStyle=eg;ctx.fillRect(GX+bw-34,ey+4,34,S-8);
  ctx.fillStyle='rgba(255,212,92,.85)';
  ctx.font='900 '+(S*0.34)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('▶',GX+bw+S*0.32,ey+S/2);

  // 选中车的可达范围
  if(G.sel>=0&&G.state==='play'){
    var sc=G.cars[G.sel],rg=rangeOf(G.sel);
    ctx.save();
    ctx.setLineDash([5,5]);
    ctx.strokeStyle='rgba(255,212,92,.55)';ctx.lineWidth=2;
    for(var t=rg[0];t<=rg[1];t++){
      if(t===rg[0]&&t===rg[1])continue;
      var rx=sc.d===0?px(t):px(sc.c);
      var ry=sc.d===0?py(sc.r):py(t);
      var rw=sc.d===0?sc.len*S:S,rh=sc.d===0?S:sc.len*S;
      rr(rx+4,ry+4,rw-8,rh-8,8);ctx.stroke();
    }
    ctx.setLineDash([]);
    // 方向箭头
    ctx.fillStyle='rgba(255,212,92,.8)';
    ctx.font='900 '+(S*0.4)+'px system-ui';
    var cyy=py(sc.r)+S/2;
    if(sc.d===0){
      if(rg[0]<sc.c)ctx.fillText('◀',px(rg[0])+S*0.3,cyy);
      if(rg[1]>sc.c)ctx.fillText('▶',px(rg[1]+sc.len)-S*0.3,cyy);
    }else{
      if(rg[0]<sc.r)ctx.fillText('▲',px(sc.c)+S/2,py(rg[0])+S*0.35);
      if(rg[1]>sc.r)ctx.fillText('▼',px(sc.c)+S/2,py(rg[1]+sc.len)-S*0.35);
    }
    ctx.restore();
  }

  // 车辆(红车最后画,永远在最上层)
  for(var k=1;k<G.cars.length;k++)drawCar(G.cars[k],G.sel===k);
  drawCar(G.cars[0],G.sel===0);

  // 粒子
  for(var p=0;p<G.parts.length;p++){
    var q=G.parts[p];
    ctx.globalAlpha=clamp(q.life*1.8,0,1);
    ctx.fillStyle=q.col;ctx.fillRect(q.x,q.y,q.s,q.s);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // 底部提示
  if(G.state==='play'&&G.steps===0){
    ctx.globalAlpha=0.5+0.3*Math.sin(Date.now()/420);
    ctx.fillStyle='#ffd9a8';
    ctx.font='600 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('按住红车往右拖,或先点车再点空格',VW/2,GY+S*6+30);
    ctx.globalAlpha=1;
  }
  if(G.state==='start'){
    ctx.fillStyle='rgba(42,32,40,.82)';ctx.fillRect(0,0,VW,VH);
  }
}

/* --- 关卡面板 --- */
function openLvl(){
  var box=$('lgrid');
  var html='';
  var unlocked=+lsGet('park_lvl','0');
  var done=lsGet('park_done','').split(',');
  for(var i=0;i<LV.length;i++){
    var cls='';
    if(done.indexOf(String(i))>=0)cls='done';
    else if(i>unlocked)cls='lock';
    if(i===G.lv)cls+=' cur';
    html+='<button class="'+cls+'" data-i="'+i+'" type="button">'+(i+1)+'</button>';
  }
  box.innerHTML=html;
  $('lvl').classList.remove('hide');
}
$('lgrid').addEventListener('click',function(e){
  var t=e.target;
  if(!t||t.tagName!=='BUTTON')return;
  var i=+t.getAttribute('data-i');
  var unlocked=+lsGet('park_lvl','0');
  if(i>unlocked){tone(180,.08,'square',.04,120);return}
  loadLevel(i);
});
$('lvlclose').addEventListener('click',function(){$('lvl').classList.add('hide')});
$('btnundo').addEventListener('click',undo);
$('btnreset').addEventListener('click',resetLevel);
$('btnlvl').addEventListener('click',openLvl);

$('startbtn').addEventListener('click',startGame);
$('againbtn').addEventListener('click',function(){
  if(G.lv>=LV.length-1)loadLevel(0);else loadLevel(G.lv+1);
});
$('hubbtn').addEventListener('click',function(){location.href='/'});
$('sharebtn').addEventListener('click',function(){
  share('我在「停车场华容道」第 '+(G.lv+1)+' 关只用 '+G.steps+' 步就把红车开出去了(参考 '+G.goal+' 步),已通 '+doneCount()+' 关!你能更快吗? https://yaoaibing.github.io/parking/');
});

/* --- 启动 --- */
$('mini').innerHTML='已通 <b>'+doneCount()+'</b> 关 · 已玩 <b>'+KIT.plays()+'</b> 局'+
  (KIT.streakNow()>1?' · 连续打卡 <b>'+KIT.streakNow()+'</b> 天 🔥':'');

resize();
var first=clamp(+lsGet('park_lvl','0'),0,LV.length-1);
var L0=parseLevel(first);
G.lv=first;G.goal=L0.goal;G.cars=L0.cars;G.state='start';
$('hlevel').textContent=first+1;
$('hgoal').textContent=L0.goal;
draw();
})();
</script>

<!-- __hub_enhance__ -->
<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';
  var name=(document.title||'游戏').split(/[ ··|]/)[0];

  // 回大厅
  var hb=document.createElement('button');
  hb.setAttribute('type','button');hb.textContent='\uD83C\uDFE0';
  hb.style.cssText='position:fixed;top:'+SAFE+';left:10px;z-index:99;border:0;width:36px;height:36px;'+
    'border-radius:12px;font-size:15px;background:rgba(255,255,255,.14);color:#fff;'+
    'border:1px solid rgba(255,255,255,.2);;cursor:pointer';
  hb.onclick=function(){location.href='/'};
  document.body.appendChild(hb);

  // 结算页:晒战绩 + 换个游戏
  var over=document.getElementById('over');
  if(over){
    var box=document.createElement('div');
    box.style.cssText='display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px';
    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>


<!-- __hub_recent__ -->
<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='parking'});
  r.unshift({k:'parking',n:'停车场华容道',e:'🚗'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:定期把本游戏自己的最高分同步进共享的 __best
     (不用劫持 localStorage.setItem —— 那在部分环境下属性不可写会静默失败) */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['park_best','park_hi','park_max','park_score'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['parking']||0)){
            B['parking']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
