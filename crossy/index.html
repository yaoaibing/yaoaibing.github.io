<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='crossy_best',PLAY='crossy_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}
/* ================== GAME · 过马路 · 小鸡快跑 ================== */
/* 游戏代码只写在下面这一行之后;上面 CORE 段一行都不要动 */

/* ▼▼▼ 过马路游戏代码 ▼▼▼ */
var NAME='过马路 · 小鸡快跑';
var COLS=9,CELL=56;
var state='start';
var rows={},cam=0,score=0,time=0;
var P={wr:0,col:4,px:0,hop:null,driftV:0,alive:true,idleT:0,deathT:0,deathType:''};
var CARC=['#e05a5a','#e0a83a','#3a9ae0','#8a6ae0','#3ac88a','#e05ab8'];
var warnT=0,feathers=[];
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function screenY(wr){return VH*0.62-(wr-cam)*CELL}
function trackLen(){return COLS*CELL+CELL*4}
function genRow(wr){
  var d=Math.min(1,wr/90),r=Math.random(),row={wr:wr};
  if(wr<=4){row.type='grass';row.trees={};rows[wr]=row;return}
  if(r<0.30-d*0.06){
    row.type='grass';row.trees={};
    var n=rnd(3),tries=0;
    while(n>0&&tries<12){var c=rnd(COLS);
      if(!row.trees[c]&&Object.keys(row.trees).length<COLS-5){row.trees[c]=1;n--}
      tries++}
  }else if(r<0.62-d*0.02){
    row.type='water';
    row.dir=rnd(2)*2-1;
    row.speed=(45+rnd(60))*(1+d*.8);
    row.logs=[];var T=trackLen(),n=2+rnd(2);
    for(var i=0;i<n;i++)row.logs.push({x:i*(T/n)+rnd(140),len:CELL*(1.8+rnd(3)*.6)});
  }else{
    row.type='road';
    row.dir=rnd(2)*2-1;
    row.speed=(70+rnd(100))*(1+d*1.1);
    row.cars=[];var T2=trackLen(),n2=2+rnd(2);
    for(var j=0;j<n2;j++)row.cars.push({x:j*(T2/n2)+rnd(120),len:CELL*(1.5+rnd(8)/10),c:pick(CARC)});
  }
  rows[wr]=row;
}
function ensureRows(){
  var top=Math.ceil(cam+VH/CELL+2),bot=Math.floor(cam-3);
  for(var w=Math.max(0,bot);w<=top;w++)if(!rows[w])genRow(w);
  for(var k in rows)if(rows[k].wr<bot)delete rows[k];
}
function reset(){
  rows={};cam=0;score=0;warnT=0;feathers=[];
  P={wr:0,col:4,px:0,hop:null,driftV:0,alive:true,idleT:0,deathT:0,deathType:''};
  P.px=P.col*CELL+CELL/2;
  ensureRows();setHud();
}
function startGame(){
  reset();state='play';
  $('start').classList.add('hide');$('over').classList.add('hide');
  tone(520,.08,'triangle',.05);setTimeout(function(){tone(784,.1,'triangle',.05)},90);
}
function onResize(){
  CELL=clamp(Math.min(VW/COLS,72),40,72);
  P.px=P.col*CELL+CELL/2;
}
function setHud(){$('hsc').textContent=score;$('hbest').textContent=Math.max(score,KIT.best())}
function hop(dir){
  if(state!=='play'||!P.alive||P.hop)return;
  var fc=P.col,fw=P.wr,tc=fc,tw=fw;
  if(dir==='up')tw=fw+1;
  else if(dir==='down'&&fw>0)tw=fw-1;
  else if(dir==='left'&&fc>0)tc=fc-1;
  else if(dir==='right'&&fc<COLS-1)tc=fc+1;
  else return;
  var tr=rows[tw];
  if(tr&&tr.type==='grass'&&tr.trees[tc]){tone(200,.08,'square',.04);return}
  P.idleT=0;P.driftV=0;
  P.hop={fc:fc,fw:fw,tc:tc,tw:tw,t:0,fx:P.px};
  P.col=tc;P.wr=tw;
  tone(560+(dir==='up'?120:0),.06,'triangle',.045);
  if(tw>score&&dir==='up'){score=tw;setHud();
    if(score%10===0)tone(784,.12,'triangle',.06)}
}
function landCheck(){
  var tr=rows[P.wr];
  if(!tr)return;
  P.px=clamp(P.px,CELL*.3,COLS*CELL-CELL*.3);
  if(tr.type==='water'){
    var on=null;
    for(var i=0;i<tr.logs.length;i++){var L=tr.logs[i];
      if(P.px>=L.x-4&&P.px<=L.x+L.len+4){on=L;break}}
    if(!on){die('splash');return}
    P.driftV=tr.dir*tr.speed;
  }else{
    P.driftV=0;
    if(tr.type==='road')carCheck(tr);
  }
}
function carCheck(tr){
  for(var i=0;i<tr.cars.length;i++){var c=tr.cars[i];
    if(P.px>c.x-CELL*.3&&P.px<c.x+c.len+CELL*.3){die('car');return}}
}
function die(type){
  if(!P.alive)return;
  P.alive=false;P.deathType=type;P.deathT=0;
  tone(180,.3,'sawtooth',.06);
  for(var i=0;i<10;i++)feathers.push({
    x:P.px,y:screenY(P.wr)+CELL/2,
    vx:(Math.random()-.5)*220,vy:-Math.random()*200-40,t:0,s:8+rnd(8)});
}
function gameOver(){
  state='over';KIT.addPlay();KIT.streak();
  var rec=KIT.setBest(score);
  var DT={car:['🚗 被车创飞了','下次看准车流再冲'],splash:['💦 扑通落水','木头才是正经路'],sink:['🌊 漂出边界','别跟着木头走远啦'],push:['⏫ 被镜头挤走','落后就要挨打'],eagle:['🦅 被老鹰叼走','站太久可不行']};
  var d=DT[P.deathType]||DT.car;
  $('dtitle').textContent=d[0];
  $('onewrec').style.display=rec?'block':'none';
  $('ostats').innerHTML='走了 <b>'+score+'</b> 格<br>'+d[1]+
    '<br>历史最高:'+KIT.best()+' 格<br>已玩 '+KIT.plays()+' 局';
  $('mini2').innerHTML='前 10 格随便走,之后车快河急镜头催,拼手速!';
  $('over').classList.remove('hide');
}
function update(dt){
  time+=dt;
  for(var f=feathers.length-1;f>=0;f--){var fe=feathers[f];
    fe.t+=dt;fe.vy+=500*dt;fe.x+=fe.vx*dt;fe.y+=fe.vy*dt;
    if(fe.t>1.4)feathers.splice(f,1)}
  if(state!=='play')return;
  var T=trackLen();
  for(var k in rows){var row=rows[k];
    if(row.type==='road')for(var i=0;i<row.cars.length;i++){
      var c=row.cars[i];c.x+=row.dir*row.speed*dt;
      c.x=((c.x%T)+T)%T-CELL*2;
    }
    if(row.type==='water')for(var j=0;j<row.logs.length;j++){
      var L=row.logs[j];L.x+=row.dir*row.speed*dt;
      L.x=((L.x%T)+T)%T-CELL*2;
    }
  }
  if(!P.alive){P.deathT+=dt;if(P.deathT>1.3)gameOver();return}
  if(P.hop){
    var h=P.hop;h.t+=dt/0.14;
    if(h.t>=1){
      P.hop=null;
      P.px=P.col*CELL+CELL/2;
      landCheck();
    }
  }else{
    P.px+=P.driftV*dt;
    if(P.px<CELL*.18||P.px>COLS*CELL-CELL*.18){die('sink')}
  }
  if(P.alive&&!P.hop){
    var tr2=rows[P.wr];
    if(tr2&&tr2.type==='road')carCheck(tr2);
  }
  if(P.alive){
    var creep=score>10?Math.min(30,(score-10)*2.2):0;
    cam=Math.max(cam+(P.wr-cam)*Math.min(1,dt*5),cam+creep*dt);
    if(screenY(P.wr)>VH-CELL*.4)die('push');
    ensureRows();
  }
  if(P.alive&&!P.hop){
    P.idleT+=dt;warnT=P.idleT>6?P.idleT:0;
    if(P.idleT>7.5)die('eagle');
  }
}
function draw(){
  ctx.fillStyle='#12283a';ctx.fillRect(0,0,VW,VH);
  var T=trackLen();
  var top=Math.ceil(cam+VH/CELL+2),bot=Math.max(0,Math.floor(cam-2));
  for(var w=bot;w<=top;w++){
    var row=rows[w];if(!row)continue;
    var y=screenY(w);
    if(row.type==='grass'){
      ctx.fillStyle=w%2?'#2f8a4a':'#2a7f44';
      ctx.fillRect(0,y,VW,CELL+1);
    }else if(row.type==='road'){
      ctx.fillStyle='#3a3f4a';ctx.fillRect(0,y,VW,CELL+1);
      ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=3;
      ctx.setLineDash([16,18]);
      ctx.beginPath();ctx.moveTo(0,y+CELL/2);ctx.lineTo(VW,y+CELL/2);ctx.stroke();
      ctx.setLineDash([]);
    }else{
      ctx.fillStyle='#1d5c8a';ctx.fillRect(0,y,VW,CELL+1);
      ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=2;
      for(var wx=((time*30)%60)-60;wx<VW;wx+=60){
        ctx.beginPath();ctx.moveTo(wx,y+CELL*.3);ctx.lineTo(wx+22,y+CELL*.3);
        ctx.moveTo(wx+30,y+CELL*.72);ctx.lineTo(wx+52,y+CELL*.72);ctx.stroke();
      }
    }
    if(row.type==='grass')for(var c in row.trees){
      drawEm('🌲',(+c)*CELL+CELL/2,y+CELL/2+CELL*.16,CELL*.92);
    }
    if(row.type==='road')for(var i2=0;i2<row.cars.length;i2++){
      var car=row.cars[i2],cx=car.x;
      if(cx>VW||cx+car.len<0)continue;
      rr(cx,y+CELL*.22,car.len,CELL*.56,8);
      ctx.fillStyle=car.c;ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.35)';
      rr(cx+car.len*.3,y+CELL*.3,car.len*.28,CELL*.18,4);ctx.fill();
      ctx.fillStyle='#ffe08a';
      ctx.fillRect(row.dir>0?cx+car.len-5:cx+1,y+CELL*.34,4,5);
      ctx.fillRect(row.dir>0?cx+car.len-5:cx+1,y+CELL*.6,4,5);
    }
    if(row.type==='water')for(var i3=0;i3<row.logs.length;i3++){
      var log=row.logs[i3];
      if(log.x>VW||log.x+log.len<0)continue;
      rr(log.x,y+CELL*.26,log.len,CELL*.48,10);
      ctx.fillStyle='#7a5230';ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.18)';
      rr(log.x+6,y+CELL*.4,log.len-12,5,3);ctx.fill();
    }
  }
  var py=screenY(P.wr),px=P.px;
  if(P.hop){
    var h2=P.hop;
    px=h2.fx+((h2.tc*CELL+CELL/2)-h2.fx)*h2.t;
    py=screenY(h2.fw)+(screenY(h2.tw)-screenY(h2.fw))*h2.t;
  }
  if(P.alive){
    var hopDy=P.hop?-Math.sin(P.hop.t*Math.PI)*CELL*.55:0;
    var sc2=P.hop?1+.12*Math.sin(P.hop.t*Math.PI):1;
    if(warnT>0&&Math.sin(time*10)>0){
      ctx.font='900 26px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('⏰',px,py-CELL*.9);
    }
    ctx.save();ctx.translate(px,py+hopDy);ctx.scale(sc2,sc2);
    drawEm('🐔',0,0,CELL*.82);
    ctx.restore();
  }else{
    ctx.save();ctx.translate(px,py);ctx.rotate(Math.min(1,P.deathT*2.4)*Math.PI/2);
    ctx.globalAlpha=Math.max(.3,1-P.deathT);
    drawEm('🐔',0,0,CELL*.82);ctx.restore();ctx.globalAlpha=1;
    if(P.deathType==='splash'){
      ctx.font='900 30px sans-serif';ctx.textAlign='center';
      ctx.fillText('💧',px,py-CELL*.5);
    }
  }
  for(var f2=0;f2<feathers.length;f2++){
    var fe2=feathers[f2];
    ctx.globalAlpha=Math.max(0,1-fe2.t/1.4);
    drawEm('🪶',fe2.x,fe2.y,fe2.s);
    ctx.globalAlpha=1;
  }
}
cv.addEventListener('pointerdown',function(e){e.preventDefault();
  this._sx=e.clientX;this._sy=e.clientY});
cv.addEventListener('pointerup',function(e){
  e.preventDefault();
  if(state!=='play')return;
  var dx=e.clientX-this._sx,dy=e.clientY-this._sy;
  if(Math.abs(dx)<24&&Math.abs(dy)<24){hop('up');return}
  if(Math.abs(dy)>Math.abs(dx))hop(dy<0?'up':'down');
  else hop(dx<0?'left':'right');
});
window.addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName==='BUTTON')return;
  var k=e.key;
  if(k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown'||k===' ')e.preventDefault();
  if(k==='ArrowUp'||k==='w'||k==='W')hop('up');
  else if(k==='ArrowDown'||k==='s'||k==='S')hop('down');
  else if(k==='ArrowLeft'||k==='a'||k==='A')hop('left');
  else if(k==='ArrowRight'||k==='d'||k==='D')hop('right');
});
$('startbtn').addEventListener('click',startGame);
$('againbtn').addEventListener('click',startGame);
$('sharebtn').addEventListener('click',function(){
  share('我的小鸡在「'+NAME+'」走了 '+score+' 格!来比比谁走得远 '+location.href.split('#')[0])});
$('hubbtn').addEventListener('click',function(){location.href='/'});
function updMini(){$('mini').innerHTML='历史最远 <b>'+KIT.best()+'</b> 格 · 已玩 <b>'+KIT.plays()+'</b> 局'}
onResize();updMini();run();
})();

<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';
  var name=(document.title||'游戏').split(/[ ··|]/)[0];

  // 回大厅
  var hb=document.createElement('button');
  hb.setAttribute('type','button');hb.textContent='\uD83C\uDFE0';
  hb.style.cssText='position:fixed;top:'+SAFE+';left:10px;z-index:99;border:0;width:36px;height:36px;'+
    'border-radius:12px;font-size:15px;background:rgba(255,255,255,.14);color:#fff;'+
    'border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);cursor:pointer';
  hb.onclick=function(){location.href='/'};
  document.body.appendChild(hb);

  // 结算页:晒战绩 + 换个游戏
  var over=document.getElementById('over');
  if(over){
    var box=document.createElement('div');
    box.style.cssText='display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px';
    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='crossy'});
  r.unshift({k:'crossy',n:'过马路 · 小鸡快跑',e:'🐔'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['crossy_best','crossy_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['crossy']||0)){
            B['crossy']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
