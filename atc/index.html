<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='atc_best',PLAY='atc_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 塔台指挥 · 三圈空域 ================== */
var NAME = '塔台指挥 · 三圈空域';
var state = 'start';
var planes = [], sel = -1, score = 0, lives = 3, landed = 0, wave = 1;
var spawnT = 0, nextId = 1, shake = 0, msg = '', msgT = 0, flash = 0;
var cx = 0, cy = 0, RR = [0, 0, 0], SQ = .62, ruy = 0, LS = 40;
var LVL = ['I', 'II', 'III'];

function layout() {
  cx = VW / 2; cy = VH * .40;
  var m = Math.min(VW, VH);
  RR[0] = m * .17; RR[1] = m * .27; RR[2] = m * .37;
  LS = m * .17;
  ruy = Math.min(VH - 168, cy + m * .46);
}
function onResize() { layout(); }

function pos(p) {
  if (p.in) {
    var k = clamp(p.it, 0, 1);
    return { x: p.sx + (cx - p.sx) * k, y: p.sy + (ruy - p.sy) * k };
  }
  return { x: cx + Math.cos(p.a) * RR[p.alt], y: cy + Math.sin(p.a) * RR[p.alt] * SQ };
}
function gap(a, b) {
  var d = Math.abs(a - b) % (Math.PI * 2);
  return d > Math.PI ? Math.PI * 2 - d : d;
}
function spawn() {
  var alt = rnd(3), ang = 0, ok = false;
  for (var t = 0; t < 14 && !ok; t++) {
    alt = rnd(3); ang = frnd() * Math.PI * 2; ok = true;
    for (var i = 0; i < planes.length; i++) {
      var p = planes[i];
      if (!p.in && p.alt === alt && gap(p.a, ang) < .62) { ok = false; break; }
    }
  }
  planes.push({ id: nextId++, alt: alt, a: ang, dir: frnd() < .5 ? 1 : -1, fuel: 100, in: false, it: 0, sx: 0, sy: 0 });
  tone(520, .12, 'sine', .04, 760);
  if (sel < 0) sel = planes[planes.length - 1].id;
}
function drop(id) {
  for (var i = planes.length - 1; i >= 0; i--) if (planes[i].id === id) planes.splice(i, 1);
}
function crash(p1, p2, say) {
  lives--; shake = .5; flash = .4; msg = say; msgT = 1.6;
  if (p1) drop(p1.id);
  if (p2) drop(p2.id);
  if (sel < 0 || !planes.some(function (p) { return p.id === sel })) sel = planes.length ? planes[0].id : -1;
  noise(.3, .1);
  tone(140, .4, 'sawtooth', .07, 50);
  if (lives <= 0) endGame();
}
function resetGame() {
  planes = []; sel = -1; score = 0; lives = 3; landed = 0; wave = 1;
  spawnT = .5; nextId = 1; shake = 0; msg = ''; msgT = 0; flash = 0;
  syncHud();
}
function startGame() {
  resetGame();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}
function endGame() {
  state = 'over';
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  var rank = landed >= 24 ? '金牌塔台长' : landed >= 14 ? '进近专家' : landed >= 7 ? '见习管制员' : '手忙脚乱';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '指挥落地 <b>' + landed + ' 架</b><br>' +
    '本局得分 <b>' + score + '</b><br>波次 ' + wave + '<br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '同高度层挨太近就会撞,提前调层';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
}
function syncHud() {
  $('hscore').textContent = score;
  $('hin').textContent = planes.length;
  $('hland').textContent = landed;
}
function selPlane() {
  for (var i = 0; i < planes.length; i++) if (planes[i].id === sel) return planes[i];
  return null;
}
function pickAt(x, y) {
  var best = -1, bd = 40;
  for (var i = 0; i < planes.length; i++) {
    var q = pos(planes[i]);
    var d = Math.hypot(q.x - x, q.y - y);
    if (d < bd) { bd = d; best = planes[i].id; }
  }
  if (best >= 0) { sel = best; tone(700, .05, 'square', .03); }
}
function upAlt() {
  var p = selPlane();
  if (!p || p.in || state !== 'play') return;
  p.alt = (p.alt + 1) % 3;
  tone(430 + p.alt * 170, .1, 'triangle', .045);
  msg = '航班 ' + p.id + ' 升至 ' + LVL[p.alt]; msgT = 1.1;
}
function landSel() {
  var p = selPlane();
  if (!p || p.in || state !== 'play') return;
  var q = pos(p);
  p.in = true; p.it = 0; p.sx = q.x; p.sy = q.y;
  tone(300, .2, 'sine', .05, 180);
  sel = -1;
  for (var i = 0; i < planes.length && sel < 0; i++) if (!planes[i].in) sel = planes[i].id;
}
function update(dt) {
  if (msgT > 0) msgT -= dt;
  if (shake > 0) shake -= dt;
  if (flash > 0) flash -= dt;
  if (state !== 'play') return;
  var i, p;
  spawnT -= dt;
  if (spawnT <= 0) {
    spawnT = Math.max(1.1, 4.2 - wave * .35);
    if (planes.length < 4 + wave) spawn();
  }
  var ls = LS * (1 + (wave - 1) * .06);
  var j;
  for (i = planes.length - 1; i >= 0; i--) {
    p = planes[i];
    p.fuel -= dt * (3 + wave * .35);
    if (p.fuel <= 0) { crash(p, null, '航班 ' + p.id + ' 燃油耗尽!'); continue; }
    if (p.in) {
      p.it += dt / 1.9;
      if (p.it >= 1) {
        var bonus = 100 + Math.round(p.fuel);
        score += bonus; landed++;
        drop(p.id);
        msg = '落地!+' + bonus; msgT = 1.1;
        tone(880, .14, 'sine', .05, 1320);
        if (landed % 5 === 0) wave++;
        if (sel < 0 || !planes.some(function (x) { return x.id === sel })) {
          sel = -1;
          for (var k = 0; k < planes.length; k++) if (!planes[k].in) { sel = planes[k].id; break; }
        }
        continue;
      }
    } else {
      p.a += p.dir * (ls / RR[p.alt]) * dt;
    }
  }
  /* 同层追撞 */
  for (i = planes.length - 1; i >= 0 && state === 'play'; i--) {
    p = planes[i];
    if (!p || p.in) continue;
    for (j = 0; j < planes.length; j++) {
      if (j === i) continue;
      var q = planes[j];
      if (q.in || q.alt !== p.alt) continue;
      if (gap(p.a, q.a) < .3) { crash(p, q, '同层相撞!'); break; }
    }
  }
  /* 进近航线被切:下滑道上的飞机对所有平飞航班致命 */
  for (i = planes.length - 1; i >= 0 && state === 'play'; i--) {
    p = planes[i];
    if (!p.in) continue;
    var a = pos(p);
    for (j = 0; j < planes.length; j++) {
      if (j === i) continue;
      var r = planes[j];
      if (r.in) continue;
      var b = pos(r);
      if (Math.hypot(a.x - b.x, a.y - b.y) < 24) { crash(p, r, '进近撞上!'); break; }
    }
  }
  syncHud();
}
function jet(x, y, ang, col, hi) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang + Math.PI / 2);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(0, -11); ctx.lineTo(4, 3); ctx.lineTo(13, 8); ctx.lineTo(4, 8);
  ctx.lineTo(3, 12); ctx.lineTo(-3, 12); ctx.lineTo(-4, 8); ctx.lineTo(-13, 8);
  ctx.lineTo(-4, 3); ctx.closePath();
  ctx.fill();
  if (hi) {
    ctx.strokeStyle = 'rgba(255,240,140,.95)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 2, 17, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}
function draw() {
  var sh = shake > 0 ? (frnd() - .5) * 7 : 0;
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#06130f'); bg.addColorStop(1, '#020806');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  ctx.save();
  ctx.translate(sh, 0);
  /* 雷达扫描扇 */
  var sweep = (landed + score * .001) % 1;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, RR[2] * 1.3, sweep * Math.PI * 2, sweep * Math.PI * 2 + .5);
  ctx.closePath();
  ctx.fillStyle = 'rgba(80,220,150,.07)'; ctx.fill();
  ctx.restore();
  /* 三层航道 */
  for (var i = 0; i < 3; i++) {
    ctx.strokeStyle = 'rgba(90,210,150,' + (i === 0 ? .5 : .3) + ')';
    ctx.lineWidth = i === 0 ? 2 : 1.5;
    ctx.beginPath();
    ctx.ellipse(cx, cy, RR[i], RR[i] * SQ, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.font = '700 11px "PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(140,230,180,.65)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(LVL[i], cx, cy - RR[i] * SQ - 8);
  }
  /* 塔台与跑道 */
  ctx.fillStyle = 'rgba(120,220,170,.22)';
  ctx.fillRect(cx - 46, ruy, 92, 9);
  ctx.strokeStyle = 'rgba(150,240,190,.55)'; ctx.lineWidth = 1.5;
  ctx.setLineDash([9, 8]);
  ctx.beginPath(); ctx.moveTo(cx - 42, ruy + 4.5); ctx.lineTo(cx + 42, ruy + 4.5); ctx.stroke();
  ctx.setLineDash([]);
  drawEm('🛫', cx, ruy + 26, 22);
  drawEm('📡', cx, cy, 24);
  /* 航班 */
  for (i = 0; i < planes.length; i++) {
    var p = planes[i];
    var q = pos(p);
    var ang = p.in ? Math.atan2(ruy - p.sy, cx - p.sx) : p.a + (p.dir > 0 ? Math.PI / 2 : -Math.PI / 2);
    if (p.in) {
      ctx.strokeStyle = 'rgba(255,220,120,.35)'; ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 6]);
      ctx.beginPath(); ctx.moveTo(p.sx, p.sy); ctx.lineTo(q.x, q.y); ctx.stroke();
      ctx.setLineDash([]);
    }
    jet(q.x, q.y, ang, p.in ? '#ffe08a' : (p.id === sel ? '#eafaf0' : 'rgba(200,235,215,.8)'), p.id === sel);
    /* 油量弧 */
    ctx.strokeStyle = p.fuel > 34 ? 'rgba(120,230,170,.85)' : 'rgba(255,110,110,.95)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(q.x, q.y, 21, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(p.fuel / 100, 0, 1));
    ctx.stroke();
  }
  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,80,80,' + (flash * .35) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
  ctx.restore();
  /* 生命 */
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = '15px sans-serif';
  ctx.fillText('❤'.repeat(Math.max(0, lives)), 14, VH - 40);
  ctx.textAlign = 'center';
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = msgT > 0 ? 'rgba(255,220,120,.95)' : 'rgba(190,235,210,.5)';
  ctx.fillText(msg || '点飞机选中,再按「升高」或「降落」', VW / 2, VH - 44);
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  pickAt(e.clientX, e.clientY);
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === 'ArrowUp') { e.preventDefault(); upAlt(); }
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); landSel(); }
  if (e.key === 'Tab') {
    e.preventDefault();
    if (!planes.length) return;
    var idx = 0;
    for (var i = 0; i < planes.length; i++) if (planes[i].id === sel) idx = i;
    sel = planes[(idx + 1) % planes.length].id;
  }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startGame(); }
});
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', startGame);
$('upbtn').addEventListener('click', upAlt);
$('landbtn').addEventListener('click', landSel);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」指挥 ' + landed + ' 架航班安全落地,拿了 ' + score + ' 分! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  state: function () { return state; },
  score: function () { return score; },
  lives: function () { return lives; },
  landed: function () { return landed; },
  wave: function () { return wave; },
  planes: function () { return planes; },
  count: function () { return planes.length; },
  sel: function () { return sel; },
  select: function (i) { if (planes[i]) sel = planes[i].id; },
  up: upAlt, land: landSel, spawn: spawn,
  altOf: function (i) { return planes[i] ? planes[i].alt : -1; },
  setAlt: function (i, v) { if (planes[i]) planes[i].alt = v; },
  setAng: function (i, v) { if (planes[i]) planes[i].a = v; },
  setFuel: function (i, v) { if (planes[i]) planes[i].fuel = v; },
  setDir: function (i, v) { if (planes[i]) planes[i].dir = v; },
  clear: function () { planes = []; sel = -1; },
  gap: gap, posOf: function (i) { return planes[i] ? pos(planes[i]) : null; },
  step: function (n) { for (var i = 0; i < n; i++) update(1 / 60); },
  forceEnd: endGame
};
resize();
resetGame();
$('padbar').classList.add('hide');
updMini();
run();

})();
</script>

<script>
(function(){

  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());

      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));

      location.href='/'}));

}catch(e){}
})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='atc'});
  r.unshift({k:'atc',n:'塔台指挥 · 三圈空域',e:'🛫'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['atc_best','atc_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['atc']||0)){
            B['atc']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
