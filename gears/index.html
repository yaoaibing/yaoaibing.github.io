<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='gears_best',PLAY='gears_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 齿轮传动 · 机械迷阵 ================== */
var NAME = '齿轮传动 · 机械迷阵';
var state = 'start';
var level = 0, score = 0, used = 0, minimal = 0;
var COLS = 8, ROWS = 9, grid = [], gears = [], powered = [];
var SRC = { x: 0, y: 0 }, TGT = { x: 0, y: 0 };
var ang = 0, msg = '', msgT = 0, clearT = 0, time = 0;
var CS = 0, BX = 0, BY = 0;

/* 关卡:8 列 x 9 行,#墙 S动力 T机器 .空位 */
var LV = [
  ['########', '#......#', '#......#', 'S......T', '#......#', '#......#', '########', '########', '########'],
  ['########', '#......#', '#......#', 'S...##.T', '#...##.#', '#...##.#', '#......#', '########', '########'],
  ['########', '#......#', '#..##..#', 'S..##..T', '#..##..#', '#......#', '#.####.#', '########', '########'],
  ['########', '#..#...#', '#..#.#.#', 'S..#.#.T', '#..#.#.#', '#..#...#', '#......#', '########', '########'],
  ['S......#', '#.####.#', '#.#..#.#', '#.#..#.T', '#.#..#.#', '#.####.#', '#......#', '########', '########'],
  ['########', '#..#...#', 'S..#.#.T', '#..#.#.#', '#.....##', '#.###..#', '#.....##', '#.###..#', '########'],
  ['########', '#.##...#', 'S..#.#.T', '#..#.#.#', '#..#...#', '#..##..#', '#......#', '########', '########'],
  ['S.......', '.######.', '.#....#.', '.#.##.#.', '.#.#T...', '.#.##.#.', '.#....#.', '.######.', '########']
];


function layout() {
  CS = Math.floor(Math.min((VW - 16) / COLS, (VH - 196) / ROWS));
  BX = Math.round((VW - CS * COLS) / 2);
  BY = Math.round((VH - CS * ROWS) / 2) + 6;
}
function onResize() { layout(); }
function cellAt(px, py) {
  var c = Math.floor((px - BX) / CS), r = Math.floor((py - BY) / CS);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return -1;
  return r * COLS + c;
}
function loadLevel(k) {
  var rows = LV[k];
  grid = []; gears = [];
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var ch = rows[r][c];
      var idx = r * COLS + c;
      grid[idx] = ch === '#' ? 1 : 0;
      if (ch === 'S') { SRC = { x: c, y: r }; grid[idx] = 2; }
      if (ch === 'T') { TGT = { x: c, y: r }; grid[idx] = 3; }
      if (grid[idx] === 0) gears[idx] = 0;
    }
  }
  used = 0;
  minimal = bfsMin();
  layout();
  syncHud();
}
function bfsMin() {
  /* 最少齿轮 = S 邻格到 T 邻格的最短开放路径 */
  var dist = {}, queue = [];
  var sn = [[SRC.x + 1, SRC.y], [SRC.x, SRC.y - 1], [SRC.x, SRC.y + 1]];
  var tn = {};
  var tn2 = [[TGT.x - 1, TGT.y], [TGT.x, TGT.y - 1], [TGT.x, TGT.y + 1]];
  for (var t = 0; t < tn2.length; t++) tn[tn2[t][1] * COLS + tn2[t][0]] = 1;
  for (var i = 0; i < sn.length; i++) {
    var key = sn[i][1] * COLS + sn[i][0];
    if (sn[i][0] < 0 || sn[i][0] >= COLS || sn[i][1] < 0 || sn[i][1] >= ROWS) continue;
    if (grid[key] !== 0) continue;
    dist[key] = 1; queue.push(key);
    if (tn[key]) return 1;
  }
  var head = 0;
  while (head < queue.length) {
    var cur = queue[head++];
    var cx = cur % COLS, cy = cur / COLS | 0;
    var nb = [[cx + 1, cy], [cx - 1, cy], [cx, cy - 1], [cx, cy + 1]];
    for (var j = 0; j < 4; j++) {
      var nx = nb[j][0], ny = nb[j][1];
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
      var nk = ny * COLS + nx;
      if (grid[nk] !== 0 || dist[nk]) continue;
      dist[nk] = dist[cur] + 1;
      if (tn[nk]) return dist[nk];
      queue.push(nk);
    }
  }
  return 99;
}
function power() {
  /* 从动力源 BFS,正交相邻即咬合 */
  powered = {};
  var key = SRC.y * COLS + SRC.x;
  var queue = [key], seen = {}; seen[key] = 1;
  powered[key] = 0;
  var head = 0;
  while (head < queue.length) {
    var cur = queue[head++];
    var cx = cur % COLS, cy = cur / COLS | 0;
    var nb = [[cx + 1, cy], [cx - 1, cy], [cx, cy - 1], [cx, cy + 1]];
    for (var j = 0; j < 4; j++) {
      var nx = nb[j][0], ny = nb[j][1];
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
      var nk = ny * COLS + nx;
      if (seen[nk] || gears[nk] !== 1) continue;
      seen[nk] = 1; powered[nk] = (powered[cur] + 1) % 2;
      queue.push(nk);
    }
  }
  var tn = [[TGT.x - 1, TGT.y], [TGT.x + 1, TGT.y], [TGT.x, TGT.y - 1], [TGT.x, TGT.y + 1]];
  for (var t = 0; t < 4; t++) {
    var tk = tn[t][1] * COLS + tn[t][0];
    if (powered[tk] !== undefined) return true;
  }
  return false;
}
function resetMatch() {
  level = 0; score = 0;
  loadLevel(0);
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}
function syncHud() {
  $('hlv').textContent = (level + 1) + '/' + LV.length;
  $('huse').textContent = used;
  $('hmin').textContent = minimal;
}
function matchOver() {
  state = 'over';
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '<b>八座机械迷阵全部贯通!</b><br>总得分 <b>' + score + '</b><br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '齿轮用得越少分越高,先找最短路';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  tone(640, .14, 'triangle', .06, 900);
}
function levelClear() {
  score += Math.max(30, 200 - Math.max(0, used - minimal) * 25);
  syncHud();
  if (level >= LV.length - 1) { matchOver(); return; }
  msg = '机器转起来了!'; msgT = 1.2; clearT = 1.2;
  state = 'clear';
  tone(620, .12, 'triangle', .05, 880);
}
function update(dt) {
  time += dt;
  ang += dt * 2.4;
  if (msgT > 0) msgT -= dt;
  if (state === 'clear') {
    clearT -= dt;
    if (clearT <= 0) { level++; loadLevel(level); state = 'play'; syncHud(); }
  }
}
function drawGear(x, y, r, a, hot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(a);
  ctx.fillStyle = hot ? '#d0a848' : '#6a6a72';
  ctx.beginPath();
  var teeth = 8;
  for (var i = 0; i < teeth * 2; i++) {
    var rr = i % 2 === 0 ? r * 1.14 : r * .92;
    var t2 = i * Math.PI / teeth;
    var px = Math.cos(t2) * rr, py = Math.sin(t2) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = hot ? '#8a6a20' : '#3c3c44';
  ctx.beginPath(); ctx.arc(0, 0, r * .55, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = hot ? '#ffd45c' : '#52525c';
  ctx.beginPath(); ctx.arc(0, 0, r * .22, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#161410'); bg.addColorStop(1, '#0c0a08');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  var on = state === 'play' || state === 'clear' ? power() : false;
  var i, r, c;
  for (i = 0; i < COLS * ROWS; i++) {
    c = i % COLS; r = i / COLS | 0;
    var x = BX + c * CS, y = BY + r * CS;
    if (grid[i] === 1) {
      ctx.fillStyle = '#242018';
      ctx.fillRect(x + 1, y + 1, CS - 2, CS - 2);
      ctx.fillStyle = 'rgba(255,255,255,.06)';
      ctx.fillRect(x + 4, y + 4, CS - 8, 3);
    } else if (grid[i] !== 2 && grid[i] !== 3) {
      ctx.strokeStyle = 'rgba(255,255,255,.05)';
      ctx.strokeRect(x + .5, y + .5, CS - 1, CS - 1);
    }
  }
  /* 动力源(大齿轮)与机器 */
  drawGear(BX + SRC.x * CS + CS / 2, BY + SRC.y * CS + CS / 2, CS * .46, ang, true);
  var tX = BX + TGT.x * CS + CS / 2, tY = BY + TGT.y * CS + CS / 2;
  if (on) {
    var g2 = ctx.createRadialGradient(tX, tY, 2, tX, tY, CS);
    g2.addColorStop(0, 'rgba(255,212,92,.5)'); g2.addColorStop(1, 'rgba(255,212,92,0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(tX, tY, CS, 0, Math.PI * 2); ctx.fill();
  }
  drawEm(on ? '💡' : '🔌', tX, tY, CS * .62);
  /* 已放齿轮 */
  for (i = 0; i < COLS * ROWS; i++) {
    if (gears[i] !== 1) continue;
    c = i % COLS; r = i / COLS | 0;
    var hot = powered[i] !== undefined && (state === 'play' || state === 'clear');
    drawGear(BX + c * CS + CS / 2, BY + r * CS + CS / 2, CS * .44, hot ? (powered[i] ? ang : -ang) : 0, hot);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (msgT > 0) {
    ctx.fillStyle = 'rgba(255,235,190,.95)';
    ctx.font = '600 14px "PingFang SC",sans-serif';
    ctx.fillText(msg, VW / 2, BY - 18);
  }
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.font = '600 12px "PingFang SC",sans-serif';
  if (state === 'play') ctx.fillText('点空位放齿轮,点齿轮收回来,接亮 💡 即可', VW / 2, VH - 34);
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  var idx = cellAt(e.clientX, e.clientY);
  if (idx < 0 || grid[idx] !== 0) return;
  if (gears[idx] === 1) { gears[idx] = 0; used--; tone(300, .05, 'sine', .03, 240); }
  else {
    gears[idx] = 1; used++;
    tone(420, .05, 'square', .03);
    if (power()) levelClear();
  }
  syncHud();
});
cv.addEventListener('pointercancel', function () { });
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', resetMatch);
$('againbtn').addEventListener('click', resetMatch);
$('newbtn').addEventListener('click', function () { if (state === 'play') loadLevel(level); syncHud(); });
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」通到了第 ' + (level + 1) + ' 关! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/'; });
window.__T = {
  state: function () { return state; },
  start: resetMatch,
  step: function (k) { for (var i = 0; i < (k || 1); i++) update(1 / 60); },
  score: function () { return score; },
  level: function () { return level; },
  place: function (idx) { if (grid[idx] === 0 && gears[idx] !== 1) { gears[idx] = 1; used++; if (power()) levelClear(); syncHud(); } },
  on: function () { return power(); }
};
resize();
loadLevel(0);
$('padbar').classList.add('hide');
updMini();
syncHud();
run();

})();
</script>

<script>

  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}

        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='gears'});
  r.unshift({k:'gears',n:'齿轮传动 · 机械迷阵',e:'⚙️'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['gears_best','gears_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['gears']||0)){
            B['gears']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
