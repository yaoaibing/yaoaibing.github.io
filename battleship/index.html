<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='battleship_best',PLAY='battleship_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 海战棋 · 猎潜对决 ================== */
var NAME = '海战棋 · 猎潜对决';
var state = 'start';
var N = 10;
var SHIP_SIZES = [5, 4, 3, 3, 2];
var enemyShips = [], myShips = [];
var enemyShots = [], myShots = [];
var enemyBoard = [], myBoard = [];
var myTurns = 0, aiTurns = 0, aiQueue = [], aiWait = 0, phase = 'me';
var popT = 0, popTxt = '', popGood = false, shakeT = 0;
var BX = 0, MX = 0, EY = 0, MY = 0, CS = 0, BS = 0;
var GAP = 44, sideBySide = false;
var enemyCellsLeft = 17, myCellsLeft = 17;
var sunkMsg = '';

function layout() {
  var pad = VW < 360 ? 100 : 56;
  var top = Math.max(92, VH * .12);
  var bottom = VH - pad - 10;
  var gap = GAP;
  sideBySide = VW >= VH;
  if (sideBySide) {
    BS = Math.floor(Math.min((VW - 24 - gap) / 2, bottom - top, 430));
    CS = Math.floor(BS / N);
    BS = CS * N;
    var totalW = BS * 2 + gap;
    BX = Math.round((VW - totalW) / 2);
    MX = BX + BS + gap;
    EY = Math.round(top + Math.max(0, (bottom - top - BS) / 2));
    MY = EY;
  } else {
    BS = Math.floor(Math.min(VW - 24, (bottom - top - gap) / 2, 430));
    CS = Math.floor(BS / N);
    BS = CS * N;
    BX = Math.round((VW - BS) / 2);
    MX = BX;
    EY = Math.round(top + Math.max(0, (bottom - top - gap - BS * 2) / 2));
    MY = EY + BS + gap;
  }
}
function onResize() { layout(); }

function idx(r, c) { return r * N + c; }
function placeFleet() {
  var ships = [], occupied = {}, i, tries = 0;
  for (i = 0; i < SHIP_SIZES.length; i++) {
    var size = SHIP_SIZES[i], cells = null;
    while (!cells && tries++ < 4000) {
      var horiz = rnd(2) === 0;
      var r = rnd(N), c = rnd(N);
      if (horiz && c + size > N) continue;
      if (!horiz && r + size > N) continue;
      var ok = true, k, cc = [];
      for (k = 0; k < size; k++) {
        var rr2 = horiz ? r : r + k, cc2 = horiz ? c + k : c;
        var id2 = idx(rr2, cc2);
        if (occupied[id2]) { ok = false; break; }
        cc.push(id2);
      }
      if (ok) { cc.forEach(function (x) { occupied[x] = 1; }); cells = cc; }
    }
    if (cells) ships.push({ cells: cells, size: size, hits: 0, sunk: false });
  }
  return ships;
}
function shipMap(ships) {
  var m = {};
  ships.forEach(function (s, si) { s.cells.forEach(function (c) { m[c] = si; }); });
  return m;
}
function resetGame() {
  enemyShips = placeFleet(); myShips = placeFleet();
  enemyShots = []; myShots = [];
  for (var i = 0; i < N * N; i++) { enemyShots.push(0); myShots.push(0); }
  myTurns = 0; aiTurns = 0; aiQueue = []; aiWait = 0; phase = 'me';
  popT = 0; popTxt = ''; shakeT = 0; sunkMsg = '';
  enemyCellsLeft = 17; myCellsLeft = 17;
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}
function syncHud() {
  $('henemy').textContent = enemyCellsLeft;
  $('hmine').textContent = myCellsLeft;
  $('hshots').textContent = myTurns;
}
function fireAt(r, c) {
  if (state !== 'play' || phase !== 'me') return false;
  var id = idx(r, c);
  if (enemyShots[id]) return false;
  myTurns++;
  var map = shipMap(enemyShips);
  var si = map[id];
  if (si === undefined) {
    enemyShots[id] = 1;
    popT = .8; popTxt = '落空'; popGood = false;
    tone(220, .08, 'sine', .03, 160);
  } else {
    var ship = enemyShips[si];
    enemyShots[id] = 2;
    ship.hits++;
    enemyCellsLeft--;
    popT = .8; popTxt = '命中!'; popGood = true;
    tone(560, .1, 'square', .05, 300);
    if (ship.hits >= ship.size) {
      ship.sunk = true;
      ship.cells.forEach(function (x) { enemyShots[x] = 3; });
      sunkMsg = '击沉 ' + ship.size + ' 格战舰!';
      popTxt = sunkMsg; shakeT = .35;
      tone(760, .2, 'triangle', .06, 1100);
    }
  }
  syncHud();
  if (enemyCellsLeft <= 0) { finish(true); return true; }
  phase = 'ai'; aiWait = .55;
  return true;
}
function aiPickTarget() {
  while (aiQueue.length) {
    var id = aiQueue.shift();
    if (!myShots[id]) return id;
  }
  var parity = [], any = [], i;
  for (i = 0; i < N * N; i++) {
    if (myShots[i]) continue;
    var r = Math.floor(i / N), c = i % N;
    any.push(i);
    if ((r + c) % 2 === 0) parity.push(i);
  }
  var pool = parity.length ? parity : any;
  return pool.length ? pool[rnd(pool.length)] : -1;
}
function aiFire() {
  var id = aiPickTarget();
  if (id < 0) return;
  aiTurns++;
  var map = shipMap(myShips);
  var si = map[id];
  var r = Math.floor(id / N), c = id % N;
  if (si === undefined) {
    myShots[id] = 1;
    tone(200, .06, 'sine', .02, 150);
  } else {
    myShots[id] = 2;
    var ship = myShips[si];
    ship.hits++;
    myCellsLeft--;
    tone(300, .08, 'sawtooth', .03, 200);
    var nb = [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]];
    for (var k = 0; k < 4; k++) {
      var rr = nb[k][0], cc = nb[k][1];
      if (rr >= 0 && rr < N && cc >= 0 && cc < N && !myShots[idx(rr, cc)]) aiQueue.push(idx(rr, cc));
    }
    if (ship.hits >= ship.size) {
      ship.sunk = true;
      ship.cells.forEach(function (x) { myShots[x] = 3; });
      aiQueue = aiQueue.filter(function (x) { return myShots[x] === 0; });
      popT = 1; popTxt = '你的 ' + ship.size + ' 格舰被击沉!'; popGood = false; shakeT = .4;
    }
  }
  syncHud();
  if (myCellsLeft <= 0) { finish(false); return; }
  phase = 'me';
}
function finish(win) {
  state = 'over';
  phase = 'over';
  KIT.addPlay(); KIT.streak();
  var score = win ? 1200 + myCellsLeft * 30 : 0;
  var rec = KIT.setBest(score);
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = (win ? '全歼敌舰!' : '舰队覆没') + '<br>' +
    '本局得分 <b>' + score + '</b><br>' +
    '你开火 ' + myTurns + ' 次 · 命中 ' + (17 - enemyCellsLeft) + ' / 电脑命中 ' + (17 - myCellsLeft) + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '沿着打中的格子上下左右追,比满屏乱点效率高一倍';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  tone(win ? 760 : 200, .3, 'sine', .06, win ? 1100 : 120);
}
function newFleetOnly() {
  if (myTurns > 0) {
    popT = 1.1; popTxt = '开局后才能重新布阵'; popGood = false;
    return;
  }
  myShips = placeFleet(); myShots = [];
  for (var i = 0; i < N * N; i++) myShots.push(0);
  myCellsLeft = 17;
  syncHud();
  popT = 1; popTxt = '已重新布阵'; popGood = true;
}
function update(dt) {
  if (popT > 0) popT -= dt;
  if (shakeT > 0) shakeT -= dt;
  if (state !== 'play') return;
  if (phase === 'ai') {
    aiWait -= dt;
    if (aiWait <= 0) aiFire();
  }
}
function rr(x, y, w, h, r) {
  var k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
function cellXY(x0, y0, r, c) { return { x: x0 + c * CS, y: y0 + r * CS }; }
function drawGrid(x0, y0, shots, ships, showShips, label) {
  var r, c, i;
  var map = shipMap(ships);
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  rr(x0 - 6, y0 - 6, BS + 12, BS + 12, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(120,200,255,.25)'; ctx.lineWidth = 1.5;
  rr(x0 - 6, y0 - 6, BS + 12, BS + 12, 12); ctx.stroke();

  for (r = 0; r < N; r++) {
    for (c = 0; c < N; c++) {
      var id = r * N + c;
      var p = cellXY(x0, y0, r, c);
      var pad = 1;
      if (showShips && map[id] !== undefined) {
        ctx.fillStyle = shots[id] === 3 ? 'rgba(255,90,90,.4)' : 'rgba(120,200,255,.22)';
        rr(p.x + pad, p.y + pad, CS - pad * 2, CS - pad * 2, 4); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(255,255,255,.07)';
      ctx.lineWidth = 1;
      ctx.strokeRect(p.x + pad, p.y + pad, CS - pad * 2, CS - pad * 2);
      if (shots[id] === 1) {
        ctx.fillStyle = 'rgba(255,255,255,.28)';
        ctx.beginPath(); ctx.arc(p.x + CS / 2, p.y + CS / 2, Math.max(2, CS * .13), 0, 6.2832); ctx.fill();
      } else if (shots[id] === 2) {
        ctx.fillStyle = '#ff6b6b';
        ctx.beginPath(); ctx.arc(p.x + CS / 2, p.y + CS / 2, CS * .28, 0, 6.2832); ctx.fill();
      } else if (shots[id] === 3) {
        ctx.fillStyle = 'rgba(255,70,70,.85)';
        rr(p.x + pad + 1, p.y + pad + 1, CS - pad * 2 - 2, CS - pad * 2 - 2, 4); ctx.fill();
        ctx.strokeStyle = 'rgba(255,220,220,.8)'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(p.x + CS * .3, p.y + CS * .3); ctx.lineTo(p.x + CS * .7, p.y + CS * .7);
        ctx.moveTo(p.x + CS * .7, p.y + CS * .3); ctx.lineTo(p.x + CS * .3, p.y + CS * .7);
        ctx.stroke();
      }
    }
  }
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.font = '700 11px "PingFang SC",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x0, y0 - 14);
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#07182a');
  bg.addColorStop(1, '#040d18');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);

  var sh = shakeT > 0 ? Math.sin(shakeT * 80) * 3 : 0;
  ctx.save(); ctx.translate(sh, 0);
  drawGrid(BX, EY, enemyShots, enemyShips, false, '敌方海域(点击开火)');
  drawGrid(MX, MY, myShots, myShips, true, sideBySide ? '我的海域' : '');
  ctx.restore();

  var midY = sideBySide ? EY + BS + 26 : MY - GAP / 2;
  if (popT > 0) {
    ctx.globalAlpha = clamp(popT, 0, 1);
    ctx.fillStyle = popGood ? '#ffd45c' : 'rgba(255,140,140,.95)';
    ctx.font = '900 20px "PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(popTxt, VW / 2, midY);
    ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.font = '600 12px "PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(phase === 'me' ? '轮到你开火:点上方敌方格子' : '电脑瞄准中…', VW / 2, midY);
  }
}
function tapAt(x, y) {
  if (state !== 'play') return;
  if (x < BX || x > BX + BS || y < EY || y > EY + BS) return;
  var c = Math.floor((x - BX) / CS), r = Math.floor((y - EY) / CS);
  if (r < 0 || r >= N || c < 0 || c >= N) return;
  fireAt(r, c);
}
cv.addEventListener('pointerdown', function (e) { e.preventDefault(); tapAt(e.clientX, e.clientY); });
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === 'r' || e.key === 'R') resetGame();
});
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', resetGame);
$('againbtn').addEventListener('click', resetGame);
$('newbtn').addEventListener('click', resetGame);
$('fleetbtn').addEventListener('click', newFleetOnly);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」' + (state === 'over' ? '打完了一局海战' : '正在猎潜') + '! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });
window.__T = {
  enemyShips: function () { return enemyShips.map(function (s) { return s.cells.slice(); }); },
  myShips: function () { return myShips.map(function (s) { return s.cells.slice(); }); },
  fire: function (r, c) { return fireAt(r, c); },
  shots: function () { return { enemy: enemyShots.slice(), mine: myShots.slice() }; },
  aiPick: aiPickTarget,
  phase: function () { return phase; },
  cells: function () { return { enemy: enemyCellsLeft, mine: myCellsLeft }; },
  advance: function (ms) { var n = Math.max(1, Math.round(ms / 16.6667)); for (var i = 0; i < n; i++) update(1 / 60); },
  state: function () { return state; }
};
resize();
updMini();
syncHud();
run();

})();
</script>

<script>
(function(){
try{

  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());

      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{

        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));

</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='battleship'});
  r.unshift({k:'battleship',n:'海战棋 · 猎潜对决',e:'🚢'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['battleship_best','battleship_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['battleship']||0)){
            B['battleship']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
