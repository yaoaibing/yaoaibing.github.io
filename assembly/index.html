<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='assembly_best',PLAY='assembly_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 组装大师 · 匠心拼装 ================== */
var NAME = '组装大师 · 匠心拼装';
var state = 'start';
var level = 0, LVN = 5, score = 0, moves = 0;
var parts = [];
var dragI = -1, dragDX = 0, dragDY = 0, selI = -1;
var msg = '', msgT = 0, time = 0;
var LEVELS = [
  { parts: [
    { w: 120, h: 22, c: '#c89050', tx: -45, ty: 40, rot: 0 },
    { w: 90, h: 20, c: '#a87840', tx: -50, ty: -6, rot: 0 },
    { w: 22, h: 46, c: '#8a6030', tx: -96, ty: 22, rot: 0 },
    { w: 22, h: 46, c: '#8a6030', tx: 6, ty: 22, rot: 0 }
  ] },
  { parts: [
    { w: 100, h: 90, c: '#7898c8', tx: 0, ty: 0, rot: 0 },
    { w: 40, h: 22, c: '#5878a8', tx: -20, ty: -56, rot: 0 },
    { w: 22, h: 60, c: '#5878a8', tx: 61, ty: -30, rot: 90 }
  ] },
  { parts: [
    { w: 60, h: 60, c: '#e8a858', tx: -40, ty: 0, rot: 0 },
    { w: 60, h: 60, c: '#c88838', tx: 40, ty: 0, rot: 0 },
    { w: 100, h: 20, c: '#8a6838', tx: 0, ty: 50, rot: 0 },
    { w: 20, h: 40, c: '#8a6838', tx: -30, ty: 76, rot: 0 },
    { w: 20, h: 40, c: '#8a6838', tx: 30, ty: 76, rot: 0 }
  ] },
  { parts: [
    { w: 130, h: 20, c: '#9ac878', tx: 0, ty: -40, rot: 0 },
    { w: 20, h: 80, c: '#78a858', tx: -50, ty: 10, rot: 0 },
    { w: 20, h: 80, c: '#78a858', tx: 50, ty: 10, rot: 0 },
    { w: 90, h: 20, c: '#588848', tx: 0, ty: 40, rot: 0 },
    { w: 40, h: 20, c: '#588848', tx: -24, ty: 64, rot: 0 },
    { w: 40, h: 20, c: '#588848', tx: 24, ty: 64, rot: 0 }
  ] },
  { parts: [
    { w: 80, h: 24, c: '#d87878', tx: -28, ty: -50, rot: 0 },
    { w: 80, h: 24, c: '#b85858', tx: 28, ty: -50, rot: 0 },
    { w: 24, h: 24, c: '#e8a8a8', tx: -70, ty: -10, rot: 0 },
    { w: 24, h: 24, c: '#e8a8a8', tx: 0, ty: -10, rot: 0 },
    { w: 24, h: 24, c: '#e8a8a8', tx: 70, ty: -10, rot: 0 },
    { w: 140, h: 24, c: '#984848', tx: 0, ty: 34, rot: 0 },
    { w: 24, h: 50, c: '#783838', tx: -48, ty: 68, rot: 0 },
    { w: 24, h: 50, c: '#783838', tx: 48, ty: 68, rot: 0 }
  ] }
];

function layout() { }
function onResize() { }
function resetMatch() {
  level = 0; score = 0; time = 0;
  msg = ''; msgT = 0;
  loadLevel();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
}
function loadLevel() {
  var lv = LEVELS[level];
  parts = [];
  for (var i = 0; i < lv.parts.length; i++) {
    var p = lv.parts[i];
    var rot = p.rot;
    /* 随机预旋转一部分,玩家需转正 */
    if (frnd() < .4) rot = (rot + 90) % 180;
    parts.push({
      w: p.w, h: p.h, c: p.c,
      tx: VW / 2 + p.tx, ty: VH * .42 + p.ty,
      rot: rot,
      x: VW * .1 + frnd() * VW * .8,
      y: VH * .78 + frnd() * VH * .12,
      done: false
    });
  }
  moves = 0; selI = -1;
  msg = '拖零件到虚线框,方向不对点 🔄 旋转'; msgT = 2;
  syncHud();
}
function syncHud() {
  $('hlv').textContent = (level + 1) + '/' + LVN;
  $('hmv').textContent = moves;
  $('hsc').textContent = score;
}
function matchOver() {
  state = 'over';
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '<b>五件作品全部竣工!</b><br>本局得分 <b>' + score + '</b><br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '先摆大件定骨架,小件最后填';
  $('over').classList.remove('hide');
  tone(640, .14, 'triangle', .06, 900);
}
function partAt(x, y) {
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    if (p.done) continue;
    var hw = (p.rot === 90 ? p.h : p.w) / 2 + 8;
    var hh = (p.rot === 90 ? p.w : p.h) / 2 + 8;
    if (Math.abs(x - p.x) < hw && Math.abs(y - p.y) < hh) return i;
  }
  return -1;
}
function snapCheck(p) {
  return Math.abs(p.x - p.tx) < 20 && Math.abs(p.y - p.ty) < 20 && p.rot === 0;
}
function releasePart() {
  if (dragI < 0) return;
  var p = parts[dragI];
  moves++;
  if (snapCheck(p)) {
    p.x = p.tx; p.y = p.ty; p.done = true;
    tone(560, .07, 'triangle', .045, 760);
    var all = true;
    for (var i = 0; i < parts.length; i++) if (!parts[i].done) all = false;
    if (all) {
      score += Math.max(60, 200 - moves * 8);
      msg = '竣工!+' + Math.max(60, 200 - moves * 8); msgT = 1.3;
      tone(640, .12, 'triangle', .05, 880);
      syncHud();
      setTimeout(function () {
        if (state !== 'play') return;
        level++;
        if (level >= LVN) { matchOver(); return; }
        loadLevel();
      }, 850);
    }
  }
  dragI = -1;
  syncHud();
}
function rotateSel() {
  if (selI < 0 || selI >= parts.length) {
    msg = '先点一个零件再旋转'; msgT = 1;
    return;
  }
  var p = parts[selI];
  if (p.done) return;
  p.rot = (p.rot + 90) % 180;
  moves++;
  tone(400, .04, 'square', .025, 520);
  if (snapCheck(p)) {
    p.x = p.tx; p.y = p.ty; p.done = true;
    tone(560, .07, 'triangle', .045, 760);
    var all = true, i;
    for (i = 0; i < parts.length; i++) if (!parts[i].done) all = false;
    if (all) {
      score += Math.max(60, 200 - moves * 8);
      msg = '竣工!+' + Math.max(60, 200 - moves * 8); msgT = 1.3;
      syncHud();
      setTimeout(function () {
        if (state !== 'play') return;
        level++;
        if (level >= LVN) { matchOver(); return; }
        loadLevel();
      }, 850);
    }
  }
  syncHud();
}
function update(dt) {
  time += dt;
  if (msgT > 0) msgT -= dt;
}
function drawPart(p, ghost) {
  var x = ghost ? p.tx : p.x, y = ghost ? p.ty : p.y;
  var w = p.rot === 90 ? p.h : p.w, h = p.rot === 90 ? p.w : p.h;
  if (ghost) {
    ctx.strokeStyle = 'rgba(120,180,255,.55)'; ctx.lineWidth = 2;
    ctx.setLineDash([6, 5]);
    ctx.strokeRect(x - w / 2, y - h / 2, w, h);
    ctx.setLineDash([]);
    return;
  }
  ctx.fillStyle = p.c;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x - w / 2, y - h / 2, w, h, 6);
  else ctx.rect(x - w / 2, y - h / 2, w, h);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.fillRect(x - w / 2 + 3, y - h / 2 + 3, w - 6, 4);
  if (p.rot === 90) {
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - h / 2 + 8, y - w / 2 + 10); ctx.lineTo(x + h / 2 - 8, y + w / 2 - 10);
    ctx.stroke();
  }
  if (selI >= 0 && parts[selI] === p && !p.done) {
    ctx.strokeStyle = '#ffd45c'; ctx.lineWidth = 2;
    ctx.strokeRect(x - w / 2 - 4, y - h / 2 - 4, w + 8, h + 8);
  }
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#101420'); bg.addColorStop(1, '#0a0c14');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  /* 工作台 */
  ctx.fillStyle = '#1a2230';
  ctx.fillRect(0, VH * .66, VW, VH * .34);
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  ctx.fillRect(0, VH * .66, VW, 4);
  var i;
  for (i = 0; i < parts.length; i++) drawPart(parts[i], true);
  for (i = 0; i < parts.length; i++) if (!parts[i].done) drawPart(parts[i], false);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (msgT > 0) {
    ctx.fillStyle = 'rgba(255,235,180,.95)';
    ctx.font = '600 13.5px "PingFang SC",sans-serif';
    ctx.fillText(msg, VW / 2, VH * .18);
  }
  ctx.fillStyle = 'rgba(255,255,255,.42)';
  ctx.font = '600 11px "PingFang SC",sans-serif';
  if (state === 'play' && moves === 0) {
    ctx.fillText('把零件拖进对应的虚线框,方向不对先旋转', VW / 2, VH * .74);
  }
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  var i = partAt(e.clientX, e.clientY);
  if (i < 0) return;
  dragI = i; selI = i;
  dragDX = parts[i].x - e.clientX;
  dragDY = parts[i].y - e.clientY;
  tone(340, .03, 'sine', .02);
});
cv.addEventListener('pointermove', function (e) {
  if (dragI < 0 || state !== 'play') return;
  e.preventDefault();
  var p = parts[dragI];
  if (p.done) { dragI = -1; return; }
  p.x = e.clientX + dragDX;
  p.y = e.clientY + dragDY;
});
function endDrag() { releasePart(); }
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
window.addEventListener('keydown', function (e) {
  if (e.key === 'r' || e.key === 'R') rotateSel();
});
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', resetMatch);
$('againbtn').addEventListener('click', resetMatch);
$('rotbtn').addEventListener('click', rotateSel);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」竣工了 ' + (level + 1) + ' 件作品! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/'; });
window.__T = {
  state: function () { return state; },
  start: resetMatch,
  step: function (k) { for (var i = 0; i < (k || 1); i++) update(1 / 60); },
  score: function () { return score; },
  level: function () { return level; },
  parts: function () { return parts.map(function (p) { return { done: p.done, rot: p.rot }; }); },
  sel: function () { return selI; },
  setSel: function (i) { selI = i; },
  rotate: rotateSel,
  dragPart: function (i, x, y) { dragI = i; parts[i].x = x; parts[i].y = y; releasePart(); }
};
resize();
loadLevel();
$('padbar').classList.add('hide');
updMini();
syncHud();
run();

})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='assembly'});
  r.unshift({k:'assembly',n:'组装大师 · 匠心拼装',e:'🔧'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['assembly_best','assembly_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['assembly']||0)){
            B['assembly']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
