/* ===== 配色:只改 :root 这一组,其余 CSS 不用动 ===== */
:root{
  --theme:#1a1024;      /* 页面底色 */
  --panel:rgba(14,8,22,.9);      /* 浮层底(带透明度的 rgba) */
  --ink:#ffc2ff;          /* 主标题字色 */
  --edge:#7b2499;        /* 标题描边 / 按钮投影 */

  --btn2:#8f39d6;        /* 主按钮渐变·下 */

  --glow:rgba(255,78,224,.52);        /* 按钮外发光 rgba */

}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--theme);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;display:block;touch-action:none}

/* ===== CORE · HUD ===== */
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;z-index:5;
  display:flex;justify-content:center;align-items:center;gap:10px;pointer-events:none}

#mutebtn{top:calc(10px + env(safe-area-inset-top,0px));right:10px}
#homebtn{top:calc(10px + env(safe-area-inset-top,0px));left:10px}

/* ===== CORE · 浮层 ===== */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--panel);color:#fff;text-align:center;padding:24px;backdrop-filter:blur(3px)}
.screen.hide{display:none}
.title{font-size:40px;font-weight:900;letter-spacing:5px;color:var(--ink);
  text-shadow:0 3px 0 var(--edge),0 8px 26px var(--glow);line-height:1.15}
.title small{display:block;font-size:14px;letter-spacing:9px;color:var(--gold);margin-top:9px;font-weight:700}

  border-radius:16px;padding:14px 20px;max-width:430px;width:100%;margin:20px 0 22px;text-align:left}
.howto b{color:var(--gold)}
.bigbtn{border:0;border-radius:999px;padding:15px 50px;font-size:19px;font-weight:900;letter-spacing:4px;
  color:var(--btnink);cursor:pointer;background:linear-gradient(180deg,var(--btn1),var(--btn2));
  box-shadow:0 5px 0 var(--edge),0 10px 30px var(--glow);font-family:inherit}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.mini{margin-top:16px;font-size:12.5px;color:rgba(255,255,255,.55);line-height:1.9}
.mini b{color:var(--gold)}
#ostats{font-size:15px;line-height:2.1;color:#eaf0ff;background:rgba(255,255,255,.06);border:1px solid var(--hair);
  border-radius:16px;padding:14px 34px;margin-bottom:20px;min-width:230px}
#ostats b{color:var(--gold);font-size:23px}
#onewrec{color:#ff9d4a;font-weight:900;letter-spacing:2px;animation:bl 1s infinite;margin-bottom:10px}
@keyframes bl{50%{opacity:.25}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row .bigbtn{padding:13px 26px;font-size:15px;letter-spacing:1px}
.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.3);border:1px solid var(--hair)}
.ghost:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
@media (max-height:640px){.title{font-size:32px}.howto{margin:14px 0 16px;line-height:1.85}}

/* ===== GAME · 本页专属样式 ===== */

body.playing #padrow{display:flex}
.padbtn{pointer-events:auto;width:min(40vw,180px);height:54px;border-radius:18px;border:1px solid rgba(255,150,245,.48);background:rgba(104,24,140,.5);color:#ffeaff;font:900 16px inherit;letter-spacing:2px;box-shadow:0 4px 0 #54136e,0 0 20px rgba(255,70,220,.25);touch-action:none}

<script>
(function(){
'use strict';

/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='pinball_best',PLAY='pinball_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 弹珠台 ================== */
/* 游戏代码只写在下面这一行之后;上面 CORE 段一行都不要动 */

/* ▼▼▼ 游戏代码 ▼▼▼ */
/* ---------- 台面与局面 ---------- */
var state='start';
var G={score:0,balls:3,combo:0,maxCombo:0,bumps:0,targets:0,doubleTime:0,comboTime:0,flash:0,shake:0,respawn:0};
var ball={x:0,y:0,vx:0,vy:0,r:8,ready:true,alive:true};
var board={x0:20,x1:340,y0:58,y1:650,w:320,h:592,lane:38};
var walls=[],bumpers=[],targets=[],parts=[],floaters=[],trail=[];
var leftDown=false,rightDown=false,charge=0,leftPtr=-1,rightPtr=-1,clock=0,gateCd=0;
var LF={x:0,y:0,len:0,a:.35,w:0},RF={x:0,y:0,len:0,a:2.79,w:0};
function lerp(a,b,t){return a+(b-a)*t}
function vib(n){if(navigator.vibrate)navigator.vibrate(n)}
function addWall(x1,y1,x2,y2,k){walls.push({x1:x1,y1:y1,x2:x2,y2:y2,k:k||'rail'})}
function buildTable(){
  var pad=VH<620?72:84;
  var avail=Math.max(350,VH-pad-58);
  var w=Math.min(VW*.94,avail*.66,440);
  var h=Math.min(avail,w*1.72);
  board.w=w;board.h=h;board.x0=(VW-w)/2;board.x1=board.x0+w;board.y0=54+(avail-h)/2;board.y1=board.y0+h;board.lane=w*.115;
  ball.r=Math.max(6,w*.025);
  walls=[];
  var x0=board.x0,x1=board.x1,y0=board.y0,y1=board.y1,c=(x0+x1)/2,L=board.lane;
  addWall(x0+6,y1-18,x0+6,y0+84);addWall(x0+6,y0+84,x0+24,y0+36);
  addWall(x0+24,y0+36,c-w*.18,y0+8);addWall(c-w*.18,y0+8,c+w*.22,y0+8);
  addWall(c+w*.22,y0+8,x1-8,y0+62);addWall(x1-8,y0+62,x1-8,y1-18);
  addWall(x1-L,y1-66,x1-L,y0+104,'lane');
  addWall(x1-L,y0+104,x1-14,y0+61,'launch');
  addWall(x0+7,y1-205,x0+w*.205,y1-106,'gutter');
  addWall(x1-L-2,y1-205,x1-w*.205,y1-106,'gutter');
  addWall(x0+w*.12,y0+h*.37,x0+w*.2,y0+h*.45,'slide');
  addWall(x1-w*.26,y0+h*.28,x1-w*.16,y0+h*.36,'slide');
  bumpers=[
    {x:c-w*.19,y:y0+h*.29,r:w*.073,c:'#ff4fd8',cool:0,flash:0},
    {x:c+w*.14,y:y0+h*.25,r:w*.068,c:'#6ce9ff',cool:0,flash:0},
    {x:c,y:y0+h*.43,r:w*.078,c:'#b66cff',cool:0,flash:0},
    {x:c-w*.23,y:y0+h*.55,r:w*.058,c:'#57f0d0',cool:0,flash:0}
  ];
  targets=[
    {x:c-w*.25,y:y0+h*.16,r:w*.029,on:true,flash:0},
    {x:c-w*.08,y:y0+h*.13,r:w*.029,on:true,flash:0},
    {x:c+w*.09,y:y0+h*.14,r:w*.029,on:true,flash:0},
    {x:c+w*.25,y:y0+h*.18,r:w*.029,on:true,flash:0}
  ];
  LF.x=c-w*.22;LF.y=y1-w*.24;LF.len=w*.25;
  RF.x=c+w*.22;RF.y=LF.y;RF.len=w*.25;
  if(ball.ready||!ball.alive)placeBall();else{ball.x=clamp(ball.x,x0+ball.r,x1-ball.r);ball.y=clamp(ball.y,y0+ball.r,y1+ball.r)}
}
function onResize(){buildTable()}
function placeBall(){
  ball.x=board.x1-board.lane*.48;ball.y=board.y1-board.w*.13;ball.vx=0;ball.vy=0;ball.ready=true;ball.alive=true;charge=0;trail=[];
}
function resetTargets(){for(var i=0;i<targets.length;i++){targets[i].on=true;targets[i].flash=0}}
function mult(){var m=1+Math.min(6,Math.floor(G.combo/4))*.5;if(G.doubleTime>0)m*=2;return m}
function award(base,label,x,y){
  G.combo++;G.comboTime=3;if(G.combo>G.maxCombo)G.maxCombo=G.combo;
  var n=Math.round(base*mult());G.score+=n;
  floaters.push({text:label+' +'+n,x:x,y:y,t:0,life:.8,c:G.doubleTime>0?'#fff176':'#ffd0ff'});
  if(floaters.length>16)floaters.shift();
}
function burst(x,y,c,n){
  for(var i=0;i<n;i++){var a=frnd()*6.283,s=30+frnd()*170;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:.3+frnd()*.35,r:1+frnd()*3,c:c})}
  if(parts.length>120)parts.splice(0,parts.length-120);
}
function startGame(){
  G={score:0,balls:3,combo:0,maxCombo:0,bumps:0,targets:0,doubleTime:0,comboTime:0,flash:0,shake:0,respawn:0};
  parts=[];floaters=[];trail=[];leftDown=false;rightDown=false;LF.a=.35;RF.a=Math.PI-.35;resetTargets();placeBall();
  state='play';$('start').classList.add('hide');$('over').classList.add('hide');document.body.classList.add('playing');
  KIT.streak();syncHud();tone(440,.09,'triangle',.06,720);run();
}
function gameOver(){
  if(state!=='play')return;state='over';document.body.classList.remove('playing');KIT.addPlay();
  var rec=KIT.setBest(G.score);$('onewrec').style.display=rec?'block':'none';

/* ---------- 碰撞与细分物理 ---------- */
function circleSeg(o,s,e,fl){
  var dx=s.x2-s.x1,dy=s.y2-s.y1,ll=dx*dx+dy*dy;if(ll<.001)return false;
  var t=clamp(((o.x-s.x1)*dx+(o.y-s.y1)*dy)/ll,0,1),qx=s.x1+dx*t,qy=s.y1+dy*t;
  var nx=o.x-qx,ny=o.y-qy,d2=nx*nx+ny*ny,rr=o.r+(fl?board.w*.016:board.w*.009);
  if(d2>=rr*rr)return false;
  var d=Math.sqrt(d2);if(d<.001){nx=-dy;ny=dx;d=Math.sqrt(ll)}nx/=d;ny/=d;
  o.x=qx+nx*(rr+.15);o.y=qy+ny*(rr+.15);
  var svx=0,svy=0,e2=.88;
  if(fl){var rx=qx-fl.x,ry=qy-fl.y;svx=-fl.w*ry;svy=fl.w*rx;e2=.96}
  var rvx=o.vx-svx,rvy=o.vy-svy,vn=rvx*nx+rvy*ny;
  if(vn<0){o.vx=rvx-(1+e2)*vn*nx+svx;o.vy=rvy-(1+e2)*vn*ny+svy;if(fl&&Math.abs(fl.w)>1){o.vx+=nx*board.w*.34;o.vy+=ny*board.w*.34;tone(250,.04,'square',.035,410)}}
  return true;
}
function circleHit(o,c,kick){
  var dx=o.x-c.x,dy=o.y-c.y,rr=o.r+c.r,d2=dx*dx+dy*dy;if(d2>=rr*rr)return false;
  var d=Math.sqrt(d2)||1,nx=dx/d,ny=dy/d;o.x=c.x+nx*(rr+.2);o.y=c.y+ny*(rr+.2);
  var vn=o.vx*nx+o.vy*ny;if(vn<0){o.vx-=(2.05*vn)*nx;o.vy-=(2.05*vn)*ny}
  o.vx+=nx*kick;o.vy+=ny*kick;return true;
}
function flipSegment(f){return{x1:f.x,y1:f.y,x2:f.x+Math.cos(f.a)*f.len,y2:f.y+Math.sin(f.a)*f.len}}
function moveFlippers(dt){
  var lt=leftDown?-.58:.35,rt=rightDown?Math.PI+.58:Math.PI-.35;
  var la=LF.a,ra=RF.a,k=Math.min(1,dt*22);LF.a+=(lt-LF.a)*k;RF.a+=(rt-RF.a)*k;LF.w=(LF.a-la)/dt;RF.w=(RF.a-ra)/dt;
}
function physicsStep(dt){
  ball.vy+=board.h*1.04*dt;ball.vx*=1-dt*.055;ball.vy*=1-dt*.018;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  for(var i=0;i<walls.length;i++)circleSeg(ball,walls[i],.84,null);
  var ls=flipSegment(LF),rs=flipSegment(RF);circleSeg(ball,ls,.96,LF);circleSeg(ball,rs,.96,RF);
  for(var b=0;b<bumpers.length;b++){
    var bp=bumpers[b];if(circleHit(ball,bp,board.w*.42)&&bp.cool<=0){bp.cool=.13;bp.flash=1;G.bumps++;award(100,'撞柱',bp.x,bp.y);burst(bp.x,bp.y,bp.c,12);tone(420+b*95,.07,'sine',.065,760+b*80);vib(10)}
  }
  for(var t=0;t<targets.length;t++){
    var tg=targets[t];if(tg.on&&circleHit(ball,tg,board.w*.16)){tg.on=false;tg.flash=1;G.targets++;award(500,'命中靶',tg.x,tg.y);burst(tg.x,tg.y,'#fff176',14);tone(780,.1,'triangle',.07,1160);vib(14);checkTargets()}
  }
  var c=(board.x0+board.x1)/2;
  if(gateCd<=0&&ball.vy<0&&ball.y<board.y0+board.h*.17&&Math.abs(ball.x-c)<board.w*.115){gateCd=.8;award(1000,'过关口',ball.x,ball.y);burst(ball.x,ball.y,'#75f5ff',18);tone(620,.08,'sine',.06,1200);setTimeout(function(){tone(980,.13,'sine',.05,1480)},70)}
  if(ball.x<board.x0-ball.r*2){ball.x=board.x0+ball.r;ball.vx=Math.abs(ball.vx)}
  if(ball.x>board.x1+ball.r*2){ball.x=board.x1-ball.r;ball.vx=-Math.abs(ball.vx)}
  if(ball.y<board.y0-ball.r*3){ball.y=board.y0+ball.r;ball.vy=Math.abs(ball.vy)}
  if(ball.y>board.y1+ball.r*3)drain();
}
function checkTargets(){
  for(var i=0;i<targets.length;i++)if(targets[i].on)return;
  G.doubleTime=8;G.targetRespawn=3;G.flash=.45;floaters.push({text:'全靶清空 · 8秒双倍',x:VW/2,y:board.y0+board.h*.34,t:0,life:1.4,c:'#fff176'});tone(523,.12,'sine',.07,784);setTimeout(function(){tone(784,.18,'sine',.07,1174)},100);
}
function update(dt){
  clock+=dt;moveFlippers(dt);
  if(G.flash>0)G.flash=Math.max(0,G.flash-dt*2.7);if(G.shake>0)G.shake=Math.max(0,G.shake-dt*3);if(gateCd>0)gateCd-=dt;
  for(var i=0;i<bumpers.length;i++){bumpers[i].cool=Math.max(0,bumpers[i].cool-dt);bumpers[i].flash=Math.max(0,bumpers[i].flash-dt*4)}
  for(var j=0;j<targets.length;j++)targets[j].flash=Math.max(0,targets[j].flash-dt*4);
  for(var p=parts.length-1;p>=0;p--){var q=parts[p];q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=180*dt;if(q.t>=q.life)parts.splice(p,1)}
  for(var f=floaters.length-1;f>=0;f--){floaters[f].t+=dt;floaters[f].y-=24*dt;if(floaters[f].t>=floaters[f].life)floaters.splice(f,1)}
  if(state!=='play')return;
  if(G.doubleTime>0)G.doubleTime=Math.max(0,G.doubleTime-dt);
  if(G.comboTime>0){G.comboTime-=dt;if(G.comboTime<=0)G.combo=0}
  if(G.targetRespawn>0){G.targetRespawn-=dt;if(G.targetRespawn<=0)resetTargets()}
  if(ball.ready){ball.x=board.x1-board.lane*.48;ball.y=board.y1-board.w*.13;if(rightDown||leftDown)charge=Math.min(1,charge+dt*.68)}
  else if(ball.alive){
    var speed=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy),n=Math.min(8,Math.max(2,Math.ceil(speed*dt/Math.max(2,ball.r*.48))));
    for(var s=0;s<n&&ball.alive;s++)physicsStep(dt/n);
    if(ball.alive){trail.push({x:ball.x,y:ball.y,t:0});if(trail.length>14)trail.shift()}
  }
  if(G.respawn>0){G.respawn-=dt;if(G.respawn<=0&&state==='play')placeBall()}
  for(var r=trail.length-1;r>=0;r--){trail[r].t+=dt;if(trail[r].t>.28)trail.splice(r,1)}
  syncHud();
}
/* ---------- 霓虹绘制 ---------- */

  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:定期把本游戏自己的最高分同步进共享的 __best
     (不用劫持 localStorage.setItem —— 那在部分环境下属性不可写会静默失败) */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['pinball_best','pinball_hi','pinball_max','pinball_score'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['pinball']||0)){
            B['pinball']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>

</body>
</html>
