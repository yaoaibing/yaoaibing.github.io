<script>
(function(){
'use strict';

/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='towe_best',PLAY='towe_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* ================== GAME · 塔防保卫战 ================== */
var TDEF=[
  {n:'箭塔',e:'🏹',cost:50,col:'#7ad0ff',costs:[0,55,110],
   st:[{dmg:9,cd:.42,rng:2.3},{dmg:16,cd:.36,rng:2.6},{dmg:26,cd:.30,rng:3.0}]},
  {n:'炮塔',e:'💣',cost:95,col:'#ffa04a',costs:[0,90,175],
   st:[{dmg:19,cd:1.15,rng:2.1,splash:.95},{dmg:33,cd:1.05,rng:2.3,splash:1.1},{dmg:54,cd:.95,rng:2.5,splash:1.3}]},
  {n:'冰塔',e:'❄️',cost:70,col:'#9fe8ff',costs:[0,70,140],
   st:[{dmg:5,cd:.70,rng:2.0,slow:.42},{dmg:8,cd:.65,rng:2.2,slow:.52},{dmg:12,cd:.60,rng:2.45,slow:.62}]}
];
var COLS=8,ROWS=12,CS=48,MAPX=0,MAPY=0,BARTOP=0;
var path=[],segs=[],cum=[],pathLen=0,blocked={};

var G={
  state:'start',phase:'prep',prepT:12,wave:0,maxWave:0,
  gold:140,life:20,kills:0,score:0,leaks:0,
  towers:[],enemies:[],bullets:[],parts:[],floats:[],
  spawnQ:[],spawnT:0,spawnGap:.85,
  sel:0,cur:null,shake:0,flash:0,hint:''
};

/* --- 地图 --- */
function key(c,r){return c+','+r}
function cellCx(c){return MAPX+c*CS+CS/2}
function cellCy(r){return MAPY+r*CS+CS/2}
function genPath(){                       // 逐行蛇行:每行只走一次,绝不自交
  var cells=[],c=rnd(COLS),r=0;
  cells.push({c:c,r:r});
  while(r<ROWS-1){
    var t=c+(-3+rnd(7));                  // 横向最多拐 3 格,路径更紧凑、留更多空地
    t=clamp(t,0,COLS-1);
    if(t===c)t=(c===0)?Math.min(3,COLS-1):(c===COLS-1?COLS-4:c-1);
    var st=t>c?1:-1;
    while(c!==t){c+=st;cells.push({c:c,r:r})}
    var dn=1+rnd(2);
    while(dn>0&&r<ROWS-1){r++;cells.push({c:c,r:r});dn--}
  }
  return cells;
}
function buildMap(){
  path=[];segs=[];cum=[];blocked={};pathLen=0;
  var cells=genPath();
  for(var i=0;i<cells.length;i++){
    path.push({x:cellCx(cells[i].c),y:cellCy(cells[i].r)});
    blocked[key(cells[i].c,cells[i].r)]=1;
  }
  cum.push(0);
  for(var j=0;j<path.length-1;j++){
    var dx=path[j+1].x-path[j].x,dy=path[j+1].y-path[j].y;
    var L=Math.sqrt(dx*dx+dy*dy);
    segs.push(L);pathLen+=L;cum.push(pathLen);
  }
}
function posAt(d){
  if(d<=0)return{x:path[0].x,y:path[0].y,ang:0};
  for(var i=0;i<segs.length;i++){
    if(d<=cum[i+1]){
      var u=(d-cum[i])/(segs[i]||1);
      return{x:path[i].x+(path[i+1].x-path[i].x)*u,
             y:path[i].y+(path[i+1].y-path[i].y)*u,
             ang:Math.atan2(path[i+1].y-path[i].y,path[i+1].x-path[i].x)};
    }
  }
  var last=path[path.length-1];
  return{x:last.x,y:last.y,ang:0};
}
function onResize(){
  MAPY=Math.max(64,Math.round(VH*0.085));
  BARTOP=VH-Math.max(84,Math.round(VH*0.115));
  CS=Math.floor(VW/COLS);
  var avail=BARTOP-MAPY-8;
  ROWS=Math.floor(avail/CS);
  if(ROWS<7){ROWS=7;CS=Math.floor(avail/7)}
  if(CS<28)CS=28;
  MAPX=Math.round((VW-CS*COLS)/2);
  buildMap();
  for(var k=G.towers.length-1;k>=0;k--){                 // 旋转后压在路上的塔直接回收
    var tw=G.towers[k];
    if(tw.c>=COLS||tw.r>=ROWS||blocked[key(tw.c,tw.r)])G.towers.splice(k,1);
  }
  for(var i=0;i<G.towers.length;i++){
    var t=G.towers[i];
    t.c=clamp(t.c,0,COLS-1);t.r=clamp(t.r,0,ROWS-1);
    t.x=cellCx(t.c);t.y=cellCy(t.r);
  }
}
/* --- 塔操作 --- */
function tStat(t){return TDEF[t.type].st[t.lv]}
function towerAt(c,r){
  for(var i=0;i<G.towers.length;i++)if(G.towers[i].c===c&&G.towers[i].r===r)return G.towers[i];
  return null;
}
function canBuild(c,r){
  if(c<0||c>=COLS||r<0||r>=ROWS)return false;
  if(blocked[key(c,r)])return false;
  if(towerAt(c,r))return false;
  return true;
}
function build(c,r){
  var d=TDEF[G.sel];
  if(G.gold<d.cost){G.hint='金币不够,再杀几只怪';tone(160,.1,'square',.05,110);return false}
  G.gold-=d.cost;
  G.towers.push({c:c,r:r,x:cellCx(c),y:cellCy(r),type:G.sel,lv:0,cd:0,ang:-Math.PI/2,spent:d.cost,pulse:1});
  addParts(cellCx(c),cellCy(r),d.col,10);
  addFloat(cellCx(c),cellCy(r)-CS*0.5,'-'+d.cost,'#ffd45c');
  tone(660,.08,'triangle',.05,880);
  return true;
}
function upgrade(t){
  if(t.lv>=2){G.hint='已经是满级了';return}
  var cost=TDEF[t.type].costs[t.lv+1];
  if(G.gold<cost){G.hint='升级要 '+cost+' 金币';tone(160,.1,'square',.05,110);return}
  G.gold-=cost;t.spent+=cost;t.lv++;t.pulse=1;
  addParts(t.x,t.y,TDEF[t.type].col,12);
  addFloat(t.x,t.y-CS*0.5,'LV'+(t.lv+1),'#8affc8');
  tone(880,.1,'sine',.06,1240);
}
function sell(t){
  var back=Math.floor(t.spent*0.6);
  G.gold+=back;
  addFloat(t.x,t.y-CS*0.5,'+'+back,'#ffd45c');
  G.towers.splice(G.towers.indexOf(t),1);
  G.cur=null;
  tone(420,.1,'triangle',.05,260);
}

/* --- 波次 --- */
function startPrep(){
  G.phase='prep';G.prepT=12;G.spawnQ=[];G.bossWave=((G.wave+1)%10===0);
  G.hint='第 '+(G.wave+1)+' 波准备中'+(G.bossWave?' · BOSS 波!':'');
}
function startWave(bonus){
  if(bonus){
    var extra=Math.ceil(G.prepT)*2;
    G.gold+=extra;addFloat(VW/2,BARTOP-14,'提前开波 +'+extra,'#ffd45c');
    tone(880,.09,'triangle',.05,1180);
  }
  G.wave++;if(G.wave>G.maxWave)G.maxWave=G.wave;
  lsSet('towe_wave',G.maxWave);
  var hp=Math.round(22*Math.pow(1.19,G.wave-1));
  var spd=Math.min(150,72+G.wave*1.4);
  var cnt=4+Math.floor(G.wave*1.5);
  var gold=5+Math.floor(G.wave*0.8);
  G.spawnQ=[];
  for(var i=0;i<cnt;i++)G.spawnQ.push({hp:hp,spd:spd,gold:gold,boss:false});
  if(G.wave%10===0){
    G.spawnQ.push({hp:hp*7,spd:spd*0.72,gold:90+G.wave*10,boss:true});
    G.hint='BOSS 来了!';
  }
  G.spawnGap=Math.max(.34,.9-G.wave*0.025);
  G.spawnT=.4;G.phase='wave';
  tone(523,.1,'sine',.05);
}
function spawn(){
  var q=G.spawnQ.shift();if(!q)return;
  G.enemies.push({d:0,x:path[0].x,y:path[0].y,hp:q.hp,max:q.hp,spd:q.spd,
    gold:q.gold,boss:q.boss,slow:0,slowAmt:0,hit:0,w:q.boss?CS*0.36:CS*0.24});
  if(q.boss){tone(120,.3,'sawtooth',.07,60);noise(.2,.06)}
}
function damage(e,dmg){
  e.hp-=dmg;e.hit=.12;
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  var i=G.enemies.indexOf(e);if(i<0)return;
  G.enemies.splice(i,1);
  G.gold+=e.gold;G.kills++;G.score+=e.gold*2;
  addFloat(e.x,e.y-8,'+'+e.gold,'#ffd45c');
  addParts(e.x,e.y,e.boss?'#ff7ad0':'#9ad8a8',e.boss?18:7);
  tone(e.boss?200:620,e.boss?.3:.06,'square',.05,e.boss?70:900);
  if(e.boss){G.shake=.35;addParts(e.x,e.y,'#ffd45c',14)}
}
function leak(e){
  var i=G.enemies.indexOf(e);if(i<0)return;
  G.enemies.splice(i,1);
  G.leaks++;G.life-=e.boss?5:1;G.shake=.4;G.flash=.35;
  addFloat(path[path.length-1].x,path[path.length-1].y-CS,'💥 -'+(e.boss?5:1),'#ff6a6a');
  noise(.2,.08);tone(180,.24,'sawtooth',.07,80);
  if(G.life<=0){G.life=0;gameOver()}
}

/* --- 表现 --- */
function addParts(x,y,col,n){
  n=Math.min(n,150-G.parts.length);
  for(var i=0;i<n;i++)G.parts.push({x:x,y:y,vx:(frnd()-.5)*230,vy:(frnd()-.5)*230-50,
    life:.35+frnd()*.45,col:col,s:2+frnd()*3});
}
function addFloat(x,y,txt,col){if(G.floats.length<16)G.floats.push({x:x,y:y,t:txt,c:col,life:1})}
function gameOver(){
  G.state='over';
  var isNew=KIT.setBest(G.score);
  $('onewrec').style.display=isNew?'block':'none';
  $('ostats').innerHTML=
    '本局得分 <b>'+G.score+'</b><br>'+
    '坚守波数 <b>第 '+G.wave+' 波</b><br>'+
    '消灭怪物 <b>'+G.kills+'</b> 只<br>'+
    '漏过怪物 <b>'+G.leaks+'</b> 只<br>'+
    '历史最高 <b>'+KIT.best()+'</b>';
  $('mini2').innerHTML='最高纪录 <b>第 '+(Math.max(G.maxWave,(+lsGet('towe_wave','0'))||0))+' 波</b> · 已玩 <b>'+KIT.plays()+'</b> 局 · 连续打卡 <b>'+KIT.streakNow()+'</b> 天 🔥';
  $('over').classList.remove('hide');
  tone(330,.16,'sine',.05);setTimeout(function(){tone(247,.3,'sine',.05)},170);
}
function startGame(){
  G.state='play';G.gold=140;G.life=20;G.wave=0;G.kills=0;G.score=0;G.leaks=0;
  G.towers=[];G.enemies=[];G.bullets=[];G.parts=[];G.floats=[];G.spawnQ=[];
  G.sel=0;G.cur=null;G.shake=0;G.flash=0;G.hint='';
  startPrep();
  $('start').classList.add('hide');$('over').classList.add('hide');
  KIT.addPlay();KIT.streak();
  run();
}

/* --- 更新 --- */
function updFx(dt){
  for(var q=G.parts.length-1;q>=0;q--){
    var pt=G.parts[q];pt.life-=dt;
    pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=420*dt;pt.vx*=.97;
    if(pt.life<=0)G.parts.splice(q,1);
  }
  for(var f=G.floats.length-1;f>=0;f--){
    var fl=G.floats[f];fl.life-=dt*.8;fl.y-=30*dt;
    if(fl.life<=0)G.floats.splice(f,1);
  }
}
function updTowers(dt){
  for(var i=0;i<G.towers.length;i++){
    var t=G.towers[i],df=TDEF[t.type],st=tStat(t),R=st.rng*CS;
    if(t.pulse>0)t.pulse-=dt*2.5;
    t.cd-=dt;
    // 选目标:走得最远的那个
    var best=null,bd=-1;
    for(var j=0;j<G.enemies.length;j++){
      var e=G.enemies[j],dx=e.x-t.x,dy=e.y-t.y;
      if(dx*dx+dy*dy<=R*R&&e.d>bd){bd=e.d;best=e}
    }
    if(best){
      t.ang=Math.atan2(best.y-t.y,best.x-t.x);
      if(t.cd<=0){
        t.cd=st.cd;
        G.bullets.push({x:t.x,y:t.y,tx:best.x,ty:best.y,e:best,spd:t.type===1?300:(t.type===2?420:520),
          type:t.type,dmg:st.dmg,splash:st.splash||0,slow:st.slow||0,col:df.col});
        tone(t.type===0?900:(t.type===1?300:620),.04,'square',.03,t.type===1?180:1100);
      }
    }
  }
}
function updBullets(dt){
  for(var i=G.bullets.length-1;i>=0;i--){
    var b=G.bullets[i];
    var alive=b.e&&G.enemies.indexOf(b.e)>=0;
    if(alive){b.tx=b.e.x;b.ty=b.e.y}
    var dx=b.tx-b.x,dy=b.ty-b.y,L=Math.sqrt(dx*dx+dy*dy)||1,step=b.spd*dt;
    if(L<=step){b.x=b.tx;b.y=b.ty;hit(b);G.bullets.splice(i,1);continue}
    b.x+=dx/L*step;b.y+=dy/L*step;
  }
}
function hit(b){
  if(b.type===1){                       // 炮塔:范围溅射
    var R=b.splash*CS;
    for(var i=G.enemies.length-1;i>=0;i--){
      var e=G.enemies[i],dx=e.x-b.x,dy=e.y-b.y;
      if(dx*dx+dy*dy<=R*R)damage(e,b.dmg);
    }
    addParts(b.x,b.y,'#ffb46a',12);addParts(b.x,b.y,'#ff6a3a',6);
    G.shake=Math.max(G.shake,.08);noise(.07,.05);
  }else{
    if(b.e&&G.enemies.indexOf(b.e)>=0){
      damage(b.e,b.dmg);
      if(b.type===2){b.e.slow=1.2;b.e.slowAmt=Math.max(b.e.slowAmt,b.slow)}
      addParts(b.x,b.y,b.type===2?'#bdf0ff':'#e8f4ff',5);
    }
  }
}
function update(dt){
  if(G.state!=='play'){updFx(dt);if(G.flash>0)G.flash-=dt;return}
  if(G.shake>0)G.shake-=dt;
  if(G.flash>0)G.flash-=dt;

  if(G.phase==='prep'){
    G.prepT-=dt;
    if(G.prepT<=0)startWave(false);
  }else{
    G.spawnT-=dt;
    if(G.spawnQ.length&&G.spawnT<=0){spawn();G.spawnT=G.spawnGap}
    if(!G.spawnQ.length&&!G.enemies.length){
      var bonus=18+G.wave*5;
      G.gold+=bonus;G.score+=bonus;
      addFloat(VW/2,MAPY+CS,'清怪奖励 +'+bonus,'#8affc8');
      tone(660,.1,'triangle',.05,990);
      startPrep();
    }
  }

  // 敌人
  for(var i=G.enemies.length-1;i>=0;i--){
    var e=G.enemies[i];
    if(e.slow>0){e.slow-=dt;if(e.slow<=0)e.slowAmt=0}
    if(e.hit>0)e.hit-=dt;
    e.d+=e.spd*(1-e.slowAmt)*dt;
    var p=posAt(e.d);
    e.x=p.x;e.y=p.y;
    if(e.d>=pathLen){leak(e)}
  }
  updTowers(dt);
  updBullets(dt);
  updFx(dt);
  syncHUD();
}
function syncHUD(){
  $('hgold').textContent=G.gold;
  $('hlife').textContent=G.life;
  $('hwave').textContent=G.wave;
}

/* --- 绘制 --- */
function drawMap(){
  // 草地网格
  ctx.fillStyle='#123a2a';
  ctx.fillRect(MAPX,MAPY,CS*COLS,CS*ROWS);
  ctx.strokeStyle='rgba(255,255,255,.045)';ctx.lineWidth=1;
  for(var c=0;c<=COLS;c++){
    ctx.beginPath();ctx.moveTo(MAPX+c*CS,MAPY);ctx.lineTo(MAPX+c*CS,MAPY+CS*ROWS);ctx.stroke();
  }
  for(var r=0;r<=ROWS;r++){
    ctx.beginPath();ctx.moveTo(MAPX,MAPY+r*CS);ctx.lineTo(MAPX+CS*COLS,MAPY+r*CS);ctx.stroke();
  }
  // 路径
  ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);
  for(var i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y);
  ctx.strokeStyle='#3b2a1c';ctx.lineWidth=CS*0.78;ctx.stroke();
  ctx.strokeStyle='#6b503a';ctx.lineWidth=CS*0.62;ctx.stroke();
  // 路径圆点
  ctx.fillStyle='rgba(255,220,160,.35)';
  for(var j=0;j<path.length;j++){
    ctx.beginPath();ctx.arc(path[j].x,path[j].y,CS*0.09,0,6.2832);ctx.fill();
  }
  // 起点 / 基地
  ctx.fillStyle='#ffd45c';
  ctx.beginPath();ctx.arc(path[0].x,path[0].y,CS*0.3,0,6.2832);ctx.fill();
  ctx.fillStyle='#4a3a1a';ctx.font='900 '+(CS*0.34)+'px system-ui';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('起',path[0].x,path[0].y);
  drawBase(path[path.length-1].x,path[path.length-1].y);
}
function drawBase(x,y){
  var w=CS*0.86,h=CS*0.72;
  ctx.fillStyle='#8a94ad';ctx.fillRect(x-w/2,y-h/2,w,h);
  ctx.fillStyle='#aeb8d0';ctx.fillRect(x-w/2,y-h/2,w,h*0.28);
  ctx.fillStyle='#6a7490';
  for(var i=0;i<4;i++)ctx.fillRect(x-w/2+i*(w/4)+w/16,y-h/2,w/8,h*0.34);
  ctx.fillStyle='#2b3350';ctx.fillRect(x-w*0.16,y+h*0.08,w*0.32,h*0.42);
  // 血条
  var bw=CS*0.9,bh=6,ratio=clamp(G.life/20,0,1);
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x-bw/2,y-h/2-11,bw,bh);
  ctx.fillStyle=ratio>.5?'#5ad88a':(ratio>.25?'#ffd45c':'#ff6a6a');
  ctx.fillRect(x-bw/2,y-h/2-11,bw*ratio,bh);
}
function drawTower(t){
  var df=TDEF[t.type],st=tStat(t);
  // 底座
  ctx.fillStyle='#20302a';
  ctx.beginPath();ctx.arc(t.x,t.y+CS*0.06,CS*0.4,0,6.2832);ctx.fill();
  ctx.fillStyle=df.col;
  ctx.beginPath();ctx.arc(t.x,t.y,CS*0.36,0,6.2832);ctx.fill();
  if(t.pulse>0){
    ctx.strokeStyle='rgba(255,255,255,'+t.pulse+')';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(t.x,t.y,CS*(0.4+t.pulse*0.3),0,6.2832);ctx.stroke();
  }
  // 等级点
  for(var i=0;i<=t.lv;i++){
    ctx.fillStyle='#ffd45c';
    ctx.beginPath();ctx.arc(t.x-(t.lv*4)+i*8,t.y+CS*0.3,2.4,0,6.2832);ctx.fill();
  }
  // 炮口
  ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.ang);
  ctx.fillStyle='#f2f8ff';
  if(t.type===0)ctx.fillRect(0,-CS*0.07,CS*0.46,CS*0.14);
  else if(t.type===1)ctx.fillRect(0,-CS*0.1,CS*0.42,CS*0.2);
  else ctx.fillRect(0,-CS*0.09,CS*0.4,CS*0.18);
  ctx.fillStyle=df.col;
  ctx.beginPath();ctx.arc(0,0,CS*0.19,0,6.2832);ctx.fill();
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.font='900 '+(CS*0.3)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(df.e,t.x,t.y+1);
}
function drawEnemy(e){
  var r=e.w;
  if(e.slow>0){
    ctx.strokeStyle='rgba(140,220,255,.85)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(e.x,e.y,r+3,0,6.2832);ctx.stroke();
  }
  ctx.fillStyle=e.boss?'#c8508f':(e.slow>0?'#7fb6d8':'#5b8f66');
  ctx.beginPath();ctx.arc(e.x,e.y,r,0,6.2832);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.22)';
  ctx.beginPath();ctx.arc(e.x-r*0.3,e.y-r*0.3,r*0.42,0,6.2832);ctx.fill();
  ctx.fillStyle='#12261a';
  ctx.fillRect(e.x-r*0.5,e.y-r*0.16,r*0.28,r*0.28);
  ctx.fillRect(e.x+r*0.22,e.y-r*0.16,r*0.28,r*0.28);
  if(e.boss){
    ctx.fillStyle='#ffd45c';
    ctx.beginPath();ctx.moveTo(e.x-r*0.6,e.y-r*0.7);ctx.lineTo(e.x-r*0.2,e.y-r*1.15);
    ctx.lineTo(e.x,e.y-r*0.7);ctx.lineTo(e.x+r*0.2,e.y-r*1.15);ctx.lineTo(e.x+r*0.6,e.y-r*0.7);
    ctx.closePath();ctx.fill();
  }
  if(e.hit>0){ctx.fillStyle='rgba(255,255,255,'+(e.hit*4)+')';ctx.beginPath();ctx.arc(e.x,e.y,r,0,6.2832);ctx.fill()}
  // 血条
  var bw=r*2.1,bh=Math.max(3,r*0.24),ratio=clamp(e.hp/e.max,0,1);
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(e.x-bw/2,e.y-r-bh-3,bw,bh);
  ctx.fillStyle=ratio>.5?'#5ad88a':(ratio>.25?'#ffd45c':'#ff6a6a');
  ctx.fillRect(e.x-bw/2,e.y-r-bh-3,bw*ratio,bh);
}
function drawBar(){
  var top=BARTOP+4,h=Math.max(72,Math.round(VH*0.1));
  ctx.fillStyle='rgba(8,26,18,.9)';
  ctx.fillRect(0,BARTOP,VW,VH-BARTOP);
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,BARTOP);ctx.lineTo(VW,BARTOP);ctx.stroke();
  var slotW=(VW-16-3*6-70)/3;
  // 塔卡
  for(var i=0;i<3;i++){
    var x=8+i*(slotW+6),d=TDEF[i];
    var afford=G.gold>=d.cost,on=(G.sel===i);
    ctx.fillStyle=afford?(on?'rgba(124,240,176,.28)':'rgba(255,255,255,.1)'):'rgba(255,255,255,.05)';
    ctx.fillRect(x,top,slotW,h-8);
    if(on){ctx.strokeStyle='#7cf0b0';ctx.lineWidth=2;ctx.strokeRect(x+1,top+1,slotW-2,h-10)}
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=(CS*0.34)+'px system-ui';ctx.fillStyle='#fff';
    ctx.fillText(d.e,x+slotW/2,top+h*0.32);
    ctx.font='900 13px system-ui';
    ctx.fillStyle=afford?'#fff':'rgba(255,255,255,.4)';
    ctx.fillText(d.n,x+slotW/2,top+h*0.58);
    ctx.font='900 12px system-ui';
    ctx.fillStyle=afford?'#ffd45c':'#ff6a6a';
    ctx.fillText('💰'+d.cost,x+slotW/2,top+h*0.78);
  }
  // 开始 / 倒计时
  var gx=VW-70-8,gw=70;
  var prep=G.phase==='prep';
  ctx.fillStyle=prep?'rgba(124,240,176,.3)':'rgba(255,255,255,.08)';
  ctx.fillRect(gx,top,gw,h-8);
  if(prep){ctx.strokeStyle='#7cf0b0';ctx.lineWidth=2;ctx.strokeRect(gx+1,top+1,gw-2,h-10)}
  ctx.textAlign='center';
  ctx.font='900 20px system-ui';ctx.fillStyle=prep?'#fff':'rgba(255,255,255,.35)';
  ctx.fillText(prep?Math.ceil(G.prepT)+'':'…',gx+gw/2,top+h*0.3);
  ctx.font='800 11px system-ui';ctx.fillStyle=prep?'#ffd45c':'rgba(255,255,255,.3)';
  ctx.fillText(prep?'提前开波':'出怪中',gx+gw/2,top+h*0.62);
  if(prep){
    ctx.font='800 10px system-ui';ctx.fillStyle='rgba(255,255,255,.7)';
    ctx.fillText('+'+(Math.ceil(G.prepT)*2)+'💰',gx+gw/2,top+h*0.8);
  }
}
function drawRange(x,y,r,col){
  ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.setLineDash([5,6]);
  ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.stroke();
  ctx.setLineDash([]);
}
function drawPanel(){
  var t=G.cur;if(!t)return;
  drawRange(t.x,t.y,tStat(t).rng*CS,TDEF[t.type].col);
  var bw=Math.min(132,VW*0.4),bh=30,top=t.y-CS*0.5-bh*2-6;
  var x=clamp(t.x-bw/2,6,VW-bw-6);
  if(top<MAPY)top=t.y+CS*0.5;
  // 升级
  var maxed=t.lv>=2,cost=TDEF[t.type].costs[t.lv+1];
  ctx.fillStyle=maxed?'rgba(255,255,255,.1)':(G.gold>=cost?'rgba(124,240,176,.35)':'rgba(255,255,255,.12)');
  ctx.fillRect(x,top,bw,bh);
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;ctx.strokeRect(x,top,bw,bh);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='900 13px system-ui';ctx.fillStyle='#fff';
  ctx.fillText(maxed?'已满级':('⬆ 升级 💰'+cost),x+bw/2,top+bh/2);
  // 出售
  ctx.fillStyle='rgba(255,150,90,.28)';
  ctx.fillRect(x,top+bh+4,bw,bh);
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.strokeRect(x,top+bh+4,bw,bh);
  ctx.fillStyle='#fff';
  ctx.fillText('💵 出售 +'+Math.floor(t.spent*0.6),x+bw/2,top+bh+4+bh/2);
}
function draw(){
  ctx.save();
  if(G.shake>0)ctx.translate((frnd()-.5)*9*G.shake*3,(frnd()-.5)*9*G.shake*3);
  var g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#1b4433');g.addColorStop(.55,'#123a2a');g.addColorStop(1,'#0a2018');
  ctx.fillStyle=g;ctx.fillRect(-14,-14,VW+28,VH+28);

  drawMap();
  // 建造预览
  if(G.state==='play'&&G.preview&&!G.cur){
    var pv=G.preview;
    drawRange(pv.x,pv.y,TDEF[G.sel].st[0].rng*CS,G.gold>=TDEF[G.sel].cost?'rgba(124,240,176,.5)':'rgba(255,90,90,.5)');
  }
  for(var i=0;i<G.towers.length;i++)drawTower(G.towers[i]);
  drawPanel();

  for(var b=0;b<G.bullets.length;b++){
    var bu=G.bullets[b];
    ctx.fillStyle=bu.col;
    if(bu.type===1){
      ctx.beginPath();ctx.arc(bu.x,bu.y,CS*0.11,0,6.2832);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.6)';
      ctx.beginPath();ctx.arc(bu.x-CS*0.03,bu.y-CS*0.03,CS*0.04,0,6.2832);ctx.fill();
    }else{
      ctx.beginPath();ctx.arc(bu.x,bu.y,bu.type===2?CS*0.07:CS*0.05,0,6.2832);ctx.fill();
    }
  }
  for(var e=0;e<G.enemies.length;e++)drawEnemy(G.enemies[e]);
  for(var p=0;p<G.parts.length;p++){
    var pt=G.parts[p];
    ctx.globalAlpha=clamp(pt.life*1.9,0,1);
    ctx.fillStyle=pt.col;ctx.fillRect(pt.x,pt.y,pt.s,pt.s);
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(var f=0;f<G.floats.length;f++){
    var fl=G.floats[f];
    ctx.globalAlpha=clamp(fl.life,0,1);
    ctx.font='900 14px system-ui';ctx.fillStyle=fl.c;
    ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=3;
    ctx.strokeText(fl.t,fl.x,fl.y);ctx.fillText(fl.t,fl.x,fl.y);
  }
  ctx.globalAlpha=1;
  drawBar();
  // 顶部提示条
  if(G.state==='play'&&G.hint){
    ctx.font='900 13px system-ui';
    ctx.fillStyle='rgba(0,0,0,.35)';
    var tw=ctx.measureText(G.hint).width+24;
    ctx.fillRect(VW/2-tw/2,MAPY-CS*0.62,tw,20);
    ctx.fillStyle='#ffe6a8';
    ctx.fillText(G.hint,VW/2,MAPY-CS*0.62+10);
  }
  if(G.flash>0){ctx.fillStyle='rgba(255,60,60,'+(G.flash*.45)+')';ctx.fillRect(-14,-14,VW+28,VH+28)}
  ctx.restore();
}

/* --- 输入 --- */
function tapPoint(e){
  var t=(e.touches&&e.touches[0])||e;
  return {x:t.clientX,y:t.clientY};
}
function panelHit(t,px,py){
  if(!t)return null;
  var bw=Math.min(132,VW*0.4),bh=30,top=t.y-CS*0.5-bh*2-6;
  var x=clamp(t.x-bw/2,6,VW-bw-6);
  if(top<MAPY)top=t.y+CS*0.5;
  if(px>=x&&px<=x+bw&&py>=top&&py<=top+bh)return 'up';
  if(px>=x&&px<=x+bw&&py>=top+bh+4&&py<=top+bh+4+bh)return 'sell';
  return null;
}
function handleTap(px,py){
  if(G.state!=='play')return;
  var ph=panelHit(G.cur,px,py);
  if(G.cur){
    if(ph==='up'){upgrade(G.cur);return}
    if(ph==='sell'){sell(G.cur);return}
    G.cur=null;
  }
  if(py>=BARTOP){                       // 底部按钮区
    var slotW=(VW-16-3*6-70)/3;
    for(var i=0;i<3;i++){
      var x=8+i*(slotW+6);
      if(px>=x&&px<=x+slotW){G.sel=i;tone(720,.05,'triangle',.04,900);return}
    }
    var gx=VW-70-8;
    if(px>=gx&&G.phase==='prep')startWave(true);
    return;
  }
  if(py<MAPY||py>MAPY+CS*ROWS)return;
  var c=Math.floor((px-MAPX)/CS),r=Math.floor((py-MAPY)/CS);
  if(c<0||c>=COLS||r<0||r>=ROWS)return;
  var existing=towerAt(c,r);
  if(existing){G.cur=existing;tone(600,.05,'sine',.04);return}
  if(!canBuild(c,r)){
    G.hint=blocked[key(c,r)]?'这里是怪物走的路面,不能建塔':'边界外,换块空地';
    tone(160,.08,'square',.04,110);return;
  }
  if(build(c,r))G.cur=null;
}
cv.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  var p=tapPoint(e);
  handleTap(p.x,p.y);
},{passive:true});
cv.addEventListener('pointermove',function(e){
  if(e.pointerType!=='mouse')return;
  var p=tapPoint(e);
  if(G.state!=='play'||p.y>=BARTOP||p.y<MAPY||p.y>MAPY+CS*ROWS){G.preview=null;return}
  var c=Math.floor((p.x-MAPX)/CS),r=Math.floor((p.y-MAPY)/CS);
  G.preview=(c>=0&&c<COLS&&r>=0&&r<ROWS&&canBuild(c,r))?{c:c,r:r,x:cellCx(c),y:cellCy(r)}:null;
},{passive:true});
window.addEventListener('keydown',function(e){
  if(G.state!=='play'){if(e.key===' '||e.key==='Enter')startGame();return}
  if(e.key==='1'||e.key==='2'||e.key==='3'){G.sel=+e.key-1;return}
  if(e.key===' '||e.key==='Enter'){
    if(G.phase==='prep')startWave(true);
  }else return;
  e.preventDefault();
});

/* --- 启动 --- */
$('startbtn').addEventListener('click',startGame);
$('againbtn').addEventListener('click',startGame);
$('hubbtn').addEventListener('click',function(){location.href='/'});
$('sharebtn').addEventListener('click',function(){
  share('我在「塔防保卫战」守到第 '+G.wave+' 波,消灭 '+G.kills+' 只怪、拿了 '+G.score+' 分!你能撑更久吗? https://yaoaibing.github.io/tower/');
});
$('mini').innerHTML='历史最高 <b>'+KIT.best()+'</b> 分 · 最高 <b>第 '+((+lsGet('towe_wave','0'))||0)+'</b> 波 · 已玩 <b>'+KIT.plays()+'</b> 局'+
  (KIT.streakNow()>1?' · 连续打卡 <b>'+KIT.streakNow()+'</b> 天 🔥':'');
resize();onResize();syncHUD();draw();run();
})();
</script>



















<!-- __hub_enhance__ -->
<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';
  var name=(document.title||'游戏').split(/[ ··|]/)[0];

  // 回大厅
  var hb=document.createElement('button');
  hb.setAttribute('type','button');hb.textContent='\uD83C\uDFE0';
  hb.style.cssText='position:fixed;top:'+SAFE+';left:10px;z-index:99;border:0;width:36px;height:36px;'+
    'border-radius:12px;font-size:15px;background:rgba(255,255,255,.14);color:#fff;'+
    'border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);cursor:pointer';
  hb.onclick=function(){location.href='/'};
  document.body.appendChild(hb);

  // 结算页:晒战绩 + 换个游戏
  var over=document.getElementById('over');
  if(over){
    var box=document.createElement('div');
    box.style.cssText='display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px';
    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>


<!-- __hub_recent__ -->
<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='tower'});
  r.unshift({k:'tower',n:'塔防保卫战',e:'🏰'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:定期把本游戏自己的最高分同步进共享的 __best
     (不用劫持 localStorage.setItem —— 那在部分环境下属性不可写会静默失败) */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['towe_best','towe_hi','towe_max','towe_score'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['tower']||0)){
            B['tower']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
