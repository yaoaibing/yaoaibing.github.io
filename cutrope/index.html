<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='cutrope_best',PLAY='cutrope_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 割绳子 · 糖果快递 ================== */
var NAME = '割绳子 · 糖果快递';
var state = 'start';
var level = 0, stars = 0, totalStars = 0, tries = 0;
var ropes = [];                  /* 每根:{ax,ay,seg:[{x,y,px,py}..], len} 末端连糖果 */
var candy = { x: 0, y: 0, vx: 0, vy: 0, held: [] };
var starMap = [];                /* {x,y,got} */
var monster = { x: 0, y: 0 };
var winT = 0, pauseT = 0, msg = '', msgT = 0, starsFx = [];
var GRAV = 900;

/* 15 关:锚点(比例坐标),绳段数,糖果初始挂点,星星,小怪 */
var LEVELS = [
  { a: [[.5, .18]], segs: 6, m: [.5, .78], s: [[.5, .45]] },
  { a: [[.3, .16]], segs: 7, m: [.62, .75], s: [[.45, .4], [.55, .55]] },
  { a: [[.7, .16]], segs: 7, m: [.35, .75], s: [[.52, .42]] },
  { a: [[.5, .14], [.5, .5]], segs: [5, 4], m: [.5, .84], s: [[.5, .35]] },
  { a: [[.25, .15]], segs: 8, m: [.7, .7], s: [[.42, .38], [.58, .5], [.68, .62]] },
  { a: [[.6, .14], [.85, .38]], segs: [6, 4], m: [.3, .75], s: [[.45, .45]] },
  { a: [[.4, .13]], segs: 8, m: [.5, .8], s: [[.5, .3], [.5, .5], [.5, .66]] },
  { a: [[.2, .14], [.55, .22]], segs: [7, 6], m: [.75, .78], s: [[.4, .45], [.6, .55]] },
  { a: [[.5, .12]], segs: 10, m: [.5, .86], s: [[.35, .4], [.65, .4]] },
  { a: [[.3, .13], [.7, .13]], segs: [8, 8], m: [.5, .85], s: [[.5, .4], [.4, .58], [.6, .58]] },
  { a: [[.18, .2]], segs: 9, m: [.6, .72], s: [[.32, .4], [.48, .55], [.6, .65]] },
  { a: [[.45, .13], [.75, .3]], segs: [8, 5], m: [.25, .8], s: [[.4, .42], [.55, .58]] },
  { a: [[.5, .12], [.2, .3], [.8, .3]], segs: [9, 6, 6], m: [.5, .88], s: [[.5, .38], [.35, .52], [.65, .52]] },
  { a: [[.28, .14]], segs: 11, m: [.62, .74], s: [[.4, .35], [.5, .5], [.6, .65]] },
  { a: [[.5, .12], [.35, .35], [.65, .35]], segs: [10, 7, 7], m: [.5, .9], s: [[.5, .36], [.4, .55], [.6, .55]] }
];

function layout() { }
function onResize() { }

function loadLevel(n) {
  var L = LEVELS[n];
  ropes = [];
  var i, j;
  var ropeLen = VH * .34;
  var c0x = L.a[0][0] * VW, c0y = L.a[0][1] * VH + ropeLen;
  for (i = 0; i < L.a.length; i++) {
    var ax = L.a[i][0] * VW, ay = L.a[i][1] * VH;
    var segs = Array.isArray(L.segs) ? L.segs[i] : L.segs;
    var chain = [];
    for (j = 0; j <= segs; j++) {
      var t = j / segs;
      var cx = ax + (c0x - ax) * t, cy = ay + (c0y - ay) * t;
      chain.push({ x: cx, y: cy, px: cx, py: cy });
    }
    var segLen = Math.hypot(c0x - ax, c0y - ay) / segs;
    ropes.push({ ax: ax, ay: ay, seg: chain, segLen: segLen });
  }
  candy = { x: c0x, y: c0y, vx: 0, vy: 0, held: ropes.map(function (r2, k) { return k; }) };
  starMap = [];
  for (i = 0; i < L.s.length; i++) starMap.push({ x: L.s[i][0] * VW, y: L.s[i][1] * VH, got: false });
  monster = { x: L.m[0] * VW, y: L.m[1] * VH };
  msg = ''; msgT = 0;
  syncHud();
}
function resetGame() {
  level = 0; totalStars = 0; tries = 0;
  stars = 0;
  loadLevel(0);
}
function startGame() {
  resetGame();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}
function endGame() {
  state = 'over';
  winT = 1;
  KIT.addPlay(); KIT.streak();
  var score = level * 100 + totalStars * 20;
  var rec = KIT.setBest(score);
  var rank = level >= 15 ? '糖果大师' : level >= 10 ? '割绳高手' : level >= 5 ? '渐入佳境' : '甜甜起步';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '通过 <b>' + level + '/15</b> 关<br>' +
    '收集星星 ' + totalStars + ' 颗<br>本局得分 <b>' + score + '</b><br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '荡到最低点割绳飞得远,双绳先割短绳';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  tone(700, .3, 'sine', .07, 1200);
}
function syncHud() {
  $('hlv').textContent = (level + 1) + '/15';
  $('hstar').textContent = stars;
  $('hstars').textContent = totalStars;
}
function nextLevel() {
  if (level >= LEVELS.length - 1) { endGame(); return; }
  level++;
  totalStars += stars;
  stars = 0;
  loadLevel(level);
  syncHud();
}
function retry(msg2) {
  tries++;
  stars = 0;
  loadLevel(level);
  if (msg2) { msg = msg2; msgT = 1.2; }
}
function update(dt) {
  var i, j, k;
  for (i = starsFx.length - 1; i >= 0; i--) { starsFx[i].t -= dt; if (starsFx[i].t <= 0) starsFx.splice(i, 1); }
  if (msgT > 0) msgT -= dt;
  if (winT > 0) winT -= dt;
  if (state !== 'play') return;
  if (pauseT > 0) { pauseT -= dt; return; }

  /* 绳子 verlet:锚点固定,向糖果端逐段约束 */
  for (i = 0; i < ropes.length; i++) {
    var rp = ropes[i];
    var seg = rp.seg;
    for (j = 1; j < seg.length; j++) {
      var pt = seg[j];
      if (j === seg.length - 1 && candy.held.indexOf(i) < 0) continue; /* 已割断的绳不再拉糖 */
      var vx2 = (pt.x - pt.px) * .995, vy2 = (pt.y - pt.py) * .995;
      pt.px = pt.x; pt.py = pt.y;
      pt.x += vx2; pt.y += vy2 + GRAV * dt * dt;
    }
    seg[0].x = rp.ax; seg[0].y = rp.ay;
    for (k = 0; k < 3; k++) {
      for (j = 1; j < seg.length; j++) {
        var a = seg[j - 1], b2 = seg[j];
        var dx = b2.x - a.x, dy = b2.y - a.y;
        var d = Math.hypot(dx, dy) || 1;
        var diff = (d - rp.segLen) / d;
        if (j === seg.length - 1 && candy.held.indexOf(i) < 0) {
          b2.x -= dx * diff; b2.y -= dy * diff;
        } else if (j === seg.length - 1) {
          a.x += dx * diff * .5; a.y += dy * diff * .5;
          b2.x -= dx * diff * .5; b2.y -= dy * diff * .5;
        } else {
          a.x += dx * diff * .5; a.y += dy * diff * .5;
          b2.x -= dx * diff * .5; b2.y -= dy * diff * .5;
        }
      }
      seg[0].x = rp.ax; seg[0].y = rp.ay;
    }
    /* 断绳尾端自由摆动也受重力 */
  }
  /* 糖果:被任一未割绳末端拖动 */
  var heldIdx = -1;
  for (i = 0; i < ropes.length; i++) {
    if (candy.held.indexOf(i) >= 0) { heldIdx = i; break; }
  }
  if (heldIdx >= 0) {
    var tail = ropes[heldIdx].seg[ropes[heldIdx].seg.length - 1];
    candy.x = tail.x; candy.y = tail.y;
    candy.vx = tail.x - tail.px; candy.vy = tail.y - tail.py;
  } else {
    /* 自由落体 */
    candy.vy += GRAV * dt * dt;
    candy.x += candy.vx;
    candy.y += candy.vy;
  }
  /* 星星 */
  for (i = 0; i < starMap.length; i++) {
    var st = starMap[i];
    if (!st.got && Math.hypot(st.x - candy.x, st.y - candy.y) < 30) {
      st.got = true;
      stars++; totalStars++;
      starsFx.push({ x: st.x, y: st.y, t: .5 });
      tone(760, .12, 'sine', .05);
      syncHud();
    }
  }
  /* 进嘴 / 丢失 */
  if (Math.hypot(monster.x - candy.x, monster.y - candy.y) < 34) {
    msg = '好吃!'; msgT = 1.4;
    tone(680, .2, 'sine', .06, 1100);
    pauseT = .65;
    setTimeout(function () { if (state === 'play') nextLevel(); }, 650);
    return;
  }
  if (candy.y > VH + 40 || candy.x < -40 || candy.x > VW + 40) {
    retry('糖果飞了,再试一次');
  }
}
function rr(x, y, w, h, rad) {
  var k = Math.min(rad, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#241019');
  bg.addColorStop(1, '#0e0510');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);

  var i, j;
  /* 绳子 */
  for (i = 0; i < ropes.length; i++) {
    var seg = ropes[i].seg;
    ctx.strokeStyle = 'rgba(240,200,140,.8)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(seg[0].x, seg[0].y);
    for (j = 1; j < seg.length; j++) ctx.lineTo(seg[j].x, seg[j].y);
    ctx.stroke();
    /* 锚点 */
    ctx.fillStyle = 'rgba(240,200,140,.9)';
    ctx.beginPath(); ctx.arc(seg[0].x, seg[0].y, 5, 0, Math.PI * 2); ctx.fill();
  }
  /* 星星 */
  for (i = 0; i < starMap.length; i++) {
    var st = starMap[i];
    ctx.globalAlpha = st.got ? .18 : 1;
    drawEm('⭐', st.x, st.y, 30);
    ctx.globalAlpha = 1;
  }
  for (i = 0; i < starsFx.length; i++) {
    ctx.globalAlpha = starsFx[i].t * 2;
    ctx.font = '900 16px "PingFang SC",sans-serif';
    ctx.fillStyle = '#ffd45c';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('+⭐', starsFx[i].x, starsFx[i].y - (0.5 - starsFx[i].t) * 40);
    ctx.globalAlpha = 1;
  }
  /* 小怪 */
  var open = Math.hypot(monster.x - candy.x, monster.y - candy.y) < 90 ? 1.15 : 1;
  drawEm('😋', monster.x, monster.y, 52 * open);
  /* 糖果 */
  drawEm('🍬', candy.x, candy.y, 34);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = msgT > 0 ? 'rgba(255,217,232,.95)' : 'rgba(255,217,232,.55)';
  ctx.fillText(msg || '点绳子割断,把糖送进嘴里!', VW / 2, VH - 58);
}
function ropeAt(x, y) {
  var i, j;
  for (i = 0; i < ropes.length; i++) {
    var seg = ropes[i].seg;
    if (candy.held.indexOf(i) < 0) continue;
    for (j = 0; j < seg.length - 1; j++) {
      var ax = seg[j].x, ay = seg[j].y, bx = seg[j + 1].x, by = seg[j + 1].y;
      var dx = bx - ax, dy = by - ay;
      var L2 = dx * dx + dy * dy;
      var t = L2 ? clamp(((x - ax) * dx + (y - ay) * dy) / L2, 0, 1) : 0;
      var cx2 = ax + dx * t, cy2 = ay + dy * t;
      if (Math.hypot(x - cx2, y - cy2) < 22) return i;
    }
  }
  return -1;
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play' || pauseT > 0) return;
  var i = ropeAt(e.clientX, e.clientY);
  if (i >= 0) {
    var k = candy.held.indexOf(i);
    if (k >= 0) candy.held.splice(k, 1);
    tone(500, .08, 'triangle', .05);
    msg = '咔嚓!'; msgT = .6;
  }
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); retry('本关已重置'); }
});
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', startGame);
$('retrybtn').addEventListener('click', function () { retry('本关已重置'); });
$('newbtn').addEventListener('click', startGame);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」通关到第 ' + (level + 1) + ' 关,收集 ' + totalStars + ' 颗星星! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  candy: function () { return { x: Math.round(candy.x), y: Math.round(candy.y) }; },
  ropes: function () { return ropes.length; },
  held: function () { return candy.held.slice(); },
  cut: function (i) {
    var k = candy.held.indexOf(i);
    if (k >= 0) candy.held.splice(k, 1);
  },
  starCount: function () { return starMap.filter(function (s2) { return s2.got; }).length; },
  level: function () { return level; },
  setLevel: function (n) { level = n; loadLevel(n); },
  step: function (n) { for (var i = 0; i < n; i++) update(1 / 60); },
  state: function () { return state; }
};
resize();
resetGame();
$('padbar').classList.add('hide');
updMini();
run();

})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='cutrope'});
  r.unshift({k:'cutrope',n:'割绳子 · 糖果快递',e:'🍬'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['cutrope_best','cutrope_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['cutrope']||0)){
            B['cutrope']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
