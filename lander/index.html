<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='lander_best',PLAY='lander_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 登月着陆 · 软着陆挑战 ================== */
var NAME = '登月着陆 · 太空驾驶员';
var state = 'start';
var level = 1, score = 0;
var L = null;                /* 着陆舱 {x,y,vx,vy,ang,fuel} */
var terrain = [], padX = 0, padW = 90, padY = 0;
var wind = 0, windShow = 0;
var thrusting = false, rotL = false, rotR = false;
var GY = 55, THRUST = 130, ROT = 2.6;
var msg = '', msgT = 0, shake = 0, flame = 0;
var stars = [];
var VW2 = 0, done = false;

function layout() { VW2 = VW; }
function onResize() { layout(); genStars(); if (terrain.length) genTerrain(level, true); }

function genStars() {
  stars = [];
  for (var i = 0; i < 70; i++) stars.push({ x: frnd() * VW, y: frnd() * VH * .7, r: frnd() * 1.3 + .4 });
}
function terrainY(x) {
  var n = terrain.length - 1;
  var t = clamp(x / VW, 0, 1) * n;
  var i = Math.floor(t);
  if (i >= n) return terrain[n];
  var f = t - i;
  return terrain[i] + (terrain[i + 1] - terrain[i]) * f;
}
function genTerrain(lv, keepShape) {
  var old = terrain.slice();
  terrain = [];
  var n = 26, i;
  for (i = 0; i <= n; i++) terrain.push(0);
  padW = Math.max(64, 130 - lv * 9);
  padX = 40 + frnd() * (VW - 80 - padW);
  var base = VH - 120;
  for (i = 0; i <= n; i++) {
    var x = i / n * VW;
    if (x >= padX - 2 && x <= padX + padW + 2) terrain[i] = base - 30 - (lv % 3) * 12;
    else terrain[i] = base - 40 - frnd() * (70 + lv * 6);
  }
  padY = terrain[Math.round((padX + padW / 2) / VW * n)];
  if (keepShape && old.length) { /* 旋转屏幕时保持形状,只重映射宽度 */ }
  wind = lv >= 3 ? (frnd() * 2 - 1) * (12 + lv * 3) : 0;
  windShow = Math.round(wind);
}
function newShip(lv) {
  L = {
    x: VW * (.2 + frnd() * .6),
    y: 80,
    vx: (frnd() * 2 - 1) * (26 + lv * 4),
    vy: 20,
    ang: 0,
    fuel: Math.max(46, 100 - (lv - 1) * 9)
  };
}
function resetGame() {
  level = 1; score = 0; done = false;
  genStars();
  genTerrain(1);
  newShip(1);
  msg = ''; msgT = 0; shake = 0;
  syncHud();
}
function startGame() {
  resetGame();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
}
function nextLevel() {
  score += 200 + Math.round(L.fuel) * 3 + (Math.abs(L.vy) < 12 ? 100 : 0);
  level++;
  genTerrain(level);
  newShip(level);
  msg = '着陆成功!进入第 ' + level + ' 关';
  msgT = 2;
  syncHud();
  tone(700, .25, 'sine', .07, 1250);
}
function crash(reason) {
  state = 'over';
  shake = .5;
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '任务得分 <b>' + score + '</b><br>' +
    '成功着陆 ' + (level - 1) + ' 次<br>失败原因:' + reason + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '燃料烧在半路,最后两百米只做微调';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  noise(.3, .08);
  tone(120, .4, 'sawtooth', .07, 60);
}
function landCheck() {
  var lx = L.x, ly = L.y + 15;
  var ground = terrainY(lx);
  var onPad = lx >= padX && lx <= padX + padW;
  if (ly >= ground) {
    if (!onPad) { crash('偏离平台'); return; }
    var fast = Math.abs(L.vy) >= 25, drift = Math.abs(L.vx) >= 15, tilt = Math.abs(L.ang) > .38;
    if (fast || drift || tilt) { crash(fast ? '落地太重' : drift ? '横向太快' : '姿态倾倒'); return; }
    L.y = ground - 15;
    nextLevel();
  }
}
function syncHud() {
  if (!L) return;
  $('halt').textContent = Math.max(0, Math.round(terrainY(L.x) - L.y - 15)) + 'm';
  var v = Math.hypot(L.vx, L.vy);
  $('hvel').textContent = v.toFixed(0);
  $('hvel').style.color = v > 60 ? '#ff8a7a' : '';
  $('hfuel').textContent = Math.max(0, Math.round(L.fuel));
  $('hscore').textContent = score;
}
function update(dt) {
  if (msgT > 0) msgT -= dt;
  if (shake > 0) shake -= dt;
  if (flame > 0) flame -= dt;
  if (state !== 'play') return;

  if (rotL) L.ang -= ROT * dt;
  if (rotR) L.ang += ROT * dt;
  L.ang = clamp(L.ang, -1.35, 1.35);
  if (thrusting && L.fuel > 0) {
    L.vx += Math.sin(L.ang) * THRUST * dt;
    L.vy -= Math.cos(L.ang) * THRUST * dt;
    L.fuel -= 14 * dt;
    flame = .08;
    if (frnd() < .3) tone(90 + frnd() * 30, .06, 'sawtooth', .015);
  }
  L.vx += wind * dt;
  L.vy += GY * dt;
  L.x += L.vx * dt;
  L.y += L.vy * dt;
  if (L.x < 12) { L.x = 12; L.vx = Math.abs(L.vx) * .4; }
  if (L.x > VW - 12) { L.x = VW - 12; L.vx = -Math.abs(L.vx) * .4; }
  syncHud();
  landCheck();
}
function rr(x, y, w, h, rad) {
  var k = Math.min(rad, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((frnd() - .5) * 8, (frnd() - .5) * 8);
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#05050f');
  bg.addColorStop(1, '#0d0d20');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);

  ctx.fillStyle = 'rgba(255,255,255,.7)';
  for (var s = 0; s < stars.length; s++) {
    ctx.globalAlpha = .3 + .6 * Math.abs(Math.sin(s + performance.now() * .0005));
    ctx.fillRect(stars[s].x, stars[s].y, stars[s].r, stars[s].r);
  }
  ctx.globalAlpha = 1;
  drawEm('🌙', VW - 52, 64, 40);

  /* 月面 */
  ctx.fillStyle = '#26262e';
  ctx.beginPath();
  ctx.moveTo(0, VH);
  for (var i = 0; i < terrain.length; i++) ctx.lineTo(i / (terrain.length - 1) * VW, terrain[i]);
  ctx.lineTo(VW, VH);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(150,150,190,.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (i = 0; i < terrain.length; i++) {
    var x = i / (terrain.length - 1) * VW;
    if (i === 0) ctx.moveTo(x, terrain[i]); else ctx.lineTo(x, terrain[i]);
  }
  ctx.stroke();
  /* 平台 */
  ctx.strokeStyle = 'rgba(255,240,140,.95)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(padX, padY); ctx.lineTo(padX + padW, padY); ctx.stroke();
  var blink = .45 + .4 * Math.abs(Math.sin(performance.now() * .004));
  ctx.fillStyle = 'rgba(255,240,140,' + blink + ')';
  ctx.beginPath(); ctx.arc(padX, padY, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(padX + padW, padY, 3, 0, Math.PI * 2); ctx.fill();
  ctx.font = '600 11.5px "PingFang SC",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('着陆区', padX + padW / 2, padY - 12);

  /* 风向标 */
  if (wind !== 0) {
    ctx.fillStyle = 'rgba(150,160,255,.8)';
    ctx.fillText('风 ' + (wind > 0 ? '→' : '←') + ' ' + Math.abs(windShow), VW / 2, 44);
  }

  /* 着陆舱 */
  if (L) {
    ctx.save();
    ctx.translate(L.x, L.y);
    ctx.rotate(L.ang);
    if (flame > 0 && L.fuel > 0) {
      ctx.fillStyle = 'rgba(255,' + (160 + rnd(60)) + ',60,.9)';
      ctx.beginPath();
      ctx.moveTo(-5, 14); ctx.lineTo(5, 14); ctx.lineTo(0, 14 + 12 + frnd() * 10);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#c9c9ee';
    rr(-10, -10, 20, 22, 5); ctx.fill();
    ctx.fillStyle = '#8a8af0';
    ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(0, -18); ctx.lineTo(10, -10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#39395c';
    ctx.fillRect(-14, 12, 8, 3); ctx.fillRect(6, 12, 8, 3);
    ctx.fillStyle = 'rgba(140,220,255,.9)';
    ctx.fillRect(-4, -6, 8, 6);
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(217,220,255,.55)';
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  if (state === 'play') ctx.fillText('第 ' + level + ' 关 · 软着陆:垂直<25 水平<15', VW / 2, BY_MSG_Y());
  ctx.restore();
}
function BY_MSG_Y() { return VH - 190; }

function bindHold(id, set) {
  var el = $(id);
  el.addEventListener('pointerdown', function (e) { e.preventDefault(); set(true); });
  function off() { set(false); }
  el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('pointercancel', off);
}
bindHold('rotlbtn', function (v) { rotL = v; });
bindHold('rotrbtn', function (v) { rotR = v; });
bindHold('firebtn', function (v) { thrusting = v; });
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  /* 屏幕左 1/3 左转,右 1/3 右转,中间点火(备用触控) */
  if (e.clientX < VW / 3) rotL = true;
  else if (e.clientX > VW * 2 / 3) rotR = true;
  else thrusting = true;
});
cv.addEventListener('pointerup', function () { rotL = rotR = thrusting = false; });
cv.addEventListener('pointercancel', function () { rotL = rotR = thrusting = false; });
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); rotL = true; }
  if (e.key === 'ArrowRight') { e.preventDefault(); rotR = true; }
  if (e.key === 'ArrowUp' || e.key === ' ') { e.preventDefault(); thrusting = true; }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startGame(); }
});
window.addEventListener('keyup', function (e) {
  if (e.key === 'ArrowLeft') rotL = false;
  if (e.key === 'ArrowRight') rotR = false;
  if (e.key === 'ArrowUp' || e.key === ' ') thrusting = false;
});

function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}

$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」成功软着陆 ' + (level - 1) + ' 次,任务得分 ' + score + '! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  ship: function () { return { x: L.x, y: L.y, vx: L.vx, vy: L.vy, ang: L.ang, fuel: L.fuel }; },
  setShip: function (x, y, vx, vy) { L.x = x; L.y = y; L.vx = vx; L.vy = vy; },
  setFuel: function (v) { L.fuel = v; },
  pad: function () { return { x: padX, w: padW, y: padY }; },
  terrainAt: terrainY,
  step: function (n) { for (var i = 0; i < n; i++) update(1 / 60); },
  thrust: function (v) { thrusting = v; },
  rotate: function (v) { rotL = v === -1; rotR = v === 1; },
  level: function () { return level; },
  score: function () { return score; },
  state: function () { return state; }
};

resize();
resetGame();
$('padbar').classList.add('hide');
updMini();
run();

})();
</script>

<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';
  var name=(document.title||'游戏').split(/[ ··|]/)[0];


  // 结算页:晒战绩 + 换个游戏
  var over=document.getElementById('over');
  if(over){
    var box=document.createElement('div');
    box.style.cssText='display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px';
    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>


<!-- __hub_recent__ -->
<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='lander'});
  r.unshift({k:'lander',n:'登月着陆 · 太空驾驶员',e:'🌙'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['lander_best','lander_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['lander']||0)){
            B['lander']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
