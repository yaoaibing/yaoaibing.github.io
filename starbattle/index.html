<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='starbattle_best',PLAY='starbattle_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 星域布防 · 一星一格 ================== */
var NAME = '星域布防 · 一星一格';
/* 关卡由 _genstar.js 生成:6x6 分成 6 个连通星域,每行/列/域恰好 1 颗星且星互不相邻。
 * stars 是该盘面的一组合法解(提示用);判定按规则走,任何合法摆法都算过。 */
var PUZZLES = [
  { reg: [[1,1,1,2,0,0],[1,3,1,2,0,0],[3,3,1,2,2,0],[5,3,3,3,2,0],[5,5,5,4,2,4],[5,5,4,4,4,4]], stars: [0,9,13,23,26,34] },
  { reg: [[0,0,0,1,1,1],[0,2,0,1,1,1],[0,2,4,4,3,3],[2,2,4,4,3,3],[2,5,4,4,3,3],[2,5,5,5,5,5]], stars: [0,9,13,22,26,35] },
  { reg: [[0,0,0,1,1,1],[0,0,0,2,1,1],[4,4,2,2,2,1],[3,4,4,4,2,2],[3,3,3,4,5,5],[3,3,5,5,5,5]], stars: [0,9,17,20,28,31] },
  { reg: [[2,2,2,1,0,0],[2,1,1,1,1,0],[2,2,3,3,1,0],[5,5,3,3,0,0],[5,5,3,3,4,4],[5,5,4,4,4,4]], stars: [0,8,17,21,25,34] },
  { reg: [[0,0,0,0,2,2],[0,0,4,1,1,2],[4,4,4,1,1,2],[4,3,3,1,5,2],[4,3,3,1,5,2],[3,3,5,5,5,5]], stars: [0,8,16,19,29,33] },
  { reg: [[1,0,0,2,2,2],[1,0,0,0,0,2],[1,1,3,3,2,2],[1,1,3,3,5,5],[4,4,3,3,5,5],[4,4,4,4,5,5]], stars: [0,8,17,21,25,34] },
  { reg: [[0,0,0,1,1,1],[0,0,0,4,1,1],[2,3,3,4,4,1],[2,2,3,3,4,4],[2,5,5,3,3,4],[2,2,5,5,5,5]], stars: [0,9,17,19,28,32] },
  { reg: [[1,1,0,0,0,0],[3,1,2,2,4,0],[3,1,2,2,4,0],[3,1,2,2,4,4],[3,1,5,5,5,4],[3,3,5,5,5,4]], stars: [1,11,14,22,24,33] },
  { reg: [[1,1,1,1,0,0],[5,1,2,1,0,0],[5,2,2,3,3,0],[5,5,2,2,3,3],[5,4,4,2,3,3],[5,4,4,4,4,3]], stars: [1,10,12,20,29,33] },
  { reg: [[1,1,0,0,0,0],[4,1,0,0,2,2],[4,1,1,1,2,2],[4,4,3,3,3,2],[4,4,5,5,3,2],[5,5,5,5,3,3]], stars: [0,8,16,19,27,35] }
];
var G = 6, NEED = 6, TIME0 = 90;
var COLS = [
  [96, 168, 224], [232, 132, 96], [120, 208, 128],
  [212, 168, 240], [240, 200, 96], [96, 208, 200]
];

var state = 'start';
var lv = 0, reg = [], cell = [], wrong = [], hintUsed = 0, hints = 2;
var timeLeft = TIME0, score = 0, doneLv = 0;
var flash = [], clearT = 0, shake = 0, msg = '', msgT = 0;
var BX = 0, BY = 0, BS = 0, CS = 0;

function layout() {
  var top = Math.max(96, VH * .14);
  var bottom = VH - (VW < 420 ? 104 : 66) - 74;
  BS = Math.floor(Math.min(VW - 26, bottom - top, 460));
  CS = Math.floor(BS / G);
  BS = CS * G;
  BX = Math.round((VW - BS) / 2);
  BY = Math.round(top + Math.max(0, (bottom - top - BS) * .42));
}
function onResize() { layout(); }

function rowOf(k) { return Math.floor(k / G) }
function colOf(k) { return k % G }
function regAt(k) { return reg[rowOf(k)][colOf(k)] }

/* 计数:返回每行/列/域的星数 */
function counts() {
  var r = [0, 0, 0, 0, 0, 0], c = [0, 0, 0, 0, 0, 0], g = [0, 0, 0, 0, 0, 0];
  for (var k = 0; k < G * G; k++) {
    if (!cell[k]) continue;
    r[rowOf(k)]++; c[colOf(k)]++; g[regAt(k)]++;
  }
  return { r: r, c: c, g: g };
}
function touched(k) {
  var r = rowOf(k), c = colOf(k);
  for (var y = r - 1; y <= r + 1; y++) {
    for (var x = c - 1; x <= c + 1; x++) {
      if (y < 0 || y >= G || x < 0 || x >= G) continue;
      if (y === r && x === c) continue;
      if (cell[y * G + x]) return true;
    }
  }
  return false;
}
function placed() {
  var n = 0;
  for (var k = 0; k < G * G; k++) if (cell[k]) n++;
  return n;
}
/* 违规格:相邻冲突 + 同行/列/域超额 */
function markWrong() {
  var i, k;
  var ct = counts();
  wrong = [];
  for (i = 0; i < G * G; i++) wrong.push(0);
  for (k = 0; k < G * G; k++) {
    if (!cell[k]) continue;
    if (touched(k)) wrong[k] = 1;
    if (ct.r[rowOf(k)] > 1 || ct.c[colOf(k)] > 1 || ct.g[regAt(k)] > 1) wrong[k] = 1;
  }
  return wrong;
}
function isWin() {
  if (placed() !== NEED) return false;
  markWrong();
  for (var k = 0; k < G * G; k++) if (wrong[k]) return false;
  var ct = counts();
  for (var i = 0; i < G; i++) if (ct.r[i] !== 1 || ct.c[i] !== 1 || ct.g[i] !== 1) return false;
  return true;
}

function loadLevel(n) {
  lv = clamp(n, 0, PUZZLES.length - 1);
  reg = PUZZLES[lv].reg.map(function (r) { return r.slice() });
  cell = []; wrong = [];
  for (var k = 0; k < G * G; k++) { cell.push(0); wrong.push(0) }
  hints = 2; hintUsed = 0;
  timeLeft = TIME0;
  clearT = 0; msg = ''; msgT = 0;
  layout();
  syncHud();
}
function resetGame() {
  score = 0; doneLv = 0; flash = []; shake = 0;
  loadLevel(0);
}
function startGame() {
  resetGame();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}
function levelScore() {
  var bonus = Math.round(Math.max(0, timeLeft) * 2);
  return 120 + bonus - hintUsed * 45;
}
function nextLevel() {
  doneLv++;
  var add = Math.max(20, levelScore());
  score += add;
  if (doneLv >= PUZZLES.length) { finish(true); return }
  msg = '第 ' + (lv + 2) + ' 关 + ' + add + ' 分';
  msgT = 1.6;
  loadLevel(lv + 1);
}
function finish(allClear) {
  state = 'over';
  KIT.addPlay();
  KIT.streak();
  var rec = KIT.setBest(score);
  var rank = score >= 2200 ? '星空统帅' : score >= 1400 ? '布防官' : score >= 700 ? '见习观测员' : '迷路的新兵';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = (allClear ? '十关全清!' : '时限到') + '<br>' +
    '通过 <b>' + doneLv + ' / ' + PUZZLES.length + ' 关</b><br>' +
    '本局得分 <b>' + score + '</b><br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '先把每颗星唯一的那一行钉死,再顺着颜色域推别的行';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  noise(.25, .07);
  tone(allClear ? 780 : 150, .3, 'sine', .06, allClear ? 1180 : 90);
}
function endGame() { finish(false) }
function syncHud() {
  $('hstep').textContent = (lv + 1) + '/' + PUZZLES.length;
  $('hstar').textContent = placed() + '/' + NEED;
  $('hhint').textContent = hints;
}

function tap(k) {
  if (state !== 'play' || clearT > 0) return;
  cell[k] = cell[k] ? 0 : 1;
  flash.push({ k: k, t: .28 });
  tone(cell[k] ? 660 : 380, .06, 'triangle', .04);
  syncHud();
  if (isWin()) {
    clearT = 1;
    for (var i = 0; i < 14; i++) {
      flash.push({ k: (Math.random() * G * G) | 0, t: .6, win: 1 });
    }
    tone(880, .18, 'sine', .06, 1320);
  } else {
    markWrong();
    var bad = 0;
    for (var j = 0; j < G * G; j++) if (wrong[j]) bad++;
    if (bad) { msg = '有 ' + bad + ' 颗星冲突'; msgT = 1 }
  }
}
function useHint() {
  if (state !== 'play' || clearT > 0) return;
  if (hints <= 0) { msg = '这关没提示了'; msgT = 1.2; return }
  var sol = PUZZLES[lv].stars;
  for (var i = 0; i < sol.length; i++) {
    var k = sol[i];
    if (cell[k]) continue;
    /* 先清掉会挡路的星,保证提示落点合法 */
    for (var j = 0; j < G * G; j++) {
      if (!cell[j]) continue;
      if (rowOf(j) === rowOf(k) || colOf(j) === colOf(k) || regAt(j) === regAt(k) ||
        (Math.abs(rowOf(j) - rowOf(k)) <= 1 && Math.abs(colOf(j) - colOf(k)) <= 1)) cell[j] = 0;
    }
    cell[k] = 1;
    hints--; hintUsed++;
    flash.push({ k: k, t: .5, hint: 1 });
    msg = '提示落子 -45 分'; msgT = 1.2;
    tone(980, .1, 'sine', .05);
    syncHud();
    markWrong();
    if (isWin()) clearT = 1;
    return;
  }
}
function clearBoard() {
  if (state !== 'play') return;
  loadLevel(lv);
}

function update(dt) {
  var i;
  if (msgT > 0) msgT -= dt;
  if (shake > 0) shake -= dt;
  for (i = flash.length - 1; i >= 0; i--) {
    flash[i].t -= dt;
    if (flash[i].t <= 0) flash.splice(i, 1);
  }
  if (clearT > 0) {
    clearT -= dt;
    if (clearT <= 0) nextLevel();
    return;
  }
  if (state !== 'play') return;
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; syncHud(); finish(false); return }
  syncHud();
}

function rr(x, y, w, h, rad) {
  var k = Math.min(rad, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
function cellXY(k) {
  return { x: BX + colOf(k) * CS, y: BY + rowOf(k) * CS };
}
function starPath(cx, cy, rOut, rIn) {
  ctx.beginPath();
  for (var i = 0; i < 10; i++) {
    var a = -Math.PI / 2 + i * Math.PI / 5;
    var rad = i % 2 ? rIn : rOut;
    var x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#0a1024');
  bg.addColorStop(1, '#05070f');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, VW, VH);
  /* 背景星尘 */
  for (var s = 0; s < 26; s++) {
    var sx = ((s * 977) % 100) / 100 * VW;
    var sy = ((s * 641) % 100) / 100 * VH;
    ctx.fillStyle = 'rgba(255,255,255,' + (.05 + (s % 4) * .02) + ')';
    ctx.fillRect(sx, sy, 2, 2);
  }
  var sh = shake > 0 ? (Math.random() - .5) * 6 : 0;
  ctx.save();
  ctx.translate(sh, 0);

  ctx.fillStyle = 'rgba(255,255,255,.05)';
  rr(BX - 10, BY - 10, BS + 20, BS + 20, 20); ctx.fill();

  /* 域底色 */
  var k, i;
  for (k = 0; k < G * G; k++) {
    var g = regAt(k), rc = cellXY(k);
    var col = COLS[g];
    ctx.fillStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',.2)';
    ctx.fillRect(rc.x, rc.y, CS, CS);
  }
  /* 域分界线 */
  ctx.strokeStyle = 'rgba(255,255,255,.5)';
  ctx.lineWidth = 2.4;
  for (k = 0; k < G * G; k++) {
    var r0 = rowOf(k), c0 = colOf(k), p = cellXY(k);
    if (c0 < G - 1 && regAt(k) !== regAt(k + 1)) {
      ctx.beginPath();
      ctx.moveTo(p.x + CS, p.y); ctx.lineTo(p.x + CS, p.y + CS);
      ctx.stroke();
    }
    if (r0 < G - 1 && regAt(k) !== regAt(k + G)) {
      ctx.beginPath();
      ctx.moveTo(p.x, p.y + CS); ctx.lineTo(p.x + CS, p.y + CS);
      ctx.stroke();
    }
  }
  /* 细网格 */
  ctx.strokeStyle = 'rgba(255,255,255,.1)';
  ctx.lineWidth = 1;
  for (i = 0; i <= G; i++) {
    ctx.beginPath(); ctx.moveTo(BX + i * CS, BY); ctx.lineTo(BX + i * CS, BY + BS); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(BX, BY + i * CS); ctx.lineTo(BX + BS, BY + i * CS); ctx.stroke();
  }
  /* 星 */
  for (k = 0; k < G * G; k++) {
    if (!cell[k]) continue;
    var q = cellXY(k);
    var cx = q.x + CS / 2, cy = q.y + CS / 2;
    var fl = 0, isHint = 0;
    for (i = 0; i < flash.length; i++) {
      if (flash[i].k === k) { fl = Math.max(fl, flash[i].t); isHint = flash[i].hint ? 1 : isHint }
    }
    var bad = wrong[k];
    ctx.save();
    ctx.shadowColor = bad ? 'rgba(255,90,90,.9)' : 'rgba(255,214,92,.85)';
    ctx.shadowBlur = 10 + fl * 26;
    ctx.fillStyle = bad ? '#ff8080' : '#ffd75e';
    starPath(cx, cy, CS * .3 + fl * CS * .08, CS * .13);
    ctx.fill();
    ctx.restore();
    if (isHint) {
      ctx.strokeStyle = 'rgba(150,230,255,.9)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, CS * .38, 0, Math.PI * 2); ctx.stroke();
    }
  }
  /* 通关闪光 */
  if (clearT > 0) {
    ctx.fillStyle = 'rgba(255,235,160,' + (clearT * .22) + ')';
    ctx.fillRect(BX, BY, BS, BS);
  }
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.fillText('每行、每列、每片颜色域各放 1 颗星,星不能挨着', VW / 2, BY + BS + 24);
  ctx.fillStyle = msgT > 0 ? 'rgba(255,220,120,.95)' : 'rgba(170,210,255,.42)';
  ctx.fillText(msg || ('点格子放星 / 再点取消 · 本关剩 ' + Math.ceil(Math.max(0, timeLeft)) + ' 秒'), VW / 2, BY + BS + 46);
}

function tapAt(x, y) {
  if (state !== 'play' || clearT > 0) return;
  if (x < BX || y < BY || x >= BX + BS || y >= BY + BS) return;
  var c = Math.floor((x - BX) / CS), r = Math.floor((y - BY) / CS);
  if (c < 0 || c >= G || r < 0 || r >= G) return;
  tap(r * G + c);
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  tapAt(e.clientX, e.clientY);
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === 'h' || e.key === 'H') { e.preventDefault(); useHint() }
  if (e.key === 'c' || e.key === 'C') { e.preventDefault(); clearBoard() }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startGame() }
});

function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', clearBoard);
$('hintbtn').addEventListener('click', useHint);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」布防了 ' + doneLv + ' 片星域,拿下 ' + score + ' 分! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  state: function () { return state },
  level: function () { return lv },
  cell: function () { return cell.slice() },
  placed: placed,
  wrong: function () { return wrong.slice() },
  win: isWin,
  score: function () { return score },
  done: function () { return doneLv },
  hints: function () { return hints },
  time: function () { return timeLeft },
  tap: tap,
  hint: function () { hints = Math.max(hints, 1); useHint() },
  useHint: useHint,
  clear: clearBoard,
  setLevel: function (n) { loadLevel(n) },
  setTimer: function (v) { timeLeft = v; syncHud() },
  puzzles: function () { return PUZZLES.length },
  step: function (n) { for (var i = 0; i < n; i++) update(1 / 60) },
  forceEnd: function () { finish(false) }
};

resize();
resetGame();
$('padbar').classList.add('hide');
updMini();
run();

})();
</script>

<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';

      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+

      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='starbattle'});
  r.unshift({k:'starbattle',n:'星域布防 · 一星一格',e:'⭐'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['starbattle_best','starbattle_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['starbattle']||0)){
            B['starbattle']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
