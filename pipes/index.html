<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='pipes_best',PLAY='pipes_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 管道大师 · 接通水流 ================== */
var NAME = '管道大师 · 接通水流';
var state = 'start';
var UP = 1, RIGHT = 2, DOWN = 4, LEFT = 8;
var DIRS = [[0, -1, UP], [1, 0, RIGHT], [0, 1, DOWN], [-1, 0, LEFT]];
var N = 5, diff = 0, masks = [], solved = [], rotOf = [], src = 0;
var moves = 0, elapsed = 0, wet = [], winT = 0, cellFlash = [];
var BX = 0, BY = 0, CS = 60, lastTimeShown = -1;
var DIFF_N = [5, 6, 7];

function layout() {
  var top = Math.max(80, VH * .1);
  var pad = VW < 360 ? 112 : 58;
  var bottom = VH - pad - 54;
  var size = Math.floor(Math.min(VW - 30, bottom - top));
  CS = Math.floor(size / N);
  size = CS * N;
  BX = Math.round((VW - size) / 2);
  BY = Math.round(top + Math.max(0, (bottom - top - size) * .5));
}
function onResize() { layout(); }

function opp(b) { return ((b << 2) | (b >> 2)) & 15; }
function rotMask(m, k) {
  k = ((k % 4) + 4) % 4;
  while (k--) m = ((m << 1) | (m >> 3)) & 15;
  return m;
}
function idx(x, y) { return y * N + x; }
function inB(x, y) { return x >= 0 && x < N && y >= 0 && y < N; }

function generate() {
  var total = N * N, i;
  masks = [];
  for (i = 0; i < total; i++) masks.push(0);
  src = idx(0, Math.floor(N / 2));
  var seen = [];
  for (i = 0; i < total; i++) seen.push(false);
  var edges = [];
  function pushEdges(at) {
    var x = at % N, y = Math.floor(at / N), d;
    for (d = 0; d < 4; d++) {
      var nx = x + DIRS[d][0], ny = y + DIRS[d][1];
      if (!inB(nx, ny)) continue;
      var to = idx(nx, ny);
      if (!seen[to]) edges.push({ from: at, to: to, bit: DIRS[d][2] });
    }
  }
  seen[src] = true;
  pushEdges(src);
  while (edges.length) {
    var k = rnd(edges.length);
    var e = edges.splice(k, 1)[0];
    if (seen[e.to]) continue;
    seen[e.to] = true;
    masks[e.from] |= e.bit;
    masks[e.to] |= opp(e.bit);
    pushEdges(e.to);
  }
  masks[src] |= LEFT;

  solved = masks.slice();
  rotOf = [];
  for (i = 0; i < total; i++) rotOf.push(rnd(4));
  masks = solved.map(function (m, j) { return rotMask(m, rotOf[j]); });
  if (isWinNow()) {
    masks[total - 1] = rotMask(masks[total - 1], 1);
    rotOf[total - 1] = (rotOf[total - 1] + 1) % 4;
  }
  moves = 0; elapsed = 0; winT = 0; cellFlash = [];
  for (i = 0; i < total; i++) cellFlash.push(0);
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud(true);
}
function resetGame() { generate(); }

function syncHud(force) {
  $('hmove').textContent = moves;
  $('hsize').textContent = N + 'x' + N;
  var sec = Math.floor(elapsed);
  if (force || sec !== lastTimeShown) {
    lastTimeShown = sec;
    $('htime').textContent = sec + 's';
  }
}
function setPadDiff() {
  var b = $('diffbtn');
  if (b) b.textContent = '🎚 ' + N + 'x' + N;
}

function edgeOpen(m, bit) { return (m & bit) !== 0; }
function neighborOf(i, bit) {
  var x = i % N, y = Math.floor(i / N);
  if (bit === UP) y--;
  else if (bit === RIGHT) x++;
  else if (bit === DOWN) y++;
  else x--;
  if (!inB(x, y)) return -1;
  return idx(x, y);
}
function matched(i, bit) {
  var to = neighborOf(i, bit);
  if (to < 0) return false;
  return edgeOpen(masks[i], bit) && edgeOpen(masks[to], opp(bit));
}
function allMatched() {
  var i, d;
  for (i = 0; i < N * N; i++) {
    for (d = 0; d < 4; d++) {
      var bit = DIRS[d][2];
      if (!edgeOpen(masks[i], bit)) continue;
      if (i === src && bit === LEFT) continue;
      if (!matched(i, bit)) return false;
    }
  }
  return true;
}
function computeWet() {
  var total = N * N, i;
  wet = [];
  for (i = 0; i < total; i++) wet.push(false);
  if (!edgeOpen(masks[src], LEFT)) return;
  var q = [src], head = 0;
  wet[src] = true;
  while (head < q.length) {
    var at = q[head++], d;
    for (d = 0; d < 4; d++) {
      var bit = DIRS[d][2];
      if (!edgeOpen(masks[at], bit)) continue;
      if (at === src && bit === LEFT) continue;
      var to = neighborOf(at, bit);
      if (to < 0 || wet[to]) continue;
      if (!edgeOpen(masks[to], opp(bit))) continue;
      wet[to] = true;
      q.push(to);
    }
  }
}
function wetCount() {
  var n = 0, i;
  for (i = 0; i < wet.length; i++) if (wet[i]) n++;
  return n;
}
function isWinNow() {
  computeWet();
  return allMatched() && wetCount() === N * N && edgeOpen(masks[src], LEFT);
}
function rotate(i) {
  if (state !== 'play' || i < 0 || i >= N * N) return false;
  masks[i] = rotMask(masks[i], 1);
  moves++;
  cellFlash[i] = .35;
  tone(380 + (i % 5) * 24, .04, 'sine', .028);
  computeWet();
  syncHud();
  if (isWinNow()) win();
  return true;
}
function win() {
  state = 'over';
  var base = N * N * 60;
  var score = Math.max(120, base - moves * 10 - Math.floor(elapsed) * 2);
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '<b>全线通水!</b><br>' +
    N + 'x' + N + ' · 旋转 ' + moves + ' 次 · 用时 ' + Math.floor(elapsed) + ' 秒<br>' +
    '本局得分 ' + score + '<br>历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '从水泵开始顺藤摸瓜,先把主干接通再看边角';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  tone(520, .1, 'triangle', .06, 780);
  setTimeout(function () { tone(780, .14, 'triangle', .05, 1100); }, 130);
}

function tapAt(x, y) {
  if (state !== 'play') return;
  var cx = Math.floor((x - BX) / CS), cy = Math.floor((y - BY) / CS);
  if (cx < 0 || cx >= N || cy < 0 || cy >= N) return;
  rotate(idx(cx, cy));
}
cv.addEventListener('pointerdown', function (e) { e.preventDefault(); tapAt(e.clientX, e.clientY); });
window.addEventListener('keydown', function (e) {
  if (e.key >= '1' && e.key <= '3') { diff = +e.key - 1; N = DIFF_N[diff]; setPadDiff(); layout(); resetGame(); }
  if (e.key === 'r' || e.key === 'R') resetGame();
});

function pipeColor(i, bit, water) {
  if (water) return '#58e0ff';
  return 'rgba(120,205,230,.9)';
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#0c2a36');
  bg.addColorStop(1, '#051016');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, VW, VH);

  var total = N * N, i, d;
  ctx.fillStyle = 'rgba(255,255,255,.035)';
  ctx.strokeStyle = 'rgba(255,255,255,.06)';
  ctx.lineWidth = 1;
  for (i = 0; i < total; i++) {
    var x = BX + (i % N) * CS, y = BY + Math.floor(i / N) * CS;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x + 3, y + 3, CS - 6, CS - 6, 8) : ctx.rect(x + 3, y + 3, CS - 6, CS - 6);
    ctx.fill();
    ctx.stroke();
  }

  computeWet();
  var lw = Math.max(5, CS * .22);
  var inner = Math.max(2, CS * .09);
  for (i = 0; i < total; i++) {
    var cx = BX + (i % N) * CS + CS / 2;
    var cy = BY + Math.floor(i / N) * CS + CS / 2;
    if (cellFlash[i] > 0) {
      ctx.fillStyle = 'rgba(90,220,255,' + (cellFlash[i] * .6) + ')';
      ctx.beginPath(); ctx.arc(cx, cy, CS * .44, 0, Math.PI * 2); ctx.fill();
    }
    if (!masks[i]) continue;
    for (d = 0; d < 4; d++) {
      var bit = DIRS[d][2];
      if (!edgeOpen(masks[i], bit)) continue;
      var ex = cx + DIRS[d][0] * CS / 2;
      var ey = cy + DIRS[d][1] * CS / 2;
      var isWet = wet[i] && (bit === LEFT && i === src ? true : matched(i, bit));
      ctx.strokeStyle = 'rgba(8,26,34,.9)';
      ctx.lineWidth = lw + 4;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = pipeColor(i, bit, isWet);
      ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey); ctx.stroke();
      if (isWet) {
        ctx.strokeStyle = 'rgba(220,255,255,.85)';
        ctx.lineWidth = inner;
        ctx.beginPath();
        ctx.moveTo(cx + (ex - cx) * .15, cy + (ey - cy) * .15);
        ctx.lineTo(cx + (ex - cx) * .92, cy + (ey - cy) * .92);
        ctx.stroke();
      }
    }
    ctx.fillStyle = wet[i] ? '#9ff2ff' : 'rgba(110,190,215,.9)';
    ctx.beginPath(); ctx.arc(cx, cy, lw * .55, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(8,26,34,.55)';
    ctx.beginPath(); ctx.arc(cx, cy, lw * .24, 0, Math.PI * 2); ctx.fill();
  }

  if (edgeOpen(masks[src], LEFT)) {
    var sx = BX + (src % N) * CS, sy = BY + Math.floor(src / N) * CS + CS / 2;
    ctx.fillStyle = wet[src] ? '#7feaff' : 'rgba(120,205,230,.8)';
    ctx.beginPath();
    ctx.moveTo(sx - Math.max(4, CS * .06), sy);
    ctx.lineTo(sx + 2, sy - CS * .13);
    ctx.lineTo(sx + 2, sy + CS * .13);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = 'rgba(215,245,255,.65)';
  ctx.font = '600 12px "PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('点管道顺时针旋转 · 让水流入每一格', VW / 2, BY - 20);
}
function update(dt) {
  if (state !== 'play') return;
  elapsed += dt;
  var i;
  for (i = 0; i < cellFlash.length; i++) if (cellFlash[i] > 0) cellFlash[i] -= dt;
  syncHud(false);
}

$('startbtn').addEventListener('click', resetGame);
$('againbtn').addEventListener('click', resetGame);
$('newbtn').addEventListener('click', resetGame);
$('diffbtn').addEventListener('click', function () {
  diff = (diff + 1) % 3;
  N = DIFF_N[diff];
  setPadDiff();
  layout();
  resetGame();
});
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」用 ' + moves + ' 次旋转接通了 ' + N + 'x' + N + ' 管道! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/'; });
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}

window.__T = {
  size: function () { return N; },
  grid: function () { return masks.slice(); },
  solved: function () { return solved.slice(); },
  source: function () { return src; },
  rotate: rotate,
  moves: function () { return moves; },
  isWin: function () { return isWinNow(); },
  wet: function () { computeWet(); return wet.slice(); },
  solution: function () {
    var out = [], i, k;
    for (i = 0; i < N * N; i++) {
      var found = 0;
      for (k = 0; k < 4; k++) if (rotMask(masks[i], k) === solved[i]) { found = k; break; }
      out.push(found);
    }
    return out;
  },
  state: function () { return state; },
  elapsed: function () { return elapsed; },
  setMasks: function (arr) {
    masks = arr.slice();
    state = 'play';
    moves = 0;
    syncHud(true);
  }
};
resize();
updMini();
setPadDiff();
syncHud(true);
run();

})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='pipes'});
  r.unshift({k:'pipes',n:'管道大师 · 接通水流',e:'🔧'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['pipes_best','pipes_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['pipes']||0)){
            B['pipes']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
