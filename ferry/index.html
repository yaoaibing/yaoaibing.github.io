<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='ferry_best',PLAY='ferry_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 渡口摆渡 · 逆流靠岸 ================== */
var NAME = '渡口摆渡 · 逆流靠岸';
var state = 'start';
var day = 0, dock = 0, hull = 3, timer = 60, delivered = 0, cargo = 0;
var bx = 0, by = 0, vy = 0, phase = 'wait', inv = 0, shake = 0, dockWait = 0, held = 0;
var logs = [], streaks = [], sparks = [], rocks = [];
var topDock = 0, botDock = 0, msg = '', msgT = 0, steer = 0, RIP = 0, RIB = 0;

function layout() {
  RIP = Math.max(104, VH * .16);      /* 对岸水线 */
  RIB = VH - (VW < 420 ? 112 : 78);   /* 本岸水线 */
  botDock = VW * .3;
  if (!phase || phase === 'wait') { bx = botDock; by = RIB - 22 }
}
function onResize() { layout(); }

function resetGame() {
  day = 1; dock = 0; hull = 3; timer = 60; delivered = 0; cargo = 0;
  logs = []; sparks = []; streaks = []; rocks = [];
  phase = 'wait'; inv = 0; shake = 0; steer = 0; held = 0; dockWait = 0;
  msg = '点屏幕解缆开船'; msgT = 2;
  layout();
  bx = botDock; by = RIB - 22; vy = 0;
  topDock = VW * .5;
  for (var i = 0; i < 22; i++) {
    streaks.push({ x: Math.random() * VW, y: RIP + Math.random() * (RIB - RIP), l: 12 + Math.random() * 30 });
  }
  syncHud();
}
function startGame() {
  resetGame();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}
function endGame() {
  state = 'over';
  KIT.addPlay(); KIT.streak();
  var score = delivered * 100 + dock * 20;
  var rec = KIT.setBest(score);
  var rank = delivered >= 18 ? '金牌船长老把式' : delivered >= 11 ? '摆渡好手' : delivered >= 6 ? '见习水手' : '翻船常客';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '第 ' + day + ' 天收工<br>' +
    '送客 <b>' + delivered + ' 位</b> · 靠岸 ' + dock + ' 次<br>' +
    '本局得分 <b>' + score + '</b><br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '别硬顶水流,借它往下游漂,再斜着切回码头最省油';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  noise(.25, .07);
  tone(120, .35, 'sine', .06, 60);
}
function syncHud() {
  $('hpass').textContent = delivered;
  $('hhull').textContent = Math.max(0, hull);
  $('hday').textContent = Math.max(0, Math.ceil(timer));
}
function current(x, y) {
  /* 河心水急,靠岸水缓;再叠一层缓慢摆动,做出暗流 */
  var f = Math.sin(Math.PI * clamp((y - RIP) / (RIB - RIP), 0, 1));
  return (26 + 74 * f) * (1 + .28 * Math.sin(x / 90 + timer * .7));
}
function depart() {
  if (state !== 'play') return;
  if (phase === 'wait') {
    cargo = 1 + rnd(3);
    topDock = VW * (.16 + Math.random() * .68);
    rocks = [];
    var rn = 2 + rnd(2);
    for (var i = 0; i < rn; i++) {
      rocks.push({ x: 40 + Math.random() * (VW - 80), y: RIP + 40 + Math.random() * (RIB - RIP - 80), r: 12 + Math.random() * 8 });
    }
    phase = 'cross';
    vy = -(64 + day * 4);
    msg = '目标码头在对岸'; msgT = 1.2;
    tone(300, .14, 'sine', .05, 220);
    syncHud();
  } else if (phase === 'back') {
    phase = 'cross';
    vy = -(64 + day * 4);
  }
}
function damage(why) {
  /* 无敌帧里这一下不算撞:调用方据此决定要不要掀船位,免得压着礁石的每帧都倒退 */
  if (inv > 0) return false;
  hull--;
  inv = 1.2;
  shake = .38;
  msg = why; msgT = 1.4;
  sparks.length = 0;
  for (var i = 0; i < 12; i++) {
    sparks.push({ x: bx, y: by, vx: (Math.random() - .5) * 240, vy: (Math.random() - .5) * 240, l: .6 });
  }
  noise(.2, .09);
  tone(190, .2, 'square', .05, 90);
  if (hull <= 0) endGame();
  syncHud();
  return true;
}
function land() {
  phase = 'dock';
  by = RIP + 16;
  vy = 0;
  var off = Math.abs(bx - topDock);
  if (off < 30) {
    dock++;
    delivered += cargo;
    timer = Math.min(90, timer + 9);
    msg = '稳稳靠岸 +' + cargo + ' 位';
    msgT = 1.4;
    tone(720, .16, 'sine', .06, 980);
  } else {
    damage(off < 60 ? '擦着泥岸,船体受损' : '撞上游石滩!');
    timer = Math.max(0, timer - 4);
  }
  cargo = 0;
  day += 1;
  dockWait = 1.1;
  syncHud();
}
function update(dt) {
  var i;
  if (msgT > 0) msgT -= dt;
  if (shake > 0) shake -= dt;
  if (inv > 0) inv -= dt;
  if (dockWait > 0) dockWait -= dt;
  for (i = sparks.length - 1; i >= 0; i--) {
    var s = sparks[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.l -= dt;
    if (s.l <= 0) sparks.splice(i, 1);
  }
  for (i = streaks.length - 1; i >= 0; i--) {
    var k = streaks[i];
    k.x += current(k.x, k.y) * dt * 1.6;
    if (k.x > VW + 40) { k.x = -40; k.y = RIP + Math.random() * (RIB - RIP) }
  }
  if (state !== 'play') return;
  timer -= dt;
  if (timer <= 0) { timer = 0; syncHud(); endGame(); return }
  /* 靠岸后自动回航 */
  if (phase === 'dock' && dockWait <= 0) {
    phase = 'back';
    by = RIP + 16;
    vy = 74 + day * 3;
    msg = '空船回航,再装客'; msgT = 1;
  }
  if (phase === 'cross' || phase === 'back') {
    bx += (steer * 300 + current(bx, by)) * dt;
    by += vy * dt;
    if (bx < 14) bx = 14;
    if (bx > VW - 14) bx = VW - 14;
    /* 漂浮木撞船 */
    for (i = logs.length - 1; i >= 0; i--) {
      var L = logs[i];
      if (Math.abs(L.x - bx) < L.w / 2 + 13 && Math.abs(L.y - by) < 15) {
        if (damage('被漂浮木撞个正着!')) bx += 26;
      }
    }
    for (i = rocks.length - 1; i >= 0; i--) {
      var R = rocks[i];
      if (Math.hypot(R.x - bx, R.y - by) < R.r + 13) {
        if (!damage('搁在礁石上了!')) continue;
        bx += (bx < R.x ? -24 : 24);
        by += (phase === 'cross' ? 18 : -18);
      }
    }
    if (phase === 'cross' && by <= RIP + 16) land();
    if (phase === 'back' && by >= RIB - 22) {
      by = RIB - 22;
      vy = 0;
      phase = 'wait';
      msg = '点屏幕解缆开船'; msgT = 1.4;
    }
  }
  /* 来木 */
  if (Math.random() < dt * (0.7 + day * 0.08)) {
    logs.push({ x: -50, y: RIP + 30 + Math.random() * (RIB - RIP - 60), w: 46 + Math.random() * 40 });
  }
  for (i = logs.length - 1; i >= 0; i--) {
    logs[i].x += current(logs[i].x, logs[i].y) * dt * 1.5 + 26 * dt;
    if (logs[i].x > VW + 70) logs.splice(i, 1);
  }
  syncHud();
}

function rr(x, y, w, h, rad) {
  var k = Math.min(rad, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
function drawBank(yTop, hgt, dockX, active) {
  var bg = ctx.createLinearGradient(0, yTop, 0, yTop + hgt);
  bg.addColorStop(0, '#2a2015');
  bg.addColorStop(1, '#3d2f1e');
  ctx.fillStyle = bg;
  ctx.fillRect(0, yTop, VW, hgt);
  ctx.fillStyle = 'rgba(255,255,255,.06)';
  for (var x = -((yTop * 3) % 26); x < VW; x += 26) ctx.fillRect(x, yTop + 4, 14, 2);
  /* 码头 */
  var w = 62;
  ctx.fillStyle = active ? 'rgba(255,214,120,.95)' : 'rgba(180,150,110,.5)';
  rr(dockX - w / 2, yTop === 0 ? hgt - 6 : yTop + 4, w, 8, 4); ctx.fill();
  ctx.font = '600 12px "PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(active ? '🚩 目标码头' : '本岸', dockX, yTop === 0 ? yTop + hgt - 12 : yTop + 26);
}
function draw() {
  ctx.fillStyle = '#06121c';
  ctx.fillRect(0, 0, VW, VH);
  var sh = shake > 0 ? (Math.random() - .5) * 8 : 0;
  ctx.save();
  ctx.translate(sh, sh * .4);
  /* 水面 */
  var wg = ctx.createLinearGradient(0, RIP, 0, RIB);
  wg.addColorStop(0, '#0d3048');
  wg.addColorStop(1, '#08202f');
  ctx.fillStyle = wg;
  ctx.fillRect(0, RIP, VW, RIB - RIP);
  ctx.strokeStyle = 'rgba(140,210,240,.22)';
  ctx.lineWidth = 2;
  for (var i = 0; i < streaks.length; i++) {
    var s = streaks[i];
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + s.l, s.y);
    ctx.stroke();
  }
  drawBank(0, RIP, topDock, phase === 'cross');
  drawBank(RIB, VH - RIB, botDock, phase !== 'cross');
  /* 礁石 */
  for (i = 0; i < rocks.length; i++) {
    var R = rocks[i];
    ctx.fillStyle = '#3a4750';
    ctx.beginPath();
    ctx.arc(R.x, R.y, R.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    ctx.beginPath();
    ctx.arc(R.x - R.r * .3, R.y - R.r * .3, R.r * .4, 0, Math.PI * 2);
    ctx.fill();
  }
  /* 漂浮木 */
  for (i = 0; i < logs.length; i++) {
    var L = logs[i];
    ctx.fillStyle = '#6b4a26';
    rr(L.x - L.w / 2, L.y - 6, L.w, 12, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.14)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(L.x - L.w / 2 + 5, L.y); ctx.lineTo(L.x + L.w / 2 - 5, L.y);
    ctx.stroke();
  }
  /* 渡船 */
  ctx.save();
  ctx.globalAlpha = inv > 0 ? (Math.floor(inv * 9) % 2 ? .4 : .9) : 1;
  ctx.translate(bx, by);
  ctx.fillStyle = '#c8552f';
  rr(-15, -12, 30, 24, 7); ctx.fill();
  ctx.fillStyle = '#f0e0c0';
  rr(-9, -8, 18, 9, 3); ctx.fill();
  ctx.fillStyle = '#2b3a44';
  rr(-4, 2, 8, 7, 2); ctx.fill();
  ctx.restore();
  if (cargo > 0) {
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    for (i = 0; i < cargo; i++) ctx.fillText('🧍', bx - 10 + i * 10, by - 22);
  }
  /* 航向标 */
  if (phase === 'cross') {
    ctx.strokeStyle = 'rgba(255,214,120,.5)';
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx, by - 16);
    ctx.lineTo(topDock, RIP + 10);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  /* 火花 */
  for (i = 0; i < sparks.length; i++) {
    var s2 = sparks[i];
    ctx.fillStyle = 'rgba(180,240,255,' + Math.max(0, s2.l) + ')';
    ctx.fillRect(s2.x - 2, s2.y - 2, 4, 4);
  }
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = msgT > 0 ? 'rgba(255,220,120,.95)' : 'rgba(180,220,245,.5)';
  ctx.fillText(msg || '按住左右半屏打舵,顺水走斜线最省力', VW / 2, VH - 40);
}

function heldSide(e) {
  var x = e.clientX;
  steer = x < VW / 2 ? -1 : 1;
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  if (phase === 'wait' || phase === 'back') { held = 0; depart(); return }
  held = 1;
  heldSide(e);
});
cv.addEventListener('pointermove', function (e) {
  if (held && state === 'play' && phase === 'cross') heldSide(e);
});
window.addEventListener('pointerup', function () { held = 0; steer = 0 });
window.addEventListener('pointercancel', function () { held = 0; steer = 0 });
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); steer = -1 }
  if (e.key === 'ArrowRight') { e.preventDefault(); steer = 1 }
  if (e.key === ' ') { e.preventDefault(); depart() }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startGame() }
});

function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', startGame);
$('gobtn').addEventListener('click', depart);
$('leftbtn').addEventListener('click', function () { steer = -1 });
$('rightbtn').addEventListener('click', function () { steer = 1 });
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」第 ' + day + ' 天送走了 ' + delivered + ' 位乘客! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  state: function () { return state },
  phase: function () { return phase },
  delivered: function () { return delivered },
  hull: function () { return hull },
  day: function () { return day },
  timer: function () { return timer },
  cargo: function () { return cargo },
  pos: function () { return { x: bx, y: by } },
  target: function () { return topDock },
  steer: function (d) { steer = d },
  depart: depart,
  cur: current,
  setHull: function (v) { hull = v; syncHud() },
  setTimer: function (v) { timer = v; syncHud() },
  teleport: function (x) { bx = clamp(x, 14, VW - 14) },
  step: function (n) { for (var i = 0; i < n; i++) update(1 / 60) },
  forceEnd: endGame
};

resize();
resetGame();
$('padbar').classList.add('hide');
updMini();
run();

})();
</script>

<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';

    var box=document.createElement('div');
    box.style.cssText='display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px';
    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>


<!-- __hub_recent__ -->
<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='ferry'});
  r.unshift({k:'ferry',n:'渡口摆渡 · 逆流靠岸',e:'🛳️'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['ferry_best','ferry_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['ferry']||0)){
            B['ferry']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
