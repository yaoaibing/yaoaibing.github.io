<script>
(function(){
'use strict';

/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='bomb_best',PLAY='bomb_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* ================== MAP · 地图生成(纯函数,可离线验证) ================== */
function genMap(cols,rows,level,rf){
  var g=[],r,c;
  for(r=0;r<rows;r++){
    g[r]=[];
    for(c=0;c<cols;c++){
      // 边框 + 偶数交点 = 不可破坏硬墙(保证网格 100% 连通)
      g[r][c]=(r===0||c===0||r===rows-1||c===cols-1||(r%2===0&&c%2===0))?1:0;
    }
  }
  var sp={c:1,r:1};
  var dens=0.44+Math.min(0.22,level*0.022);
  for(r=1;r<rows-1;r++){
    for(c=1;c<cols-1;c++){
      if(g[r][c])continue;
      if(Math.abs(c-sp.c)<=1&&Math.abs(r-sp.r)<=1)continue;  // 出生点 3×3 必空
      if(rf()<dens)g[r][c]=2;
    }
  }
  // 出口:藏在离出生点较远的木箱下
  var cand=[];
  for(r=1;r<rows-1;r++)for(c=1;c<cols-1;c++){
    if(g[r][c]!==2)continue;
    var d=Math.abs(c-sp.c)+Math.abs(r-sp.r);
    if(d<3)continue;
    cand.push({c:c,r:r,w:d+rf()*4});
  }
  var dr;
  if(cand.length){
    cand.sort(function(a,b){return b.w-a.w});
    dr={c:cand[0].c,r:cand[0].r};
  }else{
    var best=null,bd=-1;
    for(r=1;r<rows-1;r++)for(c=1;c<cols-1;c++){
      if(g[r][c]!==0)continue;
      var dd=Math.abs(c-sp.c)+Math.abs(r-sp.r);
      if(dd>bd){bd=dd;best={c:c,r:r}}
    }
    dr=best||{c:cols-2,r:rows-2};
  }
  return {grid:g,cols:cols,rows:rows,spawn:sp,door:dr,under:g[dr.r][dr.c]===2};
}

/* ================== GAME · 炸弹人 ================== */
var COLS=13,ROWS=11,CELL=28,BX=0,BY=0;
var DC=[0,1,0,-1],DR=[-1,0,1,0];              // 上 右 下 左
var G={state:'start',score:0,level:1,lives:3,time:120,maxCombo:0,shake:0,
  powMax:1,bombMax:1,spd:6.4};
var P={c:1,r:1,x:0,y:0,fx:1,fy:1,tc:1,tr:1,t:1,moving:false,mdir:2,face:2,inv:0};
var grid=[],door={c:1,r:1,open:false},SPAWN={c:1,r:1};
var bombs=[],flames=[],items=[],enemies=[],parts=[],floats=[];
var padDir=-1,swipe={on:false,x:0,y:0,dir:-1},keys={};
var T0=Date.now();
function nowS(){return (Date.now()-T0)/1000}
function cellX(c){return BX+c*CELL+CELL/2}
function cellY(r){return BY+r*CELL+CELL/2}
function ease(t){return t*t*(3-2*t)}

function onResize(){
  var pad=8;
  var top=clamp(Math.round(VH*0.09),52,78);
  var ctrl=clamp(Math.round(VH*0.2),110,166);
  var bot=VH-ctrl-8;
  var availW=VW-pad*2,availH=bot-top;
  CELL=Math.max(12,Math.floor(Math.min(availW/COLS,availH/ROWS)));
  BX=Math.round((VW-COLS*CELL)/2);
  BY=Math.round(top+Math.max(0,(availH-ROWS*CELL)/2));
}

/* --- 关卡搭建 --- */
function buildLevel(n){
  var m=genMap(COLS,ROWS,n,frnd);
  grid=m.grid;
  door={c:m.door.c,r:m.door.r,open:!m.under};
  SPAWN={c:m.spawn.c,r:m.spawn.r};
  bombs=[];flames=[];items=[];enemies=[];parts=[];floats=[];
  P.c=m.spawn.c;P.r=m.spawn.r;P.fx=P.c;P.fy=P.r;P.tc=P.c;P.tr=P.r;
  P.t=1;P.moving=false;P.mdir=2;P.face=2;P.inv=1;
  G.time=Math.max(72,130-n*6);
  var free=[],r,c;
  for(r=1;r<ROWS-1;r++)for(c=1;c<COLS-1;c++){
    if(grid[r][c]!==0)continue;
    if(Math.abs(c-P.c)<=2&&Math.abs(r-P.r)<=2)continue;
    free.push({c:c,r:r});
  }
  var cnt=Math.min(2+Math.floor((n-1)/2),5);
  for(var i=0;i<cnt&&free.length;i++){
    var k=rnd(free.length),cell=free.splice(k,1)[0];
    enemies.push({c:cell.c,r:cell.r,fx:cell.c,fy:cell.r,tc:cell.c,tr:cell.r,
      x:cellX(cell.c),y:cellY(cell.r),t:1,moving:false,dir:rnd(4),
      spd:Math.min(5.1,2.9+n*0.22),kind:i%3});
  }
  syncP();
}

/* --- 通行判定 --- */
function canWalk(c,r){
  if(c<0||r<0||c>=COLS||r>=ROWS)return false;
  if(grid[r][c]!==0)return false;
  for(var i=0;i<bombs.length;i++)if(bombs[i].c===c&&bombs[i].r===r)return false;
  return true;
}
function bombAt(c,r){
  for(var i=0;i<bombs.length;i++)if(bombs[i].c===c&&bombs[i].r===r)return bombs[i];
  return null;
}
function flameAt(c,r){
  for(var i=0;i<flames.length;i++)if(flames[i].c===c&&flames[i].r===r)return true;
  return false;
}
function dangerAt(c,r){
  for(var i=0;i<bombs.length;i++){
    var b=bombs[i];
    if(c===b.c){
      var step=r<b.r?-1:1,ok=true;
      for(var rr=b.r+step;rr!==r;rr+=step)if(grid[rr][c]===1){ok=false;break}
      if(ok&&Math.abs(r-b.r)<=b.pow)return true;
    }
    if(r===b.r){
      var st2=c<b.c?-1:1,ok2=true;
      for(var cc=b.c+st2;cc!==c;cc+=st2)if(grid[r][cc]===1){ok2=false;break}
      if(ok2&&Math.abs(c-b.c)<=b.pow)return true;
    }
  }
  return false;
}

/* --- 玩家 --- */
function syncP(){
  var ax=P.moving?P.fx:P.c,ay=P.moving?P.fy:P.r;
  var bx=P.moving?P.tc:P.c,by=P.moving?P.tr:P.r;
  var k=P.moving?ease(P.t):0;
  P.x=cellX(ax+(bx-ax)*k);
  P.y=cellY(ay+(by-ay)*k);
}
function wantDir(){
  if(swipe.dir>=0)return swipe.dir;
  if(padDir>=0)return padDir;
  for(var d=0;d<4;d++)if(keys[d])return d;
  return -1;
}
function updatePlayer(dt){
  if(P.inv>0)P.inv-=dt;
  var d=wantDir();
  if(P.moving){
    // 反向可即时折返,手感更跟手
    if(d>=0&&d===((P.mdir+2)%4)&&P.t>0.18){
      var tc0=P.fx,tr0=P.fy;
      P.fx=P.tc;P.fy=P.tr;P.tc=tc0;P.tr=tr0;P.t=1-P.t;P.mdir=d;
    }
    P.t+=dt*G.spd;
    if(P.t>=1){
      P.t=1;P.moving=false;P.c=P.tc;P.r=P.tr;
      onCell();
    }
  }else if(d>=0){
    P.face=d;
    var nc=P.c+DC[d],nr=P.r+DR[d];
    if(canWalk(nc,nr)){
      P.fx=P.c;P.fy=P.r;P.tc=nc;P.tr=nr;P.moving=true;P.t=0;P.mdir=d;
    }
  }
  syncP();
}
function onCell(){
  // 吃道具
  for(var i=items.length-1;i>=0;i--){
    if(items[i].c===P.c&&items[i].r===P.r){takeItem(items[i]);items.splice(i,1)}
  }
  // 进出门
  if(door.open&&P.c===door.c&&P.r===door.r&&G.state==='play')levelClear();
}
function takeItem(it){
  if(it.k==='f'){G.powMax=Math.min(5,G.powMax+1);addFloat(cellX(it.c),cellY(it.r),'火力 +1','#ff9d4a')}
  else if(it.k==='b'){G.bombMax=Math.min(4,G.bombMax+1);addFloat(cellX(it.c),cellY(it.r),'炸弹 +1','#9a7bff')}
  else if(it.k==='s'){G.spd=Math.min(11,G.spd*1.15);addFloat(cellX(it.c),cellY(it.r),'加速!','#7fe3ff')}
  else {G.lives=Math.min(6,G.lives+1);addFloat(cellX(it.c),cellY(it.r),'加一条命','#ff6f9a')}
  tone(760,.07,'triangle',.06,1040);
}

/* --- 炸弹 / 爆炸 --- */
function placeBomb(){
  if(G.state!=='play')return;
  var c=P.c,r=P.r;
  if(P.moving){c=P.t<0.5?P.fx:P.tc;r=P.t<0.5?P.fy:P.tr}
  if(bombAt(c,r))return;
  if(bombs.length>=G.bombMax){tone(150,.08,'square',.04,110);return}
  bombs.push({c:c,r:r,t:2.2,pow:G.powMax});
  tone(300,.08,'square',.05,190);
}
function addParts(x,y,col,n){
  if(parts.length>150)return;
  for(var i=0;i<n;i++)parts.push({x:x,y:y,vx:(frnd()-.5)*250,vy:(frnd()-.5)*250-70,
    life:.45+frnd()*.45,col:col,s:2+frnd()*3});
}
function addFloat(x,y,txt,col){floats.push({x:x,y:y,t:txt,c:col,life:.95})}
function breakCrate(c,r){
  if(grid[r][c]!==2)return;
  grid[r][c]=0;
  addParts(cellX(c),cellY(r),'#b07a3d',8);
  noise(.07,.035);
  if(door.c===c&&door.r===r){door.open=true;addFloat(cellX(c),cellY(r),'找到出口!','#7cffb0');tone(880,.12,'sine',.07,1200)}
  else{
    G.score+=10;
    if(frnd()<0.28){
      var r2=frnd();
      var k=r2<0.32?'f':(r2<0.62?'b':(r2<0.86?'s':'h'));
      items.push({c:c,r:r,k:k,bob:frnd()*6});
    }
  }
}
function boom(b){
  var cells=[{c:b.c,r:b.r}],d,i;
  for(d=0;d<4;d++){
    for(i=1;i<=b.pow;i++){
      var c=b.c+DC[d]*i,r=b.r+DR[d]*i;
      if(c<0||r<0||c>=COLS||r>=ROWS)break;
      if(grid[r][c]===1)break;
      cells.push({c:c,r:r});
      if(grid[r][c]===2){breakCrate(c,r);break}
      var ob=bombAt(c,r);
      if(ob&&ob.t>0.06)ob.t=0.06;                  // 连锁引爆
    }
  }
  for(i=0;i<cells.length;i++){
    flames.push({c:cells[i].c,r:cells[i].r,life:.52,max:.52});
  }
  // 一次爆炸杀多个敌人有倍率
  var killed=0;
  for(i=enemies.length-1;i>=0;i--){
    var e=enemies[i],hit=false;
    for(var j=0;j<cells.length;j++)if(cells[j].c===e.c&&cells[j].r===e.r){hit=true;break}
    if(!hit)continue;
    addParts(e.x,e.y,'#c98bff',10);
    enemies.splice(i,1);killed++;
  }
  if(killed>0){
    var mul=1+0.5*(killed-1);
    var got=Math.round(100*killed*mul);
    G.score+=got;
    G.maxCombo=Math.max(G.maxCombo,killed);
    addFloat(cellX(b.c),cellY(b.r)-CELL*0.4,'+'+got+(killed>1?' x'+killed:''),'#ffd45c');
    tone(880,.09,'square',.06,1200);
    if(killed>1)setTimeout(function(){tone(1180,.1,'square',.06,1500)},70);
  }
  G.shake=Math.max(G.shake,.5);
  noise(.24,.1);tone(85,.32,'sawtooth',.07,36);
}
function hurt(){
  if(P.inv>0||G.state!=='play')return;
  G.lives--;
  G.shake=.6;
  addParts(P.x,P.y,'#7fe3ff',14);
  noise(.3,.09);tone(220,.32,'sawtooth',.07,70);
  if(G.lives<=0){gameOver();return}
  P.c=SPAWN.c;P.r=SPAWN.r;
  P.fx=P.c;P.fy=P.r;P.tc=P.c;P.tr=P.r;P.t=1;P.moving=false;
  P.inv=1.8;
  syncP();
}
function levelClear(){
  var bonus=300+Math.floor(G.time)*4;
  G.score+=bonus;
  addFloat(cellX(door.c),cellY(door.r),'过关 +'+bonus,'#7cffb0');
  G.shake=.3;
  tone(523,.1,'sine',.06);setTimeout(function(){tone(659,.1,'sine',.06)},90);
  setTimeout(function(){tone(784,.16,'sine',.06)},180);
  G.level++;
  buildLevel(G.level);
}

/* --- 敌人 --- */
function updateEnemies(dt){
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(e.moving){
      e.t+=dt*e.spd;
      if(e.t>=1){e.t=1;e.moving=false;e.c=e.tc;e.r=e.tr}
    }else{
      var opts=[],d;
      for(d=0;d<4;d++){
        var nc=e.c+DC[d],nr=e.r+DR[d];
        if(!canWalk(nc,nr))continue;
        if(flameAt(nc,nr)||dangerAt(nc,nr))continue;
        opts.push(d);
      }
      var nd=-1;
      if(opts.length){
        if(opts.indexOf(e.dir)>=0&&frnd()<0.62)nd=e.dir;
        else nd=pick(opts);
      }else{
        for(d=0;d<4;d++){if(canWalk(e.c+DC[d],e.r+DR[d]))opts.push(d)}
        if(opts.length)nd=pick(opts);
        else nd=(e.dir+2)%4;
      }
      e.dir=nd;
      if(nd>=0&&canWalk(e.c+DC[nd],e.r+DR[nd])){
        e.fx=e.c;e.fy=e.r;e.tc=e.c+DC[nd];e.tr=e.r+DR[nd];e.moving=true;e.t=0;
      }
    }
    var k=e.moving?ease(e.t):0;
    var ax=e.moving?e.fx:e.c,ay=e.moving?e.fy:e.r;
    var bx=e.moving?e.tc:e.c,by=e.moving?e.tr:e.r;
    e.x=cellX(ax+(bx-ax)*k);e.y=cellY(ay+(by-ay)*k);
    // 碰到玩家 / 走进火焰
    if(Math.hypot(e.x-P.x,e.y-P.y)<CELL*0.62)hurt();
    if(flameAt(e.c,e.r)){addParts(e.x,e.y,'#c98bff',10);enemies.splice(i,1);i--;G.score+=100}
  }
}

/* --- 更新 --- */
function update(dt){
  if(G.state!=='play')return;
  G.time-=dt;
  if(G.time<=0){G.time=55;hurt()}
  if(G.state!=='play')return;
  updatePlayer(dt);
  if(G.state!=='play')return;
  updateEnemies(dt);
  if(G.state!=='play')return;
  for(var i=bombs.length-1;i>=0;i--){
    bombs[i].t-=dt;
    if(bombs[i].t<=0){var b=bombs[i];bombs.splice(i,1);boom(b)}
  }
  for(var f=flames.length-1;f>=0;f--){
    flames[f].life-=dt;
    if(flames[f].life<=0)flames.splice(f,1);
  }
  // 火焰伤害
  var pc=Math.round((P.x-BX)/CELL-0.5),pr=Math.round((P.y-BY)/CELL-0.5);
  pc=clamp(pc,0,COLS-1);pr=clamp(pr,0,ROWS-1);
  if(flameAt(pc,pr))hurt();
  // 粒子 / 飘字
  for(var q=parts.length-1;q>=0;q--){
    var pt=parts[q];pt.life-=dt;pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=600*dt;
    if(pt.life<=0)parts.splice(q,1);
  }
  for(var fl=floats.length-1;fl>=0;fl--){
    floats[fl].life-=dt;floats[fl].y-=30*dt;
    if(floats[fl].life<=0)floats.splice(fl,1);
  }
  if(G.shake>0)G.shake-=dt*1.8;
  syncHud();
}
function syncHud(){
  $('hscore').textContent=G.score;
  $('hlevel').textContent=G.level;
  $('hlife').textContent=G.lives>0?'♥'+G.lives:'—';
  $('htime').textContent=Math.max(0,Math.ceil(G.time));
}

/* --- 绘制 --- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawBoard(){
  var r,c;
  for(r=0;r<ROWS;r++){
    for(c=0;c<COLS;c++){
      var x=BX+c*CELL,y=BY+r*CELL,v=grid[r][c];
      if(v===1){
        rr(x+1,y+1,CELL-2,CELL-2,CELL*0.16);
        ctx.fillStyle='#2c2450';ctx.fill();
        ctx.fillStyle='#3e3269';
        rr(x+2,y+2,CELL-4,CELL*0.34,CELL*0.12);ctx.fill();
        ctx.fillStyle='rgba(0,0,0,.34)';
        ctx.fillRect(x+2,y+CELL-4,CELL-4,3);
        ctx.fillStyle='rgba(190,160,255,.12)';
        ctx.fillRect(x+CELL*0.18,y+CELL*0.52,CELL*0.16,CELL*0.16);
      }else{
        ctx.fillStyle=((r+c)%2)?'#221a38':'#1e1730';
        ctx.fillRect(x,y,CELL,CELL);
        ctx.fillStyle='rgba(255,255,255,.022)';
        ctx.fillRect(x+1,y+1,CELL-2,1);
      }
      if(v===2){
        ctx.fillStyle='#a9702f';
        rr(x+1.5,y+1.5,CELL-3,CELL-3,CELL*0.14);ctx.fill();
        ctx.fillStyle='rgba(255,214,150,.22)';
        rr(x+1.5,y+1.5,CELL-3,CELL*0.42,CELL*0.14);ctx.fill();
        ctx.strokeStyle='rgba(60,34,10,.55)';ctx.lineWidth=Math.max(1,CELL*0.05);
        ctx.beginPath();
        ctx.moveTo(x+2,y+CELL*0.34);ctx.lineTo(x+CELL-2,y+CELL*0.34);
        ctx.moveTo(x+2,y+CELL*0.7);ctx.lineTo(x+CELL-2,y+CELL*0.7);
        ctx.moveTo(x+CELL*0.5,y+2);ctx.lineTo(x+CELL*0.5,y+CELL-2);
        ctx.stroke();
        ctx.strokeStyle='rgba(255,235,190,.35)';ctx.lineWidth=1;
        ctx.strokeRect(x+3,y+3,CELL-6,CELL-6);
      }
    }
  }
  // 出口
  if(door.open){
    var dx=BX+door.c*CELL,dy=BY+door.r*CELL;
    var pulse=0.55+0.45*Math.sin(nowS()*4);
    ctx.globalAlpha=0.35*pulse;
    ctx.fillStyle='#59ffb0';
    rr(dx-2,dy-2,CELL+4,CELL+4,CELL*0.3);ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle='#0b2b21';
    rr(dx+CELL*0.16,dy+CELL*0.1,CELL*0.68,CELL*0.82,CELL*0.1);ctx.fill();
    ctx.fillStyle='#2fbf85';
    ctx.beginPath();
    ctx.arc(dx+CELL*0.5,dy+CELL*0.46,CELL*0.24,Math.PI,0);
    ctx.lineTo(dx+CELL*0.74,dy+CELL*0.9);
    ctx.lineTo(dx+CELL*0.26,dy+CELL*0.9);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(190,255,225,'+(0.35+0.5*pulse)+')';
    ctx.beginPath();ctx.arc(dx+CELL*0.5,dy+CELL*0.5,CELL*0.12,0,6.2832);ctx.fill();
  }
}
function drawBombs(){
  for(var i=0;i<bombs.length;i++){
    var b=bombs[i],cx=cellX(b.c),cy=cellY(b.r);
    var pulse=1+Math.sin(nowS()*15+i)*0.07;
    var rad=CELL*0.32*pulse;
    if(b.t<0.7){
      ctx.globalAlpha=0.25+0.25*Math.abs(Math.sin(nowS()*22));
      ctx.fillStyle='#ff5a3c';
      ctx.beginPath();ctx.arc(cx,cy,rad*1.5,0,6.2832);ctx.fill();
      ctx.globalAlpha=1;
    }
    ctx.fillStyle='rgba(0,0,0,.4)';
    ctx.beginPath();ctx.ellipse(cx,cy+rad*0.78,rad*0.9,rad*0.4,0,0,6.2832);ctx.fill();
    var g2=ctx.createRadialGradient(cx-rad*0.34,cy-rad*0.4,rad*0.15,cx,cy,rad*1.05);
    g2.addColorStop(0,'#5a5a78');g2.addColorStop(.55,'#2a2640');g2.addColorStop(1,'#141024');
    ctx.fillStyle=g2;
    ctx.beginPath();ctx.arc(cx,cy,rad,0,6.2832);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.beginPath();ctx.arc(cx-rad*0.34,cy-rad*0.36,rad*0.2,0,6.2832);ctx.fill();
    // 引信
    ctx.strokeStyle='#c9a06a';ctx.lineWidth=Math.max(1.5,CELL*0.055);
    ctx.beginPath();ctx.moveTo(cx+rad*0.3,cy-rad*0.85);
    ctx.quadraticCurveTo(cx+rad*0.9,cy-rad*1.3,cx+rad*0.55,cy-rad*1.75);ctx.stroke();
    // 火花
    var sx=cx+rad*0.55,sy=cy-rad*1.75;
    ctx.fillStyle='#ffd45c';
    ctx.beginPath();ctx.arc(sx,sy,Math.max(2,CELL*0.09),0,6.2832);ctx.fill();
    ctx.fillStyle='rgba(255,120,40,.85)';
    ctx.beginPath();ctx.arc(sx,sy,Math.max(3.5,CELL*0.15),0,6.2832);ctx.fill();
  }
}
function drawFlames(){
  for(var i=0;i<flames.length;i++){
    var f=flames[i],l=clamp(f.life/f.max,0,1);
    var a=clamp(l*1.6,0,1);
    var cx=cellX(f.c),cy=cellY(f.r);
    var base=CELL*(0.36+0.2*(1-l));
    ctx.globalAlpha=a*0.45;ctx.fillStyle='#ff3d12';
    ctx.beginPath();ctx.arc(cx,cy,base*1.18,0,6.2832);ctx.fill();
    ctx.globalAlpha=a*0.72;ctx.fillStyle='#ff7b1c';
    ctx.beginPath();ctx.arc(cx,cy,base*0.92,0,6.2832);ctx.fill();
    ctx.globalAlpha=a*0.9;ctx.fillStyle='#ffd23f';
    ctx.beginPath();ctx.arc(cx,cy,base*0.64,0,6.2832);ctx.fill();
    ctx.globalAlpha=a;ctx.fillStyle='#fff8dc';
    ctx.beginPath();ctx.arc(cx,cy,base*0.3,0,6.2832);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawItems(){
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='900 '+Math.round(CELL*0.6)+'px system-ui,sans-serif';
  for(var i=0;i<items.length;i++){
    var it=items[i],cx=cellX(it.c),cy=cellY(it.r)+Math.sin(nowS()*3+it.bob)*CELL*0.06;
    var glow=0.35+0.25*Math.sin(nowS()*4+it.bob);
    ctx.globalAlpha=glow;
    ctx.fillStyle={f:'#ff9d4a',b:'#9a7bff',s:'#7fe3ff',h:'#ff6f9a'}[it.k];
    ctx.beginPath();ctx.arc(cx,cy,CELL*0.36,0,6.2832);ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle='#fff';
    ctx.fillText({f:'🔥',b:'💣',s:'👟',h:'❤'}[it.k],cx,cy+1);
  }
}
function drawEnemies(){
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i],x=e.x,y=e.y;
    var wob=Math.sin(nowS()*6+e.x*0.05)*CELL*0.035;
    var col=['#b26bff','#ff6f9a','#ffb44a'][e.kind];
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();ctx.ellipse(x,y+CELL*0.3,CELL*0.3,CELL*0.12,0,0,6.2832);ctx.fill();
    ctx.fillStyle=col;
    ctx.beginPath();ctx.arc(x,y+wob,CELL*0.31,Math.PI,0);
    ctx.lineTo(x+CELL*0.31,y+CELL*0.24);
    for(var k=0;k<3;k++){
      var bx=x+CELL*0.31-CELL*0.2*k;
      ctx.quadraticCurveTo(bx-CELL*0.05,y+CELL*0.36,bx-CELL*0.16,y+CELL*0.24);
    }
    ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.28)';
    ctx.beginPath();ctx.arc(x-CELL*0.1,y-CELL*0.16+wob,CELL*0.09,0,6.2832);ctx.fill();
    // 眼睛
    var ex=P.x>x?CELL*0.05:-CELL*0.05;
    for(var s=-1;s<=1;s+=2){
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(x+s*CELL*0.12,y-CELL*0.02+wob,CELL*0.085,0,6.2832);ctx.fill();
      ctx.fillStyle='#2a1030';
      ctx.beginPath();ctx.arc(x+s*CELL*0.12+ex,y-CELL*0.02+wob,CELL*0.042,0,6.2832);ctx.fill();
    }
    ctx.strokeStyle='rgba(60,10,60,.5)';ctx.lineWidth=Math.max(1,CELL*0.045);
    ctx.beginPath();ctx.moveTo(x-CELL*0.16,y-CELL*0.16+wob);ctx.lineTo(x-CELL*0.06,y-CELL*0.1+wob);
    ctx.moveTo(x+CELL*0.16,y-CELL*0.16+wob);ctx.lineTo(x+CELL*0.06,y-CELL*0.1+wob);ctx.stroke();
  }
}
function drawPlayer(){
  var blink=P.inv>0&&Math.floor(nowS()*12)%2===0;
  if(blink)ctx.globalAlpha=0.4;
  var x=P.x,y=P.y+Math.sin(nowS()*8)*CELL*0.02;
  ctx.fillStyle='rgba(0,0,0,.32)';
  ctx.beginPath();ctx.ellipse(x,y+CELL*0.3,CELL*0.28,CELL*0.11,0,0,6.2832);ctx.fill();
  var g2=ctx.createLinearGradient(x,y-CELL*0.3,x,y+CELL*0.3);
  g2.addColorStop(0,'#d8f6ff');g2.addColorStop(1,'#4fc4ef');
  ctx.fillStyle=g2;
  ctx.beginPath();ctx.arc(x,y,CELL*0.3,0,6.2832);ctx.fill();
  // 头盔
  ctx.fillStyle='#2b6f9a';
  ctx.beginPath();ctx.arc(x,y-CELL*0.02,CELL*0.3,Math.PI*1.02,Math.PI*1.98);ctx.fill();
  // 眼睛(朝移动方向偏移)
  var ox=DC[P.face]*CELL*0.045,oy=DR[P.face]*CELL*0.045;
  for(var s=-1;s<=1;s+=2){
    ctx.fillStyle='#0d2233';
    ctx.beginPath();ctx.arc(x+s*CELL*0.1+ox,y+CELL*0.05+oy,CELL*0.05,0,6.2832);ctx.fill();
  }
  // 高光
  ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.beginPath();ctx.arc(x-CELL*0.12,y-CELL*0.14,CELL*0.07,0,6.2832);ctx.fill();
  ctx.globalAlpha=1;
}
function draw(){
  ctx.save();
  if(G.shake>0){ctx.translate((frnd()-.5)*14*G.shake,(frnd()-.5)*14*G.shake)}
  var g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#241b3d');g.addColorStop(.55,'#1a1428');g.addColorStop(1,'#0f0b1c');
  ctx.fillStyle=g;ctx.fillRect(-16,-16,VW+32,VH+32);
  // 光晕
  var rg=ctx.createRadialGradient(VW*0.5,VH*0.34,0,VW*0.5,VH*0.34,Math.max(VW,VH)*0.7);
  rg.addColorStop(0,'rgba(140,100,255,.16)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,VW,VH);

  drawBoard();
  drawItems();
  drawBombs();
  drawEnemies();
  drawPlayer();
  drawFlames();

  for(var q=0;q<parts.length;q++){
    var pt=parts[q];
    ctx.globalAlpha=clamp(pt.life*1.8,0,1);
    ctx.fillStyle=pt.col;ctx.fillRect(pt.x,pt.y,pt.s,pt.s);
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(var f=0;f<floats.length;f++){
    var fl=floats[f];
    ctx.globalAlpha=clamp(fl.life,0,1);
    ctx.font='900 '+Math.max(13,Math.round(CELL*0.55))+'px system-ui,sans-serif';
    ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=3;
    ctx.strokeText(fl.t,fl.x,fl.y);ctx.fillStyle=fl.c;
    ctx.fillText(fl.t,fl.x,fl.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

/* --- 生命周期 --- */
function startGame(){
  G.score=0;G.level=1;G.lives=3;G.maxCombo=0;G.shake=0;
  G.powMax=1;G.bombMax=1;G.spd=6.4;
  G.state='play';
  buildLevel(1);
  $('start').classList.add('hide');$('over').classList.add('hide');
  document.body.classList.add('playing');
  KIT.addPlay();KIT.streak();
  syncHud();
  run();
}
function gameOver(){
  G.state='over';stop();
  document.body.classList.remove('playing');
  var isNew=KIT.setBest(G.score);
  $('onewrec').style.display=isNew?'block':'none';
  $('ostats').innerHTML=
    '本局得分 <b>'+G.score+'</b><br>'+
    '到达关卡 <b>第 '+G.level+' 关</b><br>'+
    '单次连爆 <b>x'+Math.max(1,G.maxCombo)+'</b><br>'+
    '历史最高 <b>'+KIT.best()+'</b>';
  $('mini2').innerHTML='已玩 <b>'+KIT.plays()+'</b> 局 · 连续打卡 <b>'+KIT.streakNow()+'</b> 天 🔥';
  $('over').classList.remove('hide');
  tone(440,.14,'sine',.06);setTimeout(function(){tone(350,.14,'sine',.06)},140);
  setTimeout(function(){tone(262,.3,'sine',.06)},280);
}

/* --- 输入:虚拟方向键 / 键盘 / 画布滑动 / 投弹 --- */
Array.prototype.forEach.call(document.querySelectorAll('#pad button'),function(btn){
  var d=+btn.getAttribute('data-d');
  function on(e){e.preventDefault();padDir=d;btn.classList.add('on')}
  function off(){if(padDir===d)padDir=-1;btn.classList.remove('on')}
  btn.addEventListener('pointerdown',on,{passive:false});
  btn.addEventListener('pointerup',off);
  btn.addEventListener('pointercancel',off);
  btn.addEventListener('pointerleave',off);
});
$('bombbtn').addEventListener('pointerdown',function(e){e.preventDefault();placeBomb()},{passive:false});

cv.addEventListener('pointerdown',function(e){
  if(G.state!=='play')return;
  swipe.on=true;swipe.x=e.clientX;swipe.y=e.clientY;swipe.dir=-1;
},{passive:true});
cv.addEventListener('pointermove',function(e){
  if(!swipe.on||G.state!=='play')return;
  var dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;
  if(Math.hypot(dx,dy)<16)return;
  if(Math.abs(dx)>Math.abs(dy))swipe.dir=dx>0?1:3;
  else swipe.dir=dy>0?2:0;
  swipe.x=e.clientX;swipe.y=e.clientY;
},{passive:true});
cv.addEventListener('pointerup',function(){swipe.on=false;swipe.dir=-1});
cv.addEventListener('pointercancel',function(){swipe.on=false;swipe.dir=-1});

window.addEventListener('keydown',function(e){
  var k=e.key;
  if(G.state!=='play'){
    if(k===' '||k==='Enter'){startGame();e.preventDefault()}
    return;
  }
  if(k===' '){placeBomb();e.preventDefault();return}
  if(k==='ArrowUp'||k==='w'||k==='W'){keys[0]=1;e.preventDefault()}
  else if(k==='ArrowRight'||k==='d'||k==='D'){keys[1]=1;e.preventDefault()}
  else if(k==='ArrowDown'||k==='s'||k==='S'){keys[2]=1;e.preventDefault()}
  else if(k==='ArrowLeft'||k==='a'||k==='A'){keys[3]=1;e.preventDefault()}
});
window.addEventListener('keyup',function(e){
  var k=e.key;
  if(k==='ArrowUp'||k==='w'||k==='W')delete keys[0];
  else if(k==='ArrowRight'||k==='d'||k==='D')delete keys[1];
  else if(k==='ArrowDown'||k==='s'||k==='S')delete keys[2];
  else if(k==='ArrowLeft'||k==='a'||k==='A')delete keys[3];
});

/* --- 启动 --- */
$('startbtn').addEventListener('click',startGame);
$('againbtn').addEventListener('click',startGame);
$('hubbtn').addEventListener('click',function(){location.href='/'});
$('sharebtn').addEventListener('click',function(){
  share('我在「炸弹人」炸到第 '+G.level+' 关、'+G.score+' 分,单次连爆 x'+Math.max(1,G.maxCombo)+
    '!来比比谁手更稳? https://yaoaibing.github.io/bomb/');
});
$('mini').innerHTML='历史最高 <b>'+KIT.best()+'</b> · 已玩 <b>'+KIT.plays()+'</b> 局'+
  (KIT.streakNow()>1?' · 连续打卡 <b>'+KIT.streakNow()+'</b> 天 🔥':'');

resize();
buildLevel(1);
syncHud();
draw();
})();
</script>

<!-- __hub_enhance__ -->
<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';
  var name=(document.title||'游戏').split(/[ ··|]/)[0];

  // 回大厅
  var hb=document.createElement('button');
  hb.setAttribute('type','button');hb.textContent='\uD83C\uDFE0';
  hb.style.cssText='position:fixed;top:'+SAFE+';left:10px;z-index:99;border:0;width:36px;height:36px;'+
    'border-radius:12px;font-size:15px;background:rgba(255,255,255,.14);color:#fff;'+
    'border:1px solid rgba(255,255,255,.2);;cursor:pointer';
  hb.onclick=function(){location.href='/'};
  document.body.appendChild(hb);

  // 结算页:晒战绩 + 换个游戏
  var over=document.getElementById('over');
  if(over){
    var box=document.createElement('div');
    box.style.cssText='display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px';
    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>


<!-- __hub_recent__ -->
<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='bomb'});
  r.unshift({k:'bomb',n:'炸弹人',e:'💣'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:定期把本游戏自己的最高分同步进共享的 __best
     (不用劫持 localStorage.setItem —— 那在部分环境下属性不可写会静默失败) */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['bomb_best','bomb_hi','bomb_max','bomb_score'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['bomb']||0)){
            B['bomb']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
