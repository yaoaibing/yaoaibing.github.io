var TOTAL=GAMES.length;

var HALF=Math.ceil(TOTAL/2);

/* 站内路径:本页在 /stats/ 下,游戏在兄弟目录;写成兼容 index.html 与 file:// 预览,否则本地打开时 202 条链接全指回 /stats/ */
var PREFIX=/(^|\/)stats\/(index\.html)?$/.test(location.pathname)?'../':'./';
function gurl(k){return PREFIX+k+'/'}

var best=jp('__best',{});
var days=jp('__days',[]);
var plays=+lg('__plays_all','0')||0;
var streak=+lg('__streak','0')||0;
var recent=jp('__recent',[]);

var playedSet={};
recent.forEach(function(x){if(x&&x.k)playedSet[x.k]=1});
Object.keys(best).forEach(function(k){playedSet[k]=1});

/* 顶部统计 */
$('s1').textContent=streak;
$('s2').textContent=plays;
$('s3').textContent=Object.keys(playedSet).length+'/'+TOTAL;

/* 打卡日历:最近 30 天 */
function dstr(d){
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
var daySet={};
days.forEach(function(x){daySet[x]=1});
var todayStr=dstr(new Date());
var html=[];
for(var i=29;i>=0;i--){
  var d=new Date(Date.now()-i*864e5);
  var s=dstr(d);
  var cls='day'+(daySet[s]?' on':'')+(s===todayStr?' today':'');
  html.push('<div class="'+cls+'"></div>');
}
$('cal').innerHTML=html.join('');
var onCount=0;
for(var k2 in daySet)if(daySet[k2])onCount++;
$('calinfo').textContent=onCount?('累计打卡 '+onCount+' 天'):'从今天开始记录';

/* 排行榜:有分数的按分数降序,没玩的排后面 */
var rows=GAMES.map(function(g){
  var k=g[0];
  return {k:k,n:g[1],e:g[2],cat:g[3],sc:best[k]||0,played:!!playedSet[k]};
}).sort(function(a,b){
  if(a.sc!==b.sc)return b.sc-a.sc;
  if(a.played!==b.played)return a.played?-1:1;
  return 0;
});

var scored=rows.filter(function(r){return r.sc>0}).length;
$('listinfo').textContent=scored?('已有 '+scored+' 款成绩'):'';
$('list').innerHTML=rows.map(function(r,i){
  var top=r.sc>0&&i<3?' top':'';
  var off=r.played?'':' off';
  return '<a class="row2'+top+off+'" href="'+gurl(r.k)+'">'+
    '<span class="rank">'+(r.sc>0?(i+1):'·')+'</span>'+
    '<span class="em">'+r.e+'</span>'+
    '<span class="nm"><b>'+r.n+'</b><i>'+(r.played?'玩过':'还没玩')+'</i></span>'+
    '<span class="sc'+(r.sc?'':' dash')+'">'+(r.sc?r.sc:'—')+'</span></a>';
}).join('');

/* 成就 */

  {e:'🎮',n:'初次上路',d:'玩过 1 款游戏',ok:playedCount>=1},

  {e:'🔥',n:'火苗三天',d:'连续打卡 3 天',ok:streak>=3},
  {e:'🏅',n:'一周不断',d:'连续打卡 7 天',ok:streak>=7},
  {e:'💯',n:'小有所成',d:'任意一款破 100 分',ok:maxBest>=100},
  {e:'🚀',n:'千分王者',d:'任意一款破 1000 分',ok:maxBest>=1000},
  {e:'🎯',n:'百局老兵',d:'累计游玩 100 次',ok:plays>=100},
  {e:'📅',n:'打卡达人',d:'累计打卡 30 天',ok:onCount>=30}
];
var unlocked=ACHS.filter(function(a){return a.ok}).length;

}).join('');

/* 分享 */
$('share').addEventListener('click',function(){
  var top3=rows.filter(function(r){return r.sc>0}).slice(0,3)
    .map(function(r){return r.e+r.n+' '+r.sc}).join(' / ');
  var txt='我在「各种游戏路口」玩了 '+plays+' 次,打卡 '+streak+' 天'+
    (top3?',最高分:'+top3:'')+'。'+TOTAL+' 款小游戏随便玩,来比比? '+
    'https://yaoaibing.github.io/stats/';
  if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
  function fb(){try{
    var ta=document.createElement('textarea');ta.value=txt;
    ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
    var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
});
