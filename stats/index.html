var ACHS=[
  {e:'🎮',n:'初次上路',d:'玩过 1 款游戏',ok:playedCount>=1},
  {e:'🗺️',n:'半程旅人',d:'玩过 '+HALF+' 款游戏',ok:playedCount>=HALF},
  {e:'👑',n:'全能王',d:'全部 '+TOTAL+' 款都玩过',ok:playedCount>=TOTAL},
  {e:'🔥',n:'火苗三天',d:'连续打卡 3 天',ok:streak>=3},
  {e:'🏅',n:'一周不断',d:'连续打卡 7 天',ok:streak>=7},
  {e:'💯',n:'小有所成',d:'任意一款破 100 分',ok:maxBest>=100},
  {e:'🚀',n:'千分王者',d:'任意一款破 1000 分',ok:maxBest>=1000},
  {e:'🎯',n:'百局老兵',d:'累计游玩 100 次',ok:plays>=100},
  {e:'📅',n:'打卡达人',d:'累计打卡 30 天',ok:onCount>=30}
];
var unlocked=ACHS.filter(function(a){return a.ok}).length;
$('achinfo').textContent=unlocked+'/'+ACHS.length+' 已解锁';
$('achs').innerHTML=ACHS.map(function(a){
  return '<div class="ach '+(a.ok?'on':'lock')+'">'+
    '<span class="ae">'+a.e+'</span>'+
    '<div><span class="an">'+a.n+'</span><span class="ad">'+a.d+'</span></div></div>';
}).join('');
$('s3').textContent=playedCount+'/'+TOTAL;

/* 分享 */
$('share').addEventListener('click',function(){
  var top3=rows.filter(function(r){return r.sc>0}).slice(0,3)
    .map(function(r){return r.e+r.n+' '+r.sc}).join(' / ');
  var txt='我在「各种游戏路口」玩了 '+plays+' 次,打卡 '+streak+' 天'+
    (top3?',最高分:'+top3:'')+'。'+TOTAL+' 款小游戏随便玩,来比比? '+
    'https://yaoaibing.github.io/stats/';
  if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
  function fb(){try{
    var ta=document.createElement('textarea');ta.value=txt;
    ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
    var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
});
})();
</script>
</body>
</html>
