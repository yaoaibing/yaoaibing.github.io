var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);

  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}

}

  var k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}

function buildDict() {
  BY = {}; LIST = []; POOL = [];
  var i, it, id;
  for (i = 0; i < RAW.length; i++) {
    id = RAW[i][0];
    if (id.length !== 4) continue;
    if (!BY[firstCh(id)]) BY[firstCh(id)] = [];
    BY[firstCh(id)].push(id);
    POOL.push(id);
  }
  for (i = 0; i < RAW.length; i++) {
    id = RAW[i][0];
    if (id.length !== 4) continue;
    if (RAW[i][1] && BY[lastCh(id)] && BY[lastCh(id)].length) LIST.push(id);
  }
}
buildDict();

function glossOf(id) {
  for (var i = 0; i < RAW.length; i++) if (RAW[i][0] === id) return RAW[i][1];
  return '';
}
function hasSucc(id) {
  var s = BY[lastCh(id)];
  return !!(s && s.length);
}

function note(t) { noteTx = t; noteT = 2; }

function layout() {
  var top = Math.max(84, VH * .1);
  cardW = Math.min(VW - 24, 460);
  cardH = clamp(Math.round(VH * .17), 104, 152);
  cardX = Math.round((VW - cardW) / 2);
  cardY = Math.round(top);
  optY = cardY + cardH + 44;
  optGap = 10;
  optW = Math.floor((cardW - optGap) / 2);
  var bot = VH - 100;
  optH = clamp(Math.floor((bot - optY - optGap) / 2), 58, 96);
}
function onResize() { layout(); }

function pickStart() {
  var i = 0, cand = [];
  for (i = 0; i < LIST.length; i++) if (hasSucc(LIST[i])) cand.push(LIST[i]);
  cur = pick(cand);
  if (!cur) cur = '一鸣惊人';
}

function startRound() {
  if (!cur || !hasSucc(cur)) {
    pickStart();
    note('这条龙接到底了,换一条新的');
    score += 30;
  }
  var succ = (BY[lastCh(cur)] || []).slice();
  var correct = succ.length ? pick(succ) : pick(LIST);
  opts = [correct];
  correctIdx = 0;
  var i, cand = [], tricky = [], mid = [];
  for (i = 0; i < POOL.length; i++) {
    var id = POOL[i];
    if (id === correct || id === cur) continue;
    if (firstCh(id) === lastCh(cur)) continue;
    if (lastCh(id) === lastCh(cur)) tricky.push(id);
    else if (id.indexOf(lastCh(cur)) > 0) mid.push(id);
    else cand.push(id);
  }
  var used = { correct: 1 };
  function take(arr, n) {
    var a = arr.slice(), k;
    for (k = a.length - 1; k > 0; k--) {
      var j = Math.floor(Math.random() * (k + 1)), t = a[k]; a[k] = a[j]; a[j] = t;
    }
    for (k = 0; k < a.length && n > 0; k++) {
      if (used[a[k]]) continue;
      used[a[k]] = 1;
      opts.push(a[k]);
      n--;
    }
  }
  take(tricky, 1);
  take(mid, 1);
  take(cand, 4 - opts.length);
  while (opts.length < 4) {
    var extra = pick(POOL);
    if (!used[extra] && firstCh(extra) !== lastCh(cur)) { used[extra] = 1; opts.push(extra); }
  }
  for (i = opts.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)), t = opts[i]; opts[i] = opts[j]; opts[j] = t;
  }
  for (i = 0; i < opts.length; i++) if (opts[i] === correct) correctIdx = i;
  picked = -1; lockT = 0; roundT = 20;
}

function resetGame() {
  lives = 3; score = 0; combo = 0; bestCombo = 0; solved = 0;
  picked = -1; lockT = 0; flashT = 0; noteT = 0;
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  pickStart();
  startRound();
  syncHud();
  note('点最后一个字开头的成语');
}

function syncHud() {
  $('hscore').textContent = score;
  $('hcombo').textContent = combo;
  $('hlife').textContent = lives;
  $('htime').textContent = Math.max(0, Math.ceil(roundT));
}

function answer(idx) {
  if (state !== 'play' || lockT > 0 || idx < 0 || idx >= opts.length) return;
  picked = idx;
  if (idx === correctIdx) {
    var gain = 80 + Math.round(roundT * 4) + combo * 20;
    score += gain;
    combo++;
    solved++;
    if (combo > bestCombo) bestCombo = combo;
    flashOk = true; flashT = .5;
    tone(620 + Math.min(combo, 6) * 40, .08, 'triangle', .05);
    syncHud();
    cur = opts[idx];
    startRound();
    syncHud();
  } else {
    lives--;
    combo = 0;
    lockT = 1.15;
    flashOk = false; flashT = .6;
    tone(180, .16, 'sawtooth', .06);
    note('接错啦,正确是「' + opts[correctIdx] + '」');
    syncHud();
  }
}

function timeoutRound() {
  if (lockT > 0) return;
  lives--;
  combo = 0;
  picked = correctIdx;
  lockT = 1.15;
  flashOk = false; flashT = .6;
  tone(160, .2, 'sawtooth', .06);
  note('超时了,正确是「' + opts[correctIdx] + '」');
  syncHud();
}

function finish() {
  state = 'over';
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  var rank = score >= 1600 ? '🏆 成语宗师' : score >= 1000 ? '📜 博学书生' : score >= 500 ? '🖋 私塾学童' : '🌱 刚开蒙';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '得分 <b>' + score + '</b><br>' +
    '接对 ' + solved + ' 个 · 最高连击 ' + bestCombo + '<br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '看最后一个字:选项第一个字必须和它一样,别被同尾字的成语骗了';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
}

function draw() {
  var gr = ctx.createLinearGradient(0, 0, 0, VH);
  gr.addColorStop(0, '#2a1c3e');
  gr.addColorStop(.6, '#1c1430');
  gr.addColorStop(1, '#120c22');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, VW, VH);
  drawEm('🐉', VW * .09, VH * .12, 46);
  drawEm('📜', VW * .91, VH * .88, 48);

  ctx.fillStyle = 'rgba(255,255,255,.055)';
  rr(cardX, cardY, cardW, cardH, 18); ctx.fill();
  ctx.strokeStyle = flashT > 0 ? (flashOk ? 'rgba(120,230,160,.9)' : 'rgba(255,120,120,.9)') : 'rgba(255,214,110,.3)';
  ctx.lineWidth = 2;
  rr(cardX, cardY, cardW, cardH, 18); ctx.stroke();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.font = '600 12px "PingFang SC",sans-serif';
  ctx.fillText('当前成语 · 接最后一个字', VW / 2, cardY + 20);

  var chars = cur ? cur.split('') : ['一', '鸣', '惊', '人'];
  var cs = clamp(Math.floor(cardW / 7), 34, 58);
  var totalW = cs * 4 + 10 * 3;
  var sx = (VW - totalW) / 2;
  var cy = cardY + cardH * .44;
  for (var i = 0; i < 4; i++) {
    var x = sx + i * (cs + 10);
    var isLast = i === 3;
    ctx.fillStyle = isLast ? 'rgba(255,204,90,.18)' : 'rgba(255,255,255,.07)';
    rr(x, cy - cs / 2, cs, cs, 10); ctx.fill();
    if (isLast) {
      ctx.strokeStyle = 'rgba(255,204,90,.85)'; ctx.lineWidth = 2;
      rr(x, cy - cs / 2, cs, cs, 10); ctx.stroke();
    }
    ctx.fillStyle = isLast ? '#ffd45c' : '#f2ecff';
    ctx.font = '700 ' + Math.round(cs * .62) + 'px "PingFang SC",serif';
    ctx.fillText(chars[i] || '', x + cs / 2, cy + 2);
  }
  var gl = glossOf(cur);
  if (gl) {
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.font = '600 12px "PingFang SC",sans-serif';
    ctx.fillText(gl, VW / 2, cardY + cardH - 18);
  }

  var barW = cardW - 24, bx = cardX + 12, by = cardY + cardH + 12;
  ctx.fillStyle = 'rgba(255,255,255,.1)';
  rr(bx, by, barW, 7, 4); ctx.fill();
  var p = clamp(roundT / 20, 0, 1);
  ctx.fillStyle = p > .4 ? '#7ee0a2' : p > .2 ? '#ffcc5c' : '#ff7b7b';
  rr(bx, by, Math.max(4, barW * p), 7, 4); ctx.fill();

  optRects = [];
  for (var j = 0; j < opts.length; j++) {
    var col = j % 2, row = j / 2 | 0;
    var ox = cardX + col * (optW + optGap);
    var oy = optY + row * (optH + optGap);
    optRects.push({ x: ox, y: oy, w: optW, h: optH });
    var right = lockT > 0 && j === correctIdx;
    var wrong = lockT > 0 && j === picked && j !== correctIdx;
    ctx.fillStyle = right ? 'rgba(96,208,132,.3)' : wrong ? 'rgba(240,90,90,.28)' : 'rgba(255,255,255,.075)';
    rr(ox, oy, optW, optH, 14); ctx.fill();
    ctx.strokeStyle = right ? 'rgba(120,230,160,.9)' : wrong ? 'rgba(255,120,120,.9)' : 'rgba(255,255,255,.16)';
    ctx.lineWidth = right || wrong ? 2.5 : 1.5;
    rr(ox, oy, optW, optH, 14); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    ctx.font = '700 11px "PingFang SC",sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(String(j + 1), ox + 10, oy + 8);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var id = opts[j] || '';
    var fs = Math.min(Math.round(optW * .15), Math.round(optH * .38));
    ctx.font = '700 ' + fs + 'px "PingFang SC",serif';
    var fullW = ctx.measureText(id).width;
    var left = ox + optW / 2 - fullW / 2;
    var fw = ctx.measureText(firstCh(id)).width;
    ctx.textAlign = 'left';
    ctx.fillStyle = right ? '#c9ffdc' : wrong ? '#ffd0d0' : '#f4efff';
    ctx.fillText(id.slice(1), left + fw, oy + optH / 2 + 4);
    ctx.fillStyle = 'rgba(255,212,92,.9)';
    ctx.fillText(firstCh(id), left, oy + optH / 2 + 4);
  }

  if (noteT > 0 && noteTx) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,212,92,' + Math.min(1, noteT).toFixed(2) + ')';
    ctx.font = '600 13px "PingFang SC",sans-serif';
    ctx.fillText(noteTx, VW / 2, optY + optH * 2 + optGap + 26);
  }
}

function update(dt) {
  if (noteT > 0) noteT -= dt;
  if (flashT > 0) flashT -= dt;
  if (state !== 'play') return;
  if (lockT > 0) {
    lockT -= dt;
    if (lockT <= 0) {
      lockT = 0;
      if (lives <= 0) { finish(); return; }
      cur = opts[correctIdx];
      startRound();
      syncHud();
    }
    return;
  }
  roundT -= dt;
  if (roundT <= 0) { roundT = 0; timeoutRound(); }
  if (Math.abs(roundT - Math.round(roundT)) < .02) syncHud();
}

cv.addEventListener('pointerdown', function (e) { e.preventDefault() });
cv.addEventListener('pointerup', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  var x = e.clientX, y = e.clientY, i;
  for (i = 0; i < optRects.length; i++) {
    var r = optRects[i];
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) { answer(i); return; }
  }
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key >= '1' && e.key <= '4') { e.preventDefault(); answer(+e.key - 1); }
});

function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}

$('startbtn').addEventListener('click', resetGame);
$('againbtn').addEventListener('click', resetGame);
$('newbtn').addEventListener('click', function () {
  if (state === 'play') { resetGame(); }
});
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」拿了 ' + score + ' 分,连击 ' + bestCombo + '!来对一句? ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  chainSize: function () { return LIST.length; },
  check: function (a, b) { return lastCh(a) === firstCh(b); },
  hasSucc: hasSucc,
  ids: function () { return LIST.slice(); },
  round: function () { return { cur: cur, opts: opts.slice(), correct: correctIdx, state: state, lives: lives }; },
  answer: answer
};

resize();
updMini();
syncHud();
run();

})();
</script>
