<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='badminton_best',PLAY='badminton_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 羽毛球 · 极限对拉 ================== */
var NAME = '羽毛球 · 极限对拉';
var state = 'start';
var diffIdx = 0;
var FLOOR = 0, NETX = 0, NETTOP = 0;
var me = { x: 0, tx: 0, swing: 0 }, ai = { x: 0, tx: 0, swing: 0 };
var sh = null;              /* 羽毛球 {x,y,vx,vy} */
var myScore = 0, aiScore = 0, serving = 0; /* 0=我发球 1=AI */
var rally = 0, bestRally = 0;
var stamina = 100;
var pauseT = 0, winT = 0, hitFx = 0, aiFx = 0;
var AI_SPEED = [250, 335, 425], AI_ERR = [70, 34, 10], AI_VX = [300, 430, 560];
var DIFF_N = ['新手', '进阶', '高手'];

function layout() {
  FLOOR = VH - 150;
  NETX = VW / 2;
  NETTOP = FLOOR - 84;
  me.x = clamp(me.x || VW * .25, 36, VW / 2 - 34);
  ai.x = clamp(ai.x || VW * .75, VW / 2 + 34, VW - 36);
}
function onResize() { layout(); }

function resetMatch() {
  myScore = 0; aiScore = 0; serving = 0;
  rally = 0; bestRally = 0; stamina = 100;
  me.x = VW * .25; me.tx = me.x;
  ai.x = VW * .75; ai.tx = ai.x;
  sh = null;
  pauseT = 1;
}
function startGame() {
  resetMatch();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  $('diffbtn').textContent = '🎚 ' + DIFF_N[diffIdx];
  syncHud();
}
function serve() {
  var sx = serving === 0 ? me.x : ai.x;
  var dir = serving === 0 ? 1 : -1;
  sh = { x: sx + dir * 14, y: FLOOR - 60, vx: dir * (140 + rnd(60)), vy: -460 - rnd(80) };
  rally = 0;
  tone(520, .08, 'sine', .05);
}
function syncHud() {
  $('hme').textContent = myScore;
  $('hai').textContent = aiScore;
  $('hstam').textContent = Math.round(stamina);
}
function point(who) {
  if (who === 0) myScore++; else aiScore++;
  bestRally = Math.max(bestRally, rally);
  pauseT = .9;
  sh = null;
  serving = who;
  tone(who === 0 ? 660 : 260, .18, 'sine', .06, who === 0 ? 900 : 180);
  syncHud();
  var cap = (myScore >= 10 && aiScore >= 10) ? 15 : 11;
  var lead = Math.abs(myScore - aiScore);
  if ((myScore >= cap || aiScore >= cap) || (myScore >= 11 && lead >= 2) || (aiScore >= 11 && lead >= 2)) {
    endMatch();
  }
}
function endMatch() {
  state = 'over';
  winT = 1;
  KIT.addPlay(); KIT.streak();
  var win = myScore > aiScore;
  var score = win ? 500 + (myScore - aiScore) * 40 + diffIdx * 100 : Math.max(80, 150 + myScore * 12);
  var rec = KIT.setBest(score);
  var rank = win ? (diffIdx === 2 ? '国手风范' : '球场健将') : '继续加油';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '本局得分 <b>' + score + '</b><br>' +
    '比分 ' + myScore + ' : ' + aiScore + '<br>最长回合 ' + bestRally + ' 拍<br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '站中场好回位,高点击球自动扣杀';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  tone(win ? 780 : 300, .3, 'sine', .07, win ? 1250 : 220);
}
function hitBy(who) {
  var p = who === 0 ? me : ai;
  var base = who === 0 ? 300 : AI_VX[diffIdx];
  var dir = who === 0 ? 1 : -1;
  var high = sh.y < NETTOP - 6;
  var near = Math.abs(p.x - NETX) < 120;
  var vx, vy;
  if (high && near) {           /* 扣杀 */
    vx = dir * (base + 260);
    vy = -60;
    hitFx = who === 0 ? .25 : 0; aiFx = who === 1 ? .25 : 0;
    noise(.08, .05);
    tone(180, .12, 'square', .06);
  } else {
    vx = dir * (base + rnd(80) + Math.abs(p.tx - p.x) * .5);
    vy = -(340 + rnd(160));
    tone(430 + rnd(120), .07, 'triangle', .05);
  }
  sh.vx = vx; sh.vy = vy;
  sh.x = p.x + dir * 16;
  if (who === 0) stamina = Math.max(0, stamina - 4);
  rally++;
}
function update(dt) {
  if (hitFx > 0) hitFx -= dt;
  if (aiFx > 0) aiFx -= dt;
  if (winT > 0) winT -= dt;
  if (me.swing > 0) me.swing -= dt;
  if (ai.swing > 0) ai.swing -= dt;
  if (state !== 'play') return;

  /* 体力恢复 */
  stamina = Math.min(100, stamina + dt * 6);

  if (pauseT > 0) {
    pauseT -= dt;
    if (pauseT <= 0) serve();
    return;
  }
  if (!sh) return;

  /* 我方移动 */
  var spd = stamina > 20 ? 420 : 300;
  var dx = me.tx - me.x;
  var step = clamp(dx, -spd * dt, spd * dt);
  if (Math.abs(dx) > 260 && stamina > 5) stamina = Math.max(0, stamina - dt * 10);
  me.x = clamp(me.x + step, 36, VW / 2 - 34);

  /* AI */
  var err = AI_ERR[diffIdx] * Math.sin(performance.now() * .002);
  var target = sh && sh.vx < 0 ? predictLanding() : VW * .72;
  ai.tx = clamp(target + err, VW / 2 + 34, VW - 36);
  var adx = ai.tx - ai.x;
  var aspd = AI_SPEED[diffIdx];
  ai.x = clamp(ai.x + clamp(adx, -aspd * dt, aspd * dt), VW / 2 + 34, VW - 36);

  /* 球物理 */
  sh.vy += 1250 * dt;
  sh.vx *= (1 - .12 * dt);
  sh.x += sh.vx * dt;
  sh.y += sh.vy * dt;
  /* 撞网 */
  if (Math.abs(sh.x - NETX) < 6 && sh.y > NETTOP && ((sh.vx > 0 && sh.x <= NETX) || (sh.vx < 0 && sh.x >= NETX))) {
    sh.vx = -sh.vx * .2;
    tone(140, .1, 'square', .05);
  }
  /* 出界墙 */
  if (sh.x < 12) { sh.x = 12; sh.vx = Math.abs(sh.vx) * .5; }
  if (sh.x > VW - 12) { sh.x = VW - 12; sh.vx = -Math.abs(sh.vx) * .5; }
  /* 触地 */
  if (sh.y >= FLOOR - 6) {
    point(sh.x > NETX ? 0 : 1);
    return;
  }
  /* 击球判定 */
  var dme = Math.hypot(sh.x - me.x, sh.y - (FLOOR - 58));
  if (sh.vx < 0 && dme < 42) { me.swing = .18; hitBy(0); }
  var dai = Math.hypot(sh.x - ai.x, sh.y - (FLOOR - 58));
  if (sh.vx > 0 && dai < 42) { ai.swing = .18; hitBy(1); }
}
function predictLanding() {
  if (!sh) return VW * .72;
  var x = sh.x, y = sh.y, vx = sh.vx, vy = sh.vy, t;
  for (t = 0; t < 3; t += .03) {
    vy += 1250 * .03;
    vx *= (1 - .12 * .03);
    x += vx * .03; y += vy * .03;
    if (y >= FLOOR - 6) break;
  }
  return x;
}
function rr(x, y, w, h, rad) {
  var k = Math.min(rad, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
function drawPlayer(p, color, swingFx) {
  var bx = p.x, by = FLOOR;
  ctx.fillStyle = color;
  rr(bx - 12, by - 52, 24, 52, 10); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath(); ctx.arc(bx, by - 62, 11, 0, Math.PI * 2); ctx.fill();
  /* 球拍 */
  var rx = bx + (p === me ? 18 : -18), ry = by - 66;
  drawEm('🏸', rx, ry, 30 + (swingFx > 0 ? 10 : 0));
  if (swingFx > 0) {
    ctx.strokeStyle = 'rgba(255,255,255,' + swingFx * 2.4 + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(rx, ry, 26, 0, Math.PI * 2);
    ctx.stroke();
  }
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#0a2416');
  bg.addColorStop(1, '#04120a');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);

  /* 场地 */
  ctx.fillStyle = 'rgba(60,160,100,.16)';
  ctx.fillRect(0, FLOOR, VW, VH - FLOOR);
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, FLOOR); ctx.lineTo(VW, FLOOR); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.1)';
  ctx.fillRect(0, FLOOR, VW / 2, 4);
  /* 中线 */
  ctx.strokeStyle = 'rgba(255,255,255,.12)';
  ctx.beginPath(); ctx.moveTo(VW / 4, FLOOR); ctx.lineTo(VW / 4, FLOOR + 26); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(VW * .75, FLOOR); ctx.lineTo(VW * .75, FLOOR + 26); ctx.stroke();

  /* 球网 */
  ctx.fillStyle = 'rgba(240,240,240,.75)';
  ctx.fillRect(NETX - 2, NETTOP, 4, FLOOR - NETTOP);
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  var ny;
  for (ny = NETTOP + 6; ny < FLOOR; ny += 12) ctx.fillRect(NETX - 10, ny, 20, 1.5);

  if (state === 'play' || state === 'over') {
    drawPlayer(me, '#5ce87a', hitFx);
    drawPlayer(ai, '#ff8a6a', aiFx);
    if (sh) {
      /* 球影 */
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath(); ctx.ellipse(sh.x, FLOOR + 4, 10, 3, 0, 0, Math.PI * 2); ctx.fill();
      /* 羽毛球:小白头 + 裙摆 */
      var ang = Math.atan2(sh.vy, sh.vx);
      ctx.save();
      ctx.translate(sh.x, sh.y);
      ctx.rotate(ang + Math.PI / 2);
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.beginPath();
      ctx.moveTo(-6, 4); ctx.lineTo(6, 4); ctx.lineTo(0, -10); ctx.closePath();
      ctx.fill();
      ctx.beginPath(); ctx.arc(0, 5.5, 3.6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(180,220,255,.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-3, 3); ctx.lineTo(0, -9); ctx.lineTo(3, 3); ctx.stroke();
      ctx.restore();
    }
  }
  if (pauseT > 0 && state === 'play') {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '800 15px "PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fillText((serving === 0 ? '我方' : '电脑') + '发球…', VW / 2, VH * .3);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(220,255,232,.55)';
  ctx.fillText('按住左半屏拖动跑位 · 高点触球自动扣杀', VW / 2, FLOOR + 30);
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  me.tx = clamp(e.clientX, 36, VW / 2 - 34);
});
cv.addEventListener('pointermove', function (e) {
  if (state !== 'play') return;
  if (e.buttons || e.pointerType === 'touch') me.tx = clamp(e.clientX, 36, VW / 2 - 34);
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); me.tx = clamp(me.tx - 60, 36, VW / 2 - 34); }
  if (e.key === 'ArrowRight') { e.preventDefault(); me.tx = clamp(me.tx + 60, 36, VW / 2 - 34); }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startGame(); }
});

function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}

$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', startGame);
$('diffbtn').addEventListener('click', function () {
  diffIdx = (diffIdx + 1) % 3;
  startGame();
});
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」打出了 ' + myScore + ':' + aiScore + ',最长 ' + bestRally + ' 拍! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  score: function () { return [myScore, aiScore]; },
  setScore: function (a, b) { myScore = a; aiScore = b; syncHud(); },
  setBall: function (x, y, vx, vy) { sh = { x: x, y: y, vx: vx, vy: vy }; },
  ball: function () { return sh ? { x: sh.x, y: sh.y, vx: sh.vx, vy: sh.vy } : null; },
  serve: function () { pauseT = 0; serve(); },
  player: function () { return { x: me.x, tx: me.tx }; },
  setTarget: function (x) { me.tx = x; },
  step: function (n) { var i; for (i = 0; i < n; i++) update(1 / 60); },
  predict: predictLanding,
  rally: function () { return rally; },
  diff: function () { return diffIdx; },
  state: function () { return state; }
};

resize();
resetMatch();
$('padbar').classList.add('hide');
updMini();
syncHud();
run();

})();
</script>

<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';
  var name=(document.title||'游戏').split(/[ ··|]/)[0];


  // 结算页:晒战绩 + 换个游戏
  var over=document.getElementById('over');

    var box=document.createElement('div');
    box.style.cssText='display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px';
    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='badminton'});
  r.unshift({k:'badminton',n:'羽毛球 · 极限对拉',e:'🏸'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['badminton_best','badminton_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['badminton']||0)){
            B['badminton']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
