/* ===== 配色：只改 :root 这一组，其余 CSS 不用动 ===== */

<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='snowball_best',PLAY='snowball_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 打雪仗 · 雪地对决 ================== */
var NAME = '打雪仗 · 雪地对决';
var state = 'start';
var my = 0, aiScore = 0, diff = 1, time = 0;
var px = 0, ptx = 0, cd = 0;
var ai = { x: 0, tx: 0, wind: 0, think: 0 };
var balls = [], puffs = [];
var msg = '', msgT = 0, flash = 0, flashWho = 0, resT = 0;
var W = 0, TOP = 0, BOT = 0;
var DIFF_CN = ['简单', '普通', '困难'];
var DIFF_WIND = [.7, .5, .34], DIFF_ERR = [70, 38, 12], DIFF_CD = [2.2, 1.5, 1.05];

function layout() {
  W = Math.min(VW - 20, 420);
  TOP = Math.max(110, VH * .2);
  BOT = VH - (VW < 360 ? 128 : 100);
  if (px) { px = clamp(px, VW / 2 - W / 2 + 20, VW / 2 + W / 2 - 20); ptx = px; }
}
function onResize() { layout(); }
function arenaL() { return VW / 2 - W / 2; }
function arenaR() { return VW / 2 + W / 2; }
function resetMatch() {
  my = 0; aiScore = 0; balls = []; puffs = [];
  msg = ''; msgT = 0; flash = 0; resT = 0; cd = 0; time = 0;
  layout();
  px = ptx = VW / 2;
  ai.x = ai.tx = VW / 2; ai.wind = 0; ai.think = .8;
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  $('diffbtn').textContent = '🎚 ' + DIFF_CN[diff];
  syncHud();
}
function syncHud() {
  $('hme').textContent = my;
  $('hai').textContent = aiScore;
}
function throwBall(x, y, tx, ty, who) {
  var dx = tx - x, dy = ty - y, d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
  var sp = who === 0 ? 520 : 430 + diff * 55;
  balls.push({ x: x, y: y, vx: dx / d * sp, vy: dy / d * sp, who: who });
  tone(who === 0 ? 420 : 300, .05, 'square', .03, who === 0 ? 560 : 380);
}
function puff(x, y) {
  for (var i = 0; i < 7; i++) {
    puffs.push({ x: x, y: y, vx: (frnd() - .5) * 220, vy: (frnd() - .5) * 220, t: .45 });
  }
}
function pointTo(who) {
  if (who === 0) my++; else aiScore++;
  flash = .9; flashWho = who;
  syncHud();
  tone(who === 0 ? 640 : 220, .1, 'triangle', .05, who === 0 ? 860 : 170);
  if (my >= 5 || aiScore >= 5) { matchOver(my > aiScore); return; }
  state = 'point'; resT = 1;
}
function matchOver(win) {
  state = 'over';
  var score = win ? 600 + diff * 100 + (5 - aiScore) * 50 : my * 60 + diff * 10;
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '<b>' + (win ? '雪仗大胜!' : '被打成雪人了…') + '</b><br>' +
    my + ' : ' + aiScore + ' · 难度 ' + DIFF_CN[diff] + '<br>本局得分 <b>' + score + '</b><br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = win ? 'AI 挥臂瞬间横移,就能骗出它的球' : '别站桩,球出手后再换位才不撞正着';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  tone(win ? 640 : 260, .14, 'triangle', .06, win ? 900 : 180);
}
function update(dt) {
  time += dt;
  if (msgT > 0) msgT -= dt;
  if (flash > 0) flash -= dt;
  var i;
  for (i = puffs.length - 1; i >= 0; i--) {
    var pf = puffs[i];
    pf.x += pf.vx * dt; pf.y += pf.vy * dt; pf.t -= dt;
    if (pf.t <= 0) puffs.splice(i, 1);
  }
  if (state === 'point') {
    resT -= dt;
    if (resT <= 0) { state = 'play'; balls = []; ai.think = .5; }
    return;
  }
  if (state !== 'play') return;
  px += (clamp(ptx, arenaL() + 20, arenaR() - 20) - px) * Math.min(1, dt * 10);
  if (cd > 0) cd -= dt;
  /* AI 走位 */
  ai.think -= dt;
  if (ai.think <= 0 && ai.wind <= 0) {
    if (frnd() < .55) {
      ai.tx = arenaL() + 26 + frnd() * (W - 52);
      ai.think = .3 + frnd() * .5;
    } else {
      ai.wind = DIFF_WIND[diff];
    }
  }
  ai.x += (clamp(ai.tx, arenaL() + 20, arenaR() - 20) - ai.x) * Math.min(1, dt * 5);
  if (ai.wind > 0) {
    ai.wind -= dt;
    if (ai.wind <= 0) {
      var aim = clamp(px + (frnd() - .5) * DIFF_ERR[diff] * 2, arenaL() + 18, arenaR() - 18);
      throwBall(ai.x, TOP + 34, aim, BOT - 26, 1);
      ai.think = DIFF_CD[diff] * (.7 + frnd() * .6);
    }
  }
  /* 雪球 */
  for (i = balls.length - 1; i >= 0; i--) {
    var b = balls[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < arenaL() - 30 || b.x > arenaR() + 30 || b.y < TOP - 40 || b.y > BOT + 40) { balls.splice(i, 1); continue; }
    if (b.who === 1 && Math.abs(b.x - px) < 17 && Math.abs(b.y - (BOT - 26)) < 30) {
      puff(b.x, b.y); balls.splice(i, 1); pointTo(1); return;
    }
    if (b.who === 0 && Math.abs(b.x - ai.x) < 17 && Math.abs(b.y - (TOP + 34)) < 30) {
      puff(b.x, b.y); balls.splice(i, 1); pointTo(0); return;
    }
  }
}
function drawKid(x, y, color, wind, me) {
  ctx.strokeStyle = color; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y - 26, 8, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = color;
  ctx.fillRect(x - 9, y - 18, 18, 20);
  ctx.fillStyle = me ? '#e85a40' : '#3a5a80';
  ctx.fillRect(x - 10, y - 24, 20, 6);
  var arm = wind > 0 ? -14 : 8;
  ctx.strokeStyle = color;
  ctx.beginPath();
  ctx.moveTo(x - 8, y - 12); ctx.lineTo(x - 14, y + 2);
  ctx.moveTo(x + 8, y - 12); ctx.lineTo(x + 14, y + (wind > 0 ? arm : 2));
  ctx.stroke();
  if (wind > 0) {
    ctx.fillStyle = '#fdf7e4';
    ctx.beginPath(); ctx.arc(x + 14, y + arm, 7, 0, Math.PI * 2); ctx.fill();
  }
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#101b26'); bg.addColorStop(1, '#182a3a');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  /* 雪地 */
  ctx.fillStyle = '#e8f0f8';
  ctx.fillRect(arenaL() - 6, TOP + 10, W + 12, BOT - TOP);
  ctx.fillStyle = 'rgba(160,190,220,.35)';
  for (var i = 0; i < 12; i++) {
    ctx.beginPath();
    ctx.ellipse(arenaL() + (i * 97) % W, TOP + 30 + (i * 61) % (BOT - TOP - 50), 16, 4, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  /* 雪堆装饰 */
  ctx.fillStyle = '#f6fafe';
  ctx.beginPath(); ctx.ellipse(arenaL() + 30, TOP + 18, 34, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(arenaR() - 30, BOT - 14, 40, 14, 0, 0, Math.PI * 2); ctx.fill();
  /* 中线 */
  ctx.strokeStyle = 'rgba(120,150,180,.5)'; ctx.lineWidth = 2;
  ctx.setLineDash([8, 8]);
  ctx.beginPath(); ctx.moveTo(arenaL(), VH / 2); ctx.lineTo(arenaR(), VH / 2); ctx.stroke();
  ctx.setLineDash([]);
  drawKid(ai.x, TOP + 34, '#e86a4a', ai.wind, false);
  drawKid(px, BOT - 26, '#3a88c8', 0, true);
  var i;
  for (i = 0; i < balls.length; i++) {
    ctx.fillStyle = '#fdf7e4';
    ctx.beginPath(); ctx.arc(balls[i].x, balls[i].y, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(120,150,180,.4)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(balls[i].x, balls[i].y, 7, 0, Math.PI * 2); ctx.stroke();
  }
  for (i = 0; i < puffs.length; i++) {
    ctx.fillStyle = 'rgba(255,255,255,' + (puffs[i].t / .45 * .9).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(puffs[i].x, puffs[i].y, 5 + (0.45 - puffs[i].t) * 16, 0, Math.PI * 2); ctx.fill();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(20,40,60,.5)';
  ctx.font = '900 ' + Math.round(Math.min(64, W * .17)) + 'px "PingFang SC",sans-serif';
  ctx.fillText(my, VW / 2 - W * .26, VH / 2);
  ctx.fillText(aiScore, VW / 2 + W * .26, VH / 2);
  if (msgT > 0) {
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.font = '600 13px "PingFang SC",sans-serif';
    ctx.fillText(msg, VW / 2, VH - 34);
  }
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.font = '600 12px "PingFang SC",sans-serif';
  if (state === 'play' && my + aiScore === 0) {
    ctx.fillText('拖动走位 · 点屏幕掷雪球 · 先拿 5 分', VW / 2, TOP - 34);
  }
  if (state === 'point' && flash > 0) {
    ctx.fillStyle = 'rgba(255,245,200,' + Math.min(1, flash).toFixed(2) + ')';
    ctx.font = '900 ' + Math.round(Math.min(30, W * .09)) + 'px "PingFang SC",sans-serif';
    ctx.fillText(flashWho === 0 ? '命中!' : '被砸中了!', VW / 2, TOP - 46);
  }
}
var ptr = null;
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  ptr = true;
  ptx = e.clientX;
  if (state === 'play' && cd <= 0) {
    throwBall(px, BOT - 40, e.clientX, e.clientY, 0);
    cd = .7;
  }
});
cv.addEventListener('pointermove', function (e) {
  if (!ptr) return;
  e.preventDefault();
  ptx = e.clientX;
});
cv.addEventListener('pointerup', function () { ptr = null; });
cv.addEventListener('pointercancel', function () { ptr = null; });
window.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') ptx = px - 44;
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') ptx = px + 44;
  else if (e.key === ' ' && state === 'play' && cd <= 0) {
    e.preventDefault();
    throwBall(px, BOT - 40, ai.x, TOP + 34, 0);
    cd = .7;
  }
});
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', resetMatch);
$('againbtn').addEventListener('click', resetMatch);
$('newbtn').addEventListener('click', resetMatch);
$('diffbtn').addEventListener('click', function () {
  diff = (diff + 1) % 3;
  $('diffbtn').textContent = '🎚 ' + DIFF_CN[diff];
});
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」' + my + ':' + aiScore + ' 打完了一场雪仗! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/'; });
window.__T = {
  state: function () { return state; },
  start: resetMatch,
  step: function (k) { for (var i = 0; i < (k || 1); i++) update(1 / 60); },
  score: function () { return my; },
  aiScore: function () { return aiScore; },
  throw: function (tx, ty) { if (state === 'play' && cd <= 0) { throwBall(px, BOT - 40, tx, ty, 0); cd = .7; } },
  player: function () { return { x: px }; },
  setPlayer: function (x) { px = ptx = x; },
  aiPos: function () { return ai.x; },
  setAI: function (x) { ai.x = ai.tx = x; },
  setScore: function (a, b) { my = a; aiScore = b; syncHud(); },
  diff: function () { return diff; },
  setDiff: function (d) { diff = d % 3; }
};
resize();
layout();
px = ptx = VW / 2;
ai.x = ai.tx = VW / 2;
$('padbar').classList.add('hide');
updMini();
syncHud();
run();

})();
</script>
<!-- __hub_enhance__ -->
<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';
  var name=(document.title||'游戏').split(/[ ··|]/)[0];


  // 结算页:晒战绩 + 换个游戏
  var over=document.getElementById('over');
  if(over){
    var box=document.createElement('div');
    box.style.cssText='display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px';
    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>


<!-- __hub_recent__ -->
<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='snowball'});
  r.unshift({k:'snowball',n:'打雪仗 · 雪地对决',e:'⛄'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['snowball_best','snowball_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['snowball']||0)){
            B['snowball']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
