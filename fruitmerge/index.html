<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='fruitmerge_best',PLAY='fruitmerge_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 水果合成 · 大果冻 ================== */
var NAME = '水果合成 · 大果冻';
var state = 'start';
var EMO = ['🍒', '🍓', '🍇', '🍊', '🍐', '🍎', '🍑', '🍍', '🍉'];
var COL = ['#e74c5b', '#ff6b81', '#8e6bd1', '#ff9f43', '#b8d94b', '#e8503a', '#ff8fa3', '#f5c542', '#63c05a'];
var RF = [.031, .042, .054, .068, .084, .102, .122, .145, .170];
var VAL = [1, 3, 6, 10, 16, 24, 35, 50, 80];
var balls = [], curTier = 0, nextTier = 0, aimX = 0;
var L1 = 0, R1 = 0, TOP1 = 0, LINE1 = 0, FLOOR1 = 0, BW = 0;
var score = 0, merges = 0, warnT = 0, dropCD = 0, shakeT = 0;
var pops = [];

function rr(x, y, w, h, r) {
  var k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}

function layout() {
  BW = Math.min(VW - 24, 430);
  L1 = Math.round((VW - BW) / 2);
  R1 = L1 + BW;
  TOP1 = Math.max(96, VH * .12);
  LINE1 = TOP1 + 50;
  FLOOR1 = VH - 92;
  if (aimX < L1 + 20 || aimX > R1 - 20) aimX = (L1 + R1) / 2;
}
function onResize() { layout(); }

function radius(t) { return Math.max(8, BW * RF[t]); }

function resetGame() {
  balls = []; pops = [];
  score = 0; merges = 0; warnT = 0; dropCD = 0; shakeT = 0;
  curTier = rnd(5); nextTier = rnd(5);
  aimX = (L1 + R1) / 2;
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}

function syncHud() {
  $('hscore').textContent = score;
  $('hfruit').textContent = balls.length;
  $('hbest').textContent = Math.max(KIT.best(), score);
}

function addBall(x, y, t, vy) {
  balls.push({ x: x, y: y, vx: 0, vy: vy || 0, r: radius(t), t: t, pop: 0 });
}

function drop() {
  if (state !== 'play' || dropCD > 0) return;
  var r = radius(curTier);
  var x = clamp(aimX, L1 + r + 1, R1 - r - 1);
  addBall(x, TOP1 + r + 2, curTier, 60);
  curTier = nextTier;
  nextTier = rnd(5);
  dropCD = .28;
  tone(300 + curTier * 40, .05, 'sine', .035);
  syncHud();
}

function gameOver() {
  state = 'over';
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  var rank = score >= 900 ? '🍉 果园大亨' : score >= 500 ? '🍑 合成高手' : score >= 200 ? '🍐 果盘常客' : '🍒 新手果农';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '得分 <b>' + score + '</b><br>' +
    '合成 ' + merges + ' 次<br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '大果别急着丢中间:先让小果在两侧合拢,中间留给大果';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
}

function burst(x, y, c) {
  for (var i = 0; i < 8; i++) {
    pops.push({ x: x, y: y, vx: (Math.random() - .5) * 220, vy: (Math.random() - .7) * 220, r: 2 + Math.random() * 4, t: .5, c: c });
  }
}

function mergeCheck() {
  var i, j, mergesNow = [];
  var alive = [];
  for (i = 0; i < balls.length; i++) { balls[i].dead = 0; balls[i].merged = 0; }
  for (i = 0; i < balls.length; i++) {
    for (j = i + 1; j < balls.length; j++) {
      var a = balls[i], b = balls[j];
      if (a.dead || b.dead || a.merged || b.merged) continue;
      var dx = b.x - a.x, dy = b.y - a.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || .01;
      var minD = a.r + b.r;
      if (dist >= minD) continue;
      if (a.t === b.t && a.t < 8) {
        a.merged = b.merged = 1;
        var nt = a.t + 1;
        mergesNow.push({
          x: (a.x + b.x) / 2, y: (a.y + b.y) / 2,
          vx: (a.vx + b.vx) / 2 * .4, vy: (a.vy + b.vy) / 2 * .4, t: nt
        });
        score += VAL[nt];
        merges++;
        burst(a.x, a.y, COL[a.t]);
        tone(420 + nt * 60, .09, 'triangle', .05);
        if (nt === 8) { score += 200; shakeT = .5; tone(880, .2, 'triangle', .07); }
      } else if (a.t === b.t && a.t === 8) {
        a.merged = b.merged = 1;
        score += VAL[8] * 2;
        merges++;
        burst(a.x, a.y, COL[8]);
        shakeT = .5;
        tone(900, .2, 'triangle', .07);
      } else {
        var nx = dx / dist, ny = dy / dist, overlap = minD - dist;
        var tot = a.r + b.r;
        a.x -= nx * overlap * (b.r / tot); a.y -= ny * overlap * (b.r / tot);
        b.x += nx * overlap * (a.r / tot); b.y += ny * overlap * (a.r / tot);
        var rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        var vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          var imp = -vn * .55;
          a.vx -= imp * nx; a.vy -= imp * ny;
          b.vx += imp * nx; b.vy += imp * ny;
        }
      }
    }
  }
  for (i = 0; i < balls.length; i++) if (!balls[i].merged) alive.push(balls[i]);
  balls = alive;
  for (i = 0; i < mergesNow.length; i++) {
    var m = mergesNow[i];
    addBall(m.x, m.y, m.t, m.vy);
    balls[balls.length - 1].vx = m.vx;
  }
  if (mergesNow.length) syncHud();
}

function physics(dt) {
  var G = 1500, i;
  for (i = 0; i < balls.length; i++) {
    var b = balls[i];
    b.vy += G * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.x - b.r < L1) { b.x = L1 + b.r; b.vx = Math.abs(b.vx) * .4 + 6; }
    if (b.x + b.r > R1) { b.x = R1 - b.r; b.vx = -Math.abs(b.vx) * .4 - 6; }
    if (b.y + b.r > FLOOR1) {
      b.y = FLOOR1 - b.r;
      b.vy = b.vy > 90 ? -b.vy * .26 : 0;
      b.vx *= .9;
    }
  }
  for (var it = 0; it < 3; it++) mergeCheck();
  for (i = 0; i < balls.length; i++) {
    var b2 = balls[i];
    if (!isFinite(b2.x) || !isFinite(b2.y)) { b2.x = (L1 + R1) / 2; b2.y = FLOOR1 - b2.r - 20; b2.vx = 0; b2.vy = 0; }
  }
}

function update(dt) {
  if (dropCD > 0) dropCD -= dt;
  if (shakeT > 0) shakeT -= dt;
  for (var i = pops.length - 1; i >= 0; i--) {
    var p = pops[i];
    p.vy += 500 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.t -= dt;
    if (p.t <= 0) pops.splice(i, 1);
  }
  if (state !== 'play') return;
  physics(dt);
  var warn = 0;
  for (var j = 0; j < balls.length; j++) {
    var b = balls[j];
    if (b.y - b.r < LINE1 && Math.abs(b.vy) < 60) warn = 1;
  }
  if (warn) {
    warnT += dt;
    if (warnT > 1.8) { syncHud(); gameOver(); }
  } else warnT = Math.max(0, warnT - dt * 1.4);
}

function drawFruit(x, y, r, t) {
  var gr = ctx.createRadialGradient(x - r * .3, y - r * .35, r * .15, x, y, r);
  gr.addColorStop(0, '#ffffff');
  gr.addColorStop(.25, COL[t]);
  gr.addColorStop(1, COL[t]);
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = 2; ctx.stroke();
  drawEm(EMO[t], x, y, r * 2.05);
}

function draw() {
  var gr = ctx.createLinearGradient(0, 0, 0, VH);
  gr.addColorStop(0, '#2b1d2e');
  gr.addColorStop(1, '#160f18');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, VW, VH);

  ctx.fillStyle = 'rgba(255,255,255,.045)';
  ctx.fillRect(L1, TOP1, BW, FLOOR1 - TOP1);
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(L1, TOP1); ctx.lineTo(L1, FLOOR1);
  ctx.moveTo(R1, TOP1); ctx.lineTo(R1, FLOOR1);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.09)';
  ctx.fillRect(L1, FLOOR1 - 4, BW, 4);

  ctx.setLineDash([7, 7]);
  ctx.strokeStyle = warnT > 0 ? 'rgba(255,110,110,.85)' : 'rgba(255,255,255,.2)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(L1, LINE1); ctx.lineTo(R1, LINE1); ctx.stroke();
  ctx.setLineDash([]);

  var i;
  var sh = shakeT > 0 ? Math.sin(shakeT * 60) * 3 : 0;
  ctx.save(); ctx.translate(sh, 0);
  for (i = 0; i < balls.length; i++) {
    var b = balls[i];
    drawFruit(b.x, b.y, b.r, b.t);
  }
  ctx.restore();
  for (i = 0; i < pops.length; i++) {
    var p = pops[i];
    ctx.globalAlpha = Math.max(0, p.t / .5);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }

  if (state === 'play') {
    var r = radius(curTier);
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 8]);
    ctx.beginPath(); ctx.moveTo(clamp(aimX, L1 + r, R1 - r), TOP1 + r + 4); ctx.lineTo(clamp(aimX, L1 + r, R1 - r), FLOOR1 - 6); ctx.stroke();
    ctx.setLineDash([]);
    var ax = clamp(aimX, L1 + r + 1, R1 - r - 1);
    ctx.globalAlpha = .45;
    drawFruit(ax, TOP1 + r + 2, r, curTier);
    ctx.globalAlpha = 1;

    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.font = '600 12px "PingFang SC",sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    var nr = Math.min(16, radius(nextTier));
    var ny2 = Math.max(66, TOP1 - 28);
    ctx.fillText('下一个', R1 - nr * 2 - 14, ny2);
    drawFruit(R1 - nr - 6, ny2, nr, nextTier);
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = warnT > .6 ? 'rgba(255,120,120,.95)' : 'rgba(255,255,255,.45)';
  ctx.fillText(warnT > 0 ? '⚠ 超过红线了,快合成!' : '拖动瞄准 · 松手投放 · 同类相撞合成', VW / 2, FLOOR1 + 22);
}

cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  aimX = e.clientX;
});
cv.addEventListener('pointermove', function (e) {
  if (state !== 'play') return;
  if (e.buttons || e.pointerType === 'touch') aimX = e.clientX;
});
cv.addEventListener('pointerup', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  aimX = e.clientX;
  drop();
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === 'ArrowLeft' || e.key === 'a') { e.preventDefault(); aimX -= 14; }
  if (e.key === 'ArrowRight' || e.key === 'd') { e.preventDefault(); aimX += 14; }
  if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 's') { e.preventDefault(); drop(); }
});

function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}

$('startbtn').addEventListener('click', resetGame);
$('againbtn').addEventListener('click', resetGame);
$('resetbtn').addEventListener('click', resetGame);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」合成了 ' + merges + ' 次,拿了 ' + score + ' 分! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  radius: radius,
  dropAt: function (x, tier) {
    aimX = x; curTier = tier === undefined ? curTier : tier; drop();
  },
  balls: function () { return balls; },
  step: function (n) { for (var i = 0; i < n; i++) { physics(1 / 60); if (state !== 'play') break; } },
  score: function () { return score; }
};

resize();
aimX = (L1 + R1) / 2;
updMini();
syncHud();
$('hbest').textContent = KIT.best();
run();

})();
</script>

<script>
(function(){

  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}

      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+

      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='fruitmerge'});
  r.unshift({k:'fruitmerge',n:'水果合成 · 大果冻',e:'🍓'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['fruitmerge_best','fruitmerge_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['fruitmerge']||0)){
            B['fruitmerge']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
