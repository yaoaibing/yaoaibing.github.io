<script>
(function(){
'use strict';

/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='mahj_best',PLAY='mahj_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* ================== GAME · 麻将消消乐 ================== */
/* 坐标:半格单位,一张牌占 2×2;x/y 为左上角,z 为层 */
function mkRow(z,y,x0,n){
  var a=[];
  for(var i=0;i<n;i++)a.push({x:x0+i*2,y:y,z:z});
  return a;
}
function buildTurtle(){
  var t=[];
  t=t.concat(mkRow(0,0,2,12),mkRow(0,2,6,8),mkRow(0,4,4,10),mkRow(0,6,2,12),
             mkRow(0,8,2,12),mkRow(0,10,4,10),mkRow(0,12,6,8),mkRow(0,14,2,12));
  t.push({x:0,y:7,z:0});t.push({x:26,y:7,z:0});t.push({x:28,y:7,z:0});
  for(var y=2;y<=12;y+=2)t=t.concat(mkRow(1,y,8,6));
  for(var y2=4;y2<=10;y2+=2)t=t.concat(mkRow(2,y2,10,4));
  t=t.concat(mkRow(3,6,12,2),mkRow(3,8,12,2));
  t.push({x:13,y:7,z:4});
  return t;
}
function buildPyramid(){
  var t=[],y;
  for(y=0;y<=14;y+=2)t=t.concat(mkRow(0,y,2,8));
  for(y=2;y<=12;y+=2)t=t.concat(mkRow(1,y,4,6));
  for(y=4;y<=10;y+=2)t=t.concat(mkRow(2,y,6,4));
  t=t.concat(mkRow(3,6,8,2),mkRow(3,8,8,2));
  return t;
}
function buildDragon(){
  var t=[];
  t=t.concat(mkRow(0,0,4,12),mkRow(0,2,2,14),mkRow(0,4,2,14),mkRow(0,6,4,12),mkRow(0,8,8,8));
  t=t.concat(mkRow(1,2,8,10),mkRow(1,4,8,10),mkRow(1,6,12,6));
  t=t.concat(mkRow(2,4,12,6));
  return t;
}
function buildLotus(){
  var t=[];
  t=t.concat(mkRow(0,0,10,6),mkRow(0,2,6,10),mkRow(0,4,2,14),mkRow(0,6,6,10),mkRow(0,8,10,6));
  t=t.concat(mkRow(1,2,10,6),mkRow(1,4,6,10),mkRow(1,6,10,6));
  t=t.concat(mkRow(2,4,12,4));
  return t;
}
function buildBridge(){
  var t=[];
  t=t.concat(mkRow(0,0,2,6),mkRow(0,0,18,6),mkRow(0,2,2,6),mkRow(0,2,18,6),
             mkRow(0,4,2,14),mkRow(0,6,2,14));
  t=t.concat(mkRow(1,2,4,4),mkRow(1,2,20,4),mkRow(1,4,6,10),mkRow(1,6,6,10));
  return t;
}
var LAYOUTS=[
  {n:'乌龟',p:buildTurtle()},{n:'金字塔',p:buildPyramid()},{n:'长龙',p:buildDragon()},
  {n:'莲花',p:buildLotus()},{n:'桥',p:buildBridge()}
];
/* 牌面:万9 条9 筒9 风4 箭3 花4 = 38 种,每种最多用 4 张 */
var NUMCN=['一','二','三','四','五','六','七','八','九'];
var WIND=['東','南','西','北'],DRAG=['中','發','白'],FLOWER=['春','夏','秋','冬'];
var SCOL=['#c0392b','#2e8b57','#2c6fb5','#3a3a3a','#b03030','#c97917'];

var li=0,tiles=[],undos=[],flies=[],floats=[];
var G={state:'start',t:0,score:0,combo:0,maxCombo:0,lastT:-9,sel:-1,hintA:-1,hintB:-1,hintT:0,
  shuffles:3,tips:5,left:0,zm:1,ox:0,oy:0,conf:[],winT:0,deadT:0,freeOK:true};
var TW=30,TH=40,DZ=5,BB={x:0,y:0,w:0,h:0},OX=0,OY=0,cols=1,rows=1;

/* --- 自由牌判定:上方无覆盖,且左右至少一侧没有相邻牌 --- */
function covered(P,alive,i){
  var a=P[i];
  for(var j=0;j<P.length;j++){
    if(!alive[j]||j===i)continue;
    var b=P[j];
    if(b.z!==a.z+1)continue;
    if(Math.abs(b.x-a.x)<2&&Math.abs(b.y-a.y)<2)return true;
  }
  return false;
}
function sideBlocked(P,alive,i,dir){
  var a=P[i];
  for(var j=0;j<P.length;j++){
    if(!alive[j]||j===i)continue;
    var b=P[j];
    if(b.z!==a.z)continue;
    if(Math.abs(b.y-a.y)>=2)continue;
    if(dir<0){if(b.x<a.x&&b.x>=a.x-2)return true}
    else{if(b.x>a.x&&b.x<=a.x+2)return true}
  }
  return false;
}
function isFree(P,alive,i){
  if(!alive[i])return false;
  if(covered(P,alive,i))return false;
  return !(sideBlocked(P,alive,i,-1)&&sideBlocked(P,alive,i,1));
}
function freeList(P,alive){
  var out=[];
  for(var i=0;i<P.length;i++)if(isFree(P,alive,i))out.push(i);
  return out;
}

/* --- 发牌:先从完整塔里随机取一对自由牌拆走,记下顺序;再按序倒推配牌 --- */
function genPairs(P){
  // 随机贪心偶尔会把自己走进"只剩 1 张自由牌"的死角,内部重试即可
  for(var att=0;att<40;att++){
    var r=tryGenPairs(P);
    if(r)return r;
  }
  return null;
}
function tryGenPairs(P){
  var n=P.length,i,alive=[];
  for(i=0;i<n;i++)alive.push(1);
  var pairs=[],remain=n,guard=0;
  while(remain>0&&guard++<600){
    var F=freeList(P,alive);
    if(F.length<2)return null;
    // 两张必须在"同一时刻"都是自由牌:先从自由集合里取 a,再从剩下的自由牌里取 b
    var ai=rnd(F.length),a=F[ai],rest=[];
    for(i=0;i<F.length;i++)if(i!==ai)rest.push(F[i]);
    var b=rest[rnd(rest.length)];
    alive[a]=0;alive[b]=0;
    pairs.push([a,b]);
    remain-=2;
  }
  if(remain!==0)return null;
  return pairs;
}
/* 可解性检查:按记录的拆解顺序复演,每一步两张都必须自由 */
function verifyPairs(P,pairs){
  var i,alive=[];
  for(i=0;i<P.length;i++)alive.push(1);
  for(i=0;i<pairs.length;i++){
    var a=pairs[i][0],b=pairs[i][1];
    if(!isFree(P,alive,a)||!isFree(P,alive,b))return false;
    alive[a]=0;
    if(!isFree(P,alive,b))return false;
    alive[b]=0;
  }
  return true;
}
function shuffleArr(a){
  for(var i=a.length-1;i>0;i--){
    var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}
function dealTypes(P,pairs){
  var n=P.length,need=n/4,i,pool=[];
  for(i=0;i<38;i++)pool.push(i);
  shuffleArr(pool);
  var seq=[];
  for(i=0;i<need;i++){seq.push(pool[i]);seq.push(pool[i])}
  shuffleArr(seq);
  for(i=0;i<pairs.length;i++){
    P[pairs[i][0]].t=seq[i];
    P[pairs[i][1]].t=seq[i];
  }
}
function newBoard(idx){
  var P=[],i,src=LAYOUTS[idx].p;
  for(i=0;i<src.length;i++)P.push({x:src[i].x,y:src[i].y,z:src[i].z,t:0,a:1});
  // 开局可解性检查:生成拆解顺序 -> 复演校验 -> 通过才配牌
  var pairs=null,tryc=0;
  while(tryc++<60){
    pairs=genPairs(P);
    if(pairs&&verifyPairs(P,pairs))break;
    pairs=null;
  }
  if(pairs)dealTypes(P,pairs);
  else for(i=0;i<P.length;i++)P[i].t=Math.floor(i/4)%38; // 理论不可达的兜底
  return P;
}

/* --- 布局:整塔自适应居中 --- */
function onResize(){
  var P=LAYOUTS[li].p,i;
  var minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9,mz=0;
  for(i=0;i<P.length;i++){
    if(P[i].x<minx)minx=P[i].x;
    if(P[i].x+2>maxx)maxx=P[i].x+2;
    if(P[i].y<miny)miny=P[i].y;
    if(P[i].y+2>maxy)maxy=P[i].y+2;
    if(P[i].z>mz)mz=P[i].z;
  }
  cols=(maxx-minx)/2;rows=(maxy-miny)/2;
  var top=Math.max(68,Math.round(VH*0.105)),bot=92;
  if(VH<620){top=62;bot=84}
  var avW=VW-12,avH=VH-top-bot-6;
  var w1=(avW-4*mz)/cols,h1=(avH-4*mz)/(rows*1.34);
  TW=Math.round(clamp(Math.min(w1,h1),22,58));
  TH=Math.round(TW*1.34);
  DZ=clamp(Math.round(TW*0.17),3,11);
  // 二次校正:用真实层偏移量复核,横屏等极端比例下再缩一档
  var tw2=Math.round(clamp(Math.min((avW-DZ*mz)/cols,(avH-DZ*mz)/(rows*1.34)),18,58));
  if(tw2<TW){TW=tw2;TH=Math.round(TW*1.34);DZ=clamp(Math.round(TW*0.17),3,11)}
  var bw=cols*TW+DZ*mz,bh=rows*TH+DZ*mz;
  BB.x=Math.round((VW-bw)/2);
  BB.y=Math.round(top+(VH-top-bot-bh)/2);
  BB.w=bw;BB.h=bh;
  // 牌的绘制基准:让整塔(含层偏移)恰好落在 BB 框内
  OX=BB.x+DZ*mz-minx/2*TW;
  OY=BB.y+DZ*mz-miny/2*TH;
}
function tileX(t){return OX+t.x/2*TW-t.z*DZ}
function tileY(t){return OY+t.y/2*TH-t.z*DZ}
function clampPan(){
  var bw=BB.w*G.zm,bh=BB.h*G.zm;
  if(bw<=VW-24)G.ox=(VW-bw)/2-BB.x*G.zm;
  else G.ox=clamp(G.ox,60-(BB.x+BB.w)*G.zm,VW-60-BB.x*G.zm);
  if(bh<=VH-24)G.oy=(VH-bh)/2-BB.y*G.zm;
  else G.oy=clamp(G.oy,60-(BB.y+BB.h)*G.zm,VH-60-BB.y*G.zm);
}

/* --- 游戏流程 --- */
function startGame(){
  tiles=newBoard(li);
  undos=[];flies=[];floats=[];
  G.state='play';G.t=0;G.score=0;G.combo=0;G.maxCombo=0;G.lastT=-9;
  G.sel=-1;G.hintA=-1;G.hintB=-1;G.hintT=0;G.shuffles=3;G.tips=5;G.conf=[];G.winT=0;G.deadT=0;
  G.zm=1;G.ox=0;G.oy=0;
  G.left=tiles.length;
  $('hleft').textContent=G.left;
  $('start').classList.add('hide');$('over').classList.add('hide');
  $('tools').classList.remove('hide');
  refreshPair();onResize();
  KIT.addPlay();KIT.streak();
  run();
}
/* 可消对子只在牌数变化时才会变,缓存起来,避免每帧全量扫描 */
function refreshPair(){G.freeOK=!!findPair();refreshTools()}
function refreshTools(){
  $('shfbtn').textContent='🔀 洗牌 '+G.shuffles;
  $('shfbtn').className='tool'+(!G.freeOK&&G.state==='play'?' hot':'');
  $('hleft').textContent=G.left;
  $('hscore').textContent=G.score;
}
function aliveArr(){
  var a=[];for(var i=0;i<tiles.length;i++)a.push(tiles[i].a?1:0);return a;
}
function findPair(){
  var F=freeList(tiles,aliveArr()),i,j;
  for(i=0;i<F.length;i++)for(j=i+1;j<F.length;j++)
    if(tiles[F[i]].t===tiles[F[j]].t)return [F[i],F[j]];
  return null;
}
function noPair(){return !findPair()}
function addFly(i){
  var t=tiles[i];
  flies.push({x:tileX(t),y:tileY(t),tx:t.t,vx:(frnd()-.5)*420,vy:-260-frnd()*220,life:.75,rot:(frnd()-.5)*4});
}
function addFloat(x,y,txt,c){floats.push({x:x,y:y,t:txt,c:c,life:1})}
function tryMatch(a,b){
  if(a===b){G.sel=-1;return false}
  var al=aliveArr();
  if(!isFree(tiles,al,a)||!isFree(tiles,al,b)){G.sel=-1;tone(200,.08,'sawtooth',.04,120);return false}
  if(tiles[a].t!==tiles[b].t){
    G.sel=b;tone(430,.06,'square',.045,560);return false;
  }
  undos.push({a:a,b:b,combo:G.combo,lastT:G.lastT,score:G.score});
  if(undos.length>60)undos.shift();
  addFly(a);addFly(b);
  tiles[a].a=0;tiles[b].a=0;
  G.left-=2;
  var now=G.t;
  G.combo=(now-G.lastT<3)?G.combo+1:1;
  G.lastT=now;
  if(G.combo>G.maxCombo)G.maxCombo=G.combo;
  var gain=20+Math.max(0,G.combo-1)*10;
  G.score+=gain;
  G.sel=-1;G.hintA=-1;G.hintT=0;
  var cx=tileX(tiles[b])+TW/2,cy=tileY(tiles[b]);
  addFloat(cx,cy,'+'+gain+(G.combo>1?' x'+G.combo:''),G.combo>1?'#ffd45c':'#8affc8');
  tone(660+Math.min(G.combo,8)*60,.08,'square',.05,1000);
  noise(.05,.03);
  if(G.left<=0)win();else refreshPair();
  return true;
}
function doHint(){
  if(G.state!=='play')return;
  if(G.tips<=0){addFloat(VW/2,VH*0.4,'提示用完啦','#ff9d4a');return}
  var p=findPair();
  if(!p){addFloat(VW/2,VH*0.4,'没有可消的对子,洗牌吧','#ff9d4a');return}
  G.hintA=p[0];G.hintB=p[1];G.hintT=3;G.tips--;
  tone(880,.1,'triangle',.05,1180);
}
function doShuffle(auto){
  if(G.state!=='play')return;
  if(G.shuffles<=0){
    addFloat(VW/2,VH*0.4,'洗牌次数用完啦','#ff9d4a');
    tone(200,.2,'sawtooth',.05,90);return;
  }
  var types=[],i;
  for(i=0;i<tiles.length;i++)if(tiles[i].a)types.push(tiles[i].t);
  var best=false;
  for(var k=0;k<40;k++){
    shuffleArr(types);
    var m=0;
    for(i=0;i<tiles.length;i++)if(tiles[i].a)tiles[i].t=types[m++];
    if(findPair()){best=true;break}
  }
  if(!best)for(i=0;i<tiles.length;i++)if(tiles[i].a)tiles[i].t=types[i%types.length];
  G.shuffles--;G.sel=-1;G.hintA=-1;G.hintT=0;G.deadT=0;
  addFloat(VW/2,VH*0.36,'洗 牌!','#8ad8ff');
  tone(520,.1,'sine',.05,760);noise(.16,.05);
  refreshPair();
}
function undo(){
  if(G.state!=='play'||!undos.length)return;
  var u=undos.pop();
  tiles[u.a].a=1;tiles[u.b].a=1;
  G.left+=2;G.combo=u.combo;G.lastT=u.lastT;G.score=u.score;
  G.sel=-1;G.hintA=-1;
  flies.length=0;
  tone(320,.08,'sine',.05,220);
  refreshPair();
}
function addConfetti(){
  var cols2=['#ffd45c','#7dffb0','#8affc8','#8ad8ff','#ff8ac8','#fff'];
  for(var i=0;i<110;i++)G.conf.push({x:frnd()*VW,y:-frnd()*VH*0.4,vx:(frnd()-.5)*130,vy:120+frnd()*260,
    w:4+frnd()*6,h:6+frnd()*8,rot:frnd()*6.28,vr:(frnd()-.5)*9,col:cols2[rnd(cols2.length)],life:1.6+frnd()*1.4});
}
function bestAll(){try{return JSON.parse(lsGet('mahj_best','{}'))||{}}catch(e){return {}}}
function fmtT(s){var m=Math.floor(s/60);return m>0?(m+'分'+(s%60)+'秒'):(s+'秒')}
function win(){

/* --- 输入:点选 / 拖动平移 / 双指缩放 --- */
var ptrs={},pCount=0,pinchD=0,pinchZ=1,pinchBX=0,pinchBY=0;
function s2b(sx,sy){return {x:(sx-G.ox)/G.zm,y:(sy-G.oy)/G.zm}}
function pdist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)||1}
function keyCount(o){var n=0,k;for(k in o)if(o.hasOwnProperty(k))n++;return n}
function pickTile(bx,by){
  var best=-1,bestZ=-1,i,t,x,y;
  for(i=0;i<tiles.length;i++){
    t=tiles[i];if(!t.a)continue;
    x=tileX(t);y=tileY(t);
    if(bx>=x&&bx<=x+TW&&by>=y&&by<=y+TH){
      if(t.z>bestZ){bestZ=t.z;best=i}
    }
  }
  if(best>=0)return best;
  // 容差半格:取最近的牌
  var bd=1e9;
  for(i=0;i<tiles.length;i++){
    t=tiles[i];if(!t.a)continue;
    x=tileX(t)+TW/2;y=tileY(t)+TH/2;
    var dx=(bx-x)/TW,dy=(by-y)/TH,d=Math.sqrt(dx*dx+dy*dy);
    if(d<0.85&&d<bd){bd=d;best=i}
  }
  return best;
}
function doTap(sx,sy){
  var b=s2b(sx,sy),i=pickTile(b.x,b.y);
  if(i<0)return;
  var al=aliveArr();
  if(!isFree(tiles,al,i)){
    tone(200,.07,'sawtooth',.04,140);
    addFloat(tileX(tiles[i])+TW/2,tileY(tiles[i]),'压着呢','#ff9d4a');
    return;
  }
  if(G.sel<0){G.sel=i;tone(620,.06,'square',.045,780)}
  else tryMatch(G.sel,i);
}
cv.addEventListener('pointerdown',function(e){
  if(!ptrs[e.pointerId])pCount++;
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:Date.now(),moved:false};
  if(keyCount(ptrs)===2){
    var ks=[],k;for(k in ptrs)if(ptrs.hasOwnProperty(k))ks.push(ptrs[k]);
    pinchD=pdist(ks[0],ks[1]);
    pinchZ=G.zm;
    var m=s2b((ks[0].x+ks[1].x)/2,(ks[0].y+ks[1].y)/2);
    pinchBX=m.x;pinchBY=m.y;
    for(k in ptrs)if(ptrs.hasOwnProperty(k))ptrs[k].moved=true;
  }
},{passive:true});
cv.addEventListener('pointermove',function(e){
  var p=ptrs[e.pointerId];if(!p)return;
  var dx=e.clientX-p.x,dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
  if(Math.abs(e.clientX-p.sx)>10||Math.abs(e.clientY-p.sy)>10)p.moved=true;
  if(keyCount(ptrs)===2){
    var ks=[],k;for(k in ptrs)if(ptrs.hasOwnProperty(k))ks.push(ptrs[k]);
    var d=pdist(ks[0],ks[1]);
    G.zm=clamp(pinchZ*d/pinchD,1,3);
    var mx=(ks[0].x+ks[1].x)/2,my=(ks[0].y+ks[1].y)/2;
    G.ox=mx-pinchBX*G.zm;G.oy=my-pinchBY*G.zm;
    clampPan();
    return;
  }
  if(p.moved&&G.state!=='start'){G.ox+=dx;G.oy+=dy;clampPan()}
},{passive:true});
function endPtr(e){
  var p=ptrs[e.pointerId];
  if(!p)return;
  var dur=Date.now()-p.t;
  if(!p.moved&&dur<500&&G.state==='play'&&keyCount(ptrs)<=1)doTap(e.clientX,e.clientY);
  delete ptrs[e.pointerId];
  if(keyCount(ptrs)<2)pinchD=0;
}
cv.addEventListener('pointerup',endPtr,{passive:true});
cv.addEventListener('pointercancel',function(e){delete ptrs[e.pointerId]},{passive:true});
window.addEventListener('keydown',function(e){
  if(G.state!=='play'){if(e.key===' '||e.key==='Enter')startGame();return}
  if(e.key==='h'||e.key==='H')doHint();
  else if(e.key==='s'||e.key==='S')doShuffle(false);
  else if(e.key==='z'||e.key==='Z')undo();
  else return;
  e.preventDefault();
});

/* --- 更新 --- */
function update(dt){
  var i;
  for(i=flies.length-1;i>=0;i--){
    var f=flies[i];f.life-=dt;f.vy+=900*dt;
    f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=dt*3;
    if(f.life<=0)flies.splice(i,1);
  }
  for(i=floats.length-1;i>=0;i--){
    var fl=floats[i];fl.life-=dt;fl.y-=36*dt;
    if(fl.life<=0)floats.splice(i,1);
  }
  if(G.state==='win'){
    G.winT-=dt;
    for(i=G.conf.length-1;i>=0;i--){
      var p=G.conf[i];p.life-=dt;p.vy+=460*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
      if(p.life<=0)G.conf.splice(i,1);
    }
    return;
  }
  if(G.state!=='play')return;
  G.t+=dt;
  if(G.hintT>0){G.hintT-=dt;if(G.hintT<=0){G.hintA=-1;G.hintB=-1}}
  // 死局检测:无可消对子时自动洗牌
  if(G.left>0&&!G.freeOK){
    G.deadT+=dt;
    if(G.deadT>1.1){G.deadT=0;doShuffle(true)}
  }else G.deadT=0;
  $('htime').textContent=Math.floor(G.t);
}

/* --- 绘制 --- */
function rrect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function drawPips(x,y,w,h,n,kind,col){
  var c=n<=1?1:(n<=4?2:3),r=Math.ceil(n/c),i;
  var cw=w/c,ch=h/r,s=Math.min(cw,ch)*0.62;
  ctx.fillStyle=col;ctx.strokeStyle=col;
  for(i=0;i<n;i++){
    var rr=Math.floor(i/c),cc=i%c;
    var inRow=Math.min(c,n-rr*c);
    var px=x+w/2+(cc-(inRow-1)/2)*cw,py=y+h/2+(rr-(r-1)/2)*ch;
    if(kind===1){ // 条:竖棒
      ctx.fillRect(px-s*0.28,py-s*0.62,s*0.56,s*1.24);
    }else{ // 筒:圆圈
      ctx.beginPath();ctx.arc(px,py,s*0.52,0,6.2832);
      if(n>6)ctx.fill();else{ctx.lineWidth=Math.max(1,s*0.28);ctx.stroke()}
    }
  }
}
function drawFace(x,y,w,h,t,sc){
  var kind,num,col;
  if(t<9){kind=0;num=t+1}
  else if(t<18){kind=1;num=t-8}
  else if(t<27){kind=2;num=t-17}
  else if(t<31){kind=3;num=t-27}
  else if(t<34){kind=4;num=t-31}
  else{kind=5;num=t-34}
  col=SCOL[kind];
  var pad=Math.max(2,w*0.1),fs;
  if(kind===0){
    fs=Math.round(w*0.62);
    ctx.fillStyle=col;ctx.font='900 '+fs+'px system-ui';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(NUMCN[num-1],x+w/2,y+h*0.4);
    ctx.font='900 '+Math.round(w*0.3)+'px system-ui';
    ctx.fillText('萬',x+w/2,y+h*0.78);
  }else if(kind===1||kind===2){
    drawPips(x+pad,y+pad,w-pad*2,h-pad*2,num,kind===1?1:2,col);
  }else{
    var ch=kind===3?WIND[num]:(kind===4?DRAG[num]:FLOWER[num]);
    fs=Math.round(w*0.66);
    ctx.fillStyle=kind===4?(num===0?'#c0392b':(num===1?'#2e8b57':'#2c6fb5')):(kind===5?'#c97917':'#333');
    ctx.font='900 '+fs+'px system-ui';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(ch,x+w/2,y+h/2);
  }
}
function drawTile(t,i){
  var x=tileX(t),y=tileY(t),w=TW,h=TH;
  var sel=(i===G.sel),hint=(i===G.hintA||i===G.hintB);
  // 立体:侧面 + 阴影
  ctx.fillStyle='rgba(0,0,0,.35)';rrect(x+DZ*0.5,y+DZ*0.7,w,h,4);ctx.fill();
  ctx.fillStyle='#a89870';rrect(x+DZ*0.35,y+DZ*0.5,w,h,4);ctx.fill();
  ctx.fillStyle='#8d7d58';rrect(x+DZ*0.35,y+DZ*0.5,w,h-DZ*0.2,4);ctx.fill();
  // 顶面
  var g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'#fffdf0');g.addColorStop(1,'#e6dcc0');
  ctx.fillStyle=g;rrect(x,y,w,h,4);ctx.fill();
  ctx.strokeStyle='rgba(120,100,60,.45)';ctx.lineWidth=1;rrect(x+.5,y+.5,w-1,h-1,4);ctx.stroke();
  drawFace(x,y,w,h,t.t);
  if(hint){
    ctx.strokeStyle='#8affc8';ctx.lineWidth=Math.max(2,w*0.09);
    rrect(x-2,y-2,w+4,h+4,5);ctx.stroke();
  }
  if(sel){
    ctx.strokeStyle='#ffd45c';ctx.lineWidth=Math.max(2,w*0.1);
    rrect(x-2,y-2,w+4,h+4,5);ctx.stroke();
    ctx.fillStyle='rgba(255,212,92,.22)';rrect(x,y,w,h,4);ctx.fill();
  }
}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#1c4a33');g.addColorStop(.55,'#123020');g.addColorStop(1,'#08180f');
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='rgba(125,255,176,.08)';
  for(var s=0;s<22;s++)ctx.fillRect((s*163)%VW,(s*101)%(VH*0.9),2,2);

  ctx.save();
  ctx.translate(G.ox,G.oy);ctx.scale(G.zm,G.zm);
  var order=[],i;
  for(i=0;i<tiles.length;i++)if(tiles[i].a)order.push(i);
  order.sort(function(a,b){
    var A=tiles[a],B=tiles[b];
    if(A.z!==B.z)return A.z-B.z;
    if(A.y!==B.y)return A.y-B.y;
    return A.x-B.x;
  });
  for(i=0;i<order.length;i++)drawTile(tiles[order[i]],order[i]);
  // 飞出的牌
  for(i=0;i<flies.length;i++){
    var f=flies[i];
    ctx.save();ctx.translate(f.x+TW/2,f.y+TH/2);ctx.rotate(f.rot*0.5);
    ctx.globalAlpha=clamp(f.life,0,1);
    ctx.fillStyle='#f2ead2';rrect(-TW/2,-TH/2,TW,TH,4);ctx.fill();
    drawFace(-TW/2,-TH/2,TW,TH,f.tx);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // 飘字
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(i=0;i<floats.length;i++){
    var fl=floats[i];
    ctx.globalAlpha=clamp(fl.life,0,1);
    ctx.font='900 16px system-ui';ctx.fillStyle=fl.c;
    ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=3;
    ctx.strokeText(fl.t,fl.x,fl.y);ctx.fillText(fl.t,fl.x,fl.y);
  }
  ctx.globalAlpha=1;
  // 礼花
  for(i=0;i<G.conf.length;i++){
    var p=G.conf[i];
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;
    ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
  }
  ctx.globalAlpha=1;
}

$('sharebtn').addEventListener('click',function(){
  share('我在「麻将消消乐」清空了「'+LAYOUTS[li].n+'」阵型('+LAYOUTS[li].p.length+' 张),'+G.score+' 分、用时 '+fmtT(Math.floor(G.t))+',最高连击 x'+Math.max(1,G.maxCombo)+'!来比比? https://yaoaibing.github.io/mahjong/');
});
var lbtns=document.querySelectorAll('#layrow .lay');
for(var lb=0;lb<lbtns.length;lb++){
  (function(btn){
    btn.addEventListener('click',function(){
      li=+btn.getAttribute('data-l');
      for(var k=0;k<lbtns.length;k++)lbtns[k].classList.remove('on');
      btn.classList.add('on');
      lsSet('mahj_lay',li);
      onResize();refreshMini();draw();
    });
  })(lbtns[lb]);
}

/* --- 启动 --- */
li=clamp(+lsGet('mahj_lay','0')||0,0,4);
for(var lb2=0;lb2<lbtns.length;lb2++){
  if(+lbtns[lb2].getAttribute('data-l')===li)lbtns[lb2].classList.add('on');
  else lbtns[lb2].classList.remove('on');
}
resize();onResize();refreshMini();draw();
window.addEventListener('beforeunload',function(){lsSet('mahj_lay',li)});
})();
</script>


























<!-- __hub_enhance__ -->
<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';
  var name=(document.title||'游戏').split(/[ ··|]/)[0];

  // 回大厅
  var hb=document.createElement('button');
  hb.setAttribute('type','button');hb.textContent='\uD83C\uDFE0';
  hb.style.cssText='position:fixed;top:'+SAFE+';left:10px;z-index:99;border:0;width:36px;height:36px;'+
    'border-radius:12px;font-size:15px;background:rgba(255,255,255,.14);color:#fff;'+
    'border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);cursor:pointer';
  hb.onclick=function(){location.href='/'};
  document.body.appendChild(hb);

  // 结算页:晒战绩 + 换个游戏
  var over=document.getElementById('over');
  if(over){
    var box=document.createElement('div');
    box.style.cssText='display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px';
    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>


<!-- __hub_recent__ -->
<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='mahjong'});
  r.unshift({k:'mahjong',n:'麻将消消乐',e:'🀄'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:定期把本游戏自己的最高分同步进共享的 __best
     (不用劫持 localStorage.setItem —— 那在部分环境下属性不可写会静默失败) */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['mahj_best','mahj_hi','mahj_max','mahj_score'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['mahjong']||0)){
            B['mahjong']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
