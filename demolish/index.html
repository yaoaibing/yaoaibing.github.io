<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='demolish_best',PLAY='demolish_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 定向拆除 · 拆楼专家 ================== */
var NAME = '定向拆除 · 拆楼专家';
var state = 'start';
var level = 0;
var cols = [];
var falling = false, fallDir = 0, fallProg = 0;
var targetZone = { x: 0, w: 0 };
var score = 0, winT = 0, msg = '', msgT = 0, shake = 0;
var LEVELS = [
  { cols: 4, h: 5, zone: [.3, .7] }, { cols: 5, h: 6, zone: [.2, .6] },
  { cols: 5, h: 7, zone: [.4, .8] }, { cols: 6, h: 7, zone: [.25, .65] },
  { cols: 6, h: 8, zone: [.35, .75] }, { cols: 7, h: 8, zone: [.2, .55] },
  { cols: 7, h: 9, zone: [.45, .85] }, { cols: 8, h: 9, zone: [.25, .6] },
  { cols: 8, h: 10, zone: [.35, .7] }, { cols: 9, h: 10, zone: [.2, .5] }
];
function layout() { }
function onResize() { loadLevel(level); }
function loadLevel(n) {
  var L = LEVELS[n]; cols = [];
  var i; for (i = 0; i < L.cols; i++) cols.push({ x: (i + .5) / L.cols, removed: false });
  targetZone = { x: L.zone[0] * VW, w: (L.zone[1] - L.zone[0]) * VW };
  falling = false; fallDir = 0; fallProg = 0;
  msg = ''; msgT = 0; syncHud();
}
function resetGame() { level = 0; score = 0; loadLevel(0); }
function startGame() { resetGame(); state = 'play'; $('start').classList.add('hide'); $('over').classList.add('hide'); $('padbar').classList.remove('hide'); syncHud(); }
function endGame() {
  state = 'over'; winT = 1; KIT.addPlay(); KIT.streak();
  var acc = calcAcc(); var ok = acc >= 60; score += Math.round(acc * 5);
  var rec = KIT.setBest(score); var rank = acc >= 80 ? '拆除专家' : acc >= 60 ? '合格拆除' : '伤及无辜';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '精度 <b>' + Math.round(acc) + '%</b><br>' + (ok ? '合格拆除!' : '碎屑飞出目标区') + '<br>本局得分 <b>' + score + '</b><br>' + rank + '<br>历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '拆远侧柱子让楼往目标区倒';
  $('padbar').classList.add('hide'); $('over').classList.remove('hide');
  tone(ok ? 720 : 280, .3, 'sine', .07, ok ? 1150 : 180);
}
var score = 0;
function calcAcc() {
  var zoneC = (targetZone.x + targetZone.w / 2) / VW;
  return Math.max(0, 100 - Math.abs(fallDir - zoneC) * 250);
}
function syncHud() { $('hlv').textContent = (level + 1) + '/10'; $('hcol').textContent = cols.filter(function(c) { return !c.removed; }).length; $('hacc').textContent = '0%'; }
function removeCol(i) {
  if (state !== 'play' || falling || cols[i].removed) return;
  cols[i].removed = true;
  tone(200 + i * 30, .1, 'triangle', .045);
  var alive = cols.filter(function(c) { return !c.removed; });
  if (alive.length === 0) { startFall(0); return; }
  var cx = 0; alive.forEach(function(c) { cx += c.x; }); cx /= alive.length;
  if (Math.abs(cx - .5) > .18) { startFall(cx < .5 ? 0 : 1); return; }
  syncHud();
}
function startFall(dir) {
  falling = true; fallDir = dir; shake = .5;
  msg = '倒塌中…'; msgT = 2; noise(.3, .07);
  syncHud();
  setTimeout(function() {
    if (state !== 'play') return;
    var acc = calcAcc();
    if (acc >= 60) score += Math.round(acc * 5);
    if (level >= LEVELS.length - 1) { endGame(); return; }
    level++; loadLevel(level);
  }, 1200);
}
function update(dt) { if (msgT > 0) msgT -= dt; if (shake > 0) shake -= dt; if (winT > 0) winT -= dt; if (falling) { fallProg += dt; } }
function rr(x, y, w, h, rad) { var k = Math.min(rad, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + k, y); ctx.arcTo(x + w, y, x + w, y + h, k); ctx.arcTo(x + w, y + h, x, y + h, k); ctx.arcTo(x, y + h, x, y, k); ctx.arcTo(x, y, x + w, y, k); ctx.closePath(); }
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH); bg.addColorStop(0, '#1a1610'); bg.addColorStop(1, '#0c0a06');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = 'rgba(200,180,120,.08)'; ctx.fillRect(0, VH - 60, VW, 60);
  ctx.fillStyle = 'rgba(120,200,110,.12)';
  ctx.fillRect(targetZone.x, VH - 70, targetZone.w, 70);
  ctx.strokeStyle = 'rgba(120,200,110,.5)'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
  ctx.strokeRect(targetZone.x, VH - 70, targetZone.w, 70); ctx.setLineDash([]);
  ctx.font = '700 11px "PingFang SC",sans-serif'; ctx.fillStyle = 'rgba(120,200,110,.7)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('目标区', targetZone.x + targetZone.w / 2, VH - 55);
  var L = LEVELS[level];
  var bw = VW * .55; var bx = VW * .225;
  var fh = Math.min(28, (VH - 200) / L.h);
  var buildingBottom = VH - 80;
  var r, c;
  for (r = 0; r < L.h; r++) for (c = 0; c < L.cols; c++) {
    if (cols[c].removed) continue;
    var cxx = bx + c / L.cols * bw;
    var cyy = buildingBottom - (r + 1) * fh;
    ctx.fillStyle = 'rgba(216,176,72,.3)';
    rr(cxx + 2, cyy + 1, bw / L.cols - 4, fh - 2, 3); ctx.fill();
    ctx.strokeStyle = 'rgba(216,176,72,.35)'; ctx.lineWidth = 1;
    rr(cxx + 2, cyy + 1, bw / L.cols - 4, fh - 2, 3); ctx.stroke();
  }
  for (c = 0; c < L.cols; c++) {
    if (cols[c].removed) continue;
    var cx3 = bx + (c + .5) / L.cols * bw;
    ctx.fillStyle = 'rgba(200,160,80,.6)';
    rr(cx3 - 6, buildingBottom - L.h * fh, 12, L.h * fh, 3); ctx.fill();
  }
  if (falling && fallProg > .3) {
    ctx.globalAlpha = clamp(fallProg * 1.5, 0, 1);
    ctx.fillStyle = 'rgba(200,180,140,.3)';
    var dropX = fallDir * VW; var spread = fallProg * 80;
    for (var d2 = 0; d2 < 10; d2++) rr(dropX - spread / 2 + d2 * spread / 10 - 20, VH - 80 - frnd() * 20, 30, 20, 4); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = msgT > 0 ? 'rgba(255,220,120,.95)' : 'rgba(232,224,194,.55)';
  ctx.fillText(msg || '点柱子拆除,让楼往目标区倒!', VW / 2, VH - 46);
}
cv.addEventListener('pointerdown', function(e) {
  e.preventDefault();
  if (state !== 'play' || falling) return;
  var L = LEVELS[level]; var bw = VW * .55; var bx = VW * .225;
  var buildingBottom = VH - 80;
  var c = Math.floor((e.clientX - bx) / (bw / L.cols));
  if (c >= 0 && c < L.cols && e.clientY > buildingBottom - L.h * 28) removeCol(c);
});
window.addEventListener('keydown', function(e) { if (e.target && e.target.tagName === 'BUTTON') return; if (e.key === 'r' || e.key === 'R') { e.preventDefault(); loadLevel(level); } });
function updMini() { $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局'; }
$('startbtn').addEventListener('click', startGame); $('againbtn').addEventListener('click', startGame); $('newbtn').addEventListener('click', startGame);
$('retrybtn').addEventListener('click', function() { loadLevel(level); });
$('newbtn').addEventListener('click', function() { if (state === 'play' && level < LEVELS.length - 1) { level++; loadLevel(level); } });
$('sharebtn').addEventListener('click', function() { share('我在「' + NAME + '」拆了 ' + level + ' 栋楼! ' + location.href.split('#')[0]); });
$('hubbtn').addEventListener('click', function() { location.href = '/' });
window.__T = { cols: function() { return cols.map(function(c) { return c.removed; }); }, removeCol: removeCol, level: function() { return level; }, setLevel: function(n) { level = n; loadLevel(n); }, state: function() { return state; } };
resize(); resetGame(); $('padbar').classList.add('hide'); updMini(); run();

})();
</script>

<script>

        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='demolish'});
  r.unshift({k:'demolish',n:'定向拆除 · 拆楼专家',e:'🧱'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['demolish_best','demolish_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['demolish']||0)){
            B['demolish']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
