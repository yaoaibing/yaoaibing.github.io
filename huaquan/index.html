<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='huaquan_best',PLAY='huaquan_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 划拳行令 · 五魁首啊 ================== */
var NAME = '划拳行令 · 五魁首啊';
var state = 'start', score = 0, round = 1, MAXR = 12;
var myHand = 0, myCall = -1, myCups = 0, aiCups = 0;
var anim = 0, msg = '', msgT = 0;
var CALLS = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
function layout() {}
function onResize() {}
function syncHud() {
  $('hround').textContent = round + '/' + MAXR;
  $('hme2').textContent = myCups;
  $('hai2').textContent = aiCups;
}
function start() {
  state = 'play'; round = 1; myCups = 0; aiCups = 0; myHand = 0; myCall = -1; msgT = 0;
  $('start').classList.add('hide'); $('over').classList.add('hide'); syncHud();
}
function end() {
  state = 'over'; KIT.addPlay(); KIT.streak();
  var win = myCups < aiCups;
  score = Math.max(0, (MAXR - myCups * 2) * 20) + (win ? 100 : 0);
  var rec = KIT.setBest(score);
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '<b>' + (win ? '拳拳不落空,千杯不醉!' : myCups === aiCups ? '平分秋色,各自干杯' : '喝多了,扶墙走') + '</b><br>你 ' + myCups + ' 杯 · AI ' + aiCups + ' 杯<br>本局得分 <b>' + score + '</b><br>历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
  $('over').classList.remove('hide');
  tone(win ? 680 : 280, .16, 'triangle', .06);
}
function pick(k, v) {
  if (state !== 'play' || msgT > 0) return;
  if (k === 0) {
    myHand = v;
    tone(380 + v * 30, .05, 'sine', .04);
  } else {
    myCall = v;
    tone(460 + v * 30, .05, 'sine', .04);
    resolve();
  }
  syncHud();
}
function resolve() {
  var aiHand = (Math.random() * 6) | 0;
  var sum = myHand + aiHand;
  var hit = myCall === sum;
  var aiCalls = Math.random() < .3;
  var aiCall = Math.max(0, Math.min(10, aiHand + ((Math.random() * 6) | 0)));
  if (hit) {
    aiCups++;
    msg = '你出 ' + myHand + ' · AI 出 ' + aiHand + ' · 喊「' + CALLS[myCall] + '」正中!AI 干一杯';
    msgT = 1.5;
    tone(700, .12, 'triangle', .06, 940);
  } else if (aiCalls && aiCall === sum) {
    myCups++;
    msg = 'AI 喊「' + CALLS[aiCall] + '」猜中,你干一杯!'; msgT = 1.5;
    tone(200, .13, 'sawtooth', .05);
  } else {
    msg = '你出 ' + myHand + ' · AI 出 ' + aiHand + ' · 和为 ' + sum + ',没喊中,再来'; msgT = 1.4;
    tone(380, .08, 'sine', .04);
  }
  myCall = -1;
  round++;
  syncHud();
  if (myCups >= 5 || aiCups >= 5 || round > MAXR) { end(); return; }
}
function update(dt) {
  anim += dt;
  if (msgT > 0) msgT -= dt;
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#3a2418'); bg.addColorStop(1, '#1e1208');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center';
  ctx.font = '30px sans-serif'; ctx.textBaseline = 'middle';
  ctx.fillText('🧑', VW * .25, VH * .16);
  ctx.fillText('🤖', VW * .75, VH * .16);
  ctx.font = '800 15px "PingFang SC",sans-serif';
  ctx.fillStyle = '#ffe9a8';
  ctx.fillText(myCups + ' 杯', VW * .25, VH * .25);
  ctx.fillText(aiCups + ' 杯', VW * .75, VH * .25);
  ctx.fillStyle = 'rgba(232,216,168,.6)'; ctx.font = '600 12px "PingFang SC",sans-serif';
  ctx.fillText('第一行:你出几指 · 第二行:你喊总和几', VW / 2, VH * .34);
  var i;
  ctx.font = '700 15px "PingFang SC",sans-serif';
  for (i = 0; i < 6; i++) {
    var px = VW / 2 - 3 * 44 + i * 44 + 22;
    ctx.fillStyle = myHand === i ? 'rgba(255,217,74,.4)' : 'rgba(255,255,255,.07)';
    roundRect(px - 20, VH * .40, 40, 40, 8); ctx.fill();
    ctx.fillStyle = myHand === i ? '#ffe9a8' : 'rgba(232,216,168,.65)';
    ctx.fillText(i, px, VH * .40 + 21);
  }
  for (i = 0; i <= 10; i++) {
    var px2 = 20 + i * ((VW - 40) / 11);
    ctx.fillStyle = myCall === i ? 'rgba(140,220,140,.4)' : 'rgba(255,255,255,.07)';
    roundRect(px2 + 2, VH * .55, (VW - 40) / 11 - 4, 40, 7); ctx.fill();
    ctx.fillStyle = myCall === i ? '#a8f0a8' : 'rgba(232,216,168,.65)';
    ctx.font = '700 13px "PingFang SC",sans-serif';
    ctx.fillText(CALLS[i], px2 + (VW - 40) / 22, VH * .55 + 21);
  }
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(232,216,168,.5)'; ctx.font = '600 12px "PingFang SC",sans-serif';
  ctx.fillText('喊中「你的指 + AI 的指」就赢 · 三成概率 AI 反喊', VW / 2, VH * .74);
  if (msgT > 0) {
    ctx.fillStyle = '#ffe9a8'; ctx.font = '700 13px "PingFang SC",sans-serif';
    ctx.fillText(msg, VW / 2, VH * .82);
  }
  ctx.textAlign = 'left';
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  var i;
  for (i = 0; i < 6; i++) {
    var px = VW / 2 - 3 * 44 + i * 44 + 22;
    if (e.clientX >= px - 20 && e.clientX <= px + 20 && e.clientY >= VH * .40 && e.clientY <= VH * .40 + 40) {
      pick(0, i); return;
    }
  }
  for (i = 0; i <= 10; i++) {
    var px2 = 20 + i * ((VW - 40) / 11);
    if (e.clientX >= px2 && e.clientX <= px2 + (VW - 40) / 11 && e.clientY >= VH * .55 && e.clientY <= VH * .55 + 40) {
      pick(1, i); return;
    }
  }
});
function updMini() { $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局'; }
$('startbtn').addEventListener('click', start);
$('againbtn').addEventListener('click', start);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」只喝 ' + myCups + ' 杯! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/'; });
window.__T = {
  state: function () { return state; }, start: start,
  step: function (n) { for (var i = 0; i < (n || 1); i++) update(1 / 60); },
  score: function () { return score; }, round: function () { return round; },
  pick: pick, cups: function () { return [myCups, aiCups]; }
};
resize(); layout(); updMini(); syncHud(); run();

})();
</script>

<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';
  var name=(document.title||'游戏').split(/[ ··|]/)[0];


  // 结算页:晒战绩 + 换个游戏
  var over=document.getElementById('over');
  if(over){
    var box=document.createElement('div');
    box.style.cssText='display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px';
    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>


<!-- __hub_recent__ -->
<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='huaquan'});
  r.unshift({k:'huaquan',n:'划拳行令 · 五魁首啊',e:'🍺'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['huaquan_best','huaquan_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['huaquan']||0)){
            B['huaquan']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
