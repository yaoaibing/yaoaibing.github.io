<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='nim_best',PLAY='nim_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 取子对弈 · 抢最后一步 ================== */
var NAME = '取子对弈 · 抢最后一步';
var state = 'start';
var MAXLOG = 7;
var rows = [], sel = 0, turn = 'me', round = 1, wins = 0, lives = 3, score = 0;
var think = 0, endT = 0, pulse = 0, msg = '', msgT = 0, flash = null;
var LB = { x0: 18, x1: 300, y0: 130, y1: 400, band: 60, bh: 22, sw: 40, gap: 5, slots: 7, block: 310, rx: 44, tagX: 30 };

function maxSlots() {
  var m = MAXLOG, i;
  for (i = 0; i < rows.length; i++) if (rows[i] > m) m = rows[i];
  return m;
}
function layout() {
  var top = Math.max(96, VH * .14);
  var bot = VH - (VW < 420 ? 104 : 66);
  LB.x0 = 18; LB.x1 = Math.max(120, VW - 18);
  LB.y0 = top + 40;
  LB.y1 = Math.max(LB.y0 + 44, bot - 78);
  var avail = Math.max(70, LB.x1 - LB.x0 - 40);
  LB.gap = 5;
  LB.slots = maxSlots();
  LB.sw = Math.max(8, Math.min(46, (avail - LB.gap * (LB.slots - 1)) / LB.slots));
  LB.block = LB.sw * LB.slots + LB.gap * (LB.slots - 1);
  LB.rx = Math.max(LB.x0 + 26, Math.round((VW - LB.block) / 2));
  LB.tagX = LB.rx - 14;
  LB.band = (LB.y1 - LB.y0) / Math.max(1, rows.length);
  LB.bh = Math.max(11, Math.min(30, LB.band * .44));
}
function onResize() { layout(); }

function sumLogs() {
  var s = 0, i;
  for (i = 0; i < rows.length; i++) s += rows[i];
  return s;
}
function firstLive() {
  var i;
  for (i = 0; i < rows.length; i++) if (rows[i] > 0) return i;
  return -1;
}

/* 抢最后一步输(misère)定理:全盘只剩 0/1 根时,轮到走的人当且仅当非空行数为偶数才必胜;
 * 场上还有 >=2 根的行时按普通尼姆算(各行异或非零即必胜),唯一例外是这一手会把对手送进
 * 只剩单根的残局,那就改成留给对手奇数个单根行 —— 用 misWin 直接判定,选着法时自动满足。 */
function misWin(p) {
  var i, big = 0, one = 0, x = 0;
  for (i = 0; i < p.length; i++) {
    x ^= p[i];
    if (p[i] > 1) big++;
    else if (p[i] === 1) one++;
  }
  if (big === 0) return (one % 2) === 0;
  return x !== 0;
}
/* 该局面下轮到走的人有几手必胜着:越少说明对手越容易看漏 */
function winReplies(p) {
  var c = 0, i, k, q;
  for (i = 0; i < p.length; i++) {
    for (k = 0; k < p[i]; k++) {
      q = p.slice(); q[i] = k;
      if (!misWin(q)) c++;
    }
  }
  return c;
}
function pickMove(p) {
  var i, k, q, win = [], alts = [];
  for (i = 0; i < p.length; i++) {
    for (k = 0; k < p[i]; k++) {
      q = p.slice(); q[i] = k;
      if (!misWin(q)) win.push({ i: i, n: p[i] - k });
      else alts.push({ i: i, n: p[i] - k, w: winReplies(q) });
    }
  }
  if (win.length) return win[rnd(win.length)];
  if (!alts.length) return null;
  alts.sort(function (a, b) { return a.w - b.w; });
  var tie = [alts[0]];
  for (i = 1; i < alts.length && alts[i].w === tie[0].w; i++) tie.push(alts[i]);
  return tie[rnd(tie.length)];
}
/* 只发"先手有必胜着"的局面,否则重发:玩家每回合都先走 */
function dealRows(n) {
  var guard = 0, p, i;
  do {
    p = [];
    for (i = 0; i < n; i++) p.push(2 + rnd(6));
    guard++;
  } while (!misWin(p) && guard < 90);
  if (!misWin(p)) {
    p = [];
    for (i = 0; i < n; i++) p.push(i === 0 ? 3 : 2);
  }
  return p;
}

function dealRound() {
  var n = round <= 1 ? 3 : (round === 2 ? 4 : 4 + rnd(2));
  rows = dealRows(n);
  turn = 'me'; think = 0; endT = 0; flash = null; sel = 0;
  layout();
  syncHud(); syncBtns();
}

function resetGame() {
  round = 1; wins = 0; lives = 3; score = 0;
  msg = ''; msgT = 0; pulse = 0;
  dealRound();
}
function startGame() {
  resetGame();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}
function endGame() {
  state = 'over';
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  var rank = wins >= 3 ? '抢步宗师' : wins === 2 ? '算木高手' : wins === 1 ? '初窥门径' : '还是慢半步';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = (wins >= 3 ? '三回合全胜,棋力压人!' : '命数用尽,被对手逼到最后一根') + '<br>' +
    '赢下 <b>' + wins + ' 回合</b> · 打到第 ' + round + ' 回合<br>' +
    '本局得分 <b>' + score + '</b><br>' + rank + '<br>' +
    '剩余命数 ' + lives + '<br>历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '记住两条:把异或打成 0 留给对手,残局只留奇数排单根给它';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  syncHud(); syncBtns();
  tone(wins >= 3 ? 820 : 200, .3, 'sine', .06, wins >= 3 ? 1240 : 90);
}
function syncHud() {
  $('hwins').textContent = wins;
  $('hleft').textContent = sumLogs();
  $('hlives').textContent = lives;
}
/* 按钮不用 class 控制:直接 disabled + 半透明,灰掉但仍看得见 */
function setBtn(id, on) {
  var b = $(id);
  if (!b) return;
  b.disabled = !on;
  b.style.opacity = on ? 1 : .38;
}
function syncBtns() {
  var can = state === 'play' && turn === 'me' && endT <= 0 && sel >= 0 && sel < rows.length && rows[sel] > 0;
  var k = can ? rows[sel] : 0;
  setBtn('take1', k >= 1);
  setBtn('take2', k >= 2);
  setBtn('take3', k >= 3);
  setBtn('takeall', k >= 1);
  setBtn('newbtn', true);
}

function selectRow(i) {
  if (state !== 'play' || turn !== 'me' || endT > 0) return false;
  if (i < 0 || i >= rows.length) return false;
  if (rows[i] <= 0) { msg = '第 ' + (i + 1) + ' 排已经空了'; msgT = 1.1; return false; }
  sel = i;
  tone(520 + i * 40, .04, 'sine', .03);
  syncBtns();
  return true;
}
function moveSel(d) {
  if (state !== 'play' || turn !== 'me' || endT > 0) return;
  var n = rows.length, i;
  for (i = 1; i <= n; i++) {
    var j = (sel + d * i) % n;
    if (j < 0) j += n;
    if (rows[j] > 0) { sel = j; break; }
  }
  syncBtns();
}
function takeLogs(i, n) {
  if (state !== 'play' || turn !== 'me' || endT > 0) return false;
  if (i < 0 || i >= rows.length) return false;
  if (rows[i] <= 0 || n < 1 || n > rows[i]) {
    msg = '这排只有 ' + Math.max(0, rows[i]) + ' 根,取不了 ' + n + ' 根';
    msgT = 1.2;
    return false;
  }
  sel = i;
  doTake(i, n, 'me');
  return true;
}
function doTake(i, n, who) {
  var before = sumLogs();
  rows[i] -= n;
  if (rows[i] < 0) rows[i] = 0;
  flash = { i: i, n: n, who: who, t: .55 };
  msg = (who === 'me' ? '你从第 ' : '对手从第 ') + (i + 1) + ' 排取走 ' + n + ' 根';
  msgT = 1.3;
  tone(who === 'me' ? 300 + n * 42 : 190 + n * 30, .07, 'triangle', .04);
  syncHud();
  /* 桌上被取空 = 这一手的人动了最后一根,本回合判负 */
  if (sumLogs() === 0) { endRound(who, before); return; }
  if (who === 'me') { turn = 'ai'; think = .45 + frnd() * .25; }
  else turn = 'me';
  if (sel < 0 || sel >= rows.length || rows[sel] <= 0) sel = firstLive();
  syncBtns();
}
function aiTurn() {
  if (state !== 'play' || turn !== 'ai' || endT > 0) return false;
  var m = pickMove(rows);
  if (!m) { endRound('ai', sumLogs()); return true; }
  doTake(m.i, m.n, 'ai');
  return true;
}
function endRound(who, before) {
  if (who === 'ai') {
    wins++;
    /* 加分按对手被迫动手时桌上还剩的木数:逼得越满赢分越高 */
    var gain = 120 + before * 4;
    score += gain;
    msg = '对手被迫取最后一根!拿下第 ' + round + ' 回合,+' + gain + ' 分';
    tone(780, .22, 'sine', .06, 1180);
  } else {
    lives--;
    msg = '你被迫取走最后一根,丢一条命';
    noise(.2, .08);
    tone(210, .24, 'square', .05, 90);
  }
  msgT = 1.6;
  turn = 'me'; think = 0; sel = firstLive();
  var done = wins >= 3 || lives <= 0;
  endT = done ? 0 : 1.25;
  syncHud(); syncBtns();
  if (done) endGame();
}

function update(dt) {
  if (msgT > 0) msgT -= dt;
  if (flash) {
    flash.t -= dt;
    if (flash.t <= 0) flash = null;
  }
  if (state !== 'play') return;
  pulse += dt;
  if (endT > 0) {
    endT -= dt;
    if (endT <= 0) { round++; dealRound(); }
    return;
  }
  /* 对手出手由帧钟倒计时驱动,不挂定时器:后台节流与站点测试下墙钟计时不可靠 */
  if (turn === 'ai') {
    think -= dt;
    if (think <= 0) aiTurn();
  }
}

function rr(x, y, w, h, rad) {
  var k = Math.min(rad, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
function sayText() {
  if (state === 'over') return '对弈收工,点「再来一局」重新摆木';
  if (state !== 'play') return '点「开始对弈」把木头摆上桌';
  if (endT > 0) return msg;
  if (msgT > 0) return msg;
  if (turn === 'ai') return '对手思考中…';
  if (sel < 0 || sel >= rows.length) return '点一排木头选中它,再按取子按钮';
  return '选中第 ' + (sel + 1) + ' 排 · 共 ' + rows[sel] + ' 根';
}
function rowCY(i) { return LB.y0 + LB.band * (i + .5); }
function logRect(i, k) {
  return { x: LB.rx + k * (LB.sw + LB.gap), y: rowCY(i) - LB.bh / 2, w: LB.sw, h: LB.bh };
}
function draw() {
  var i, k, m;
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#2d1c0e');
  bg.addColorStop(1, '#140c05');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);

  ctx.fillStyle = 'rgba(0,0,0,.3)';
  rr(LB.x0, LB.y0 - 14, LB.x1 - LB.x0, LB.y1 - LB.y0 + 28, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,190,110,.14)'; ctx.lineWidth = 1.5;
  rr(LB.x0, LB.y0 - 14, LB.x1 - LB.x0, LB.y1 - LB.y0 + 28, 22); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,200,140,.045)'; ctx.lineWidth = 1;
  for (i = 0; i < 5; i++) {
    var wy = LB.y0 - 4 + (LB.y1 - LB.y0 + 16) * (i / 5);
    ctx.beginPath(); ctx.moveTo(LB.x0 + 10, wy); ctx.lineTo(LB.x1 - 10, wy); ctx.stroke();
  }

  var live = state === 'play' && turn === 'me' && endT <= 0;
  for (i = 0; i < rows.length; i++) {
    var cy = rowCY(i);
    var isSel = live && sel === i && rows[i] > 0;
    var top = cy - LB.band * .42, hgt = LB.band * .84;
    ctx.fillStyle = 'rgba(255,220,170,.045)';
    rr(LB.rx - 8, top, LB.block + 16, hgt, 12); ctx.fill();
    if (isSel) {
      ctx.save();
      ctx.shadowColor = 'rgba(255,206,110,.5)';
      ctx.shadowBlur = LOWEND ? 6 : 14;
      ctx.strokeStyle = 'rgba(255,214,120,.95)'; ctx.lineWidth = 2;
      rr(LB.rx - 8, top, LB.block + 16, hgt, 12); ctx.stroke();
      ctx.restore();
    }
    for (k = 0; k < rows[i]; k++) {
      var rc = logRect(i, k);
      var x = rc.x, y = rc.y;
      var g = ctx.createLinearGradient(x, y, x, y + LB.bh);
      g.addColorStop(0, isSel ? '#f3c982' : '#d89c57');
      g.addColorStop(1, isSel ? '#b8762f' : '#8b5a26');
      ctx.fillStyle = g;
      rr(x, y, LB.sw, LB.bh, LB.bh / 2); ctx.fill();
      ctx.strokeStyle = 'rgba(40,20,4,.55)'; ctx.lineWidth = 1;
      rr(x, y, LB.sw, LB.bh, LB.bh / 2); ctx.stroke();
      if (!LOWEND) {
        ctx.fillStyle = 'rgba(255,238,202,.45)';
        ctx.beginPath(); ctx.arc(x + LB.bh * .48, cy, LB.bh * .21, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (rows[i] <= 0) {
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = '600 11px "PingFang SC",sans-serif';
      ctx.fillStyle = 'rgba(255,235,205,.22)';
      ctx.fillText('已取空', LB.rx + 2, cy);
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 11px "PingFang SC",sans-serif';
    ctx.fillStyle = isSel ? 'rgba(255,224,146,.95)' : 'rgba(255,222,170,.38)';
    ctx.fillText(String(i + 1), LB.tagX, cy);
  }

  if (flash && flash.t > 0 && flash.i >= 0 && flash.i < rows.length) {
    var a = Math.max(0, flash.t / .55);
    var fcy = rowCY(flash.i);
    ctx.fillStyle = 'rgba(255,236,170,' + (a * .2) + ')';
    rr(LB.rx - 8, fcy - LB.band * .42, LB.block + 16, LB.band * .84, 12); ctx.fill();
    /* 被取走的那几根留个空框,标出对手这手吃了多少 */
    ctx.strokeStyle = 'rgba(255,226,152,' + (a * .5) + ')';
    ctx.lineWidth = 1.5;
    for (k = rows[flash.i]; k < Math.min(LB.slots, rows[flash.i] + flash.n); k++) {
      var gr = logRect(flash.i, k);
      rr(gr.x, gr.y, gr.w, gr.h, gr.h / 2); ctx.stroke();
    }
  }

  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = '700 13px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(255,214,140,.85)';
  ctx.fillText('第 ' + round + ' 回合 · 得分 ' + score, LB.x0 + 6, LB.y0 - 26);
  ctx.textAlign = 'right';
  if (live) {
    ctx.fillStyle = 'rgba(150,235,180,.9)';
    ctx.fillText('你走', LB.x1 - 6, LB.y0 - 26);
  } else if (state === 'play' && turn === 'ai' && endT <= 0) {
    var dip = '';
    for (m = 0; m <= Math.floor(pulse * 2) % 3; m++) dip += '·';
    ctx.fillStyle = 'rgba(255,170,120,.92)';
    ctx.fillText('对手思考中' + dip, LB.x1 - 6, LB.y0 - 26);
  } else if (state === 'play') {
    ctx.fillStyle = 'rgba(255,210,150,.8)';
    ctx.fillText('本回合结束', LB.x1 - 6, LB.y0 - 26);
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = (msgT > 0 || endT > 0) ? 'rgba(255,222,130,.95)' : 'rgba(255,232,200,.55)';
  ctx.fillText(sayText(), VW / 2, LB.y1 + 24);
  ctx.font = '600 11.5px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(255,232,200,.34)';
  ctx.fillText('每回合只能从一排里取,至少 1 根 · 谁取走最后一根谁输本回合', VW / 2, LB.y1 + 42);
  ctx.fillText('三回合胜或三条命用尽即收工 · 键盘 ↑↓ 选排,1/2/3/4 取子', VW / 2, LB.y1 + 60);
}

function rowAt(y) {
  if (y < LB.y0 || y > LB.y1) return -1;
  var i = Math.floor((y - LB.y0) / Math.max(1, LB.band));
  if (i < 0) i = 0;
  if (i >= rows.length) i = rows.length - 1;
  return i;
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  var i = rowAt(e.clientY);
  if (i < 0) return;
  if (!selectRow(i)) {
    if (turn === 'ai' && endT <= 0) { msg = '等对手走完'; msgT = .9; }
  }
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { e.preventDefault(); moveSel(-1); }
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { e.preventDefault(); moveSel(1); }
  if (e.key === '1') { e.preventDefault(); takeLogs(sel, 1); }
  if (e.key === '2') { e.preventDefault(); takeLogs(sel, 2); }
  if (e.key === '3') { e.preventDefault(); takeLogs(sel, 3); }
  if (e.key === '4' || e.key === 'a' || e.key === 'A') {
    e.preventDefault();
    if (sel >= 0 && sel < rows.length) takeLogs(sel, rows[sel]);
  }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startGame(); }
});

function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', startGame);
$('take1').addEventListener('click', function () { takeLogs(sel, 1); });
$('take2').addEventListener('click', function () { takeLogs(sel, 2); });
$('take3').addEventListener('click', function () { takeLogs(sel, 3); });
$('takeall').addEventListener('click', function () {
  if (sel >= 0 && sel < rows.length) takeLogs(sel, rows[sel]);
});
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」赢了 ' + wins + ' 回合! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  state: function () { return state; },
  rows: function () { return rows.slice(); },
  turn: function () { return turn; },
  round: function () { return round; },
  wins: function () { return wins; },
  lives: function () { return lives; },
  score: function () { return score; },
  left: function () { return sumLogs(); },
  sel: function () { return sel; },
  board: function () { return LB; },
  logRect: function (i, k) { return (i >= 0 && i < rows.length && k >= 0 && k < rows[i]) ? logRect(i, k) : null; },
  busy: function () { return state === 'play' && (turn === 'ai' || endT > 0); },
  select: function (i) { return selectRow(i); },
  take: function (i, n) { return takeLogs(i, n); },
  takeAll: function (i) { return (i >= 0 && i < rows.length) ? takeLogs(i, rows[i]) : false; },
  legal: function (i) { return state === 'play' && turn === 'me' && endT <= 0 && i >= 0 && i < rows.length && rows[i] > 0; },
  setRows: function (arr) {
    rows = [];
    for (var i = 0; i < arr.length; i++) rows.push(Math.max(0, Math.floor(arr[i]) || 0));
    turn = 'me'; think = 0; endT = 0; flash = null; msg = ''; msgT = 0;
    sel = firstLive();
    layout(); syncHud(); syncBtns();
  },
  aiMove: function () {
    if (state !== 'play' || endT > 0) return false;
    think = 0; turn = 'ai';
    return aiTurn();
  },
  deal: function (r) { round = r || round; dealRound(); },
  misWin: function (p) { return misWin(p ? p.slice() : rows.slice()); },
  solve: function () { return pickMove(rows.slice()); },
  dealRows: dealRows,
  step: function (n) { for (var i = 0; i < n; i++) update(1 / 60); },
  untilMyTurn: function () { for (var i = 0; i < 900 && state === 'play' && (turn !== 'me' || endT > 0); i++) update(1 / 60); },
  forceEnd: endGame,
  best: function () { return KIT.best(); }
};

resize();
resetGame();
$('padbar').classList.add('hide');
updMini();
run();

})();
</script>

  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='nim'});
  r.unshift({k:'nim',n:'取子对弈 · 抢最后一步',e:'🪵'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['nim_best','nim_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['nim']||0)){
            B['nim']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
