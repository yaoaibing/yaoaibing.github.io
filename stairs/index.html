<script>
(function(){
'use strict';

/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='stai_best',PLAY='stai_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* ================== GAME · 是男人就下一百层 ================== */
var PW=26,PH=30,CEIL_TOP=52,PTH=14;
var BOUNCE=235,MV=430;
var G={
  state:'start',phase:'play',dieT:0,win:false,fail:'',
  floor:0,score:0,bestFloor:0,
  p:{x:0,y:0,vx:0,vy:0,sq:1,face:1},
  layers:[],lastY:0,layerN:0,
  ceilY:0,camY:0,
  tx:null,dir:0,down:false,
  parts:[],floats:[],bigT:0,bigTxt:'',
  shake:0,flash:0,t:0
};
function onResize(){
  PW=clamp(Math.round(VW*0.075),18,34);
  PH=Math.round(PW*1.2);
  CEIL_TOP=Math.max(48,Math.round(VH*0.075));
  G.p.x=clamp(G.p.x||VW/2,PW/2,VW-PW/2);
}
function grav(){return Math.min(3000,2050+G.floor*9)}
function maxFall(){return Math.min(1500,1020+G.floor*4.5)}
function ceilSpeed(){return Math.min(265,64+G.floor*0.5)}
function layerGap(){return clamp(104-G.floor*0.24,74,104)}

/* --- 关卡生成 --- */
function pickType(f){
  var pool=[['n',f<8?100:Math.max(28,100-f*2.2)]];
  if(f>=5)pool.push(['f',Math.min(22,4+f*0.6)]);
  if(f>=9)pool.push(['s',Math.min(26,3+f*0.9)]);
  if(f>=12)pool.push(['c',Math.min(20,3+f*0.6)]);
  if(f>=15)pool.push(['m',Math.min(20,3+f*0.7)]);
  var tot=0,i;
  for(i=0;i<pool.length;i++)tot+=pool[i][1];
  var rol=frnd()*tot;
  for(i=0;i<pool.length;i++){rol-=pool[i][1];if(rol<=0)return pool[i][0]}
  return 'n';
}
function genLayer(y){
  var W=VW,gapMin=Math.max(58,PW*2.3);
  var gaps=[],gn=1+(frnd()<0.45?1:0),i;
  for(i=0;i<gn;i++){
    var gw=gapMin+frnd()*Math.max(26,W*0.16),placed=false,att=0;
    while(att++<14&&!placed){
      var gx=frnd()*(W-gw),clash=false;
      for(var j=0;j<gaps.length;j++){
        if(gx<gaps[j].x+gaps[j].w+26&&gx+gw+26>gaps[j].x){clash=true;break}
      }
      if(!clash){gaps.push({x:gx,w:gw});placed=true}
    }
  }
  if(!gaps.length)gaps.push({x:frnd()*(W-gapMin),w:gapMin});
  gaps.sort(function(a,b){return a.x-b.x});
  // 补集 = 平台段
  var segs=[],cur=0;
  for(i=0;i<gaps.length;i++){
    if(gaps[i].x>cur+18)segs.push({x:cur,w:gaps[i].x-cur});
    cur=Math.max(cur,gaps[i].x+gaps[i].w);
  }
  if(cur<W-18)segs.push({x:cur,w:W-cur});
  var f=G.floor;
  for(i=0;i<segs.length;i++){
    if(segs[i].w<22)continue;
    var tp=(f<4)?'n':pickType(f);
    var pl={x:segs[i].x,y:y,w:segs[i].w,h:PTH,type:tp,brk:0,n:G.layerN+1,cnt:false};
    if(tp==='m'){
      pl.x0=segs[i].x;pl.amp=Math.min(segs[i].w*0.5,30+frnd()*70);
      pl.ph=frnd()*6.2832;pl.sp=0.7+frnd()*0.8;
      pl.x=clamp(pl.x,-0,Math.max(0,VW-pl.w));pl.x0=pl.x;
    }
    if(tp==='c')pl.cd=frnd()<.5?-1:1;
    G.layers.push(pl);
  }
  // 保证这一层至少有一块能落脚的
  var safe=false;
  for(i=0;i<G.layers.length;i++)if(G.layers[i].y===y&&G.layers[i].type!=='s'){safe=true;break}
  if(!safe){
    var widest=null;
    for(i=0;i<G.layers.length;i++){
      var L=G.layers[i];
      if(L.y===y&&(!widest||L.w>widest.w))widest=L;
    }
    if(widest){widest.type='n';widest.brk=0}
  }
  G.layerN++;
  G.lastY=y;
}
function ensureLayers(){
  while(G.lastY<G.p.y+VH*1.15){
    genLayer(G.lastY+layerGap());
  }
  // 回收屏幕上方的层
  while(G.layers.length&&G.layers[0].y<G.camY-120)G.layers.shift();
}
function resetWorld(){
  G.layers=[];G.layerN=0;G.lastY=0;
  G.p.x=VW/2;G.p.y=CEIL_TOP+VH*0.30;G.p.vx=0;G.p.vy=0;G.p.sq=1;
  G.ceilY=G.p.y-VH*0.45;G.camY=G.ceilY-CEIL_TOP;
  G.floor=0;G.floorWorld=G.p.y;
  ensureLayers();
}

/* --- 表现 --- */
function addParts(x,y,col,n){
  n=Math.min(n,150-G.parts.length);
  for(var i=0;i<n;i++)G.parts.push({x:x,y:y,vx:(frnd()-.5)*300,vy:(frnd()-.5)*300-60,
    life:.35+frnd()*.5,col:col,s:2+frnd()*3});
}
function addFloat(x,y,txt,col){if(G.floats.length<12)G.floats.push({x:x,y:y,t:txt,c:col,life:1})}
function big(txt){G.bigTxt=txt;G.bigT=1.1}

/* --- 死亡 / 通关 --- */
function die(kind){
  if(G.state!=='play'){resetWorld();return}      // 开始页演示模式:悄悄重开
  G.phase='die';G.dieT=0;G.fail=kind;
  G.shake=.5;G.flash=.4;
  addParts(G.p.x+PW/2,G.p.y+PH/2,kind==='spike'?'#ff5a5a':'#ff8a3a',18);
  addParts(G.p.x+PW/2,G.p.y+PH/2,'#ffd45c',8);
  noise(.26,.1);tone(200,.3,'sawtooth',.08,70);
}
function winGame(){
  G.phase='die';G.dieT=0;G.win=true;G.fail='';
  G.score=G.floor*10+500;
  addFloat(VW/2,G.p.y-40,'🎉 通关','#ffd45c');
  tone(523,.12,'sine',.06);setTimeout(function(){tone(659,.12,'sine',.06)},110);
  setTimeout(function(){tone(784,.12,'sine',.06)},220);
  setTimeout(function(){tone(1046,.24,'sine',.06)},330);
}
function gameOver(){
  G.state='over';
  if(!G.win)G.score=G.floor*10;
  var isNew=KIT.setBest(G.score);
  if(G.floor>G.bestFloor){G.bestFloor=G.floor;lsSet('stai_floor',G.floor)}
  var tl=document.querySelector('#over .title');
  if(tl)tl.innerHTML=G.win?'🎉 一百层达成<small>· 是 男 人 ·</small>':'被扎了';
  $('onewrec').style.display=isNew?'block':'none';
  $('ostats').innerHTML=
    '下到 layer <b>'+G.floor+'</b> 层'.replace('layer ','第 ')+
    '<br>本局得分 <b>'+G.score+'</b><br>'+
    '最深纪录 <b>'+G.bestFloor+'</b> 层<br>'+
    (G.fail?'死因 <b style="font-size:15px">'+G.fail+'</b><br>':'')+
    '历史最高 <b>'+KIT.best()+'</b>';
  $('mini2').innerHTML='已玩 <b>'+KIT.plays()+'</b> 局 · 连续打卡 <b>'+KIT.streakNow()+'</b> 天 🔥';
  $('over').classList.remove('hide');
  if(!G.win){tone(330,.16,'sine',.05);setTimeout(function(){tone(247,.3,'sine',.05)},170)}
}
function startGame(){
  G.state='play';G.phase='play';G.win=false;G.fail='';G.dieT=0;
  G.score=0;G.parts=[];G.floats=[];G.tx=null;G.dir=0;G.down=false;
  G.shake=0;G.flash=0;G.bigT=0;
  resetWorld();
  $('start').classList.add('hide');$('over').classList.add('hide');
  KIT.addPlay();KIT.streak();
  run();
}

/* --- 物理步进 --- */
function physics(dt){
  G.t+=dt;
  var p=G.p;
  // 左右
  var want;
  if(G.dir!==0)want=G.dir*MV;
  else if(G.tx!==null&&G.tx!==undefined)want=clamp((G.tx-p.x)*15,-MV,MV);
  else want=0;
  p.vx+=(want-p.vx)*Math.min(1,dt*22);
  if(Math.abs(p.vx)>10)p.face=p.vx>0?1:-1;
  p.x+=p.vx*dt;
  if(p.x<PW/2){p.x=PW/2;if(p.vx<0)p.vx=0}
  if(p.x>VW-PW/2){p.x=VW-PW/2;if(p.vx>0)p.vx=0}

  // 重力
  p.vy=Math.min(maxFall(),p.vy+grav()*dt);
  var prevBot=p.y+PH;
  p.y+=p.vy*dt;
  var newBot=p.y+PH;

  // 平台(只在下坠时判定,宽松容错)
  if(p.vy>0){
    for(var i=0;i<G.layers.length;i++){
      var L=G.layers[i];
      if(L.brk>0)continue;
      if(newBot<L.y||prevBot>L.y+L.h)continue;
      if(p.x+PW*0.42<L.x||p.x-PW*0.42>L.x+L.w)continue;   // 判定放宽
      if(newBot<L.y+Math.max(6,p.vy*dt))continue;
      land(L);
      if(G.phase==='die')return;
      break;
    }
  }
  if(p.sq<1)p.sq=Math.min(1,p.sq+dt*4);

  // 天花板:持续下压 + 跟不上就追
  G.ceilY+=ceilSpeed()*dt;
  if(p.y-G.ceilY>VH*0.66)G.ceilY=p.y-VH*0.66;
  G.camY=G.ceilY-CEIL_TOP;
  if(p.y-G.ceilY<8){die('被天花板压扁了');return}

  // 层生成 / 回收 / 计数
  ensureLayers();
  for(var j=0;j<G.layers.length;j++){
    var K=G.layers[j];
    if(K.type==='m'){
      K.x=clamp(K.x0+Math.sin(G.t*K.sp+K.ph)*K.amp,0,VW-K.w);
    }
    if(K.brk>0){K.brk-=dt;if(K.brk<=0)G.layers.splice(j--,1)}
    if(!K.cnt&&p.y>K.y+4){
      K.cnt=true;
      if(K.n>G.floor){
        G.floor=K.n;
        G.score=G.floor*10;
        if(G.floor%10===0&&G.state==='play'){
          big('第 '+G.floor+' 层');
          tone(880,.1,'triangle',.05,1320);
        }
        if(G.floor>=100){winGame();return}
      }
    }
  }
}
function land(L){
  var p=G.p;
  p.y=L.y-PH;p.sq=0.62;
  if(L.type==='s'){
    addParts(p.x+PW/2,L.y,'#ff4a4a',14);
    die('一脚踩在尖刺上');return;
  }
  p.vy=-BOUNCE;
  if(L.type==='f'){
    if(!L.brk){L.brk=.2;addParts(p.x+PW/2,L.y,'#c8b48a',8);tone(300,.09,'square',.05,160)}
  }else if(L.type==='c'){
    p.vx+=L.cd*230;
    tone(520,.07,'square',.04,720);
  }
  addParts(p.x+PW/2,L.y,'#9fb8ff',5);
  tone(L.type==='f'?300:420,.06,'square',.035,240);
}

/* --- 更新 --- */
function updFx(dt){
  for(var q=G.parts.length-1;q>=0;q--){
    var pt=G.parts[q];pt.life-=dt;
    pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=520*dt;
    if(pt.life<=0)G.parts.splice(q,1);
  }
  for(var f=G.floats.length-1;f>=0;f--){
    var fl=G.floats[f];fl.life-=dt*.8;fl.y-=34*dt;
    if(fl.life<=0)G.floats.splice(f,1);
  }
  if(G.bigT>0)G.bigT-=dt;
}
function update(dt){
  if(G.state==='over'){updFx(dt);if(G.shake>0)G.shake-=dt;if(G.flash>0)G.flash-=dt;return}
  if(G.shake>0)G.shake-=dt;
  if(G.flash>0)G.flash-=dt;
  if(G.phase==='die'){
    G.dieT+=dt;updFx(dt);
    if(G.dieT>1.05)gameOver();
    return;
  }
  physics(dt);
  updFx(dt);
  syncHUD();
}
function syncHUD(){
  $('hfloor').textContent=G.floor;
  $('hscore').textContent=G.score;
  $('hbest').textContent=G.bestFloor;
}

/* --- 绘制 --- */
function sy(worldY){return worldY-G.camY}
function drawBG(){
  var g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#242447');g.addColorStop(.5,'#1a1a2e');g.addColorStop(1,'#10101c');
  ctx.fillStyle=g;ctx.fillRect(-14,-14,VW+28,VH+28);
  // 速度线:跟着下坠速度拉长,制造坠落感
  var spd=clamp(Math.abs(G.p.vy)/maxFall(),0,1);
  var step=52,top=Math.floor(G.camY/step)*step;
  ctx.strokeStyle='rgba(150,190,255,.16)';ctx.lineWidth=2;
  for(var i=top;i<G.camY+VH+step;i+=step){
    var seed=(i*2654435761)%1000;
    var x=Math.abs(seed)%Math.max(1,VW-20)+10;
    var y=sy(i),len=8+spd*46;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+len);ctx.stroke();
  }
  // 两侧墙
  ctx.fillStyle='rgba(10,10,22,.85)';
  ctx.fillRect(0,CEIL_TOP-4,5,VH);ctx.fillRect(VW-5,CEIL_TOP-4,5,VH);
}
function drawCeiling(){
  var y=CEIL_TOP;
  var g=ctx.createLinearGradient(0,0,0,y);
  g.addColorStop(0,'#4a1030');g.addColorStop(1,'#7a1a3a');
  ctx.fillStyle=g;ctx.fillRect(0,-14,VW,y+14);
  ctx.fillStyle='#a0203f';
  var n=Math.max(6,Math.floor(VW/34)),w=VW/n;
  for(var i=0;i<n;i++){
    ctx.beginPath();
    ctx.moveTo(i*w,y-2);ctx.lineTo(i*w+w/2,y+16);ctx.lineTo(i*w+w,y-2);
    ctx.closePath();ctx.fill();
  }
  ctx.fillStyle='rgba(255,255,255,.14)';
  ctx.fillRect(0,y-4,VW,3);
}
function drawLayer(L){
  var y=sy(L.y);
  if(y<-40||y>VH+40)return;
  var col,top='rgba(255,255,255,.35)';
  if(L.type==='n'){col='#4a7ad8'}
  else if(L.type==='s'){col='#8a2438'}
  else if(L.type==='f'){col='#b09a72'}
  else if(L.type==='c'){col='#2f7a8a'}
  else {col='#6a4aa8'}
  if(L.brk>0)ctx.globalAlpha=clamp(L.brk*5,0,1);
  ctx.fillStyle=col;ctx.fillRect(L.x,y,L.w,L.h);
  ctx.fillStyle=top;ctx.fillRect(L.x,y,L.w,3);
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(L.x,y+L.h-3,L.w,3);
  // 类型标记
  if(L.type==='s'){
    ctx.fillStyle='#ff5a5a';
    var sn=Math.max(2,Math.floor(L.w/14));
    for(var i=0;i<sn;i++){
      var sx=L.x+i*(L.w/sn),sw=L.w/sn;
      ctx.beginPath();ctx.moveTo(sx,y);ctx.lineTo(sx+sw/2,y-9);ctx.lineTo(sx+sw,y);ctx.closePath();ctx.fill();
    }
  }else if(L.type==='c'){
    ctx.fillStyle='rgba(255,255,255,.6)';
    var cn=Math.max(2,Math.floor(L.w/16));
    for(var j=0;j<cn;j++){
      var cx=L.x+j*(L.w/cn)+L.w/cn*0.3;
      var off=((G.t*90*L.cd)%20+20)%20;
      ctx.beginPath();
      ctx.moveTo(cx+off*(L.cd>0?1:-1),y+2);
      ctx.lineTo(cx+6*(L.cd>0?1:-1),y+L.h/2);
      ctx.lineTo(cx+off*(L.cd>0?1:-1),y+L.h-2);
      ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.55)';ctx.stroke();
    }
  }else if(L.type==='f'){
    ctx.strokeStyle='rgba(60,40,20,.8)';ctx.lineWidth=2;
    for(var k=1;k<3;k++){
      ctx.beginPath();
      ctx.moveTo(L.x+L.w*(k/3),y);
      ctx.lineTo(L.x+L.w*(k/3)+4,y+L.h/2);
      ctx.lineTo(L.x+L.w*(k/3)-2,y+L.h);ctx.stroke();
    }
  }else if(L.type==='m'){
    ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.fillRect(L.x+L.w/2-3,y+L.h-2,6,4);
    ctx.fillRect(L.x+4,y+L.h-3,5,3);ctx.fillRect(L.x+L.w-9,y+L.h-3,5,3);
  }
  ctx.globalAlpha=1;
}
function drawPlayer(){
  var p=G.p,y=sy(p.y),h=PH*p.sq,w=PW*(2-p.sq)*0.75;
  var dead=G.phase==='die';
  ctx.save();
  ctx.translate(p.x,y+PH/2);
  ctx.scale(w/PW,h/PH);
  ctx.fillStyle=dead?'#ff6a6a':'#ffd45c';
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(-PW/2,-PH/2,PW,PH,7);
  else ctx.rect(-PW/2,-PH/2,PW,PH);
  ctx.fill();
  ctx.fillStyle='#26314f';
  var ex=PW*0.2,ey=-PH*0.12;
  if(dead){
    ctx.strokeStyle='#26314f';ctx.lineWidth=2.4;
    ctx.beginPath();
    ctx.moveTo(-ex-3,ey-3);ctx.lineTo(-ex+3,ey+3);
    ctx.moveTo(-ex+3,ey-3);ctx.lineTo(-ex-3,ey+3);
    ctx.moveTo(ex-3,ey-3);ctx.lineTo(ex+3,ey+3);
    ctx.moveTo(ex+3,ey-3);ctx.lineTo(ex-3,ey+3);
    ctx.stroke();
  }else{
    ctx.beginPath();ctx.arc(-ex*p.face,ey,2.6,0,6.2832);ctx.fill();
    ctx.beginPath();ctx.arc(ex*p.face,ey,2.6,0,6.2832);ctx.fill();
  }
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.fillRect(-PW/2,-PH/2,PW,4);
  ctx.restore();
}
function draw(){
  ctx.save();
  if(G.shake>0)ctx.translate((frnd()-.5)*10*G.shake*3,(frnd()-.5)*10*G.shake*3);
  drawBG();
  for(var i=0;i<G.layers.length;i++)drawLayer(G.layers[i]);
  drawPlayer();
  for(var q=0;q<G.parts.length;q++){
    var pt=G.parts[q];
    ctx.globalAlpha=clamp(pt.life*1.9,0,1);
    ctx.fillStyle=pt.col;ctx.fillRect(pt.x,sy(pt.y),pt.s,pt.s);
  }
  ctx.globalAlpha=1;
  drawCeiling();
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(var f=0;f<G.floats.length;f++){
    var fl=G.floats[f];
    ctx.globalAlpha=clamp(fl.life,0,1);
    ctx.font='900 15px system-ui';ctx.fillStyle=fl.c;
    ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=3;
    ctx.strokeText(fl.t,fl.x,sy(fl.y));ctx.fillText(fl.t,fl.x,sy(fl.y));
  }
  ctx.globalAlpha=1;
  if(G.bigT>0&&G.state==='play'){
    ctx.globalAlpha=clamp(G.bigT,0,1);
    ctx.font='900 42px system-ui';ctx.fillStyle='rgba(255,212,92,.95)';
    ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=5;
    ctx.strokeText(G.bigTxt,VW/2,VH*0.42);ctx.fillText(G.bigTxt,VW/2,VH*0.42);
    ctx.globalAlpha=1;
  }
  // 距离提示:离天花板还有多远
  if(G.state==='play'&&G.phase==='play'){
    var danger=clamp(1-(G.p.y-G.ceilY)/(VH*0.28),0,1);
    if(danger>0.2){
      ctx.globalAlpha=danger*.5;
      var g2=ctx.createLinearGradient(0,CEIL_TOP,0,CEIL_TOP+VH*0.28);
      g2.addColorStop(0,'rgba(255,40,80,.85)');g2.addColorStop(1,'rgba(255,40,80,0)');
      ctx.fillStyle=g2;ctx.fillRect(0,CEIL_TOP,VW,VH*0.28);
      ctx.globalAlpha=1;
    }
  }
  if(G.flash>0){ctx.fillStyle='rgba(255,60,60,'+(G.flash*.45)+')';ctx.fillRect(-14,-14,VW+28,VH+28)}
  ctx.restore();
}

/* --- 输入:按住拖动 / 点左右半屏 / 键盘 --- */
function setTarget(x){
  G.tx=x;
  if(x<VW*0.30)G.tx=0;          // 靠边就一路贴墙,单手也够用
  else if(x>VW*0.70)G.tx=VW;
}
cv.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  G.down=true;G.dir=0;
  setTarget(e.clientX);
},{passive:true});
cv.addEventListener('pointermove',function(e){
  if(!G.down)return;
  setTarget(e.clientX);
},{passive:true});
cv.addEventListener('pointerup',function(){G.down=false},{passive:true});
cv.addEventListener('pointercancel',function(){G.down=false},{passive:true});
window.addEventListener('keydown',function(e){
  if(G.state!=='play'){if(e.key===' '||e.key==='Enter'){startGame();e.preventDefault()}return}
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){G.dir=-1;G.tx=null}
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){G.dir=1;G.tx=null}
  else return;
  e.preventDefault();
});
window.addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'||e.key==='ArrowRight'||e.key==='d'||e.key==='D')G.dir=0;
});

/* --- 启动 --- */
$('startbtn').addEventListener('click',startGame);
$('againbtn').addEventListener('click',startGame);
$('hubbtn').addEventListener('click',function(){location.href='/'});
$('sharebtn').addEventListener('click',function(){
  share('我在「是男人就下一百层」下到第 '+G.floor+' 层'+(G.win?',通关啦!':'')+',拿了 '+G.score+' 分!你敢来比比吗? https://yaoaibing.github.io/stairs/');
});
$('mini').innerHTML='最深纪录 <b>第 '+G.bestFloor+'</b> 层 · 历史最高 <b>'+KIT.best()+'</b> 分 · 已玩 <b>'+KIT.plays()+'</b> 局'+
  (KIT.streakNow()>1?' · 连续打卡 <b>'+KIT.streakNow()+'</b> 天 🔥':'');
G.bestFloor=(+lsGet('stai_floor','0'))||0;
resize();onResize();resetWorld();draw();run();
})();
</script>

<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';
  var name=(document.title||'游戏').split(/[ ··|]/)[0];

  // 回大厅
  var hb=document.createElement('button');
  hb.setAttribute('type','button');hb.textContent='\uD83C\uDFE0';
  hb.style.cssText='position:fixed;top:'+SAFE+';left:10px;z-index:99;border:0;width:36px;height:36px;'+
    'border-radius:12px;font-size:15px;background:rgba(255,255,255,.14);color:#fff;'+
    'border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);cursor:pointer';
  hb.onclick=function(){location.href='/'};
  document.body.appendChild(hb);

  // 结算页:晒战绩 + 换个游戏
  var over=document.getElementById('over');
  if(over){
    var box=document.createElement('div');
    box.style.cssText='display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px';
    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>
