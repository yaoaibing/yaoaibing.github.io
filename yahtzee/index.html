<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='yahtzee_best',PLAY='yahtzee_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 快艇骰子 · 十三轮 ================== */
var NAME = '快艇骰子 · 十三轮';
var state = 'start';
var CATS = [
  { k: 'u1', n: '一点' }, { k: 'u2', n: '二点' }, { k: 'u3', n: '三点' },
  { k: 'u4', n: '四点' }, { k: 'u5', n: '五点' }, { k: 'u6', n: '六点' },
  { k: 'three', n: '三条' }, { k: 'four', n: '四条' }, { k: 'house', n: '葫芦' },
  { k: 'small', n: '小顺' }, { k: 'large', n: '大顺' }, { k: 'yahtzee', n: '快艇' },
  { k: 'chance', n: '机会' }
];
var dice = [1, 2, 3, 4, 5], held = [0, 0, 0, 0, 0];
var rolls = 3, rolled = false, used = {}, score = 0;
var animT = 0, animFaces = [1, 1, 1, 1, 1], animKeep = [0, 0, 0, 0, 0], flashT = 0, flashTx = '';
var DX = 0, DY = 0, DS = 50, DGAP = 10;
var cardY = 0, cardX = 0, colW = 140, rowH = 36, colGap = 12;
var PIPS = [
  [], [4], [0, 8], [0, 4, 8], [0, 2, 6, 8], [0, 2, 4, 6, 8], [0, 2, 3, 5, 6, 8]
];

function rr(x, y, w, h, r) {
  var k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}

function counts(d) {
  var c = [0, 0, 0, 0, 0, 0, 0], i;
  for (i = 0; i < 5; i++) c[d[i]]++;
  return c;
}
function scoreCat(k, d) {
  var c = counts(d), i, sum = 0, mx = 0, has2 = false, seq = '';
  for (i = 1; i <= 6; i++) {
    sum += c[i] * i;
    if (c[i] > mx) mx = c[i];
    if (c[i] === 2) has2 = true;
    if (c[i]) seq += i;
  }
  if (k.charAt(0) === 'u') {
    var f = +k.charAt(1);
    return c[f] * f;
  }
  if (k === 'three') return mx >= 3 ? sum : 0;
  if (k === 'four') return mx >= 4 ? sum : 0;
  if (k === 'house') return mx === 5 || (mx >= 3 && has2) ? 25 : 0;
  if (k === 'small') return /1234|2345|3456/.test(seq) ? 30 : 0;
  if (k === 'large') return /12345|23456/.test(seq) ? 40 : 0;
  if (k === 'yahtzee') return mx === 5 ? 50 : 0;
  return sum;
}
function upperTotal() {
  var s = 0;
  for (var i = 0; i < 6; i++) if (used[CATS[i].k]) s += used[CATS[i].k];
  return s;
}
function lowerTotal() {
  var s = 0;
  for (var i = 6; i < CATS.length; i++) if (used[CATS[i].k]) s += used[CATS[i].k];
  return s;
}
function totalNow() {
  var u = upperTotal();
  return u + (u >= 63 ? 35 : 0) + lowerTotal();
}
function usedCount() {
  var n = 0;
  for (var i = 0; i < CATS.length; i++) if (used[CATS[i].k] !== undefined) n++;
  return n;
}

function layout() {
  DS = clamp(Math.floor(Math.min((VW - 48) / 5, VH * .13)), 40, 64);
  DGAP = clamp(Math.round(DS * .18), 6, 12);
  var rowW = DS * 5 + DGAP * 4;
  DX = Math.round((VW - rowW) / 2);
  DY = Math.round(Math.max(88, VH * .1));
  cardY = Math.round(DY + DS + 52);
  var bot = VH - 96;
  rowH = clamp(Math.floor((bot - cardY - 26) / 7), 26, 46);
  colW = Math.min(Math.floor((VW - 40 - 14) / 2), 310);
  colGap = 14;
  cardX = Math.round((VW - colW * 2 - colGap) / 2);
}
function onResize() { layout(); }

function resetGame() {
  dice = [1, 2, 3, 4, 5];
  held = [0, 0, 0, 0, 0];
  rolls = 3; rolled = false; used = {}; score = 0;
  animT = 0; flashT = 0; flashTx = '';
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud(); syncRoll();
}
function syncHud() {
  $('hround').textContent = Math.min(13, usedCount() + 1) + '/13';
  $('hscore').textContent = totalNow();
  $('hupper').textContent = upperTotal();
}
function syncRoll() {
  var b = $('rollbtn');
  if (!b) return;
  if (rolls > 0 && animT <= 0) {
    b.textContent = '🎲 掷骰 (' + rolls + ')';
    b.classList.add('on');
    b.style.opacity = 1;
  } else {
    b.textContent = animT > 0 ? '🎲 滚动中…' : '🎲 掷完了·选一格';
    b.classList.remove('on');
    b.style.opacity = .55;
  }
}

function doRoll() {
  if (state !== 'play' || rolls <= 0 || animT > 0) return;
  var i;
  for (i = 0; i < 5; i++) {
    if (rolls === 3 || !held[i]) dice[i] = 1 + rnd(6);
  }
  if (rolls === 3) held = [0, 0, 0, 0, 0];
  rolls--;
  rolled = true;
  animT = .42;
  animFaces = [];
  for (i = 0; i < 5; i++) animFaces.push(1 + rnd(6));
  animKeep = [held[0], held[1], held[2], held[3], held[4]];
  tone(320 + rnd(80), .06, 'triangle', .04);
  syncHud(); syncRoll();
}

function toggleDie(i) {
  if (state !== 'play' || !rolled || animT > 0) return;
  held[i] = held[i] ? 0 : 1;
  tone(held[i] ? 520 : 360, .05, 'triangle', .035);
}

function pickCat(idx) {
  if (state !== 'play' || !rolled || animT > 0) return;
  var cat = CATS[idx];
  if (!cat || used[cat.k] !== undefined) return;
  var v = scoreCat(cat.k, dice);
  used[cat.k] = v;
  score = totalNow();
  flashT = .9;
  flashTx = '+' + v + ' · ' + cat.n;
  tone(v > 0 ? 660 : 220, .09, 'triangle', .05);
  if (usedCount() >= 13) { gameOver(); return; }
  rolls = 3; rolled = false; held = [0, 0, 0, 0, 0];
  syncHud(); syncRoll();
}

function gameOver() {
  state = 'over';
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  var u = upperTotal(), lo = lowerTotal();
  var rank = score >= 280 ? '🚢 快艇船长' : score >= 220 ? '⛵ 老练水手' : score >= 160 ? '🛶 甲板新人' : '🪝 码头看客';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '总分 <b>' + score + '</b><br>' +
    '上区 ' + u + (u >= 63 ? ' · 奖励 +35' : ' · 差 ' + (63 - u) + ' 分奖励') + '<br>' +
    '下区 ' + lo + ' 分<br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '上区先凑 63 分拿 +35 奖励,快艇和葫芦留给最后一轮';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
}

function update(dt) {
  if (flashT > 0) flashT -= dt;
  if (animT > 0) {
    animT -= dt;
    if (animT <= 0) { animT = 0; syncRoll(); }
  }
}

function drawDie(x, y, s, v, isHeld) {
  var r = s * .16;
  ctx.save();
  if (isHeld) {
    ctx.shadowColor = 'rgba(255,212,92,.75)';
    ctx.shadowBlur = 14;
  }
  ctx.fillStyle = isHeld ? '#fff3c9' : '#f7f4ea';
  rr(x, y - (isHeld ? 5 : 0), s, s, r); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = isHeld ? '#ffc93c' : 'rgba(60,50,30,.35)';
  ctx.lineWidth = isHeld ? 3 : 1.5;
  rr(x, y - (isHeld ? 5 : 0), s, s, r); ctx.stroke();
  var pad = s * .22, inner = s - pad * 2, step = inner / 2;
  var py = y - (isHeld ? 5 : 0);
  var pips = PIPS[v] || [];
  for (var i = 0; i < pips.length; i++) {
    var gx = x + pad + (pips[i] % 3) * step, gy = py + pad + Math.floor(pips[i] / 3) * step;
    ctx.fillStyle = '#2b2b33';
    ctx.beginPath(); ctx.arc(gx, gy, Math.max(2.2, s * .055), 0, 6.2832); ctx.fill();
  }
  if (isHeld) drawEm('🔒', x + s - 9, y - 4, Math.round(s * .3));
  ctx.restore();
}

function drawCard() {
  var i, y, v, cat, bx, usedV, avail;
  ctx.fillStyle = 'rgba(10,26,44,.55)';
  rr(cardX - colGap / 2 - 6, cardY - 12, colW * 2 + colGap + 12, rowH * 7 + 30, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1.5;
  rr(cardX - colGap / 2 - 6, cardY - 12, colW * 2 + colGap + 12, rowH * 7 + 30, 14); ctx.stroke();

  for (i = 0; i < CATS.length; i++) {
    cat = CATS[i];
    var col = i < 6 ? 0 : 1;
    var row = i < 6 ? i : i - 6;
    bx = cardX + col * (colW + colGap);
    y = cardY + row * rowH;
    usedV = used[cat.k];
    avail = usedV === undefined;
    var preview = rolled && avail ? scoreCat(cat.k, dice) : null;
    ctx.fillStyle = avail ? (preview > 0 ? 'rgba(255,212,92,.10)' : 'rgba(255,255,255,.055)') : 'rgba(0,0,0,.18)';
    rr(bx, y + 1, colW, rowH - 4, 8); ctx.fill();
    if (avail && flashT <= 0) {
      ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1;
      rr(bx, y + 1, colW, rowH - 4, 8); ctx.stroke();
    }
    ctx.font = '700 ' + Math.round(rowH * .38) + 'px "PingFang SC",sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = avail ? '#dfe9ff' : 'rgba(223,233,255,.45)';
    ctx.fillText(cat.n, bx + 12, y + rowH / 2);
    ctx.textAlign = 'right';
    if (!avail) {
      ctx.fillStyle = '#8fd0a0';
      ctx.fillText(String(usedV), bx + colW - 12, y + rowH / 2);
    } else if (preview !== null) {
      ctx.fillStyle = preview > 0 ? '#ffd45c' : 'rgba(255,255,255,.28)';
      ctx.fillText(String(preview), bx + colW - 12, y + rowH / 2);
    } else {
      ctx.fillStyle = 'rgba(255,255,255,.22)';
      ctx.fillText('—', bx + colW - 12, y + rowH / 2);
    }
  }
  var infoY = cardY + rowH * 7 + 4;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '600 12px "PingFang SC",sans-serif';
  var u = upperTotal();
  ctx.fillStyle = u >= 63 ? '#8fd0a0' : 'rgba(255,255,255,.5)';
  ctx.fillText('上区 ' + u + '/63' + (u >= 63 ? ' · 已拿 +35 奖励' : ' · 满 63 加 35'), VW / 2, infoY + 8);
}

function draw() {
  ctx.fillStyle = '#0c2233';
  ctx.fillRect(0, 0, VW, VH);
  var gr = ctx.createLinearGradient(0, 0, 0, VH);
  gr.addColorStop(0, 'rgba(20,70,110,.9)');
  gr.addColorStop(.55, 'rgba(10,40,64,.9)');
  gr.addColorStop(1, 'rgba(6,22,36,.95)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, VW, VH);
  drawEm('🎲', VW * .08, VH * .9, 60);
  drawEm('⚓', VW * .92, VH * .12, 44);

  var i, x, y;
  for (i = 0; i < 5; i++) {
    x = DX + i * (DS + DGAP);
    y = DY;
    var v = animT > 0 && !animKeep[i] ? animFaces[i] : dice[i];
    drawDie(x, y, DS, v, held[i] && animT <= 0 && rolled);
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,255,255,.65)';
  ctx.font = '600 13px "PingFang SC",sans-serif';
  var tip;
  if (state === 'start') tip = '';
  else if (animT > 0) tip = '骰子滚动中…';
  else if (!rolled) tip = '点「掷骰」开始这一轮 · 一共 3 次机会';
  else if (rolls > 0) tip = '点骰子锁定/取消,再掷剩下的 · 还剩 ' + rolls + ' 次';
  else tip = '没得掷了,点下方计分格结算';
  if (tip) ctx.fillText(tip, VW / 2, DY + DS + 28);

  drawCard();

  if (flashT > 0) {
    ctx.globalAlpha = Math.min(1, flashT / .4);
    ctx.fillStyle = '#ffd45c';
    ctx.font = '900 ' + Math.round(clamp(VW * .055, 20, 30)) + 'px "PingFang SC",sans-serif';
    ctx.fillText(flashTx, VW / 2, DY - 16);
    ctx.globalAlpha = 1;
  }
}

cv.addEventListener('pointerdown', function (e) { e.preventDefault() });
cv.addEventListener('pointerup', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  var x = e.clientX, y = e.clientY, i;
  for (i = 0; i < 5; i++) {
    if (x >= DX + i * (DS + DGAP) && x <= DX + i * (DS + DGAP) + DS &&
        y >= DY - 6 && y <= DY + DS + 6) { toggleDie(i); return; }
  }
  for (i = 0; i < CATS.length; i++) {
    var col = i < 6 ? 0 : 1, row = i < 6 ? i : i - 6;
    var bx = cardX + col * (colW + colGap), by = cardY + row * rowH;
    if (x >= bx && x <= bx + colW && y >= by && y <= by + rowH - 2) { pickCat(i); return; }
  }
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  var k = e.key;
  if (k === ' ' || k === 'Spacebar') { e.preventDefault(); doRoll(); }
  if (k >= '1' && k <= '5') toggleDie(+k - 1);
});

function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}

$('startbtn').addEventListener('click', resetGame);
$('againbtn').addEventListener('click', resetGame);
$('rollbtn').addEventListener('click', doRoll);
$('newbtn').addEventListener('click', resetGame);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」摇了 ' + score + ' 分,上区 ' + upperTotal() + ' 点!来试试? ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = { scoreCat: scoreCat, counts: counts, CATS: CATS };

resize();
updMini();
syncHud();
syncRoll();
run();

})();
</script>

<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';
  var name=(document.title||'游戏').split(/[ ··|]/)[0];


  // 结算页:晒战绩 + 换个游戏
  var over=document.getElementById('over');
  if(over){
    var box=document.createElement('div');
    box.style.cssText='display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px';
    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>


<!-- __hub_recent__ -->
<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='yahtzee'});
  r.unshift({k:'yahtzee',n:'快艇骰子 · 十三轮',e:'🎲'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['yahtzee_best','yahtzee_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['yahtzee']||0)){
            B['yahtzee']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
