(function(){
  var raw=location.pathname.replace(/^\/+/, '').split('?')[0].split('#')[0];
  var seg=raw.split('/').filter(Boolean);
  if(!seg.length)return;
  var first=seg[0].toLowerCase();
  var last=seg[seg.length-1].replace(/\.(html?|php|aspx?)$/i, '').toLowerCase();
