<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='curling_best',PLAY='curling_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 冰壶 · 精准一投 ================== */
var NAME = '冰壶 · 精准一投';
var state = 'start';
var stones = [], thrown = 0, endNo = 0, endPts = 0, total = 0, ends = 3, perEnd = 4;
var RTOP = 80, RBOT = 600, RL = 14, RR = 346, HOUSE_X = 180, HOUSE_Y = 200, HR = 80, SR = 16;
var START_X = 180, START_Y = 520;
var dirX = 0, dirY = -1, power = .6, spin = 1;
var aiming = false, sx0 = 0, sy0 = 0, dragged = false;
var endMsg = '', endMsgT = 0, endWait = 0, scored = false, done = false;
var flashT = 0;

function rr(x, y, w, h, r) {
  var k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}

function layout() {
  RTOP = Math.max(76, VH * .1);
  RBOT = VH - 110;
  RL = 14; RR = VW - 14;
  HR = Math.min(VW * .23, (RBOT - RTOP) * .23, 96);
  var hh = Math.max(HR + 8, Math.min(96, (RBOT - RTOP) * .2));
  HOUSE_X = VW / 2;
  HOUSE_Y = RTOP + hh;
  SR = clamp(VW * .037, 13, 23);
  START_X = VW / 2;
  START_Y = RBOT - SR - 12;
}
function onResize() { layout(); }

function resetGame() {
  layout();
  stones = []; thrown = 0; endNo = 0; total = 0; endPts = 0;
  dirX = 0; dirY = -1; power = .6; spin = 1;
  endMsg = ''; endMsgT = 0; endWait = 0; scored = false; done = false; flashT = 0;
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}

function syncHud() {
  $('hround').textContent = Math.min(ends, endNo + 1) + '/' + ends;
  $('hleft').textContent = perEnd - thrown;
  $('hend').textContent = endPts;
  $('hscore').textContent = total;
}

function anyMoving() {
  for (var i = 0; i < stones.length; i++) {
    if (stones[i].vx * stones[i].vx + stones[i].vy * stones[i].vy > 36) return true;
  }
  return false;
}

function launch() {
  if (state !== 'play' || thrown >= perEnd || anyMoving() || endWait > 0) return;
  var n2 = Math.sqrt(dirX * dirX + dirY * dirY) || 1;
  var sp = 160 + power * 360;
  stones.push({ x: START_X, y: START_Y, vx: dirX / n2 * sp, vy: dirY / n2 * sp, r: SR, spin: spin, blue: 0 });
  thrown++;
  tone(240, .09, 'triangle', .04);
  syncHud();
}

function scoreEnd() {
  var pts = 0, i, b, d;
  for (i = 0; i < stones.length; i++) {
    b = stones[i];
    d = Math.sqrt((b.x - HOUSE_X) * (b.x - HOUSE_X) + (b.y - HOUSE_Y) * (b.y - HOUSE_Y));
    if (d < HR * .34) pts += 5;
    else if (d < HR * .67) pts += 3;
    else if (d < HR) pts += 1;
  }
  endPts = pts;
  total += pts;
  endNo++;
  scored = true;
  endMsg = '第 ' + endNo + ' 局 +' + pts + ' 分';
  if (pts >= 16) { endMsg = '🎯 神投!第 ' + endNo + ' 局 +' + pts + ' 分'; tone(880, .18, 'triangle', .07); }
  else tone(pts >= 6 ? 600 : 320, .12, 'triangle', .05);
  endMsgT = 2; endWait = 2;
  syncHud();
}

function nextEnd() {
  stones = [];
  thrown = 0; endPts = 0; scored = false; endMsg = ''; endMsgT = 0;
  HR *= .94;
  syncHud();
  if (endNo === ends - 1) note('最后一局,圆环缩小了');
}

function note(t) { endMsg = t; endMsgT = 1.6; }

function finish() {
  state = 'over';
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(total);
  var rank = total >= 45 ? '🥌 冰上王者' : total >= 32 ? '❄️ 冰壶好手' : total >= 18 ? '🧊 初识旋球' : '🥌 刚上冰面';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '三局总分 <b>' + total + '</b><br>' +
    '单局最高 20 分（4 壶全在红心）<br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '别只追红心:把壶停在圆心前后,能挡住对手也方便下一壶借力';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
}

function physics(dt) {
  var i, j, b;
  var FR = 150, CURL = 13;
  for (i = 0; i < stones.length; i++) {
    b = stones[i];
    var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    if (sp > 0) {
      var dec = Math.min(sp, FR * dt);
      b.vx -= b.vx / sp * dec;
      b.vy -= b.vy / sp * dec;
      if (sp > 20) {
        b.vx += (-b.vy / sp) * CURL * b.spin * dt;
        b.vy += (b.vx / sp) * CURL * b.spin * dt;
      }
      if (b.vx * b.vx + b.vy * b.vy < 30) { b.vx = 0; b.vy = 0; }
    }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.x - b.r < RL) { b.x = RL + b.r; b.vx = Math.abs(b.vx) * .55; }
    if (b.x + b.r > RR) { b.x = RR - b.r; b.vx = -Math.abs(b.vx) * .55; }
    if (b.y - b.r < RTOP) { b.y = RTOP + b.r; b.vy = Math.abs(b.vy) * .35; }
    if (b.y + b.r > RBOT) { b.y = RBOT - b.r; b.vy = -Math.abs(b.vy) * .35; }
  }
  for (var it = 0; it < 3; it++) {
    for (i = 0; i < stones.length; i++) {
      for (j = i + 1; j < stones.length; j++) {
        var a = stones[i], c = stones[j];
        var dx = c.x - a.x, dy = c.y - a.y;
        var d = Math.sqrt(dx * dx + dy * dy) || .01;
        var minD = a.r + c.r;
        if (d >= minD) continue;
        var nx = dx / d, ny = dy / d, ov = minD - d;
        a.x -= nx * ov * .5; a.y -= ny * ov * .5;
        c.x += nx * ov * .5; c.y += ny * ov * .5;
        var rvx = c.vx - a.vx, rvy = c.vy - a.vy;
        var vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          var imp = -vn * .62;
          a.vx -= imp * nx; a.vy -= imp * ny;
          c.vx += imp * nx; c.vy += imp * ny;
          if (imp > 40) tone(300 + Math.min(300, imp), .05, 'square', .03);
        }
      }
    }
  }
  for (i = 0; i < stones.length; i++) {
    b = stones[i];
    if (!isFinite(b.x) || !isFinite(b.y)) { b.x = START_X; b.y = START_Y; b.vx = 0; b.vy = 0; }
  }
}

function update(dt) {
  if (flashT > 0) flashT -= dt;
  if (state !== 'play') return;
  physics(dt);
  if (endMsgT > 0) endMsgT -= dt;
  if (endWait > 0) {
    endWait -= dt;
    if (endWait <= 0) {
      if (endNo >= ends) finish();
      else nextEnd();
    }
    return;
  }
  if (thrown >= perEnd && !anyMoving() && !scored) scoreEnd();
}

function draw() {
  var gr = ctx.createLinearGradient(0, 0, 0, VH);
  gr.addColorStop(0, '#cfe9f7');
  gr.addColorStop(.6, '#a8d6ee');
  gr.addColorStop(1, '#7fbcd9');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, VW, VH);
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1;
  var i;
  for (i = 0; i < 16; i++) {
    var yy = RTOP + i * (RBOT - RTOP) / 16;
    ctx.beginPath(); ctx.moveTo(RL, yy); ctx.lineTo(RR, yy); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(70,130,170,.55)'; ctx.lineWidth = 2;
  ctx.strokeRect(RL, RTOP, RR - RL, RBOT - RTOP);
  ctx.strokeStyle = 'rgba(40,90,120,.5)'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(RL, HOUSE_Y + HR * .55); ctx.lineTo(RR, HOUSE_Y + HR * .55);
  ctx.stroke();

  var rings = [
    { r: HR, c: 'rgba(36,98,190,.75)' },
    { r: HR * .67, c: 'rgba(255,255,255,.9)' },
    { r: HR * .34, c: 'rgba(216,58,58,.8)' }
  ];
  for (i = 0; i < rings.length; i++) {
    ctx.fillStyle = rings[i].c;
    ctx.beginPath(); ctx.arc(HOUSE_X, HOUSE_Y, rings[i].r, 0, 6.2832); ctx.fill();
  }
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(HOUSE_X, HOUSE_Y, HR * .1, 0, 6.2832); ctx.fill();

  var canThrow = thrown < perEnd && !anyMoving() && endWait <= 0 && state === 'play';
  for (i = 0; i < stones.length; i++) {
    var b = stones[i];
    ctx.fillStyle = 'rgba(40,60,80,.2)';
    ctx.beginPath(); ctx.ellipse(b.x + 2, b.y + b.r * .4, b.r * .95, b.r * .5, 0, 0, 6.2832); ctx.fill();
    var sg = ctx.createRadialGradient(b.x - b.r * .35, b.y - b.r * .35, b.r * .15, b.x, b.y, b.r);
    sg.addColorStop(0, '#f4f6f8');
    sg.addColorStop(.55, '#9aa6b2');
    sg.addColorStop(1, '#5c6874');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(40,50,60,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#d83a3a';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * .42, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.arc(b.x - b.r * .12, b.y - b.r * .12, b.r * .16, 0, 6.2832); ctx.fill();
  }

  if (canThrow) {
    var ex = START_X + dirX * 190, ey = START_Y + dirY * 190;
    ctx.setLineDash([8, 8]);
    ctx.strokeStyle = 'rgba(30,80,120,.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(START_X, START_Y); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ex, ey, SR, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    ctx.beginPath(); ctx.arc(ex, ey, SR * .8, 0, 6.2832); ctx.fill();

    ctx.fillStyle = '#203a52';
    ctx.beginPath(); ctx.arc(START_X, START_Y, SR, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '700 11px "PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('你', START_X, START_Y + 1);

    var bw = Math.min(VW * .5, 210), bx = (VW - bw) / 2, by = START_Y + SR + 18;
    ctx.fillStyle = 'rgba(0,40,60,.18)';
    rr(bx, by, bw, 9, 5); ctx.fill();
    ctx.fillStyle = power > .85 ? '#ff7b5c' : power > .55 ? '#ffb648' : '#4fb0e0';
    rr(bx, by, Math.max(5, bw * power), 9, 5); ctx.fill();
    ctx.fillStyle = '#1c3a52';
    ctx.font = '600 12px "PingFang SC",sans-serif';
    ctx.fillText('力度 ' + Math.round(power * 100) + '% · 旋向 ' + (spin > 0 ? '↻ 右' : '↺ 左'), VW / 2, by + 24);
  }

  if (aiming) {
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(START_X, START_Y); ctx.lineTo(ax0, ay0); ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (endMsgT > 0) {
    ctx.globalAlpha = Math.min(1, endMsgT / .4);
    ctx.fillStyle = 'rgba(20,50,70,.8)';
    rr(VW / 2 - 150, VH * .55 - 30, 300, 60, 16); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '900 22px "PingFang SC",sans-serif';
    ctx.fillText(endMsg, VW / 2, VH * .55);
    ctx.globalAlpha = 1;
  } else if (state === 'play') {
    ctx.fillStyle = 'rgba(20,50,70,.62)';
    ctx.font = '600 12.5px "PingFang SC",sans-serif';
    var tip = anyMoving() ? '冰壶滑行中…' : thrown >= perEnd ? '本局结束,结算中…' : '按住往上拖 · 松手投壶';
    ctx.fillText(tip, VW / 2, RTOP - 16);
  }
}
var ax0 = 0, ay0 = 0;

cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play' || thrown >= perEnd || anyMoving() || endWait > 0) return;
  aiming = true; dragged = false;
  sx0 = e.clientX; sy0 = e.clientY;
  ax0 = sx0; ay0 = sy0;
});
cv.addEventListener('pointermove', function (e) {
  if (!aiming) return;
  ax0 = e.clientX; ay0 = e.clientY;
  var dx = ax0 - START_X, dy = ay0 - START_Y;
  var len = Math.sqrt(dx * dx + dy * dy);
  if (len > 18) {
    dragged = true;
    dirX = dx / len; dirY = dy / len;
    power = clamp(len / (RBOT - RTOP - 60), .12, 1);
  }
});
cv.addEventListener('pointerup', function (e) {
  e.preventDefault();
  if (!aiming) return;
  aiming = false;
  if (dragged) launch();
  dragged = false;
});

window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a') {
    e.preventDefault();
    var a = Math.atan2(dirX, -dirY) - .07;
    dirX = Math.sin(a); dirY = -Math.cos(a);
  }
  if (k === 'ArrowRight' || k === 'd') {
    e.preventDefault();
    a = Math.atan2(dirX, -dirY) + .07;
    dirX = Math.sin(a); dirY = -Math.cos(a);
  }
  if (k === 'ArrowUp' || k === 'w') { e.preventDefault(); power = clamp(power + .06, .12, 1); }
  if (k === 'ArrowDown' || k === 's') { e.preventDefault(); power = clamp(power - .06, .12, 1); }
  if (k === ' ' || k === 'Enter') { e.preventDefault(); launch(); }
});

function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}

$('startbtn').addEventListener('click', resetGame);
$('againbtn').addEventListener('click', resetGame);
$('spinbtn').addEventListener('click', function () {
  spin = -spin;
  this.textContent = spin > 0 ? '↻ 右旋' : '↺ 左旋';
  tone(420, .05, 'triangle', .03);
});
$('newbtn').addEventListener('click', resetGame);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」三局拿了 ' + total + ' 分! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  throwAt: function (x, y, pw) {
    var dx = x - START_X, dy = y - START_Y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    dirX = dx / len; dirY = dy / len;
    power = pw === undefined ? .7 : pw;
    launch();
  },
  step: function (n) { for (var i = 0; i < n; i++) physics(1 / 60); },
  stones: function () { return stones; },
  house: function () { return { x: HOUSE_X, y: HOUSE_Y, r: HR }; },
  scoreEnd: scoreEnd,
  end: function () { return endNo; },
  total: function () { return total; },
  state: function () { return state; },
  thrown: function () { return thrown; }
};

resize();
updMini();
syncHud();
run();

})();
</script>

<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';

        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='curling'});
  r.unshift({k:'curling',n:'冰壶 · 精准一投',e:'🥌'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['curling_best','curling_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['curling']||0)){
            B['curling']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
