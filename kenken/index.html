<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='kenken_best',PLAY='kenken_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 算独 · 笼中算术 ================== */
var NAME = '算独 · 笼中算术';
var state = 'start';
var N = 4, grid = [], cages = [], sel = -1;
var level = 0, LEVELS = 6, score = 0, msg = '', msgT = 0, time = 0;
var CS = 0, BX = 0, BY = 0;

function layout() {
  CS = Math.floor(Math.min((VW - 24) / N, (VH - 230) / N));
  BX = Math.round((VW - CS * N) / 2);
  BY = Math.round((VH - CS * N) / 2) - 4;
}
function onResize() { layout(); }
function shuffleArr(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function genLevel() {
  /* 拉丁方:循环方阵 + 行列重排 + 数字标签 */
  var base = [], rows = [], cols = [], lab = [];
  for (var i = 0; i < N; i++) { rows.push(i); cols.push(i); lab.push(i); }
  shuffleArr(rows); shuffleArr(cols); shuffleArr(lab);
  var sol = [];
  for (var r = 0; r < N; r++) {
    sol.push([]);
    for (var c = 0; c < N; c++) sol[r].push(lab[(rows[r] + cols[c]) % N] + 1);
  }
  /* 笼划分:随机生长 1-3 格 */
  cages = [];
  var cageOf = [];
  for (var k = 0; k < N * N; k++) cageOf.push(-1);
  var order = [];
  for (var o = 0; o < N * N; o++) order.push(o);
  shuffleArr(order);
  for (var oi = 0; oi < order.length; oi++) {
    var cell = order[oi];
    if (cageOf[cell] >= 0) continue;
    var id = cages.length;
    var members = [cell];
    cageOf[cell] = id;
    var want = frnd() < .12 ? 1 : (frnd() < .5 ? 2 : 3);
    var guard = 0;
    while (members.length < want && guard++ < 12) {
      var cc = members[rnd(members.length)];
      var r2 = cc / N | 0, c2 = cc % N;
      var dirs = shuffleArr([[-1, 0], [1, 0], [0, -1], [0, 1]]);
      var grown = false;
      for (var d = 0; d < 4 && !grown; d++) {
        var rr = r2 + dirs[d][0], rc = c2 + dirs[d][1];
        if (rr < 0 || rr >= N || rc < 0 || rc >= N) continue;
        var nk = rr * N + rc;
        if (cageOf[nk] < 0) { cageOf[nk] = id; members.push(nk); grown = true; }
      }
    }
    cages.push({ cells: members.slice(), clue: '', op: '' });
  }
  /* 笼线索 */
  for (var ci = 0; ci < cages.length; ci++) {
    var cage = cages[ci];
    var vals = cage.cells.map(function (k2) { return sol[k2 / N | 0][k2 % N]; });
    if (vals.length === 1) { cage.clue = String(vals[0]); cage.op = ''; }
    else if (vals.length === 2) {
      var a = vals[0], b = vals[1], hi = Math.max(a, b), lo = Math.min(a, b);
      var ops = ['+', '−', '×'];
      if (hi % lo === 0 && hi / lo > 1) ops.push('÷');
      var op = ops[rnd(ops.length)];
      cage.op = op;
      cage.clue = (op === '+' ? a + b : op === '−' ? hi - lo : op === '×' ? a * b : hi / lo) + op;
    } else {
      var sum = 0, prd = 1;
      for (var v = 0; v < vals.length; v++) { sum += vals[v]; prd *= vals[v]; }
      if (frnd() < .6) { cage.op = '+'; cage.clue = sum + '+'; }
      else { cage.op = '×'; cage.clue = prd + '×'; }
    }
  }
  grid = [];
  for (var g = 0; g < N * N; g++) grid.push(0);
  sel = -1;
}
function resetMatch() {
  level = 0; score = 0; msg = ''; msgT = 1.2; time = 0;
  nextLevel();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}
function nextLevel() {
  level++;
  if (level > LEVELS) { matchOver(); return; }
  N = level <= 2 ? 4 : 5;
  layout();
  genLevel();
  msg = '第 ' + level + ' 关:' + N + '×' + N + ',行列不重复、笼内算式成立';
  msgT = 1.8;
  syncHud();
}
function syncHud() {
  $('hlv').textContent = Math.min(level, LEVELS) + '/' + LEVELS;
  $('hscore').textContent = score;
}
function inputNum(n) {
  if (state !== 'play' || sel < 0) { if (sel < 0) { msg = '先点一个格子'; msgT = .8; } return; }
  grid[sel] = grid[sel] === n ? 0 : n;
  tone(460 + n * 40, .05, 'sine', .03, 560);
  checkDone();
  syncHud();
}
function clearCell() {
  if (state !== 'play' || sel < 0) return;
  grid[sel] = 0;
}
function cageOk(cage) {
  var vals = [];
  for (var i = 0; i < cage.cells.length; i++) {
    var g = grid[cage.cells[i]];
    if (!g) return false;
    vals.push(g);
  }
  if (cage.op === '') return vals[0] === +cage.clue;
  if (cage.op === '+') { var s = 0; for (var a = 0; a < vals.length; a++) s += vals[a]; return s === +cage.clue; }
  if (cage.op === '×') { var p = 1; for (var b = 0; b < vals.length; b++) p *= vals[b]; return p === +cage.clue; }
  var hi = Math.max(vals[0], vals[1]), lo = Math.min(vals[0], vals[1]);
  return hi - lo === +cage.clue || (cage.clue.indexOf('÷') > 0 && hi / lo === +cage.clue.replace('÷', ''));
}
function checkDone() {
  for (var i = 0; i < grid.length; i++) if (!grid[i]) return;
  for (var r = 0; r < N; r++) {
    var seen = {};
    for (var c = 0; c < N; c++) { var v = grid[r * N + c]; if (seen[v]) return; seen[v] = 1; }
  }
  for (var c2 = 0; c2 < N; c2++) {
    var seen2 = {};
    for (var r2 = 0; r2 < N; r2++) { var v2 = grid[r2 * N + c2]; if (seen2[v2]) return; seen2[v2] = 1; }
  }
  for (var ci = 0; ci < cages.length; ci++) if (!cageOk(cages[ci])) return;
  score += 80 + N * 30;
  msg = '✓ 算独破解!'; msgT = 1.2;
  tone(700, .12, 'triangle', .05, 950);
  setTimeout(function () { if (state === 'play') nextLevel(); }, 900);
  syncHud();
}
function matchOver() {
  state = 'over';
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '<b>算独全通!</b><br>6 关全破<br>本局得分 <b>' + score + '</b><br>历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '先盯两格笼和单格笼,大笼用排除法';
  $('over').classList.remove('hide');
  tone(640, .14, 'triangle', .06, 900);
}
function update(dt) {
  time += dt;
  if (msgT > 0) msgT -= dt;
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#12181a'); bg.addColorStop(1, '#0a0e10');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
    var k = r * N + c, x = BX + c * CS, y = BY + r * CS;
    ctx.fillStyle = k === sel ? 'rgba(120,200,255,.2)' : 'rgba(255,255,255,.04)';
    ctx.fillRect(x, y, CS, CS);
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1;
    ctx.strokeRect(x, y, CS, CS);
    var v = grid[k];
    if (v) {
      ctx.fillStyle = '#f0f4ff';
      ctx.font = '900 ' + Math.round(CS * .5) + 'px "PingFang SC",sans-serif';
      ctx.fillText(v, x + CS / 2, y + CS / 2);
    }
  }
  /* 笼粗边 + 线索 */
  ctx.strokeStyle = 'rgba(160,220,200,.85)'; ctx.lineWidth = 2.5;
  for (var ci = 0; ci < cages.length; ci++) {
    var cage = cages[ci];
    for (var m = 0; m < cage.cells.length; m++) {
      var k2 = cage.cells[m], r2 = k2 / N | 0, c2 = k2 % N;
      var x2 = BX + c2 * CS, y2 = BY + r2 * CS;
      var nb = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      for (var d = 0; d < 4; d++) {
        var nk = (r2 + nb[d][0]) * N + (c2 + nb[d][1]);
        var inSame = false;
        for (var mm = 0; mm < cage.cells.length; mm++) if (cage.cells[mm] === nk) inSame = true;
        if (!inSame || cage.cells.length === 1) {
          ctx.beginPath();
          if (d === 0) { ctx.moveTo(x2, y2); ctx.lineTo(x2, y2 + CS); }
          else if (d === 1) { ctx.moveTo(x2 + CS, y2); ctx.lineTo(x2 + CS, y2 + CS); }
          else if (d === 2) { ctx.moveTo(x2, y2); ctx.lineTo(x2 + CS, y2); }
          else { ctx.moveTo(x2, y2 + CS); ctx.lineTo(x2 + CS, y2 + CS); }
          ctx.stroke();
        }
      }
      if (m === 0) {
        ctx.fillStyle = '#9adcc8';
        ctx.font = '600 ' + Math.round(CS * .26) + 'px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(cage.clue, x2 + 4, y2 + 11);
        ctx.textAlign = 'center';
      }
    }
  }
  ctx.fillStyle = 'rgba(255,255,255,.42)';
  ctx.font = '600 11px "PingFang SC",sans-serif';
  ctx.fillText('点格选中,下方数字填入 · 行列不重复 · 笼内算式成立', VW / 2, BY + N * CS + 22);
  if (msgT > 0) {
    ctx.fillStyle = 'rgba(255,235,180,.95)';
    ctx.font = '600 13px "PingFang SC",sans-serif';
    ctx.fillText(msg, VW / 2, BY + N * CS + 44);
  }
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  var c = Math.floor((e.clientX - BX) / CS), r = Math.floor((e.clientY - BY) / CS);
  if (r >= 0 && r < N && c >= 0 && c < N) {
    sel = r * N + c;
    tone(380, .04, 'sine', .025, 440);
  }
});
cv.addEventListener('pointercancel', function () { });
window.addEventListener('keydown', function (e) {
  var n = +e.key;
  if (n >= 1 && n <= 5) inputNum(n);
  if (e.key === 'Backspace' || e.key === '0') clearCell();
});
function bindNum(id, n) { $(id).addEventListener('click', function () { inputNum(n); }); }
bindNum('n1', 1); bindNum('n2', 2); bindNum('n3', 3); bindNum('n4', 4); bindNum('n5', 5);
$('clrbtn').addEventListener('click', clearCell);
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', resetMatch);
$('againbtn').addEventListener('click', resetMatch);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」连破 6 关算独,得了 ' + score + ' 分! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/'; });
window.__T = {
  state: function () { return state; },
  start: resetMatch,
  step: function (k) { for (var i = 0; i < (k || 1); i++) update(1 / 60); },
  score: function () { return score; },
  level: function () { return level; },
  inputNum: inputNum
};
resize();
layout();
updMini();
run();

})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='kenken'});
  r.unshift({k:'kenken',n:'算独 · 笼中算术',e:'🧮'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['kenken_best','kenken_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['kenken']||0)){
            B['kenken']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
