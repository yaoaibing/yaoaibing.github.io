<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='blackbox_best',PLAY='blackbox_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 黑箱探秘 · 射线定 atoms ================== */
var NAME = '黑箱探秘 · 射线定影';
var state = 'start';
var BOXN = 8, atoms = [], marks = {}, rays = [], results = {};
var boxNo = 1, BOXES = 3, raysUsed = 0, score = 0, found = 0;
var msg = '', msgT = 0, time = 0;
var CS = 0, BX = 0, BY = 0, M = 26;

function layout() {
  CS = Math.floor(Math.min((VW - M * 2 - 16) / BOXN, (VH - 220) / BOXN));
  BX = Math.round((VW - CS * BOXN) / 2);
  BY = Math.round((VH - CS * BOXN) / 2) + 6;
}
function onResize() { layout(); }
function portPos(p) {
  /* 0..31:上 0-7,右 8-15,下 16-23,左 24-31 */
  if (p < 8) return { x: BX + (p + .5) * CS, y: BY - M * .7, side: 0 };
  if (p < 16) return { x: BX + BOXN * CS + M * .7, y: BY + (p - 8 + .5) * CS, side: 1 };
  if (p < 24) return { x: BX + (p - 16 + .5) * CS, y: BY + BOXN * CS + M * .7, side: 2 };
  return { x: BX - M * .7, y: BY + (p - 24 + .5) * CS, side: 3 };
}
function portDir(p) { return [{ dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: -1, dc: 0 }, { dr: 0, dc: 1 }][portPos(p).side]; }
function portStart(p) {
  var pos = portPos(p), d = portDir(p);
  return { r: pos.side === 0 ? -1 : pos.side === 2 ? BOXN : Math.floor((pos.y - BY) / CS), c: pos.side === 3 ? -1 : pos.side === 1 ? BOXN : Math.floor((pos.x - BX) / CS), dr: d.dr, dc: d.dc };
}
function hasAtom(r, c) {
  if (r < 0 || r >= BOXN || c < 0 || c >= BOXN) return false;
  for (var i = 0; i < atoms.length; i++) if (atoms[i][0] === r && atoms[i][1] === c) return true;
  return false;
}
function fireRay(p) {
  if (state !== 'play' || results[p] !== undefined) return;
  raysUsed++;
  var cur = portStart(p);
  var steps = 0;
  while (steps++ < 200) {
    var nr = cur.r + cur.dr, nc = cur.c + cur.dc;
    if (nr < 0 || nr >= BOXN || nc < 0 || nc >= BOXN) {
      var exitP = posToPort(nr, nc, cur);
      results[p] = exitP === p ? 'R' : exitP;
      break;
    }
    if (hasAtom(nr, nc)) { results[p] = 'H'; break; }
    var p1r = nr + cur.dc, p1c = nc + cur.dr;
    var p2r = nr - cur.dc, p2c = nc - cur.dr;
    var a1 = hasAtom(p1r, p1c), a2 = hasAtom(p2r, p2c);
    if (a1 && a2) { results[p] = 'R'; break; }
    if (a1) { cur = { r: nr, c: nc, dr: -cur.dc, dc: -cur.dr }; continue; }
    if (a2) { cur = { r: nr, c: nc, dr: cur.dc, dc: cur.dr }; continue; }
    cur = { r: nr, c: nc, dr: cur.dr, dc: cur.dc };
  }
  rays.push(p);
  tone(600, .05, 'sine', .03, 720);
  syncHud();
}
function posToPort(r, c, cur) {
  if (r < 0) return c;
  if (r >= BOXN) return 16 + c;
  if (c < 0) return 24 + r;
  if (c >= BOXN) return 8 + r;
  return -1;
}
function newBox() {
  atoms = [];
  while (atoms.length < 4) {
    var r = rnd(BOXN), c = rnd(BOXN), ok = true;
    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
      for (var i = 0; i < atoms.length; i++) {
        if (Math.abs(atoms[i][0] - (r + dr)) <= 0 && Math.abs(atoms[i][1] - (c + dc)) <= 0) ok = false;
      }
    }
    for (var j = 0; j < atoms.length; j++) {
      if (Math.abs(atoms[j][0] - r) <= 1 && Math.abs(atoms[j][1] - c) <= 1) ok = false;
    }
    if (ok) atoms.push([r, c]);
  }
  marks = {}; results = {}; rays = [];
  syncHud();
}
function resetMatch() {
  boxNo = 1; raysUsed = 0; score = 0; found = 0; msg = ''; msgT = 1.4;
  msg = '点边缘小孔发射射线,推出原子位置!';
  newBox();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  layout();
  syncHud();
}
function syncHud() {
  $('hbox').textContent = boxNo + '/' + BOXES;
  $('hrays').textContent = raysUsed;
  $('hscore').textContent = score;
}
function verify() {
  if (state !== 'play') return;
  var n = 0;
  for (var k in marks) if (marks[k]) n++;
  if (n !== 4) { msg = '请先标出 4 个原子(当前 ' + n + ')'; msgT = 1.2; return; }
  var allOk = true;
  for (var i = 0; i < atoms.length; i++) {
    var key = atoms[i][0] * BOXN + atoms[i][1];
    if (!marks[key]) allOk = false;
  }
  for (var mk in marks) {
    if (marks[mk]) {
      var hit = false;
      for (var j = 0; j < atoms.length; j++) if (atoms[j][0] * BOXN + atoms[j][1] === +mk) hit = true;
      if (!hit) allOk = false;
    }
  }
  if (allOk) {
    found++;
    var gain = Math.max(100, 400 - raysUsed * 10);
    score += gain;
    msg = '✓ 全中!+' + gain; msgT = 1.4;
    tone(720, .14, 'triangle', .05, 980);
    boxNo++;
    raysUsed = 0;
    if (boxNo > BOXES) { matchOver(); return; }
    setTimeout(function () { if (state === 'play') newBox(); }, 1200);
  } else {
    score = Math.max(0, score - 60);
    msg = '✗ 有标错的,继续推理'; msgT = 1.3;
    tone(230, .1, 'sawtooth', .05, 170);
  }
  syncHud();
}
function skipBox() {
  if (state !== 'play') return;
  msg = '答案已公布,下一箱'; msgT = 1.3;
  boxNo++;
  raysUsed = 0;
  if (boxNo > BOXES) { matchOver(); return; }
  setTimeout(function () { if (state === 'play') newBox(); }, 1100);
  syncHud();
}
function matchOver() {
  state = 'over';
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  $('onewrec').style.display = rec ? 'block' : 'none';
  var rank = found === 3 ? '射线侦探!' : found === 2 ? '推理在线' : '黑箱真黑';
  $('ostats').innerHTML = '<b>' + rank + '</b><br>破解 <b>' + found + '</b>/3 箱<br>本局得分 <b>' + score + '</b><br>历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '打直线的两孔连一条线,线上没原子就排除一片';
  $('over').classList.remove('hide');
  tone(640, .14, 'triangle', .06, 900);
}
function update(dt) {
  time += dt;
  if (msgT > 0) msgT -= dt;
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#0c0c1a'); bg.addColorStop(1, '#06060e');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  /* 箱体 */
  ctx.fillStyle = 'rgba(70,80,120,.25)';
  ctx.fillRect(BX - 2, BY - 2, CS * BOXN + 4, CS * BOXN + 4);
  /* 格子 + 标记 */
  for (var r = 0; r < BOXN; r++) for (var c = 0; c < BOXN; c++) {
    var x = BX + c * CS, y = BY + r * CS;
    ctx.strokeStyle = 'rgba(120,140,190,.18)'; ctx.lineWidth = 1;
    ctx.strokeRect(x, y, CS, CS);
    var k = r * BOXN + c;
    if (marks[k]) {
      ctx.strokeStyle = '#8cd0f8'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(x + CS / 2, y + CS / 2, CS * .3, 0, 6.29); ctx.stroke();
    }
  }
  /* 已破解显示原子 */
  if (state === 'over') {
    for (var i = 0; i < atoms.length; i++) drawEm('⚛️', BX + (atoms[i][1] + .5) * CS, BY + (atoms[i][0] + .5) * CS, CS * .5);
  }
  /* 端口 */
  for (var p = 0; p < 32; p++) {
    var pos = portPos(p);
    var res = results[p];
    ctx.fillStyle = res !== undefined ? 'rgba(255,212,92,.9)' : 'rgba(150,170,220,.25)';
    ctx.beginPath(); ctx.arc(pos.x, pos.y, 7, 0, 6.29); ctx.fill();
    if (res !== undefined) {
      ctx.fillStyle = '#1a1408';
      ctx.font = '900 9px monospace';
      var lbl = res === 'H' ? '✖' : res === 'R' ? '↺' : String(res);
      ctx.fillText(lbl, pos.x, pos.y);
    }
  }
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.font = '600 11px "PingFang SC",sans-serif';
  ctx.fillText('点小孔发射 · 点格标原子(标 4 个)· ✖命中 ↺反射 数字=进出口', VW / 2, BY + BOXN * CS + M + 6);
  if (msgT > 0) {
    ctx.fillStyle = 'rgba(255,235,180,.95)';
    ctx.font = '600 12.5px "PingFang SC",sans-serif';
    ctx.fillText(msg, VW / 2, BY + BOXN * CS + M + 26);
  }
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  /* 先测端口 */
  for (var p = 0; p < 32; p++) {
    var pos = portPos(p);
    if (Math.hypot(e.clientX - pos.x, e.clientY - pos.y) < 13) { fireRay(p); return; }
  }
  var c = Math.floor((e.clientX - BX) / CS), r = Math.floor((e.clientY - BY) / CS);
  if (r >= 0 && r < BOXN && c >= 0 && c < BOXN) {
    var k = r * BOXN + c;
    marks[k] = !marks[k];
    tone(440, .04, 'sine', .025, 520);
  }
});
cv.addEventListener('pointercancel', function () { });
$('verifybtn').addEventListener('click', verify);
$('skipbtn').addEventListener('click', skipBox);
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', resetMatch);
$('againbtn').addEventListener('click', resetMatch);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」破解了 ' + found + '/3 个黑箱! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/'; });
window.__T = {
  state: function () { return state; },
  start: resetMatch,
  step: function (k) { for (var i = 0; i < (k || 1); i++) update(1 / 60); },
  score: function () { return score; },
  found: function () { return found; },
  atoms: function () { return atoms.map(function (a) { return a[0] * BOXN + a[1]; }); },
  verify: verify
};
resize();
layout();
updMini();
run();

})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='blackbox'});
  r.unshift({k:'blackbox',n:'黑箱探秘 · 射线定影',e:'⚛️'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['blackbox_best','blackbox_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['blackbox']||0)){
            B['blackbox']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
