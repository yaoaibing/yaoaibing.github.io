<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='rewind_best',PLAY='rewind_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 影子搭档 · 同步走位 ================== */
var NAME = '影子搭档 · 同步走位';
/* '#'墙 '.'地板 'o'压力板 'P'起点 —— 每关最少通关步数经求解器验证:6/9/11/14/17 */
var LEVELS = [
  ['..P..', '.....', '.#...', '..oo.'],
  ['...o.', '#...o', 'o..P.', '..#..'],
  ['o.....', '###...', '..o...', '......', '.P.o..'],
  ['..oo#.', '.#....', 'o.....', '..o#..', '#...P.'],
  ['#......', '...P...', '.o.....', '..##...', '..oo#o.']
];
var state = 'start';
var lv = 0, rows = [], W = 0, H = 0, S = { x: 0, y: 0 }, me = { x: 0, y: 0 };
var hist = [], clones = [], plates = [], steps = 0, clonesUsed = 0;
var total = 0, tsum = 0, msg = '', msgT = 0, cell = 40, bx = 0, by = 0;
var MAXCLONE = 4, waitTimer = 0, winning = false;

function layout() {
  if (!W || !H) return;
  var availW = VW - 44, availH = VH - 250;
  cell = Math.max(28, Math.min(availW / W, availH / H));
  bx = (VW - cell * W) / 2;
  by = Math.max(86, (VH - cell * H) / 2 - 34);
}
function onResize() { layout(); }
function loadLevel(n) {
  lv = n;
  rows = LEVELS[n].slice();
  H = rows.length; W = rows[0].length;
  plates = []; hist = []; clones = []; steps = 0; clonesUsed = 0;
  winning = false;
  for (var y = 0; y < H; y++) {
    for (var x = 0; x < W; x++) {
      var c = rows[y].charAt(x);
      if (c === 'P') { S = { x: x, y: y }; me = { x: x, y: y } }
      if (c === 'o') plates.push({ x: x, y: y });
    }
  }
  msg = ''; msgT = 0;
  layout();
  syncHud();
}
function wall(x, y) {
  if (x < 0 || y < 0 || x >= W || y >= H) return true;
  return rows[y].charAt(x) === '#';
}
function resetGame() {
  total = 0; tsum = 0;
  waitTimer = 0;
  loadLevel(0);
}
function startGame() {
  resetGame();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}
function endGame() {
  state = 'over';
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(total);
  var rank = tsum < 60 ? '机关大师' : tsum < 110 ? '走位熟练' : tsum < 180 ? '慢慢来' : '绕了地球';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '通关 <b>' + LEVELS.length + ' / ' + LEVELS.length + ' 关</b><br>' +
    '本局得分 <b>' + total + '</b><br>共走 ' + tsum + ' 步<br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '分身会重放你按下的每一步,含撞墙的空白步';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  tone(720, .3, 'sine', .06, 1080);
}
function syncHud() {
  $('hlv').textContent = (lv + 1) + '/' + LEVELS.length;
  $('hstep').textContent = steps;
  $('hclone').textContent = clones.length + '/' + MAXCLONE;
}
function stepDir(d) {
  if (state !== 'play') return;
  var dx = d === 'l' ? -1 : (d === 'r' ? 1 : 0);
  var dy = d === 'u' ? -1 : (d === 'd' ? 1 : 0);
  var rec = d;
  if (dx || dy) {
    if (wall(me.x + dx, me.y + dy)) rec = 'n';
    else { me.x += dx; me.y += dy }
  }
  hist.push(rec);
  steps++;
  tsum++;
  advanceClones();
  tone(420 + (me.x + me.y) * 12, .05, 'square', .03);
  checkWin();
  syncHud();
}
function advanceClones() {
  for (var i = 0; i < clones.length; i++) {
    var c = clones[i];
    if (c.ptr >= c.moves.length) continue;
    var d = c.moves[c.ptr++];
    var nx = d === 'l' ? -1 : (d === 'r' ? 1 : 0);
    var ny = d === 'u' ? -1 : (d === 'd' ? 1 : 0);
    if (!nx && !ny) continue;
    if (!wall(c.x + nx, c.y + ny)) { c.x += nx; c.y += ny }
  }
}
function makeClone() {
  if (state !== 'play') return;
  if (clones.length >= MAXCLONE) { msg = '分身最多 ' + MAXCLONE + ' 个'; msgT = 1.4; return }
  if (!hist.length) { msg = '先走几步再分身'; msgT = 1.4; return }
  clones.push({ moves: hist.slice(), ptr: 0, x: S.x, y: S.y });
  clonesUsed++;
  msg = '影子开始重放这 ' + hist.length + ' 步'; msgT = 1.6;
  tone(700, .14, 'triangle', .05, 1050);
  checkWin();
  syncHud();
}
function covered(x, y) {
  if (me.x === x && me.y === y) return true;
  for (var i = 0; i < clones.length; i++) if (clones[i].x === x && clones[i].y === y) return true;
  return false;
}
function allCovered() {
  for (var i = 0; i < plates.length; i++) if (!covered(plates[i].x, plates[i].y)) return false;
  return !!plates.length;
}
function checkWin() {
  if (winning) return;
  if (!allCovered()) return;
  winning = true;
  var gain = Math.max(60, 300 - steps * 3 - clonesUsed * 20);
  total += gain;
  if (lv + 1 >= LEVELS.length) { endGame(); return }
  msg = '全踩住了!+' + gain; msgT = 1.8;
  tone(990, .2, 'sine', .06, 1320);
  var nxt = lv + 1;
  setTimeout(function () { if (state === 'play') loadLevel(nxt) }, 900);
}
function update(dt) {
  if (msgT > 0) msgT -= dt;
}
function cx(x) { return bx + x * cell + cell / 2 }
function cy(y) { return by + y * cell + cell / 2 }
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#131024'); bg.addColorStop(1, '#0a0814');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  /* 地板与墙 */
  for (var y = 0; y < H; y++) {
    for (var x = 0; x < W; x++) {
      var c = rows[y].charAt(x);
      if (c === '#') {
        ctx.fillStyle = '#3a3050';
        ctx.fillRect(bx + x * cell + 1, by + y * cell + 1, cell - 2, cell - 2);
        ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1;
        ctx.strokeRect(bx + x * cell + 4, by + y * cell + 4, cell - 8, cell - 8);
      } else {
        ctx.fillStyle = (x + y) % 2 ? 'rgba(255,255,255,.05)' : 'rgba(255,255,255,.03)';
        ctx.fillRect(bx + x * cell + 1, by + y * cell + 1, cell - 2, cell - 2);
      }
    }
  }
  /* 压力板 */
  for (var i = 0; i < plates.length; i++) {
    var p = plates[i], on = covered(p.x, p.y);
    ctx.fillStyle = on ? 'rgba(120,240,170,.9)' : 'rgba(240,200,90,.45)';
    ctx.beginPath();
    ctx.arc(cx(p.x), cy(p.y), cell * .26, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = on ? 'rgba(180,255,210,.9)' : 'rgba(255,230,150,.6)';
    ctx.lineWidth = 2; ctx.stroke();
  }
  /* 影子路径 */
  for (i = 0; i < clones.length; i++) {
    var cl = clones[i];
    ctx.strokeStyle = 'rgba(150,120,255,.35)'; ctx.lineWidth = 2;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    var px2 = S.x, py2 = S.y;
    ctx.moveTo(cx(px2), cy(py2));
    for (var t = 0; t < cl.moves.length; t++) {
      var d = cl.moves[t];
      if (d === 'n') continue;
      px2 += d === 'l' ? -1 : (d === 'r' ? 1 : 0);
      py2 += d === 'u' ? -1 : (d === 'd' ? 1 : 0);
      ctx.lineTo(cx(px2), cy(py2));
    }
    ctx.stroke();
    ctx.setLineDash([]);
    drawEm('👻', cx(cl.x), cy(cl.y), cell * .74);
    ctx.font = '700 10px "PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(200,180,255,.8)';
    ctx.fillText((cl.ptr >= cl.moves.length ? '停' : cl.ptr + '/' + cl.moves.length), cx(cl.x), cy(cl.y) + cell * .42);
  }
  /* 起点标记 */
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx(S.x), cy(S.y), cell * .13, 0, Math.PI * 2); ctx.stroke();
  /* 主角 */
  drawEm('🧗', cx(me.x), cy(me.y), cell * .8);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = msgT > 0 ? 'rgba(255,220,120,.95)' : 'rgba(215,205,255,.5)';
  ctx.fillText(msg || '滑动屏幕走路,按「分身」让影子重放', VW / 2, VH - 44);
}
var sw = null;
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  sw = { x: e.clientX, y: e.clientY };
});
cv.addEventListener('pointermove', function (e) {
  if (!sw || state !== 'play') return;
  var dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (Math.abs(dx) > 26 || Math.abs(dy) > 26) {
    stepDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u'));
    sw = { x: e.clientX, y: e.clientY };
  }
});
window.addEventListener('pointerup', function () { sw = null });
window.addEventListener('pointercancel', function () { sw = null });
function holdWait(on) {
  if (!on) { if (waitTimer) { clearTimeout(waitTimer); waitTimer = 0 } return }
  stepDir('w');
  waitTimer = setTimeout(function () { holdWait(true) }, 150);
}
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  var map = { ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'u', ArrowDown: 'd' };
  if (map[e.key]) { e.preventDefault(); stepDir(map[e.key]); }
  if (e.key === ' ') { e.preventDefault(); stepDir('w'); }
  if (e.key === 'c' || e.key === 'C') { e.preventDefault(); makeClone(); }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startGame(); }
});
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('clonebtn').addEventListener('click', makeClone);
$('waitbtn').addEventListener('pointerdown', function (e) { e.preventDefault(); holdWait(true) });
$('waitbtn').addEventListener('pointerup', function () { holdWait(false) });
$('waitbtn').addEventListener('pointercancel', function () { holdWait(false) });
$('waitbtn').addEventListener('click', function () { holdWait(false) });
$('newbtn').addEventListener('click', function () {
  if (state === 'play') { loadLevel(lv); msg = '本关重来'; msgT = 1.2 }
});
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」用 ' + clonesUsed + ' 个影子踩住全部机关,拿了 ' + total + ' 分! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  state: function () { return state; },
  lv: function () { return lv; },
  size: function () { return W + 'x' + H },
  plates: function () { return plates.length; },
  clones: function () { return clones.length; },
  hist: function () { return hist.slice(); },
  steps: function () { return steps; },
  total: function () { return total; },
  me: function () { return { x: me.x, y: me.y } },
  cloneAt: function (i) { return clones[i] ? { x: clones[i].x, y: clones[i].y, ptr: clones[i].ptr, len: clones[i].moves.length } : null },
  covered: covered, solved: allCovered,
  go: stepDir, clone: makeClone,
  goAll: function (s) { for (var i = 0; i < s.length; i++) stepDir(s.charAt(i)) },
  setLevel: function (n) { loadLevel(Math.max(0, Math.min(LEVELS.length - 1, n))) },
  wall: wall,
  step: function (n) { for (var i = 0; i < n; i++) update(1 / 60); },
  forceEnd: endGame
};
resize();
resetGame();
$('padbar').classList.add('hide');
updMini();
run();

})();
</script>

<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';
  var name=(document.title||'游戏').split(/[ ··|]/)[0];


  // 结算页:晒战绩 + 换个游戏
  var over=document.getElementById('over');
  if(over){
    var box=document.createElement('div');
    box.style.cssText='display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px';
    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>


<!-- __hub_recent__ -->
<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='rewind'});
  r.unshift({k:'rewind',n:'影子搭档 · 同步走位',e:'👥'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['rewind_best','rewind_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['rewind']||0)){
            B['rewind']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
