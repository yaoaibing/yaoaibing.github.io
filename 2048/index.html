<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='2048_best',PLAY='2048_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 2048 · 数字合并 ================== */
var NAME = '2048 · 数字合并';
var state = 'start';
var ended = false;
var N = 4, grid = [], score = 0, moves = 0, undos = 3, maxTile = 0;
var undoSnap = null, won2048 = false, winT = 0, newTiles = [], popT = [];
var BX = 0, BY = 0, BS = 0, CS = 0, GAP = 8;
var drag = null;

var COLORS = {
  2: ['#efe6d2', '#6b5c3a'], 4: ['#ecdc9e', '#6b5c2a'], 8: ['#f0a94e', '#4a2a08'],
  16: ['#f0833a', '#401a04'], 32: ['#f0603a', '#400a04'], 64: ['#e83a2a', '#fff'],
  128: ['#f0c85a', '#4a3a08'], 256: ['#f0c040', '#4a3a08'], 512: ['#f0b82a', '#4a3a08'],
  1024: ['#f0b014', '#3a2a00'], 2048: ['#ffd700', '#3a2a00'], 4096: ['#c8f04a', '#243a08'], 8192: ['#8af04a', '#1a3a08']
};

function layout() {
  var top = Math.max(92, VH * .13);
  var pad = VW < 360 ? 100 : 56;
  var bottom = VH - pad - 66;
  BS = Math.floor(Math.min(VW - 26, bottom - top, 470));
  CS = Math.floor((BS - GAP * (N - 1)) / N);
  BS = CS * N + GAP * (N - 1);
  BX = Math.round((VW - BS) / 2);
  BY = Math.round(top + Math.max(0, (bottom - top - BS) * .45));
}
function onResize() { layout(); }

function emptyCells(g) {
  var out = [], i;
  for (i = 0; i < N * N; i++) if (!g[i]) out.push(i);
  return out;
}
function spawn(g, n) {
  var ec = emptyCells(g);
  if (!ec.length) return false;
  var at = ec[rnd(ec.length)];
  g[at] = (frnd() < .9) ? 2 : 4;
  if (n !== false) { newTiles.push(at); popT[at] = .18; }
  return true;
}
function lineIdx(k, dir, i) {
  /* dir: 0=左 1=右 2=上 3=下, 返回第 i 个格子的一维下标 */
  var r = Math.floor(k / N), c = k % N;
  if (dir === 0) return r * N + i;
  if (dir === 1) return r * N + (N - 1 - i);
  if (dir === 2) return i * N + c;
  return (N - 1 - i) * N + c;
}
function slide(g, dir) {
  var moved = false, gained = 0, merged = [], i, k;
  for (k = 0; k < N; k++) {
    var line = [], pos = [];
    for (i = 0; i < N; i++) {
      var id = lineIdx(k, dir, i);
      if (g[id]) { line.push(g[id]); pos.push(id); }
    }
    var out = [], outPos = [], j = 0;
    while (j < line.length) {
      if (j + 1 < line.length && line[j] === line[j + 1]) {
        var v = line[j] * 2;
        out.push(v); outPos.push(pos[j]);
        gained += v; merged.push(pos[j]);
        if (v > maxTile) maxTile = v;
        if (v === 2048) won2048 = true;
        j += 2;
      } else { out.push(line[j]); outPos.push(pos[j]); j++; }
    }
    while (out.length < N) { out.push(0); outPos.push(-1); }
    for (i = 0; i < N; i++) {
      var id2 = lineIdx(k, dir, i);
      if (g[id2] !== out[i]) moved = true;
      g[id2] = out[i];
    }
  }
  return { moved: moved, gained: gained, merged: merged };
}
function canMove(g) {
  var i;
  for (i = 0; i < N * N; i++) if (!g[i]) return true;
  for (i = 0; i < N * N; i++) {
    var r = Math.floor(i / N), c = i % N;
    if (c < N - 1 && g[i] === g[i + 1]) return true;
    if (r < N - 1 && g[i] === g[i + N]) return true;
  }
  return false;
}
function snapshot() {
  return { g: grid.slice(), score: score, moves: moves, maxTile: maxTile };
}
function restore() {
  if (!undoSnap || undos <= 0) return;
  undos--;
  grid = undoSnap.g.slice(); score = undoSnap.score; moves = undoSnap.moves; maxTile = undoSnap.maxTile;
  undoSnap = null; newTiles = []; popT = [];
  syncHud();
  tone(320, .08, 'triangle', .04);
}
function doMove(dir) {
  if (state !== 'play' || winT > 0) return;
  undoSnap = snapshot();
  var res = slide(grid, dir);
  if (!res.moved) { undoSnap = null; return; }
  moves++; score += res.gained;
  if (res.gained >= 128) score += Math.floor(res.gained / 8);
  newTiles = []; popT = [];
  spawn(grid);
  res.merged.forEach(function (id) { popT[id] = .2; });
  tone(240 + Math.min(660, res.gained * 2), .07, 'triangle', .045);
  syncHud();
  if (won2048 && state === 'play') {
    var keep = state; win(true); state = keep; won2048 = false;
    $('padbar').classList.remove('hide');
    return;
  }
  if (!canMove(grid)) win(false);
}
function resetGame() {
  N = 4; layout();
  grid = [];
  var i;
  for (i = 0; i < N * N; i++) grid.push(0);
  score = 0; moves = 0; undos = 3; maxTile = 0; undoSnap = null; won2048 = false; winT = 0;
  newTiles = []; popT = [];
  ended = false;
  spawn(grid); spawn(grid);
  syncHud();
}
function startGame() {
  resetGame();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
}
function syncHud() {
  $('hscore').textContent = score;
  $('hmove').textContent = moves;
  var mx = 0, i;
  for (i = 0; i < N * N; i++) if (grid[i] > mx) mx = grid[i];
  maxTile = Math.max(maxTile, mx);
  $('hmax').textContent = maxTile;
}
function win(reached) {
  winT = 1.4;
  state = 'over';
  if (!ended) { KIT.addPlay(); KIT.streak(); ended = true; }
  var score2 = score + (reached ? 2000 : 0);
  var rec = KIT.setBest(score2);
  var rank = reached ? (score >= 30000 ? '数字之神' : '2048 达成!') : (score >= 20000 ? '棋盘老手' : score >= 8000 ? '渐入佳境' : '初学乍练');
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '本局得分 <b>' + score2 + '</b><br>' +
    '最大数字 <b>' + maxTile + '</b> · 用了 ' + moves + ' 步<br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '大数字压角、小数字靠边,阶梯式合并最稳';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  tone(760, .3, 'sine', .07, reached ? 1400 : 400);
}
function update(dt) {
  var i;
  for (i in popT) { popT[i] -= dt; if (popT[i] <= 0) delete popT[i]; }
  if (winT > 0) winT -= dt;
}
function rr(x, y, w, h, rad) {
  var k = Math.min(rad, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
function tileColor(v) { return COLORS[v] || ['#8af04a', '#1a3a08']; }
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#1d1608');
  bg.addColorStop(1, '#0c0a04');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);

  ctx.fillStyle = 'rgba(255,255,255,.05)';
  rr(BX - 12, BY - 12, BS + 24, BS + 24, 22); ctx.fill();

  var i, r, c;
  for (i = 0; i < N * N; i++) {
    r = Math.floor(i / N); c = i % N;
    var x = BX + c * (CS + GAP), y = BY + r * (CS + GAP);
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    rr(x, y, CS, CS, 10); ctx.fill();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (i = 0; i < N * N; i++) {
    if (!grid[i]) continue;
    r = Math.floor(i / N); c = i % N;
    var x2 = BX + c * (CS + GAP), y2 = BY + r * (CS + GAP);
    var pop = popT[i] ? 1 + popT[i] * 1.1 : 1;
    var sz = CS * Math.min(1, pop);
    var off = (CS - sz) / 2;
    var col = tileColor(grid[i]);
    ctx.fillStyle = col[0];
    rr(x2 + off, y2 + off, sz, sz, 10); ctx.fill();
    var label = String(grid[i]);
    var fs = CS * (label.length >= 4 ? .34 : label.length === 3 ? .42 : .52);
    ctx.fillStyle = col[1];
    ctx.font = '900 ' + Math.round(fs) + 'px "PingFang SC",sans-serif';
    ctx.fillText(label, x2 + CS / 2, y2 + CS / 2 + fs * .06);
  }
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.fillText('滑动合并同数字 · 撤销剩 ' + undos + ' 次', VW / 2, BY + BS + 34);
  if (state === 'play' && score > 0) {
    ctx.fillStyle = 'rgba(255,215,120,.75)';
    ctx.fillText('目标 2048 · 当前最高块 ' + maxTile, VW / 2, BY + BS + 56);
  }
}
function swipe(dx, dy) {
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) doMove(dx > 0 ? 1 : 0);
  else doMove(dy > 0 ? 3 : 2);
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  drag = { x: e.clientX, y: e.clientY };
});
cv.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) > 34 || Math.abs(dy) > 34) { swipe(dx, dy); drag = null; }
});
cv.addEventListener('pointerup', function (e) {
  if (!drag) return;
  swipe(e.clientX - drag.x, e.clientY - drag.y);
  drag = null;
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  var k = e.key;
  if (k === 'ArrowLeft') { e.preventDefault(); doMove(0); }
  if (k === 'ArrowRight') { e.preventDefault(); doMove(1); }
  if (k === 'ArrowUp') { e.preventDefault(); doMove(2); }
  if (k === 'ArrowDown') { e.preventDefault(); doMove(3); }
  if (k === 'u' || k === 'U') { e.preventDefault(); restore(); }
  if (k === 'r' || k === 'R') { e.preventDefault(); startGame(); }
});

function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}

$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', startGame);
$('undobtn').addEventListener('click', restore);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」合出了 ' + maxTile + ',拿了 ' + score + ' 分! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  grid: function () { return grid.slice(); },
  move: doMove,
  spawn: function () { spawn(grid); },
  score: function () { return score; },
  maxTile: function () { return maxTile; },
  moves: function () { return moves; },
  canMove: function () { return canMove(grid); },
  setGrid: function (g) { grid = g.slice(); maxTile = 0; syncHud(); },
  undoLeft: function () { return undos; },
  undo: restore,
  state: function () { return state; }
};

resize();
resetGame();
$('padbar').classList.add('hide');
updMini();
run();

})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='2048'});
  r.unshift({k:'2048',n:'2048 · 数字合并',e:'🔢'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['2048_best','2048_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['2048']||0)){
            B['2048']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
