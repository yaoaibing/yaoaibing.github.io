<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='wordfind_best',PLAY='wordfind_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 词海寻宝 · 字里寻词 ================== */
var NAME = '词海寻宝 · 字里寻词';
var state = 'start';
var N = 9, grid = [], words = [], found = [], foundPaths = [];
var TIME = 120, timeLeft = 120;
var hints = 3, hintCell = -1, hintT = 0;
var score = 0, endT = 0;
var BX = 0, BY = 0, BS = 0, CS = 0;
var drag = null, selPath = [];

var BANK = [
  '大熊猫|长颈鹿|东北虎|企鹅|袋鼠|海豚|金丝猴|丹顶鹤|北极熊|变色龙',
  '长城|故宫|西湖|泰山|漓江|颐和园|日月潭|黄山|兵马俑|趵突泉',
  '彩虹|雷雨|晚霞|台风|闪电|雾凇|冰雹|流星|极光|沙尘暴',
  '钢琴|吉他|古筝|琵琶|唢呐|木鱼|编钟|口琴|大鼓|竹笛',
  '火锅|饺子|烧烤|汤圆|春卷|粽子|煎饼|包子|拉面|糖葫芦',
  '羽毛球|乒乓球|篮球|足球|游泳|滑雪|体操|跳水|瑜伽|登山',
  '风筝|灯笼|骨牌|气球|积木|弹珠|铃铛|镜子|扇子|雨伞',
  '星辰|云海|山峰|森林|瀑布|草原|沙漠|湖泊|小溪|温泉'
];

function layout() {
  var top = Math.max(92, VH * .13);
  var pad = VW < 360 ? 100 : 56;
  var bottom = VH - pad - 60;
  BS = Math.floor(Math.min(VW - 26, bottom - top, 470));
  CS = Math.floor((BS - 8 * (N - 1)) / N);
  BS = CS * N + 8 * (N - 1);
  BX = Math.round((VW - BS) / 2);
  BY = Math.round(top + Math.max(0, (bottom - top - BS) * .45));
}
function onResize() { layout(); }

function shuffle(a) {
  var i, j, t;
  for (i = a.length - 1; i > 0; i--) {
    j = rnd(i + 1); t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
/* 8 个方向:横竖斜 */
var DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];
function newPuzzle() {
  var all = [];
  BANK.forEach(function (s) { s.split('|').forEach(function (w) { all.push(w); }); });
  var pool = shuffle(all).slice(0, 8);
  var tries, placed = [], g = [], i;
  for (i = 0; i < N * N; i++) g.push('');
  /* 依次放词:随机起点+方向,放不下换位置,单fail重试整个词 */
  for (var w = 0; w < pool.length; w++) {
    var word = pool[w];
    var ok = false;
    for (tries = 0; tries < 400 && !ok; tries++) {
      var d = pick(DIRS);
      var sx = rnd(N), sy = rnd(N);
      var ex = sx + d[0] * (word.length - 1), ey = sy + d[1] * (word.length - 1);
      if (ex < 0 || ex >= N || ey < 0 || ey >= N) continue;
      var fit = true, path = [];
      for (i = 0; i < word.length; i++) {
        var cx = sx + d[0] * i, cy = sy + d[1] * i;
        var id = cy * N + cx;
        if (g[id] && g[id] !== word[i]) { fit = false; break; }
        path.push(id);
      }
      if (!fit) continue;
      for (i = 0; i < path.length; i++) g[path[i]] = word[i];
      placed.push({ word: word, path: path });
      ok = true;
    }
    if (!ok) { /* 兜底:换词重试 */
      w--; pool[w + 1] = pick(all);
    }
  }
  var FILL = '的一是了我不人在他有这上们来到时大地为子中你说生国年着就那和要她出也得里后自以会家可下而过天去能对小多然于心学么之都好看起发当没成只如事把还用第样道想作种开美总从无情己面最女但现前些所同日手又行意动方期它头经长儿回位分爱老因很给名法间斯知世什两次使身者被高已亲其进此话常与活正感';
  for (i = 0; i < N * N; i++) if (!g[i]) g[i] = FILL[rnd(FILL.length)];
  grid = g;
  words = placed;
  found = [];
  foundPaths = [];
  hints = 3; hintCell = -1; hintT = 0;
  score = 0;
  timeLeft = TIME;
  selPath = []; drag = null;
}
function resetGame() {
  N = 9; layout();
  newPuzzle();
  syncHud();
}
function startGame() {
  resetGame();
  state = 'play';
  endT = 0;
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
}
function finish(timeout) {
  state = 'over';
  endT = 1.2;
  KIT.addPlay(); KIT.streak();
  var bonus = found.length >= words.length ? timeLeft * 3 : 0;
  score = found.length * 100 + bonus;
  var rec = KIT.setBest(score);
  var rank = found.length >= words.length ? (timeLeft > 60 ? '火眼金睛' : '词海达人') : found.length >= 5 ? '渐入佳境' : '初来乍到';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '本局得分 <b>' + score + '</b><br>' +
    '找到 ' + found.length + ' / ' + words.length + ' 个词<br>' +
    (found.length >= words.length ? ('剩余 ' + Math.ceil(timeLeft) + ' 秒<br>') : '') +
    rank + '<br>历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '先扫长词和角落,斜向词最爱藏在四角';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  tone(720, .28, 'sine', .07, found.length >= words.length ? 1100 : 300);
}
function useHint() {
  if (state !== 'play' || hints <= 0) return;
  var i;
  for (i = 0; i < words.length; i++) {
    if (found.indexOf(words[i].word) < 0) {
      hints--;
      hintCell = words[i].path[0];
      hintT = 2.2;
      tone(520, .12, 'sine', .05);
      syncHud();
      return;
    }
  }
}
function cellAt(x, y) {
  var c = Math.floor((x - BX) / (CS + 8)), r = Math.floor((y - BY) / (CS + 8));
  if (c < 0 || c >= N || r < 0 || r >= N) return -1;
  var lx = x - BX - c * (CS + 8), ly = y - BY - r * (CS + 8);
  if (lx > CS || ly > CS) return -1;
  return r * N + c;
}
function sameLine(a, b) {
  var ra = Math.floor(a / N), ca = a % N, rb = Math.floor(b / N), cb = b % N;
  var dr = rb - ra, dc = cb - ca;
  if (dr === 0) return dc !== 0;
  if (dc === 0) return true;
  return Math.abs(dr) === Math.abs(dc);
}
function pathOf(a, b) {
  var ra = Math.floor(a / N), ca = a % N, rb = Math.floor(b / N), cb = b % N;
  var dr = Math.sign(rb - ra), dc = Math.sign(cb - ca);
  var out = [], r = ra, c = ca;
  out.push(r * N + c);
  while (r !== rb || c !== cb) { r += dr; c += dc; out.push(r * N + c); }
  return out;
}
function commitSel() {
  if (selPath.length < 2) { selPath = []; return; }
  var a = selPath[0], b = selPath[selPath.length - 1];
  if (!sameLine(a, b)) { selPath = []; tone(200, .1, 'square', .03); return; }
  var path = pathOf(a, b);
  var str = '', i;
  for (i = 0; i < path.length; i++) str += grid[path[i]];
  var rev = str.split('').reverse().join('');
  for (i = 0; i < words.length; i++) {
    var w = words[i].word;
    if ((str === w || rev === w) && path.length === w.length && found.indexOf(w) < 0) {
      found.push(w);
      foundPaths.push(path);
      score += 100;
      tone(600 + found.length * 60, .14, 'sine', .06);
      syncHud();
      if (found.length === words.length) finish(false);
      selPath = [];
      return;
    }
  }
  tone(220, .08, 'square', .03);
  selPath = [];
}
function syncHud() {
  $('hfound').textContent = found.length + '/' + words.length;
  $('htime').textContent = Math.ceil(Math.max(0, timeLeft));
  $('hhint').textContent = hints;
}
function update(dt) {
  if (hintT > 0) hintT -= dt;
  if (endT > 0) endT -= dt;
  if (state !== 'play') return;
  timeLeft -= dt;
  if (timeLeft <= 10 && timeLeft + dt > 10) tone(880, .18, 'square', .05);
  if (timeLeft <= 0) { timeLeft = 0; finish(true); return; }
  if (Math.floor(timeLeft) !== Math.floor(timeLeft + dt)) syncHud();
}
function rr(x, y, w, h, rad) {
  var k = Math.min(rad, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
function cellXY(id) {
  var r = Math.floor(id / N), c = id % N;
  return { x: BX + c * (CS + 8), y: BY + r * (CS + 8) };
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#0e1e24');
  bg.addColorStop(1, '#060d10');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);

  ctx.fillStyle = 'rgba(255,255,255,.05)';
  rr(BX - 12, BY - 12, BS + 24, BS + 24, 22); ctx.fill();

  var i;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (i = 0; i < N * N; i++) {
    var p = cellXY(i);
    ctx.fillStyle = 'rgba(255,255,255,.045)';
    rr(p.x, p.y, CS, CS, 8); ctx.fill();
    ctx.fillStyle = 'rgba(210,244,255,.9)';
    ctx.font = '700 ' + Math.round(CS * .52) + 'px "PingFang SC",sans-serif';
    ctx.fillText(grid[i], p.x + CS / 2, p.y + CS / 2 + 1);
  }
  /* 已找到词:高亮路径 */
  for (i = 0; i < foundPaths.length; i++) {
    var fp = foundPaths[i];
    ctx.strokeStyle = 'rgba(80,220,255,.55)';
    ctx.lineWidth = CS * .62; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    var p0 = cellXY(fp[0]);
    ctx.moveTo(p0.x + CS / 2, p0.y + CS / 2);
    for (var k = 1; k < fp.length; k++) {
      var pk = cellXY(fp[k]);
      ctx.lineTo(pk.x + CS / 2, pk.y + CS / 2);
    }
    ctx.stroke();
    for (k = 0; k < fp.length; k++) {
      var pk2 = cellXY(fp[k]);
      ctx.fillStyle = '#06252e';
      ctx.font = '900 ' + Math.round(CS * .5) + 'px "PingFang SC",sans-serif';
      ctx.fillText(grid[fp[k]], pk2.x + CS / 2, pk2.y + CS / 2 + 1);
    }
  }
  /* 提示:圈词首 */
  if (hintT > 0 && hintCell >= 0) {
    var hp = cellXY(hintCell);
    ctx.strokeStyle = 'rgba(255,220,90,' + (0.4 + 0.5 * Math.abs(Math.sin(hintT * 5))) + ')';
    ctx.lineWidth = 3;
    rr(hp.x + 2, hp.y + 2, CS - 4, CS - 4, 8); ctx.stroke();
  }
  /* 正在拖选的路径 */
  if (selPath.length) {
    ctx.strokeStyle = 'rgba(255,215,120,.6)';
    ctx.lineWidth = CS * .6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    var sp0 = cellXY(selPath[0]);
    ctx.moveTo(sp0.x + CS / 2, sp0.y + CS / 2);
    for (var s = 1; s < selPath.length; s++) {
      var spk = cellXY(selPath[s]);
      ctx.lineTo(spk.x + CS / 2, spk.y + CS / 2);
    }
    ctx.stroke();
  }
  /* 剩余词列表 */
  var remain = [];
  for (i = 0; i < words.length; i++) if (found.indexOf(words[i].word) < 0) remain.push(words[i].word);
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(210,244,255,.6)';
  ctx.textAlign = 'left';
  ctx.fillText('待找: ' + (remain.join('、') || '全部找到!'), BX, BY + BS + 30);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,220,120,.6)';
  ctx.fillText('按住划过整词,横竖斜都可以', VW / 2, BY + BS + 52);
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  var id = cellAt(e.clientX, e.clientY);
  if (id < 0) return;
  drag = true;
  selPath = [id];
  tone(340, .04, 'triangle', .025);
});
cv.addEventListener('pointermove', function (e) {
  if (!drag || state !== 'play') return;
  var id = cellAt(e.clientX, e.clientY);
  if (id < 0) return;
  var last = selPath[selPath.length - 1];
  if (id === last) return;
  if (selPath.length > 1 && id === selPath[selPath.length - 2]) { selPath.pop(); return; }
  if (selPath.indexOf(id) >= 0) return;
  if (!sameLine(selPath[0], id)) return;
  selPath.push(id);
});
cv.addEventListener('pointerup', function () {
  if (!drag) return;
  drag = null;
  commitSel();
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === 'h' || e.key === 'H') { e.preventDefault(); useHint(); }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startGame(); }
});

function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}

$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', startGame);
$('hintbtn').addEventListener('click', useHint);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」找到了 ' + found.length + '/' + words.length + ' 个词,拿了 ' + score + ' 分! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  words: function () { return words.map(function (w) { return { word: w.word, path: w.path.slice() }; }); },
  grid: function () { return grid.slice(); },
  found: function () { return found.slice(); },
  pickWord: function (i) { commitWord(words[i]); },
  commit: function (a, b) { selPath = pathOf(a, b); commitSel(); },
  hint: function () { hints = Math.max(hints, 1); useHint(); },
  hintCell: function () { return hintCell; },
  hintsLeft: function () { return hints; },
  time: function (v) { timeLeft = v; },
  timeLeft: function () { return timeLeft; },
  score: function () { return score; },
  state: function () { return state; }
};
function commitWord(w) {
  found.push(w.word);
  foundPaths.push(w.path.slice());
  syncHud();
  if (found.length === words.length) finish(false);
}

resize();
resetGame();
$('padbar').classList.add('hide');
updMini();
run();

})();
</script>

<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}

        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='wordfind'});
  r.unshift({k:'wordfind',n:'词海寻宝 · 字里寻词',e:'🔡'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['wordfind_best','wordfind_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['wordfind']||0)){
            B['wordfind']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
