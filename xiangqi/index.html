<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='xiangqi_best',PLAY='xiangqi_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 中国象棋 · 人机对弈 ================== */
var NAME = '中国象棋 · 人机对弈';
var state = 'start';
var RED = 0, BLACK = 1;
var K = 1, AD = 2, EL = 3, HO = 4, RO = 5, CA = 6, PA = 7;
var board = [], turn = RED, selected = -1, dests = [], moveNo = 0, hist = [];
var diff = 1, thinking = false, aiTimer = 0, lastMove = null, checkSide = -1, flashT = 0;
var BX = 0, BY = 0, CS = 36, statusY = 0;
var DIFF_CN = ['简单', '普通', '困难'];

function layout() {
  var top = Math.max(74, VH * .09);
  var pad = VW < 360 ? 112 : 58;
  var bottom = VH - pad - 58;
  CS = Math.floor(Math.min((VW - 30) / 8, (bottom - top - 20) / 9));
  CS = Math.max(22, CS);
  var bw = CS * 8, bh = CS * 9;
  BX = Math.round((VW - bw) / 2);
  BY = Math.round(top + Math.max(0, (bottom - top - bh) * .5));
  statusY = BY + bh + 28;
}
function onResize() { layout(); }

function inB(x, y) { return x >= 0 && x < 9 && y >= 0 && y < 10; }
function ix(x, y) { return y * 9 + x; }
function pxy(i) { return { x: i % 9, y: Math.floor(i / 9) }; }
function sideOf(p) { return p === 0 ? -1 : (p < 8 ? RED : BLACK); }
function kindOf(p) { return p & 7; }
function enemyOf(s) { return s === RED ? BLACK : RED; }

function initBoard() {
  board = new Array(90);
  var i;
  for (i = 0; i < 90; i++) board[i] = 0;
  var back = [RO, HO, EL, AD, K, AD, EL, HO, RO];
  for (i = 0; i < 9; i++) {
    board[ix(i, 0)] = back[i] + 8;
    board[ix(i, 9)] = back[i];
  }
  board[ix(1, 2)] = CA + 8;
  board[ix(7, 2)] = CA + 8;
  board[ix(1, 7)] = CA;
  board[ix(7, 7)] = CA;
  for (i = 0; i < 9; i += 2) {
    board[ix(i, 3)] = PA + 8;
    board[ix(i, 6)] = PA;
  }
}

function genMoves(b, side) {
  var out = [], y, x, p;
  function add(fx, fy, tx, ty) {
    if (!inB(tx, ty)) return;
    var q = b[ix(tx, ty)];
    if (q && sideOf(q) === side) return;
    out.push({ from: ix(fx, fy), to: ix(tx, ty) });
  }
  for (y = 0; y < 10; y++) for (x = 0; x < 9; x++) {
    p = b[ix(x, y)];
    if (!p || sideOf(p) !== side) continue;
    var k = kindOf(p), i, d;
    if (k === RO || k === CA) {
      for (i = 0; i < 4; i++) {
        d = [[0, -1], [1, 0], [0, 1], [-1, 0]][i];
        var tx = x + d[0], ty = y + d[1], screen = 0;
        while (inB(tx, ty)) {
          var q = b[ix(tx, ty)];
          if (k === RO) {
            if (!q) out.push({ from: ix(x, y), to: ix(tx, ty) });
            else {
              if (sideOf(q) !== side) out.push({ from: ix(x, y), to: ix(tx, ty) });
              break;
            }
          } else {
            if (!q) {
              if (!screen) out.push({ from: ix(x, y), to: ix(tx, ty) });
            } else if (!screen) {
              screen = 1;
            } else {
              if (sideOf(q) !== side) out.push({ from: ix(x, y), to: ix(tx, ty) });
              break;
            }
          }
          tx += d[0]; ty += d[1];
        }
      }
    } else if (k === HO) {
      var hm = [[1, 2, 0, 1], [-1, 2, 0, 1], [1, -2, 0, -1], [-1, -2, 0, -1],
        [2, 1, 1, 0], [2, -1, 1, 0], [-2, 1, -1, 0], [-2, -1, -1, 0]];
      for (i = 0; i < 8; i++) {
        if (inB(x + hm[i][2], y + hm[i][3]) && !b[ix(x + hm[i][2], y + hm[i][3])]) add(x, y, x + hm[i][0], y + hm[i][1]);
      }
    } else if (k === EL) {
      var em = [[2, 2], [-2, 2], [2, -2], [-2, -2]];
      for (i = 0; i < 4; i++) {
        var ex = x + em[i][0], ey = y + em[i][1];
        if (!inB(ex, ey)) continue;
        if (side === RED && ey < 5) continue;
        if (side === BLACK && ey > 4) continue;
        if (!b[ix(x + em[i][0] / 2, y + em[i][1] / 2)]) add(x, y, ex, ey);
      }
    } else if (k === AD) {
      var am = [[1, 1], [-1, 1], [1, -1], [-1, -1]];
      for (i = 0; i < 4; i++) {
        var ax = x + am[i][0], ay = y + am[i][1];
        if (ax < 3 || ax > 5) continue;
        if (side === RED ? (ay < 7 || ay > 9) : (ay < 0 || ay > 2)) continue;
        add(x, y, ax, ay);
      }
    } else if (k === K) {
      var km = [[0, -1], [1, 0], [0, 1], [-1, 0]];
      for (i = 0; i < 4; i++) {
        var kx = x + km[i][0], ky = y + km[i][1];
        if (kx < 3 || kx > 5) continue;
        if (side === RED ? (ky < 7 || ky > 9) : (ky < 0 || ky > 2)) continue;
        add(x, y, kx, ky);
      }
      var yy = y + (side === RED ? -1 : 1);
      while (inB(x, yy)) {
        var qk = b[ix(x, yy)];
        if (qk) {
          if (kindOf(qk) === K && sideOf(qk) !== side) out.push({ from: ix(x, y), to: ix(x, yy) });
          break;
        }
        yy += (side === RED ? -1 : 1);
      }
    } else if (k === PA) {
      add(x, y, x, y + (side === RED ? -1 : 1));
      var crossed = side === RED ? y <= 4 : y >= 5;
      if (crossed) {
        add(x, y, x - 1, y);
        add(x, y, x + 1, y);
      }
    }
  }
  return out;
}

function kingPos(b, side) {
  var i, p = side === RED ? K : K + 8;
  for (i = 0; i < 90; i++) if (b[i] === p) return i;
  return -1;
}

function inCheck(b, side) {
  var kp = kingPos(b, side);
  if (kp < 0) return true;
  var kx = kp % 9, ky = Math.floor(kp / 9), en = enemyOf(side), i;
  var dirs = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  for (i = 0; i < 4; i++) {
    var x = kx + dirs[i][0], y = ky + dirs[i][1], screens = 0;
    while (x >= 0 && x < 9 && y >= 0 && y < 10) {
      var p = b[ix(x, y)];
      if (p) {
        if (!screens) {
          if (sideOf(p) === en && (kindOf(p) === RO || (kindOf(p) === K && i === (side === RED ? 0 : 2)))) return true;
          screens = 1;
        } else {
          if (sideOf(p) === en && kindOf(p) === CA) return true;
          break;
        }
      }
      x += dirs[i][0]; y += dirs[i][1];
    }
  }
  var hm = [[1, 2], [-1, 2], [1, -2], [-1, -2], [2, 1], [2, -1], [-2, 1], [-2, -1]];
  for (i = 0; i < 8; i++) {
    var hx = kx + hm[i][0], hy = ky + hm[i][1];
    if (hx < 0 || hx > 8 || hy < 0 || hy > 9) continue;
    if (b[ix(hx, hy)] !== HO + (en === BLACK ? 8 : 0)) continue;
    var lx = hx + (hm[i][0] > 0 ? -1 : 1), ly = hy + (hm[i][1] > 0 ? -1 : 1);
    if (Math.abs(hm[i][0]) === 2) ly = hy; else lx = hx;
    if (!b[ix(lx, ly)]) return true;
  }
  var pw = PA + (en === BLACK ? 8 : 0);
  var fy = ky + (en === BLACK ? -1 : 1);
  if (fy >= 0 && fy < 10 && b[ix(kx, fy)] === pw) return true;
  var enemyCrossed = en === BLACK ? ky >= 5 : ky <= 4;
  if (enemyCrossed) {
    if (kx > 0 && b[ix(kx - 1, ky)] === pw) return true;
    if (kx < 8 && b[ix(kx + 1, ky)] === pw) return true;
  }
  return false;
}

function apply(b, m) {
  var cap = b[m.to];
  b[m.to] = b[m.from];
  b[m.from] = 0;
  return cap;
}
function unapply(b, m, cap) {
  b[m.from] = b[m.to];
  b[m.to] = cap;
}
function legalMoves(b, side) {
  var ps = genMoves(b, side), out = [], i;
  for (i = 0; i < ps.length; i++) {
    var cap = apply(b, ps[i]);
    if (!inCheck(b, side)) out.push(ps[i]);
    unapply(b, ps[i], cap);
  }
  return out;
}

var PVAL = { 1: 6000, 2: 180, 3: 180, 4: 400, 5: 900, 6: 450, 7: 100 };
function evalSide(b, side) {
  var s = 0, i;
  for (i = 0; i < 90; i++) {
    var p = b[i];
    if (!p) continue;
    var v = PVAL[kindOf(p)];
    var k = kindOf(p), y = Math.floor(i / 9), x = i % 9;
    if (k === PA) {
      var crossed = sideOf(p) === RED ? y <= 4 : y >= 5;
      if (crossed) v += 50;
      v += (sideOf(p) === RED ? (9 - y) : y) * 6;
    }
    if (k === HO || k === CA) v += (4 - Math.abs(x - 4)) * 4;
    if (sideOf(p) === side) s += v; else s -= v;
  }
  return s;
}

var aiNodes = 0;
function search(b, side, depth, alpha, beta) {
  aiNodes++;
  if (depth <= 0) return evalSide(b, side);
  var ms = legalMoves(b, side);
  if (!ms.length) return -90000 - depth * 100;
  ms.sort(function (a, c) {
    var ca = b[a.to] ? PVAL[kindOf(b[a.to])] : 0;
    var cc = b[c.to] ? PVAL[kindOf(b[c.to])] : 0;
    return cc - ca;
  });
  var best = -1e9, i;
  for (i = 0; i < ms.length; i++) {
    var cap = apply(b, ms[i]);
    var sc = -search(b, enemyOf(side), depth - 1, -beta, -alpha);
    unapply(b, ms[i], cap);
    if (sc > best) best = sc;
    if (best > alpha) alpha = best;
    if (alpha >= beta) break;
    if (aiNodes > 240000) break;
  }
  return best;
}

function aiPick() {
  var ms = legalMoves(board, BLACK);
  if (!ms.length) return null;
  if (diff === 0 && frnd() < .3) return pick(ms);
  aiNodes = 0;
  var depth = diff === 0 ? 1 : diff === 1 ? 2 : 3;
  var best = -1e9, bests = [], i;
  ms.sort(function (a, c) {
    return (board[c.to] ? PVAL[kindOf(board[c.to])] : 0) - (board[a.to] ? PVAL[kindOf(board[a.to])] : 0);
  });
  for (i = 0; i < ms.length; i++) {
    var cap = apply(board, ms[i]);
    var sc = -search(board, RED, depth - 1, -1e9, 1e9);
    unapply(board, ms[i], cap);
    if (diff === 0) sc += frnd() * 80;
    if (sc > best + .001) { best = sc; bests = [ms[i]]; }
    else if (Math.abs(sc - best) < .001) bests.push(ms[i]);
  }
  return pick(bests);
}

function resetGame() {
  initBoard();
  turn = RED; selected = -1; dests = []; moveNo = 0; hist = [];
  thinking = false; lastMove = null; checkSide = -1; flashT = 0;
  state = 'play';

  $('start').classList.add('hide');

}

}

}

function doMove(m) {
  hist.push({ from: m.from, to: m.to, cap: board[m.to], side: turn });
  apply(board, m);
  lastMove = { from: m.from, to: m.to };
  moveNo++;
  flashT = .2;
  tone(m.cap ? 180 : 420, .06, 'square', .035, m.cap ? 120 : 360);
  selected = -1; dests = [];

  var foe = enemyOf(turn);
  if (kingPos(board, foe) < 0) { finish(turn === RED); return; }
  checkSide = inCheck(board, foe) ? foe : -1;
  var replies = legalMoves(board, foe);
  if (!replies.length) { finish(turn === RED); return; }

  if (turn === BLACK) scheduleAI();
}

function scheduleAI() {
  thinking = true;

function finish(playerWin) {

  else tone(220, .3, 'sawtooth', .05, 90);
}

function undo() {
  if (!hist.length || state !== 'play') return;
  if (aiTimer) { clearTimeout(aiTimer); aiTimer = 0; }
  thinking = false;
  var n = 0;
  if (hist.length >= 2 && hist[hist.length - 1].side === BLACK) n = 2;
  else n = 1;
  while (n-- > 0 && hist.length) {
    var h = hist.pop();
    unapply(board, h, h.cap);
    moveNo = Math.max(0, moveNo - 1);
  }
  turn = RED;
  selected = -1; dests = [];
  lastMove = hist.length ? { from: hist[hist.length - 1].from, to: hist[hist.length - 1].to } : null;
  checkSide = inCheck(board, RED) ? RED : (inCheck(board, BLACK) ? BLACK : -1);
  syncHud();
  tone(300, .06, 'sine', .03);
}

function moveAllowed(from, to) {
  var ms = legalMoves(board, turn), i;
  for (i = 0; i < ms.length; i++) if (ms[i].from === from && ms[i].to === to) return ms[i];
  return null;
}

function playMove(from, to) {
  if (state !== 'play' || thinking || turn !== RED) return false;
  var m = moveAllowed(from, to);
  if (!m) return false;
  doMove(m);
  return true;
}

function tapAt(x, y) {
  if (state !== 'play' || thinking || turn !== RED) return;
  var cx = Math.round((x - BX) / CS), cy = Math.round((y - BY) / CS);
  if (cx < 0 || cx > 8 || cy < 0 || cy > 9) return;
  var i = ix(cx, cy);
  if (Math.abs(BX + cx * CS - x) > CS * .55 || Math.abs(BY + cy * CS - y) > CS * .55) return;
  var p = board[i];
  if (selected >= 0 && dests.indexOf(i) >= 0) { playMove(selected, i); return; }
  if (p && sideOf(p) === RED) {
    selected = i;
    dests = legalMoves(board, RED).filter(function (m) { return m.from === i; }).map(function (m) { return m.to; });
    tone(620, .04, 'sine', .025);
  } else {
    selected = -1; dests = [];
  }
}

function rr(x, y, w, h, r) {
  var k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}

var CH_RED = ['', '帅', '仕', '相', '马', '车', '炮', '兵'];
var CH_BLK = ['', '将', '士', '象', '马', '车', '炮', '卒'];

function drawPiece(x, y, p) {
  var red = sideOf(p) === RED;
  var k = kindOf(p);
  var r = CS * .43;
  ctx.beginPath();
  ctx.arc(x, y + 1.5, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,.35)';

  g.addColorStop(0, '#fff4d6');

  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = red ? '#b3352a' : '#3a2a1c';
  ctx.lineWidth = Math.max(1.2, CS * .045);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x, y, r * .8, 0, Math.PI * 2);
  ctx.strokeStyle = red ? 'rgba(179,53,42,.5)' : 'rgba(58,42,28,.45)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = red ? '#a82a20' : '#2a2016';
  ctx.font = '700 ' + Math.floor(CS * .52) + 'px "KaiTi","STKaiti","PingFang SC",serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(red ? CH_RED[k] : CH_BLK[k], x, y + 1);
}

function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#24150d');
  bg.addColorStop(.55, '#170d07');
  bg.addColorStop(1, '#0d0704');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, VW, VH);

  var bw = CS * 8, bh = CS * 9;
  var pad = Math.max(10, CS * .42);
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.5)';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#d9b57e';
  rr(BX - pad, BY - pad, bw + pad * 2, bh + pad * 2, 10);
  ctx.fill();
  ctx.restore();
  var wg = ctx.createLinearGradient(BX, BY, BX, BY + bh);
  wg.addColorStop(0, '#e6c793');
  wg.addColorStop(1, '#cda86f');
  ctx.fillStyle = wg;
  rr(BX - pad + 4, BY - pad + 4, bw + pad * 2 - 8, bh + pad * 2 - 8, 8);
  ctx.fill();

  ctx.strokeStyle = 'rgba(80,48,20,.75)';
  ctx.lineWidth = Math.max(1, CS * .028);
  var i;
  for (i = 0; i < 10; i++) {
    ctx.beginPath();
    ctx.moveTo(BX, BY + i * CS);
    ctx.lineTo(BX + bw, BY + i * CS);
    ctx.stroke();
  }
  for (i = 0; i < 9; i++) {
    var lx = BX + i * CS;
    if (i === 0 || i === 8) {

    } else {
      ctx.beginPath(); ctx.moveTo(lx, BY); ctx.lineTo(lx, BY + CS * 4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(lx, BY + CS * 5); ctx.lineTo(lx, BY + bh); ctx.stroke();
    }
  }
  ctx.strokeStyle = 'rgba(80,48,20,.55)';
  ctx.beginPath();

  ctx.moveTo(BX + 5 * CS, BY); ctx.lineTo(BX + 3 * CS, BY + 2 * CS);
  ctx.moveTo(BX + 3 * CS, BY + 7 * CS); ctx.lineTo(BX + 5 * CS, BY + 9 * CS);
  ctx.moveTo(BX + 5 * CS, BY + 7 * CS); ctx.lineTo(BX + 3 * CS, BY + 9 * CS);
  ctx.stroke();

  ctx.fillStyle = 'rgba(86,50,20,.8)';
  ctx.font = '700 ' + Math.floor(CS * .42) + 'px "KaiTi","STKaiti",serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('楚  河', BX + CS * 2, BY + CS * 4.5);
  ctx.fillText('漢  界', BX + CS * 6, BY + CS * 4.5);

  var y, x;
  for (y = 0; y < 10; y++) for (x = 0; x < 9; x++) {
    var p = board[ix(x, y)];
    if (!p) continue;
    var px = BX + x * CS, py = BY + y * CS;
    if (lastMove && (lastMove.from === ix(x, y) || lastMove.to === ix(x, y))) {

  ctx.textBaseline = 'middle';
  var msg;
  if (state === 'over') msg = '对局结束 · 点「再来一局」重开';
  else if (thinking) msg = '电脑思考中...';
  else if (turn === RED) msg = '轮到你走 · 点棋子再点目标';

  ctx.fillText(msg, VW / 2, statusY);
}

function Tperft(depth) {
  if (depth === 0) return 1;
  var ms = legalMoves(board, turn), n = 0, i, old = turn;
  for (i = 0; i < ms.length; i++) {
    var cap = apply(board, ms[i]);
    turn = enemyOf(old);
    n += Tperft(depth - 1);
    turn = old;
    unapply(board, ms[i], cap);
  }
  return n;
}

window.__T = {
  board: function () { return board.slice(); },
  turn: function () { return turn; },
  state: function () { return state; },
  sq: function (x, y) { return ix(x, y); },
  movesFrom: function (i) {
    return legalMoves(board, turn).filter(function (m) { return m.from === i; }).map(function (m) { return m.to; });
  },
  move: playMove,
  perft: Tperft,
  inCheck: function (side) { return inCheck(board, side); },
  setBoard: function (arr, t) {
    board = arr.slice();
    turn = t;
    selected = -1; dests = []; moveNo = 0; hist = []; thinking = false;
    state = 'play';
    if (aiTimer) { clearTimeout(aiTimer); aiTimer = 0; }

  },
  ai: function () { return aiPick(); },
  playAI: function () { var m = aiPick(); if (m) doMove(m); return !!m; },
  diff: function () { return diff; },
  checkSide: function () { return checkSide; },
  count: function (side) {
    var n = 0, i;
    for (i = 0; i < 90; i++) if (board[i] && sideOf(board[i]) === side) n++;

  }
};

updMini();
setPadDiff();
syncHud();
run();

  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['xiangqi_best','xiangqi_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['xiangqi']||0)){
            B['xiangqi']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
