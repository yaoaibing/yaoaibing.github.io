<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='volleyball_best',PLAY='volleyball_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 沙滩排球 · 人机对战 ================== */
var NAME = '沙滩排球 · 人机对战';
var state = 'start';
var my = 0, aiScore = 0, diff = 1, serveSide = 0;
var pointT = 0, hitCd = 0, gameTime = 0, pointFlash = 0, pointWho = 0;
var LX = 0, RX = 0, NETX = 0, floorY = 0, netH = 90, courtW = 0;
var BR = 10, BODY_H = 44, BODY_W = 24, GRAV = 1400, JUMP_V = -560;
var ball = { x: 0, y: 0, vx: 0, vy: 0, r: 10 };
var player = null, ai = null;
var DIFF_CN = ['简单', '普通', '困难'];
var DIFF_SPEED = [150, 215, 285];

function layout() {
  courtW = Math.min(VW - 16, 620);
  LX = (VW - courtW) / 2;
  RX = LX + courtW;
  NETX = VW / 2;
  var reserve = VW < 360 ? 112 : 64;
  floorY = VH - reserve - 30;
  netH = Math.min(122, Math.max(72, courtW * .2));
  BR = Math.max(8, Math.min(13, courtW * .017));
  BODY_H = Math.max(34, Math.min(52, netH * .42));
  BODY_W = BODY_H * .56;
  if (player) {
    player.x = clamp(player.x, LX + 24, NETX - 28);
    ai.x = clamp(ai.x, NETX + 28, RX - 24);
  }
}
function onResize() { layout(); }

function makePlayer(side) {
  return {
    side: side, x: side === 0 ? NETX - courtW * .22 : NETX + courtW * .22,
    targetX: side === 0 ? NETX - courtW * .22 : NETX + courtW * .22,
    yOff: 0, vy: 0, grounded: true, hitCd: 0
  };
}
function resetMatch() {
  my = 0; aiScore = 0; serveSide = 0;
  player = makePlayer(0);
  ai = makePlayer(1);
  gameTime = 0; pointT = 0; hitCd = 0; pointFlash = 0;
  layout();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  $('diffbtn').textContent = '🎚 ' + DIFF_CN[diff];
  syncHud();
  launchServe();
}
function syncHud() {
  $('hme').textContent = my;
  $('hai').textContent = aiScore;
}

function launchServe() {
  var dir = serveSide === 0 ? 1 : -1;
  ball.x = NETX - dir * Math.min(150, courtW * .26);
  ball.y = floorY - netH * 3.1;
  ball.vx = dir * (courtW * .38);
  ball.vy = -courtW * .34;
  hitCd = .55;
  player.hitCd = .4;
  ai.hitCd = .4;
}
function beginServe() {
  state = 'play';
  launchServe();
}

function jump(p) {
  if (state !== 'play' || !p.grounded) return;
  p.grounded = false;
  p.vy = JUMP_V;
  tone(340, .06, 'sine', .03, 480);
}

function bodyBox(p) {
  return {
    cx: p.x,
    top: floorY - p.yOff - BODY_H,
    bottom: floorY - p.yOff,
    half: BODY_W / 2
  };
}
function tryHit(p) {
  if (state !== 'play' || hitCd > 0 || p.hitCd > 0) return;
  if (p.side === 0 && ball.x > NETX - 4) return;
  if (p.side === 1 && ball.x < NETX + 4) return;
  var b = bodyBox(p);
  var reach = BODY_H * .8;
  if (Math.abs(ball.x - p.x) > BODY_W * .5 + BR + 16) return;
  if (ball.y < b.top - reach * .55 || ball.y > b.bottom + BR) return;
  var dir = p.side === 0 ? 1 : -1;
  var jumping = p.yOff > 16;
  var skill = p.side === 0 ? 1 : .9 + diff * .09;
  var offset = (ball.x - p.x) / (BODY_W * .5 + 10);
  ball.vx = dir * (courtW * (.6 + (jumping ? .3 : 0) + Math.abs(offset) * .06)) * skill;
  ball.vy = -(courtW * (.9 + (jumping ? .28 : 0)) + Math.max(0, floorY - ball.y) * .22);
  ball.x += dir * 4;
  p.hitCd = .26;
  hitCd = .22;
  tone(jumping ? 520 : 420, .07, 'square', .035, jumping ? 760 : 620);
}

function updatePlayer(p, dt) {
  var lo = p.side === 0 ? LX + 24 : NETX + 28;
  var hi = p.side === 0 ? NETX - 28 : RX - 24;
  p.targetX = clamp(p.targetX, lo, hi);
  p.x += (p.targetX - p.x) * Math.min(1, dt * 18);
  p.x = clamp(p.x, lo, hi);
  if (!p.grounded) {
    p.vy += 1700 * dt;
    p.yOff -= p.vy * dt;
    if (p.yOff <= 0) { p.yOff = 0; p.vy = 0; p.grounded = true; }
  }
  if (p.hitCd > 0) p.hitCd -= dt;
}

function predictLanding() {
  var x = ball.x, y = ball.y, vx = ball.vx, vy = ball.vy;
  var t = 0;
  while (t < 3.2) {
    var step = 1 / 60;
    x += vx * step;
    vy += GRAV * step;
    y += vy * step;
    t += step;
    if (x < LX + 8) { x = LX + 8; vx = Math.abs(vx) * .5; }
    if (x > RX - 8) { x = RX - 8; vx = -Math.abs(vx) * .5; }
    if (y > floorY) break;
  }
  return x;
}
function updateAI(dt) {
  var speed = DIFF_SPEED[diff];
  var target = NETX + courtW * .2;
  if (ball.vx > 0 || ball.x > NETX) {
    target = predictLanding();
  } else {
    target = NETX + courtW * .24;
  }
  target = clamp(target, NETX + 28, RX - 24);
  var dx = target - ai.x;
  var maxStep = speed * dt;
  ai.x += Math.abs(dx) < maxStep ? dx : (dx > 0 ? maxStep : -maxStep);
  ai.x = clamp(ai.x, NETX + 28, RX - 24);
  ai.targetX = ai.x;
  if (ai.grounded && ai.hitCd <= 0 && ball.x > NETX &&
      Math.abs(ball.x - ai.x) < courtW * .16 &&
      ball.y < floorY - netH * .7 && ball.y > floorY - netH * 3 && ball.vy > 0) {
    if (rnd(100) < 30 + diff * 25) jump(ai);
  }
}

function stepBall(dt) {
  var prevX = ball.x;
  ball.vy += GRAV * dt;
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  if (ball.x - BR < LX + 6) {
    ball.x = LX + 6 + BR;
    ball.vx = Math.abs(ball.vx) * .55;
    tone(240, .05, 'sine', .025);
  } else if (ball.x + BR > RX - 6) {
    ball.x = RX - 6 - BR;
    ball.vx = -Math.abs(ball.vx) * .55;
    tone(240, .05, 'sine', .025);
  }
  if (ball.y - BR < 60) {
    ball.y = 60 + BR;
    ball.vy = Math.abs(ball.vy) * .5;
  }
  if (ball.y > floorY - netH && (prevX - NETX) * (ball.x - NETX) <= 0) {
    ball.x = NETX + (prevX < NETX ? -1 : 1) * (BR + 2);
    ball.vx = -(prevX < NETX ? -1 : 1) * Math.abs(ball.vx) * .45;
    ball.vy *= .55;
    tone(200, .08, 'square', .03);
  }
  if (ball.y + BR >= floorY) {
    pointTo(ball.x < NETX ? 1 : 0);
    return;
  }
  tryHit(player);
  tryHit(ai);
}

function pointTo(side) {
  if (state !== 'play') return;
  if (side === 0) my++; else aiScore++;
  syncHud();
  pointFlash = 1.1;
  pointWho = side;
  if (my >= 7 || aiScore >= 7) {
    matchOver();
    return;
  }
  state = 'point';
  pointT = 1.15;
  serveSide = 1 - serveSide;
  tone(side === 0 ? 620 : 220, .1, 'triangle', .05, side === 0 ? 820 : 160);
}

function matchOver() {
  state = 'over';
  var win = my > aiScore;
  var score = win ? 1000 + (my - aiScore) * 100 + diff * 100 : my * 60;
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '<b>' + (win ? '赢下比赛!' : '惜败') + '</b><br>' +
    my + ' : ' + aiScore + ' · 难度 ' + DIFF_CN[diff] + '<br>' +
    '本局得分 ' + score + '<br>历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = win ? '站到落点正下方再起跳,扣杀角度最刁' : '别急着扣,先把球稳稳接回去';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  tone(win ? 620 : 260, .14, 'triangle', .06, win ? 900 : 180);
}

function update(dt) {
  if (state === 'play') {
    gameTime += dt;
    if (hitCd > 0) hitCd -= dt;
    if (pointFlash > 0) pointFlash -= dt;
    updatePlayer(player, dt);
    updateAI(dt);
    stepBall(dt);
  } else if (state === 'point') {
    pointT -= dt;
    if (pointT <= 0) beginServe();
  }
}

function drawSand() {
  var g = ctx.createLinearGradient(0, floorY, 0, VH);
  g.addColorStop(0, '#e0bf7c');
  g.addColorStop(1, '#b98f4c');
  ctx.fillStyle = g;
  ctx.fillRect(LX, floorY, courtW, VH - floorY);
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  for (var i = 0; i < 40; i++) {
    var x = LX + ((i * 977) % Math.max(1, Math.floor(courtW)));
    var y = floorY + 6 + ((i * 613) % Math.max(1, Math.floor(VH - floorY - 8)));
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.strokeStyle = 'rgba(120,80,30,.35)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(LX + 4, floorY);
  ctx.lineTo(RX - 4, floorY);
  ctx.stroke();
}
function drawNet() {
  var top = floorY - netH;
  ctx.fillStyle = '#f2f6fa';
  ctx.fillRect(NETX - 2, top, 4, netH);
  ctx.fillStyle = 'rgba(240,248,255,.26)';
  ctx.fillRect(NETX - 13, top, 26, netH);
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 1;
  for (var y = top + 6; y < floorY; y += 9) {
    ctx.beginPath();
    ctx.moveTo(NETX - 13, y);
    ctx.lineTo(NETX + 13, y);
    ctx.stroke();
  }
  for (var x = NETX - 13; x <= NETX + 13; x += 6.5) {
    ctx.beginPath();
    ctx.moveTo(x, top);
    ctx.lineTo(x, floorY);
    ctx.stroke();
  }
  ctx.fillStyle = '#f6fbff';
  ctx.fillRect(NETX - 15, top - 5, 30, 6);
}
function drawPerson(p, color) {
  var top = floorY - p.yOff - BODY_H;
  var cx = p.x;
  ctx.fillStyle = 'rgba(60,36,10,.22)';
  var sh = Math.max(.35, 1 - p.yOff / 220);
  ctx.beginPath();
  ctx.ellipse(cx, floorY + 2, BODY_W * .7 * sh, 4.5 * sh, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(cx - BODY_W / 2, top + BODY_H * .3, BODY_W, BODY_H * .62, 6);
  else ctx.rect(cx - BODY_W / 2, top + BODY_H * .3, BODY_W, BODY_H * .62);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, top + BODY_H * .2, BODY_H * .18, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(3, BODY_H * .1);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - BODY_W * .38, top + BODY_H * .42);
  ctx.lineTo(cx - BODY_W * .72, top + BODY_H * .18);
  ctx.moveTo(cx + BODY_W * .38, top + BODY_H * .42);
  ctx.lineTo(cx + BODY_W * .72, top + BODY_H * .18);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(30,30,40,.55)';
  ctx.lineWidth = Math.max(3, BODY_H * .12);
  ctx.beginPath();
  ctx.moveTo(cx - BODY_W * .22, top + BODY_H * .9);
  ctx.lineTo(cx - BODY_W * .26, floorY - p.yOff);
  ctx.moveTo(cx + BODY_W * .22, top + BODY_H * .9);
  ctx.lineTo(cx + BODY_W * .26, floorY - p.yOff);
  ctx.stroke();
}
function drawBall() {
  var shadowK = clamp(1 - (floorY - ball.y) / (netH * 3.4), .3, 1);
  ctx.fillStyle = 'rgba(70,44,12,.28)';
  ctx.beginPath();
  ctx.ellipse(ball.x, floorY + 2, BR * 1.15 * shadowK, BR * .42 * shadowK, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fdf7e4';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BR, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#3f8fb5';
  ctx.lineWidth = Math.max(1.4, BR * .17);
  ctx.beginPath();
  ctx.arc(ball.x - BR * .25, ball.y, BR * .82, -Math.PI * .46, Math.PI * .46);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(ball.x + BR * .25, ball.y, BR * .82, Math.PI * .54, Math.PI * 1.46);
  ctx.stroke();
}
function draw() {
  var sky = ctx.createLinearGradient(0, 0, 0, floorY);
  sky.addColorStop(0, '#082033');
  sky.addColorStop(.55, '#175a72');
  sky.addColorStop(1, '#63b6c4');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, VW, floorY);
  ctx.fillStyle = 'rgba(255,225,150,.9)';
  ctx.beginPath();
  ctx.arc(VW * .76, floorY * .26, Math.min(34, VW * .07), 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,240,190,.16)';
  ctx.beginPath();
  ctx.arc(VW * .76, floorY * .26, Math.min(62, VW * .13), 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(16,80,104,.55)';
  ctx.fillRect(0, floorY - Math.max(34, netH * .3), VW, Math.max(34, netH * .3));

  drawSand();
  ctx.fillStyle = 'rgba(255,255,255,.1)';
  ctx.font = '900 ' + Math.round(Math.min(80, courtW * .16)) + 'px "PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(my), NETX - courtW * .3, floorY - netH * 1.5);
  ctx.fillText(String(aiScore), NETX + courtW * .3, floorY - netH * 1.5);

  drawNet();
  drawPerson(ai, '#ff8a5c');
  drawPerson(player, '#4fd6e8');
  drawBall();

  if (pointFlash > 0) {
    var k = Math.min(1, pointFlash);
    ctx.fillStyle = 'rgba(255,245,200,' + (k * .85) + ')';
    ctx.font = '900 ' + Math.round(Math.min(34, courtW * .09)) + 'px "PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pointWho === 0 ? '得分!' : '电脑得分', NETX, floorY - netH * 2.1);
  }
  if (state === 'play' && gameTime < 3) {
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.font = '600 ' + Math.max(11, Math.round(courtW * .032)) + 'px "PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('左右拖动移动 · 点屏幕起跳扣杀', VW / 2, floorY + 26);
  }
}

var dragStart = null;
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  dragStart = { x: e.clientX, y: e.clientY, t: Date.now() };
  if (state === 'play') player.targetX = e.clientX;
});
cv.addEventListener('pointermove', function (e) {
  if (!dragStart || state !== 'play') return;
  e.preventDefault();
  player.targetX = e.clientX;
});
cv.addEventListener('pointerup', function (e) {
  if (!dragStart) return;
  var moved = Math.abs(e.clientX - dragStart.x) + Math.abs(e.clientY - dragStart.y);
  if (moved < 14 && Date.now() - dragStart.t < 400) jump(player);
  dragStart = null;
});
cv.addEventListener('pointercancel', function () { dragStart = null; });
window.addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') player.targetX = player.x - 40;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') player.targetX = player.x + 40;
  else if (k === ' ') { e.preventDefault(); jump(player); }
  else if (k === 'r' || k === 'R') resetMatch();
});

$('startbtn').addEventListener('click', resetMatch);
$('againbtn').addEventListener('click', resetMatch);
$('newbtn').addEventListener('click', resetMatch);
$('jumpbtn').addEventListener('click', function () { jump(player); });
$('diffbtn').addEventListener('click', function () {
  diff = (diff + 1) % 3;
  $('diffbtn').textContent = '🎚 ' + DIFF_CN[diff];
});
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」' + my + ':' + aiScore + ' 打完了比赛! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/'; });
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}

window.__T = {
  state: function () { return state; },
  start: resetMatch,
  step: function (n) { for (var i = 0; i < (n || 1); i++) update(1 / 60); },
  score: function () { return my; },
  aiScore: function () { return aiScore; },
  ball: function () { return { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy }; },
  setBall: function (x, y, vx, vy) {
    ball.x = x; ball.y = y; ball.vx = vx || 0; ball.vy = vy || 0;
    hitCd = 0;
    player.hitCd = 0;
    ai.hitCd = 0;
    state = 'play';
  },
  player: function () { return { x: player.x, yOff: player.yOff, grounded: player.grounded }; },
  aiPos: function () { return { x: ai.x, yOff: ai.yOff }; },
  setPlayer: function (x, yOff) {
    player.x = x; player.targetX = x;
    if (yOff !== undefined) { player.yOff = yOff; player.grounded = yOff <= 0; }
  },
  setAI: function (x) { ai.x = x; ai.targetX = x; },
  jump: function () { jump(player); },
  serveSide: function () { return serveSide; },
  launch: launchServe,
  diff: function () { return diff; },
  setDiff: function (d) { diff = d % 3; },
  geometry: function () { return { LX: LX, RX: RX, NETX: NETX, floorY: floorY, netH: netH, courtW: courtW }; },
  setScore: function (a, b) { my = a; aiScore = b; syncHud(); },
  predict: predictLanding
};
resize();
layout();
player = makePlayer(0);
ai = makePlayer(1);
updMini();
syncHud();
run();

})();
</script>

<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';
  var name=(document.title||'游戏').split(/[ ··|]/)[0];


  // 结算页:晒战绩 + 换个游戏
  var over=document.getElementById('over');
  if(over){
    var box=document.createElement('div');
    box.style.cssText='display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px';
    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>


<!-- __hub_recent__ -->
<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='volleyball'});
  r.unshift({k:'volleyball',n:'沙滩排球 · 人机对战',e:'🏐'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['volleyball_best','volleyball_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['volleyball']||0)){
            B['volleyball']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
