<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='jigsaw_best',PLAY='jigsaw_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 拼图 · 碎景重圆 ================== */
var NAME = '拼图 · 碎景重圆';
var state = 'start';
var LEVELS = [
  { n: 3, sc: 0, name: '晨雾山谷' },
  { n: 4, sc: 1, name: '落日海滩' },
  { n: 5, sc: 2, name: '夜空星河' }
];
var lv = 0, n = 3, order = [], sel = -1, moves = 0, elapsed = 0, sec = 0;
var total = 0, lvScore = 0, doneT = 0, peekT = 0, noteTx = '', noteT = 0;
var BX = 0, BY = 0, SIDE = 300, CELL = 100;
var IMG = null, IMG_S = 600;

function rr(x, y, w, h, r) {
  var k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
function clock(s) {
  s = Math.max(0, Math.floor(s));
  var m = Math.floor(s / 60), r = s % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
}
function note(t) { noteTx = t; noteT = 1.8; }

function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function paintDawn(g, S, R) {
  var sky = g.createLinearGradient(0, 0, 0, S);
  sky.addColorStop(0, '#2c3e6b');
  sky.addColorStop(.35, '#8a6ea8');
  sky.addColorStop(.62, '#ff9f7a');
  sky.addColorStop(1, '#ffe0b0');
  g.fillStyle = sky; g.fillRect(0, 0, S, S);
  var sx = S * .7, sy = S * .42, sr = S * .075;
  var gl = g.createRadialGradient(sx, sy, sr * .4, sx, sy, sr * 3.4);
  gl.addColorStop(0, 'rgba(255,246,200,.95)');
  gl.addColorStop(.4, 'rgba(255,200,120,.35)');
  gl.addColorStop(1, 'rgba(255,180,100,0)');
  g.fillStyle = gl; g.beginPath(); g.arc(sx, sy, sr * 3.4, 0, 6.2832); g.fill();
  g.fillStyle = '#fff3c4'; g.beginPath(); g.arc(sx, sy, sr, 0, 6.2832); g.fill();
  var i, k, y0;
  for (k = 0; k < 3; k++) {
    g.fillStyle = ['rgba(80,100,140,.75)', 'rgba(55,72,108,.9)', 'rgba(34,46,74,.98)'][k];
    g.beginPath();
    y0 = S * (.56 + k * .07);
    g.moveTo(0, S);
    g.lineTo(0, y0 + S * .06);
    for (i = 0; i <= 8; i++) {
      var x = i * S / 8;
      g.lineTo(x, y0 + Math.sin(i * 1.7 + k * 2.3) * S * .05 - R() * S * .03);
    }
    g.lineTo(S, S); g.closePath(); g.fill();
  }
  g.fillStyle = 'rgba(255,235,200,.28)';
  for (i = 0; i < 4; i++) {
    var fy = S * (.6 + i * .08);
    g.beginPath(); g.ellipse(S * (.3 + R() * .4), fy, S * .34, S * .02, 0, 0, 6.2832); g.fill();
  }
  g.fillStyle = '#26304a';
  g.beginPath(); g.moveTo(0, S * .8); g.lineTo(S * .18, S * .72); g.lineTo(S * .34, S * .8); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(30,30,50,.7)'; g.lineWidth = 2;
  for (i = 0; i < 5; i++) {
    var bx = S * (.18 + i * .11), by = S * (.18 + (i % 3) * .04);
    g.beginPath(); g.moveTo(bx - 7, by); g.quadraticCurveTo(bx, by - 6, bx + 7, by); g.stroke();
  }
}

function paintBeach(g, S, R) {
  var sky = g.createLinearGradient(0, 0, 0, S * .58);
  sky.addColorStop(0, '#3a2350');
  sky.addColorStop(.45, '#c85a6a');
  sky.addColorStop(.75, '#ff9a5c');
  sky.addColorStop(1, '#ffd08a');
  g.fillStyle = sky; g.fillRect(0, 0, S, S * .58);
  var sx = S * .58, sy = S * .5, sr = S * .085;
  var gl = g.createRadialGradient(sx, sy, sr, sx, sy, sr * 4);
  gl.addColorStop(0, 'rgba(255,220,140,.9)');
  gl.addColorStop(1, 'rgba(255,150,80,0)');
  g.fillStyle = gl; g.beginPath(); g.arc(sx, sy, sr * 4, 0, 6.2832); g.fill();
  g.fillStyle = '#ffe9a8'; g.beginPath(); g.arc(sx, sy, sr, 0, 6.2832); g.fill();
  var sea = g.createLinearGradient(0, S * .56, 0, S * .8);
  sea.addColorStop(0, '#2d7f9e');
  sea.addColorStop(1, '#17475f');
  g.fillStyle = sea; g.fillRect(0, S * .56, S, S * .26);
  g.strokeStyle = 'rgba(255,220,160,.55)'; g.lineWidth = 2;
  for (var i = 0; i < 14; i++) {
    var y = S * .57 + R() * S * .22;
    g.beginPath();
    g.moveTo(R() * S * .5, y);
    g.lineTo(R() * S * .5 + S * .5, y);
    g.stroke();
  }
  var sand = g.createLinearGradient(0, S * .8, 0, S);
  sand.addColorStop(0, '#f0d6a8');
  sand.addColorStop(1, '#dbb77f');
  g.fillStyle = sand; g.fillRect(0, S * .8, S, S * .2);
  g.fillStyle = 'rgba(160,120,70,.35)';
  for (i = 0; i < 40; i++) {
    g.beginPath(); g.arc(R() * S, S * .82 + R() * S * .16, 1.4 + R() * 2, 0, 6.2832); g.fill();
  }
  g.strokeStyle = '#2a2030'; g.lineWidth = S * .022;
  g.beginPath();
  g.moveTo(S * .16, S * .96);
  g.quadraticCurveTo(S * .12, S * .76, S * .19, S * .6);
  g.stroke();
  g.fillStyle = '#2a2030';
  for (i = 0; i < 6; i++) {
    var a = -Math.PI * .85 + i * .3;
    g.beginPath();
    g.moveTo(S * .19, S * .6);
    g.quadraticCurveTo(S * .19 + Math.cos(a) * S * .16, S * .6 + Math.sin(a) * S * .12 - 14,
      S * .19 + Math.cos(a) * S * .22, S * .6 + Math.sin(a) * S * .18 + 6);
    g.quadraticCurveTo(S * .19 + Math.cos(a) * S * .1, S * .6 + Math.sin(a) * S * .08 + 6, S * .19, S * .6);
    g.fill();
  }
}

function paintNight(g, S, R) {
  var sky = g.createLinearGradient(0, 0, 0, S);
  sky.addColorStop(0, '#040818');
  sky.addColorStop(.5, '#0d1a3b');
  sky.addColorStop(.85, '#1b2f55');
  sky.addColorStop(1, '#243b60');
  g.fillStyle = sky; g.fillRect(0, 0, S, S);
  var i;
  for (i = 0; i < 5; i++) {
    g.save();
    g.translate(S * .5, S * .42);
    g.rotate(-.6 + i * .03);
    var mg = g.createLinearGradient(-S * .6, 0, S * .6, 0);
    mg.addColorStop(0, 'rgba(120,150,255,0)');
    mg.addColorStop(.5, 'rgba(170,190,255,.16)');
    mg.addColorStop(1, 'rgba(120,150,255,0)');
    g.fillStyle = mg;
    g.beginPath(); g.ellipse(0, (i - 2) * S * .04, S * .62, S * .07, 0, 0, 6.2832); g.fill();
    g.restore();
  }
  for (i = 0; i < 130; i++) {
    g.fillStyle = 'rgba(255,255,255,' + (.25 + R() * .7) + ')';
    g.beginPath(); g.arc(R() * S, R() * S * .78, R() * 1.7 + .4, 0, 6.2832); g.fill();
  }
  var mx = S * .76, my = S * .2, mr = S * .072;
  var mg2 = g.createRadialGradient(mx, my, mr * .6, mx, my, mr * 2.6);
  mg2.addColorStop(0, 'rgba(220,235,255,.35)');
  mg2.addColorStop(1, 'rgba(220,235,255,0)');
  g.fillStyle = mg2; g.beginPath(); g.arc(mx, my, mr * 2.6, 0, 6.2832); g.fill();
  g.fillStyle = '#eaeffb'; g.beginPath(); g.arc(mx, my, mr, 0, 6.2832); g.fill();
  g.fillStyle = 'rgba(150,160,190,.4)';
  g.beginPath(); g.arc(mx - mr * .3, my - mr * .2, mr * .18, 0, 6.2832); g.fill();
  g.beginPath(); g.arc(mx + mr * .25, my + mr * .3, mr * .12, 0, 6.2832); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(S * .14, S * .12); g.lineTo(S * .28, S * .17); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(S * .1, S * .1); g.lineTo(S * .24, S * .17); g.stroke();
  g.fillStyle = '#0a1226';
  g.beginPath();
  g.moveTo(0, S);
  g.lineTo(0, S * .82);
  for (i = 0; i <= 10; i++) g.lineTo(i * S / 10, S * .82 + Math.sin(i * 1.3) * S * .04 - R() * S * .02);
  g.lineTo(S, S); g.closePath(); g.fill();
  g.fillStyle = 'rgba(180,210,255,.1)';
  g.beginPath(); g.ellipse(S * .3, S * .9, S * .3, S * .02, 0, 0, 6.2832); g.fill();
}

function paintForest(g, S, R) {
  var bg = g.createLinearGradient(0, 0, S * .4, S);
  bg.addColorStop(0, '#eaf6cf');
  bg.addColorStop(.45, '#a7d27b');
  bg.addColorStop(1, '#39602f');
  g.fillStyle = bg; g.fillRect(0, 0, S, S);
  g.save();
  g.globalCompositeOperation = 'lighter';
  for (var i = 0; i < 5; i++) {
    g.fillStyle = 'rgba(255,250,200,.14)';
    g.beginPath();
    g.moveTo(S * (.35 + i * .12), -S * .05);
    g.lineTo(S * (.5 + i * .12), -S * .05);
    g.lineTo(S * (.15 + i * .12), S);
    g.lineTo(S * (0 + i * .12), S);
    g.closePath(); g.fill();
  }
  g.restore();
  for (i = 0; i < 7; i++) {
    var tx = S * (.06 + i * .15) + R() * S * .03;
    var tw = S * (.02 + R() * .03);
    g.fillStyle = 'rgba(36,52,28,.9)';
    g.beginPath();
    g.moveTo(tx - tw, S);
    g.lineTo(tx - tw * .5, S * .3);
    g.lineTo(tx + tw * .5, S * .3);
    g.lineTo(tx + tw, S);
    g.closePath(); g.fill();
    for (var k = 0; k < 4; k++) {
      g.fillStyle = ['rgba(44,86,38,.95)', 'rgba(58,105,44,.9)', 'rgba(76,128,52,.85)', 'rgba(96,150,66,.8)'][k];
      g.beginPath();
      g.arc(tx + (R() - .5) * S * .1, S * (.1 + k * .1), S * (.09 + R() * .05), 0, 6.2832);
      g.fill();
    }
  }
  g.fillStyle = 'rgba(240,230,190,.9)';
  g.beginPath();
  g.moveTo(S * .42, S);
  g.quadraticCurveTo(S * .5, S * .72, S * .44, S * .55);
  g.quadraticCurveTo(S * .4, S * .42, S * .48, S * .3);
  g.quadraticCurveTo(S * .54, S * .42, S * .5, S * .56);
  g.quadraticCurveTo(S * .46, S * .74, S * .58, S);
  g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,255,255,.55)';
  for (i = 0; i < 16; i++) {
    g.beginPath(); g.arc(S * (.1 + R() * .8), S * (.1 + R() * .8), 1 + R() * 2, 0, 6.2832); g.fill();
  }
}

function buildScene(sc) {
  var c = document.createElement('canvas');
  c.width = IMG_S; c.height = IMG_S;
  var g = c.getContext('2d');
  var R = mulberry(9101 + sc * 733);
  if (sc === 0) paintDawn(g, IMG_S, R);
  else if (sc === 1) paintBeach(g, IMG_S, R);
  else if (sc === 2) paintNight(g, IMG_S, R);
  else paintForest(g, IMG_S, R);
  IMG = c;
}

function layout() {
  var top = Math.max(96, VH * .13);
  var bot = VH - 94;
  SIDE = Math.floor(Math.min(VW - 26, bot - top, 460));
  SIDE = Math.max(180, SIDE);
  CELL = SIDE / n;
  BX = Math.round((VW - SIDE) / 2);
  BY = Math.round(top + Math.max(0, (bot - top - SIDE) / 2));
}
function onResize() { layout(); }

function buildLevel(i) {
  lv = i;
  n = LEVELS[i].n;
  buildScene(LEVELS[i].sc);
  order = [];
  var totalN = n * n, k;
  for (k = 0; k < totalN; k++) order.push(k);
  var guard = 0;
  do {
    for (k = order.length - 1; k > 0; k--) {
      var j = Math.floor(Math.random() * (k + 1)), t = order[k]; order[k] = order[j]; order[j] = t;
    }
    guard++;
    var right = 0;
    for (k = 0; k < totalN; k++) if (order[k] === k) right++;
  } while ((right === totalN || right > totalN * .4) && guard < 40);
  sel = -1; moves = 0; elapsed = 0; sec = 0; doneT = 0; peekT = 0;
  layout();
  note(LEVELS[i].name + ' · ' + n + '×' + n + ',点两块交换');
  syncHud();
}

function syncHud() {
  $('hlv').textContent = (lv + 1) + '/' + LEVELS.length;
  $('hmove').textContent = moves;
  $('htime').textContent = clock(sec);
  $('hscore').textContent = total;
}

function resetGame() {
  state = 'play';
  total = 0;
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  buildLevel(0);
}

function tapTile(i) {
  if (state !== 'play' || doneT > 0 || i < 0) return;
  if (sel < 0) { sel = i; tone(430, .04, 'triangle', .03); return; }
  if (sel === i) { sel = -1; tone(300, .04, 'triangle', .025); return; }
  var t = order[sel]; order[sel] = order[i]; order[i] = t;
  sel = -1; moves++;
  tone(520, .05, 'triangle', .04);
  syncHud();
  var done = true, k;
  for (k = 0; k < order.length; k++) if (order[k] !== k) { done = false; break; }
  if (done) levelDone();
}

function levelDone() {
  var base = [240, 420, 640][lv] || 400;
  lvScore = base + Math.max(0, 260 - moves * 6) + Math.max(0, 420 - sec * 3);
  total += lvScore;
  doneT = 1.1;
  peekT = 0;
  tone(660, .1, 'triangle', .06);
  setTimeout(function () { tone(880, .16, 'triangle', .06) }, 140);
  note('完成! 本关 ' + lvScore + ' 分');
  syncHud();
}

function finish() {
  state = 'over';
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(total);
  var rank = total >= 2200 ? '🖼 拼图大师' : total >= 1600 ? '🧩 眼力高手' : total >= 900 ? '🎨 拼图学徒' : '🌱 刚上手';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '总分 <b>' + total + '</b><br>' +
    '3 幅图全部拼完<br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '先拼四个角,再按颜色和线条一块块补,速度会越来越快';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
}

function update(dt) {
  if (noteT > 0) noteT -= dt;
  if (peekT > 0) peekT -= dt;
  if (state !== 'play') return;
  if (doneT > 0) {
    doneT -= dt;
    if (doneT <= 0) {
      if (lv + 1 >= LEVELS.length) finish();
      else buildLevel(lv + 1);
    }
    return;
  }
  elapsed += dt;
  var s2 = Math.floor(elapsed);
  if (s2 !== sec) { sec = s2; $('htime').textContent = clock(sec); }
}

function draw() {
  var gr = ctx.createLinearGradient(0, 0, 0, VH);
  gr.addColorStop(0, '#20202e');
  gr.addColorStop(1, '#101018');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, VW, VH);

  if (!IMG) return;
  var gap = Math.max(1.5, CELL * .012);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  rr(BX - 6, BY - 6, SIDE + 12, SIDE + 12, 12); ctx.fill();

  for (var pos = 0; pos < order.length; pos++) {
    var tile = order[pos];
    var tc = tile % n, tr = tile / n | 0;
    var dc = pos % n, dr = pos / n | 0;
    var dx = BX + dc * CELL + gap, dy = BY + dr * CELL + gap;
    var dw = CELL - gap * 2;
    ctx.drawImage(IMG, tc * (IMG_S / n) + 1, tr * (IMG_S / n) + 1, IMG_S / n - 2, IMG_S / n - 2, dx, dy, dw, dw);
    ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1;
    ctx.strokeRect(dx + .5, dy + .5, dw - 1, dw - 1);
  }
  if (sel >= 0) {
    var sc = sel % n, sr = sel / n | 0;
    ctx.strokeStyle = 'rgba(255,212,92,.95)'; ctx.lineWidth = 3;
    ctx.strokeRect(BX + sc * CELL + 2, BY + sr * CELL + 2, CELL - 4, CELL - 4);
    ctx.fillStyle = 'rgba(255,212,92,.14)';
    ctx.fillRect(BX + sc * CELL + 2, BY + sr * CELL + 2, CELL - 4, CELL - 4);
  }

  if (peekT > 0) {
    var pw = Math.min(SIDE * .8, VW * .8);
    var px = (VW - pw) / 2, py = (VH - pw) / 2;
    ctx.fillStyle = 'rgba(0,0,0,.72)';
    ctx.fillRect(0, 0, VW, VH);
    ctx.drawImage(IMG, 0, 0, IMG_S, IMG_S, px, py, pw, pw);
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3;
    ctx.strokeRect(px, py, pw, pw);
    ctx.fillStyle = '#fff';
    ctx.font = '700 14px "PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('原图 · ' + LEVELS[lv].name, VW / 2, py - 18);
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  var tip = doneT > 0 ? '✓ 拼好了,进入下一幅…' : '点一块,再点另一块交换位置';
  ctx.fillText(tip, VW / 2, BY + SIDE + 24);

  if (noteT > 0 && noteTx) {
    ctx.globalAlpha = Math.min(1, noteT / .5);
    ctx.fillStyle = 'rgba(255,212,92,.95)';
    ctx.font = '700 14px "PingFang SC",sans-serif';
    ctx.fillText(noteTx, VW / 2, BY - 18);
    ctx.globalAlpha = 1;
  }
}

cv.addEventListener('pointerdown', function (e) { e.preventDefault() });
cv.addEventListener('pointerup', function (e) {
  e.preventDefault();
  if (state !== 'play' || peekT > 0) return;
  var c = Math.floor((e.clientX - BX) / CELL), r = Math.floor((e.clientY - BY) / CELL);
  if (c < 0 || c >= n || r < 0 || r >= n) return;
  tapTile(r * n + c);
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === 'p' || e.key === 'P') { peekT = 2.5; }
});
window.addEventListener('pointerdown', function () { peekT = 0; });

function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}

$('startbtn').addEventListener('click', resetGame);
$('againbtn').addEventListener('click', resetGame);
$('peekbtn').addEventListener('click', function () {
  if (state === 'play' && doneT <= 0) peekT = peekT > 0 ? 0 : 2.5;
});
$('resetbtn').addEventListener('click', function () {
  if (state === 'play') { buildLevel(lv); }
});
$('newbtn').addEventListener('click', resetGame);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」3 幅图拼了 ' + total + ' 分! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  scene: function (sc) { buildScene(sc); return IMG_S; },
  levels: LEVELS,
  tap: tapTile,
  order: function () { return order; },
  size: function () { return n; },
  state: function () { return state; },
  total: function () { return total; }
};

resize();
updMini();
syncHud();
run();

})();
</script>

<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';

  // 结算页:晒战绩 + 换个游戏

    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='jigsaw'});
  r.unshift({k:'jigsaw',n:'拼图 · 碎景重圆',e:'🧩'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['jigsaw_best','jigsaw_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['jigsaw']||0)){
            B['jigsaw']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
