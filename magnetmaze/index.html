<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='magnetmaze_best',PLAY='magnetmaze_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 磁力迷宫 · 极性导航 ================== */
var NAME = '磁力迷宫 · 极性导航';
var state = 'start';
var COLS = 10, ROWS = 10;
var grid = [];                   /* 0空 1墙 */
var ball = { x: 0, y: 0 };
var magnets = [];                /* {x,y,pol:1吸引/-1排斥} */
var goal = { x: 0, y: 0 };
var level = 0, steps = 0, minSteps = 0;
var winT = 0, msg = '', msgT = 0;
var CS = 0, BX = 0, BY = 0;

var LEVELS = [
  { w: [], m: [[7, 5, 1]], b: [2, 5], g: [8, 5], min: 3 },
  { w: [[4, 0, 4, 4], [6, 6, 6, 10]], m: [[8, 3, 1], [2, 8, -1]], b: [1, 5], g: [8, 8], min: 5 },
  { w: [[3, 2, 3, 6], [5, 2, 5, 6], [7, 2, 7, 6]], m: [[4, 1, 1], [6, 8, -1]], b: [1, 4], g: [8, 4], min: 6 },
  { w: [[2, 0, 2, 3], [2, 5, 2, 10], [6, 0, 6, 4], [6, 6, 6, 10]], m: [[4, 2, 1], [4, 8, -1]], b: [0, 5], g: [9, 5], min: 6 },
  { w: [[4, 0, 4, 3], [4, 5, 4, 8], [7, 0, 7, 3], [7, 5, 7, 8]], m: [[5, 4, 1], [1, 4, -1]], b: [2, 1], g: [8, 7], min: 8 },
  { w: [[3, 0, 3, 3], [3, 4, 3, 7], [3, 8, 3, 10], [6, 0, 6, 3], [6, 4, 6, 7], [6, 8, 6, 10]], m: [[4, 1, 1], [4, 5, 1], [4, 9, -1]], b: [1, 5], g: [8, 5], min: 8 },
  { w: [[2, 0, 2, 2], [2, 3, 2, 5], [2, 6, 2, 8], [5, 0, 5, 2], [5, 3, 5, 5], [5, 6, 5, 8], [8, 0, 8, 2], [8, 3, 8, 5], [8, 6, 8, 8]], m: [[3, 1, 1], [6, 4, 1], [3, 7, -1]], b: [0, 4], g: [9, 4], min: 8 },
  { w: [[1, 1, 8, 1], [1, 8, 8, 8], [4, 1, 4, 3], [6, 6, 6, 8]], m: [[2, 2, 1], [7, 7, 1]], b: [0, 0], g: [9, 9], min: 10 },
  { w: [[1, 1, 8, 1], [1, 8, 8, 8], [1, 1, 1, 8], [8, 1, 8, 8], [4, 1, 4, 4], [6, 5, 6, 8]], m: [[2, 2, 1], [7, 2, 1], [2, 7, 1], [7, 7, 1]], b: [0, 0], g: [9, 9], min: 12 },
  { w: [[1, 1, 8, 1], [1, 8, 8, 8], [2, 2, 7, 2], [2, 7, 7, 7], [4, 1, 4, 8]], m: [[0, 4, 1], [9, 4, -1], [4, 0, 1], [4, 9, -1]], b: [0, 0], g: [9, 9], min: 15 }
];

function layout() {
  CS = Math.floor(Math.min((VW - 24) / COLS, (VH - 180) / ROWS));
  BX = Math.round((VW - CS * COLS) / 2);
  BY = Math.max(120, VH * .14);
}
function onResize() { loadLevel(level); }

function idx(x, y) { return y * COLS + x; }
function loadLevel(n) {
  var L = LEVELS[n];
  grid = [];
  var i;
  for (i = 0; i < COLS * ROWS; i++) grid.push(0);
  L.w.forEach(function (w2) {
    for (var x = w2[0]; x <= w2[2]; x++)
      for (var y = w2[1]; y <= w2[3]; y++)
        if (x >= 0 && x < COLS && y >= 0 && y < ROWS) grid[idx(x, y)] = 1;
  });
  magnets = L.m.map(function (m2) { return { x: m2[0], y: m2[1], pol: m2[2] }; });
  ball = { x: L.b[0], y: L.b[1] };
  goal = { x: L.g[0], y: L.g[1] };
  steps = 0; minSteps = L.min;
  syncHud();
}
function resetGame() { level = 0; loadLevel(0); }
function startGame() { resetGame(); state = 'play'; $('start').classList.add('hide'); $('over').classList.add('hide'); $('padbar').classList.remove('hide'); syncHud(); }
function endGame() { state = 'over'; winT = 1; KIT.addPlay(); KIT.streak(); var rec = KIT.setBest(score); var rank = level >= 10 ? '磁力大师' : level >= 6 ? '电磁达人' : '初学乍练'; $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '通过 <b>' + level + '/10</b> 关<br>本局得分 <b>' + score + '</b><br>' + rank + '<br>历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '排斥力做精调,吸引力做大移动'; $('padbar').classList.add('hide'); $('over').classList.remove('hide'); tone(760, .3, 'sine', .07, 1200); }
var score = 0;
function syncHud() { $('hlv').textContent = (level + 1) + '/10'; $('hstep').textContent = steps; $('hmin').textContent = minSteps; }
function toggleMag(i) { if (state !== 'play') return; magnets[i].pol = -magnets[i].pol; steps++; tone(magnets[i].pol > 0 ? 480 : 320, .07, 'sine', .045); syncHud(); }
function moveBall() {
  var fx = 0, fy = 0, i;
  for (i = 0; i < magnets.length; i++) {
    var m = magnets[i];
    var dx = m.x - ball.x, dy = m.y - ball.y;
    var d = Math.hypot(dx, dy) || 1;
    var force = m.pol * 2.2 / (d * d * .06);
    fx += dx / d * force; fy += dy / d * force;
  }
  ball.x += Math.round(clamp(fx, -2, 2));
  ball.y += Math.round(clamp(fy, -2, 2));
  ball.x = clamp(ball.x, 0, COLS - 1); ball.y = clamp(ball.y, 0, ROWS - 1);
  if (grid[idx(ball.x, ball.y)] === 1) {
    /* 回退 */
    ball.x = clamp(ball.x - Math.round(clamp(fx, -2, 2)), 0, COLS - 1);
    ball.y = clamp(ball.y - Math.round(clamp(fy, -2, 2)), 0, ROWS - 1);
    if (grid[idx(ball.x, ball.y)] === 1) { ball.x = clamp(ball.x + 1, 0, COLS - 1); }
  }
  syncHud();
  if (ball.x === goal.x && ball.y === goal.y) {
    score += Math.max(100, 300 - steps * 10);
    if (level >= LEVELS.length - 1) { syncHud(); endGame(); return; }
    setTimeout(function() { if (state !== 'play') return; level++; loadLevel(level); }, 800);
  }
}
function update(dt) { if (msgT > 0) msgT -= dt; if (winT > 0) winT -= dt; }
function rr(x, y, w, h, rad) { var k = Math.min(rad, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + k, y); ctx.arcTo(x + w, y, x + w, y + h, k); ctx.arcTo(x + w, y + h, x, y + h, k); ctx.arcTo(x, y + h, x, y, k); ctx.arcTo(x, y, x + w, y, k); ctx.closePath(); }
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH); bg.addColorStop(0, '#0e1020'); bg.addColorStop(1, '#060814');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  var r, c, i;
  for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) {
    var x = BX + c * CS, y = BY + r * CS;
    ctx.fillStyle = grid[idx(c, r)] === 1 ? 'rgba(80,100,160,.3)' : 'rgba(255,255,255,.04)';
    rr(x + 1, y + 1, CS - 2, CS - 2, 4); ctx.fill();
  }
  /* 终点 */
  ctx.strokeStyle = '#58d878'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(BX + goal.x * CS + CS / 2, BY + goal.y * CS + CS / 2, CS * .38, 0, Math.PI * 2); ctx.stroke();
  /* 磁铁 */
  for (i = 0; i < magnets.length; i++) {
    var m = magnets[i];
    var mx = BX + m.x * CS + CS / 2, my = BY + m.y * CS + CS / 2;
    drawEm(m.pol > 0 ? '🔴' : '🔵', mx, my, CS * .6);
    ctx.font = '900 ' + Math.round(CS * .24) + 'px "PingFang SC",sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(m.pol > 0 ? '吸' : '斥', mx, my + CS * .35);
  }
  /* 铁球 */
  var bx2 = BX + ball.x * CS + CS / 2, by2 = BY + ball.y * CS + CS / 2;
  ctx.fillStyle = '#c0c0d8';
  ctx.beginPath(); ctx.arc(bx2, by2, CS * .26, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(bx2, by2, CS * .26, 0, Math.PI * 2); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = msgT > 0 ? 'rgba(255,220,120,.95)' : 'rgba(216,220,255,.55)';
  ctx.fillText(msg || '点磁铁切换极性!', VW / 2, VH - 52);
}
cv.addEventListener('pointerdown', function(e) {
  e.preventDefault();
  if (state !== 'play') return;
  var i;
  for (i = 0; i < magnets.length; i++) {
    var mx = BX + magnets[i].x * CS + CS / 2;
    var my = BY + magnets[i].y * CS + CS / 2;
    if (Math.hypot(e.clientX - mx, e.clientY - my) < CS * .5) { toggleMag(i); moveBall(); return; }
  }
});
window.addEventListener('keydown', function(e) { if (e.target && e.target.tagName === 'BUTTON') return; if (e.key === 'r' || e.key === 'R') { e.preventDefault(); loadLevel(level); } });
function updMini() { $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局'; }
$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', startGame);
$('retrybtn').addEventListener('click', function() { loadLevel(level); });
$('newbtn').addEventListener('click', function() { if (state === 'play' && level < LEVELS.length - 1) { level++; loadLevel(level); } });
$('sharebtn').addEventListener('click', function() { share('我在「' + NAME + '」通了 ' + level + '/10 关磁力迷宫! ' + location.href.split('#')[0]); });
$('hubbtn').addEventListener('click', function() { location.href = '/' });
window.__T = { magnets: function() { return magnets.map(function(m) { return m.pol; }); }, toggleMag: toggleMag, ball: function() { return { x: ball.x, y: ball.y }; }, goal: function() { return goal; }, level: function() { return level; }, setLevel: function(n) { level = n; loadLevel(n); }, state: function() { return state; } };
resize(); resetGame(); $('padbar').classList.add('hide'); updMini(); run();

})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='magnetmaze'});
  r.unshift({k:'magnetmaze',n:'磁力迷宫 · 极性导航',e:'🧲'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['magnetmaze_best','magnetmaze_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['magnetmaze']||0)){
            B['magnetmaze']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
