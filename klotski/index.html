<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='klotski_best',PLAY='klotski_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 曹操逃生 · 经典华容道 ================== */
var NAME = '曹操逃生 · 经典华容道';
var state = 'start';
var pieces = [], steps = 0, hints = 0, undoStack = [], selected = 0;
var drag = null, hintMove = null, hintT = 0, flashT = 0, winT = 0;
var BX = 0, BY = 0, CS = 56, statusY = 0;
var bestMoves = +lsGet('klotski_movebest', 0);

var CLASSIC = [
  { x: 1, y: 0, w: 2, h: 2, name: '曹操', cls: 'cao' },
  { x: 0, y: 0, w: 1, h: 2, name: '张飞', cls: 'gen' },
  { x: 3, y: 0, w: 1, h: 2, name: '赵云', cls: 'gen' },
  { x: 0, y: 2, w: 1, h: 2, name: '马超', cls: 'gen' },
  { x: 3, y: 2, w: 1, h: 2, name: '黄忠', cls: 'gen' },
  { x: 1, y: 2, w: 2, h: 1, name: '关羽', cls: 'gen' },
  { x: 1, y: 3, w: 1, h: 1, name: '兵', cls: 'sol' },
  { x: 2, y: 3, w: 1, h: 1, name: '兵', cls: 'sol' },
  { x: 0, y: 4, w: 1, h: 1, name: '兵', cls: 'sol' },
  { x: 3, y: 4, w: 1, h: 1, name: '兵', cls: 'sol' }
];

function layout() {
  var top = Math.max(78, VH * .1);
  var pad = VW < 360 ? 112 : 58;
  var bottom = VH - pad - 64;
  CS = Math.floor(Math.min((VW - 44) / 4, (bottom - top) / 5));
  CS = Math.max(40, CS);
  var bw = CS * 4, bh = CS * 5;
  BX = Math.round((VW - bw) / 2);
  BY = Math.round(top + Math.max(0, (bottom - top - bh) * .5));
  statusY = BY + bh + 38;
}
function onResize() { layout(); }

function clone(list) {
  return list.map(function (p) { return { x: p.x, y: p.y, w: p.w, h: p.h, name: p.name, cls: p.cls }; });
}
function resetClassic() {
  pieces = clone(CLASSIC);
  steps = 0; hints = 0; undoStack = []; selected = 0;
  drag = null; hintMove = null; hintT = 0; flashT = 0; winT = 0;
  solveCache = {};
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}
function resetGame() { resetClassic(); }

function syncHud() {
  $('hstep').textContent = steps;
  $('hbest').textContent = bestMoves > 0 ? bestMoves : '--';
  $('hhint').textContent = hints;
}
function pieceAt(x, y) {
  var i;
  for (i = 0; i < pieces.length; i++) {
    var p = pieces[i];
    if (x >= p.x && x < p.x + p.w && y >= p.y && y < p.y + p.h) return p;
  }
  return null;
}
function occupiedBy(x, y, skip) {
  var i;
  if (x < 0 || x > 3 || y < 0 || y > 4) return true;
  for (i = 0; i < pieces.length; i++) {
    var p = pieces[i];
    if (p === skip) continue;
    if (x >= p.x && x < p.x + p.w && y >= p.y && y < p.y + p.h) return true;
  }
  return false;
}
function canMove(p, dx, dy) {
  var x, y;
  for (y = p.y; y < p.y + p.h; y++) for (x = p.x; x < p.x + p.w; x++) {
    var nx = x + dx, ny = y + dy;
    if (nx < 0 || nx > 3 || ny < 0 || ny > 4) return false;
    if (occupiedBy(nx, ny, p)) return false;
  }
  return true;
}
function applyPieceMove(p, dx, dy) {
  p.x += dx; p.y += dy;
}
function movePiece(id, dx, dy, record) {
  var p = pieces[id];
  if (!p || state !== 'play' || !dx && !dy) return false;
  if (Math.abs(dx) + Math.abs(dy) !== 1) return false;
  if (!canMove(p, dx, dy)) return false;
  applyPieceMove(p, dx, dy);
  if (record !== false) {
    steps++;
    undoStack.push({ id: id, dx: dx, dy: dy });
    tone(340 + (steps % 4) * 30, .045, 'sine', .03);
    hintMove = null; hintT = 0;
    syncHud();
    checkWin();
  }
  selected = id;
  return true;
}
function checkWin() {
  var cao = pieces[0];
  if (cao.x !== 1 || cao.y !== 3) return false;
  if (state !== 'play') return true;
  state = 'over';
  winT = .5;
  var score = Math.max(100, 1500 - steps * 8 - hints * 60);
  if (!bestMoves || steps < bestMoves) {
    bestMoves = steps;
    lsSet('klotski_movebest', bestMoves);
  }
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '<b>曹操脱身!</b><br>' +
    '用了 ' + steps + ' 步 · 提示 ' + hints + ' 次<br>' +
    '最佳步数 ' + bestMoves + '<br>' +
    '本局得分 ' + score + '<br>历史最高 ' + KIT.best() + ' · 已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '步数越少分越高,试试不用提示自己推出来';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  syncHud();
  tone(520, .1, 'triangle', .06, 780);
  setTimeout(function () { tone(780, .14, 'triangle', .05, 1040); }, 130);
  return true;
}

function gridOf(list) {
  var g = [], i;
  for (i = 0; i < 20; i++) g.push('.');
  for (i = 0; i < list.length; i++) {
    var p = list[i], code = p.w === 2 && p.h === 2 ? 'A' : p.w === 2 ? 'B' : p.h === 2 ? 'C' : 'D';
    var x, y;
    for (y = p.y; y < p.y + p.h; y++) for (x = p.x; x < p.x + p.w; x++) g[y * 4 + x] = code;
  }
  return g.join('');
}
function blocksOf(s) {
  var seen = [], blocks = [], i;
  for (i = 0; i < 20; i++) seen.push(false);
  for (i = 0; i < 20; i++) {
    if (seen[i] || s.charAt(i) === '.') continue;
    var x = i % 4, y = Math.floor(i / 4), code = s.charAt(i);
    var w = code === 'A' || code === 'B' ? 2 : 1;
    var h = code === 'A' || code === 'C' ? 2 : 1;
    var xx, yy;
    for (yy = y; yy < y + h; yy++) for (xx = x; xx < x + w; xx++) seen[yy * 4 + xx] = true;
    blocks.push({ x: x, y: y, w: w, h: h, code: code });
  }
  return blocks;
}
function slideState(s, b, dx, dy) {
  if (b.x + dx < 0 || b.x + b.w - 1 + dx > 3 || b.y + dy < 0 || b.y + b.h - 1 + dy > 4) return null;
  var g = s.split(''), x, y;
  /* 先把这块自己的格子腾空,否则多格块的目标会撞上自己的旧格子,永远判为不能移动 */
  for (y = b.y; y < b.y + b.h; y++) for (x = b.x; x < b.x + b.w; x++) g[y * 4 + x] = '.';
  for (y = b.y; y < b.y + b.h; y++) for (x = b.x; x < b.x + b.w; x++) {
    if (g[(y + dy) * 4 + x + dx] !== '.') return null;
  }
  for (y = b.y; y < b.y + b.h; y++) for (x = b.x; x < b.x + b.w; x++) g[(y + dy) * 4 + x + dx] = b.code;
  return g.join('');
}
/* 曹操 2x2 必须整体落在出口 (1,3)-(2,4);只看左上角会把 (1,2) 的位置误判成通关 */
function isGoalState(s) {
  return s.charAt(13) === 'A' && s.charAt(14) === 'A' && s.charAt(17) === 'A' && s.charAt(18) === 'A';
}

var solveCache = {};
function solveFrom(list) {
  var start = gridOf(list);
  if (isGoalState(start)) return [];
  if (solveCache[start]) return solveCache[start];
  var queue = [start], head = 0, seen = {}, parent = {}, pmove = {};
  seen[start] = 1;
  var found = null, guard = 0;
  while (head < queue.length && guard++ < 80000) {
    var s = queue[head++];
    var blocks = blocksOf(s), i;
    for (i = 0; i < blocks.length; i++) {
      var b = blocks[i], d;
      for (d = 0; d < 4; d++) {
        var dx = [0, 1, 0, -1][d], dy = [-1, 0, 1, 0][d];
        var ns = slideState(s, b, dx, dy);
        if (!ns || seen[ns]) continue;
        seen[ns] = 1;
        parent[ns] = s;
        pmove[ns] = { x: b.x, y: b.y, w: b.w, h: b.h, dx: dx, dy: dy };
        if (isGoalState(ns)) { found = ns; break; }
        queue.push(ns);
      }
      if (found) break;
    }
    if (found) break;
  }
  if (!found) return null;
  var path = [], cur = found;
  while (cur !== start) {
    path.push(pmove[cur]);
    cur = parent[cur];
  }
  path.reverse();
  solveCache[start] = path;
  return path;
}
function canMoveIn(list, i, dx, dy) {
  var p = list[i], nx = p.x + dx, ny = p.y + dy;
  if (nx < 0 || ny < 0 || nx + p.w > 4 || ny + p.h > 5) return false;
  var j;
  for (j = 0; j < list.length; j++) {
    if (j === i) continue;
    var q = list[j];
    if (nx < q.x + q.w && q.x < nx + p.w && ny < q.y + q.h && q.y < ny + p.h) return false;
  }
  return true;
}
function shuffleBoard() {
  var list = clone(CLASSIC), n, i;
  for (n = 0; n < 34; n++) {
    var all = [];
    for (i = 0; i < list.length; i++) {
      var d;
      for (d = 0; d < 4; d++) {
        var dx = [0, 1, 0, -1][d], dy = [-1, 0, 1, 0][d];
        if (canMoveIn(list, i, dx, dy)) all.push({ id: i, dx: dx, dy: dy });
      }
    }
    if (!all.length) break;
    var mv = pick(all);
    list[mv.id].x += mv.dx; list[mv.id].y += mv.dy;
  }
  if (list[0].x === 1 && list[0].y === 3) { list[0].x = 1; list[0].y = 0; }
  pieces = list;
  steps = 0; hints = 0; undoStack = []; selected = 0;
  drag = null; hintMove = null; hintT = 0; state = 'play';
  solveCache = {};
  syncHud();
  tone(480, .08, 'sine', .04, 620);
}

function doHint() {
  if (state !== 'play') return false;
  var path = solveFrom(pieces);
  if (!path || !path.length) {
    hintMove = null;
    return false;
  }
  hints++;
  var m = path[0];
  var id = -1, i;
  for (i = 0; i < pieces.length; i++) {
    var p = pieces[i];
    if (p.x === m.x && p.y === m.y && p.w === m.w && p.h === m.h) { id = i; break; }
  }
  selected = id;
  hintMove = { id: id, dx: m.dx, dy: m.dy };
  hintT = 2.4;
  syncHud();
  tone(700, .06, 'sine', .035);
  return true;
}
function undo() {
  if (state !== 'play' || !undoStack.length) return false;
  var m = undoStack.pop();
  pieces[m.id].x -= m.dx;
  pieces[m.id].y -= m.dy;
  steps = Math.max(0, steps - 1);
  selected = m.id;
  hintMove = null; hintT = 0;
  syncHud();
  tone(280, .05, 'sine', .03);
  return true;
}

function boardCoord(x, y) {
  return { x: Math.floor((x - BX) / CS), y: Math.floor((y - BY) / CS) };
}
function tryDrag(x, y) {
  if (!drag) return;
  var dx = x - drag.px, dy = y - drag.py;
  var th = CS * .42;
  if (Math.abs(dx) < th && Math.abs(dy) < th) return;
  if (Math.abs(dx) >= Math.abs(dy)) {
    dx = dx > 0 ? 1 : -1; dy = 0;
  } else {
    dx = 0; dy = dy > 0 ? 1 : -1;
  }
  if (movePiece(drag.id, dx, dy, true)) {
    drag.px += dx * CS;
    drag.py += dy * CS;
  } else {
    drag.px = x; drag.py = y;
  }
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  var c = boardCoord(e.clientX, e.clientY);
  var p = pieceAt(c.x, c.y);
  if (p) {
    var id = pieces.indexOf(p);
    selected = id;
    drag = { id: id, px: e.clientX, py: e.clientY, cell: c };
    hintMove = null; hintT = 0;
  } else if (selected >= 0) {
    var s = pieces[selected];
    var dx = 0, dy = 0;
    if (c.x === s.x - 1) dx = -1;
    else if (c.x === s.x + s.w) dx = 1;
    else if (c.y === s.y - 1) dy = -1;
    else if (c.y === s.y + s.h) dy = 1;
    if (dx || dy) movePiece(selected, dx, dy, true);
  }
});
cv.addEventListener('pointermove', function (e) { e.preventDefault(); tryDrag(e.clientX, e.clientY); });
cv.addEventListener('pointerup', function (e) { e.preventDefault(); drag = null; });
cv.addEventListener('pointercancel', function () { drag = null; });

window.addEventListener('keydown', function (e) {
  if (state !== 'play') return;
  var map = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] };
  var k = map[e.key];
  if (k) { movePiece(selected, k[0], k[1], true); e.preventDefault(); }
  if (e.key === 'h' || e.key === 'H') doHint();
  if (e.key === 'u' || e.key === 'U') undo();
  if (e.key === 'r' || e.key === 'R') resetClassic();
});

function rr(x, y, w, h, r) {
  var k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#2a1a0b');
  bg.addColorStop(1, '#120a04');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, VW, VH);

  var bw = CS * 4, bh = CS * 5;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.55)';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#c99b5e';
  rr(BX - 12, BY - 12, bw + 24, bh + 24, 12);
  ctx.fill();
  ctx.restore();
  var wg = ctx.createLinearGradient(BX, BY, BX, BY + bh);
  wg.addColorStop(0, '#8a6134');
  wg.addColorStop(1, '#6d4826');
  ctx.fillStyle = wg;
  rr(BX, BY, bw, bh, 6);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,225,170,.12)';
  ctx.lineWidth = 1;
  var i;
  for (i = 1; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(BX + i * CS, BY); ctx.lineTo(BX + i * CS, BY + bh); ctx.stroke();
  }
  for (i = 1; i < 5; i++) {
    ctx.beginPath(); ctx.moveTo(BX, BY + i * CS); ctx.lineTo(BX + bw, BY + i * CS); ctx.stroke();
  }

  ctx.fillStyle = 'rgba(255,215,120,.75)';
  ctx.font = '700 12px "PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('出口', BX + CS * 1.5, BY + bh + 16);
  ctx.strokeStyle = 'rgba(255,215,120,.55)';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(BX + CS + 6, BY + bh + 3);
  ctx.lineTo(BX + CS * 2 - 6, BY + bh + 3);
  ctx.stroke();
  ctx.setLineDash([]);

  for (i = 0; i < pieces.length; i++) {
    var p = pieces[i];
    var x = BX + p.x * CS + 3, y = BY + p.y * CS + 3;
    var w = p.w * CS - 6, h = p.h * CS - 6;
    var g = ctx.createLinearGradient(x, y, x, y + h);
    if (p.cls === 'cao') { g.addColorStop(0, '#d94b3f'); g.addColorStop(1, '#8d2118'); }
    else if (p.cls === 'sol') { g.addColorStop(0, '#d9a95e'); g.addColorStop(1, '#a8752e'); }
    else { g.addColorStop(0, '#3d7d9c'); g.addColorStop(1, '#21485f'); }
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.4)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 3;
    ctx.fillStyle = g;
    rr(x, y, w, h, 8);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = selected === i ? '#ffe36a' : 'rgba(255,255,255,.22)';
    ctx.lineWidth = selected === i ? 3 : 1.4;
    rr(x, y, w, h, 8);
    ctx.stroke();
    if (hintMove && hintMove.id === i) {
      ctx.strokeStyle = 'rgba(255,225,90,' + (.55 + Math.sin(performanceSafe() / 120) * .3) + ')';
      ctx.lineWidth = 3;
      rr(x - 2, y - 2, w + 4, h + 4, 10);
      ctx.stroke();
      var ax = x + w / 2 + hintMove.dx * CS * .42;
      var ay = y + h / 2 + hintMove.dy * CS * .42;
      ctx.fillStyle = '#ffe36a';
      ctx.beginPath();
      ctx.arc(ax, ay, 7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#fff4dc';
    var fs = Math.floor(Math.min(w, h) * (p.w === 2 && p.h === 2 ? .34 : p.w === 1 && p.h === 1 ? .48 : .3));
    ctx.font = '800 ' + Math.max(13, fs) + 'px "KaiTi","STKaiti","PingFang SC",serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (p.w === 1 && p.h === 2) {
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);
      ctx.fillText(p.name.charAt(0), 0, 0);
      ctx.restore();
    } else {
      ctx.fillText(p.name, x + w / 2, y + h / 2 + 1);
    }
  }

  if (state === 'play') {
    ctx.fillStyle = 'rgba(255,235,200,.6)';
    ctx.font = '600 12px "PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('拖动棋子滑进空格 · 把曹操送到出口', VW / 2, statusY);
  }
}
function performanceSafe() {
  return (typeof performance !== 'undefined' && performance.now) ? performance.now() : new Date().getTime();
}

$('startbtn').addEventListener('click', resetGame);
$('againbtn').addEventListener('click', function () {
  if (state === 'over') shuffleBoard();
  else resetClassic();
});
$('newbtn').addEventListener('click', resetClassic);
$('hintbtn').addEventListener('click', doHint);
$('shufflebtn').addEventListener('click', function () { if (state === 'play') shuffleBoard(); });
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」用 ' + steps + ' 步把曹操送出了华容道! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/'; });
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 最佳 <b>' + (bestMoves || '--') + '</b> 步';
}

window.__T = {
  pieces: function () { return pieces.map(function (p) { return { x: p.x, y: p.y, w: p.w, h: p.h, name: p.name }; }); },
  move: function (id, dx, dy) { return movePiece(id, dx, dy, true); },
  canMove: function (id, dx, dy) { return canMove(pieces[id], dx, dy); },
  solve: function () { return solveFrom(pieces); },
  applySolution: function () {
    var path = solveFrom(pieces);
    if (!path) return false;
    for (var i = 0; i < path.length; i++) {
      var m = path[i], id = -1, j;
      for (j = 0; j < pieces.length; j++) {
        var p = pieces[j];
        if (p.x === m.x && p.y === m.y && p.w === m.w && p.h === m.h) { id = j; break; }
      }
      if (id < 0 || !movePiece(id, m.dx, m.dy, true)) return false;
    }
    return true;
  },
  hint: doHint,
  hintMove: function () { return hintMove; },
  shuffle: shuffleBoard,
  reset: resetClassic,
  state: function () { return state; },
  steps: function () { return steps; },
  hints: function () { return hints; },
  best: function () { return bestMoves; },
  cao: function () { return { x: pieces[0].x, y: pieces[0].y }; },
  undo: undo
};
resize();
updMini();
syncHud();
run();

})();
</script>

<script>

<script>
try{
  /* ① 最近玩过 */

  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}

  /* ③ 游玩次数(跨游戏累计) */

  (function(){
    function syncBest(){
      try{
        var v=0;
        ['klotski_best','klotski_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['klotski']||0)){
            B['klotski']=v;
            localStorage.setItem('__best',JSON.stringify(B));

        }
      }catch(e){}
    }

    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});

  })();
}catch(e){}
</script>
