<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='logic_best',PLAY='logic_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 逻辑电路 · 通电挑战 ================== */
var NAME = '逻辑电路 · 通电挑战';
var state = 'start';
var level = 0, ops = 0, elapsed = 0;
var sw = [];                     /* 开关状态 */
var litCount = 0;
var winT = 0, msg = '', msgT = 0;

/* 门类型:AND/OR/NOT;levels[i].nodes: [{t:'sw'|'AND'|'OR'|'NOT'|'LAMP', ins:[节点id]}]
 * 节点 id:0..n-1 顺序求值;sw 节点的 ins 为空,值取 sw[i]。 */
var LEVELS = [
  { sw: 1, nodes: [{ t: 'sw' }, { t: 'LAMP', ins: [0] }], pos: [[.3, .55], [.75, .55]] },
  { sw: 2, nodes: [{ t: 'sw' }, { t: 'sw' }, { t: 'AND', ins: [0, 1] }, { t: 'LAMP', ins: [2] }], pos: [[.2, .42], [.2, .68], [.55, .55], [.85, .55]] },
  { sw: 2, nodes: [{ t: 'sw' }, { t: 'sw' }, { t: 'OR', ins: [0, 1] }, { t: 'LAMP', ins: [2] }], pos: [[.2, .42], [.2, .68], [.55, .55], [.85, .55]] },
  { sw: 1, nodes: [{ t: 'sw' }, { t: 'NOT', ins: [0] }, { t: 'LAMP', ins: [1] }], pos: [[.2, .55], [.55, .55], [.85, .55]] },
  { sw: 2, nodes: [{ t: 'sw' }, { t: 'sw' }, { t: 'NOT', ins: [1] }, { t: 'AND', ins: [0, 2] }, { t: 'LAMP', ins: [3] }], pos: [[.18, .4], [.18, .7], [.48, .7], [.62, .55], [.88, .55]] },
  { sw: 3, nodes: [{ t: 'sw' }, { t: 'sw' }, { t: 'sw' }, { t: 'AND', ins: [0, 1] }, { t: 'OR', ins: [3, 2] }, { t: 'LAMP', ins: [4] }], pos: [[.16, .38], [.16, .56], [.16, .74], [.48, .48], [.62, .6], [.88, .55]] },
  { sw: 2, nodes: [{ t: 'sw' }, { t: 'sw' }, { t: 'OR', ins: [0, 1] }, { t: 'NOT', ins: [2] }, { t: 'LAMP', ins: [3] }], pos: [[.18, .42], [.18, .68], [.5, .55], [.64, .55], [.88, .55]] },
  { sw: 3, nodes: [{ t: 'sw' }, { t: 'sw' }, { t: 'sw' }, { t: 'NOT', ins: [2] }, { t: 'AND', ins: [0, 1] }, { t: 'OR', ins: [4, 3] }, { t: 'LAMP', ins: [5] }], pos: [[.14, .36], [.14, .56], [.14, .76], [.4, .76], [.42, .46], [.66, .58], [.9, .55]] },
  { sw: 3, nodes: [{ t: 'sw' }, { t: 'sw' }, { t: 'sw' }, { t: 'AND', ins: [0, 1] }, { t: 'AND', ins: [3, 2] }, { t: 'LAMP', ins: [4] }, { t: 'LAMP', ins: [3] }], pos: [[.14, .4], [.14, .58], [.14, .76], [.44, .48], [.62, .62], [.88, .62], [.88, .3]] },
  { sw: 3, nodes: [{ t: 'sw' }, { t: 'sw' }, { t: 'sw' }, { t: 'OR', ins: [0, 1] }, { t: 'NOT', ins: [3] }, { t: 'AND', ins: [4, 2] }, { t: 'LAMP', ins: [5] }], pos: [[.14, .38], [.14, .58], [.14, .78], [.42, .48], [.56, .66], [.7, .55], [.9, .55]] },
  { sw: 4, nodes: [{ t: 'sw' }, { t: 'sw' }, { t: 'sw' }, { t: 'sw' }, { t: 'AND', ins: [0, 1] }, { t: 'AND', ins: [2, 3] }, { t: 'OR', ins: [4, 5] }, { t: 'LAMP', ins: [6] }, { t: 'LAMP', ins: [4] }], pos: [[.12, .34], [.12, .5], [.12, .66], [.12, .82], [.4, .42], [.4, .72], [.64, .58], [.88, .58], [.88, .28]] },
  { sw: 4, nodes: [{ t: 'sw' }, { t: 'sw' }, { t: 'sw' }, { t: 'sw' }, { t: 'NOT', ins: [0] }, { t: 'AND', ins: [4, 1] }, { t: 'OR', ins: [5, 2] }, { t: 'AND', ins: [6, 3] }, { t: 'LAMP', ins: [7] }], pos: [[.12, .32], [.12, .48], [.12, .64], [.12, .8], [.34, .32], [.48, .44], [.62, .56], [.76, .58], [.92, .58]] }
];

function layout() { }
function onResize() { }

function L() { return LEVELS[level]; }
function resetGame() {
  level = 0; ops = 0; elapsed = 0;
  loadLevel(0);
}
function loadLevel(n) {
  sw = [];
  var i;
  for (i = 0; i < L().sw; i++) sw.push(false);
  msg = ''; msgT = 0;
  syncHud();
}
function startGame() {
  resetGame();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}
function evalNode(k) {
  var nd = L().nodes[k];
  if (nd.t === 'sw') return sw[k];
  var vals = nd.ins.map(function (id) { return evalNode(id); });
  if (nd.t === 'AND') return vals.every(function (v) { return v; });
  if (nd.t === 'OR') return vals.some(function (v) { return v; });
  if (nd.t === 'NOT') return !vals[0];
  if (nd.t === 'LAMP') return vals[0];
  return false;
}
function litLamps() {
  var n = 0, i;
  for (i = 0; i < L().nodes.length; i++) {
    if (L().nodes[i].t === 'LAMP' && evalNode(i)) n++;
  }
  return n;
}
function totalLamps() {
  var n = 0, i;
  for (i = 0; i < L().nodes.length; i++) if (L().nodes[i].t === 'LAMP') n++;
  return n;
}
function syncHud() {
  $('hlv').textContent = (level + 1) + '/12';
  $('hsw').textContent = sw.filter(function (v) { return v; }).length;
  $('hlamp').textContent = litLamps() + '/' + totalLamps();
}
function endGame() {
  state = 'over';
  winT = 1;
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  var rank = '电路大师!';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '<b>12 关全部通电!</b><br>' +
    '操作 ' + ops + ' 次 · 用时 ' + Math.round(elapsed) + ' 秒<br>' +
    '本局得分 <b>' + score + '</b><br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '从灯泡倒推需要什么,再拨开关';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  tone(760, .3, 'sine', .07, 1250);
}
var score = 0;
function nextLevel() {
  score += 150;
  if (level >= LEVELS.length - 1) { endGame(); return; }
  level++;
  loadLevel(level);
  msg = '第 ' + (level + 1) + ' 关!';
  msgT = 1.2;
  syncHud();
}
function toggle(k) {
  if (state !== 'play') return;
  sw[k] = !sw[k];
  ops++;
  tone(sw[k] ? 520 : 320, .06, 'sine', .045);
  syncHud();
  if (litLamps() === totalLamps()) {
    msg = '全部通电!';
    tone(720, .2, 'sine', .06, 1150);
    nextLevel();
  }
}
function update(dt) {
  if (msgT > 0) msgT -= dt;
  if (winT > 0) winT -= dt;
  if (state !== 'play') return;
  elapsed += dt;
}
function rr(x, y, w, h, rad) {
  var k = Math.min(rad, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#0d1626');
  bg.addColorStop(1, '#060a12');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);

  var L2 = L();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var i;
  /* 连线 */
  ctx.strokeStyle = 'rgba(120,180,255,.35)';
  ctx.lineWidth = 2;
  for (i = 0; i < L2.nodes.length; i++) {
    var nd = L2.nodes[i];
    if (!nd.ins) continue;
    var pi = posOf(i);
    for (var j = 0; j < nd.ins.length; j++) {
      var pj = posOf(nd.ins[j]);
      var live = evalNode(nd.ins[j]);
      ctx.strokeStyle = live ? 'rgba(120,255,180,.7)' : 'rgba(120,180,255,.3)';
      ctx.beginPath();
      ctx.moveTo(pj.x + 22, pj.y);
      ctx.lineTo(pi.x - 24, pi.y);
      ctx.stroke();
    }
  }
  /* 节点 */
  for (i = 0; i < L2.nodes.length; i++) {
    var nd2 = L2.nodes[i];
    var p2 = posOf(i);
    var live2 = evalNode(i);
    if (nd2.t === 'sw') {
      ctx.fillStyle = sw[i] ? 'rgba(120,255,180,.9)' : 'rgba(255,120,110,.85)';
      rr(p2.x - 22, p2.y - 16, 44, 32, 8); ctx.fill();
      ctx.fillStyle = '#0a1220';
      ctx.font = '900 12px "PingFang SC",sans-serif';
      ctx.fillText(sw[i] ? 'ON' : 'OFF', p2.x, p2.y);
    } else if (nd2.t === 'LAMP') {
      ctx.save();
      if (live2) {
        ctx.shadowColor = '#ffe98a';
        ctx.shadowBlur = 22;
      }
      drawEm(live2 ? '💡' : '🔌', p2.x, p2.y, 34);
      ctx.restore();
    } else {
      ctx.fillStyle = live2 ? 'rgba(120,255,180,.25)' : 'rgba(255,255,255,.08)';
      rr(p2.x - 24, p2.y - 16, 48, 32, 8); ctx.fill();
      ctx.strokeStyle = 'rgba(120,180,255,.5)'; ctx.lineWidth = 1.5;
      rr(p2.x - 24, p2.y - 16, 48, 32, 8); ctx.stroke();
      ctx.font = '900 13px "PingFang SC",sans-serif';
      ctx.fillStyle = 'rgba(210,232,255,.9)';
      ctx.fillText(nd2.t, p2.x, p2.y);
    }
  }
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = msgT > 0 ? 'rgba(255,220,120,.95)' : 'rgba(210,232,255,.55)';
  ctx.fillText(msg || '点开关,点亮所有灯泡!', VW / 2, VH - 56);
}
function posOf(k) {
  var p = L().pos[k] || [.5, .5];
  return { x: p[0] * VW, y: p[1] * (VH - 190) + 120 };
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  var i;
  for (i = 0; i < L().sw; i++) {
    var p = posOf(i);
    if (Math.hypot(p.x - e.clientX, p.y - e.clientY) < 34) { toggle(i); return; }
  }
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key >= '1' && e.key <= '4') toggle(+e.key - 1);
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); resetGame(); }
});
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', function () { if (state === 'play') loadLevel(0); });
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」通到了第 ' + (level + 1) + ' 关电路! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  sw: function () { return sw.slice(); },
  toggle: toggle,
  lit: litLamps,
  total: totalLamps,
  level: function () { return level; },
  setLevel: function (n) { level = n; loadLevel(n); },
  evalNode: evalNode,
  state: function () { return state; }
};
resize();
resetGame();
$('padbar').classList.add('hide');
updMini();
run();

})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='logic'});
  r.unshift({k:'logic',n:'逻辑电路 · 通电挑战',e:'🔌'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['logic_best','logic_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['logic']||0)){
            B['logic']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
