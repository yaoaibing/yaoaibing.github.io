(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='escape_best',PLAY='escape_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;

    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

}
function hasItem(n) { return items.indexOf(n) >= 0; }
function syncHud() {
  $('hroom').textContent = (room + 1) + '/10';
  $('hitem').textContent = items.length;
  $('hhint').textContent = hints;
}
function endGame() {
  state = 'over';
  winT = 1;
  score = 1500 - hints * 50;
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '逃出全部 10 间密室!<br>' +
    '用了 ' + hints + ' 次提示 · 用时 ' + Math.round(elapsed) + ' 秒<br>' +
    '本局得分 <b>' + score + '</b><br>逃脱大师!<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '进房先把所有地点点一遍,线索不会藏太深';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  tone(700, .35, 'sine', .07, 1300);
}
function searchSpot(i) {
  if (state !== 'play') return;
  var key = room + ':' + i;
  var R = ROOMS[room];
  searched[key] = 1;
  var res = R.spots[i][1];
  var m = res.match(/<b>(.*?)<\/b>/);
  if (m && !hasItem(m[1])) {
    items.push(m[1]);
    res = res.replace('<b>', '「').replace('</b>', '」已入包!');
    msg = '获得「' + m[1] + '」!'; msgT = 1.6;
    tone(620, .14, 'sine', .055);
  } else {
    msg = '没什么新的发现'; msgT = 1;
    tone(320, .06, 'sine', .035);
  }
  syncHud();
}
function openDoor() {
  if (state !== 'play') return;
  var R = ROOMS[room];
  if (R.lock && !solved[room]) {
    lockUI = true;
    msg = R.lock.label; msgT = 2;
    return;
  }
  if (R.door.need && !hasItem(R.door.need)) {
    msg = '门锁着,还缺「' + R.door.need + '」'; msgT = 1.6;
    tone(200, .1, 'square', .04);
    return;
  }
  tone(540, .18, 'sine', .06, 800);
  if (room >= ROOMS.length - 1) { endGame(); return; }
  room++;
  searched = {}; msg = ''; lockUI = false;
  syncHud();
}
function lockBtns() {
  var R = ROOMS[room];
  var n = R.lock.options.length;
  var bw = Math.min(120, (VW - 40 - (n - 1) * 10) / n);
  var total = n * bw + (n - 1) * 10;
  var x0 = (VW - total) / 2;
  var out = [], i;
  for (i = 0; i < n; i++) {
    out.push({ x: x0 + i * (bw + 10), y: VH * .52, w: bw, h: 44, i: i });
  }
  return out;
}
function tapLock(i) {
  var R = ROOMS[room];
  var opt = R.lock.options[i];
  var val = R.lock.codes ? R.lock.codes[i] : opt;
  if (val === R.lock.code) {
    solved[room] = 1;
    lockUI = false;
    if (!hasItem(R.lock.reward)) items.push(R.lock.reward);
    msg = '机关解开!获得「' + R.lock.reward + '」';
    msgT = 2;
    tone(680, .2, 'sine', .06, 1000);
    syncHud();
  } else {
    msg = '不对,再想想'; msgT = 1.2;
    tone(200, .1, 'square', .04);
  }
}
function useHint() {
  if (state !== 'play' || hints <= 0) return;
  hints--;
  hintGlow = 0; hintT = 2.4;
  msg = '提示:优先搜没有搜过的地点,门需要背包里的道具';
  msgT = 2.2;
  tone(500, .1, 'sine', .05);
  syncHud();
}
function update(dt) {
  if (msgT > 0) msgT -= dt;
  if (hintT > 0) hintT -= dt;
  if (winT > 0) winT -= dt;
  if (state !== 'play') return;
  elapsed += dt;
}
function rr(x, y, w, h, rad) {
  var k = Math.min(rad, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
function wrapText(text, x, y, maxW, lh) {
  /* 逐字换行(中文) */
  var line = '', yy = y, i;
  for (i = 0; i < text.length; i++) {
    var test = line + text[i];
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, yy);
      line = text[i]; yy += lh;
    } else line = test;
  }
  if (line) ctx.fillText(line, x, yy);
  return yy + lh;
}
function btns() {
  var R = ROOMS[room];
  var out = [];
  var y = VH * .40;
  var i;
  for (i = 0; i < R.spots.length; i++) {
    out.push({ t: R.spots[i][0], x: VW / 2 - 130, y: y, w: 260, h: 40, kind: 'spot', idx: i });
    y += 48;
  }
  out.push({ t: R.door.label, x: VW / 2 - 130, y: y + 8, w: 260, h: 44, kind: 'door', idx: -1 });
  return out;
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#1d1509');
  bg.addColorStop(1, '#0b0704');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  drawEm('🕯️', VW * .16, 66, 34);
  drawEm('🚪', VW * .84, 66, 34);

  var R = ROOMS[room];
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 19px "PingFang SC",sans-serif';
  ctx.fillStyle = '#ffd782';
  ctx.fillText('第 ' + (room + 1) + ' 室 · ' + R.t, VW / 2, 56);
  ctx.font = '600 13.5px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(242,230,200,.85)';
  wrapText(R.d, VW / 2, 100, VW - 56, 22);

  var bs = btns(), i;
  for (i = 0; i < bs.length; i++) {
    var b = bs[i];
    var glow = hintT > 0 && b.kind === 'spot' && i === hintGlow;
    ctx.fillStyle = b.kind === 'door' ? 'rgba(216,168,90,.3)' : (searched[room + ':' + i] ? 'rgba(255,255,255,.05)' : 'rgba(216,168,90,.14)');
    rr(b.x, b.y, b.w, b.h, 10); ctx.fill();
    ctx.strokeStyle = glow ? 'rgba(255,220,90,.95)' : b.kind === 'door' ? 'rgba(216,168,90,.7)' : 'rgba(216,168,90,.35)';
    ctx.lineWidth = glow ? 2.5 : 1.5;
    rr(b.x, b.y, b.w, b.h, 10); ctx.stroke();
    ctx.font = (b.kind === 'door' ? '800 ' : '700 ') + '13.5px "PingFang SC",sans-serif';
    ctx.fillStyle = b.kind === 'door' ? '#ffd782' : 'rgba(242,230,200,.92)';
    ctx.fillText(b.t + (b.kind === 'spot' && searched[room + ':' + i] ? ' ✓' : ''), VW / 2, b.y + b.h / 2);
  }
  /* 背包 */
  ctx.font = '700 12px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(242,230,200,.75)';
  ctx.fillText('背包: ' + (items.join('、') || '(空)'), VW / 2, VH - 74);
  if (msgT > 0) {
    ctx.font = '700 13px "PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(255,215,130,.95)';
    var clean = msg.replace(/<b>|<\/b>/g, '');
    ctx.fillText(clean, VW / 2, VH - 46);
  }
  /* 机关答题面板 */
  if (lockUI) {
    ctx.fillStyle = 'rgba(10,6,2,.82)';
    ctx.fillRect(0, 0, VW, VH);
    ctx.font = '800 15px "PingFang SC",sans-serif';
    ctx.fillStyle = '#ffd782';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(R.lock.label, VW / 2, VH * .42);
    var lbs = lockBtns(), i2;
    for (i2 = 0; i2 < lbs.length; i2++) {
      var b2 = lbs[i2];
      ctx.fillStyle = 'rgba(216,168,90,.3)';
      rr(b2.x, b2.y, b2.w, b2.h, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(216,168,90,.7)'; ctx.lineWidth = 1.5;
      rr(b2.x, b2.y, b2.w, b2.h, 10); ctx.stroke();
      ctx.font = '800 15px "PingFang SC",sans-serif';
      ctx.fillStyle = '#f2e6c8';
      ctx.fillText(R.lock.options[i2], b2.x + b2.w / 2, b2.y + b2.h / 2);
    }
    ctx.font = '600 12px "PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(242,230,200,.6)';
    ctx.fillText('点一个答案试试', VW / 2, VH * .52 + 66);
  }
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  if (lockUI) {
    var lbs = lockBtns(), li;
    for (li = 0; li < lbs.length; li++) {
      var lb = lbs[li];
      if (e.clientX >= lb.x && e.clientX <= lb.x + lb.w && e.clientY >= lb.y && e.clientY <= lb.y + lb.h) {
        tapLock(li);
        return;
      }
    }
    return;
  }
  var bs = btns(), i;
  for (i = 0; i < bs.length; i++) {
    var b = bs[i];
    if (e.clientX >= b.x && e.clientX <= b.x + b.w && e.clientY >= b.y && e.clientY <= b.y + b.h) {
      if (b.kind === 'spot') searchSpot(i);
      else openDoor();
      return;
    }
  }
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === 'h' || e.key === 'H') { e.preventDefault(); useHint(); }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); resetGame(); }
});
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('hintbtn').addEventListener('click', useHint);
$('resetbtn').addEventListener('click', function () {
  searched = {}; msg = '本房已重置'; msgT = 1; hintGlow = -1;
});
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」逃出了第 ' + (room + 1) + ' 间密室! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  room: function () { return room; },
  items: function () { return items.slice(); },
  search: searchSpot,
  openDoor: openDoor,
  hint: useHint,
  hintsLeft: function () { return hints; },
  hasItem: hasItem,
  state: function () { return state; }
};
resize();
resetGame();
$('padbar').classList.add('hide');
updMini();
run();

})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='escape'});
  r.unshift({k:'escape',n:'密室逃脱 · 十室之约',e:'🚪'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['escape_best','escape_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['escape']||0)){
            B['escape']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
