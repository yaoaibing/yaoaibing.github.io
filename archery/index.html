<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='archery_best',PLAY='archery_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 射箭挑战 · 百步穿杨 ================== */
var NAME = '射箭挑战 · 百步穿杨';
var state = 'start';
var arrowsLeft = 10, total = 0, tens = 0, misses = 0;
var wind = 0, windAcc = 0, gameTime = 0, resultT = 0, resultTxt = '';
var BX = 0, BY = 0, TX = 0, TY = 0, TR = 40, FLOOR = 0, RANGE = 200;
var GRAV = 900, SPEED_K = 1.62;
var arrow = null, stuck = [];
var aim = { on: false, sx: 0, sy: 0, x: 0, y: 0, power: 0, dx: 1, dy: 0 };

function layout() {
  var top = Math.max(96, VH * .14);
  var reserve = VW < 360 ? 100 : 66;
  FLOOR = VH - reserve - 16;
  var courtW = Math.min(VW - 28, 560);
  var left = (VW - courtW) / 2;
  BX = left + 52;
  BY = FLOOR - 88;
  var d0 = (left + courtW - 30) - BX;
  TR = clamp(d0 * .16, 26, 62);
  TX = left + courtW - 30 - TR;
  TY = FLOOR - TR - 46;
  RANGE = TX - BX;
}
function onResize() { layout(); }

function newWind() {
  wind = rnd(11) - 5;
  windAcc = wind * 90 * (RANGE / 235);
  $('hwind').textContent = wind === 0 ? '无风' : (wind > 0 ? '→' : '←') + Math.abs(wind);
}
function startGame() {
  arrowsLeft = 10;
  total = 0; tens = 0; misses = 0;
  stuck = [];
  arrow = null;
  resultT = 0;
  gameTime = 0;
  aim.on = false;
  layout();
  newWind();
  state = 'aim';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}
function syncHud() {
  $('hscore').textContent = total;
  $('harrow').textContent = arrowsLeft;
}
function ringAt(x, y) {
  var d = Math.hypot(x - TX, y - TY) / TR;
  if (d > 1) return 0;
  if (d <= .2) return 10;
  if (d <= .36) return 9;
  if (d <= .52) return 8;
  if (d <= .68) return 7;
  if (d <= .84) return 6;
  return 5;
}

function launch(dx, dy, power) {
  if (state !== 'aim' || arrowsLeft <= 0) return false;
  var len = Math.hypot(dx, dy) || 1;
  if (power < .1) return false;
  var sp = RANGE * SPEED_K * (1 + power);
  arrow = {
    x: BX + dx / len * 28,
    y: BY + dy / len * 28,
    vx: dx / len * sp,
    vy: dy / len * sp,
    trail: []
  };
  arrowsLeft--;
  state = 'fly';
  aim.on = false;
  syncHud();
  tone(300, .05, 'square', .03, 500);
  return true;
}

function settle(ring, hx, hy, ang) {
  if (ring > 0) {
    total += ring;
    if (ring === 10) tens++;
    resultTxt = ring + ' 环!';
    tone(ring >= 9 ? 780 : 620, .09, 'triangle', .05, ring >= 9 ? 1050 : 820);
    stuck.push({ x: hx, y: hy, a: ang });
    if (stuck.length > 6) stuck.shift();
  } else {
    misses++;
    resultTxt = '脱靶';
    tone(180, .12, 'sawtooth', .04, 110);
  }
  resultT = 1.1;
  arrow = null;
  syncHud();
  if (arrowsLeft <= 0) {
    matchOver();
    return;
  }
  state = 'aim';
  newWind();
}

/* 单帧推进:真实飞行与校准解共用同一套积分,校准出的角度才和实际弹道对得上 */
function stepFlight(a, dt, trail) {
  var steps = Math.max(1, Math.ceil(Math.hypot(a.vx, a.vy) * dt / 7));
  var h = dt / steps, i;
  for (i = 0; i < steps; i++) {
    a.vy += GRAV * h;
    a.vx += windAcc * h;
    a.x += a.vx * h;
    a.y += a.vy * h;
    if (trail) {
      a.trail.push({ x: a.x, y: a.y });
      if (a.trail.length > 26) a.trail.shift();
    }
    /* 越过靶心所在竖直面的一刻定环数:高度差决定径距,擦着圆面边缘不再算命中 */
    if (a.x >= TX) return Math.abs(a.y - TY) <= TR * .99 ? 'face' : 'out';
    if (a.y >= FLOOR) return 'floor';
    if (a.x > VW + 30 || a.x < -30 || a.y < -200) return 'out';
  }
  return 'fly';
}

function stepArrow(dt) {
  var a = arrow;
  var r = stepFlight(a, dt, true);
  if (r === 'face') settle(ringAt(a.x, a.y), a.x, a.y, Math.atan2(a.vy, a.vx));
  else if (r === 'floor' || r === 'out') settle(0);
}

function update(dt) {
  gameTime += dt;
  if (resultT > 0) resultT -= dt;
  if (state === 'fly' && arrow) stepArrow(dt);
}

function aimVector() {
  if (aim.on) return { dx: aim.dx, dy: aim.dy, power: aim.power };
  return { dx: 1, dy: -0.08, power: .62 };
}

function drawTarget() {
  var cx = TX, cy = TY;
  ctx.fillStyle = 'rgba(70,50,20,.5)';
  ctx.fillRect(cx - 5, cy + TR * .8, 10, FLOOR - cy - TR * .8);
  ctx.fillStyle = '#5a4020';
  ctx.fillRect(cx - TR * .55, FLOOR - 8, TR * 1.1, 8);
  var bands = [
    [1, '#f4f1e4'],
    [.84, '#2b2f36'],
    [.68, '#3aa6e0'],
    [.52, '#e04a4a'],
    [.36, '#ffd34e'],
    [.2, '#ffe680']
  ];
  bands.forEach(function (b) {
    ctx.fillStyle = b[1];
    ctx.beginPath();
    ctx.arc(cx, cy, TR * b[0], 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.strokeStyle = 'rgba(0,0,0,.28)';
  ctx.lineWidth = 1;
  for (var i = 1; i < bands.length; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, TR * bands[i][0], 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,.75)';
  ctx.beginPath();
  ctx.moveTo(cx - 6, cy); ctx.lineTo(cx + 6, cy);
  ctx.moveTo(cx, cy - 6); ctx.lineTo(cx, cy + 6);
  ctx.stroke();
}
function drawBow() {
  var v = aimVector();
  var ang = Math.atan2(v.dy, v.dx);
  ctx.save();
  ctx.translate(BX, BY);
  ctx.rotate(ang);
  ctx.strokeStyle = 'rgba(0,0,0,.22)';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(-26, 0);
  ctx.lineTo(6, 0);
  ctx.stroke();
  ctx.strokeStyle = '#b98b3c';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(2, -26);
  ctx.quadraticCurveTo(15, 0, 2, 26);
  ctx.stroke();
  var pull = state === 'aim' ? v.power * 12 : 5;
  ctx.strokeStyle = 'rgba(245,245,235,.9)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(2, -26);
  ctx.lineTo(2 - pull, 0);
  ctx.lineTo(2, 26);
  ctx.stroke();
  if (state === 'aim') {
    ctx.strokeStyle = '#f2e8cf';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(2 - pull, 0);
    ctx.lineTo(36, 0);
    ctx.stroke();
    ctx.fillStyle = '#ffe680';
    ctx.beginPath();
    ctx.moveTo(36, 0);
    ctx.lineTo(28, -4);
    ctx.lineTo(28, 4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.lineWidth = 1.4;
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.moveTo(38, 0);
    ctx.lineTo(38 + 90 * v.power, 0);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
  ctx.fillStyle = 'rgba(255,235,190,.85)';
  ctx.font = '600 11px "PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('拖弓瞄准', BX, BY + 40);
}
function drawArrow(a) {
  var ang = Math.atan2(a.vy, a.vx);
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(ang);
  ctx.strokeStyle = '#f0e6ca';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(-20, 0);
  ctx.lineTo(12, 0);
  ctx.stroke();
  ctx.fillStyle = '#d8d2b8';
  ctx.beginPath();
  ctx.moveTo(12, 0);
  ctx.lineTo(5, -3.6);
  ctx.lineTo(5, 3.6);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(240,230,202,.6)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-20, 0); ctx.lineTo(-26, -4);
  ctx.moveTo(-20, 0); ctx.lineTo(-26, 4);
  ctx.stroke();
  ctx.restore();
}
function draw() {
  var sky = ctx.createLinearGradient(0, 0, 0, FLOOR);
  sky.addColorStop(0, '#0d1c0b');
  sky.addColorStop(.6, '#1d3a15');
  sky.addColorStop(1, '#46662a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, VW, FLOOR);
  ctx.fillStyle = 'rgba(190,230,140,.06)';
  ctx.beginPath();
  ctx.arc(VW * .3, FLOOR * .42, Math.min(120, VW * .28), 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3c2c14';
  ctx.fillRect(0, FLOOR, VW, VH - FLOOR);
  ctx.fillStyle = '#4e7a2c';
  ctx.fillRect(0, FLOOR - 6, VW, 6);

  drawTarget();

  ctx.strokeStyle = 'rgba(255,255,255,.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(BX, FLOOR);
  ctx.lineTo(BX, BY + 30);
  ctx.stroke();

  for (var i = 0; i < stuck.length; i++) drawArrow({ x: stuck[i].x, y: stuck[i].y, vx: Math.cos(stuck[i].a), vy: Math.sin(stuck[i].a) });

  if (state === 'fly' && arrow) {
    for (var k = 0; k < arrow.trail.length; k += 2) {
      var p = arrow.trail[k];
      ctx.fillStyle = 'rgba(255,245,210,' + (k / arrow.trail.length) * .45 + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
    drawArrow(arrow);
  }
  drawBow();

  if (state === 'aim') {
    var v = aimVector();
    var pw = Math.round(v.power * 100);
    ctx.fillStyle = 'rgba(255,255,255,.15)';
    ctx.fillRect(VW / 2 - 70, FLOOR + 12, 140, 7);
    ctx.fillStyle = 'rgba(255,224,110,.85)';
    ctx.fillRect(VW / 2 - 70, FLOOR + 12, 140 * v.power, 7);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.font = '600 11px "PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('力度 ' + pw + '%', VW / 2, FLOOR + 24);
  }
  if (wind !== 0) {
    ctx.fillStyle = 'rgba(220,255,200,.6)';
    ctx.font = '700 12px "PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText((wind > 0 ? '风 →' : '← 风') + ' ' + Math.abs(wind), TX, TY - TR - 14);
  }
  if (resultT > 0) {
    var kk = Math.min(1, resultT * 2);
    ctx.fillStyle = 'rgba(255,240,180,' + kk + ')';
    ctx.font = '900 26px "PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(resultTxt, VW / 2, FLOOR - 150);
  }
  if (state === 'aim' && gameTime < 3.4) {
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.font = '600 12px "PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('朝靶心拖动拉弓,松手射箭 · 箭会下坠,记得抬高', VW / 2, FLOOR - 12);
  }
}

function pointerStart(x, y) {
  if (state !== 'aim') return;
  aim.on = true;
  aim.sx = x;
  aim.sy = y;
  aim.x = x;
  aim.y = y;
  aim.dx = 1;
  aim.dy = 0;
  aim.power = 0;
}
function pointerMove(x, y) {
  if (!aim.on || state !== 'aim') return;
  aim.x = x;
  aim.y = y;
  var dx = x - aim.sx, dy = y - aim.sy;
  var len = Math.hypot(dx, dy);
  if (len > 4) { aim.dx = dx; aim.dy = dy; }
  aim.power = clamp(len / 130, 0, 1);
}
function pointerEnd() {
  if (!aim.on || state !== 'aim') { aim.on = false; return; }
  var p = aim.power;
  var dx = aim.dx, dy = aim.dy;
  aim.on = false;
  aim.power = 0;
  if (p >= .1) launch(dx, dy, p);
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  pointerStart(e.clientX, e.clientY);
});
cv.addEventListener('pointermove', function (e) {
  e.preventDefault();
  pointerMove(e.clientX, e.clientY);
});
cv.addEventListener('pointerup', function (e) {
  e.preventDefault();
  pointerMove(e.clientX, e.clientY);
  pointerEnd();
});
cv.addEventListener('pointercancel', function () { aim.on = false; aim.power = 0; });
window.addEventListener('keydown', function (e) {
  if (e.key === 'r' || e.key === 'R') { startGame(); return; }
  if (e.key === ' ' && state === 'aim') {
    e.preventDefault();
    var v = aimVector();
    launch(v.dx, v.dy, Math.max(.55, v.power));
  }
});

/* 校准解:按真实出手点(枪口前移 28)与同一套逐帧积分,取越过靶面时偏差最小的仰角 */
function solveAim() {
  var best = { dx: 1, dy: -.08, power: 1, err: 1e9 };
  for (var a = -70; a <= 12; a += .25) {
    var rad = a * Math.PI / 180, c = Math.cos(rad), s = Math.sin(rad);
    var sp = RANGE * SPEED_K * 2;
    var probe = { x: BX + c * 28, y: BY + s * 28, vx: c * sp, vy: s * sp };
    var r = 'fly', f = 0;
    while (r === 'fly' && f++ < 400) r = stepFlight(probe, 1 / 60, false);
    var err = r === 'face' ? Math.hypot(probe.x - TX, probe.y - TY) : 1e9;
    if (err < best.err) best = { dx: c, dy: s, power: 1, err: err };
  }
  return best;
}

function matchOver() {
  state = 'over';
  arrow = null;
  var score = total * 100 + tens * 50;
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '<b>' + total + ' 环</b><br>' +
    '十环 ' + tens + ' 次 · 脱靶 ' + misses + ' 次<br>' +
    '本局得分 ' + score + '<br>历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '顺风瞄低、逆风抬高,角度比蛮力更重要';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  tone(560, .12, 'triangle', .05, 840);
}

$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', startGame);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」射了 ' + total + ' 环,十环 ' + tens + ' 次! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/'; });
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}

window.__T = {
  state: function () { return state; },
  start: startGame,
  step: function (n) { for (var i = 0; i < (n || 1); i++) update(1 / 60); },
  score: function () { return total; },
  arrowsLeft: function () { return arrowsLeft; },
  tens: function () { return tens; },
  misses: function () { return misses; },
  wind: function () { return wind; },
  setWind: function (w) { wind = w; windAcc = w * 90 * (RANGE / 235); },
  target: function () { return { x: TX, y: TY, r: TR }; },
  geometry: function () { return { bx: BX, by: BY, floor: FLOOR, range: RANGE }; },
  ringAt: ringAt,
  shoot: launch,
  shootSolved: function () {
    var s = solveAim();
    return launch(s.dx, s.dy, s.power);
  },
  setArrow: function (x, y, vx, vy) {
    arrow = { x: x, y: y, vx: vx, vy: vy, trail: [] };
    state = 'fly';
  },
  arrow: function () { return arrow ? { x: arrow.x, y: arrow.y, vx: arrow.vx, vy: arrow.vy } : null; },
  setAim: function (dx, dy, power) { aim.on = true; aim.dx = dx; aim.dy = dy; aim.power = power; },
  release: pointerEnd,
  stuck: function () { return stuck.length; }
};
resize();
layout();
updMini();
newWind();
syncHud();
run();

})();
</script>

<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';

    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='archery'});
  r.unshift({k:'archery',n:'射箭挑战 · 百步穿杨',e:'🏹'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['archery_best','archery_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['archery']||0)){
            B['archery']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
