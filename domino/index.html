<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='domino_best',PLAY='domino_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 多米诺接龙 · 对战 ================== */
var NAME = '多米诺接龙 · 对战';
var state = 'start';
var MAXP = 6;
var hand = [], aiHand = [], pool = [], chain = []; /* chain: [{a,b}] 已定向,a=左端点,b=右端点 */
var leftEnd = -1, rightEnd = -1;
var turn = 0, passStreak = 0, aiDraws = 0, myDraws = 0;
var sel = -1, msg = '', msgT = 0, winT = 0;
var TX = 0, TY = 0, TS = 44;      /* 链条区 */
var HX = 0, HY = 0, HS = 52;      /* 手牌区 */
var DIFFS = ['双六', '双九'];
var diffIdx = 0;

function layout() {
  var top = Math.max(92, VH * .12);
  var pad = VW < 360 ? 96 : 52;
  TS = VW < 360 ? 38 : 46;
  HS = TS + 8;
  TY = top + 8;
  HY = VH - pad - HS - 16;
}
function onResize() { layout(); }

function makeSet(maxp) {
  var out = [], a, b;
  for (a = 0; a <= maxp; a++) for (b = a; b <= maxp; b++) out.push({ a: a, b: b });
  return shuffle(out);
}
function shuffle(a) {
  var i, j, t;
  for (i = a.length - 1; i > 0; i--) { j = rnd(i + 1); t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function pips(h) {
  var s = 0, i;
  for (i = 0; i < h.length; i++) s += h[i].a + h[i].b;
  return s;
}
function resetGame() {
  var set = makeSet(diffIdx === 0 ? 6 : 9);
  hand = set.splice(0, 7);
  aiHand = set.splice(0, 7);
  pool = set;
  chain = [];
  leftEnd = -1; rightEnd = -1;
  turn = 0; passStreak = 0; aiDraws = 0; myDraws = 0;
  sel = -1; msg = ''; msgT = 0; winT = 0;
  /* 首出:双方最大双牌(或最大牌)决定,谁大谁先出 */
  var myBest = bestLead(hand), aiBest = bestLead(aiHand);
  if (aiBest.v > myBest.v) {
    turn = 1;
    var t = removeFrom(aiHand, aiBest.i);
    chain.push({ a: t.a, b: t.b });
    leftEnd = t.a; rightEnd = t.b;
    msg = '电脑先出 ' + t.a + '|' + t.b;
  } else {
    var t2 = removeFrom(hand, myBest.i);
    chain.push({ a: t2.a, b: t2.b });
    leftEnd = t2.a; rightEnd = t2.b;
    msg = '你先出 ' + t2.a + '|' + t2.b;
  }
  msgT = 1.6;
  syncHud();
}
function bestLead(h) {
  var v = -1, i = 0, k;
  for (k = 0; k < h.length; k++) {
    var s = h[k].a === h[k].b ? 100 + h[k].a : h[k].a + h[k].b;
    if (s > v) { v = s; i = k; }
  }
  return { v: v, i: i };
}
function removeFrom(h, i) { return h.splice(i, 1)[0]; }
function fits(t, end) { return t.a === end || t.b === end; }
function playable(h) {
  var out = [], i;
  for (i = 0; i < h.length; i++) if (fits(h[i], leftEnd) || fits(h[i], rightEnd)) out.push(i);
  return out;
}
function place(h, i, side) {
  var t = removeFrom(h, i);
  if (side === 0) { chain.unshift({ a: t.b, b: t.a }); leftEnd = t.a; }
  else { chain.push({ a: t.a, b: t.b }); rightEnd = t.b; }
  tone(360 + (t.a + t.b) * 18, .07, 'triangle', .05);
  passStreak = 0;
}
function startGame() {
  resetGame();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
}
function finish(win, reason) {
  state = 'over';
  winT = 1.2;
  KIT.addPlay(); KIT.streak();
  var oppPips = pips(aiHand), myPips = pips(hand);
  var score = win ? Math.max(200, 600 + oppPips * 10) : Math.max(60, 200 - myPips * 4);
  var rec = KIT.setBest(score);
  var rank = win ? (reason === '出完' ? '神之一手' : '点数大师') : '再来一局';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '本局得分 <b>' + score + '</b><br>' +
    (reason === '出完' ? (win ? '你先出完了手牌!' : '电脑先出完了手牌') :
      '双方卡死,你剩 ' + myPips + ' 点,电脑剩 ' + oppPips + ' 点') + '<br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '先甩大点数牌,双牌留着当万能应急';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  tone(win ? 760 : 300, .3, 'sine', .07, win ? 1200 : 200);
}
function drawTile(who) {
  if (!pool.length) return -1;
  var t = pool.shift();
  if (who === 0) { hand.push(t); myDraws++; } else { aiHand.push(t); aiDraws++; }
  return hand.length - 1 + (who === 0 ? 0 : 1000);
}
function playerDraw() {
  if (state !== 'play' || turn !== 0) return;
  if (playable(hand).length) { showMsg('手里的牌能接,先出牌!'); return; }
  if (!pool.length) { showMsg('牌堆空了,只能过'); playerPass(); return; }
  var id = drawTile(0);
  tone(300, .06, 'sine', .04);
  var t = hand[id];
  if (fits(t, leftEnd) || fits(t, rightEnd)) { sel = id; showMsg('摸到能接的牌,已选中!'); }
  else showMsg('摸到 ' + t.a + '|' + t.b + ',接不上');
  syncHud();
}
function playerPass() {
  if (state !== 'play' || turn !== 0) return;
  if (playable(hand).length && pool.length) { showMsg('还能接,不能过!'); return; }
  passStreak++;
  turn = 1; sel = -1;
  afterTurn();
}
function afterTurn() {
  syncHud();
  if (passStreak >= 2) {
    var myP = pips(hand), aiP = pips(aiHand);
    finish(myP <= aiP, '卡死');
    return;
  }
  if (!hand.length) { finish(true, '出完'); return; }
  if (!aiHand.length) { finish(false, '出完'); return; }
  if (turn === 1) aiMove();
}
function aiMove() {
  if (state !== 'play') return;
  var pl = playable(aiHand), i;
  if (!pl.length) {
    while (!pl.length && pool.length) {
      drawTile(1);
      pl = playable(aiHand);
    }
    if (!pl.length) {
      passStreak++;
      turn = 0;
      afterTurn();
      return;
    }
  }
  /* 贪心:优先甩双牌与大点数,其次保住与手牌同点的灵活牌 */
  var bi = pl[0], bs = -1;
  for (i = 0; i < pl.length; i++) {
    var t = aiHand[pl[i]];
    var s = (t.a + t.b) * 2 + (t.a === t.b ? 6 : 0);
    var flexible = 0, k;
    for (k = 0; k < aiHand.length; k++) {
      if (k === pl[i]) continue;
      if (aiHand[k].a === t.a || aiHand[k].b === t.a) flexible++;
      if (aiHand[k].a === t.b || aiHand[k].b === t.b) flexible++;
    }
    s += flexible * 3;
    if (s > bs) { bs = s; bi = pl[i]; }
  }
  var t2 = aiHand[bi], side;
  if (fits(t2, leftEnd) && fits(t2, rightEnd)) side = frnd() < .5 ? 0 : 1;
  else if (fits(t2, leftEnd)) side = 0;
  else side = 1;
  place(aiHand, bi, side);
  syncHud();
  if (!aiHand.length) { finish(false, '出完'); return; }
  turn = 0;
  afterTurn();
}
function showMsg(m) { msg = m; msgT = 1.5; }
function syncHud() {
  $('hmine').textContent = hand.length;
  $('hai').textContent = aiHand.length;
  $('hpool').textContent = pool.length;
}
function update(dt) {
  if (msgT > 0) msgT -= dt;
  if (winT > 0) winT -= dt;
}
function rr(x, y, w, h, rad) {
  var k = Math.min(rad, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
var PIP_XY = {
  0: [], 1: [[.5, .5]], 2: [[.28, .28], [.72, .72]], 3: [[.28, .28], [.5, .5], [.72, .72]],
  4: [[.28, .28], [.72, .28], [.28, .72], [.72, .72]],
  5: [[.28, .28], [.72, .28], [.5, .5], [.28, .72], [.72, .72]],
  6: [[.28, .26], [.72, .26], [.28, .5], [.72, .5], [.28, .74], [.72, .74]],
  7: [[.28, .26], [.72, .26], [.28, .5], [.72, .5], [.28, .74], [.72, .74], [.5, .38]],
  8: [[.28, .26], [.72, .26], [.28, .5], [.72, .5], [.28, .74], [.72, .74], [.5, .38], [.5, .62]],
  9: [[.26, .24], [.5, .24], [.74, .24], [.26, .5], [.5, .5], [.74, .5], [.26, .76], [.5, .76], [.74, .76]]
};
function drawTileFace(x, y, w, h, a, b, hot) {
  ctx.fillStyle = hot ? '#ffe9a8' : '#f2ecd2';
  rr(x, y, w, h, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(60,45,10,.5)'; ctx.lineWidth = 1;
  rr(x, y, w, h, 6); ctx.stroke();
  ctx.strokeStyle = 'rgba(60,45,10,.35)';
  ctx.beginPath(); ctx.moveTo(x + w / 2, y + 3); ctx.lineTo(x + w / 2, y + h - 3); ctx.stroke();
  function pips(side, n) {
    var px = side === 0 ? x + w * .25 : x + w * .75;
    var arr = PIP_XY[n] || PIP_XY[9];
    for (var i = 0; i < arr.length; i++) {
      ctx.beginPath();
      ctx.arc(px, y + h * arr[i][1], Math.max(1.6, w * .055), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.fillStyle = '#2a1e08';
  pips(0, a); pips(1, b);
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#191507');
  bg.addColorStop(1, '#0a0803');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  /* 链条:自适应缩放居中 */
  var tw = chain.length * (TS + 4);
  var scale = tw > VW - 20 ? (VW - 20) / tw : 1;
  var ts2 = TS * scale;
  var total = chain.length * (ts2 + 4);
  var cx = (VW - total + 4) / 2;
  var i;
  for (i = 0; i < chain.length; i++) {
    drawTileFace(cx + i * (ts2 + 4), TY, ts2, ts2 * 1.05, chain[i].a, chain[i].b, false);
  }
  /* 两端接牌热区 */
  if (state === 'play' && turn === 0 && sel >= 0) {
    ctx.fillStyle = 'rgba(240,216,138,.2)';
    rr(6, TY - 6, VW / 2 - 10, ts2 * 1.05 + 12, 10); ctx.fill();
    rr(VW / 2 + 4, TY - 6, VW / 2 - 10, ts2 * 1.05 + 12, 10); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,180,.75)';
    ctx.font = '700 13px "PingFang SC",sans-serif';
    ctx.fillText('◀ 接这头(' + leftEnd + '点)', VW * .25, TY + ts2 * 1.05 + 16);
    ctx.fillText('接这头(' + rightEnd + '点) ▶', VW * .75, TY + ts2 * 1.05 + 16);
  }
  /* 提示行 */
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = msgT > 0 ? 'rgba(255,220,120,.95)' : 'rgba(255,240,200,.55)';
  ctx.fillText(msg || '两端:' + leftEnd + ' 点 / ' + rightEnd + ' 点', VW / 2, HY - 26);

  /* 手牌 */
  var n = hand.length;
  var gap = 5;
  var hw = Math.min(HS, (VW - 24 - gap * (n - 1)) / Math.max(1, n));
  var totalW = n * hw + (n - 1) * gap;
  var hx = (VW - totalW) / 2;
  for (i = 0; i < n; i++) {
    var t = hand[i];
    var can = state === 'play' && turn === 0 && (fits(t, leftEnd) || fits(t, rightEnd));
    var hot = i === sel;
    ctx.globalAlpha = state === 'play' && turn === 0 && !can ? .55 : 1;
    drawTileFace(hx + i * (hw + gap), HY + (hot ? -6 : 0), hw, HS, t.a, t.b, hot);
    ctx.globalAlpha = 1;
  }
  /* 牌堆 */
  ctx.fillStyle = 'rgba(242,236,210,.16)';
  rr(14, HY + 4, 34, HS - 8, 6); ctx.fill();
  ctx.fillStyle = 'rgba(242,236,210,.65)';
  ctx.font = '700 12px "PingFang SC",sans-serif';
  ctx.fillText('🂠' + pool.length, 31, HY + HS / 2);
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  var x = e.clientX, y = e.clientY;
  /* 手牌区 */
  if (y >= HY - 10) {
    var n = hand.length, gap = 5;
    var hw = Math.min(HS, (VW - 24 - gap * (n - 1)) / Math.max(1, n));
    var totalW = n * hw + (n - 1) * gap;
    var hx = (VW - totalW) / 2;
    var i = Math.floor((x - hx) / (hw + gap));
    if (i >= 0 && i < n && x >= hx + i * (hw + gap) && x <= hx + i * (hw + gap) + hw) {
      sel = (sel === i) ? -1 : i;
      tone(430, .05, 'triangle', .04);
    }
    return;
  }
  /* 链区两端 */
  if (sel >= 0 && y <= TY + TS * 1.3) {
    var t = hand[sel];
    if (x < VW / 2) {
      if (fits(t, leftEnd)) { place(hand, sel, 0); sel = -1; syncHud(); if (!hand.length) { finish(true, '出完'); return; } turn = 1; afterTurn(); }
      else showMsg('左端要 ' + leftEnd + ' 点');
    } else {
      if (fits(t, rightEnd)) { place(hand, sel, 1); sel = -1; syncHud(); if (!hand.length) { finish(true, '出完'); return; } turn = 1; afterTurn(); }
      else showMsg('右端要 ' + rightEnd + ' 点');
    }
  }
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === 'd' || e.key === 'D') { e.preventDefault(); playerDraw(); }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startGame(); }
});

function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}

$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', startGame);
$('drawbtn').addEventListener('click', playerDraw);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」' + (hand.length ? '还剩 ' + hand.length + ' 张' : '赢下了整局') + '! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  hand: function () { return hand.map(function (t) { return t.a + '|' + t.b; }); },
  aiHand: function () { return aiHand.map(function (t) { return t.a + '|' + t.b; }); },
  chain: function () { return chain.map(function (t) { return t.a + '|' + t.b; }); },
  ends: function () { return [leftEnd, rightEnd]; },
  pool: function () { return pool.length; },
  play: function (i, side) { place(hand, i, side); syncHud(); if (!hand.length) { finish(true, '出完'); return; } turn = 1; afterTurn(); },
  playable: function () { return playable(hand); },
  draw: playerDraw,
  aiHandCount: function () { return aiHand.length; },
  passStreak: function () { return passStreak; },
  state: function () { return state; }
};

resize();
resetGame();
$('padbar').classList.add('hide');
updMini();
run();

})();
</script>

<script>
(function(){

  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());

      function fb(){try{

        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));

      location.href='/stats/'}));

  }
}catch(e){}
})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='domino'});
  r.unshift({k:'domino',n:'多米诺接龙 · 对战',e:'⚄'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['domino_best','domino_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['domino']||0)){
            B['domino']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
