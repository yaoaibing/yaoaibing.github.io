<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='bridge2_best',PLAY='bridge2_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 造桥大师 II · 峡谷狂风 ================== */
var NAME = '造桥大师 II · 峡谷狂风';
var state = 'start';
var level = 0, score = 0;
var LV = [
  { gap: 380, budget: 920, joints: 8 },
  { gap: 440, budget: 1020, joints: 8 },
  { gap: 500, budget: 1160, joints: 9 }
];
var pts = [], sticks = [], sel = -1;
var gap = 0, budget = 0, maxJoints = 0;
var cliffY = 0, LX = 0, RX = 0;
var phase = 'build', testT = 0, truckX = 0, truckY = 0, truckFall = false;
var msg = '', msgT = 0, time = 0, snapT = 0, wind = 0;

function layout() {
  cliffY = VH * .5;
  gap = LV[level].gap;
  LX = VW / 2 - gap / 2;
  RX = VW / 2 + gap / 2;
}
function onResize() { }
function loadLevel() {
  var lv = LV[level];
  budget = lv.budget; maxJoints = lv.joints;
  pts = [
    { x: LX, y: cliffY, px: LX, py: cliffY, fixed: 1 },
    { x: RX, y: cliffY, px: RX, py: cliffY, fixed: 1 },
    { x: VW / 2, y: cliffY + 130, px: VW / 2, py: cliffY + 130, fixed: 1 }
  ];
  sticks = []; sel = -1;
  phase = 'build'; testT = 0; truckX = 0; truckY = 0; truckFall = false;
  layout();
  msg = '中间石柱也是锚点 · 狂风会横推你的桥!'; msgT = 2.4;
  syncHud();
}
function resetMatch() {
  level = 0; score = 0;
  loadLevel();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}
function syncHud() {
  $('hlv').textContent = (level + 1) + '/' + LV.length;
  $('hbud').textContent = Math.round(budget);
  $('hwind').textContent = Math.round(Math.abs(wind));
}
function nearestPt(x, y) {
  var best = -1, bd = 26 * 26;
  for (var i = 0; i < pts.length; i++) {
    var dx = pts[i].x - x, dy = pts[i].y - y, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
function tapAt(x, y) {
  if (phase !== 'build' || state !== 'play') return;
  var hit = nearestPt(x, y);
  if (sel === -1) {
    sel = hit;
    if (sel < 0) { msg = '先点崖壁锚点/石柱/已有节点'; msgT = 1.2; }
    return;
  }
  var tgt = hit;
  if (tgt < 0) {
    if (pts.length - 3 >= maxJoints) { msg = '节点用完了(' + maxJoints + ')'; msgT = 1.2; sel = -1; return; }
    if (y > cliffY + VH * .34) { msg = '够不到水下'; msgT = 1; return; }
    pts.push({ x: x, y: y, px: x, py: y, fixed: 0 });
    tgt = pts.length - 1;
  }
  if (tgt === sel) { sel = -1; return; }
  var a = pts[sel], b = pts[tgt];
  var len = Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y));
  if (len < 24 || len > 230) { msg = '这段' + (len < 24 ? '太短' : '太长(>230)'); msgT = 1.1; return; }
  if (budget < len) { msg = '钢材预算不足!'; msgT = 1.1; return; }
  budget -= len;
  sticks.push({ a: sel, b: tgt, rest: len, broken: false, strain: 0 });
  sel = -1;
  tone(420, .05, 'triangle', .035, 560);
  syncHud();
}
function startTest() {
  if (phase !== 'build' || state !== 'play') return;
  var reach = {}, q = [0];
  reach[0] = 1; reach[2] = 1;
  q.push(2);
  while (q.length) {
    var cur = q.shift();
    for (var i = 0; i < sticks.length; i++) {
      var s = sticks[i];
      if (s.broken) continue;
      var o = s.a === cur ? s.b : (s.b === cur ? s.a : -1);
      if (o >= 0 && !reach[o]) { reach[o] = 1; q.push(o); }
    }
  }
  if (!reach[1]) { msg = '桥还没连到对岸!'; msgT = 1.4; tone(240, .07, 'square', .03); return; }
  phase = 'test'; testT = 0;
  truckX = LX + 6; truckY = cliffY - 13; truckFall = false;
  msg = '试车开始…小心侧风'; msgT = 1;
  tone(420, .08, 'square', .035, 560);
}
function stepSim(dt) {
  wind = Math.sin(time * .7) * 46 + Math.sin(time * 2.3) * 22;
  var i, k, s;
  for (i = 0; i < pts.length; i++) {
    var p = pts[i];
    if (p.fixed) continue;
    var vx = (p.x - p.px) * .99, vy = (p.y - p.py) * .99;
    p.px = p.x; p.py = p.y;
    p.x += vx + wind * dt * dt;
    p.y += vy + 560 * dt * dt;
  }
  var loads = [];
  for (i = 0; i < pts.length; i++) {
    if (pts[i].fixed) continue;
    if (Math.abs(pts[i].x - truckX) < 44 && pts[i].y < cliffY + 10) loads.push(i);
  }
  for (i = 0; i < loads.length; i++) pts[loads[i]].y += 150 * dt * dt;
  for (k = 0; k < 3; k++) {
    for (i = 0; i < sticks.length; i++) {
      s = sticks[i];
      if (s.broken) continue;
      var a = pts[s.a], b = pts[s.b];
      var dx = b.x - a.x, dy = b.y - a.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      var diff2 = (d - s.rest) / d * .5;
      if (!a.fixed) { a.x += dx * diff2; a.y += dy * diff2; }
      if (!b.fixed) { b.x -= dx * diff2; b.y -= dy * diff2; }
    }
  }
  for (i = 0; i < sticks.length; i++) {
    s = sticks[i];
    if (s.broken) continue;
    var a2 = pts[s.a], b2 = pts[s.b];
    var d2 = Math.sqrt((a2.x - b2.x) * (a2.x - b2.x) + (a2.y - b2.y) * (a2.y - b2.y));
    s.strain = Math.abs(d2 - s.rest) / s.rest;
    if (s.strain > .09) {
      s.broken = true;
      snapT = .2;
      tone(180, .09, 'sawtooth', .05, 120);
    }
  }
}
function update(dt) {
  time += dt;
  if (msgT > 0) msgT -= dt;
  if (snapT > 0) snapT -= dt;
  if (state !== 'play') return;
  if (phase === 'test') {
    testT += dt;
    for (var i = 0; i < 2; i++) stepSim(dt / 2);
    if (!truckFall) {
      truckX += 82 * dt;
      var surf = -1;
      for (var j = 0; j < sticks.length; j++) {
        var st2 = sticks[j];
        if (st2.broken) continue;
        var pa = pts[st2.a], pb = pts[st2.b];
        if (pa.y > cliffY + 26 || pb.y > cliffY + 26) continue;
        var minx = Math.min(pa.x, pb.x) - 6, maxx = Math.max(pa.x, pb.x) + 6;
        if (truckX >= minx && truckX <= maxx) {
          var tt = (truckX - pa.x) / ((pb.x - pa.x) || 1);
          var yy = pa.y + (pb.y - pa.y) * tt;
          if (yy < cliffY + 26) { surf = yy; break; }
        }
      }
      if (surf >= 0) truckY = surf - 13;
      else { truckFall = true; truckY = cliffY - 13; }
      if (truckFall) truckY += 800 * dt;
      if (truckY > cliffY + 70) {
        msg = '桥塌了…'; msgT = 1.4;
        phase = 'result'; testT = 1.2;
        tone(200, .12, 'sawtooth', .05, 130);
        return;
      }
      if (truckX >= RX - 6) {
        var bonus = Math.round(budget * .5) + 250;
        score += 350 + bonus;
        msg = '试车通过!+' + (350 + bonus); msgT = 1.6;
        phase = 'result'; testT = 1.5;
        tone(640, .12, 'triangle', .05, 900);
        syncHud();
      }
    }
  } else if (phase === 'result') {
    testT -= dt;
    if (testT <= 0) {
      if (msg.indexOf('通过') >= 0) {
        level++;
        if (level >= LV.length) { matchOver(true); return; }
      }
      loadLevel();
    }
  }
}
function matchOver(win) {
  state = 'over';
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '<b>' + (win ? '狂风峡谷三桥全通!' : '桥塌了…') + '</b><br>' +
    '通过 <b>' + (win ? LV.length : level) + '/' + LV.length + '</b> 关<br>' +
    '本局得分 <b>' + score + '</b><br>历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = win ? '风从右来就把斜撑往左多搭一档' : '大风天直线梁最危险,三角桁架抗风';
  $('over').classList.remove('hide');
  tone(win ? 640 : 260, .14, 'triangle', .06, win ? 900 : 180);
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#0e141c'); bg.addColorStop(1, '#080c12');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = '#123246';
  ctx.fillRect(0, cliffY + 8, VW, VH - cliffY - 8);
  ctx.fillStyle = 'rgba(255,255,255,.1)';
  for (var w2 = 0; w2 < 5; w2++) ctx.fillRect(((w2 * 110 + time * 16) % (VW + 40)) - 20, cliffY + 20 + (w2 % 3) * 16, 40, 3);
  ctx.fillStyle = '#2c3a2c';
  ctx.fillRect(0, cliffY, LX, VH - cliffY);
  ctx.fillRect(RX, cliffY, VW - RX, VH - cliffY);
  ctx.fillStyle = '#4a4a52';
  ctx.fillRect(VW / 2 - 14, cliffY + 130, 28, VH - cliffY - 130);
  /* 风 */
  ctx.strokeStyle = 'rgba(160,200,240,' + (.2 + Math.abs(wind) / 90).toFixed(2) + ')';
  ctx.lineWidth = 2;
  for (var wl = 0; wl < 3; wl++) {
    var wy = VH * .1 + wl * 30;
    ctx.beginPath();
    for (var wx = 0; wx <= VW; wx += 14) {
      var wy2 = wy + Math.sin(wx * .04 + time * 3 + wl) * 6;
      if (wx === 0) ctx.moveTo(wx, wy2); else ctx.lineTo(wx, wy2);
    }
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(160,200,240,.7)';
  ctx.font = '900 12px "PingFang SC",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('风 ' + Math.round(Math.abs(wind)) + (wind > 0 ? ' →' : ' ←'), VW - 44, VH * .05);
  for (var i = 0; i < sticks.length; i++) {
    var s = sticks[i];
    if (s.broken) continue;
    var a = pts[s.a], b = pts[s.b];
    var strain = s.strain || 0;
    ctx.strokeStyle = phase === 'test' ? (strain > .06 ? '#ff6a5a' : strain > .03 ? '#ffd45c' : '#8ad08a') : '#c8b088';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (i = 0; i < pts.length; i++) {
    var p = pts[i];
    ctx.fillStyle = p.fixed ? '#e8d44c' : '#f0f4f8';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.fixed ? 7 : 5.5, 0, Math.PI * 2); ctx.fill();
    if (i === sel) {
      ctx.strokeStyle = '#ffd45c'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, Math.PI * 2); ctx.stroke();
    }
  }
  if (phase === 'test') {
    ctx.fillStyle = truckFall ? '#883c34' : '#4fa8e8';
    ctx.fillRect(truckX - 22, truckY - 9, 44, 18);
    ctx.fillStyle = 'rgba(210,240,255,.8)';
    ctx.fillRect(truckX - 6, truckY - 6, 14, 9);
  }
  if (msgT > 0) {
    ctx.fillStyle = 'rgba(255,235,180,.95)';
    ctx.font = '600 13.5px "PingFang SC",sans-serif';
    ctx.fillText(msg, VW / 2, VH * .16);
  }
  ctx.fillStyle = 'rgba(255,255,255,.42)';
  ctx.font = '600 11px "PingFang SC",sans-serif';
  if (phase === 'build') ctx.fillText('石柱与两岸都是锚点 · 三角桁架抗风', VW / 2, VH - 84);
}
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', resetMatch);
$('againbtn').addEventListener('click', resetMatch);
$('testbtn').addEventListener('click', startTest);
$('newbtn').addEventListener('click', loadLevel);
window.addEventListener('keydown', function (e) {
  if (e.key === ' ') { e.preventDefault(); if (phase === 'build') startTest(); }
});
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  tapAt(e.clientX, e.clientY);
});
cv.addEventListener('pointercancel', function () { });
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」通过了 ' + level + ' 座狂风大桥! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/'; });
window.__T = {
  state: function () { return state; },
  start: resetMatch,
  step: function (k) { for (var i = 0; i < (k || 1); i++) update(1 / 60); },
  score: function () { return score; },
  phase: function () { return phase; },
  sticksN: function () { return sticks.length; },
  tap: tapAt,
  test: startTest,
  truck: function () { return { x: truckX, y: truckY, fall: truckFall }; },
  wind: function () { return wind; }
};
resize();
loadLevel();
$('padbar').classList.add('hide');
updMini();
syncHud();
run();

})();
</script>

<script>
(function(){
try{

  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());

    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){

      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));

      location.href='/stats/'}));

  }
}catch(e){}
})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='bridge2'});
  r.unshift({k:'bridge2',n:'造桥大师 II · 峡谷狂风',e:'🌁'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['bridge2_best','bridge2_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['bridge2']||0)){
            B['bridge2']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
