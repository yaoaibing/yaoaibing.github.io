<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='fangqi_best',PLAY='fangqi_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 成方棋 · 成方提子 ================== */
var NAME = '成方棋 · 成方提子';
var state = 'start', score = 0, phase = 'place', turn = 1;
var board = [], sel = null, placed = [0, 0];
var anim = 0, msg = '', msgT = 0, aiT = 0, over = 0;
var S = 44, BX = 0, BY = 0;
function layout() {
  S = Math.min(VW * .17, VH * .13, 62);
  BX = (VW - S * 3) / 2;
  BY = VH * .26;
}
function onResize() { layout(); }
function syncHud() {
  $('hturn').textContent = phase === 'place' ? '布子' : (turn === 1 ? '你走' : 'AI 走');
  $('hmine').textContent = cnt(1);
  $('htheirs').textContent = cnt(2);
}
function cnt(s) {
  var n = 0, i;
  for (i = 0; i < 16; i++) if (board[i] === s) n++;
  return n;
}
function at(c, r) {
  if (c < 0 || c > 3 || r < 0 || r > 3) return -9;
  return board[r * 4 + c];
}
function squaresOf(s) {
  var out = [], c, r;
  for (r = 0; r < 4; r++) for (c = 0; c < 4; c++) {
    if (at(c, r) === s && at(c + 1, r) === s && at(c, r + 1) === s && at(c + 1, r + 1) === s) out.push([c, r, 1]);
    if (at(c, r) === s && at(c + 2, r) === s && at(c, r + 2) === s && at(c + 2, r + 2) === s) out.push([c, r, 2]);
  }
  return out;
}
function protectedBy(s) {
  var sq = squaresOf(s), prot = {}, i, j;
  for (i = 0; i < sq.length; i++) {
    var sz = sq[i][2];
    for (j = 0; j < 4; j++) {
      var c = sq[i][0] + (j % 2) * sz, r = sq[i][1] + Math.floor(j / 2) * sz;
      prot[r * 4 + c] = 1;
    }
  }
  return prot;
}
function start() {
  state = 'play'; score = 0; phase = 'place'; turn = 1; sel = null; over = 0;
  placed = [0, 0];
  board = [];
  var i;
  for (i = 0; i < 16; i++) board.push(0);
  msg = '轮流布子,各七枚'; msgT = 1.4;
  $('start').classList.add('hide'); $('over').classList.add('hide'); syncHud();
}
function tryEnd() {
  if (cnt(2) < 4) { fin(1); return true; }
  if (cnt(1) < 4) { fin(0); return true; }
  return false;
}
function captureFor(s) {
  var foe = s === 1 ? 2 : 1;
  var prot = protectedBy(foe);
  var cand = [], i;
  for (i = 0; i < 16; i++) if (board[i] === foe && !prot[i]) cand.push(i);
  if (!cand.length) {
    for (i = 0; i < 16; i++) if (board[i] === foe) cand.push(i);
  }
  if (!cand.length) return;
  board[cand[(Math.random() * cand.length) | 0]] = 0;
}
function afterMove(s, c, r) {
  var before = squaresOf(s).length;
  var mk = squaresOf(s);
  var formed = false, i;
  for (i = 0; i < mk.length; i++) {
    var sz = mk[i][2];
    if (c >= mk[i][0] && c <= mk[i][0] + sz && r >= mk[i][1] && r <= mk[i][1] + sz) formed = true;
  }
  if (formed && mk.length >= before) {
    captureFor(s);
    if (s === 1) { msg = '成方!提对方一子'; msgT = 1.1; score += 25; }
    else { msg = '对方成方,被提一子'; msgT = 1.1; }
    tone(720, .12, 'triangle', .05);
  }
}
function fin(win) {
  over = 1;
  state = 'over'; KIT.addPlay(); KIT.streak();
  score = win ? 150 + cnt(1) * 10 : cnt(2) * 8;
  var rec = KIT.setBest(score);
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '<b>' + (win ? '成方连台,对手认负!' : '被对方方阵困住') + '</b><br>我方 ' + cnt(1) + ' 子 · 对方 ' + cnt(2) + ' 子<br>本局得分 <b>' + score + '</b><br>历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
  $('over').classList.remove('hide');
  tone(660, .16, 'triangle', .06);
}
function hasMove(s) {
  var i, c, r;
  for (i = 0; i < 16; i++) {
    if (board[i] !== s) continue;
    c = i % 4; r = (i / 4) | 0;
    if (at(c + 1, r) === 0 || at(c - 1, r) === 0 || at(c, r + 1) === 0 || at(c, r - 1) === 0) return true;
  }
  return false;
}
function tap(x, y) {
  if (state !== 'play' || over) return;
  var c = Math.round((x - BX) / S), r = Math.round((y - BY) / S);
  if (c < 0 || c > 3 || r < 0 || r > 3) return;
  if (phase === 'place') {
    if (turn !== 1 || at(c, r) !== 0) return;
    board[r * 4 + c] = 1; placed[0]++;
    tone(520, .06, 'triangle', .04);
    if (placed[0] >= 7 && placed[1] >= 7) { phase = 'move'; msg = '布满!走子成方提子'; msgT = 1.3; turn = 1; }
    else turn = 2;
    syncHud(); return;
  }
  if (turn !== 1) return;
  if (at(c, r) === 1) { sel = r * 4 + c; tone(480, .05, 'sine', .03); return; }
  if (sel === null || at(c, r) !== 0) return;
  var sc = sel % 4, sr = (sel / 4) | 0;
  if (Math.abs(sc - c) + Math.abs(sr - r) !== 1) { msg = '沿线一步,横竖都行'; msgT = .9; return; }
  board[sel] = 0; board[r * 4 + c] = 1;
  sel = null;
  tone(440, .06, 'triangle', .04);
  afterMove(1, c, r);
  if (tryEnd()) return;
  turn = 2; aiT = .6; syncHud();
}
function aiStep() {
  if (phase === 'place') {
    var empt = [], i;
    for (i = 0; i < 16; i++) if (board[i] === 0) empt.push(i);
    if (!empt.length) { phase = 'move'; turn = 1; return; }
    var p = empt[(Math.random() * empt.length) | 0];
    board[p] = 2; placed[1]++;
    tone(320, .05, 'sine', .03);
    if (placed[0] >= 7 && placed[1] >= 7) { phase = 'move'; turn = 1; msg = '布满!走子成方提子'; msgT = 1.3; }
    else turn = 1;
    syncHud(); return;
  }
  var moves = [], c, r, i, j;
  for (i = 0; i < 16; i++) {
    if (board[i] !== 2) continue;
    c = i % 4; r = (i / 4) | 0;
    var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (j = 0; j < 4; j++) {
      var nc = c + dirs[j][0], nr = r + dirs[j][1];
      if (at(nc, nr) === 0) moves.push([i, nr * 4 + nc]);
    }
  }
  if (!moves.length) { fin(1); return; }
  var best = null, bestScore = -1;
  for (j = 0; j < moves.length; j++) {
    var from = moves[j][0], to = moves[j][1];
    board[from] = 0; board[to] = 2;
    var sq = squaresOf(2).length;
    board[to] = 0; board[from] = 2;
    var v = sq * 10 + Math.random();
    if (v > bestScore) { bestScore = v; best = moves[j]; }
  }
  board[best[0]] = 0; board[best[1]] = 2;
  afterMove(2, best[1] % 4, (best[1] / 4) | 0);
  if (tryEnd()) return;
  turn = 1; syncHud();
}
function update(dt) {
  anim += dt;
  if (msgT > 0) msgT -= dt;
  if (state !== 'play' || over) return;
  if (turn === 2) {
    aiT -= dt;
    if (aiT <= 0) { aiStep(); aiT = .55; }
  } else if (turn === 1 && phase === 'move' && !hasMove(1)) {
    fin(0);
  }
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#2c2418'); bg.addColorStop(1, '#191309');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  var i, c, r;
  ctx.strokeStyle = 'rgba(232,220,174,.5)'; ctx.lineWidth = 1.5;
  for (i = 0; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(BX, BY + i * S); ctx.lineTo(BX + S * 3, BY + i * S); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(BX + i * S, BY); ctx.lineTo(BX + i * S, BY + S * 3); ctx.stroke();
  }
  for (i = 0; i < 16; i++) {
    c = i % 4; r = (i / 4) | 0;
    var px = BX + c * S, py = BY + r * S;
    if (board[i] === 0) {
      ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(232,220,174,.4)'; ctx.fill();
      if (phase === 'place' && turn === 1) {
        ctx.strokeStyle = 'rgba(255,212,74,.35)';
        ctx.strokeRect(px - S * .3, py - S * .3, S * .6, S * .6);
      }
    } else {
      ctx.beginPath(); ctx.arc(px, py, S * .34, 0, Math.PI * 2);
      ctx.fillStyle = board[i] === 1 ? '#e8d8a8' : '#c85a3a';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.stroke();
      ctx.fillStyle = board[i] === 1 ? '#4a3a1a' : '#ffe9a8';
      ctx.font = '700 ' + Math.round(S * .3) + 'px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(board[i] === 1 ? '我' : '敌', px, py + S * .1);
      if (sel === i) {
        ctx.strokeStyle = '#ffd44a'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(px, py, S * .44, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,232,200,.7)'; ctx.font = '600 12px "PingFang SC",sans-serif';
  ctx.fillText(phase === 'place' ? '布子:各占七枚,留两空' : '走子:横竖一步,围成方提敌', VW / 2, VH * .14);
  ctx.fillText('方 = 四子围成小方或大方', VW / 2, VH * .84);
  if (msgT > 0) {
    ctx.fillStyle = '#ffe9a8'; ctx.font = '700 13px "PingFang SC",sans-serif';
    ctx.fillText(msg, VW / 2, VH * .9);
  }
  ctx.textAlign = 'left';
}
cv.addEventListener('pointerdown', function (e) { e.preventDefault(); tap(e.clientX, e.clientY); });
function updMini() { $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局'; }
$('startbtn').addEventListener('click', start);
$('againbtn').addEventListener('click', start);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」成方困敌! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/'; });
window.__T = {
  state: function () { return state; }, start: start,
  step: function (n) { for (var i = 0; i < (n || 1); i++) update(1 / 60); },
  score: function () { return score; }, tap: tap, phase: function () { return phase; }
};
resize(); layout(); updMini(); syncHud(); run();

})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='fangqi'});
  r.unshift({k:'fangqi',n:'成方棋 · 成方提子',e:'🔲'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['fangqi_best','fangqi_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['fangqi']||0)){
            B['fangqi']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
