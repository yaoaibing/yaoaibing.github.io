function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='triage_best',PLAY='triage_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},

function share(txt){

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

  syncHud();
}
function startGame() {
  resetGame();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}
function endGame(win) {
  state = 'over';
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  var rank = lives <= 0 ? '被主任叫去谈话' : good >= 17 ? '护士长点名表扬' : good >= 13 ? '分诊靠谱' : good >= 9 ? '还在练眼力' : '全靠直觉';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '判对 <b>' + good + ' / ' + SHIFT + ' 位</b><br>' +
    '本局得分 <b>' + score + '</b><br>' + (win ? '顺利下班' : '抢救室爆满, 撑不住了') + '<br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '先看血压和血氧, 再看疼得多厉害';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  tone(win ? 880 : 160, .3, 'sine', .06, win ? 1320 : 80);
}
function syncHud() {
  $('hscore').textContent = score;
  $('hlives').textContent = LIFE0 - lives;
  $('hleft').textContent = SHIFT - idx;
}
function next() {
  idx++;
  limit = Math.max(6, 12 - idx * .3);
  t = limit;
  if (idx >= SHIFT) { endGame(true); return }
  syncHud();
}
function judge(choice) {
  if (state !== 'play' || fbT > 0 || cool > 0) return;
  var c = cur();
  if (!c) return;
  if (choice === c.lv) {
    var gain = 100 + Math.round(t / limit * 60) + streak * 10;
    score += gain; good++; streak++;
    fb = '判对 +' + gain + ' · ' + c.why;
    fbOk = true;
    tone(760, .1, 'triangle', .05, 1140);
  } else {
    lives = Math.max(0, lives - 1); streak = 0;
    fb = '判错! 应为' + ['一级红', '二级黄', '三级绿'][c.lv - 1] + ' · ' + c.why;
    fbOk = false;
    noise(.16, .07);
    tone(200, .18, 'square', .05, 110);
  }
  fbT = 1.5;
  cool = 1.5;
  syncHud();
}
function advance() {
  if (state !== 'play') return;
  if (lives <= 0) { endGame(false); return }
  next();
}
function wrap(txt, per) {
  var out = [];
  for (var i = 0; i < txt.length; i += per) out.push(txt.slice(i, i + per));
  return out;
}
function update(dt) {
  if (fbT > 0) fbT -= dt;
  if (cool > 0) {
    cool -= dt;
    if (cool <= 0) { cool = 0; advance() }
    return;
  }
  if (state !== 'play') return;
  t -= dt;
  if (t <= 0) {
    var c = cur();
    lives = Math.max(0, lives - 1); streak = 0;
    fb = '等太久! ' + (c ? c.why : '');
    fbOk = false;
    fbT = 1.5;
    cool = 1.5;
    noise(.2, .08);
    tone(180, .22, 'sawtooth', .05, 90);
    syncHud();
  }
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#0f1a22'); bg.addColorStop(1, '#070e14');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  var pad = 14, w = VW - pad * 2;
  var top = Math.max(92, VH * .14);
  var cardH = Math.min(232, VH * .40);
  var c = cur();
  /* 当前患者卡 */
  ctx.fillStyle = 'rgba(255,255,255,.06)';
  rr(pad, top, w, cardH, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2;
  rr(pad, top, w, cardH, 16); ctx.stroke();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = '900 19px "PingFang SC",sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText(c ? c.n : '—', pad + 14, top + 28);
  ctx.font = '600 15px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(220,240,255,.92)';
  var ls = c ? wrap(c.s, Math.max(10, Math.floor((w - 34) / 15))) : [];
  for (var i = 0; i < ls.length; i++) ctx.fillText(ls[i], pad + 14, top + 58 + i * 22);
  /* 生命体征 */
  var vy = top + 58 + ls.length * 22 + 18;
  var col = Math.floor(w / 3) - 8;
  for (i = 0; i < 3; i++) {
    var x = pad + 8 + i * (col + 8);
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    rr(x, vy, col, 56, 10); ctx.fill();
    ctx.textAlign = 'center';
    ctx.font = '600 11px "PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(200,220,240,.6)';
    ctx.fillText(['心率 次/分', '血氧 %', '血压 mmHg'][i], x + col / 2, vy + 15);
    ctx.font = '900 22px "PingFang SC",sans-serif';
    ctx.fillStyle = i === 0 ? vitalColor(c ? c.hr : 80, 50, 120) : (i === 1 ? vitalColor(c ? c.o2 : 98, 92, 96, true) : '#eaf4ff');
    ctx.fillText(i === 0 ? (c ? c.hr : '-') : (i === 1 ? (c ? c.o2 : '-') : (c ? c.bp : '-')), x + col / 2, vy + 38);
  }
  /* 倒计时 */
  var by2 = top + cardH + 16;
  ctx.fillStyle = 'rgba(255,255,255,.1)';
  rr(pad, by2, w, 12, 6); ctx.fill();
  var k = clamp(t / limit, 0, 1);
  ctx.fillStyle = k > .5 ? 'rgba(110,230,160,.9)' : (k > .22 ? 'rgba(240,200,80,.9)' : 'rgba(240,110,110,.95)');
  rr(pad, by2, Math.max(2, w * k), 12, 6); ctx.fill();
  /* 候诊队列 */
  var qy = by2 + 30;
  ctx.textAlign = 'left';
  ctx.font = '600 12px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(200,220,240,.55)';
  ctx.fillText('后面还在排:', pad, qy + 8);
  for (i = 1; i <= 2; i++) {
    var nx = deck[idx + i];
    if (!nx) break;
    var qx = pad + 76 + (i - 1) * ((w - 84) / 2);
    var qw = (w - 84) / 2 - 6;
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    rr(qx, qy - 4, qw, 40, 9); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.rect(qx, qy - 4, qw, 40); ctx.clip();
    ctx.textAlign = 'center';
    ctx.font = '600 12px "PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(225,240,255,.75)';
    ctx.fillText(nx.n, qx + qw / 2, qy + 8);
    ctx.font = '600 11px "PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(200,220,240,.55)';
    ctx.fillText(nx.s.slice(0, 12), qx + qw / 2, qy + 25);
    ctx.restore();
  }
  /* 反馈条 */
  if (fbT > 0) {
    var fh = 52;
    var fyy = VH - 136;
    ctx.fillStyle = fbOk ? 'rgba(60,180,110,.92)' : 'rgba(200,70,70,.92)';
    rr(pad, fyy, w, fh, 12); ctx.fill();
    ctx.textAlign = 'center';
    var per = Math.max(14, Math.floor((w - 24) / 12.5));
    var fl = wrap(fb, per);
    ctx.font = '700 12.5px "PingFang SC",sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText(fl[0] || '', VW / 2, fyy + (fl.length > 1 ? 15 : fh / 2));
    if (fl.length > 1) ctx.fillText(fl[1], VW / 2, fyy + 34);
  } else {
    ctx.textAlign = 'center';
    ctx.font = '600 12.5px "PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(190,225,245,.5)';
    ctx.fillText('按红黄绿三档给这位患者定级', VW / 2, VH - 106);
  }
  /* 生命 */
  ctx.textAlign = 'left';
  ctx.font = '14px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.fillText('连续判对 ' + streak, pad, VH - 46);
}
function vitalColor(v, low, high, reverse) {
  if (reverse) return v < low ? 'rgba(255,120,120,1)' : 'rgba(140,240,180,1)';
  return (v < low || v > high) ? 'rgba(255,120,120,1)' : 'rgba(140,240,180,1)';
}
function rr(x, y, w, h, rad) {
  var k = Math.min(rad, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === '1') { e.preventDefault(); judge(1) }
  if (e.key === '2') { e.preventDefault(); judge(2) }
  if (e.key === '3') { e.preventDefault(); judge(3) }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startGame() }
});
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', startGame);
$('redbtn').addEventListener('click', function () { judge(1) });
$('yelbtn').addEventListener('click', function () { judge(2) });
$('grnbtn').addEventListener('click', function () { judge(3) });
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」一个班次判对 ' + good + ' / ' + SHIFT + ' 位患者,拿了 ' + score + ' 分! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  state: function () { return state; },
  score: function () { return score; },
  lives: function () { return lives; },
  good: function () { return good; },
  left: function () { return SHIFT - idx; },
  streak: function () { return streak; },
  cur: function () { return cur(); },
  trueLevel: function () { return cur() ? cur().lv : 0; },
  wait: function () { return t; },
  judge: judge,
  skip: function () { idx++; t = limit; },
  cases: function () { return CASES.length; },
  step: function (n) { for (var i = 0; i < n; i++) update(1 / 60); },
  forceEnd: function () { endGame(false); }
};
resize();
resetGame();
$('padbar').classList.add('hide');
updMini();
run();

})();
</script>

<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());

      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+

      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));

}catch(e){}
})();

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='triage'});
  r.unshift({k:'triage',n:'急诊分诊 · 抢救室门口',e:'🚑'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['triage_best','triage_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['triage']||0)){
            B['triage']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
