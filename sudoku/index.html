<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='sudoku_best',PLAY='sudoku_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 数独 · 九宫格 ================== */
var NAME = '数独 · 九宫格';
var state = 'start';
var DIFFS = [
  { n: '入门', holes: 36, base: 600 },
  { n: '普通', holes: 44, base: 900 },
  { n: '进阶', holes: 50, base: 1200 }
];
var sol = [], g = [], fixed = [], sel = -1;
var diff = 1, hints = 3, mistakes = 0, elapsed = 0, sec = 0, score = 0;
var BX = 0, BY = 0, BC = 30, BS = 270, PX = 0, PY = 0, PW = 27, PH = 46;
var noteT = 0, noteTx = '', winT = 0;

function bit(d) { return 1 << d; }
function boxOf(i) { var r = i / 9 | 0, c = i % 9; return ((r / 3) | 0) * 3 + ((c / 3) | 0); }
function popcount(m) { var n = 0; while (m) { m &= m - 1; n++; } return n; }
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function rr(x, y, w, h, r) {
  var k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
function clock(s) {
  s = Math.max(0, Math.floor(s));
  var m = Math.floor(s / 60), r = s % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
}

function fillSolution() {
  var g2 = [], rows = [], cols = [], boxes = [], i;
  for (i = 0; i < 9; i++) { rows.push(0); cols.push(0); boxes.push(0); }
  for (i = 0; i < 81; i++) g2.push(0);
  function rec(idx) {
    if (idx >= 81) return true;
    var r = idx / 9 | 0, c = idx % 9, b = boxOf(idx);
    var used = rows[r] | cols[c] | boxes[b], cand = [], d;
    for (d = 1; d <= 9; d++) if (!(used & bit(d))) cand.push(d);
    shuffle(cand);
    for (var k = 0; k < cand.length; k++) {
      d = cand[k];
      g2[idx] = d; rows[r] |= bit(d); cols[c] |= bit(d); boxes[b] |= bit(d);
      if (rec(idx + 1)) return true;
      g2[idx] = 0; rows[r] &= ~bit(d); cols[c] &= ~bit(d); boxes[b] &= ~bit(d);
    }
    return false;
  }
  rec(0);
  return g2;
}

function countSolutions(src, limit) {
  var g2 = src.slice(), rows = [], cols = [], boxes = [], count = 0, i;
  for (i = 0; i < 9; i++) { rows.push(0); cols.push(0); boxes.push(0); }
  for (i = 0; i < 81; i++) {
    if (!g2[i]) continue;
    var rr2 = i / 9 | 0, cc = i % 9, bb = boxOf(i), dd = g2[i];
    rows[rr2] |= bit(dd); cols[cc] |= bit(dd); boxes[bb] |= bit(dd);
  }
  function rec() {
    var best = -1, bestMask = 0, bestN = 10, j;
    for (j = 0; j < 81; j++) {
      if (g2[j]) continue;
      var r = j / 9 | 0, c = j % 9, b = boxOf(j);
      var mask = (~(rows[r] | cols[c] | boxes[b])) & 0x3FE;
      var n = popcount(mask);
      if (n < bestN) { bestN = n; best = j; bestMask = mask; if (n <= 1) break; }
    }
    if (best < 0) { count++; return count >= limit; }
    if (!bestN) return false;
    for (var d = 1; d <= 9; d++) {
      if (!(bestMask & bit(d))) continue;
      var r2 = best / 9 | 0, c2 = best % 9, b2 = boxOf(best);
      g2[best] = d; rows[r2] |= bit(d); cols[c2] |= bit(d); boxes[b2] |= bit(d);
      var stop = rec();
      g2[best] = 0; rows[r2] &= ~bit(d); cols[c2] &= ~bit(d); boxes[b2] &= ~bit(d);
      if (stop) return true;
    }
    return false;
  }
  rec();
  return count;
}

function makePuzzle(holes) {
  var s = fillSolution(), grid = s.slice(), order = [], i;
  for (i = 0; i < 81; i++) order.push(i);
  shuffle(order);
  var removed = 0;
  for (i = 0; i < 81 && removed < holes; i++) {
    var idx = order[i], v = grid[idx];
    grid[idx] = 0;
    if (countSolutions(grid, 2) !== 1) grid[idx] = v;
    else removed++;
  }
  return { sol: s, grid: grid };
}

function layout() {
  var top = Math.max(86, VH * .11);
  PH = clamp(Math.round(VH * .072), 40, 56);
  var avail = VH - top - 66 - PH - 14;
  BS = Math.floor(Math.min(VW - 24, avail, 470));
  BC = Math.floor(BS / 9);
  BS = BC * 9;
  BX = Math.round((VW - BS) / 2);
  BY = Math.round(top + Math.max(0, (avail - BS) * .5));
  PX = BX; PY = BY + BS + 14;
  PW = BS / 10;
}
function onResize() { layout(); }

function reset() {
  var p = makePuzzle(DIFFS[diff].holes), i;
  sol = p.sol; g = p.grid.slice(); fixed = [];
  for (i = 0; i < 81; i++) fixed.push(p.grid[i] ? 1 : 0);
  sel = -1; hints = 3; mistakes = 0; elapsed = 0; sec = 0; noteT = 0; winT = 0;
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
  note('每行、每列、每宫 1-9 不重复');
}
function note(t) { noteTx = t; noteT = 1.8; }
function syncHud() {
  var left = 0, i;
  for (i = 0; i < 81; i++) if (g[i] !== sol[i]) left++;
  $('hdiff').textContent = DIFFS[diff].n;
  $('hleft').textContent = left;
  $('hhint').textContent = hints;
  $('htime').textContent = clock(sec);
}

function put(v) {
  if (state !== 'play' || sel < 0 || fixed[sel]) return;
  if (v === 0) {
    if (!g[sel]) return;
    g[sel] = 0;
    tone(300, .05, 'square', .03);
    syncHud();
    return;
  }
  if (g[sel] === v) return;
  g[sel] = v;
  if (v !== sol[sel]) {
    mistakes++;
    tone(180, .12, 'sawtooth', .05);
    note('这一格不是 ' + v + ',可以擦掉重填');
  } else {
    tone(560, .07, 'triangle', .05);
  }
  syncHud();
  var done = true, i;
  for (i = 0; i < 81; i++) if (g[i] !== sol[i]) { done = false; break; }
  if (done) finish();
}

function hint() {
  if (state !== 'play') return;
  if (hints <= 0) { note('提示用完了,靠行、列、宫推理吧'); tone(220, .1, 'square', .04); return; }
  var idx = -1, i;
  for (i = 0; i < 81; i++) if (g[i] !== sol[i]) { idx = i; break; }
  if (idx < 0) return;
  g[idx] = sol[idx]; hints--; sel = idx;
  note('已替你填好一格（还剩 ' + hints + ' 次提示）');
  tone(720, .08, 'triangle', .05);
  syncHud();
  var done = true;
  for (i = 0; i < 81; i++) if (g[i] !== sol[i]) { done = false; break; }
  if (done) finish();
}

function calcScore() {
  var base = DIFFS[diff].base;
  var tb = Math.max(0, 1500 - sec * 5);
  return Math.max(100, base + tb - mistakes * 25);
}

function finish() {
  state = 'over';
  winT = 1.2;
  score = calcScore();
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  tone(660, .12, 'triangle', .06);
  setTimeout(function () { tone(880, .18, 'triangle', .06) }, 160);
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '用时 <b>' + clock(sec) + '</b><br>' +
    '难度 ' + DIFFS[diff].n + ' · 提示 ' + (3 - hints) + ' 次<br>' +
    '填错 ' + mistakes + ' 次<br>' +
    '本局得分 <b>' + score + '</b><br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '先找候选最少的格子,再用行、列、宫互相锁死';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  syncHud();
}

function cellAt(x, y) {
  var c = Math.floor((x - BX) / BC), r = Math.floor((y - BY) / BC);
  if (c < 0 || c >= 9 || r < 0 || r >= 9) return -1;
  return r * 9 + c;
}

function draw() {
  var i, r, c, x, y, v;
  var gr = ctx.createLinearGradient(0, 0, 0, VH);
  gr.addColorStop(0, '#1b2438');
  gr.addColorStop(1, '#0e1526');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, VW, VH);
  drawEm('🧩', VW * .08, VH * .11, 40);
  drawEm('🔢', VW * .92, VH * .88, 44);

  ctx.fillStyle = '#fbf6ea';
  rr(BX - 4, BY - 4, BS + 8, BS + 8, 10); ctx.fill();

  ctx.strokeStyle = 'rgba(120,96,54,.25)'; ctx.lineWidth = 1;
  for (i = 1; i < 9; i++) {
    if (i % 3 === 0) continue;
    ctx.beginPath(); ctx.moveTo(BX + i * BC, BY); ctx.lineTo(BX + i * BC, BY + BS); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(BX, BY + i * BC); ctx.lineTo(BX + BS, BY + i * BC); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(70,52,24,.7)'; ctx.lineWidth = 2;
  for (i = 1; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(BX + i * 3 * BC, BY); ctx.lineTo(BX + i * 3 * BC, BY + BS); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(BX, BY + i * 3 * BC); ctx.lineTo(BX + BS, BY + i * 3 * BC); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(70,52,24,.8)'; ctx.lineWidth = 2;
  ctx.strokeRect(BX, BY, BS, BS);

  if (sel >= 0) {
    var sr = sel / 9 | 0, sc = sel % 9;
    ctx.fillStyle = 'rgba(255,176,40,.22)';
    ctx.fillRect(BX + sc * BC, BY + sr * BC, BC, BC);
    var sv = g[sel];
    if (sv) {
      for (i = 0; i < 81; i++) {
        if (i !== sel && g[i] === sv) {
          var hr = i / 9 | 0, hc = i % 9;
          ctx.fillStyle = 'rgba(255,176,40,.12)';
          ctx.fillRect(BX + hc * BC, BY + hr * BC, BC, BC);
        }
      }
    }
  }

  for (i = 0; i < 81; i++) {
    v = g[i];
    if (!v) continue;
    r = i / 9 | 0; c = i % 9;
    x = BX + c * BC + BC / 2;
    y = BY + r * BC + BC / 2;
    ctx.font = (fixed[i] ? '700 ' : '600 ') + Math.round(BC * .56) + 'px "PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (fixed[i]) ctx.fillStyle = '#2b3445';
    else ctx.fillStyle = v === sol[i] ? '#1d6fe0' : '#d33a3a';
    ctx.fillText(String(v), x, y + 1);
  }
  if (sel >= 0) {
    var rr2 = sel / 9 | 0, cc = sel % 9;
    ctx.strokeStyle = 'rgba(255,170,40,.95)'; ctx.lineWidth = 3;
    ctx.strokeRect(BX + cc * BC + 1.5, BY + rr2 * BC + 1.5, BC - 3, BC - 3);
  }

  for (i = 0; i < 10; i++) {
    x = PX + i * PW; y = PY;
    ctx.fillStyle = 'rgba(255,255,255,.09)';
    rr(x + 2, y, PW - 4, PH, Math.min(10, PW * .2)); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1;
    rr(x + 2, y, PW - 4, PH, Math.min(10, PW * .2)); ctx.stroke();
    if (i < 9) {
      ctx.font = '700 ' + Math.round(Math.min(PW, PH) * .5) + 'px "PingFang SC",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#dfe9ff';
      ctx.fillText(String(i + 1), x + PW / 2, y + PH / 2 + 1);
    } else {
      ctx.strokeStyle = 'rgba(255,160,160,.9)'; ctx.lineWidth = 2;
      var kx = x + PW / 2, ky = y + PH / 2, kr = Math.min(PW, PH) * .17;
      ctx.beginPath();
      ctx.moveTo(kx - kr, ky - kr); ctx.lineTo(kx + kr, ky + kr);
      ctx.moveTo(kx + kr, ky - kr); ctx.lineTo(kx - kr, ky + kr);
      ctx.stroke();
    }
  }

  if (noteT > 0 && noteTx) {
    ctx.font = '600 13px "PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,212,92,' + Math.min(1, noteT).toFixed(2) + ')';
    ctx.fillText(noteTx, VW / 2, Math.max(70, BY - 22));
  }
}

function update(dt) {
  if (state !== 'play') return;
  elapsed += dt;
  var s2 = Math.floor(elapsed);
  if (s2 !== sec) { sec = s2; $('htime').textContent = clock(sec); }
  if (noteT > 0) noteT -= dt;
}

cv.addEventListener('pointerdown', function (e) { e.preventDefault() });
cv.addEventListener('pointerup', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  var x = e.clientX, y = e.clientY, i;
  if (y >= PY - 6 && y <= PY + PH + 6) {
    var k = Math.floor((x - PX) / PW);
    if (k < 0 || k > 9) return;
    put(k < 9 ? k + 1 : 0);
    return;
  }
  i = cellAt(x, y);
  if (i < 0) return;
  sel = i;
  tone(420, .04, 'triangle', .025);
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  var k = e.key;
  if (k === 'Backspace' || k === 'Delete' || k === '0') { e.preventDefault(); put(0); return; }
  if (k >= '1' && k <= '9') { e.preventDefault(); put(+k); return; }
  if (k.indexOf('Arrow') === 0) {
    e.preventDefault();
    if (sel < 0) { sel = 40; return; }
    var r = sel / 9 | 0, c = sel % 9;
    if (k === 'ArrowUp') r = Math.max(0, r - 1);
    if (k === 'ArrowDown') r = Math.min(8, r + 1);
    if (k === 'ArrowLeft') c = Math.max(0, c - 1);
    if (k === 'ArrowRight') c = Math.min(8, c + 1);
    sel = r * 9 + c;
  }
});

function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}

$('startbtn').addEventListener('click', reset);
$('againbtn').addEventListener('click', reset);
$('hintbtn').addEventListener('click', hint);
$('diffbtn').addEventListener('click', function () {
  diff = (diff + 1) % DIFFS.length;
  reset();
});
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」' + DIFFS[diff].n + '难度下 ' + clock(sec) + ' 做完了,拿了 ' + score + ' 分! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  makePuzzle: makePuzzle,
  countSolutions: countSolutions,
  fillSolution: fillSolution,
  DIFFS: DIFFS,
  sol: function () { return sol; },
  putAt: function (i, v) { sel = i; put(v); }
};

resize();
updMini();
syncHud();
run();

})();
</script>

<script>
(function(){
try{

  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}

      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+

      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+

      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='sudoku'});
  r.unshift({k:'sudoku',n:'数独 · 九宫格',e:'🔢'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['sudoku_best','sudoku_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['sudoku']||0)){
            B['sudoku']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
