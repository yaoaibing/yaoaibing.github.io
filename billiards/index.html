<script>
(function(){
'use strict';

/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='bill_wins',PLAY='bill_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* ================== PHYS · 台球物理(纯函数,可离线验证) ================== */
function physStep(bs,box,dt){
  var i,j,n,s,b,maxSpd=0;
  for(i=0;i<bs.length;i++){
    b=bs[i];
    if(b.in)continue;
    var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
    if(sp>maxSpd)maxSpd=sp;
  }
  n=Math.ceil(maxSpd*dt/(box.r*0.4));
  if(!(n>=1))n=1;
  if(n>12)n=12;
  var h=dt/n;
  for(s=0;s<n;s++){
    for(i=0;i<bs.length;i++){
      b=bs[i];
      if(b.in)continue;
      b.x+=b.vx*h;b.y+=b.vy*h;
    }
    // 落袋(先于库边判定,避免袋口被弹回)
    for(i=0;i<bs.length;i++){
      b=bs[i];
      if(b.in)continue;
      for(j=0;j<box.pockets.length;j++){
        var p=box.pockets[j];
        if(Math.sqrt((b.x-p.a)*(b.x-p.a)+(b.y-p.b)*(b.y-p.b))<p.r){
          b.in=true;b.vx=0;b.vy=0;b.pocket=j;break;
        }
      }
    }
    // 球与球:等质量弹性碰撞
    for(i=0;i<bs.length;i++){
      var A=bs[i];
      if(A.in)continue;
      for(j=i+1;j<bs.length;j++){
        var B=bs[j];
        if(B.in)continue;
        var dx=B.x-A.x,dy=B.y-A.y,rr=A.r+B.r,d2=dx*dx+dy*dy;
        if(d2>=rr*rr||d2<1e-8)continue;
        var d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=rr-d;
        A.x-=nx*ov*0.5;A.y-=ny*ov*0.5;
        B.x+=nx*ov*0.5;B.y+=ny*ov*0.5;
        var vn=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;
        if(vn<0){
          var jj=-(1+box.rest)*vn/2;
          A.vx-=jj*nx;A.vy-=jj*ny;
          B.vx+=jj*nx;B.vy+=jj*ny;
          if(box.onHit)box.onHit(A,B);
        }
      }
    }
    // 库边反弹
    for(i=0;i<bs.length;i++){
      b=bs[i];
      if(b.in)continue;
      if(b.x-b.r<box.L){b.x=box.L+b.r;if(b.vx<0)b.vx=-b.vx*box.railRest}
      if(b.x+b.r>box.R){b.x=box.R-b.r;if(b.vx>0)b.vx=-b.vx*box.railRest}
      if(b.y-b.r<box.T){b.y=box.T+b.r;if(b.vy<0)b.vy=-b.vy*box.railRest}
      if(b.y+b.r>box.B){b.y=box.B-b.r;if(b.vy>0)b.vy=-b.vy*box.railRest}
    }
    // 滚动摩擦
    for(i=0;i<bs.length;i++){
      b=bs[i];
      if(b.in)continue;
      var f=Math.exp(-box.decay*h);
      b.vx*=f;b.vy*=f;
      if(Math.sqrt(b.vx*b.vx+b.vy*b.vy)<box.stop){b.vx=0;b.vy=0}
    }
  }
}

/* ================== GAME · 台球 8 球 ================== */
var COLORS={1:'#f2c53d',2:'#2f6bff',3:'#e8413c',4:'#8a43d6',5:'#ff8a2b',
  6:'#22a94c',7:'#8d2b2b',8:'#171717',9:'#f2c53d',10:'#2f6bff',11:'#e8413c',
  12:'#8a43d6',13:'#ff8a2b',14:'#22a94c',15:'#8d2b2b'};
var TB={portrait:false,x:0,y:0,lw:0,lh:0,rail:0,L:0,T:0,R:0,B:0,r:9,pockets:[]};
var G={state:'start',turn:0,diff:1,groups:[null,null],busy:false,shots:0,time:0,
  msg:'',msgT:0,shake:0,balls:[],aiT:0,trail:true,trailPts:[],flash:[],
  shot:{firstHit:null,potted:[],cueIn:false,active:false}};
var aim={on:false,ang:-Math.PI/2,pw:0,x0:0,y0:0,x:0,y:0};
var drag=false;

function groupOf(n){if(n===0||n===8)return null;return n<8?'s':'b'}
function remain(g){
  if(!g)return 7;
  var n=0;
  for(var i=0;i<G.balls.length;i++){
    var b=G.balls[i];
    if(!b.in&&b.n!==0&&b.n!==8&&groupOf(b.n)===g)n++;
  }
  return n;
}
function byId(n){
  for(var i=0;i<G.balls.length;i++)if(G.balls[i].n===n)return G.balls[i];
  return null;
}

/* --- 桌面布局:横屏长条 / 竖屏竖条(本地坐标长边 = lw) --- */
function onResize(){
  var olw=TB.lw,olh=TB.lh;
  var pad=8;
  var top=clamp(Math.round(VH*0.13),84,104);
  var bot=VH-clamp(Math.round(VH*0.12),76,100);   // 底部留出力度条 + 轨迹按钮
  var availW=VW-pad*2,availH=bot-top;
  var ratio=1.72;
  TB.portrait=availH>availW;
  if(TB.portrait){
    TB.lh=Math.max(120,Math.min(availW,availH/ratio));
    TB.lw=TB.lh*ratio;
    TB.x=(VW-TB.lh)/2;
    TB.y=top+(availH-TB.lw)/2;
  }else{
    TB.lw=Math.max(200,Math.min(availW,availH*ratio));
    TB.lh=TB.lw/ratio;
    TB.x=(VW-TB.lw)/2;
    TB.y=top+(availH-TB.lh)/2;
  }
  TB.rail=Math.round(TB.lh*0.062);
  TB.r=Math.max(9,Math.round(TB.lh*0.0255));
  TB.L=TB.rail;TB.T=TB.rail;TB.R=TB.lw-TB.rail;TB.B=TB.lh-TB.rail;
  buildPockets();
  // 屏幕尺寸变化后按比例重排球位,防止球跑出桌面
  if(olw>0&&olh>0&&G.balls.length){
    var ka=TB.lw/olw,kb=TB.lh/olh;
    for(var i=0;i<G.balls.length;i++){
      var b=G.balls[i];
      b.x=clamp(b.x*ka,TB.L+TB.r,TB.R-TB.r);
      b.y=clamp(b.y*kb,TB.T+TB.r,TB.B-TB.r);
      b.vx=0;b.vy=0;
    }
  }
  for(var j=0;j<G.balls.length;j++)G.balls[j].r=TB.r;
}
function buildPockets(){
  var pr=TB.r*1.62,mid=(TB.L+TB.R)/2;
  TB.pockets=[
    {a:TB.L,b:TB.T,r:pr},{a:mid,b:TB.T,r:pr*0.94},{a:TB.R,b:TB.T,r:pr},
    {a:TB.L,b:TB.B,r:pr},{a:mid,b:TB.B,r:pr*0.94},{a:TB.R,b:TB.B,r:pr}
  ];
}

/* --- 开局摆球 --- */
function newBall(n,x,y){
  return {n:n,x:x,y:y,vx:0,vy:0,r:TB.r,in:false,pocket:-1,counted:false,
    col:COLORS[n]||'#fff',stripe:n>8};
}
function rack(){
  G.balls=[];
  var cueA=TB.L+(TB.R-TB.L)*0.24,cy=(TB.T+TB.B)/2;
  G.balls.push(newBall(0,cueA,cy));
  var order=[1,9,2,10,8,3,11,4,12,5,13,6,14,7,15];
  var apexA=TB.L+(TB.R-TB.L)*0.72;
  var dx=TB.r*1.76,dw=TB.r*2.02;
  var k=0;
  for(var row=0;row<5;row++){
    for(var i=0;i<=row;i++){
      var a=apexA+row*dx;
      var b=cy+(i-row/2)*dw;
      G.balls.push(newBall(order[k++],a,b));
    }
  }
}

/* --- 击球 / 判罚 --- */
function shoot(ang,pw){
  if(G.busy||G.state!=='play')return;
  var c=G.balls[0];
  if(c.in)resetCue();
  var sp=170+pw*1180;
  c.vx=Math.cos(ang)*sp;c.vy=Math.sin(ang)*sp;
  G.busy=true;G.shots++;
  G.shot={firstHit:null,potted:[],cueIn:false,active:true};
  G.trailPts=[];
  aim.pw=0;aim.on=false;drag=false;
  G.msg='';G.msgT=0;
  noise(.07,.03);tone(210,.1,'triangle',.05,120);
}
function onHit(A,B){
  if(!G.shot.active)return;
  if(G.shot.firstHit!==null)return;
  if(A.n===0)G.shot.firstHit=B.n;
  else if(B.n===0)G.shot.firstHit=A.n;
}
function trackPots(){
  for(var i=0;i<G.balls.length;i++){
    var b=G.balls[i];
    if(!b.in||b.counted)continue;
    b.counted=true;
    G.shot.potted.push(b.n);
    if(b.n===0)G.shot.cueIn=true;
    var p=TB.pockets[b.pocket||0]||{a:b.x,b:b.y};
    G.flash.push({a:p.a,b:p.b,life:.45,max:.45,col:b.col});
    if(b.n===0){noise(.2,.07);tone(160,.22,'sine',.06,70)}
    else{tone(520,.08,'triangle',.07,780);noise(.06,.03)}
  }
}
function allStopped(){
  for(var i=0;i<G.balls.length;i++){
    var b=G.balls[i];
    if(b.in)continue;
    if(b.vx||b.vy)return false;
  }
  return true;
}
function resetCue(){
  var c=G.balls[0];
  c.in=false;c.counted=false;c.vx=0;c.vy=0;c.pocket=-1;
  var a=TB.L+(TB.R-TB.L)*0.24,b=(TB.T+TB.B)/2;
  for(var t=0;t<40;t++){
    var free=true;
    for(var i=1;i<G.balls.length;i++){
      var o=G.balls[i];
      if(o.in)continue;
      if(Math.abs(o.x-a)<TB.r*2.1&&Math.abs(o.y-b)<TB.r*2.1){free=false;break}
    }
    if(free)break;
    a-=TB.lw*0.018;
  }
  c.x=a;c.y=b;
}
function switchTurn(){
  G.turn=1-G.turn;
  if(G.turn===1)G.aiT=1.1+frnd()*0.6;
}
function endShot(){
  var s=G.shot;
  s.active=false;
  var me=G.turn,opp=1-me;
  var preGroup=G.groups[me];
  var foul=false,note='';
  var cue=G.balls[0];

  if(!s.firstHit){foul=true;note='空杆 · 没碰到任何球'}
  else{
    var fh=byId(s.firstHit);
    if(fh){
      if(preGroup){
        if(remain(preGroup)===0){
          if(fh.n!==8){foul=true;note='该打黑 8 了'}
        }else if(fh.n===8){foul=true;note='不能先碰黑 8'}
        else if(groupOf(fh.n)!==preGroup){foul=true;note='先碰到对方的球'}
      }else if(fh.n===8){foul=true;note='开局不能先碰黑 8'}
    }
  }
  if(s.cueIn){foul=true;note='白球落袋'}

  var potted=s.potted,eight=false,i,n;
  for(i=0;i<potted.length;i++)if(potted[i]===8)eight=true;

  // 定组:开球后首个合法进球决定花色
  if(!G.groups[me]&&!foul&&!eight){
    for(i=0;i<potted.length;i++){
      n=potted[i];
      if(n===0||n===8)continue;
      var gg=groupOf(n);
      G.groups[me]=gg;
      G.groups[opp]=gg==='s'?'b':'s';
      G.msg=(gg==='s'?'你打全色 1-7':'你打花色 9-15');
      G.msgT=2.4;
      break;
    }
  }

  var mine=0,other=0;
  for(i=0;i<potted.length;i++){
    n=potted[i];
    if(n===0||n===8)continue;
    if(groupOf(n)===G.groups[me])mine++;else other++;
  }

  if(eight){
    var win=!!(G.groups[me]&&remain(G.groups[me])===0&&!foul);
    finish(me===0?win:!win);         // 黑 8 由谁打进,决定谁的胜负
    return;
  }

  if(foul){
    if(cue.in)resetCue();
    G.msg='犯规:'+note+' · 换对手';
    G.msgT=2.2;
    if(!muted)tone(200,.16,'sawtooth',.05,120);
    switchTurn();
    return;
  }
  if(cue.in)resetCue();

  if(mine>0&&other===0){
    G.msg='进球 +'+mine+' · 继续打';
    G.msgT=1.8;
  }else if(mine>0){
    G.msg='进球 +'+mine+' (误进 '+other+') · 继续打';
    G.msgT=1.8;
  }else{
    G.msg=other>0?'打进对方的球 · 换对手':'没进 · 换对手';
    G.msgT=1.8;
    switchTurn();
  }
  if(G.turn===1&&G.aiT<=0)G.aiT=1.1;   // 同一人连打时,AI 也要重新上膛
}
function finish(win){
  G.state='over';stop();
  document.body.classList.remove('playing');
  var wins=+lsGet('bill_wins',0);
  if(win){wins++;lsSet('bill_wins',wins)}
  var t=Math.floor(G.time);
  $('otitle').textContent=win?'🏆 你 赢 了':'对 手 获 胜';
  $('onewrec').style.display=win?'block':'none';
  $('ostats').innerHTML=
    '结果 <b>'+(win?'胜利':'失败')+'</b><br>'+
    '击球 <b>'+G.shots+' 次</b><br>'+
    '用时 <b>'+Math.floor(t/60)+':'+('0'+(t%60)).slice(-2)+'</b><br>'+
    '我方剩球 <b>'+(remain(G.groups[0]))+'</b> · 对手剩球 <b>'+remain(G.groups[1])+'</b><br>'+
    '历史胜场 <b>'+wins+'</b>';
  $('mini2').innerHTML='已玩 <b>'+KIT.plays()+'</b> 局 · 连续打卡 <b>'+KIT.streakNow()+'</b> 天 🔥';
  $('over').classList.remove('hide');
  tone(win?660:240,.16,'sine',.07);
  setTimeout(function(){tone(win?880:190,.16,'sine',.07)},150);
  setTimeout(function(){tone(win?1170:150,.26,'sine',.07)},300);
}

/* --- AI --- */
function segDist(px,py,x1,y1,x2,y2){
  var dx=x2-x1,dy=y2-y1,len2=dx*dx+dy*dy;
  var t=len2>0?((px-x1)*dx+(py-y1)*dy)/len2:0;
  t=clamp(t,0,1);
  var ex=x1+dx*t-px,ey=y1+dy*t-py;
  return Math.sqrt(ex*ex+ey*ey);
}
function pathClear(x1,y1,x2,y2,ex){
  for(var i=0;i<G.balls.length;i++){
    var b=G.balls[i];
    if(b.in||b===ex||b.n===0)continue;
    if(segDist(b.x,b.y,x1,y1,x2,y2)<TB.r*2.02)return false;
  }
  return true;
}
function aiShoot(){
  if(G.state!=='play'||G.turn!==1||G.busy)return;
  var cue=G.balls[0],my=G.groups[1];
  var err=[0.085,0.036,0.013][G.diff];
  var alive=[],i,j;
  for(i=0;i<G.balls.length;i++){
    var b=G.balls[i];
    if(b.in||b.n===0)continue;
    alive.push(b);
  }
  var targets=[];
  for(i=0;i<alive.length;i++){
    var t=alive[i];
    if(t.n===8){if(my&&remain(my)===0)targets.push(t)}
    else if(!my)targets.push(t);
    else if(groupOf(t.n)===my)targets.push(t);
  }
  if(!targets.length)targets=alive;
  var cands=[];
  for(i=0;i<targets.length;i++){
    var tb=targets[i];
    for(j=0;j<TB.pockets.length;j++){
      var p=TB.pockets[j];
      var pdx=p.a-tb.x,pdy=p.b-tb.y,pd=Math.sqrt(pdx*pdx+pdy*pdy);
      if(pd<TB.r*2)continue;
      var ux=pdx/pd,uy=pdy/pd;
      if(!pathClear(tb.x,tb.y,tb.x+ux*pd,tb.y+uy*pd,tb))continue;
      var gx=tb.x-ux*TB.r*2.02,gy=tb.y-uy*TB.r*2.02;
      var cdx=gx-cue.x,cdy=gy-cue.y,cd=Math.sqrt(cdx*cdx+cdy*cdy);
      if(cd<TB.r*0.9)continue;
      var vx=cdx/cd,vy=cdy/cd;
      var tdx=tb.x-cue.x,tdy=tb.y-cue.y,td=Math.sqrt(tdx*tdx+tdy*tdy);
      if(td<TB.r*0.5)continue;
      var cosA=(tdx*vx+tdy*vy)/td;
      if(cosA<0.3)continue;                                 // 角度太薄,放弃
      if(!pathClear(cue.x,cue.y,gx,gy,tb))continue;
      cands.push({tb:tb,pd:pd,cd:cd,ang:Math.atan2(cdy,cdx),score:cosA*1.7-pd/(TB.lw*2.2)-cd/(TB.lw*2.6)});
    }
  }
  cands.sort(function(a,b){return b.score-a.score});
  var pickC=null;
  if(cands.length){
    pickC=cands[0];
    if(G.diff===0&&cands.length>2&&frnd()<0.35)pickC=cands[rnd(Math.min(3,cands.length))];
  }
  var ang,pw;
  if(pickC){
    ang=pickC.ang+(frnd()-.5)*2*err;
    pw=clamp(0.4+pickC.pd/(TB.lw*0.9),0.34,0.94)+(frnd()-.5)*(G.diff===0?0.16:0.05);
  }else{
    var best=null,bd=1e9;
    for(i=0;i<targets.length;i++){
      var dd=Math.sqrt((targets[i].x-cue.x)*(targets[i].x-cue.x)+(targets[i].y-cue.y)*(targets[i].y-cue.y));
      if(dd<bd){bd=dd;best=targets[i]}
    }
    if(!best){switchTurn();return}
    ang=Math.atan2(best.y-cue.y,best.x-cue.x)+(frnd()-.5)*(G.diff===2?0.06:0.18);
    pw=0.32+frnd()*0.14;
  }
  G.aiT=0;
  shoot(ang,clamp(pw,0.18,1));
}

/* --- 更新 --- */
function update(dt){
  if(G.state!=='play')return;
  G.time+=dt;
  if(G.msgT>0)G.msgT-=dt;
  if(G.shake>0)G.shake-=dt*1.6;
  for(var f=G.flash.length-1;f>=0;f--){
    G.flash[f].life-=dt;
    if(G.flash[f].life<=0)G.flash.splice(f,1);
  }
  if(G.busy){
    physStep(G.balls,{
      L:TB.L,T:TB.T,R:TB.R,B:TB.B,r:TB.r,pockets:TB.pockets,
      rest:0.955,railRest:0.87,decay:1.45,stop:7,onHit:onHit
    },dt);
    trackPots();
    var c=G.balls[0];
    if(G.trail&&!c.in){
      if(G.trailPts.length<620)G.trailPts.push({x:c.x,y:c.y});
    }
    if(allStopped()){G.busy=false;endShot()}
  }else if(G.turn===1){
    if(G.aiT>0)G.aiT-=dt;
    if(G.aiT<=0)aiShoot();            // 兜底:AI 到点必出手,不会卡住
  }
  syncHud();
}
function syncHud(){
  var t=Math.floor(G.time);
  $('htime').textContent=Math.floor(t/60)+':'+('0'+(t%60)).slice(-2);
  $('hmy').textContent=G.groups[0]?remain(G.groups[0]):7;
  $('hfoe').textContent=G.groups[1]?remain(G.groups[1]):7;
}

/* --- 坐标换算 --- */
function viewTf(){
  if(TB.portrait){
    ctx.translate(TB.x+TB.lh,TB.y);
    ctx.rotate(Math.PI/2);
  }else{
    ctx.translate(TB.x,TB.y);
  }
}
function toLocal(sx,sy){
  if(TB.portrait)return {a:sy-TB.y,b:(TB.x+TB.lh)-sx};
  return {a:sx-TB.x,b:sy-TB.y};
}

/* --- 预测:射线先碰到哪颗球 / 哪条库边 --- */
function predict(ox,oy,ux,uy){
  var best=1e9,hit=null,i;
  for(i=0;i<G.balls.length;i++){
    var b=G.balls[i];
    if(b.in||b.n===0)continue;
    var ex=b.x-ox,ey=b.y-oy,proj=ex*ux+ey*uy;
    if(proj<=0)continue;
    var perp2=ex*ex+ey*ey-proj*proj,rad=TB.r*2;
    if(perp2>rad*rad)continue;
    var t=proj-Math.sqrt(rad*rad-perp2);
    if(t<0)continue;
    if(t<best){best=t;hit=b}
  }
  var tw=1e9;
  if(ux>0)tw=Math.min(tw,(TB.R-TB.r-ox)/ux);
  if(ux<0)tw=Math.min(tw,(TB.L+TB.r-ox)/ux);
  if(uy>0)tw=Math.min(tw,(TB.B-TB.r-oy)/uy);
  if(uy<0)tw=Math.min(tw,(TB.T+TB.r-oy)/uy);
  if(tw<best){best=Math.max(0,tw);hit=null}
  return {t:best,b:hit};
}

/* --- 绘制 --- */
function drawTable(){
  // 木框
  var wg=ctx.createLinearGradient(0,0,0,TB.lh);
  wg.addColorStop(0,'#7b4a26');wg.addColorStop(.5,'#5d3618');wg.addColorStop(1,'#3d2210');
  ctx.fillStyle=wg;
  roundRect(0,0,TB.lw,TB.lh,TB.rail*0.9);ctx.fill();
  ctx.strokeStyle='rgba(255,220,170,.22)';ctx.lineWidth=2;
  roundRect(2,2,TB.lw-4,TB.lh-4,TB.rail*0.85);ctx.stroke();
  // 绒布
  var cg=ctx.createRadialGradient((TB.L+TB.R)/2,(TB.T+TB.B)/2,TB.r*2,(TB.L+TB.R)/2,(TB.T+TB.B)/2,TB.lw*0.62);
  cg.addColorStop(0,'#157a4f');cg.addColorStop(.6,'#0e5c3b');cg.addColorStop(1,'#083d28');
  ctx.fillStyle=cg;
  ctx.fillRect(TB.L,TB.T,TB.R-TB.L,TB.B-TB.T);
  ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=Math.max(2,TB.rail*0.18);
  ctx.strokeRect(TB.L,TB.T,TB.R-TB.L,TB.B-TB.T);
  // 库边点
  ctx.fillStyle='rgba(255,245,215,.6)';
  var i,d;
  for(i=1;i<=3;i++){
    d=i/4;
    dot(TB.L+(TB.R-TB.L)*d,TB.T-TB.rail*0.45,TB.r*0.17);
    dot(TB.L+(TB.R-TB.L)*d,TB.B+TB.rail*0.45,TB.r*0.17);
  }
  for(i=1;i<=2;i++){
    d=i/3;
    dot(TB.L-TB.rail*0.45,TB.T+(TB.B-TB.T)*d,TB.r*0.17);
    dot(TB.R+TB.rail*0.45,TB.T+(TB.B-TB.T)*d,TB.r*0.17);
  }
  // 开球线
  var ha=TB.L+(TB.R-TB.L)*0.24;
  ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(ha,TB.T);ctx.lineTo(ha,TB.B);ctx.stroke();
  dot(ha,(TB.T+TB.B)/2,TB.r*0.16);
  // 袋口
  for(i=0;i<TB.pockets.length;i++){
    var p=TB.pockets[i];
    ctx.fillStyle='#0a0a0a';
    ctx.beginPath();ctx.arc(p.a,p.b,p.r,0,6.2832);ctx.fill();
    ctx.strokeStyle='rgba(255,220,160,.18)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(p.a,p.b,p.r*1.06,0,6.2832);ctx.stroke();
  }
}
function dot(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill()}
function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawBalls(){
  for(var i=0;i<G.balls.length;i++){
    var b=G.balls[i];
    if(b.in)continue;
    var r=b.r,x=b.x,y=b.y;
    ctx.fillStyle='rgba(0,0,0,.32)';
    ctx.beginPath();ctx.ellipse(x+r*0.16,y+r*0.22,r*1.02,r*0.96,0,0,6.2832);ctx.fill();
    ctx.save();
    ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.clip();
    if(b.n===0){
      ctx.fillStyle='#f7f7f2';ctx.fillRect(x-r,y-r,r*2,r*2);
    }else if(!b.stripe){
      ctx.fillStyle=b.col;ctx.fillRect(x-r,y-r,r*2,r*2);
    }else{
      ctx.fillStyle='#f7f7f2';ctx.fillRect(x-r,y-r,r*2,r*2);
      ctx.fillStyle=b.col;
      ctx.fillRect(x-r,y-r,r*2,r*0.62);
      ctx.fillRect(x-r,y+r*0.38,r*2,r*0.62);
    }
    var sh=ctx.createRadialGradient(x-r*0.34,y-r*0.4,r*0.08,x,y,r*1.06);
    sh.addColorStop(0,'rgba(255,255,255,.55)');
    sh.addColorStop(.45,'rgba(255,255,255,0)');
    sh.addColorStop(1,'rgba(0,0,0,.38)');
    ctx.fillStyle=sh;ctx.fillRect(x-r,y-r,r*2,r*2);
    ctx.restore();
    ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(x,y,r-0.5,0,6.2832);ctx.stroke();
    if(b.n>0){
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(x,y,r*0.46,0,6.2832);ctx.fill();
      ctx.save();
      ctx.translate(x,y);
      if(TB.portrait)ctx.rotate(-Math.PI/2);
      ctx.fillStyle='#161616';
      ctx.font='900 '+Math.round(r*0.72)+'px system-ui,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(b.n,0,r*0.04);
      ctx.restore();
    }
  }
}
function drawAim(){
  if(!drag||G.turn!==0||G.busy)return;
  var c=G.balls[0];
  if(c.in)return;
  var ux=Math.cos(aim.ang),uy=Math.sin(aim.ang);
  var hit=predict(c.x,c.y,ux,uy);
  var t=hit.t,len=Math.min(t,TB.lw);
  // 杆
  var back=TB.r*1.7+aim.pw*TB.r*2.6,len2=TB.r*9;
  var sx=c.x-ux*(back+len2),sy=c.y-uy*(back+len2);
  var ex=c.x-ux*back,ey=c.y-uy*back;
  var gg=ctx.createLinearGradient(sx,sy,ex,ey);
  gg.addColorStop(0,'#5b3b1d');gg.addColorStop(.35,'#d8b26a');gg.addColorStop(1,'#f3e0b6');
  ctx.strokeStyle=gg;ctx.lineWidth=Math.max(2.5,TB.r*0.34);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
  // 预测虚线
  ctx.setLineDash([TB.r*0.55,TB.r*0.55]);
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(c.x+ux*len,c.y+uy*len);ctx.stroke();
  ctx.setLineDash([]);
  // 白球撞击点虚影
  var gx=c.x+ux*len,gy=c.y+uy*len;
  ctx.strokeStyle='rgba(180,255,220,.75)';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.arc(gx,gy,TB.r,0,6.2832);ctx.stroke();
  if(hit.b){
    var nx=hit.b.x-gx,ny=hit.b.y-gy,d=Math.sqrt(nx*nx+ny*ny)||1;
    nx/=d;ny/=d;
    ctx.strokeStyle='rgba(255,214,90,.9)';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(hit.b.x,hit.b.y);
    ctx.lineTo(hit.b.x+nx*TB.r*5.2,hit.b.y+ny*TB.r*5.2);
    ctx.stroke();
    ctx.fillStyle='rgba(255,214,90,.9)';
    ctx.beginPath();ctx.arc(hit.b.x+nx*TB.r*5.2,hit.b.y+ny*TB.r*5.2,TB.r*0.2,0,6.2832);ctx.fill();
  }
}
function drawTrail(){
  if(!G.trail||G.trailPts.length<2)return;
  ctx.strokeStyle='rgba(180,255,220,.22)';ctx.lineWidth=1.6;
  ctx.beginPath();
  for(var i=0;i<G.trailPts.length;i++){
    var p=G.trailPts[i];
    if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();
}
function drawFlash(){
  for(var i=0;i<G.flash.length;i++){
    var f=G.flash[i],l=clamp(f.life/f.max,0,1);
    ctx.globalAlpha=l*0.8;
    ctx.strokeStyle='#ffd45c';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(f.a,f.b,TB.r*(1.2+(1-l)*2.4),0,6.2832);ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawPowerBar(){
  var w=VW-44,h=9,y=VH-58;
  ctx.fillStyle='rgba(255,255,255,.12)';
  roundRect(22,y,w,h,h/2);ctx.fill();
  var g=ctx.createLinearGradient(22,0,22+w,0);
  g.addColorStop(0,'#6fdc9b');g.addColorStop(.6,'#ffd45c');g.addColorStop(1,'#ff5a4a');
  ctx.fillStyle=g;
  roundRect(22,y,Math.max(h,w*aim.pw),h,h/2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.font='700 11px system-ui,sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('力度',22,y-10);
}
function drawStatus(){
  var txt='';
  if(G.state!=='play')return;
  if(G.msgT>0)txt=G.msg;
  else if(G.turn===1)txt='对手思考中…';
  else txt='你的回合 · '+(G.groups[0]?(G.groups[0]==='s'?'全色 1-7':'花色 9-15'):'自由球');
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='900 13px system-ui,sans-serif';
  var w=ctx.measureText(txt).width+26;
  ctx.fillStyle='rgba(6,26,18,.72)';
  roundRect(VW/2-w/2,56,w,26,13);ctx.fill();
  ctx.fillStyle=G.turn===1?'#ffb3a7':'#a8f2c8';
  ctx.fillText(txt,VW/2,70);
}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#12291f');g.addColorStop(.6,'#0e2018');g.addColorStop(1,'#07120d');
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  var rg=ctx.createRadialGradient(VW*0.5,VH*0.42,0,VW*0.5,VH*0.42,Math.max(VW,VH)*0.7);
  rg.addColorStop(0,'rgba(90,220,160,.12)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,VW,VH);

  ctx.save();
  if(G.shake>0)ctx.translate((frnd()-.5)*8*G.shake,(frnd()-.5)*8*G.shake);
  viewTf();
  drawTable();
  drawTrail();
  drawBalls();
  drawAim();
  drawFlash();
  ctx.restore();

  drawPowerBar();
  drawStatus();
}

/* --- 输入:拖动瞄准 + 松手击球 --- */
function tableHit(sx,sy){
  var p=toLocal(sx,sy);
  return p.a>-TB.rail*0.6&&p.a<TB.lw+TB.rail*0.6&&p.b>-TB.rail*0.6&&p.b<TB.lh+TB.rail*0.6;
}
function aimFrom(sx,sy){
  var c=G.balls[0],p=toLocal(sx,sy);
  var dx=p.a-c.x,dy=p.b-c.y,d=Math.sqrt(dx*dx+dy*dy);
  if(d>TB.r*0.5){aim.ang=Math.atan2(dy,dx);aim.on=true}
  var d0=toLocal(aim.x0,aim.y0);
  var dragLen=Math.sqrt((p.a-d0.a)*(p.a-d0.a)+(p.b-d0.b)*(p.b-d0.b));
  var maxDrag=Math.max(110,Math.min(210,TB.lh*0.62));
  aim.pw=clamp(dragLen/maxDrag,0,1);
}
cv.addEventListener('pointerdown',function(e){
  if(G.state!=='play'||G.turn!==0||G.busy)return;
  if(!tableHit(e.clientX,e.clientY))return;
  drag=true;
  aim.x0=e.clientX;aim.y0=e.clientY;
  aimFrom(e.clientX,e.clientY);
},{passive:true});
cv.addEventListener('pointermove',function(e){
  if(!drag)return;
  if(G.state!=='play'||G.turn!==0||G.busy){drag=false;return}
  aimFrom(e.clientX,e.clientY);
},{passive:true});
cv.addEventListener('pointerup',function(e){
  if(!drag)return;
  drag=false;
  if(G.state!=='play'||G.turn!==0||G.busy||aim.pw<0.1)return;
  shoot(aim.ang,aim.pw);
},{passive:true});
cv.addEventListener('pointercancel',function(){drag=false});

window.addEventListener('keydown',function(e){
  if(G.state!=='play'){
    if(e.key===' '||e.key==='Enter'){startGame();e.preventDefault()}
    return;
  }
  e.preventDefault();
});

/* --- 生命周期 --- */
function startGame(){
  G.state='play';G.turn=0;G.groups=[null,null];G.busy=false;G.shots=0;G.time=0;
  G.msg='';G.msgT=0;G.shake=0;G.trailPts=[];G.flash=[];G.aiT=0;
  aim.on=false;aim.pw=0;drag=false;
  rack();syncHud();
  $('start').classList.add('hide');$('over').classList.add('hide');
  document.body.classList.add('playing');
  KIT.addPlay();KIT.streak();
  run();
}

/* --- 启动 --- */
Array.prototype.forEach.call(document.querySelectorAll('#diffrow .diff'),function(btn){
  btn.addEventListener('click',function(){
    Array.prototype.forEach.call(document.querySelectorAll('#diffrow .diff'),function(b){b.classList.remove('on')});
    btn.classList.add('on');
    G.diff=+btn.getAttribute('data-d');
    lsSet('bill_diff',String(G.diff));
  });
});
$('trailbtn').addEventListener('click',function(){
  G.trail=!G.trail;
  this.textContent=G.trail?'轨迹 开':'轨迹 关';
  this.classList.toggle('off',!G.trail);
  lsSet('bill_trail',G.trail?'1':'0');
  if(!G.trail)G.trailPts=[];
});
$('startbtn').addEventListener('click',startGame);
$('againbtn').addEventListener('click',startGame);
$('hubbtn').addEventListener('click',function(){location.href='/'});
$('sharebtn').addEventListener('click',function(){
  var win=G.groups[0]&&remain(G.groups[0])===0;
  share('我在「台球 · 8 球」'+(win?'清台赢了一局':'打了一局')+',用了 '+G.shots+' 杆、'+
    Math.floor(G.time)+' 秒!来打一局? https://yaoaibing.github.io/billiards/');
});

G.diff=clamp(+lsGet('bill_diff',1),0,2);
G.trail=lsGet('bill_trail','1')!=='0';
$('trailbtn').textContent=G.trail?'轨迹 开':'轨迹 关';
if(!G.trail)$('trailbtn').classList.add('off');
Array.prototype.forEach.call(document.querySelectorAll('#diffrow .diff'),function(b){
  b.classList.toggle('on',+b.getAttribute('data-d')===G.diff);
});
$('mini').innerHTML='历史胜场 <b>'+KIT.best()+'</b> · 已玩 <b>'+KIT.plays()+'</b> 局'+
  (KIT.streakNow()>1?' · 连续打卡 <b>'+KIT.streakNow()+'</b> 天 🔥':'');

resize();
rack();
syncHud();
draw();
})();
</script>

<!-- __hub_enhance__ -->
<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';
  var name=(document.title||'游戏').split(/[ ··|]/)[0];

  // 回大厅
  var hb=document.createElement('button');
  hb.setAttribute('type','button');hb.textContent='\uD83C\uDFE0';
  hb.style.cssText='position:fixed;top:'+SAFE+';left:10px;z-index:99;border:0;width:36px;height:36px;'+
    'border-radius:12px;font-size:15px;background:rgba(255,255,255,.14);color:#fff;'+
    'border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);cursor:pointer';
  hb.onclick=function(){location.href='/'};
  document.body.appendChild(hb);

  // 结算页:晒战绩 + 换个游戏
  var over=document.getElementById('over');
  if(over){
    var box=document.createElement('div');
    box.style.cssText='display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px';
    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>


<!-- __hub_recent__ -->
<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='billiards'});
  r.unshift({k:'billiards',n:'台球',e:'🎱'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:定期把本游戏自己的最高分同步进共享的 __best
     (不用劫持 localStorage.setItem —— 那在部分环境下属性不可写会静默失败) */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['billiards_best','billiards_hi','billiards_max','billiards_score'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['billiards']||0)){
            B['billiards']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
