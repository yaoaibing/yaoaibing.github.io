<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='hashi_best',PLAY='hashi_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 数桥连岛 · 海上航线 ================== */
var NAME = '数桥连岛 · 海上航线';
/* 关卡:is = 岛屿栅格坐标,bp = 参考解的桥 [甲, 乙, 数量] */
var LEVELS = [
  { is: [[0, 0], [4, 0], [4, 4]], bp: [[0, 1, 2], [1, 2, 2]] },
  { is: [[0, 0], [4, 0], [0, 4], [4, 4]], bp: [[0, 1, 1], [1, 3, 1], [3, 2, 1], [2, 0, 1]] },
  { is: [[0, 0], [4, 0], [0, 4], [4, 4]], bp: [[0, 1, 2], [2, 3, 2], [0, 2, 1], [1, 3, 1]] },
  {
    is: [[0, 0], [4, 0], [0, 4], [4, 4], [0, 2], [4, 2], [2, 2]],
    bp: [[0, 4, 1], [4, 2, 1], [1, 5, 1], [5, 3, 1], [0, 1, 2], [2, 3, 2], [4, 6, 1], [6, 5, 1]]
  },
  {
    is: [[0, 0], [2, 0], [4, 0], [0, 2], [4, 2], [0, 4], [2, 4], [4, 4]],
    bp: [[0, 1, 2], [1, 2, 1], [0, 3, 1], [2, 4, 2], [3, 5, 2], [5, 6, 1], [6, 7, 2], [7, 4, 1], [3, 4, 1]]
  },
  {
    is: [[0, 0], [2, 0], [4, 0], [0, 2], [2, 2], [4, 2], [0, 4], [2, 4], [4, 4]],
    bp: [[0, 1, 1], [1, 2, 1], [2, 5, 2], [5, 8, 2], [8, 7, 1], [7, 6, 1], [6, 3, 2], [3, 0, 2],
      [3, 4, 1], [4, 5, 1], [1, 4, 1], [4, 7, 1]]
  }
];
var state = 'start';
var lv = 0, isl = [], need = [], cnt = {}, sel = -1, hints = 3;
var solvedLv = {}, steps = 0, wrong = 0;
var msg = '', msgT = 0, gx0 = 0, gy0 = 0, cell = 40;

function layout() {
  gx0 = 40;
  gy0 = 100;
  var w = VW - 80, h = VH - 260;
  cell = Math.max(28, Math.min(w / 4, h / 4));
}
function onResize() { layout(); }
function px(i) { return gx0 + isl[i][0] * cell }
function py(i) { return gy0 + isl[i][1] * cell }
function key(a, b) { return a < b ? a + '-' + b : b + '-' + a }
function get(a, b) { return cnt[key(a, b)] || 0 }
function deg(i) {
  var d = 0;
  for (var k in cnt) {
    var p = k.split('-');
    if (+p[0] === i || +p[1] === i) d += cnt[k];
  }
  return d;
}
function loadLevel(n) {
  lv = n; isl = []; cnt = {}; sel = -1;
  for (var i = 0; i < LEVELS[n].is.length; i++) isl.push(LEVELS[n].is[i]);
  need = [];
  for (i = 0; i < isl.length; i++) need.push(0);
  LEVELS[n].bp.forEach(function (b) { need[b[0]] += b[2]; need[b[1]] += b[2]; });
  msg = ''; msgT = 0;
  syncHud();
}
function align(a, b) { return isl[a][0] === isl[b][0] || isl[a][1] === isl[b][1] }
function blocked(a, b) {
  var ax = isl[a][0], ay = isl[a][1], bx = isl[b][0], by = isl[b][1];
  for (var i = 0; i < isl.length; i++) {
    if (i === a || i === b) continue;
    var x = isl[i][0], y = isl[i][1];
    if (ax === bx) { if (x === ax && y > Math.min(ay, by) && y < Math.max(ay, by)) return true }
    else if (ay === by) { if (y === ay && x > Math.min(ax, bx) && x < Math.max(ax, bx)) return true }
  }
  return false;
}
function segHit(x1, y1, x2, y2, x3, y3, x4, y4) {
  function cr(ax, ay, bx, by, cx, cy) { return (bx - ax) * (cy - ay) - (by - ay) * (cx - ax) }
  var d1 = cr(x3, y3, x4, y4, x1, y1), d2 = cr(x3, y3, x4, y4, x2, y2);
  var d3 = cr(x1, y1, x2, y2, x3, y3), d4 = cr(x1, y1, x2, y2, x4, y4);
  return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
}
var GAP = .1;
/* 桥的两端被岛屿压住,盘内重叠不算交叉:判定前把两端各缩进一个岛半径 */
function shrink(l) {
  var dx = l[2] - l[0], dy = l[3] - l[1], L = Math.hypot(dx, dy) || 1;
  var t = Math.min(cell * .34, L / 2 - 1) / L;
  return [l[0] + dx * t, l[1] + dy * t, l[2] - dx * t, l[3] - dy * t];
}
function lineAt(a, b, off) {
  var x1 = px(a), y1 = py(a), x2 = px(b), y2 = py(b);
  if (isl[a][1] === isl[b][1]) { y1 += off * cell; y2 += off * cell }
  else { x1 += off * cell; x2 += off * cell }
  return [x1, y1, x2, y2];
}
function crosses(a, b, off) {
  var l = shrink(lineAt(a, b, off)), k = key(a, b);
  for (var k2 in cnt) {
    if (!cnt[k2] || k2 === k) continue;
    var q = k2.split('-'), i1 = +q[0], i2 = +q[1];
    var offs = cnt[k2] === 2 ? [-GAP, GAP] : [0];
    for (var t = 0; t < offs.length; t++) {
      var m = shrink(lineAt(i1, i2, offs[t]));
      if (segHit(l[0], l[1], l[2], l[3], m[0], m[1], m[2], m[3])) return true;
    }
  }
  return false;
}
function canBuild(a, b) {
  if (a === b) return '不能连到自己';
  if (!align(a, b)) return '两岛必须横竖对齐';
  if (blocked(a, b)) return '中间隔着别的岛';
  if (get(a, b) >= 2) return '一座海峡最多两条桥';
  if (deg(a) + 1 > need[a] || deg(b) + 1 > need[b]) return '桥数会超过岛上数字';
  if (get(a, b) === 0) { if (crosses(a, b, 0)) return '桥不能交叉' }
  else if (crosses(a, b, -GAP) || crosses(a, b, GAP)) return '两条桥会压到别的桥';
  return '';
}
function build(a, b) {
  var why = canBuild(a, b);
  if (why) { msg = why; msgT = 1.6; wrong++; tone(180, .12, 'square', .04); syncHud(); return false }
  var k = key(a, b);
  cnt[k] = (cnt[k] || 0) + 1;
  steps++;
  tone(500 + cnt[k] * 120, .09, 'triangle', .045);
  checkWin();
  syncHud();
  return true;
}
function removeAt(a, b) {
  var k = key(a, b);
  if (!cnt[k]) return false;
  cnt[k]--;
  if (!cnt[k]) delete cnt[k];
  steps++;
  tone(300, .07, 'sine', .035);
  syncHud();
  return true;
}
function undo() {
  var last = undoStack.pop();
  if (!last) { msg = '没有可撤销的桥'; msgT = 1.2; return }
  if (last.add) { var k = key(last.a, last.b); cnt[k]--; if (!cnt[k]) delete cnt[k] }
  else { cnt[key(last.a, last.b)] = (cnt[key(last.a, last.b)] || 0) + 1 }
  syncHud();
}
var undoStack = [];
function connected() {
  if (!isl.length) return false;
  var seen = {}, q = [0]; seen[0] = 1;
  while (q.length) {
    var i = q.shift();
    for (var k in cnt) {
      if (!cnt[k]) continue;
      var p = k.split('-'), a = +p[0], b = +p[1];
      if (a === i && !seen[b]) { seen[b] = 1; q.push(b) }
      if (b === i && !seen[a]) { seen[a] = 1; q.push(a) }
    }
  }
  return Object.keys(seen).length === isl.length;
}
function openCount() {
  var n = 0;
  for (var i = 0; i < isl.length; i++) if (deg(i) !== need[i]) n++;
  return n;
}
function checkWin() {
  if (openCount() === 0 && connected()) {
    solvedLv[lv] = 1;
    if (lv + 1 < LEVELS.length) {
      msg = '连好了!进入下一盘'; msgT = 1.8;
      tone(880, .2, 'sine', .06, 1320);
      setTimeout(function () { if (state === 'play') loadLevel(lv + 1) }, 900);
    } else {
      endGame();
    }
  }
}
function resetGame() {
  lv = 0; sel = -1; hints = 3; steps = 0; wrong = 0;
  solvedLv = {}; undoStack = [];
  loadLevel(0);
}
function startGame() {
  resetGame();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}
function endGame() {
  state = 'over';
  KIT.addPlay(); KIT.streak();
  var done = Object.keys(solvedLv).length;
  var score = Math.max(0, done * 300 - wrong * 25 - (3 - hints) * 60);
  var rec = KIT.setBest(score);
  var rank = done >= 6 ? '航道总设计师' : done >= 4 ? '造桥匠' : done >= 2 ? '见习工程师' : '刚拿图纸';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '解开 <b>' + done + ' / ' + LEVELS.length + ' 盘</b><br>' +
    '本局得分 <b>' + score + '</b><br>搭桥 ' + steps + ' 次 · 误点 ' + wrong + ' 次<br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '先把数字大的岛连够,剩下的自然成形';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  tone(720, .3, 'sine', .06, 1080);
}
function syncHud() {
  $('hlv').textContent = (lv + 1) + '/' + LEVELS.length;
  $('hopen').textContent = openCount();
  $('hhint').textContent = hints;
}
function hint() {
  if (state !== 'play' || hints <= 0) return;
  var bp = LEVELS[lv].bp;
  var order = [];
  for (var i = 0; i < bp.length; i++) order.push(i);
  for (i = order.length - 1; i > 0; i--) { var j = rnd(i + 1), t = order[i]; order[i] = order[j]; order[j] = t }
  for (i = 0; i < order.length; i++) {
    var b = bp[order[i]];
    if (get(b[0], b[1]) < b[2] && !canBuild(b[0], b[1])) {
      hints--;
      build(b[0], b[1]);
      msg = '参考线画好了'; msgT = 1.4;
      syncHud();
      return;
    }
  }
  msg = '这一盘已经没缺口了'; msgT = 1.4;
}
function clearBoard() {
  cnt = {}; sel = -1; undoStack = [];
  msg = '全部拆掉重来'; msgT = 1.2;
  syncHud();
}
function islandAt(x, y) {
  for (var i = 0; i < isl.length; i++) {
    if (Math.hypot(px(i) - x, py(i) - y) < cell * .42) return i;
  }
  return -1;
}
function bridgeAt(x, y) {
  var best = null, bd = 11;
  for (var k in cnt) {
    if (!cnt[k]) continue;
    var p = k.split('-'), a = +p[0], b = +p[1];
    var n = cnt[k], offs = n === 2 ? [-.1, .1] : [0];
    for (var t = 0; t < offs.length; t++) {
      var x1 = px(a), y1 = py(a), x2 = px(b), y2 = py(b);
      if (isl[a][1] === isl[b][1]) { y1 += offs[t] * cell; y2 += offs[t] * cell }
      else { x1 += offs[t] * cell; x2 += offs[t] * cell }
      var d = ptSeg(x, y, x1, y1, x2, y2);
      if (d < bd) { bd = d; best = [a, b] }
    }
  }
  return best;
}
function ptSeg(px0, py0, x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
  if (l2 === 0) return Math.hypot(px0 - x1, py0 - y1);
  var t = clamp(((px0 - x1) * dx + (py0 - y1) * dy) / l2, 0, 1);
  return Math.hypot(px0 - (x1 + dx * t), py0 - (y1 + dy * t));
}
function tap(x, y) {
  var i = islandAt(x, y);
  if (i >= 0) {
    if (sel === i) { sel = -1; return }
    if (sel < 0) { sel = i; tone(600, .04, 'square', .03); return }
    var a = sel, b = i;
    if (build(a, b)) { undoStack.push({ add: true, a: a, b: b }); sel = -1 }
    else { sel = i }
    return;
  }
  var br = bridgeAt(x, y);
  if (br) {
    var k = key(br[0], br[1]);
    if (cnt[k]) {
      cnt[k]--;
      if (!cnt[k]) delete cnt[k];
      steps++;
      undoStack.push({ add: false, a: br[0], b: br[1] });
    }
    tone(280, .07, 'sine', .035);
    syncHud();
    return;
  }
  sel = -1;
}
function update(dt) {
  if (msgT > 0) msgT -= dt;
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#08202c'); bg.addColorStop(1, '#04121a');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  /* 海面波纹 */
  ctx.strokeStyle = 'rgba(90,180,220,.1)'; ctx.lineWidth = 1.5;
  for (var w = 0; w < 7; w++) {
    var yy = gy0 - 24 + w * cell * .78;
    ctx.beginPath();
    for (var x = 8; x < VW - 8; x += 12) ctx.lineTo(x, yy + Math.sin(x * .05 + w) * 3);
    ctx.stroke();
  }
  /* 桥 */
  for (var k in cnt) {
    if (!cnt[k]) continue;
    var p = k.split('-'), a = +p[0], b = +p[1], n = cnt[k];
    var full = deg(a) === need[a] && deg(b) === need[b];
    ctx.strokeStyle = full ? 'rgba(120,235,180,.95)' : 'rgba(235,205,140,.9)';
    ctx.lineWidth = 4;
    var offs = n === 2 ? [-.1, .1] : [0];
    for (var t = 0; t < offs.length; t++) {
      var x1 = px(a), y1 = py(a), x2 = px(b), y2 = py(b);
      if (isl[a][1] === isl[b][1]) { y1 += offs[t] * cell; y2 += offs[t] * cell }
      else { x1 += offs[t] * cell; x2 += offs[t] * cell }
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  }
  /* 岛 */
  for (var i = 0; i < isl.length; i++) {
    var x3 = px(i), y3 = py(i), d = deg(i), r = cell * .34;
    ctx.fillStyle = '#3c6e3a';
    ctx.beginPath(); ctx.arc(x3, y3, r + 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d8c084';
    ctx.beginPath(); ctx.arc(x3, y3, r, 0, Math.PI * 2); ctx.fill();
    if (i === sel) {
      ctx.strokeStyle = 'rgba(255,240,140,1)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x3, y3, r + 9, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = d === need[i] ? '#1c5c2c' : (d > need[i] ? '#8c1c1c' : '#2a1c08');
    ctx.font = '900 ' + Math.round(cell * .34) + 'px "PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(need[i], x3, y3 + 1);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = msgT > 0 ? 'rgba(255,220,120,.95)' : 'rgba(190,225,245,.5)';
  ctx.fillText(msg || '点两个岛连一条桥,再点桥身拆掉', VW / 2, VH - 44);
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  tap(e.clientX, e.clientY);
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); undo(); }
  if (e.key === 'h' || e.key === 'H') { e.preventDefault(); hint(); }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startGame(); }
});
function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', function () {
  if (state !== 'play') { startGame(); return }
  loadLevel(lv);
  msg = '本盘重来'; msgT = 1.2;
});
$('unbtn').addEventListener('click', undo);
$('clrbtn').addEventListener('click', clearBoard);
$('hintbtn').addEventListener('click', hint);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」解开了 ' + Object.keys(solvedLv).length + ' 盘数桥,只用 ' + steps + ' 次搭桥! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  state: function () { return state; },
  level: function () { return lv; },
  islands: function () { return isl.length; },
  need: function () { return need.slice(); },
  deg: deg, get: get, open: openCount, connected: connected,
  sel: function () { return sel; },
  tap: tap, undo: undo, hint: hint, clear: clearBoard,
  canBuild: canBuild, build: build,
  screen: function (i) { return { x: px(i), y: py(i) } },
  setLevel: function (n) { loadLevel(clamp(n, 0, LEVELS.length - 1)) },
  ref: function () { return LEVELS[lv].bp.slice(); },
  solved: function () { return Object.keys(solvedLv).length; },
  steps: function () { return steps; },
  step: function (n) { for (var i = 0; i < n; i++) update(1 / 60); },
  forceEnd: endGame
};
resize();
resetGame();
$('padbar').classList.add('hide');
updMini();
run();

})();
</script>
