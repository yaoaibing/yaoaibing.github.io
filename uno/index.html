<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='uno_best',PLAY='uno_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 优诺 · 疯狂出牌 ================== */
var NAME = '优诺 · 疯狂出牌';
var state = 'start';
var COLORS = ['#e8443a', '#f0b429', '#3fae63', '#3a76d8'];
var COLOR_NAMES = ['红', '黄', '绿', '蓝'];
var WILD = 4;
var HAND_MAX = 7;
var deck = [], discard = [], hand = [], ai = [];
var curColor = 0, turn = 'me', phase = 'me';
var drawnIdx = -1, drawnFromDeck = false, aiTimer = 0;
var status = '轮到你出牌', pickFrom = -1;
var score = 0, flash = 0, flashTxt = '';
var LAY = { aiY: 0, midY: 0, myY: 0, cw: 60, ch: 88, smallW: 40, smallH: 58, step: 40 };

function rr(x, y, w, h, r) {
  var k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}

function layout() {
  var cw = clamp(Math.round(VW * .155), 46, 66);
  var ch = Math.round(cw * 1.46);
  LAY.cw = cw; LAY.ch = ch;
  LAY.smallW = Math.round(cw * .66); LAY.smallH = Math.round(ch * .66);
  LAY.aiY = Math.max(96, VH * .13);
  LAY.midY = Math.round(VH * .40);
  var pad = VW < 360 ? 112 : 62;
  LAY.myY = VH - Math.max(104, ch + pad);
  LAY.step = cw * .78;
}
function onResize() { layout(); }

function makeDeck() {
  var d = [], ci, v, k;
  for (ci = 0; ci < 4; ci++) {
    d.push({ c: ci, v: 0 });
    for (v = 1; v <= 9; v++) { d.push({ c: ci, v: v }); d.push({ c: ci, v: v }); }
    ['skip', 'rev', 'd2'].forEach(function (a) { d.push({ c: ci, v: a }); d.push({ c: ci, v: a }); });
  }
  for (k = 0; k < 4; k++) { d.push({ c: WILD, v: 'wild' }); d.push({ c: WILD, v: 'w4' }); }
  return d;
}
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function recycle() {
  if (deck.length) return;
  if (discard.length <= 1) return;
  var top = discard.pop();
  deck = shuffle(discard);
  discard = [top];
}
function dealOne() {
  recycle();
  return deck.length ? deck.pop() : null;
}
function dealN(n, arr) {
  for (var i = 0; i < n; i++) {
    var c = dealOne();
    if (c) arr.push(c);
  }
}
function topCard() { return discard[discard.length - 1]; }

function valueName(v) {
  if (v === 'skip') return '禁出';
  if (v === 'rev') return '转向';
  if (v === 'd2') return '+2';
  if (v === 'wild') return '变色';
  if (v === 'w4') return '变色+4';
  return String(v);
}
function cardName(card) {
  return (card.c === WILD ? '变色牌' : COLOR_NAMES[card.c] + valueName(card.v));
}
function sameValue(a, b) {
  if (typeof a === 'number' && typeof b === 'number') return a === b;
  return a === b;
}
function canPlay(card, cc, handArr) {
  if (card.c === WILD) {
    if (card.v === 'w4') {
      for (var i = 0; i < handArr.length; i++) {
        if (handArr[i] !== card && handArr[i].c === cc) return false;
      }
    }
    return true;
  }
  if (card.c === cc) return true;
  return sameValue(card.v, topCard().v);
}
function legalList(handArr, cc) {
  var out = [];
  for (var i = 0; i < handArr.length; i++) {
    if (canPlay(handArr[i], cc, handArr)) out.push(i);
  }
  return out;
}

function startGame() {
  deck = shuffle(makeDeck());
  discard = []; hand = []; ai = [];
  dealN(7, hand); dealN(7, ai);
  var first = dealOne();
  var guard = 0;
  while (first && first.c === WILD && guard++ < 30) {
    deck.unshift(first);
    first = dealOne();
  }
  if (!first) first = { c: 0, v: 5 };
  discard.push(first);
  curColor = first.c;
  turn = 'me'; phase = 'me'; pickFrom = -1;
  drawnIdx = -1; drawnFromDeck = false;
  score = 0; flash = 0; flashTxt = '';
  status = '轮到你出牌';
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  $('drawbtn').textContent = '🃏 摸牌';
  if (aiTimer) { clearTimeout(aiTimer); aiTimer = 0; }
  syncHud();
  tone(440, .07, 'sine', .04, 620);
}
function syncHud() {
  $('hmine').textContent = hand.length;
  $('hai').textContent = ai.length;
  $('hdeck').textContent = deck.length;
  $('hcolor').textContent = COLOR_NAMES[curColor];
  $('hcolor').style.color = COLORS[curColor];
}

function flashMsg(t, good) {
  flashTxt = t; flash = 1.1; status = t;
  if (good) tone(520, .07, 'sine', .04, 700);
  else tone(220, .06, 'square', .03, 160);
}

function endTurn() {
  drawnIdx = -1; drawnFromDeck = false;
  $('drawbtn').textContent = '🃏 摸牌';
  turn = 'ai'; phase = 'ai';
  status = '电脑思考中…';
  if (aiTimer) clearTimeout(aiTimer);
  aiTimer = setTimeout(aiMove, 720);
}

function applyEffect(card) {
  var v = card.v, msg = '';
  if (v === 'skip' || v === 'rev') {
    msg = '电脑被跳过,继续出牌';
  } else if (v === 'd2') {
    dealN(2, ai);
    msg = '电脑摸 2 张,继续出牌';
    syncHud();
  } else if (v === 'w4') {
    dealN(4, ai);
    msg = '电脑摸 4 张,继续出牌';
    syncHud();
  }
  return msg;
}

function playCard(who, idx, colorPick) {
  var arr = who === 'me' ? hand : ai;
  var card = arr[idx];
  if (!card) return false;
  var cc = who === 'me' ? curColor : curColor;
  if (!canPlay(card, cc, arr)) return false;
  arr.splice(idx, 1);
  discard.push(card);
  if (card.c === WILD) {
    curColor = typeof colorPick === 'number' ? colorPick : bestColor(arr);
  } else {
    curColor = card.c;
  }
  if (who === 'me') {
    drawnIdx = -1; drawnFromDeck = false;
    $('drawbtn').textContent = '🃏 摸牌';
    var msg = applyEffect(card);
    syncHud();
    if (hand.length === 0) { finish(true); return true; }
    if (msg) {
      flashMsg(msg, true);
      phase = 'me'; turn = 'me';
      return true;
    }
    endTurn();
  } else {
    var amsg = applyEffect(card);
    syncHud();
    if (ai.length === 0) { finish(false); return true; }
    if (amsg) {
      flashMsg(amsg, false);
      phase = 'ai'; turn = 'ai';
      aiTimer = setTimeout(aiMove, 800);
      return true;
    }
    phase = 'me'; turn = 'me';
    drawnIdx = -1; drawnFromDeck = false;
    $('drawbtn').textContent = '🃏 摸牌';
    status = '轮到你出牌';
  }
  return true;
}

function humanTapCard(idx) {
  if (state !== 'play' || turn !== 'me' || pickFrom >= 0) return;
  var card = hand[idx];
  if (!card) return;
  if (!canPlay(card, curColor, hand)) {
    flashMsg('这张出不了:要同色、同数字或变色牌', false);
    return;
  }
  if (card.c === WILD) {
    pickFrom = idx;
    phase = 'pick';
    status = '选一个颜色';
    return;
  }
  playCard('me', idx);
}

function chooseColor(ci) {
  if (state !== 'play' || pickFrom < 0) return;
  var idx = pickFrom;
  pickFrom = -1;
  phase = 'me';
  playCard('me', idx, ci);
}

function drawHuman() {
  if (state !== 'play' || turn !== 'me' || pickFrom >= 0) return;
  if (drawnFromDeck) {
    drawnFromDeck = false; drawnIdx = -1;
    $('drawbtn').textContent = '🃏 摸牌';
    status = '你选择过牌';
    endTurn();
    return;
  }
  var c = dealOne();
  if (!c) { flashMsg('牌堆空了,直接过牌', false); endTurn(); return; }
  hand.push(c);
  drawnFromDeck = true;
  drawnIdx = hand.length - 1;
  syncHud();
  tone(360, .05, 'sine', .03, 300);
  if (canPlay(c, curColor, hand)) {
    status = '摸到 ' + cardName(c) + ',可以出它或点「过牌」';
    $('drawbtn').textContent = '⏭ 过牌';
  } else {
    status = '摸到 ' + cardName(c) + ',出不了,自动过牌';
    $('drawbtn').textContent = '🃏 摸牌';
    drawnFromDeck = false; drawnIdx = -1;
    endTurn();
  }
}

function bestColor(arr) {
  var cnt = [0, 0, 0, 0], i;
  for (i = 0; i < arr.length; i++) if (arr[i].c < WILD) cnt[arr[i].c]++;
  var best = 0;
  for (i = 1; i < 4; i++) if (cnt[i] > cnt[best]) best = i;
  if (cnt[best] === 0) return rnd(4);
  return best;
}

function aiChoose() {
  var legal = legalList(ai, curColor), i;
  if (!legal.length) return -1;
  var urgent = hand.length <= 2, best = -1, bestScore = -1e9;
  for (i = 0; i < legal.length; i++) {
    var card = ai[legal[i]], s = 0;
    if (card.c === WILD) s = card.v === 'w4' ? 6 : 4;
    else if (urgent && (card.v === 'skip' || card.v === 'rev' || card.v === 'd2')) s = 9;
    else if (card.v === 'd2') s = 7;
    else if (card.v === 'skip' || card.v === 'rev') s = 5;
    else if (typeof card.v === 'number') s = card.v === 0 ? 3 : 2;
    if (card.c === curColor) s += .5;
    if (s > bestScore) { bestScore = s; best = legal[i]; }
  }
  return best;
}

function aiMove() {
  aiTimer = 0;
  if (state !== 'play') return;
  if (turn !== 'ai') return;
  var idx = aiChoose();
  if (idx < 0) {
    var c = dealOne();
    if (c) {
      ai.push(c);
      syncHud();
      flashMsg('电脑摸了一张', false);
      if (canPlay(c, curColor, ai)) {
        aiTimer = setTimeout(function () {
          aiTimer = 0;
          if (state !== 'play' || turn !== 'ai') return;
          playCard('ai', ai.length - 1);
        }, 560);
        return;
      }
    } else {
      flashMsg('电脑无牌可摸,过牌', false);
    }
    turn = 'me'; phase = 'me';
    status = '轮到你出牌';
    $('drawbtn').textContent = '🃏 摸牌';
    return;
  }
  var card = ai[idx];
  playCard('ai', idx);
}

function finish(win) {
  state = 'over'; phase = 'over';
  if (aiTimer) { clearTimeout(aiTimer); aiTimer = 0; }
  score = win ? 600 + ai.length * 80 : 0;
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = (win ? '🎉 你先出完牌!' : '😤 电脑先出完了') +
    '<br>剩余:你 <b>' + hand.length + '</b> 张 · 电脑 <b>' + ai.length + '</b> 张' +
    '<br>本局得分 <b>' + score + '</b>' +
    '<br>历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '记住颜色被改过之后,同色牌永远出得掉';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  tone(win ? 760 : 210, .24, 'triangle', .05, win ? 1150 : 150);
  if (navigator.vibrate) navigator.vibrate(win ? [20, 40, 20] : 50);
}

function update(dt) {
  if (flash > 0) flash -= dt;
}

/* ---------- 绘制 ---------- */
function cardFace(x, y, w, h, card, dim) {
  var r = Math.max(5, w * .11);
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = Math.max(3, w * .1); ctx.shadowOffsetY = Math.max(1, w * .04);
  if (card.c === WILD) {
    var q = [[COLORS[0], 0, 0], [COLORS[1], 1, 0], [COLORS[2], 0, 1], [COLORS[3], 1, 1]];
    ctx.fillStyle = '#1b1b22';
    rr(x, y, w, h, r); ctx.fill();
    ctx.save();
    rr(x, y, w, h, r); ctx.clip();
    q.forEach(function (qk) {
      ctx.fillStyle = qk[0];
      ctx.fillRect(x + qk[1] * w / 2, y + qk[2] * h / 2, w / 2 + 1, h / 2 + 1);
    });
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    rr(x + w * .1, y + h * .26, w * .8, h * .48, r * .7); ctx.fill();
  } else {
    ctx.fillStyle = '#f7f3ea';
    rr(x, y, w, h, r); ctx.fill();
    ctx.fillStyle = COLORS[card.c];
    rr(x + w * .07, y + h * .06, w * .86, h * .88, r * .8); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + h / 2, w * .33, h * .37, -.5, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();

  var sym = card.v === 'skip' ? '⊘' : (card.v === 'rev' ? '⇄' : (card.v === 'd2' ? '+2' : (card.v === 'w4' ? '+4' : (card.v === 'wild' ? '★' : String(card.v)))));
  ctx.fillStyle = card.c === WILD ? '#fff' : COLORS[card.c];
  var fs = sym.length > 1 ? w * .38 : w * .52;
  ctx.font = '900 ' + Math.round(fs) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(sym, x + w / 2, y + h / 2 + 1);

  ctx.fillStyle = card.c === WILD ? '#fff' : COLORS[card.c];
  ctx.font = '800 ' + Math.round(w * .2) + 'px "PingFang SC",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(sym, x + w * .1, y + h * .05);
  ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText(sym, x + w * .9, y + h * .95);

  if (dim) {
    ctx.fillStyle = 'rgba(4,8,16,.55)';
    rr(x, y, w, h, r); ctx.fill();
  }
}

function cardBack(x, y, w, h) {
  var r = Math.max(5, w * .11);
  ctx.fillStyle = '#e8edf4';
  rr(x, y, w, h, r); ctx.fill();
  ctx.fillStyle = '#232a3a';
  rr(x + w * .07, y + h * .06, w * .86, h * .88, r * .8); ctx.fill();
  ctx.save();
  rr(x + w * .07, y + h * .06, w * .86, h * .88, r * .8); ctx.clip();
  ctx.strokeStyle = 'rgba(120,200,255,.28)'; ctx.lineWidth = 1.2;
  for (var i = -h; i < w; i += Math.max(8, w * .22)) {
    ctx.beginPath(); ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + h, y); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.font = '900 ' + Math.round(w * .3) + 'px "PingFang SC",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('U', x + w / 2, y + h / 2);
}

function handPositions(n, cw, ch, y, areaW, out) {
  out = out || [];
  if (!n) return out;
  var maxStep = cw * .78;
  var step = n > 1 ? Math.min(maxStep, (areaW - cw) / (n - 1)) : 0;
  var totalW = cw + step * (n - 1);
  var x0 = (VW - totalW) / 2;
  for (var i = 0; i < n; i++) out.push({ x: x0 + i * step, y: y, w: cw, h: ch });
  return out;
}

function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#141020');
  bg.addColorStop(1, '#07060d');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);

  ctx.fillStyle = 'rgba(255,255,255,.05)';
  ctx.fillRect(0, LAY.aiY - 10, VW, 1);
  ctx.fillRect(0, LAY.myY - 16, VW, 1);

  var i, p;
  var aiPos = handPositions(ai.length, LAY.smallW, LAY.smallH, LAY.aiY, VW - 90);
  for (i = 0; i < aiPos.length; i++) {
    p = aiPos[i];
    cardBack(p.x, p.y, p.w, p.h);
  }
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.font = '700 12px "PingFang SC",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('电脑 ' + ai.length + ' 张', VW / 2, LAY.aiY - 24);

  var midY = LAY.midY;
  var pileGap = Math.max(74, LAY.cw * 1.5);
  var dcx = VW / 2 - pileGap / 2, tcx = VW / 2 + pileGap / 2;
  var pw = LAY.cw, ph = LAY.ch;
  if (deck.length) {
    cardBack(dcx - pw / 2, midY - ph / 2, pw, ph);
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.font = '700 11px "PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('牌堆 ' + deck.length, dcx, midY + ph / 2 + 14);
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 1.5;
    rr(dcx - pw / 2, midY - ph / 2, pw, ph, 8); ctx.stroke();
  }
  if (discard.length) {
    var tp = topCard();
    cardFace(tcx - pw / 2, midY - ph / 2, pw, ph, tp, false);
    ctx.save();
    ctx.strokeStyle = COLORS[curColor]; ctx.lineWidth = 3;
    rr(tcx - pw / 2 - 4, midY - ph / 2 - 4, pw + 8, ph + 8, 12); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.font = '700 11px "PingFang SC",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('当前颜色 ' + COLOR_NAMES[curColor], tcx, midY + ph / 2 + 14);

  var legal = turn === 'me' && state === 'play' ? legalList(hand, curColor) : [];
  var pos = handPositions(hand.length, LAY.cw, LAY.ch, LAY.myY, VW - 16);
  for (i = 0; i < pos.length; i++) {
    p = pos[i];
    var playable = legal.indexOf(i) >= 0;
    var lift = playable && turn === 'me' ? 10 : 0;
    if (i === drawnIdx) lift = 16;
    cardFace(p.x, p.y - lift, p.w, p.h, hand[i], !playable && turn === 'me');
    if (playable && turn === 'me') {
      ctx.strokeStyle = 'rgba(255,212,92,.9)'; ctx.lineWidth = 2.5;
      rr(p.x - 2, p.y - lift - 2, p.w + 4, p.h + 4, 10); ctx.stroke();
    }
  }

  ctx.fillStyle = flash > 0 && flashTxt ? '#ffd45c' : 'rgba(255,255,255,.66)';
  ctx.font = '700 13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(flash > 0 && flashTxt ? flashTxt : status, VW / 2, LAY.midY + LAY.ch / 2 + 40);

  if (phase === 'pick' && state === 'play') drawPicker();
}

function drawPicker() {
  ctx.fillStyle = 'rgba(4,6,14,.82)';
  ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = '#fff';
  ctx.font = '900 22px "PingFang SC",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('选一个颜色', VW / 2, VH / 2 - 92);
  var size = Math.min(74, VW * .17), gap = size + 22;
  var totalW = size * 4 + 22 * 3;
  var x0 = (VW - totalW) / 2, y0 = VH / 2 - size / 2;
  for (var i = 0; i < 4; i++) {
    var x = x0 + i * gap;
    ctx.fillStyle = COLORS[i];
    rr(x, y0, size, size, size * .26); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.94)';
    ctx.font = '800 13px "PingFang SC",sans-serif';
    ctx.fillText(COLOR_NAMES[i], x + size / 2, y0 + size + 20);
  }
}
function pickerRects() {
  var size = Math.min(74, VW * .17), gap = size + 22;
  var totalW = size * 4 + 22 * 3;
  var x0 = (VW - totalW) / 2, y0 = VH / 2 - size / 2;
  var out = [];
  for (var i = 0; i < 4; i++) out.push({ x: x0 + i * gap, y: y0, w: size, h: size });
  return out;
}

/* ---------- 输入 ---------- */
function tapAt(x, y) {
  if (state !== 'play') return;
  if (phase === 'pick') {
    var rects = pickerRects();
    for (var i = 0; i < rects.length; i++) {
      var r = rects[i];
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) { chooseColor(i); return; }
    }
    return;
  }
  if (turn !== 'me') return;
  var pos = handPositions(hand.length, LAY.cw, LAY.ch, LAY.myY, VW - 16);
  for (var j = pos.length - 1; j >= 0; j--) {
    var p = pos[j];
    if (x >= p.x && x <= p.x + p.w && y >= p.y - 18 && y <= p.y + p.h) { humanTapCard(j); return; }
  }
  var pileGap = Math.max(74, LAY.cw * 1.5);
  var dcx = VW / 2 - pileGap / 2;
  if (x >= dcx - LAY.cw / 2 && x <= dcx + LAY.cw / 2 && y >= LAY.midY - LAY.ch / 2 && y <= LAY.midY + LAY.ch / 2) {
    drawHuman();
  }
}

cv.addEventListener('pointerdown', function (e) { e.preventDefault(); tapAt(e.clientX, e.clientY); }, { passive: false });
window.addEventListener('keydown', function (e) {
  if (state !== 'play') return;
  if (e.key >= '1' && e.key <= '4') {
    if (phase === 'pick') { chooseColor(+e.key - 1); return; }
    humanTapCard(+e.key - 1);
  } else if (e.key === 'd' || e.key === 'D' || e.key === ' ') {
    e.preventDefault(); drawHuman();
  } else if (e.key === 'r' || e.key === 'R') {
    startGame();
  }
});

function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
  $('mini2').innerHTML = '优诺规则:出同色或同数字的牌,先出完手牌者胜';
}

$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', startGame);
$('drawbtn').addEventListener('click', drawHuman);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」' + (state === 'over' && score > 0 ? '赢了一局拿 ' + score + ' 分' : '正在疯狂出牌') + '! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/'; });

window.__T = {
  hand: function () { return hand.slice(); },
  aiHand: function () { return ai.slice(); },
  top: topCard,
  color: function () { return curColor; },
  deck: function () { return deck.length; },
  playable: function (i) { return canPlay(hand[i], curColor, hand); },
  play: function (i, ci) { return playCard('me', i, ci); },
  draw: drawHuman,
  chooseColor: chooseColor,
  aiStep: aiMove,
  aiPick: aiChoose,
  makeDeck: makeDeck,
  setup: function (mine, opp, top, color) {
    state = 'play'; turn = 'me'; phase = 'me'; pickFrom = -1;
    hand = mine.slice(); ai = opp.slice(); discard = [top]; curColor = color;
    deck = shuffle(makeDeck());
    syncHud();
  },
  turn: function () { return turn; },
  score: function () { return score; },
  state: function () { return state; }
};

startGame();
state = 'start';
$('start').classList.remove('hide');
$('over').classList.add('hide');
$('padbar').classList.add('hide');
resize();
syncHud();
updMini();
run();

})();
</script>

try{

  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());

        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='uno'});
  r.unshift({k:'uno',n:'优诺 · 疯狂出牌',e:'🃏'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['uno_best','uno_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['uno']||0)){
            B['uno']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
