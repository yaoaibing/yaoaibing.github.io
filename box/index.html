.bigbtn{border:0;border-radius:999px;padding:15px 50px;font-size:19px;font-weight:900;letter-spacing:4px;color:#3a2208;cursor:pointer;
  background:linear-gradient(180deg,#ffd79a,#e9a24a);box-shadow:0 5px 0 #8a5316,0 10px 30px rgba(233,162,74,.35)}

<script>
(function(){
'use strict';

/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='box_best',PLAY='box_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* ================== GAME · 仓库番推箱子 ================== */
/* 地图:# 墙 / 空格 地板 / . 目标 / $ 箱子 / * 箱子在目标 / @ 玩家 / + 玩家在目标 */
var LEVELS=[
["########",
 "#      #",
 "#  .$@ #",
 "#      #",
 "########"],
["########",
 "#  ..  #",
 "#  $$  #",
 "#   @  #",
 "########"],
["########",
 "#  #   #",
 "# .$   #",
 "#  $ . #",
 "# @#   #",
 "########"],
["#########",
 "#  #    #",
 "# .$ $ .#",
 "#  #  @ #",
 "#  #    #",
 "#########"],
["#########",
 "#       #",
 "#  ###  #",
 "# $. $. #",
 "#  @    #",
 "#       #",
 "#########"],
["##########",
 "#  ....  #",
 "#  $$$$  #",
 "#   @    #",
 "#        #",
 "##########"],
["#########",
 "#   ... #",
 "#  $$$  #",
 "#  @    #",
 "#       #",
 "#########"],
["#########",
 "#   .   #",
 "# $$$   #",
 "#  @ .  #",
 "#   .   #",
 "#       #",
 "#########"],
["#########",
 "#       #",
 "#  $ .  #",
 "# ### ###",
 "#  $ .  #",
 "#   @   #",
 "#  $ .  #",
 "#########"],
["######",
 "#    #",
 "# #@ #",
 "# $* #",
 "# .* #",
 "# .$ #",
 "#  ###",
 "######"],
["########",
 "#  ..  #",
 "# $$$$ #",
 "#  @   #",
 "#  ..  #",
 "########"],
["######",
 "# .###",
 "#  ###",
 "#*@  #",
 "#  $ #",
 "#  ###",
 "######"]
];
var OPT=[1,4,5,7,9,11,14,19,19,20,22,33]; // 每关最优步数(BFS 实测)

var G={
  state:'start',lvl:0,unlocked:0,
  cols:0,rows:0,cell:36,ox:0,oy:0,
  wall:[],goal:[],boxes:[],px:0,py:0,pax:0,pay:0,
  hist:[],steps:0,total:0,
  winT:0,shake:0,parts:[],toast:'',toastT:0,uiTop:0
};
var HITS=[];

/* --- 关卡装载 --- */
function loadLevel(n){
  var m=LEVELS[n],w=0,i;
  for(i=0;i<m.length;i++)w=Math.max(w,m[i].length);
  G.lvl=n;G.cols=w;G.rows=m.length;
  G.wall=[];G.goal=[];G.boxes=[];G.hist=[];G.steps=0;G.winT=0;G.parts=[];
  for(var y=0;y<m.length;y++){
    var wr=[],gr=[],row=m[y];
    for(var x=0;x<w;x++){
      var ch=x<row.length?row[x]:'#';
      wr.push(ch==='#');gr.push(ch==='.'||ch==='*'||ch==='+');
      if(ch==='$'||ch==='*')G.boxes.push({x:x,y:y,ax:x,ay:y});
      if(ch==='@'||ch==='+'){G.px=x;G.py=y}
    }
    G.wall.push(wr);G.goal.push(gr);
  }
  G.pax=G.px;G.pay=G.py;
  layout();
  $('hlevel').textContent=(n+1)+'/'+LEVELS.length;
  $('hstep').textContent='0';
  $('hbest').textContent=OPT[n];
}
function isWall(x,y){return x<0||y<0||x>=G.cols||y>=G.rows||G.wall[y][x]}
function boxAt(x,y){
  for(var i=0;i<G.boxes.length;i++)if(G.boxes[i].x===x&&G.boxes[i].y===y)return G.boxes[i];
  return null;
}
/* 死角判定:箱子不在目标上,且横向、纵向各有一面是墙 */
function isDead(b){
  if(G.goal[b.y][b.x])return false;
  var h=(isWall(b.x-1,b.y)||isWall(b.x+1,b.y));
  var v=(isWall(b.x,b.y-1)||isWall(b.x,b.y+1));
  return h&&v;
}

/* --- 走一步 --- */
function move(dx,dy){
  if(G.state!=='play')return;
  var nx=G.px+dx,ny=G.py+dy;
  if(isWall(nx,ny)){tone(150,.05,'square',.03);return}
  var b=boxAt(nx,ny);
  if(b){
    var bx=nx+dx,by=ny+dy;
    if(isWall(bx,by)||boxAt(bx,by)){tone(150,.05,'square',.03);G.shake=.12;return}
    G.hist.push({px:G.px,py:G.py,b:G.boxes.map(function(o){return{x:o.x,y:o.y}})});
    b.x=bx;b.y=by;
    tone(200,.09,'square',.05,120);noise(.05,.03);
    addParts(bx,by,'#ffcf7a',6);
  }else{
    G.hist.push({px:G.px,py:G.py,b:G.boxes.map(function(o){return{x:o.x,y:o.y}})});
    tone(320,.035,'square',.028);
  }
  G.px=nx;G.py=ny;G.steps++;G.total++;
  $('hstep').textContent=G.steps;
  if(winNow())levelClear();
}
function winNow(){
  for(var i=0;i<G.boxes.length;i++){var b=G.boxes[i];if(!G.goal[b.y][b.x])return false}
  return true;
}
function undo(){
  if(G.state!=='play'||!G.hist.length){toast('没有可撤销的步数');return}
  var h=G.hist.pop();
  G.px=h.px;G.py=h.py;
  for(var i=0;i<G.boxes.length;i++){G.boxes[i].x=h.b[i].x;G.boxes[i].y=h.b[i].y}
  G.steps=Math.max(0,G.steps-1);$('hstep').textContent=G.steps;
  tone(260,.07,'triangle',.04,180);
}
function levelClear(){
  G.state='win';G.winT=0;G.shake=.25;
  if(G.lvl+1>G.unlocked){G.unlocked=G.lvl+1;lsSet('box_lvl',G.unlocked)}
  tone(523,.1,'sine',.06);setTimeout(function(){tone(659,.1,'sine',.06)},95);
  setTimeout(function(){tone(784,.16,'sine',.06)},190);
}
function nextLevel(){
  if(G.lvl+1>=LEVELS.length){allClear();return}
  loadLevel(G.lvl+1);G.state='play';
}
function allClear(){
  G.state='over';stop();
  var isNew=KIT.setBest(LEVELS.length);
  $('onewrec').style.display=isNew?'block':'none';
  $('ostats').innerHTML=
    '通关关卡 <b>'+LEVELS.length+'/'+LEVELS.length+'</b><br>'+
    '本局总步数 <b>'+G.total+'</b><br>'+
    '最优总步数 <b>'+OPT.reduce(function(a,b){return a+b},0)+'</b><br>'+
    '已解锁 <b>第 '+G.unlocked+' 关</b>';
  $('mini2').innerHTML='已玩 <b>'+KIT.plays()+'</b> 局 · 连续打卡 <b>'+KIT.streakNow()+'</b> 天 🔥';
  $('over').classList.remove('hide');
  tone(440,.14,'sine',.06);setTimeout(function(){tone(350,.14,'sine',.06)},140);
  setTimeout(function(){tone(262,.34,'sine',.06)},280);
}
function toast(t){G.toast=t;G.toastT=1.4}
function addParts(gx,gy,col,n){
  if(G.parts.length>150)return;
  var cx=G.ox+(gx+.5)*G.cell,cy=G.oy+(gy+.5)*G.cell;
  for(var i=0;i<n;i++)G.parts.push({x:cx,y:cy,vx:(frnd()-.5)*150,vy:(frnd()-.5)*150-40,
    life:.4+frnd()*.35,col:col,s:2+frnd()*2.5});
}

/* --- 布局:棋盘自适应居中 + 底部操控区 --- */
function layout(){
  var bottom=G.uiTop||(VH-160);
  var top=Math.max(66,Math.round(VH*0.10));
  var avail=Math.max(120,bottom-top-14);
  var pad=Math.max(10,Math.round(VW*0.03));
  G.cell=Math.min((VW-pad*2)/G.cols,avail/G.rows,64);
  G.cell=Math.max(18,Math.floor(G.cell));
  G.ox=Math.round((VW-G.cols*G.cell)/2);
  G.oy=Math.round(top+(avail-G.rows*G.cell)/2);
}
function layoutUI(){
  HITS=[];
  var s=Math.max(38,Math.min(48,Math.round(VW*0.125))),gap=4;
  var bot=VH-14,y0=bot-(3*s+2*gap);
  G.uiTop=y0-12;
  HITS.push({x:14+s+gap,y:y0,w:s,h:s,act:'up',k:'↑'});
  HITS.push({x:14,y:y0+s+gap,w:s,h:s,act:'left',k:'←'});
  HITS.push({x:14+2*(s+gap),y:y0+s+gap,w:s,h:s,act:'right',k:'→'});
  HITS.push({x:14+s+gap,y:y0+2*(s+gap),w:s,h:s,act:'down',k:'↓'});
  var cw=Math.min(92,Math.round(VW*0.25)),ch=40,cg=8;
  var rx=VW-14-cw,ry=bot-3*ch-2*cg;
  HITS.push({x:rx,y:ry,w:cw,h:ch,act:'undo',k:'↩ 撤销',txt:1});
  HITS.push({x:rx,y:ry+ch+cg,w:cw,h:ch,act:'reset',k:'⟲ 重置',txt:1});
  HITS.push({x:rx,y:ry+2*(ch+cg),w:cw,h:ch,act:'skip',k:'⏭ 跳关',txt:1});
}
function onResize(){layoutUI();layout()}

/* --- 输入 --- */
function hitAt(x,y){
  for(var i=0;i<HITS.length;i++){
    var h=HITS[i];
    if(x>=h.x-2&&x<=h.x+h.w+2&&y>=h.y-2&&y<=h.y+h.h+2)return h;
  }
  return null;
}
function press(h){
  if(h.act==='up')move(0,-1);
  else if(h.act==='down')move(0,1);
  else if(h.act==='left')move(-1,0);
  else if(h.act==='right')move(1,0);
  else if(h.act==='undo')undo();
  else if(h.act==='reset'){loadLevel(G.lvl);G.state='play';tone(300,.08,'triangle',.04)}
  else if(h.act==='skip'){
    if(G.lvl+1<G.unlocked){loadLevel(G.lvl+1);G.state='play';tone(520,.09,'triangle',.05)}
    else toast('后面的关卡还没解锁哦');
  }
}
var sx=0,sy=0,swiping=false;
cv.addEventListener('pointerdown',function(e){
  if(G.state!=='play')return;
  var h=hitAt(e.clientX,e.clientY);
  if(h){press(h);swiping=false;return}
  swiping=true;sx=e.clientX;sy=e.clientY;
},{passive:true});
cv.addEventListener('pointerup',function(e){
  if(!swiping||G.state!=='play'){swiping=false;return}
  swiping=false;
  var dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1);
},{passive:true});
cv.addEventListener('pointercancel',function(){swiping=false},{passive:true});
window.addEventListener('keydown',function(e){
  if(G.state!=='play'){if(e.key===' '||e.key==='Enter')startGame();return}
  var k=e.key;
  if(k==='ArrowUp')move(0,-1);
  else if(k==='ArrowDown')move(0,1);
  else if(k==='ArrowLeft')move(-1,0);
  else if(k==='ArrowRight')move(1,0);
  else if(k==='z'||k==='Z')undo();
  else if(k==='r'||k==='R'){loadLevel(G.lvl);G.state='play'}
  else return;
  e.preventDefault();
});

/* --- 更新 --- */
function update(dt){
  var k=Math.min(1,dt*15);
  G.pax+=(G.px-G.pax)*k;G.pay+=(G.py-G.pay)*k;
  for(var i=0;i<G.boxes.length;i++){
    var b=G.boxes[i];b.ax+=(b.x-b.ax)*k;b.ay+=(b.y-b.ay)*k;
  }
  for(var q=G.parts.length-1;q>=0;q--){
    var p=G.parts[q];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;
    if(p.life<=0)G.parts.splice(q,1);
  }
  if(G.shake>0)G.shake-=dt;
  if(G.toastT>0)G.toastT-=dt;
  if(G.state==='win'){
    G.winT+=dt;
    if(G.winT>0.95)nextLevel();
  }
}

/* --- 绘制小工具 --- */
function rrect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

/* --- 绘制 --- */
function draw(){
  ctx.save();
  if(G.shake>0)ctx.translate((frnd()-.5)*7*G.shake*3,(frnd()-.5)*7*G.shake*3);
  var g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#3a2c1c');g.addColorStop(.55,'#2a2016');g.addColorStop(1,'#150f09');
  ctx.fillStyle=g;ctx.fillRect(-12,-12,VW+24,VH+24);

  var c=G.cell,ox=G.ox,oy=G.oy;

  // 地板底衬
  ctx.fillStyle='rgba(0,0,0,.25)';
  rrect(ox-6,oy-6,G.cols*c+12,G.rows*c+12,10);ctx.fill();

  // 地板 / 目标点 / 墙
  for(var y=0;y<G.rows;y++)for(var x=0;x<G.cols;x++){
    var px0=ox+x*c,py0=oy+y*c;
    if(G.wall[y][x]){
      if(G.wall[y-1]&&!G.wall[y-1][x]||y===0){
        ctx.fillStyle='#57402a';ctx.fillRect(px0,py0,c,c);
      }else{
        ctx.fillStyle='#4a3623';ctx.fillRect(px0,py0,c,c);
      }
      ctx.fillStyle='rgba(255,255,255,.09)';ctx.fillRect(px0,py0,c,Math.max(2,c*.12));
      ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(px0,py0+c-Math.max(2,c*.12),c,Math.max(2,c*.12));
    }else{
      ctx.fillStyle=((x+y)&1)?'#8d6f4b':'#826645';
      ctx.fillRect(px0,py0,c,c);
      ctx.fillStyle='rgba(0,0,0,.1)';ctx.fillRect(px0,py0+c-2,c,2);
      if(G.goal[y][x]){
        ctx.fillStyle='rgba(255,196,90,.22)';
        ctx.beginPath();ctx.arc(px0+c/2,py0+c/2,c*.3,0,6.2832);ctx.fill();
        ctx.strokeStyle='#ffc45a';ctx.lineWidth=Math.max(1.5,c*.07);
        ctx.beginPath();ctx.arc(px0+c/2,py0+c/2,c*.21,0,6.2832);ctx.stroke();
      }
    }
  }

  // 箱子
  for(var i=0;i<G.boxes.length;i++){
    var b=G.boxes[i],bx=ox+b.ax*c,by=oy+b.ay*c;
    var on=G.goal[b.y][b.x],dead=isDead(b);
    var pulse=G.state==='win'?1+Math.sin(G.winT*14)*.05:1;
    var m=c*.09,sz=c-m*2;
    ctx.save();ctx.translate(bx+c/2,by+c/2);ctx.scale(pulse,pulse);ctx.translate(-c/2,-c/2);
    ctx.fillStyle=dead?'#a8483c':(on?'#7fae4a':'#c8873f');
    rrect(m,m,sz,sz,c*.16);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.22)';rrect(m,m,sz,sz*.28,c*.14);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.2)';rrect(m,m+sz*.72,sz,sz*.28,c*.14);ctx.fill();
    ctx.strokeStyle=dead?'rgba(255,120,100,.9)':'rgba(0,0,0,.3)';
    ctx.lineWidth=Math.max(1.4,c*.055);
    rrect(m,m,sz,sz,c*.16);ctx.stroke();
    ctx.beginPath();ctx.moveTo(m,m);ctx.lineTo(m+sz,m+sz);
    ctx.moveTo(m+sz,m);ctx.lineTo(m,m+sz);ctx.stroke();
    ctx.restore();
  }

  // 玩家
  var pxx=ox+G.pax*c,pyy=oy+G.pay*c;
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath();ctx.ellipse(pxx+c/2,pyy+c*.9,c*.32,c*.12,0,0,6.2832);ctx.fill();
  ctx.fillStyle='#4f7fd0';rrect(pxx+c*.2,pyy+c*.42,c*.6,c*.5,c*.14);ctx.fill();
  ctx.fillStyle='#ffd9a8';ctx.beginPath();ctx.arc(pxx+c/2,pyy+c*.36,c*.24,0,6.2832);ctx.fill();
  ctx.fillStyle='#e8552f';ctx.beginPath();
  ctx.arc(pxx+c/2,pyy+c*.2,c*.25,Math.PI,0);ctx.fill();
  ctx.fillStyle='#2a2016';
  ctx.fillRect(pxx+c*.38,pyy+c*.36,c*.07,c*.07);
  ctx.fillRect(pxx+c*.56,pyy+c*.36,c*.07,c*.07);

  // 粒子
  for(var q=0;q<G.parts.length;q++){
    var pt=G.parts[q];ctx.globalAlpha=clamp(pt.life*2,0,1);
    ctx.fillStyle=pt.col;ctx.fillRect(pt.x,pt.y,pt.s,pt.s);
  }
  ctx.globalAlpha=1;

  // 底部操控区
  for(var h=0;h<HITS.length;h++){
    var t=HITS[h];
    var dis=(t.act==='skip'&&G.lvl+1>=G.unlocked);
    ctx.fillStyle=dis?'rgba(255,255,255,.05)':'rgba(255,255,255,.13)';
    rrect(t.x,t.y,t.w,t.h,t.txt?12:14);ctx.fill();
    ctx.strokeStyle='rgba(255,225,180,.2)';ctx.lineWidth=1;
    rrect(t.x,t.y,t.w,t.h,t.txt?12:14);ctx.stroke();
    ctx.fillStyle=dis?'rgba(255,255,255,.3)':'#ffe6bd';
    ctx.font='900 '+(t.txt?15:22)+'px system-ui';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(t.k,t.x+t.w/2,t.y+t.h/2+1);
  }

  // 提示
  if(G.toastT>0){
    ctx.globalAlpha=clamp(G.toastT,0,1);
    ctx.font='900 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#ffd45c';ctx.fillText(G.toast,VW/2,G.uiTop-16);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

/* --- 启动 --- */
function startGame(from){
  G.unlocked=clamp(+lsGet('box_lvl',0),0,LEVELS.length);
  G.total=0;
  loadLevel(from?0:clamp(G.unlocked,0,LEVELS.length-1));
  G.state='play';
  $('start').classList.add('hide');$('over').classList.add('hide');
  KIT.addPlay();KIT.streak();
  run();
}
function upMini(){
  G.unlocked=clamp(+lsGet('box_lvl',0),0,LEVELS.length);
  $('mini').innerHTML='已解锁 <b>第 '+Math.min(G.unlocked+1,LEVELS.length)+'/'+LEVELS.length+' 关</b> · 已玩 <b>'+KIT.plays()+'</b> 局'+
    (KIT.streakNow()>1?' · 连续打卡 <b>'+KIT.streakNow()+'</b> 天 🔥':'');
}
$('startbtn').addEventListener('click',function(){startGame(0)});
$('newbtn').addEventListener('click',function(){startGame(1)});
$('againbtn').addEventListener('click',function(){startGame(0)});
$('hubbtn').addEventListener('click',function(){location.href='/'});
$('sharebtn').addEventListener('click',function(){
  share('我把「仓库番 · 推箱子」12 关全通了!总共用了 '+G.total+' 步(最优 '+OPT.reduce(function(a,b){return a+b},0)+' 步)。你能更少吗? https://yaoaibing.github.io/box/');
});
upMini();
resize();
onResize();
loadLevel(clamp(+lsGet('box_lvl',0),0,LEVELS.length-1));
draw();
})();
</script>



















<!-- __hub_enhance__ -->
<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}
  var SAFE='calc(10px + env(safe-area-inset-top,0px))';
  var name=(document.title||'游戏').split(/[ ··|]/)[0];

  // 回大厅
  var hb=document.createElement('button');
  hb.setAttribute('type','button');hb.textContent='\uD83C\uDFE0';
  hb.style.cssText='position:fixed;top:'+SAFE+';left:10px;z-index:99;border:0;width:36px;height:36px;'+
    'border-radius:12px;font-size:15px;background:rgba(255,255,255,.14);color:#fff;'+
    'border:1px solid rgba(255,255,255,.2);;cursor:pointer';
  hb.onclick=function(){location.href='/'};
  document.body.appendChild(hb);

  // 结算页:晒战绩 + 换个游戏
  var over=document.getElementById('over');
  if(over){
    var box=document.createElement('div');
    box.style.cssText='display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px';
    var mk=function(txt,bg,fg,fn){
      var b=document.createElement('button');
      b.setAttribute('type','button');b.textContent=txt;
      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>


<!-- __hub_recent__ -->
<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='box'});
  r.unshift({k:'box',n:'推箱子',e:'📦'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:定期把本游戏自己的最高分同步进共享的 __best
     (不用劫持 localStorage.setItem —— 那在部分环境下属性不可写会静默失败) */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['box_best','box_hi','box_max','box_score'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['box']||0)){
            B['box']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
