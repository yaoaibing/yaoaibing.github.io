<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='untangle_best',PLAY='untangle_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 解绳结 · 拉直不交叉 ================== */
var NAME = '解绳结 · 拉直不交叉';
var state = 'start';
var lv = 1, LV0 = 8, nodes = [], edges = [], cross = [], solPts = [], moves = 0;
var timer = 70, score = 0, doneLv = 0, shake = 0, msg = '', msgT = 0;
var dragI = -1, dragOX = 0, dragOY = 0, hintE = -1, hintT = 0, BX = 0, BY = 0, BS = 0;

function layout() {
  var top = Math.max(100, VH * .15);
  var bottom = VH - (VW < 420 ? 108 : 70) - 66;
  BS = Math.floor(Math.min(VW - 34, bottom - top, 440));
  BX = Math.round((VW - BS) / 2);
  BY = Math.round(top + Math.max(0, (bottom - top - BS) * .42));
}
function onResize() { layout(); }

/* ---- 平面图源生成:先在矩形里放四个角点,再随机把某个三角面一分为三,
      新点落在面内部 -> 生成的图一定可平面绘制,解开一定存在解 ---- */
function genGraph(n) {
  var pts = [
    { u: .06, v: .06 }, { u: .94, v: .06 }, { u: .06, v: .94 }, { u: .94, v: .94 }
  ];
  var tris = [[0, 1, 2], [1, 3, 2]];
  var guard = 0;
  while (pts.length < n && guard++ < 4000) {
    var ti = (Math.random() * tris.length) | 0;
    var t = tris.splice(ti, 1)[0];
    var a = pts[t[0]], b = pts[t[1]], c = pts[t[2]];
    var r1 = Math.random(), r2 = Math.random();
    if (r1 + r2 > 1) { r1 = 1 - r1; r2 = 1 - r2 }
    /* 别贴边,留出拖动空间 */
    var w0 = .18 + r1 * .64, w1 = .18 + r2 * .64, w2 = Math.max(.02, 1 - w0 - w1);
    var sum = w0 + w1 + w2;
    var p = {
      u: (a.u * w0 + b.u * w1 + c.u * w2) / sum,
      v: (a.v * w0 + b.v * w1 + c.v * w2) / sum
    };
    var id = pts.length;
    pts.push(p);
    tris.push([id, t[0], t[1]], [id, t[1], t[2]], [id, t[2], t[0]]);
  }
  var seen = {}, es = [];
  for (var i = 0; i < tris.length; i++) {
    var tt = tris[i];
    for (var j = 0; j < 3; j++) {
      var x = tt[j], y = tt[(j + 1) % 3];
      var key = Math.min(x, y) + '-' + Math.max(x, y);
      if (x === y || seen[key]) continue;
      seen[key] = 1;
      es.push([x, y]);
    }
  }
  /* 剪掉一些边,绳结才不糊成一团,但要保持连通 */
  var shuffled = es.slice();
  for (i = shuffled.length - 1; i > 0; i--) {
    var k = (Math.random() * (i + 1)) | 0;
    var tmp = shuffled[i]; shuffled[i] = shuffled[k]; shuffled[k] = tmp;
  }
  var target = Math.max(n, Math.round(n * 1.7));
  var keep = shuffled.slice(0, target);
  var root = [];
  for (i = 0; i < n; i++) root.push(i);
  function find(x) { while (root[x] !== x) { root[x] = root[root[x]]; x = root[x] } return x }
  for (i = 0; i < keep.length; i++) {
    var ra = find(keep[i][0]), rb = find(keep[i][1]);
    if (ra !== rb) root[ra] = rb;
  }
  for (i = 0; i < shuffled.length && keep.length < 2 * n; i++) {
    var e = shuffled[i];
    if (keep.indexOf(e) >= 0) continue;
    if (find(e[0]) === find(e[1])) continue;
    root[find(e[0])] = find(e[1]);
    keep.push(e);
  }
  /* 孤立点补边:只能补原三角剖分里已有的边,否则可能补出画不出的图 */
  for (i = 0; i < n; i++) {
    var linked = false;
    for (j = 0; j < keep.length; j++) if (keep[j][0] === i || keep[j][1] === i) { linked = true; break }
    if (linked) continue;
    for (j = 0; j < es.length; j++) {
      if (es[j][0] === i || es[j][1] === i) { keep.push(es[j]); break }
    }
  }
  return { pts: pts, edges: keep };
}

function orient(ax, ay, bx, by, cx, cy) {
  return (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
}
/* 严格相交(共端点的边已在调用处排除) */
function segX(a, b, c, d) {
  var o1 = orient(a.x, a.y, b.x, b.y, c.x, c.y);
  var o2 = orient(a.x, a.y, b.x, b.y, d.x, d.y);
  var o3 = orient(c.x, c.y, d.x, d.y, a.x, a.y);
  var o4 = orient(c.x, c.y, d.x, d.y, b.x, b.y);
  return ((o1 > 0) !== (o2 > 0)) && ((o3 > 0) !== (o4 > 0));
}
function xPoint(a, b, c, d) {
  var s1 = (b.y - a.y) * (c.x - a.x) - (b.x - a.x) * (c.y - a.y);
  var s2 = (b.x - a.x) * (d.y - a.y) - (b.y - a.y) * (d.x - a.x);
  if (Math.abs(s2) < 1e-9) return null;
  var r = s1 / s2;
  return { x: c.x + r * (d.x - c.x), y: c.y + r * (d.y - c.y) };
}
function crossings() {
  var out = [];
  for (var i = 0; i < edges.length; i++) {
    for (var j = i + 1; j < edges.length; j++) {
      var e1 = edges[i], e2 = edges[j];
      if (e1[0] === e2[0] || e1[1] === e2[0] || e1[0] === e2[1] || e1[1] === e2[1]) continue;
      var a = nodes[e1[0]], b = nodes[e1[1]], c = nodes[e2[0]], d = nodes[e2[1]];
      if (segX(a, b, c, d)) {
        var p = xPoint(a, b, c, d);
        out.push({ i: i, j: j, x: p ? p.x : (a.x + b.x) / 2, y: p ? p.y : (a.y + b.y) / 2 });
      }
    }
  }
  return out;
}

function buildLevel(n) {
  lv = clamp(n, 1, LV0);
  layout();
  var g = genGraph(4 + lv);
  edges = g.edges;
  solPts = g.pts;
  var i, guard = 0;
  do {
    nodes = [];
    /* 打乱:先给每个点一个随机位置,保证开局一定有交叉 */
    for (i = 0; i < g.pts.length; i++) {
      nodes.push({ x: BX + (0.1 + Math.random() * 0.8) * BS, y: BY + (0.1 + Math.random() * 0.8) * BS, r: 13 });
    }
    cross = crossings();
    guard++;
  } while (cross.length === 0 && guard < 40);
  moves = 0; hintE = -1; hintT = 0;
  timer = 60 + lv * 6;
  msg = ''; msgT = 0;
  syncHud();
}
function resetGame() {
  score = 0; doneLv = 0; shake = 0;
  buildLevel(1);
}
function startGame() {
  resetGame();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}
function nextLevel() {
  doneLv++;
  var add = Math.max(40, Math.round(120 + lv * 24 + timer - moves * 3));
  score += add;
  if (doneLv >= LV0) { finish(true); return }
  msg = '第 ' + (lv + 1) + ' 关 +' + add + ' 分';
  msgT = 1.6;
  buildLevel(lv + 1);
}
function finish(allClear) {
  state = 'over';
  KIT.addPlay();
  KIT.streak();
  var rec = KIT.setBest(score);
  var rank = score >= 1500 ? '绳结大师' : score >= 950 ? '解线好手' : score >= 450 ? '有耐心的水手' : '越拽越乱';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = (allClear ? '八个绳结全解开!' : '时间到') + '<br>' +
    '解开 <b>' + doneLv + ' / ' + LV0 + ' 结</b><br>' +
    '本局得分 <b>' + score + '</b><br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '先把最外圈的三角钉住,再把中间的桩往空白处拖,交叉会一片片消';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  noise(.25, .07);
  tone(allClear ? 760 : 140, .3, 'sine', .06, allClear ? 1180 : 80);
}
function endGame() { finish(false) }
function syncHud() {
  $('hstep').textContent = lv + '/' + LV0;
  $('hx').textContent = cross.length;
  $('hmove').textContent = moves;
}
function shakeIt() {
  if (state !== 'play') return;
  buildLevel(lv);
  msg = '重新打了个结'; msgT = 1;
}
function hint() {
  if (state !== 'play' || !cross.length) return;
  hintE = cross[(Math.random() * cross.length) | 0].i;
  hintT = 1.6;
  moves += 2;
  msg = '看这条亮线 -6 分'; msgT = 1.2;
  syncHud();
}

function update(dt) {
  var i;
  if (msgT > 0) msgT -= dt;
  if (shake > 0) shake -= dt;
  if (hintT > 0) { hintT -= dt; if (hintT <= 0) hintE = -1 }
  if (state !== 'play') return;
  timer -= dt;
  if (timer <= 0) { timer = 0; finish(false); return }
  syncHud();
}

function rr(x, y, w, h, rad) {
  var k = Math.min(rad, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#1a1408');
  bg.addColorStop(1, '#0d0a05');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, VW, VH);
  var sh = shake > 0 ? (Math.random() - .5) * 7 : 0;
  ctx.save();
  ctx.translate(sh, sh * .4);

  ctx.fillStyle = 'rgba(255,255,255,.04)';
  rr(BX - 12, BY - 12, BS + 24, BS + 24, 20); ctx.fill();
  ctx.strokeStyle = 'rgba(210,170,90,.28)';
  ctx.lineWidth = 2;
  rr(BX - 12, BY - 12, BS + 24, BS + 24, 20); ctx.stroke();

  /* 绳 */
  var i;
  for (i = 0; i < edges.length; i++) {
    var e = edges[i], a = nodes[e[0]], b = nodes[e[1]];
    var bad = false;
    for (var j = 0; j < cross.length; j++) if (cross[j].i === i || cross[j].j === i) bad = true;
    ctx.strokeStyle = i === hintE ? 'rgba(150,230,255,.95)' : (bad ? 'rgba(220,120,90,.8)' : 'rgba(232,206,158,.62)');
    ctx.lineWidth = i === hintE ? 5 : 3.4;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    /* 轻微下垂,像真的绳子 */
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 + Math.min(16, Math.hypot(b.x - a.x, b.y - a.y) * .06);
    ctx.quadraticCurveTo(mx, my, b.x, b.y);
    ctx.stroke();
  }
  /* 交叉点 */
  for (i = 0; i < cross.length; i++) {
    var c = cross[i];
    ctx.fillStyle = 'rgba(255,90,80,.85)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, 5.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,180,160,.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(c.x - 4, c.y - 4); ctx.lineTo(c.x + 4, c.y + 4);
    ctx.moveTo(c.x + 4, c.y - 4); ctx.lineTo(c.x - 4, c.y + 4);
    ctx.stroke();
  }
  /* 木桩 */
  for (i = 0; i < nodes.length; i++) {
    var p = nodes[i];
    var grabbed = i === dragI;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.5)';
    ctx.shadowBlur = 6;
    var g = ctx.createRadialGradient(p.x - 3, p.y - 4, 2, p.x, p.y, p.r + (grabbed ? 4 : 0));
    g.addColorStop(0, grabbed ? '#ffe08a' : '#d9a45c');
    g.addColorStop(1, grabbed ? '#c8863a' : '#8b5a22');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + (grabbed ? 3 : 0), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(40,24,8,.75)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.42)';
  ctx.fillText('拖动木桩,让所有绳子互不打架', VW / 2, BY + BS + 30);
  ctx.fillStyle = msgT > 0 ? 'rgba(255,220,120,.95)' : (cross.length ? 'rgba(255,150,130,.8)' : 'rgba(150,240,170,.85)');
  ctx.fillText(msg || (cross.length ? '还有 ' + cross.length + ' 处交叉 · 剩 ' + Math.ceil(Math.max(0, timer)) + ' 秒' : '没有交叉了!'), VW / 2, BY + BS + 52);
}

function nearest(x, y) {
  var best = -1, bd = 1e9;
  for (var i = 0; i < nodes.length; i++) {
    var d = Math.hypot(nodes[i].x - x, nodes[i].y - y);
    if (d < bd) { bd = d; best = i }
  }
  return bd <= 26 ? best : -1;
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  var i = nearest(e.clientX, e.clientY);
  if (i < 0) return;
  dragI = i;
  dragOX = nodes[i].x - e.clientX;
  dragOY = nodes[i].y - e.clientY;
  tone(300, .05, 'triangle', .03);
});
cv.addEventListener('pointermove', function (e) {
  if (state !== 'play' || dragI < 0) return;
  var p = nodes[dragI];
  p.x = clamp(e.clientX + dragOX, BX + 6, BX + BS - 6);
  p.y = clamp(e.clientY + dragOY, BY + 6, BY + BS - 6);
  var before = cross.length;
  cross = crossings();
  if (cross.length < before) {
    moves++;
    tone(700, .05, 'triangle', .04);
    syncHud();
    if (cross.length === 0) {
      shake = .3;
      tone(880, .18, 'sine', .06, 1320);
      dragI = -1;
      nextLevel();
    }
  }
});
window.addEventListener('pointerup', function () { dragI = -1 });
window.addEventListener('pointercancel', function () { dragI = -1 });
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === 'h' || e.key === 'H') { e.preventDefault(); hint() }
  if (e.key === 's' || e.key === 'S') { e.preventDefault(); shakeIt() }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startGame() }
});

function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', shakeIt);
$('hintbtn').addEventListener('click', hint);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」解开了 ' + doneLv + ' 个绳结,拿下 ' + score + ' 分! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  state: function () { return state },
  level: function () { return lv },
  nodes: function () { return nodes.map(function (p) { return { x: p.x, y: p.y } }) },
  edges: function () { return edges.map(function (e) { return e.slice() }) },
  cross: function () { return cross.length },
  moves: function () { return moves },
  score: function () { return score },
  done: function () { return doneLv },
  time: function () { return timer },
  build: function (n) { buildLevel(n) },
  setTimer: function (v) { timer = v },
  dragTo: function (i, x, y) {
    if (i < 0 || i >= nodes.length) return;
    dragI = i;
    nodes[i].x = clamp(x, BX + 6, BX + BS - 6);
    nodes[i].y = clamp(y, BY + 6, BY + BS - 6);
    var before = cross.length;
    cross = crossings();
    if (cross.length < before) moves++;
    if (cross.length === 0 && state === 'play') nextLevel();
    syncHud();
    dragI = -1;
  },
  /* 把桩放回生成时的平面坐标:这是构造性保证的零交叉摆法,用来验证关卡一定可解 */
  placeSolved: function () {
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].x = BX + 8 + solPts[i].u * (BS - 16);
      nodes[i].y = BY + 8 + solPts[i].v * (BS - 16);
    }
    cross = crossings();
    syncHud();
    return cross.length;
  },
  hint: hint,
  reshuffle: shakeIt,
  step: function (n) { for (var i = 0; i < n; i++) update(1 / 60) },
  forceEnd: function () { finish(false) }
};

resize();
resetGame();
$('padbar').classList.add('hide');
updMini();
run();

})();
</script>

<script>
(function(){
try{
  function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());
  if(last!==td){var yd=ds(new Date(Date.now()-864e5));st=(last===yd)?st+1:1;ls('__lastday',td);ls('__streak',st)}

      b.style.cssText='border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;'+
        'letter-spacing:1px;cursor:pointer;background:'+bg+';color:'+fg+';box-shadow:0 4px 0 rgba(0,0,0,.3)';
      b.onclick=fn;return b;
    };
    box.appendChild(mk('\uD83D\uDCE4 晒战绩','rgba(255,255,255,.16)','#fff',function(){
      var sc='',src=over.querySelector('[id*=stat]')||over.querySelector('[id*=score]')||over;
      var m=(src.textContent||'').match(/\d+/);if(m)sc=m[0];
      var txt='我在「'+name+'」'+(sc?'拿了 '+sc+' 分':'通关啦')+
        (st>1?',连续打卡 '+st+' 天\uD83D\uDD25':'')+'!来比比? '+location.href.split('#')[0];
      if(/micromessenger/i.test(navigator.userAgent)){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
      function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制:\n'+txt)}
      function fb(){try{
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.cssText='position:absolute;left:-9999px';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}
      try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
    }));
    box.appendChild(mk('\uD83C\uDFAE 换个游戏','rgba(255,255,255,.1)','#fff',function(){
      location.href='/'}));
    box.appendChild(mk('\uD83D\uDCCA 我的战绩','rgba(255,255,255,.1)','#fff',function(){
      location.href='/stats/'}));
    over.appendChild(box);
  }
}catch(e){}
})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='untangle'});
  r.unshift({k:'untangle',n:'解绳结 · 拉直不交叉',e:'🧶'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['untangle_best','untangle_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['untangle']||0)){
            B['untangle']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
