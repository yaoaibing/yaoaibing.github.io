/* ===== 配色：只改 :root 这一组，其余 CSS 不用动 ===== */

<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='magnet_best',PLAY='magnet_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 磁轨飞车 · 换极求生 ================== */
var NAME = '磁轨飞车 · 换极求生';
var state = 'start';
var dist = 0, speed = 1, orbs = 0, lives = 3, inv = 0, shake = 0;
var pol = 1, py = 0, vy = 0, px = 0, TOP = 0, BOT = 0;
var spikes = [], balls = [], storms = [], sparks = [];
var nextAt = 0, clearT = 0, msg = '', msgT = 0, flipFx = 0, held = 0;

function layout() {
  TOP = Math.max(76, VH * .1);
  BOT = VH - (VW < 420 ? 118 : 82);
  px = Math.max(72, VW * .26);
  py = clamp(py || (TOP + BOT) / 2, TOP + 16, BOT - 16);
}
function onResize() { layout(); }

function resetGame() {
  dist = 0; speed = 1; orbs = 0; lives = 3; inv = 0; shake = 0;
  pol = 1; vy = 0;
  spikes = []; balls = []; storms = []; sparks = [];
  nextAt = 260; clearT = 0; flipFx = 0;
  msg = ''; msgT = 0;
  layout();
  py = (TOP + BOT) / 2;
  syncHud();
}
function startGame() {
  resetGame();
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}
function endGame() {
  state = 'over';
  KIT.addPlay(); KIT.streak();
  var score = Math.round(dist) + orbs * 40;
  var rec = KIT.setBest(score);
  var rank = dist >= 1500 ? '磁力车神' : dist >= 800 ? '换极老手' : dist >= 380 ? '见习司机' : '撞轨新手';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = '跑了 <b>' + Math.round(dist) + ' 米</b><br>' +
    '本局得分 <b>' + score + '</b><br>磁能球 ' + orbs + ' 颗<br>' + rank + '<br>' +
    '历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '上下都能贴住才算学会:中间悬停留给两边同时长刺的场合';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
  noise(.25, .07);
  tone(130, .35, 'sine', .06, 60);
}
function syncHud() {
  $('hdist').textContent = Math.round(dist) + 'm';
  $('horb').textContent = orbs;
  $('hlives').textContent = lives;
  $('polbtn').textContent = pol < 0 ? '🔺 吸上轨' : '🔻 吸下轨';
}
function flip() {
  if (state !== 'play') return;
  pol = -pol;
  flipFx = .25;
  tone(pol > 0 ? 520 : 340, .07, 'square', .04);
  syncHud();
}
function hit(why) {
  if (state !== 'play') return;
  if (inv > 0) return;
  lives--;
  inv = 1.3;
  shake = .35;
  msg = why; msgT = 1.3;
  sparks.length = 0;
  for (var i = 0; i < 12; i++) {
    sparks.push({ x: px, y: py, vx: (Math.random() - .5) * 260, vy: (Math.random() - .5) * 260, l: .6 });
  }
  noise(.18, .09);
  tone(200, .2, 'square', .05, 90);
  if (lives <= 0) endGame();
  syncHud();
}
function inStorm() {
  for (var i = 0; i < storms.length; i++) {
    if (px + 12 > storms[i].x && px - 12 < storms[i].x + storms[i].w) return true;
  }
  return false;
}
function spawn() {
  /* 前方 260px 一段:上下刺 + 磁能球 + 偶发磁暴 */
  var base = dist + 320;
  var roll = Math.random();
  var gap = 46 + Math.random() * 26;
  if (roll < .34) {
    spikes.push({ x: base, side: 0, w: gap, h: 26 + Math.random() * 18 });
  } else if (roll < .68) {
    spikes.push({ x: base, side: 1, w: gap, h: 26 + Math.random() * 18 });
  } else if (roll < .86) {
    spikes.push({ x: base, side: 0, w: gap * .8, h: 30 + Math.random() * 14 });
    spikes.push({ x: base + 30, side: 1, w: gap * .8, h: 30 + Math.random() * 14 });
  } else {
    storms.push({ x: base, w: 90 + Math.random() * 60 });
  }
  var n = 1 + (Math.random() < .5 ? 1 : 0);
  for (var i = 0; i < n; i++) {
    balls.push({ x: base + 60 + i * 70, y: TOP + 26 + Math.random() * (BOT - TOP - 52), r: 9 });
  }
}
function update(dt) {
  var i;
  if (msgT > 0) msgT -= dt;
  if (shake > 0) shake -= dt;
  if (inv > 0) inv -= dt;
  if (flipFx > 0) flipFx -= dt;
  for (i = sparks.length - 1; i >= 0; i--) {
    var s = sparks[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.l -= dt;
    if (s.l <= 0) sparks.splice(i, 1);
  }
  if (state !== 'play') return;
  speed = Math.min(3.1, 1 + dist / 900);
  var move = speed * dt * 190;
  dist += move * .55;
  /* 磁力:向目标轨加速,快速换极可以悬在中间 */
  var eff = pol * (inStorm() ? -1 : 1);
  vy += eff * 1250 * dt;
  vy *= (1 - Math.min(1, 2.2 * dt));
  py += vy * dt;
  if (py < TOP + 15) { py = TOP + 15; if (vy < -260) { vy = -vy * .18 } else vy = 0 }
  if (py > BOT - 15) { py = BOT - 15; if (vy > 260) { vy = -vy * .18 } else vy = 0 }
  /* 世界向左滚 */
  for (i = spikes.length - 1; i >= 0; i--) {
    var k = spikes[i];
    k.x -= move;
    if (k.x + k.w < px - 20) { spikes.splice(i, 1); continue }
    if (inv > 0) continue;
    var top = k.side === 0 ? TOP : BOT - k.h;
    var bot = k.side === 0 ? TOP + k.h : BOT;
    if (px + 13 > k.x && px - 13 < k.x + k.w && py + 13 > top && py - 13 < bot) {
      hit(k.side === 0 ? '撞上下吊刺!' : '撞上立柱刺!');
    }
  }
  for (i = balls.length - 1; i >= 0; i--) {
    var b = balls[i];
    b.x -= move;
    if (b.x < px - 24) { balls.splice(i, 1); continue }
    if (Math.abs(b.x - px) < 16 && Math.abs(b.y - py) < 18) {
      balls.splice(i, 1);
      orbs++;
      msg = '磁能球 +1'; msgT = .9;
      tone(1020, .1, 'triangle', .05);
      syncHud();
    }
  }
  for (i = storms.length - 1; i >= 0; i--) {
    storms[i].x -= move;
    if (storms[i].x + storms[i].w < px - 30) storms.splice(i, 1);
  }
  if (dist + 320 > nextAt) { spawn(); nextAt = dist + 340 + Math.random() * 130 }
  syncHud();
}

function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#080a16');
  bg.addColorStop(1, '#0d1020');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, VW, VH);
  var sh = shake > 0 ? (Math.random() - .5) * 8 : 0;
  ctx.save();
  ctx.translate(sh, sh * .5);
  /* 磁暴带 */
  for (var i = 0; i < storms.length; i++) {
    var st = storms[i];
    ctx.fillStyle = 'rgba(150,90,220,.16)';
    ctx.fillRect(st.x, TOP, st.w, BOT - TOP);
    ctx.strokeStyle = 'rgba(190,130,255,.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var y = TOP + 10; y < BOT; y += 22) {
      ctx.moveTo(st.x + 6, y);
      ctx.lineTo(st.x + st.w - 6, y + 12);
    }
    ctx.stroke();
    ctx.fillStyle = 'rgba(220,180,255,.75)';
    ctx.font = '800 12px "PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('磁暴', st.x + st.w / 2, TOP + 16);
  }
  /* 轨道 */
  var glow = flipFx > 0 ? .9 : .55;
  ctx.fillStyle = 'rgba(255,86,86,' + glow + ')';
  ctx.fillRect(0, TOP - 8, VW, 8);
  ctx.fillStyle = 'rgba(86,150,255,' + (.75 - glow * .2) + ')';
  ctx.fillRect(0, BOT, VW, 8);
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  for (var x = -(dist % 44); x < VW; x += 44) ctx.fillRect(x, TOP + 3, 20, 2);
  for (x = -(dist % 44); x < VW; x += 44) ctx.fillRect(x, BOT - 5, 20, 2);
  /* 刺 */
  for (i = 0; i < spikes.length; i++) {
    var k = spikes[i];
    var up = k.side === 1;
    var y0 = up ? BOT : TOP;
    ctx.fillStyle = up ? 'rgba(96,150,255,.85)' : 'rgba(255,96,96,.85)';
    var teeth = Math.max(1, Math.floor(k.w / 16));
    ctx.beginPath();
    for (var t = 0; t < teeth; t++) {
      var x0 = k.x + t * (k.w / teeth);
      ctx.moveTo(x0, y0);
      ctx.lineTo(x0 + k.w / teeth / 2, y0 + (up ? -k.h : k.h));
      ctx.lineTo(x0 + k.w / teeth, y0);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillRect(k.x, up ? y0 - 6 : y0, k.w, 6);
  }
  /* 磁能球 */
  for (i = 0; i < balls.length; i++) {
    var b = balls[i];
    ctx.save();
    ctx.shadowColor = 'rgba(255,214,92,.8)';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ffd75e';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  /* 磁力车:马蹄形,极性朝哪边就往哪亮 */
  ctx.save();
  ctx.globalAlpha = inv > 0 ? (Math.floor(dist / 4) % 2 ? .35 : .85) : 1;
  ctx.translate(px, py);
  var rot = pol > 0 ? 0 : Math.PI;
  ctx.rotate(rot);
  ctx.lineWidth = 9;
  ctx.strokeStyle = '#dfe6f2';
  ctx.beginPath();
  ctx.arc(0, 0, 13, Math.PI * .12, Math.PI * .88, false);
  ctx.stroke();
  ctx.strokeStyle = '#ff5a5a';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(-13, 4); ctx.lineTo(-13, 14);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(13, 4); ctx.lineTo(13, 14);
  ctx.stroke();
  ctx.restore();
  /* 火花 */
  for (i = 0; i < sparks.length; i++) {
    var s2 = sparks[i];
    ctx.fillStyle = 'rgba(255,140,120,' + Math.max(0, s2.l) + ')';
    ctx.fillRect(s2.x - 2, s2.y - 2, 4, 4);
  }
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  ctx.fillStyle = msgT > 0 ? 'rgba(255,220,120,.95)' : 'rgba(190,210,255,.5)';
  ctx.fillText(msg || '点屏幕换极:红轨吸上、蓝轨吸下', VW / 2, VH - 42);
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.font = '600 11px "PingFang SC",sans-serif';
  ctx.fillText(inStorm() ? '⚡ 磁暴中,极性反了' : (pol < 0 ? '↑ 正吸向上轨' : '↓ 正吸向下轨'), VW / 2, TOP + 22);
}

cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  held = 1;
  flip();
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); flip() }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startGame() }
});

function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}
$('startbtn').addEventListener('click', startGame);
$('againbtn').addEventListener('click', startGame);
$('newbtn').addEventListener('click', startGame);
$('polbtn').addEventListener('click', flip);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」沿磁轨飙了 ' + Math.round(dist) + ' 米,收 ' + orbs + ' 颗磁能球! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  state: function () { return state },
  dist: function () { return dist },
  orbs: function () { return orbs },
  lives: function () { return lives },
  pol: function () { return pol },
  y: function () { return py },
  flip: flip,
  setLives: function (v) { lives = v; syncHud() },
  setInv: function (v) { inv = v },
  inv: function () { return inv },
  hit: function () { hit('测试撞击') },
  spikeCount: function () { return spikes.length },
  ballCount: function () { return balls.length },
  storm: inStorm,
  step: function (n) { for (var i = 0; i < n; i++) update(1 / 60) },
  forceEnd: endGame
};

resize();
resetGame();
$('padbar').classList.add('hide');
updMini();
run();

})();
</script>

  function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  var st=+lg('__streak','0'),last=lg('__lastday',''),td=ds(new Date());

        var ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok)}catch(e){done(false)}}

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='magnet'});
  r.unshift({k:'magnet',n:'磁轨飞车 · 换极求生',e:'🧲'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['magnet_best','magnet_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['magnet']||0)){
            B['magnet']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
