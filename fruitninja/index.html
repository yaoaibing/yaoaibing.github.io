/* ===== 配色：只改 :root 这一组，其余 CSS 不用动 ===== */
:root{

.mini{margin-top:16px;font-size:12.5px;color:rgba(255,255,255,.55);line-height:1.9}

#ostats{font-size:15px;line-height:2.1;color:#eaf0ff;background:rgba(255,255,255,.06);border:1px solid var(--hair);

<script>
(function(){
'use strict';
/* ================== CORE · 公共库(全部游戏共用,勿修改) ================== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(n){return Math.floor(Math.random()*n)}
function frnd(){return Math.random()}
function pick(a){return a[rnd(a.length)]}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* --- 音频:极简合成器,零依赖 --- */
var AC=null,muted=lsGet('__mute','0')==='1';
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,vol,slide){if(muted)return;var a=actx();if(!a)return;try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted)return;var a=actx();if(!a)return;try{
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
document.addEventListener('pointerdown',function(){actx()},{passive:true});

/* --- 画布:DPR 自适应 + 智能降级 --- */
var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
var VW=0,VH=0,DPR=1,LOWEND=false;
function resize(){
  DPR=Math.min(LOWEND?1.25:2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.max(1,Math.floor(VW*DPR));cv.height=Math.max(1,Math.floor(VH*DPR));
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof onResize==='function')onResize();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* --- 存档:最高分 + 连续打卡 + 局数(跨游戏共享) --- */
var KIT=(function(){
  var BEST='fruitninja_best',PLAY='fruitninja_plays';
  function dstr(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
  function bumpStreak(){
    var today=dstr(new Date()),last=lsGet('__lastday',''),st=+lsGet('__streak','0');
    if(last===today)return st;
    var y=new Date(Date.now()-864e5);
    st=(last===dstr(y))?st+1:1;
    lsSet('__lastday',today);lsSet('__streak',st);return st;
  }
  return {
    best:function(){return +lsGet(BEST,0)},
    setBest:function(v){if(v>this.best()){lsSet(BEST,v);return true}return false},
    plays:function(){return +lsGet(PLAY,0)},
    addPlay:function(){lsSet(PLAY,this.plays()+1)},
    streak:bumpStreak,
    streakNow:function(){return +lsGet('__streak','0')}
  };
})();

/* --- 分享:复制战绩文案 --- */
function share(txt){
  var isWX=/micromessenger/i.test(navigator.userAgent);
  if(isWX){alert('点右上角「···」→ 发送给朋友\n\n'+txt);return}
  function done(ok){alert(ok?'战绩已复制,去微信粘贴给好友吧!':'复制失败,手动复制吧:\n'+txt)}
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},fb)}catch(e){fb()}
  function fb(){try{
    var t=document.createElement('textarea');t.value=txt;
    t.style.cssText='position:absolute;left:-9999px';document.body.appendChild(t);t.select();
    var ok=document.execCommand('copy');document.body.removeChild(t);done(!!ok)}catch(e){done(false)}}
}

/* --- 主循环:固定步长累加,低端机自动降帧 --- */
var raf=0,prev=0,acc=0,STEP=1000/60,slow=0;
function tick(t){
  raf=requestAnimationFrame(tick);
  if(!prev){prev=t;return}
  var dt=t-prev;prev=t;
  if(dt>200){dt=STEP;acc=0}
  if(dt>40)slow++;else if(slow>0)slow--;
  if(slow>90&&!LOWEND){LOWEND=true;resize()}
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<4){acc-=STEP;if(typeof update==='function')update(STEP/1000)}
  if(typeof draw==='function')draw();
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;prev=0}
function run(){if(!raf){prev=0;raf=requestAnimationFrame(tick)}}

/* --- 通用 UI 绑定 --- */
$('mutebtn').addEventListener('click',function(){
  muted=!muted;lsSet('__mute',muted?'1':'0');
  this.textContent=muted?'🔇':'♪';this.style.opacity=muted?.55:1;
});
$('mutebtn').textContent=muted?'🔇':'♪';
$('mutebtn').style.opacity=muted?.55:1;
$('homebtn').addEventListener('click',function(){location.href='/'});

/* --- 表情贴图:按尺寸缓存后绘制,省掉每帧重复排版(CORE 附带,可直接用) --- */
var _emCache={};
function drawEm(em,x,y,px){
  var s=Math.max(12,Math.ceil(px/8)*8),k=em+'@'+s;
  if(!_emCache[k]){
    var c=document.createElement('canvas');c.width=s;c.height=s;
    var g=c.getContext('2d');
    g.font=Math.floor(s*.86)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(em,s/2,s/2+s*.04);
    _emCache[k]=c}
  ctx.drawImage(_emCache[k],x-px/2,y-px/2,px,px)}

/* ================== GAME · 切水果 · 刀光果影 ================== */
var NAME = '切水果 · 刀光果影';
var state = 'start';
var EMO = ['🍉', '🍊', '🍎', '🍓', '🍋', '🥝', '🍍', '🍇'];
var COLORS = ['#ff5d5d', '#ffa94d', '#ff6b6b', '#ff4d88', '#ffd43b', '#8bc34a', '#ffb300', '#9c6ade'];
var fruits = [], pieces = [], parts = [], trail = [];
var lives = 3, score = 0, combo = 0, maxCombo = 0, sliced = 0, elapsed = 0, spawnT = .7;
var strokeHits = 0, strokeBest = 0, flashT = 0, overT = 0, reason = '';
var drawing = false, lastPX = 0, lastPY = 0, slashing = false;

function layout() {}
function onResize() { layout(); }

function resetGame() {
  fruits = []; pieces = []; parts = []; trail = [];
  lives = 3; score = 0; combo = 0; maxCombo = 0; sliced = 0;
  elapsed = 0; spawnT = .6; strokeHits = 0; strokeBest = 0; flashT = 0; overT = 0;
  reason = '';
  state = 'play';
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('padbar').classList.remove('hide');
  syncHud();
}

function syncHud() {
  $('hscore').textContent = score;
  $('hcombo').textContent = combo;
  $('hlife').textContent = lives;
  $('hbest').textContent = Math.max(KIT.best(), score);
}

function spawnFruit(isBomb, isStar) {
  var r = isBomb ? clamp(VW * .045, 22, 34) : isStar ? clamp(VW * .038, 17, 26) : clamp(VW * .05, 22, 36) + rnd(6);
  var x = r + 20 + Math.random() * Math.max(20, VW - r * 2 - 40);
  var vy = -(Math.min(VH * 1.35, 780) + Math.random() * 150);
  var vx = (VW / 2 - x) * .45 + (Math.random() - .5) * 140;
  fruits.push({
    x: x, y: VH + r + 10, vx: vx, vy: vy, r: r,
    bomb: !!isBomb, star: !!isStar,
    emo: isBomb ? '💣' : isStar ? '⭐' : EMO[rnd(EMO.length)],
    rot: Math.random() * 6.28, rotV: (Math.random() - .5) * 5, cut: 0
  });
}

function spawnWave() {
  var nF = 1 + (Math.random() < .45 ? 1 : 0) + (elapsed > 12 && Math.random() < .3 ? 1 : 0);
  for (var i = 0; i < nF; i++) spawnFruit(false, Math.random() < .1);
  var bombP = Math.min(.3, Math.max(0, (elapsed - 8) * .012));
  if (Math.random() < bombP) spawnFruit(true, false);
}

function burst(x, y, c, n) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * 6.28, sp = 60 + Math.random() * 280;
    parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, r: 2 + Math.random() * 4, c: c, t: .5 + Math.random() * .3 });
  }
}

function gameOver(rs) {
  if (state === 'over') return;
  state = 'over';
  reason = rs;
  fruits = [];
  KIT.addPlay(); KIT.streak();
  var rec = KIT.setBest(score);
  var rank = score >= 800 ? '🗡 水果忍者' : score >= 450 ? '🔪 手起刀落' : score >= 200 ? '🍉 熟练刀客' : '🌱 刚拿刀';
  $('onewrec').style.display = rec ? 'block' : 'none';
  $('ostats').innerHTML = (rs === 'bomb' ? '💣 切到炸弹,挑战结束<br>' : '🍃 漏掉的水果太多了<br>') +
    '得分 <b>' + score + '</b><br>切中 ' + sliced + ' 个 · 最高连击 ' + maxCombo + '<br>' +
    rank + '<br>历史最高 ' + KIT.best() + '<br>已玩 ' + KIT.plays() + ' 局';
  $('mini2').innerHTML = '不要追单果:等一捧一起飞起来,一刀横切过去连击最高';
  $('padbar').classList.add('hide');
  $('over').classList.remove('hide');
}

function segDist(x1, y1, x2, y2, px, py) {
  var dx = x2 - x1, dy = y2 - y1;
  var l2 = dx * dx + dy * dy;
  if (!l2) return Math.sqrt((px - x1) * (px - x1) + (py - y1) * (py - y1));
  var t = ((px - x1) * dx + (py - y1) * dy) / l2;
  t = clamp(t, 0, 1);
  var qx = x1 + dx * t, qy = y1 + dy * t;
  return Math.sqrt((px - qx) * (px - qx) + (py - qy) * (py - qy));
}

function sliceAt(x1, y1, x2, y2) {
  if (state !== 'play') return;
  var hits = 0, i, f;
  for (i = fruits.length - 1; i >= 0; i--) {
    f = fruits[i];
    if (f.cut) continue;
    if (segDist(x1, y1, x2, y2, f.x, f.y) > f.r * 1.05) continue;
    if (f.bomb) {
      burst(f.x, f.y, '#ff7b4d', 26);
      burst(f.x, f.y, '#ffd45c', 14);
      tone(90, .4, 'sawtooth', .09, 40);
      noise(.3, .12);
      flashT = .5;
      fruits.splice(i, 1);
      gameOver('bomb');
      return;
    }
    f.cut = 1;
    sliced++;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    var gain = f.star ? 30 : 10;
    score += gain + Math.min(20, combo * 2);
    burst(f.x, f.y, f.star ? '#ffe066' : COLORS[rnd(COLORS.length)], f.star ? 12 : 8);
    tone(f.star ? 900 : 500 + rnd(180), .07, 'triangle', .05);
    var side;
    for (side = -1; side <= 1; side += 2) {
      pieces.push({
        x: f.x, y: f.y, vx: f.vx * .4 + side * (60 + Math.random() * 60), vy: f.vy * .3 - 80,
        rot: f.rot, rotV: f.rotV + side * 2, emo: f.emo, r: f.r, side: side, t: 1.2, max: 1.2
      });
    }
    fruits.splice(i, 1);
    hits++;
    strokeHits++;
    if (strokeHits >= 3) {
      score += 5;
      burst(f.x, f.y, '#ffffff', 4);
    }
  }
  if (hits) syncHud();
}

function update(dt) {
  if (flashT > 0) flashT -= dt;
  if (state !== 'play') {
    for (var k = pieces.length - 1; k >= 0; k--) {
      var pc = pieces[k];
      pc.vy += 900 * dt; pc.x += pc.vx * dt; pc.y += pc.vy * dt; pc.rot += pc.rotV * dt; pc.t -= dt;
      if (pc.t <= 0) pieces.splice(k, 1);
    }
    for (var q = parts.length - 1; q >= 0; q--) {
      var pt = parts[q];
      pt.vy += 700 * dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.t -= dt;
      if (pt.t <= 0) parts.splice(q, 1);
    }
    return;
  }
  elapsed += dt;
  spawnT -= dt;
  if (spawnT <= 0) {
    spawnWave();
    spawnT = clamp(1.15 - elapsed * .012, .55, 1.15) + Math.random() * .35;
  }
  var i, f;
  for (i = fruits.length - 1; i >= 0; i--) {
    f = fruits[i];
    f.vy += 900 * dt;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.rot += f.rotV * dt;
    if (f.y - f.r > VH + 30 && f.vy > 0) {
      fruits.splice(i, 1);
      if (!f.bomb) {
        lives--;
        combo = 0;
        flashT = .35;
        burst(f.x, VH - 10, '#ff7b7b', 8);
        tone(160, .15, 'square', .05);
        syncHud();
        if (lives <= 0) { gameOver('miss'); return; }
      }
    }
  }
  for (i = pieces.length - 1; i >= 0; i--) {
    var p2 = pieces[i];
    p2.vy += 900 * dt; p2.x += p2.vx * dt; p2.y += p2.vy * dt; p2.rot += p2.rotV * dt; p2.t -= dt;
    if (p2.t <= 0) pieces.splice(i, 1);
  }
  for (i = parts.length - 1; i >= 0; i--) {
    var p3 = parts[i];
    p3.vy += 700 * dt; p3.x += p3.vx * dt; p3.y += p3.vy * dt; p3.t -= dt;
    if (p3.t <= 0) parts.splice(i, 1);
  }
  for (i = trail.length - 1; i >= 0; i--) {
    trail[i].t -= dt;
    if (trail[i].t <= 0) trail.splice(i, 1);
  }
}

function draw() {
  var gr = ctx.createLinearGradient(0, 0, 0, VH);
  gr.addColorStop(0, '#241a10');
  gr.addColorStop(.55, '#3a2614');
  gr.addColorStop(1, '#1a1008');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, VW, VH);
  var i;
  ctx.strokeStyle = 'rgba(255,210,140,.05)'; ctx.lineWidth = 2;
  for (i = 1; i < 8; i++) {
    ctx.beginPath();
    ctx.arc(VW * .5, VH * .72, VW * .09 * i, 0, 6.2832);
    ctx.stroke();
  }
  drawEm('🏮', VW * .1, VH * .13, 34);
  drawEm('🏮', VW * .9, VH * .13, 34);

  for (i = pieces.length - 1; i >= 0; i--) {
    var p = pieces[i];
    ctx.globalAlpha = Math.min(1, p.t / .4);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.beginPath();
    if (p.side > 0) ctx.rect(-p.r * 1.3, -p.r * 1.3, p.r * 2.6, p.r * 1.3);
    else ctx.rect(-p.r * 1.3, 0, p.r * 2.6, p.r * 1.3);
    ctx.clip();
    drawEm(p.emo, 0, 0, p.r * 2.1);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  for (i = 0; i < fruits.length; i++) {
    var f = fruits[i];
    if (f.bomb) {
      var pl = .5 + Math.sin(elapsed * 14) * .25;
      ctx.fillStyle = 'rgba(255,60,40,' + (pl * .25) + ')';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 1.7, 0, 6.2832); ctx.fill();
    } else if (f.star) {
      ctx.fillStyle = 'rgba(255,230,120,.22)';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 1.5, 0, 6.2832); ctx.fill();
    }
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    drawEm(f.emo, 0, 0, f.r * 2.1);
    ctx.restore();
  }

  for (i = 0; i < parts.length; i++) {
    var pt = parts[i];
    ctx.globalAlpha = Math.max(0, pt.t / .8);
    ctx.fillStyle = pt.c;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }

  if (trail.length > 1) {
    for (i = 1; i < trail.length; i++) {
      var a0 = trail[i - 1], a1 = trail[i];
      var al = Math.max(0, a1.t / .22);
      ctx.strokeStyle = 'rgba(255,255,255,' + (al * .85).toFixed(2) + ')';
      ctx.lineWidth = 2 + al * 7;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(a0.x, a0.y); ctx.lineTo(a1.x, a1.y); ctx.stroke();
      ctx.strokeStyle = 'rgba(120,220,255,' + (al * .35).toFixed(2) + ')';
      ctx.lineWidth = 1 + al * 3;
      ctx.stroke();
    }
  }

  if (flashT > 0) {
    ctx.fillStyle = 'rgba(255,60,60,' + (flashT * .5).toFixed(2) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.font = '600 12.5px "PingFang SC",sans-serif';
  if (state === 'play' && combo >= 2) {
    ctx.fillStyle = 'rgba(255,212,92,.9)';
    ctx.font = '900 ' + Math.round(clamp(VW * .045, 16, 24)) + 'px "PingFang SC",sans-serif';
    ctx.fillText('COMBO ×' + combo, VW / 2, VH * .22);
  }
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.font = '600 12px "PingFang SC",sans-serif';
  ctx.fillText('划屏切水果 · 别碰 💣', VW / 2, VH - 74);
}

function pointerSlice(x, y) {
  if (lastPX === null) { lastPX = x; lastPY = y; return; }
  sliceAt(lastPX, lastPY, x, y);
  lastPX = x; lastPY = y;
}

cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'play') return;
  drawing = true;
  lastPX = e.clientX; lastPY = e.clientY;
  strokeHits = 0;
  trail = [{ x: e.clientX, y: e.clientY, t: .22 }];
});
cv.addEventListener('pointermove', function (e) {
  if (!drawing || state !== 'play') return;
  e.preventDefault();
  var x = e.clientX, y = e.clientY;
  trail.push({ x: x, y: y, t: .22 });
  if (trail.length > 24) trail.shift();
  pointerSlice(x, y);
});
cv.addEventListener('pointerup', function (e) {
  e.preventDefault();
  if (!drawing) return;
  drawing = false;
  if (strokeHits > strokeBest) strokeBest = strokeHits;
  lastPX = null; lastPY = null;
  trail = [];
});
cv.addEventListener('pointercancel', function () {
  drawing = false; lastPX = null; lastPY = null; trail = [];
});
window.addEventListener('pointerup', function () {
  if (!drawing) return;
  drawing = false;
  if (strokeHits > strokeBest) strokeBest = strokeHits;
  lastPX = null; lastPY = null;
  trail = [];
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') return;
  if (e.key === ' ') { e.preventDefault(); }
});

function updMini() {
  $('mini').innerHTML = '历史最高 <b>' + KIT.best() + '</b> 分 · 已玩 <b>' + KIT.plays() + '</b> 局';
}

$('startbtn').addEventListener('click', resetGame);
$('againbtn').addEventListener('click', resetGame);
$('newbtn').addEventListener('click', resetGame);
$('sharebtn').addEventListener('click', function () {
  share('我在「' + NAME + '」切了 ' + sliced + ' 个水果,拿了 ' + score + ' 分! ' + location.href.split('#')[0]);
});
$('hubbtn').addEventListener('click', function () { location.href = '/' });

window.__T = {
  spawn: spawnFruit,
  step: function (n) { for (var i = 0; i < n; i++) update(1 / 60); },
  fruits: function () { return fruits; },
  slice: sliceAt,
  stats: function () { return { score: score, lives: lives, sliced: sliced }; }
};

resize();
updMini();
syncHud();
run();

})();
</script>

<script>
try{
  /* ① 最近玩过 */
  var R='__recent',r=[];try{r=JSON.parse(localStorage.getItem(R)||'[]')}catch(e){r=[]}
  r=r.filter(function(x){return x.k!=='fruitninja'});
  r.unshift({k:'fruitninja',n:'切水果 · 刀光果影',e:'🍉'});
  if(r.length>8)r.length=8;
  localStorage.setItem(R,JSON.stringify(r));

  /* ② 打卡日历:记录有玩过的每一天 */
  var D0=new Date(),DS=D0.getFullYear()+'-'+('0'+(D0.getMonth()+1)).slice(-2)+'-'+('0'+D0.getDate()).slice(-2);
  var days=[];try{days=JSON.parse(localStorage.getItem('__days')||'[]')}catch(e){days=[]}
  if(days.indexOf(DS)<0){days.push(DS);if(days.length>400)days=days.slice(-400);localStorage.setItem('__days',JSON.stringify(days))}

  /* ③ 游玩次数(跨游戏累计) */
  localStorage.setItem('__plays_all',String((+localStorage.getItem('__plays_all')||0)+1));

  /* ④ 战绩汇总:把本游戏自己的最高分同步进共享的 __best */
  (function(){
    function syncBest(){
      try{
        var v=0;
        ['fruitninja_best','fruitninja_hi'].forEach(function(bk){
          var x=parseFloat(localStorage.getItem(bk)||'0');
          if(!isNaN(x)&&x>v)v=x;
        });
        if(v>0){
          var s=localStorage.getItem('__best');
          var B=null;try{B=JSON.parse(s||'{}')}catch(e){B=null}
          if(!B||typeof B!=='object')B={};
          if(v>(B['fruitninja']||0)){
            B['fruitninja']=v;
            localStorage.setItem('__best',JSON.stringify(B));
          }
        }
      }catch(e){}
    }
    syncBest();
    setInterval(syncBest,3000);
    document.addEventListener('visibilitychange',function(){if(document.hidden)syncBest()});
    window.addEventListener('pagehide',syncBest);
  })();
}catch(e){}
</script>
